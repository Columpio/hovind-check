# Утверждения лекции. Формат: data/README.md.
# text заполняет scripts/fill-claim-text.py из полной расшифровки — вручную не сокращать.

- id: lecture-4-54
  start: 54.9
  end: 63.9
  text: Спасибо, что вы пришли. Моё имя Кент Ховинд. Я преподавал науку 15 лет, и теперь в последние 10 лет я путешествую и говорю о создании, эволюции и динозаврах.
  rating: neutral
  verdict: Представление лектора. Опыт преподавания сам по себе не делает доводы верными или неверными; их мы разбираем по существу ниже.
  rhetoric:
  - self-authority

- id: lecture-4-65
  start: 65.4
  end: 72.6
  text: На последних лекциях мы говорили о возрасте Земли и о том, что Библия ясно учит, что Земле нет миллиардов или миллионов лет, как говорится в учебниках.
  rating: purple
  verdict: 'Мы тоже верим, что мир сотворил Бог. Но Библия не называет возраст Земли: «6000 лет» — вывод из буквального чтения дней и родословий, а как понимать дни творения, христиане спорят со времён отцов Церкви.'
  arguments:
  - genesis-literal

- id: lecture-4-74
  start: 74.3
  end: 91.3
  text: В части второй мы говорили о динозаврах, что они всегда жили с человеком. Они не жили миллионы лет назад. Они были в Эдемском саду с Адамом и Евой, но Ной взял их с собой на ковчег, наверное, детёнышей, и он был достаточно умным, чтобы не брать самых больших. Достаточно взять детёнышей разного пола.
  rating: red
  verdict: 'Мы тоже верим, что Бог сотворил всех животных и Ной спас их от потопа. Но о динозаврах Библия молчит, а их кости лежат в слоях, где нет ни людей, ни их орудий: динозавры вымерли около 66 млн лет назад.'
  arguments:
  - dinosaurs-humans

- id: lecture-4-92
  start: 92.7
  end: 113.8
  text: После потопа динозавры вымерли по двум причинам. Первая причина — климат очень изменился после потопа. И люди больше не жили до девятисот лет. Во-вторых, люди охотились за динозаврами, и в то время они назывались драконами. Драконы упоминаются на протяжении всей истории, а также и в Библии. Люди убивали этих драконов, которых мы знаем сейчас под именем динозавр.
  rating: red
  verdict: Что драконы есть во многих преданиях, верно. Но последние динозавры (кроме птиц, их учёные считают потомками динозавров) вымерли около 66 млн лет назад, задолго до людей; ни одной кости динозавра рядом с людьми или следов охоты на них не найдено.
  arguments:
  - recent-dinosaur-extinction

- id: lecture-4-114
  start: 114.0
  end: 129.8
  text: Возможно, что некоторые до сих пор продолжают жить сегодня. 11 000 людей доказывают, что они видели лох-несское чудовище. Также замечены существа, похожие на динозавра в двухстах частях мира. И я думаю, что, возможно, несколько динозавров ещё живут сегодня.
  rating: red
  verdict: Рассказы о Лох-Несском чудовище действительно многочисленны. Но ни костей, ни тел, ни надёжных снимков нет, а самое известное фото 1934 года оказалось подделкой; число рассказов не заменяет находок.
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-4-130
  start: 130.5
  end: 166.7
  text: Но сегодня я хочу поговорить о вещах, с которыми вы, дети, сталкиваетесь в учебниках. Кто из вас ходит или ходил в государственную школу? Я провёл 14–15 лет в государственной школе и в колледже. Много хороших, богобоязненных людей в системе. Мой брат привёл меня к Господу. Он скоро пойдёт на пенсию, он преподаватель. Моя мама преподавала в школе. Очень много хороших людей в системе. Я не хочу, чтобы вы подумали, что я против этих людей. Нет. Я хочу помочь им, но в учебниках находится ложь, о которой нужно сказать детям. И этим я хочу поделиться с вами сегодня вечером.
  rating: neutral
  verdict: Вступление к теме лекции и добрые слова об учителях. Обвинение учебников здесь пока общее; конкретные примеры разбираем ниже, каждый отдельно.

- id: lecture-4-167
  start: 167.4
  end: 213.2
  text: 'Знаете, за 15 лет обучения науке и 10 лет обучения сотворению меня всегда удивляло, что два человека могут смотреть на одну вещь и приходить к противоположным выводам. Двое человек смотрят на Великий каньон. Оба смотрят на один и тот же каньон. И один человек, который верит в эволюцию, говорит: «Вау, посмотрите, что сделала река Колорадо в течение миллионов и миллионов лет». Христианин, верующий в Библию, смотрит на тот же самый каньон и говорит: «Вау! Посмотрите, что сделал потоп за 30 минут». Хмм, как сформировался этот каньон? Было ли мало воды и очень много времени? Или очень много воды и мало времени? Видите, на это есть два взгляда.'
  rating: orange
  verdict: 'Что люди по-разному толкуют одни и те же факты, верно. Но выбор «эволюционист или христианин» ложен: многие христиане-геологи видят в каньоне работу реки за миллионы лет, а за 30 минут такие слои и излучины не прорезать.'
  arguments:
  - grand-canyon-flood
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-214
  start: 214.5
  end: 316.5
  text: 'Ещё один пример. Кто-нибудь из вас фермер здесь? Кто-нибудь знает, что это такое? А что это такое? Это приспособление для рождения телёнка. Это что? Приспособление для рождения телёнка. Понимаете, иногда корове трудно родить телёнка. Один конец этого приспособления накручивают на ногу телёнка, и им вытягивают телёнка из коровы. И при большом давлении это не составляет трудности. В один день фермер принимал рождение телёнка, задние ноги которого выходили первыми. И это нехорошо. Он взял это приспособление, привязал его к задним ногам телёнка и старался его вытянуть. Городской житель остановился, чтобы посмотреть, что происходит. И тут фермер закричал: «Эй, подойди, мне нужна твоя помощь!» Бедный житель сказал: «Сэр, я ничего не знаю про телят». Фермер попросил: «Ты только помоги мне, и всё». Городской житель согласился, выпрыгнул из машины, перепрыгнул забор и помог фермеру. За всё время он не сказал ни слова. И где-то через 10 минут после этого они пошли мыться, и фермер сказал: «Я хочу вас поблагодарить за помощь». Городской житель сказал: «О, я был рад, я был рад». Фермер спросил: «Видели ли вы что-нибудь подобное?» Он ответил: «Нет, я не видел». Тогда фермер сказал: «У вас есть какие-то вопросы?» Он ответил: «Да, сэр, у меня есть один вопрос, который мучает меня уже 10 минут». Фермер спросил: «Что это за вопрос?» Городской житель сказал: «Сэр, как вы думаете, с какой скоростью бежал этот телёнок, когда он врезался в корову?» Нет, нет, нет, нет, это не то.'
  rating: neutral
  verdict: 'Анекдот о горожанине и телёнке: можно сделать неверный вывод из увиденного. Мысль справедливая, но она касается и самого лектора.'

- id: lecture-4-319
  start: 319.2
  end: 369.6
  text: 'Два человека смотрят на одну вещь, и один из них делает неправильное заключение. Знаете, Библия предупреждает во Втором Петра, главе третьей: «Прежде всего знайте, что в последние дни явятся наглые ругатели». Знаете, что есть люди, которые насмехаются над Библией? Я встречаюсь с ними регулярно, я их притягиваю как магнит. В Библии говорится, что они будут поступать по собственным своим похотям, говоря: «Где обетованное пришествие Его? Ибо с тех пор, как стали умирать отцы, от начала творения всё остаётся так же». Хмм, это очень интересно. И важная фраза: ругатели думают, что всё, что происходило сейчас, происходит всегда: медленные, постепенные процессы, миллионы и миллиарды лет. Библия говорит, что думающий так не знает, что на греческом значит «тупой по собственной воле».'
  rating: orange
  verdict: Что апостол говорит о насмешниках, которые намеренно не хотят знать о суде Божьем (2 Пет 3:5), верно. Но «тупые» — не перевод, а усиление, и речь там об отрицающих пришествие Господа, а не о геологах.
  arguments:
  - earth-age-billions
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-371
  start: 371.6
  end: 417.7
  text: 'Ругатели не хотят знать, что Бог сотворил небеса. И что небеса и земля составлены из воды и водою. Хмм, интересно. Первоначальное творение отличалось от того, что мы видим сегодня. Мы говорим об этом на видеокассете номер один. Ругатели не знают, как Бог сотворил небеса и землю, создания. А также они не знают о разрушившем Землю потопе. Потому тогдашний мир погиб, быв потоплен водою. Мир был уничтожен водою, потопом. Они не хотят поверить, что был мировой потоп, потому что это значит, что Бог может судить своё творение. И он судит, кстати, если он хочет. И он приходит разрушить мир опять. На одной машине я встретил надпись: «И Иисус приходит. И какой он злой».'
  rating: purple
  verdict: Мы тоже верим, что Бог судит мир, и принимаем рассказ о потопе. Но геологи, в том числе христиане, сомневаются во всемирном потопе из-за данных, а не из страха перед судом; о размахе потопа христиане спорят.
  arguments:
  - flood-geology-general
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-420
  start: 420.1
  end: 449.4
  text: 'Одним из ругателей был Джеймс Хаттон, который ненавидел Библию. Джеймс жил в конце XVII столетия. Он был одним из первых людей в западном мире, учивших, что Земля старше, чем все думают. В конце XVII столетия все думали, что Земле где-то около 6 000 лет. Не все были христианами, конечно. Но в то время люди были под сильным влиянием Библии. Джеймс Хаттон пришёл и сказал: «Я думаю, что Земля намного старше».'
  rating: orange
  verdict: Хаттон действительно одним из первых обосновал большой возраст Земли. Но жил он в XVIII, а не в XVII веке (1726–1797), не был атеистом и признавал Бога Творцом; а возраст Земли измерен позже, независимо от его убеждений.
  arguments:
  - earth-age-billions
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-449
  start: 449.9
  end: 482.9
  text: 'Вы должны понять политику этих времён тоже. В то время во многих странах происходили революции. Люди пытались избавиться от царя. Американская революция, французская, германская, польская — они свергали царя как форму правительства, монархию, и устанавливали демократию, народное правление. Они думали, что Библия стояла на ихнем пути, потому что Библия учит чтить царя. Поэтому они старались дискредитировать Библию, чтобы улучшить свою политику. Джеймс Хаттон пришёл и сказал: «Я думаю, что Земле миллионы лет».'
  rating: red
  verdict: 'Что XVIII век был временем революций, верно. Но связи «древняя Земля — ради свержения монархий» нет: Хаттон рассуждал о горных породах, а многие геологи того времени были священниками и монархистами.'
  rhetoric:
  - conspiracy
  - ad-hominem-pivot

- id: lecture-4-483
  start: 483.6
  end: 510.4
  text: Его книга глубоко повлияла на молодого адвоката Чарльза Лайеля. Джеймс Хаттон придумал эту идею, которую он назвал униформизм, в которой говорится, что настоящее, настоящее — ключ к прошлому. Нет, извини, Джеймс, Библия — это ключ к прошлому. Но он всё же думал, что настоящее — это ключ к прошлому. Его книга имела глубокое влияние на адвоката Лайеля из Шотландии, который тоже ненавидел Библию.
  rating: orange
  verdict: Лайель действительно был адвокатом и испытал влияние Хаттона. Но «настоящее — ключ к прошлому» — правило изучения природы, а не соперник Библии; Писание не учит, как датировать горные породы.
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-512
  start: 512.1
  end: 517.8
  text: Как-то кто-то подсчитал, что если собрать всех адвокатов и поставить их на экватор, то нам всем будет лучше.
  rating: neutral
  verdict: Шутка про адвокатов.

- id: lecture-4-522
  start: 522.0
  end: 565.7
  text: 'В 1830 году Лайель написал эту книгу «Принципы геологии», которая у меня вот здесь. В этой книге ненависть Чарльза Лайеля к Библии просачивается с каждой страницы. Этот человек не любил Библию, он называл её древней доктриной, и тех, кто основан на авторитете Писания, он называл людьми, которые перемешивают религию с философией. Он всячески старался насмехаться над Библией. Он говорит о религиозных предубеждениях. Ненависть видна на каждой странице. Он написал три тома этой книги. В одном из них он написал: «Люди высшего таланта» — написал про себя — «думают сами по себе». Потому что если вы не верите в Библию… То есть, если вы верите в Библию, вы не думаете сами по себе.'
  rating: orange
  verdict: «Принципы геологии» Лайеля действительно вышли в 1830–1833 годах, и Лайель спорил с буквальным толкованием потопа. Но его книга — о горных породах; что он думал о Библии, не делает его геологические наблюдения неверными.
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-566
  start: 566.4
  end: 590.9
  text: Верьте этому или нет, но очень много людей в этом мире думают, что если вы верите в Библию, вы глупы. Они думают, что они умные, а вы тупые, потому что вы верите в Библию. Но я вам хочу сказать, что вам не нужно быть глупым, чтобы читать Библию. Исаия 1:18. «Придите — и рассудим», — говорит Господь. Бог очень рассудительный, и верить в Создателя очень рационально. Но мы поговорим об этом немного позже.
  rating: green
  verdict: 'Верно: вера в Творца разумна, а Писание зовёт рассуждать (Ис 1:18). С этим согласны и христиане, принимающие данные геологии и биологии.'

- id: lecture-4-591
  start: 591.4
  end: 623.4
  text: Лайель сильно ненавидел Библию. В 1830 году Лайель и другие люди придумали геологическую колонну. Что они сделали? Они взяли окаменелости разных моллюсков и расположили их в порядке, в котором они и думали, что они произошли. Но колонна никогда не была проверена. Вся она основана на круговой аргументации. И всё же Чарльз Лайель придумал эту геологическую колонну. Вы когда-нибудь слышали, слышали об этой колонне? Хотя она и изменилась после Лайеля, но всё это началось в 1830-х годах.
  rating: red
  verdict: 'Шкалу слоёв не «придумал» Лайель: порядок слоёв до Дарвина выяснили Уильям Смит и другие геологи, многие — верующие. Слои лежат как стопка газет, нижняя легла раньше; а годы позже измерили по вулканическому пеплу между слоями, как по песочным часам.'
  arguments:
  - fossil-layers
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-624
  start: 624.0
  end: 668.2
  text: 'Они расположили разные слои Земли, дали им имя, возраст, индексное ископаемое. Вы помните фильм «Парк юрского периода»? Он назван в честь слоя Земли. Каждый слой имел имя, возраст и индексное ископаемое. Интересная вещь насчёт этой интересной колонны. Это Библия для эволюционистов. Это как они объясняют всю историю. И когда они собираются и разговаривают, вы можете услышать фразы, как: «О, это позднего кембрийского периода» или «раннего силурийского». Но когда христиане собираются, мы говорим: «Написано в книге Откровения». Это наше сознание, наше мировоззрение. Мировоззрение эволюционистов сосредоточено на геологической колонне.'
  rating: orange
  verdict: Что названия периодов знакомы по кино, верно. Но шкала — не «Библия эволюционистов», а сводная таблица измерений, которую постоянно уточняют; ей пользуются и нефтяники, и геологи-креационисты.
  arguments:
  - fossil-layers
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-668
  start: 668.5
  end: 705.3
  text: 'Ещё одна интересная вещь. Эта геологическая колонна может быть найдена только в одном месте в мире: в учебниках. Она не существует. Одна женщина на моём дебате сказала, что геологическая колонна была найдена в нескольких местах на Земле. Но я сказал, что то, что она имеет в виду, так это ископаемые в порядке, в котором она думает, что они произошли, были найдены в нескольких местах. Геологической колонны нет, и эксперты знают об этом. Если бы была колонна отложений… К несчастью, такой колонны нет. Геологическая колонна — это шутка. И все эволюционисты основаны на ней.'
  rating: red
  verdict: Полную колонну в одном месте действительно увидеть трудно. Но все десять главных пластов, от самых древних до самых новых, лежат стопкой в правильном порядке в Северной Дакоте (США), в Ливии и ещё в двух десятках мест мира, и геологи этого не скрывают.
  arguments:
  - fossil-layers

- id: lecture-4-706
  start: 706.4
  end: 735.1
  text: 'Её нет, но это правда, что на Земле есть разные слои. Я был на Великом каньоне, я был в 49 штатах, скоро буду в Аляске. Я был в 15 странах, на трещине Сан-Андреас. Я был там. У меня даже есть футболка. Без сомнения, на Земле есть слои. Но вопрос: как они произошли? Детей в школе учат, что каждый слой — это разный возраст Земли. Если их учат этому на протяжении пятнадцати лет, они поверят этому?'
  rating: orange
  verdict: Слои на Земле есть, и спрашивать, как они образовались, правильно. Но детей учат возрасту слоёв не долгим повторением, а потому, что он измерен; ответ на вопрос «как» дают данные, а не число лет в школе.
  arguments:
  - earth-age-billions

- id: lecture-4-735
  start: 735.9
  end: 756.0
  text: Ну, по сути дела, на это есть ещё один взгляд. С какой скоростью бежал тот телёнок? Не забывайте эту мысль. Может быть, что все эти слои образовались при потопе во дни Ноя. Если вы возьмёте бочку грязи, добавите воды, разболтаете её, и вы увидите, как образуются слои. Гидрологическая сортировка.
  rating: red
  verdict: В банке с грязью действительно образуются слои. Но в природных слоях лежат почвы, следы корней, высохшие лужи, соль испарившихся морей, норы и следы животных — то, что не могло сложиться за один бурный год.
  arguments:
  - flood-sediments
  rhetoric:
  - false-analogy

- id: lecture-4-756
  start: 756.7
  end: 783.2
  text: Они пытаются сказать мне, что эти слои разного возраста, разделённые миллионами лет. Мне очень трудно поверить в это, потому что найдено очень мало, если вообще ископаемых метеоритов в нижних слоях. Если эти камни лежали там долгое время, не думаете ли вы, что на них должно быть пару метеоритов? Также очень мало эрозии между слоями, все они один на другом, как бумага. Не думаете ли вы, что на них должна быть эрозия? Этим слоям нет миллионов лет.
  rating: red
  verdict: Метеориты падают редко и быстро разрушаются, поэтому ископаемые редки, но находятся (например, в ордовикских известняках Швеции). И следы размыва между слоями — несогласия — геологи видят повсюду, в том числе в Большом каньоне.
  arguments:
  - flood-sediments
  rhetoric:
  - argument-by-incredulity

- id: lecture-4-784
  start: 784.5
  end: 862.7
  text: 'Как-то раз я проповедовал в общественном центре в Южной Дакоте в 1991 году. Вот там, прямо в нигде. Это ещё не было конец. света, но мы его уже оттуда могли увидеть. Мы были близки. В целом городе было 40 человек, 38 из которых пришли в церковь. Я не знаю, где другие двое были, наверное, принимали телёнка. У нас было прекрасное общение, и пастор сказал: «Давайте поедем в музей, в котором есть кости динозавра». Я сказал: «Прекрасно, поехали. Я люблю динозавров». Мы все поехали в Рапид-Сити, около 50 миль. Пошли в музей, один старый человек предложил. Он сказал: «Я работаю гидом. Хотите, я проведу экскурсию?» Мы сказали: «О, да, сэр, это будет прекрасно». Первой остановкой была геологическая колонна. Громадная и вся с подсветкой. Гид сказал: «Этот слой, джентльмены, на который вы смотрите, ему 70 млн лет». Моя дочка, которой тогда было 12 лет, подняла руку и спросила: «Сэр, как вы узнаёте возраст каменного слоя? Как вы знаете, что ему 70 млн лет?» Он сказал: «О, это хороший вопрос. Мы определяем возраст слоя по ископаемым, содержащимся в этих камнях. Они называются индексными ископаемыми». Она сказала: «М, спасибо, сэр».'
  rating: orange
  verdict: 'Гид сказал правду: слои сопоставляют по руководящим ископаемым, то есть раковинам, которые встречаются только в слоях одного времени. Но Ховинд умалчивает, что порядок этих раковин проверен по тому, какой слой лежит ниже, и по датам пепла.'
  arguments:
  - fossil-layers
  rhetoric:
  - personal-story

- id: lecture-4-863
  start: 863.6
  end: 936.8
  text: 'Когда мы подошли к костям динозавра, гид сказал: «Костям, на которые вы смотрите, 100 млн лет». Моя дочка подняла руку опять и она спросила: «Сэр, как вы узнаёте возраст ископаемого?» Он сказал: «О, это хороший вопрос. Мы определяем возраст ископаемых по слоям, в которых они находятся». Она сказала: «Извините, сэр, но когда мы стояли на той стороне, вы сказали, что вы определяете возраст слоя по ископаемым. Сейчас вы говорите, что вы определяете возраст ископаемого по слою». Она сказала: «Не является ли это круговой аргументацией?» Хм, я подумал про себя, хмм, интересно. У этого человека было страннейшее выражение лица. Оно выглядело, как будто он думал. Он посмотрел на мою дочку. Потом на меня. Но я не собирался ему помогать. Я думал, я посмотрю, что дальше будет. Он снова посмотрел на мою дочку и сказал: «Ты знаешь, ты права, это круговая аргументация. Я никогда не думал об этом». Этот бедный гид проехал 50 миль в одну сторону, чтобы послушать мою проповедь. Толпа увеличилась до тридцати девяти.'
  rating: red
  verdict: 'Круга здесь нет: какой слой старше, видно по тому, что лежит ниже, а годы измеряют по вулканическому пеплу. Ископаемые лишь помогают узнать слой того же времени в другом месте; что бы ни ответил гид, это ничего не меняет.'
  arguments:
  - fossil-layers
  rhetoric:
  - personal-story

- id: lecture-4-939
  start: 939.2
  end: 970.6
  text: 'Мы даже поставили стул в проходе. После лекции этот гид разговаривал со мной около часа. Он спросил: «Мистер Ховинд, всё, чему я верю в геологии, неверно?» Я сказал: «О нет, сэр, нет. Вы выучили много хороших вещей. Мне нравится геология. Вы выучили названия всех минералов, хмм, это не шуточное дело. Есть около 1 200 минералов, и некоторые имеют вот такие длинные названия». Я сказал: «Мне нравится геология, и вы знаете много хороших вещей. Но то, что вы выучили о слоях разного возраста, — это всё чепуха».'
  rating: red
  verdict: 'Хорошо, что Ховинд признаёт: в геологии много верного. Но разный возраст слоёв — не «чепуха», а часть той же науки, проверенная теми же способами.'
  arguments:
  - fossil-layers
  rhetoric:
  - loaded-language

- id: lecture-4-973
  start: 973.0
  end: 1005.2
  text: Но он продолжает учить этому, чтобы не потерять свою работу. Сегодня вы можете узнать интересную вещь. Для некоторых людей в этом мире деньги намного важнее правды. Есть много учителей, которые не верят в эволюцию. Но продолжают учить детей эволюции, чтобы сохранить зарплату. Вы не важны. Важна зарплата. Если они учат эволюции, которая разрушает вашу веру в Библию, а ну и что? Это ваша проблема, зато мы получили зарплату. Много людей продолжают учить лжи, хотя они в неё не верят.
  rating: red
  verdict: Что ради заработка люди иногда кривят душой, бывает. Но обвинять всех учителей и геологов в сознательной лжи без единого примера несправедливо; многие из них — верующие и учат тому, что считают верным.
  arguments:
  - science-conspiracy
  rhetoric:
  - loaded-language

- id: lecture-4-1006
  start: 1006.0
  end: 1032.0
  text: Геологическая колонна — это шутка, основанная на круговой аргументации. Они сами говорят об этом. Вот учебник биологии 1994 года. На странице 306-й говорится, что камень датируется с помощью ископаемого. На следующей странице говорится, что ископаемое датируется с помощью камня. Круговая аргументация. Интеллигентный человек давно подозревает о круговой аргументации с датированием ископаемых по камню и датированием камня по ископаемым.
  rating: red
  verdict: Школьный учебник упрощает. Какой слой старше, видно по тому, что лежит ниже, а годы измеряют по вулканическому пеплу и лаве между слоями; ископаемые лишь переносят эти даты в другие места.
  arguments:
  - fossil-layers
  rhetoric:
  - textbook-authority

- id: lecture-4-1032
  start: 1032.3
  end: 1059.3
  text: Геологи даже не пытались придумать хорошего объяснения, чувствуя, что оно не стоит затраченного труда. Пока работа приносит результаты. Невозможно опровергнуть, что со строго философской точки зрения утверждение геологов основывается на круговом доказательстве. Давайте признаемся в этом. Со времён Уильяма Смита в начале XIX века ископаемые были и продолжают быть самым точным методом датирования и соотношения камней, в которых они находятся.
  rating: orange
  verdict: Такие слова о философии стратиграфии действительно писали геологи Расталл (1954) и О’Рурк (1976). Но порядок слоёв видно по тому, что лежит ниже, а возраст измеряют и по пеплу; цитаты без этого меняют смысл.
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-4-1059
  start: 1059.9
  end: 1080.7
  text: Кроме самых современных примеров, которые являются археологией, я не могу вспомнить ни одного случая с использованием распада для датирования ископаемых остатков. И если кто-то вам скажет, что они датируют ископаемые или слои камня радиоактивным распадом, они не правы. Или же они не знают, о чём они говорят. Они датируют слои ископаемыми и датируют ископаемые камнем.
  rating: red
  verdict: 'Сами окаменелости действительно редко датируют по распаду веществ. Но слои вокруг датируют: пепел и лава выше и ниже ископаемого дают «вилку» в годах, и таких дат — десятки тысяч.'
  arguments:
  - radiometric-dating
  rhetoric:
  - quote-mining

- id: lecture-4-1081
  start: 1081.3
  end: 1111.5
  text: Геолог думает, что биолог уже придумал, что доказал эволюцию. А биолог думает, что геолог уже доказал её. Каждый думает, что у кого-то другого из них есть доказательства. Вы знаете такую игру в напёрстки, где они ставят шарик под напёрсток, и вы перемешиваете, и они перемешивают напёрстки, и вы должны найти шарик. Каждое ответвление науки думает, что у другого ответвления уже есть доказательства. Это игра в напёрстки, только на этот раз без шарика. Все думают, что у кого-то другого есть доказательства.
  rating: orange
  verdict: Шутка про напёрстки смешит, но не опровергает. Свидетельства эволюции идут независимо из геологии, сравнительной анатомии, генетики и наблюдений, и каждая область имеет свои данные.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1112
  start: 1112.1
  end: 1123.3
  text: 'И это великая игра, и Сатана смеётся в то время, когда люди, веря в это, идут в ад. Эволюционист не враг. Сатана — это враг. Мы должны жалеть этих людей. Мы должны сказать: «Дьявол обманул вас. Не верьте этому».'
  rating: purple
  verdict: 'Хорошо, что Ховинд зовёт жалеть людей, а не враждовать. Но принятие научной теории не ведёт в ад: спасение — по вере во Христа, а не по взглядам на геологию; эволюцию принимают многие верующие, например генетик-христианин Фрэнсис Коллинз.'
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-1124
  start: 1124.2
  end: 1170.3
  text: 'Несколько других примеров. Радиометрическое датирование не было бы правдоподобным, если бы не было геологической колонны. Отдайте ископаемое в университет для датирования углеродом, калием, азотом или любым другим методом, которым вы хотите, то они дадут вам несколько листов, задающих много разных вопросов об образце. Вопросы как: «Где вы нашли его? Какие ископаемые были связаны с образцом? Сколько, вы думаете, лет образцу?» Вы приходите к ним за ответами, и они спрашивают вас: «Сколько лет образцу?» Я не шучу, так происходит. Палеонтологи так работать не могут. Просто не существует такого способа, чтобы посмотреть на ископаемое и определить его возраст, не зная возраста камня, на котором они находятся. Поняли?'
  rating: red
  verdict: 'Лаборатория действительно спрашивает о происхождении образца: чтобы выбрать подходящий метод и заметить загрязнение. Но результат даёт измерение изотопов, и разные методы и лаборатории сходятся независимо от ожиданий заказчика.'
  arguments:
  - radiometric-dating
  rhetoric:
  - straw-man

- id: lecture-4-1170
  start: 1170.7
  end: 1197.7
  text: 'Но возникает проблема: если мы датируем камни по ихним ископаемым, как мы можем развернуться и говорить о моделях эволюционного изменения во времени, в ископаемых остатках? Нилс Элдридж — один из лучших эволюционистов, он верит в это? Камни используются для датирования ископаемых. Но ископаемые датируют камни намного точнее. Хмм, что это такое? Стратиграфия не может избежать этой аргументации, и наука настаивает на использовании только временных принципов.'
  rating: orange
  verdict: Элдридж — действительно крупный палеонтолог, и он писал о трудностях стратиграфии. Но он не считал её порочным кругом; подборка обрывков цитат подаёт обсуждение метода как признание поражения.
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-4-1200
  start: 1200.3
  end: 1227.8
  text: Обвинение круговой аргументации может быть проигнорировано. Это не ваше дело, как мы это датируем. Оно может быть опровергнуто. Или от обвинения можно уклониться. Но всё это основано на круговой аргументации. Не подтверждает ли информация, что эволюция документируется геологией и, с другой стороны, что геология документируется эволюцией? Не является ли это круговой аргументацией? Они все знают об этом.
  rating: orange
  verdict: 'Обвинение в круговом рассуждении в литературе обсуждали, и ответ на него дан: порядок слоёв наблюдается, а возраст измеряется независимо от эволюции. «Они все знают» — домысел.'
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-4-1228
  start: 1228.3
  end: 1278.6
  text: 'Мне нравится показывать эволюционистам ихнюю геологическую колонну, которую они придумали. В геологической колонне есть слои известняка и песчаника. Э-э, слой известняка встречается в нескольких местах на протяжении всей колонны. И я говорю:«Если я вам дам кусок известняка, сможете вы мне сказать, сколько ему лет?» Они ответят: «Нет. Если на камне нет ископаемых, мы не можем знать возраст камня». Хм, это интересно. Тогда как вы узнаёте разницу между стомиллионным юрским известняком и 600-миллионным кембрийским известняком? Есть только один возможный путь определения возраста. Показательными окаменелостями. И предположение того, что эволюция произошла, и является доказательством того, что она произошла. С такими доказательствами они продержатся в суде только две секунды против начинающего студента.'
  rating: red
  verdict: Что по одному куску известняка возраст не узнать, верно. Но возраст слоя дают его место в стопке слоёв и пепел между ними; порядок ископаемых был установлен ещё до Дарвина, геологами, не принимавшими эволюцию.
  arguments:
  - fossil-layers
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1280
  start: 1280.0
  end: 1312.0
  text: Вот трилобит. В учебниках говорится, что окаменелости трилобита являются хорошими показателями ископаемых. И если трилобит, как этот, найден в камне, то значит этот камень сформировался около 500 млн лет назад. М-м, вы согласны? Я не согласен. Вот трилобит на отпечатке обуви. Кто-то наступил и раздавил трилобита. Они спрашивают геологов. Как люди могли наступить на трилобита, если трилобиты жили 500 млн лет назад? Люди появились 3 млн лет назад и начали носить обувь только 5 000 лет назад.
  rating: red
  verdict: «След Мейстера» (Юта, 1968) — не отпечаток обуви, а отслоение породы по трещине, и форма его неправильная. Большинство прежних сторонников, в том числе креационистов, от него отказались.
  arguments:
  - human-fossils

- id: lecture-4-1315
  start: 1315.7
  end: 1339.3
  text: 'Один человек сказал, что, наверное, инопланетяне посетили нашу планету 500 млн лет назад. О, да, эти инопланетяне всегда что-то наделают. Другой человек сказал: «Может быть, большой трилобит в виде обуви упал на маленького». Хм, вот да, есть большие трилобиты, но они не выглядят как обувь. Во Втором Петра находится самое лучшее объяснение. Думающие так не знают.'
  rating: orange
  verdict: Вместо настоящего объяснения геологов — отслоение по трещине — Ховинд пересказывает нелепые версии безымянных людей и смеётся над ними. Так легко выиграть спор, но не найти истину.
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1340
  start: 1340.6
  end: 1353.9
  text: Это очевидно, что трилобиты жили вместе с людьми. И некоторые могут жить даже сегодня. Глубоко в трещинах. Есть доказательства того, что они ещё живут, но они продолжают датировать камни с помощью показательных ископаемых.
  rating: red
  verdict: 'Трилобитов среди живых не находили: последние вымерли около 250 млн лет назад. «Доказательств», что они живы, нет, а следов людей рядом с ними тоже.'
  arguments:
  - human-fossils

- id: lecture-4-1354
  start: 1354.1
  end: 1407.0
  text: 'Если вы отнесёте этот камень в любой университет к главному геологу или палеонтологу и спросите: «Сэр, сколько лет этому камню?» — он скажет: «О, это легко. На камне находятся граптолиты, и они являются показательными окаменелостями для камней четырёхсотмиллионного возраста». Это ископаемое Нью-Йорка. Если в камне находятся граптолиты, камню автоматически даётся возраст 410 млн лет, до того, пока в 1993 году они нашли живых граптолитов в Южном Тихом океане. А теперь подумайте над этим. Если они до сих пор живые, они могут находиться в любом слое камня. Правда? Это значит, что всё датирование, основанное на граптолитах, — просто чепуха. Не так ли? Эти слои камня они разного возраста.'
  rating: red
  verdict: Живые родственники граптолитов, крошечных морских животных, действительно известны. Но датируют по вымершим видам граптолитов, а их в живых нет; монеты чеканят и сейчас, но монету с гербом СССР с нынешней не спутаешь.
  arguments:
  - fossil-layers
  rhetoric:
  - loaded-language

- id: lecture-4-1408
  start: 1408.2
  end: 1423.6
  text: В кости динозавра найдена кровь, но кровь разложилась бы очень давно. Это не проблема для христиан, потому что мы думаем, что большинство динозавров погибло в потопе 4 400 лет назад. И кровь могла сохраниться до нашего времени без проблем.
  rating: red
  verdict: 'В костях динозавров действительно нашли остатки белков и структуры, похожие на сосуды. Но это не свежая кровь, а крошечные обрывки белка: железо из крови сработало как формалин и не дало им разложиться, а возраст костей измерен по слоям вокруг.'
  arguments:
  - soft-tissue

- id: lecture-4-1424
  start: 1424.4
  end: 1437.7
  text: При вскрытии сланца были найдены ещё зелёные листья Монголии, которым, по идее, должно было быть 18 млн лет. А я так не думаю. Я думаю, что сланец сформировался при потопе 4 400 лет назад.
  rating: red
  verdict: Зелёные листья в сланцах Кларкии (Айдахо) действительно находили, но они быстро темнеют на воздухе. Их сохранили бескислородные условия на дне озера, а возраст слоёв — около 15 млн лет — измерен по пеплу.
  arguments:
  - fossil-graveyards

- id: lecture-4-1438
  start: 1438.3
  end: 1472.8
  text: 'Геологической колонны слои имеют разный возраст. Они говорят: 100 млн, 200, 300, 500 млн. Но послушайте, они не могут быть разного возраста. В разных частях мира найдены стоящие окаменевшие деревья, проходящие по многим слоям камня. И их находят в Германии, и в Англии, и во Франции. Это я в национальном парке стою возле такого дерева. Стоящие окаменелые деревья найдены по всему миру. Это в Новой Скотии. Сотни деревьев. Э-э, их называют полистратовыми ископаемыми. Но они хотят, чтобы вы поверили, что каждый слой — это разного возраста.'
  rating: red
  verdict: Стволы сквозь слои в Джоггинсе (Новая Шотландия) действительно есть. Но там же видны десятки ярусов почв с корнями, на которых рос лес раз за разом; это быстрое местное захоронение, а не один потоп для всех слоёв Земли.
  arguments:
  - polystrate-fossils

- id: lecture-4-1474
  start: 1474.5
  end: 1515.5
  text: 'Но остановитесь и подумайте об этом. Если все эти слои разного возраста, я вижу только два подходящих выбора. Некоторые деревья перевёрнуты и проходят через слои. Как это произошло? Мне кажется, что у эволюциониста есть только два выбора. Первый: деревья стояли в вертикальном положении миллионы лет. Не падали и не гнили, в то время, когда осадки оседали вокруг них. И второй: Деревья проросли через десятки метров твёрдого камня в поисках солнца. У вас есть другое объяснение? Я вижу ещё один выбор: с какой скоростью бежал телёнок? Все деревья были захоронены в большом потопе. Потопе во дни Ноя.'
  rating: red
  verdict: Геологи не говорят, что деревья стояли миллионы лет или проросли сквозь камень. Обычное объяснение — дерево быстро засыпало речным осадком или пеплом за годы; этот вариант Ховинд пропускает.
  arguments:
  - polystrate-fossils
  rhetoric:
  - lozhnaya-dilemma
  - straw-man

- id: lecture-4-1516
  start: 1516.9
  end: 1559.3
  text: 'Понимаете, если был потоп, деревья были захоронены в стоячем положении. Два взгляда: деревья были захоронены под многими слоями, потому что если Земля была покрыта водой… Луне всё равно, покрыта Земля водой или нет. Она всё равно создаёт приливы. Но теперь континенты не останавливают приливы, приливы стают гармоничными. И восьмидесятиметровое изменение происходило каждые 6 часов 25 минут при вращении Земли под Луной. И это поднимание и опускание воды на 80 м постоянно перемешивало и оставляло осадки на земле. Таким образом образовались сотни метров грязи после потопа, который продолжался один год. Мы рассмотрим это в шестой части семинара. Теория Ховинда.'
  rating: red
  verdict: Приливы в открытом океане высотой около метра; 80-метровые приливы — допущение без расчёта. И «перемешанные» осадки не дали бы упорядоченных слоёв с почвами, соляными толщами и следами.
  arguments:
  - flood-sediments

- id: lecture-4-1560
  start: 1560.1
  end: 1585.3
  text: Несмотря на факт, что геологическая колонна нигде не существует, люди начали верить в неё в середине XVIII столетия. Они начали изучать геологическую колонну, и она забрала их библейское мировоззрение. Масса людей поверили в униформизм. Вот что произошло. Геологическая колонна отвернула людей от библейского мировоззрения к принятию теории эволюции.
  rating: red
  verdict: Геологическая колонна существует в породах (см. выше). Поверили в древность Земли в XVIII–XIX веках не из-за колонны «из учебника», а по наблюдениям геологов, многие из которых были верующими.
  arguments:
  - fossil-layers

- id: lecture-4-1586
  start: 1586.8
  end: 1614.9
  text: 'И Чарльз Дарвин был посреди всего этого происходящего. Чарльз закончил библейский колледж в возрасте 22 лет. Он хотел стать проповедником. Но в учебниках его никогда не называют проповедником Дарвином, правда? Они всегда называют его учёным. Ну, подождите минутку. Кто решает, кого называть учёным? Эволюционисты скажут: «Если вы верите в создание, вы не учёный». Значит, все учёные верят в эволюцию. Хмм, ну и логика.'
  rating: orange
  verdict: Дарвин действительно окончил Кембридж и готовился стать священником. Но учёным его называют за 20 лет наблюдений и книги, а не за мировоззрение; среди учёных были и есть креационисты.
  rhetoric:
  - straw-man

- id: lecture-4-1615
  start: 1615.5
  end: 1640.4
  text: 'Дарвин поплыл в пятилетнее путешествие на «Бигле», собирая насекомых и птиц. И с собой в плавание он взял несколько книг для чтения. Он взял свою Библию и книгу Лайеля о геологической колонне. Книгу, которая изменила его жизнь навсегда. Позже он сказал: «Недоверие закрадывалось очень медленно. Я не чувствовал ничего плохого». Он медленно потерял доверие к Библии.'
  rating: orange
  verdict: 'Дарвин действительно взял на «Бигль» первый том «Принципов геологии» Лайеля, и вера его ослабевала постепенно. Но книга — о геологических процессах, а в автобиографии Дарвин называет другие причины: сомнения в чудесах, учение о вечных муках неверующих и страдания в мире.'
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-1640
  start: 1640.8
  end: 1668.8
  text: 'Когда он путешествовал вокруг мира, он посетил Галапагосские острова, вот здесь. Он заметил, что на каждом острове были разные виды зябликов. Он насчитал 14 разновидностей зябликов, основанных на форме их клюва. Он внимательно изучал зябликов. Охарактеризовал их и сказал: «Вы знаете? Я думаю, что все они произошли от одного предка». М-м. Ты прав, Чарли. Я спорю, что это была птица.'
  rating: orange
  verdict: 'Что все вьюрки происходят от общего предка, Ховинд признаёт, и это верно. Но шутка «всё равно птица» обходит главное: виды расходятся постепенно, и в другой рамке такие же шаги дают новые группы.'
  arguments:
  - microevolution-macro
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1670
  start: 1670.7
  end: 1701.7
  text: 'И тогда Чарли заключил в своей книге. Книга вот здесь. Э-э, в своей книге, на странице 170-й он сказал: «Это по-настоящему удивительный факт, что все звери и все растения на протяжении всего времени и пространства должны быть родственными между собою». Подожди, Чарли. Ты имеешь в виду, что птицы и бананы родственны? Да не это ли он говорит? Это то, что я читаю, я не хочу говорить за него, но мне кажется, что он говорит, что птицы и бананы родственны.'
  rating: orange
  verdict: Мы верим, что всё живое создал один Творец, и что человек — образ Божий. Дарвин же писал о родстве всего живого, и генетика нашла у людей и растений общие гены, один и тот же «язык» ДНК. Шутка «птицы и бананы» этого не опровергает.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1702
  start: 1702.9
  end: 1727.3
  text: Здесь вся проблема. Если вы будете обсуждать эволюцию, вы должны делать то, что я вам скажу. Если вы хотите выиграть аргумент в первые пять минут, вы выиграете его. Наблюдение тяжла. Это то, что мы часто называем микроэволюцией. Понимаете, при разговоре об эволюции, если вы сразу же не определите значение слова «эволюция», то вы будете говорить о разных вещах и никогда не поймёте друг друга.
  rating: neutral
  verdict: Совет начинать спор с определения слова «эволюция». Совет хороший; как Ховинд определяет её сам, разбираем ниже.

- id: lecture-4-1728
  start: 1728.7
  end: 1759.3
  text: Микроэволюцию можно наблюдать. Она научная, это факт. И она также библейская. Это говорит нам, что собаки производят разновидность собак. И, наверное, у всех собак в мире был общий предок — собака. И розы производят разновидность роз. Это факт, это происходит, за этим можно проследить. Фермеры сводят разных домашних животных и получают специальную породу для определённого назначения. Но они всё равно получают тот же самый род.
  rating: orange
  verdict: 'Что изменения внутри «рода» наблюдаются и не противоречат Библии, верно. Но граница «рода» в природе не проведена: и Ховинд, и биологи не могут сказать, где она, а изменения накапливаются дальше.'
  arguments:
  - microevolution-macro

- id: lecture-4-1760
  start: 1760.2
  end: 1784.1
  text: Они показывают детям разные доказательства макроэволюции. Как маленькую большую собаку, две собаки. Один род животного. И они стараются, чтобы дети поверили, что это доказывает макроэволюцию. Ну, подождите минуточку. У микроэволюции есть доказательства, но лучше даже не называть это микроэволюцией. Мне не нравится это слово. Вы можете назвать это разновидностью или разнообразием.
  rating: orange
  verdict: 'Породы собак в учебниках — пример того, как отбор меняет организмы, а не «доказательство макроэволюции». Для больших изменений приводят другие данные: ископаемые, генетику, распространение видов.'
  arguments:
  - microevolution-macro
  rhetoric:
  - straw-man

- id: lecture-4-1785
  start: 1785.4
  end: 1798.6
  text: 'Трёхлетний ребёнок может определить одинаковый род животного. Давайте возьмём собаку, койота, волка и банан. И спросим трёхлетнего ребёнка: «Что не похоже на остальных?» Правда?'
  rating: orange
  verdict: 'Ребёнок действительно отличит банан от собаки. Но «на глаз» нельзя определить родство: ребёнок решит, что дельфин ближе к акуле, чем к корове.'
  arguments:
  - microevolution-macro
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-1800
  start: 1800.6
  end: 1808.0
  text: Собака, волк и койот, наверное, имели общего предка. Животное, похожее на собаку. Это микроэволюция.
  rating: green
  verdict: 'Верно: собака, волк и койот имеют общего предка. Это признание общего происхождения — того же, что биология применяет и к большим группам.'
  arguments:
  - microevolution-macro

- id: lecture-4-1808
  start: 1808.5
  end: 1835.5
  text: 'В Библии написано, что животные, деревья, фрукты и трава произведут по роду их. Не используйте слово «вид» в дискуссии эволюции. Вы можете просмотреть мой дебат номер восемь, где профессор пытался и пытался, чтобы я определил значение слова «вид». Или роды. Я сказал: «Скажите, что такое вид?» Понимаете, они пытаются использовать наши налоги, чтобы учить наших детей своей религии. Библия говорит: «Производящие по роду их». Не по виду их.'
  rating: orange
  verdict: Что библейское «по роду их» не совпадает с научным «видом», верно. Но тогда и «род» надо определить; а если его не определить, граница «микро — макро» остаётся неуловимой.
  arguments:
  - microevolution-macro
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-1836
  start: 1836.2
  end: 1854.6
  text: В школе они показывают детям примеры микроэволюции, которые являются фактом, и пытаются заставить их поверить с большой буквы, поверить в макроэволюцию, которая учит, что у собаки и розы был общий предок очень давно во времени. И этим предком был… камень.
  rating: red
  verdict: Биология не учит, что жизнь произошла от камня. Она говорит, что у собаки и розы был далёкий общий предок — крошечное живое существо из одной клетки. А как появилась самая первая жизнь, — отдельный вопрос, теория эволюции его не решает.
  arguments:
  - microevolution-macro
  rhetoric:
  - straw-man

- id: lecture-4-1857
  start: 1857.3
  end: 1897.3
  text: 'Э-э, когда я проповедовал в университете, я сказал, что эволюционисты верят, что всё произошло от камня. Одна женщина разозлилась на меня и сказала: «Мы не верим в это». Тогда я сказал: «Вы верите в эволюцию?» Она сказала: «Да, конечно». Я сказал: «Я хочу задать вам вопрос: откуда мы появились?» Она ответила: «Мы произошли из макромолекулы». Я спросил, откуда появилась молекула? Она сказала: «Молекула появилась из добиотической смеси в океанах». Я спросил, откуда появились океаны? Она сказала: «Миллионы лет на камне шёл дождь». А-а, до неё дошло. «Кажется, я верю, что мы произошли из камня». Ну, я сказал: «Да, мэм, вы верите».'
  rating: red
  verdict: Собеседница честно сказала, что жизнь, по одной из гипотез, возникла из молекул в древнем океане. Ховинд превращает это в «мы от камня», смешивая происхождение жизни, геологию и эволюцию, а это разные вопросы.
  arguments:
  - origin-of-life
  rhetoric:
  - personal-story
  - straw-man

- id: lecture-4-1899
  start: 1899.0
  end: 1918.3
  text: Мне всё равно, верите вы в это или нет. Вы можете верить во всё, что вам угодно, но не называйте это наукой. И не говорите мне, что я должен платить за то, чтобы вы учили этому детей. Это не наука. Эволюция… Когда я использую слово «эволюция», я имею в виду макроэволюцию. Это фантазия, основанная на воображении, которой вообще нет никакого доказательства.
  rating: red
  verdict: 'Верить или не верить — право каждого, тут Ховинд прав. Но у происхождения больших групп от общих предков много проверяемых доказательств: ископаемые, генетика, распространение видов; называть это «фантазией» — не опровержение.'
  arguments:
  - microevolution-macro
  rhetoric:
  - loaded-language

- id: lecture-4-1918
  start: 1918.6
  end: 1953.5
  text: 'Они дают детям примеры микроэволюции и хотят, чтобы они поверили в макроэволюцию. Это большой прыжок. В рекламах это называется приманка с переходом. И это нелегально. Если я поставлю в газету такое объявление: «Новый Mercedes-Benz, десять долларов», то люди будут приходить толпами ко мне в офис. Но я скажу: «Извините, я только что его продал. Но я вам могу показать такой же самый за $35 000». Приманка с переходом, правда? Это незаконно. Вы заманиваете их чем-то одним и показываете им совершенно другое.'
  rating: orange
  verdict: 'Уловка «приманка и подмена» в рекламе действительно запрещена. Но учебник не прячет «машину за 35 000»: малые изменения и большие — один и тот же процесс на разных сроках, и учебник объясняет, какие ещё данные это подтверждают.'
  arguments:
  - microevolution-macro
  rhetoric:
  - false-analogy

- id: lecture-4-1953
  start: 1953.8
  end: 1990.0
  text: 'Именно это и происходит в наших учебниках. Они заманивают наших детей поверить в эволюцию, давая им объяснение как «происхождение с изменениями» и говоря: «Дети, правда, вы отличаетесь от ваших родителей или прародителей?» Дети думают: «Да-да». Они хотят, чтобы дети поверили в эволюцию. Они заманили их одним значением слова. И тогда в учебниках они переходят к включению разных вещей, как макроэволюция. Космическая эволюция. Приманка с переходом — это незаконно, кто-то должен пойти за это в тюрьму. При так называемом обучении детей вкрадывается настоящее значение слова.'
  rating: red
  verdict: Слово «эволюция» действительно многозначно. Но «происхождение с изменениями» — и есть научное определение эволюции, а не приманка; обвинять составителей учебников в преступлении без доказательств несправедливо.
  arguments:
  - microevolution-macro
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-1990
  start: 1990.8
  end: 2018.5
  text: 'Я родом с Иллинойса, кукурузного штата. Там столько кукурузы, что им приходится использовать номера. По дороге вы можете увидеть такой знак: «Пожалуйста, не смешивайте такую-то кукурузу с такой-то». Но я вам могу сказать одно. Вы можете смешивать кукурузы, сколько вы захотите, но вы всегда получите кукурузу. Вместо кукурузы никогда не вырастет хомяк, помидор или кит. Этого просто не случится. Всё, что вы получите, — это кукурузу.'
  rating: orange
  verdict: Что сорта кукурузы дают кукурузу, верно, и теория эволюции не ждёт из кукурузы хомяка. Но сама кукуруза за несколько тысяч лет выведена из дикой травки с горсткой мелких твёрдых зёрнышек, совсем не похожей на початок.
  arguments:
  - microevolution-macro
  rhetoric:
  - straw-man

- id: lecture-4-2019
  start: 2019.5
  end: 2043.1
  text: Разновидность случается. Есть много разновидностей собак, и у них, наверное, был общий предок. Собака. Это не эволюция, это разновидность. Есть разновидности коров, и у них, наверное, был общий предок тоже. Корова. Разновидность случается, но у неё есть границы. Этого эволюционист или не понимает, или не хочет признаться. У вариаций есть границы.
  rating: red
  verdict: Что породы собак и коров происходят от общих предков, верно. Но «границу вариаций» никто не нашёл и не описал; ископаемые и генетика показывают, как изменения накапливаются и за пределами «рода».
  arguments:
  - microevolution-macro

- id: lecture-4-2044
  start: 2044.1
  end: 2071.4
  text: 'Фермеры стараются вырастить больших свиней, не так ли? Они всегда стараются вырастить чем побольше размером. Вы думаете, они вырастят свинью размером как Украина? А нет. Я спорю, что этому есть где-то граница, правда? Они скажут: «Брат Ховинд, тараканы привыкают к яду». Да, они привыкают. Но я спорю, что и этому есть граница. И они никогда не привыкнут к кувалде. Правда?'
  rating: orange
  verdict: Что у селекции есть пределы за короткий срок, верно. Но предел размера свиньи задают законы физиологии, а не невозможность новых признаков; и устойчивость тараканов к ядам — как раз пример того, как отбор создаёт новое качество.
  arguments:
  - microevolution-macro
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-2072
  start: 2072.1
  end: 2109.9
  text: 'Во-вторых, они не хотят понять или признаться, что эти происходящие вариации производят тот же вид животного. Это не эволюция, это вариация, друзья. Но они скажут: «Это макроэволюция». Понимаете, это и есть проблема. Они путают детей этими двумя разными значениями. Слово «эволюция» должно быть разделено раз и навсегда на «макро» и «микро». И они никогда не должны встретиться. Между ними нет ничего общего. И миллионы лет микро не относятся к макро. Вы можете думать… Вы можете надеяться, вы можете верить, что они относят друг к другу. Но это ничего не изменяет. Макроэволюции нет никакого доказательства.'
  rating: red
  verdict: Разделить эволюцию на «микро» и «макро» биологи могут, но это один процесс на разных сроках, как шаги и путь. Объявить, что миллионы шагов не складываются в путь, — не довод, а запрет.
  arguments:
  - microevolution-macro
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-2111
  start: 2111.1
  end: 2136.3
  text: Информация для вариации уже присутствовала в генах. Вы можете получить разновидность собаки или коровы. Но генетическая информация должна уже присутствовать. Вы не можете научить свинью летать. У них нет генов для производства крыльев. Вы можете получить большую свинью или маленькую свинью, и это всё. Это разновидность свиньи. Вариации случаются, но гены новой разновидности более ограничены.
  rating: red
  verdict: 'Что свинья не научится летать, верно. Но новая наследственная информация появляется: ген удваивается, и копия меняется. Так в долгом опыте обычные бактерии научились есть соль лимонной кислоты, которую раньше есть не могли.'
  arguments:
  - mutations-harmful

- id: lecture-4-2136
  start: 2136.4
  end: 2163.0
  text: Вы знаете, что они потратили много лет, смешивая собак и сохраняя самых маленьких щенков? Самых маленьких. Пока они не получили чихуахуа, карманную собаку. Много-много лет смешивания собак в конце концов произвели стопроцентно бесполезную собаку. Подумайте об этом. Что? Какой это вид? Как вы его назовёте? Близко к бесполезному. Правда?
  rating: neutral
  verdict: Шутка о чихуахуа как «бесполезной» собаке; на довод не влияет.

- id: lecture-4-2165
  start: 2165.2
  end: 2211.7
  text: Большинство разновидностей собак были кем-то выращены для какой-то цели. Э-э, например, сидеть на коленях или охранять дом. Это вариации. Они случаются, большинство из которых специально выбраны человеком. Это неестественный отбор, это искусственный отбор. И большинство не выживет в дикой среде. Отпустите всех в мире карманных собак в дикий лес. Они подбегут к волку. Ляп-ляп-ляп-ляп-ляп. Усь. Видите, вариации случаются, но генетическая информация потеряна. Она не прибавлена. И когда вы смотрите на эту маленькую собаку, вы увидите, что генетическая информация была потеряна. Ничего не было прибавлено.
  rating: orange
  verdict: Что породы собак выведены человеком и в дикой природе многие не выжили бы, верно. Но потеря признаков у пород не доказывает, что информация в природе только теряется; бывают и мутации, которые её прибавляют.
  arguments:
  - mutations-harmful

- id: lecture-4-2212
  start: 2212.4
  end: 2239.6
  text: В 1795 году вышла книга Джеймса Хаттона, в которой он начал говорить людям, что Земле миллионы лет. И этим он как бы забрал шеститысячный возраст Земли. Это открыло дверь для появления Чарльза Лайеля, опровергшего потоп с помощью «Принципов геологии». И люди, и люди начали смотреть на слои камня и думать, что они разного возраста, разделённые миллионами лет. Лайель опроверг потоп.
  rating: orange
  verdict: 'Даты верны: книга Хаттона вышла в 1795 году, Лайеля — в 1830-х. Но всемирный потоп как причину всех слоёв первыми отвергли верующие геологи, например священник Адам Седжвик, по наблюдениям, а не из желания «забрать» Библию.'
  arguments:
  - earth-age-billions
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-2241
  start: 2241.6
  end: 2257.3
  text: В 1859 году появился Дарвин со своей книгой и уничтожил веру в Создателя. И к середине XVIII столетия мир остался без Библии. Общество начало рушиться во многих слоях.
  rating: red
  verdict: 'Книга Дарвина действительно вышла в 1859 году. Но веру в Создателя она не уничтожила: священник Чарльз Кингсли сразу написал Дарвину, что Бог, создавший способные к развитию формы, не менее велик, и многие христиане приняли эволюцию с верой в Творца.'
  arguments:
  - evolution-destroys-faith

- id: lecture-4-2257
  start: 2257.5
  end: 2273.7
  text: О чём мы говорим на кассете номер пять? О том, как теория эволюции середины XVIII столетия повлияла на подъём коммунизма, нацизма, социализма, марксизма и нового мирового порядка, грядущего в ваш город. Мы поговорим об этом на видеокассете номер пять.
  rating: red
  verdict: Что нацисты и социал-дарвинисты прикрывались словами о «борьбе за существование», правда. Но коммунизм и нацизм выросли из многих причин, ненависть к евреям старше Дарвина на века, а злоупотребление теорией не делает её ложной.
  arguments:
  - darwin-hitler
  rhetoric:
  - conspiracy

- id: lecture-4-2274
  start: 2274.4
  end: 2291.0
  text: Эта геологическая колонна и была началом всех ложных учений. Идея, что Земле миллионы лет, униформизм и эволюция находятся в учебниках в вашем городе. Этому будут учить детей завтра. Повсюду.
  rating: orange
  verdict: Назвать геологическую шкалу «началом всех ложных учений» — оценка, а не довод. Шкала описывает порядок и возраст слоёв и ничему не учит о вере.
  arguments:
  - earth-age-billions
  rhetoric:
  - loaded-language

- id: lecture-4-2291
  start: 2291.4
  end: 2304.9
  text: Я собираю учебники, у меня есть сотни учебников многих стран и многих лет. В учебниках есть много хорошей науки. Но в них есть яд. Я боюсь, что детей больше не образовывают, их индоктринируют.
  rating: orange
  verdict: 'Хорошо, что Ховинд признаёт: в учебниках много хорошей науки. Но слова «яд» и «индоктринация» сами ничего не доказывают; конкретные примеры, которые он приводит, разобраны отдельно.'
  rhetoric:
  - loaded-language

- id: lecture-4-2305
  start: 2305.7
  end: 2335.1
  text: Учебники — это не книги о науке. Потому что если бы это была настоящая наука, Учебникам были бы представлены все варианты с возможностью выбора самого рассудительного. Сотворение мира исключено. Потому что эволюционисты знают, что если дети будут изучать сотворение и эволюцию вместе, 99% детей отвергнут эволюцию. Поэтому они не хотят представлять теории вместе. Потому что тогда никто не поверит в эволюцию. Видите, все хотят учить тому, чему они верят сами.
  rating: red
  verdict: Вера в Бога-Творца не предмет школьной биологии, как и химии, а «научный креационизм» не входит в неё не из страха, а потому, что это не научная теория; в 1987 году Верховный суд США признал, что закон о «научном креационизме» продвигал религиозное учение. Цифра «99% детей» ничем не подтверждена.
  arguments:
  - science-conspiracy
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-2336
  start: 2336.5
  end: 2352.0
  text: Я хочу, чтобы вы верили, чему я верю. Я стараюсь изменить ваше мышление, если вы эволюционист, я хочу, чтобы вы поверили Библии. Я представляю доказательства, которые предоставляют моё дело. Потому что я думаю, что я прав. Не потому, что я прав, но потому, что Библия права. Бог сотворил мир.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил мир, и честно говорим о своих убеждениях. Но верить Библии и верить одному её толкованию — не одно и то же; многие христиане, например генетик Фрэнсис Коллинз, верят Библии и принимают эволюцию.
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-2352
  start: 2352.5
  end: 2367.7
  text: Эволюционисты стараются, чтобы дети поверили, во что они верят. Но они дают детям ложную информацию, они обманывают их. Этот учебник 99-го года Университета Западной Флориды, который содержит много вещей, опровергнутых 120 лет назад.
  rating: red
  verdict: В учебниках бывают устаревшие примеры, их критикуют и сами биологи. Но устаревший пример — ошибка, а не обман; называть авторов обманщиками без доказательств их умысла несправедливо.
  arguments:
  - science-conspiracy
  rhetoric:
  - loaded-language

- id: lecture-4-2369
  start: 2369.8
  end: 2399.8
  text: 'Но они хотят, чтобы дети поверили в ихнюю теорию. И они должны представить какое-то доказательство. Вот этот типичный учебник с целой главой об эволюции. Иногда детям приходится учить целые книги по этой теме. Здесь говорится: «Ребята, у нас есть много доказательств эволюции из разных сфер науки». Что они им покажут? Они им скажут, что эволюция происходит из-за мутаций, которые производят новый вид, и естественный отбор помогает ему выжить и захватить население. Ничего подобного никогда не наблюдалось. Всё это воображение.'
  rating: red
  verdict: 'Появление новых видов наблюдали: у растений новый вид бывает за одно поколение, когда наследственный набор в клетках удваивается, а у рыб и насекомых — за десятки лет; это описано в научной литературе.'
  arguments:
  - microevolution-macro

- id: lecture-4-2400
  start: 2400.9
  end: 2414.0
  text: Мутации случаются, естественный отбор случается. Но они не совершают эволюцию, как они думают. В этом учебнике детям говорится, что розы произошли от различных мутаций. Наверное, правда. И это всё равно роза.
  rating: orange
  verdict: Что мутации и отбор действительно происходят, Ховинд признаёт, и это верно. Но «роза остаётся розой» за век селекции не значит, что так будет и за миллионы лет.
  arguments:
  - mutations-harmful

- id: lecture-4-2414
  start: 2414.8
  end: 2436.7
  text: Эти мутации случаются. Вот бык с пятью ногами. Пятая нога растёт со спины. Он не может бежать быстрее. Я хочу, чтобы вы заметили, что у быка выросла нога. А не крыло, перо или клюв? Мутация не может добавить новую информацию. Она может взять существующую информацию и перемешать её. Это не помогает.
  rating: red
  verdict: Уродливые мутации действительно бывают, и бык с пятой ногой — один из них. Но выбрать худший пример — не значит доказать, что полезных мутаций нет; их известно много, от устойчивости к болезням до переваривания молока у взрослых людей.
  arguments:
  - mutations-harmful
  rhetoric:
  - cherry-picking

- id: lecture-4-2437
  start: 2437.1
  end: 2464.4
  text: 'Вот коротконогая овца. В этом учебнике говорится: «Эта мутация не выживет в природе». Конечно, нет, она будет первой овцой, которую схватит волк. «Убегайте, идёт волк». У-о-п! О, она не успела. Вот двуглавая черепаха. Это мутант, это не ниндзя. Видите? Мутации происходят, но они вредные, фатальные или нейтральные.'
  rating: red
  verdict: 'Что большинство заметных мутаций вредны или нейтральны, верно. Но полезные тоже известны: устойчивость к малярии, к ВИЧ, способность взрослых пить молоко; отбор сохраняет как раз их.'
  arguments:
  - mutations-harmful
  rhetoric:
  - cherry-picking

- id: lecture-4-2466
  start: 2466.8
  end: 2479.8
  text: Если бы вы получили выгодную мутацию, чего не было доказано, с кем бы она сроднилась? А? Вам нужно получить две мутации в одно и то же время в одном и том же месте. Знаете, это большой мир.
  rating: red
  verdict: 'Двух одинаковых мутаций в одно время не нужно: носитель полезной мутации передаёт её половине детей, и если она помогает выжить, за поколения она распространяется. Это обычная популяционная генетика.'
  arguments:
  - mutations-harmful
  rhetoric:
  - straw-man

- id: lecture-4-2480
  start: 2480.9
  end: 2508.0
  text: Понимаете, мутация — это перемешивание уже присутствующей информации. Это как взять буквы слова «машина», перемешать их и составить разные слова из этого слова. Но вы никогда не получите море, зебра или доллар из этих букв. Информация недоступна. И перемешивание существующего кода ДНК не составит ничего нового. Мутации ничуть не помогают теории эволюции. Ну, это всё, что у них есть. Я говорю вам, это не поможет, друзья.
  rating: red
  verdict: Мутации — не только перестановка «букв». Бывают вставки, замены и удвоения целых генов, после которых копия может приобрести новую работу; так новая информация и прибавляется.
  arguments:
  - mutations-harmful
  rhetoric:
  - false-analogy

- id: lecture-4-2509
  start: 2509.1
  end: 2534.5
  text: И тогда они думают, что естественный отбор поможет. В этом учебнике говорится, что естественный отбор является причиной эволюции. Неправда. В этом нет ничего плохого. Естественный отбор происходит. Креационисты подумали об этом первыми. Естественный отбор происходит, но он не может создать ничего нового. Он точно не может наделить вас новыми качествами или новой информацией. Он только выбирает из существующих разновидностей и определяет, какая из них выживет.
  rating: orange
  verdict: Что естественный отбор происходит и сам по себе не создаёт мутаций, верно, и до Дарвина о нём писал креационист Эдвард Блит. Но отбор вместе с мутациями накапливает полезные изменения, а не только отбраковывает.
  arguments:
  - natural-selection-only-removes

- id: lecture-4-2534
  start: 2534.9
  end: 2586.0
  text: Если бы у вас был завод по производству машин, Обычно на заводе была бы секция контроля качества. Люди контролировали бы качество, отбирали брак и уничтожали бы его. И если бы у вас была секция контроля качества, которая бы замечала каждую ошибку, ничего бы не оставалось незамеченным. Вы производите совершенные машины. Это было бы неплохо, не так ли? Сколько времени понадобится, чтобы изменить автомобиль на самолёт? Ну, а вы скажете, что система никогда не изменит машину на самолёт? Это и моя идея. Видите, естественный отбор не создаёт ничего нового. Он не может изменить продукт во что-то другое. Он только сохраняет этот продукт в хорошем состоянии. Естественный отбор не имеет никакого значения для эволюциониста. Он происходит, но он ничего не объясняет. Насчёт эволюции. Он бесполезен.
  rating: red
  verdict: Контроль качества на заводе не меняет машину, потому что машины не размножаются и не мутируют. Живые существа размножаются с изменениями, и отбор шаг за шагом сохраняет удачные из них; аналогия упускает главное.
  arguments:
  - natural-selection-only-removes
  rhetoric:
  - false-analogy

- id: lecture-4-2586
  start: 2586.2
  end: 2610.1
  text: Выживание сильнейшего происходит, но оно не объясняет появление сильнейшего. Кстати, выживание сильнейшего — это тавтология. Фраза, которая не значит ничего. Почему вы выжили? Потому что Вы сильнейший? вы сильнейший. А-а, потому что они выжили. Видите, к чему это приводит? Ни к чему.
  rating: red
  verdict: 'Что сам отбор не создаёт новых признаков, верно: их дают мутации. Но «выживание приспособленных» — не тавтология: приспособленность измеряют заранее (скорость, окраска, устойчивость к яду) и потом проверяют, кто оставил больше потомства.'
  arguments:
  - natural-selection-only-removes
  rhetoric:
  - straw-man

- id: lecture-4-2610
  start: 2610.8
  end: 2622.0
  text: И это не всегда выживание сильнейшего. Если кит съедает 80% рыбы, Это не выживание сильнейшего. Вообще-то, это выживание счастливейшего. Это ближе к реальности.
  rating: orange
  verdict: 'Что иногда выживает просто счастливец, верно: биологи называют это дрейфом генов. Но удача не отменяет отбора: на большом числе поколений те, кто лучше приспособлен, всё равно чаще оставляют потомство.'
  arguments:
  - natural-selection-only-removes

- id: lecture-4-2623
  start: 2623.3
  end: 2714.8
  text: 'Меня удивляет, как некоторые люди проводят полезные наблюдения. Но всё равно приходят к неправильным выводам. Вот вам пример. Как-то раз несколько блестящих учёных собрались вместе и захотели узнать, как далеко прыгает лягушка при отрезании лапок. Они поставили лягушку на землю и сказали: «Прыгай, лягушка». Лягушка прыгнула 80 см. Тогда они отрезали одну лапу и сказали: «Прыгай, лягушка, прыгай». Лягушка прыгнула только 70 см. Они отрезали ещё одну лапку. «Прыгай, лягушка». Лягушка прыгнула 60 см. Отрезали ещё одну лапку. «Прыгай, лягушка». Лягушка с одной лапкой прыгнула 50 см. Они отрезали последнюю лапку и сказали: «Прыгай». Вы знаете, основываясь на наблюдениях, они ожидали, что лягушка прыгнет 40 см. Э-э, ну вообще-то, она не прыгнула. Они закричали громче. «Прыгай, лягушка». Лягушка даже не сдвинулась. Они кричали: «Прыгай!» Она не двинулась. Они собрали информацию, проанализировали её и сказали: «Товарищи, мы пришли к нескольким выводам». Лягушка прыгала короче при отрезании лапок. Хорошее наблюдение. Однако они заключили, основываясь на эксперименте, что лягушка без лапок глохнет. Нет, нет. Нет, нет, не так. Вы не так это понимаете. Полезное наблюдение, неправильный вывод.'
  rating: neutral
  verdict: 'Анекдот о лягушке: верное наблюдение можно испортить неверным выводом. Мысль справедлива, и проверять её стоит в обе стороны.'

- id: lecture-4-2716
  start: 2716.6
  end: 2726.1
  text: Гайки от Форда подойдут к Шевролету. Это хорошее наблюдение. Это доказывает, что они произошли от «Тойоты» 18 млн лет назад.
  rating: orange
  verdict: Машины не размножаются и не передают изменений потомкам, поэтому с живыми существами их сравнивать нельзя. Родство выводят из многих совпадений, вплоть до одинаковых «опечаток» в ДНК; так одна и та же редкая описка в двух тетрадях выдаёт общий источник.
  arguments:
  - common-designer
  rhetoric:
  - false-analogy

- id: lecture-4-2727
  start: 2727.2
  end: 2767.9
  text: Нет, это неправильный вывод. Вы можете проводить полезные наблюдения и всё равно приходить к неправильным выводам. Когда я был в школе, мы делали эксперименты с мухами. Мы выращивали мух в лабораториях, чтобы доказать эволюцию. Знаете, вы можете взять этих мух и облучать их и варить их, делать всё, чтобы у них были дети-мутанты. Там есть мухи со свёрнутыми крыльями, они летают бзз. Они не могут летать. Мухи с красными глазами, белыми глазами, коричневыми, они даже есть мухи без крыльев. Как вы их называете? Ползун? Они не могут летать. После выращивания 80 000 поколений мух, мне сказали в школе, в классе биологии. Они узнали, что все полученные мухи были хуже прадедушки мухи.
  rating: red
  verdict: Опыты с дрозофилами действительно дали много вредных мутаций, но не только их; а в природе у мух и других насекомых за последние десятилетия возникли и распространились мутации устойчивости к ядам. К тому же 80 000 поколений мух не выращивали ни в одной школе.
  arguments:
  - mutations-harmful
  rhetoric:
  - personal-story

- id: lecture-4-2769
  start: 2769.3
  end: 2795.8
  text: 'Они сказали: Давайте посмотрим, к каким выводам мы можем прийти. Все наблюдаемые мутации были хуже первоначальной мухи. Полезное наблюдение. Это доказывает, что мухи развились до последней стадии. Плохой вывод. Прыгай, лягушка, прыгай. Выводом может быть то, что Бог сделал их так, как надо с первого раза. А? Это будет намного благоразумней. Также они провели эксперимент с мотыльками.'
  rating: orange
  verdict: Учёные не выводят из опытов с мухами, что те «развились до последней стадии». Мы тоже верим, что всякую тварь создал Бог, но это не мешает мухам меняться из поколения в поколение.
  arguments:
  - mutations-harmful
  rhetoric:
  - straw-man

- id: lecture-4-2796
  start: 2796.1
  end: 2830.7
  text: 'Они посчитали мотыльков на деревьях, должно быть, государственная работа, я думаю. Они нашли что? Потому что деревья были светлого цвета. 95% мотыльков были светлого цвета, и только 5% чёрного. Тогда они начали жечь уголь на заводах, и из-за дыма деревья потемнели. И когда они опять посчитали мотыльков, то теперь было 95% чёрных мотыльков и только 5% светлых. Они сказали: «Посмотрите на это». Белый мотылёк превратился в чёрного.'
  rating: orange
  verdict: 'Пересказ опыта с берёзовой пяденицей в целом верен: доля тёмных бабочек выросла, когда стволы почернели от сажи. Но учёные не говорили, что «белый мотылёк превратился в чёрного»; они говорили, что изменилась доля окрасок.'
  arguments:
  - peppered-moths
  rhetoric:
  - straw-man

- id: lecture-4-2831
  start: 2831.4
  end: 2858.2
  text: 'Нет, нет, нет. Выводы были простыми. При почернении деревьев соотношение населения бабочек изменилось от большинства белых к большинству чёрных. Полезное наблюдение, это верно. И тогда они заключили: Население бабочек смогло адаптироваться к новой среде. Хорошее наблюдение. Мальчики и девочки, это доказывает, что мы произошли от камня. Плохой вывод. Но детей учат этому.'
  rating: orange
  verdict: 'Здесь Ховинд верно излагает вывод: соотношение бабочек изменилось. Но учебник не говорит, что «это доказывает происхождение от камня»; пяденица — пример работы отбора, а не всё доказательство эволюции.'
  arguments:
  - peppered-moths
  rhetoric:
  - straw-man

- id: lecture-4-2859
  start: 2859.0
  end: 2879.5
  text: Ребята, возьмите большой лист чёрной бумаги, 1 квадратный метр. Я хочу сказать вот что. Все новые учебники, о которых я знаю, все метрические. Я понимаю метрическую систему очень хорошо. Я учил физику, у меня вы можете проверить меня на это. Но я не уверен, что я бы хотел, чтобы кто-то помогал мне строить мой дом, кто не знает, что такое «два на четыре».
  rating: neutral
  verdict: Шутка о метрической системе перед школьным опытом с кружочками.

- id: lecture-4-2880
  start: 2880.8
  end: 2913.6
  text: 'И если вы патриот, возьмите чёрный лист бумаги, 39 и тридцать семь сотых квадратных дюйма. И тогда возьмите 200 чёрных и 200 белых кружочков. Вырежьте их и киньте на бумагу. Теперь, ребята, мы увидим, кто сможет собрать с бумажки больше кусочков за одну минуту. Конечно, вы соберёте только белые кружочки с чёрной бумаги. И тогда они скажут: «Видите, ребята, это доказывает эволюцию». Нет, учитель, это доказывает, что в нашей школе есть лишние деньги. Мы разрезали много хорошей бумаги и выкинули на пол.'
  rating: orange
  verdict: Опыт с кружочками — это наглядная модель того, как хищник отбирает заметную добычу, а не доказательство эволюции. Шутка про лишние деньги школы ничего в модели не опровергает.
  arguments:
  - peppered-moths
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-2915
  start: 2915.8
  end: 2934.0
  text: В действительности факт того, что мотыльки производят двухцветных детей, — это доказательство умного дизайна. Это не доказательство эволюции. Бог хочет быть уверенным, что мотыльки выживут. Это — что бы ни случилось с окружающей средой. Это называется планированием наперёд. Бог запланировал наперёд, чтобы они выжили.
  rating: orange
  verdict: 'Что разная окраска помогает бабочкам выжить, верно, и мы тоже видим в этом мудрость Творца. Но отбор и замысел не исключают друг друга: так работает тот самый процесс, о котором говорит биология.'
  arguments:
  - peppered-moths

- id: lecture-4-2934
  start: 2934.8
  end: 2947.1
  text: Но это всё равно был мотылёк. И когда они прекратили эксперименты и перестали жечь уголь на заводах, деревья посветлели, и соотношение изменилось снова к светлым мотылькам. Началось с мотыльков. И закончилось с мотыльками.
  rating: orange
  verdict: 'Верно: когда воздух очистили, светлых бабочек снова стало больше, и бабочка осталась бабочкой. Но учебник и не говорит о превращении в другой вид; пяденица показывает работу отбора, а не всю эволюцию.'
  arguments:
  - microevolution-macro
  rhetoric:
  - straw-man

- id: lecture-4-2948
  start: 2948.8
  end: 2955.9
  text: Но это считается самым ярким и известным примером эволюции. Если это ваш лучший пример, тогда у вас ничего нет.
  rating: red
  verdict: Пяденица — известный школьный пример отбора, но не главное доказательство эволюции. Главные — ископаемые, генетика и сравнительная анатомия; о них Ховинд не говорит.
  arguments:
  - peppered-moths
  rhetoric:
  - straw-man

- id: lecture-4-2957
  start: 2957.5
  end: 2992.7
  text: Это доказательство дизайна. Форд и Мерседес устанавливают печки и кондиционеры в некоторых из своих машин. Я видел это. Поверьте, я ехал на такой машине. Подождите, но не противоположные ли функции у печки и кондиционера? Скажете ли вы, что Форд делает глупую вещь? Нет, это планирование наперёд. Не так ли? И Бог наделил этих мотыльков генами, включая тёмные и светлые различия, чтобы некоторые мотыльки всегда выжили. Это планирование наперёд. Детей не учат, что мотыльки — это доказательство дизайна, их учат, что это доказательство эволюции.
  rating: orange
  verdict: 'Мы тоже верим, что Бог заботится о творении. Но «заложенный заранее замысел» и естественный отбор не исключают друг друга: учебник описывает, как работает механизм, а вопрос о Творце — за пределами биологии.'
  arguments:
  - design-complexity
  rhetoric:
  - false-analogy

- id: lecture-4-2993
  start: 2993.2
  end: 3031.7
  text: 'Тогда они говорят детям, что они должны думать критически. Посмотрите на этот вопрос. Мальчики и девочки, думаете ли вы, что люди до сих пор развиваются? Хм, что это за вопрос? Это вопрос как: «Перестали ли вы уже избивать вашу жену?» Если я скажу «да», тогда я признаюсь, что я её избивал. Если я скажу «нет», тогда я продолжаю избивать. Правда? Не предполагает ли этот вопрос, что эволюция уже произошла? А если ребёнок вообще не верит в эволюцию? Как он должен ответить на этот вопрос?'
  rating: orange
  verdict: Вопрос в учебнике действительно исходит из того, что эволюция происходит; так любой учебник исходит из принятой науки. Это не ловушка вроде «перестали ли вы бить жену», а упражнение на понимание темы.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-3033
  start: 3033.3
  end: 3056.8
  text: 'Посмотрите на второй вопрос. Как внутреннее тепло динозавров способствовало их вымиранию? Не предполагает ли вопрос, что динозавры вымерли? Это не вопросы для обучения критическому мышлению. Это вопросы обучения думать, как говорят. Вопрос пропаганды, вопросы советского стиля, заставляющие детей поверить в эволюцию, они говорят:'
  rating: orange
  verdict: Что динозавры (кроме птиц) вымерли, признают и креационисты, и сам Ховинд в начале лекции. Называть вопрос о причинах вымирания «советской пропагандой» — оценка, а не довод.
  arguments:
  - recent-dinosaur-extinction
  rhetoric:
  - loaded-language

- id: lecture-4-3057
  start: 3057.4
  end: 3104.9
  text: 'Ребята, у нас есть доказательства структур. Да, ребята, это называется аргументом гомологии. Они скажут: «У вас в запястье есть две кости: лучевая и локтевая». И у кита две кости в плавнике. И угадайте, как они называются? Лучевая и локтевая. Вау. Кто назвал их? Учитель? Кит? Да, у животных есть похожая структура конечностей, это правда, полезное наблюдение. Но они говорят детям: «Сравнительная анатомия предоставляет дальнейшее доказательство эволюции». Общность подсказывает, что эти и другие позвоночные животные связаны между собой. Они, наверное, произошли от общего предка. Извините, но есть два взгляда на это. С какой скоростью бежал тот телёнок? Может, это доказывает, что у них был общий конструктор.'
  rating: orange
  verdict: 'Сходство костей руки человека и плавника кита верно, и мы тоже верим в Творца. Но «общий Конструктор» и «общий предок» не исключают друг друга: Бог мог творить постепенно, из поколения в поколение, как растит дерево из семени.'
  arguments:
  - common-designer
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-3106
  start: 3106.7
  end: 3120.6
  text: Видите? Они провели полезное наблюдение. У многих животных есть похожее строение конечностей. Полезное наблюдение. У них должен быть общий предок, неправильный вывод. Это доказывает, что мы произошли от камня. Хмм, очень неправильный вывод.
  rating: red
  verdict: 'Общий предок — не произвольный вывод: его подтверждают ископаемые переходные формы китов и одинаковые «поломки» генов у родственных видов, как одна и та же редкая описка в двух тетрадях. А «мы от камня» — карикатура, которой в биологии нет.'
  arguments:
  - common-designer
  rhetoric:
  - straw-man

- id: lecture-4-3122
  start: 3122.0
  end: 3153.3
  text: 'Тогда они скажут, что у них есть доказательства развития. Немного вещей в теории эволюции сердит меня более, чем то, что я вам сейчас расскажу. Сходство между ранними стадиями развития у многих разных животных помогло убедить Дарвина, что все формы жизни произошли от общего предка. Минуточку, все ли разные животные похожи при развитии? В этом учебнике говорится: у человеческого зародыша есть жаберные, жаберные складки. Жабры как у рыбы. Эти маленькие складки кожи — не жабры.'
  rating: orange
  verdict: Что у зародыша человека нет настоящих жабр, верно. Но учебник говорит о глоточных дугах, общих у зародышей всех позвоночных; у рыб из них развиваются жабры, у нас — части челюсти, уха и горла.
  arguments:
  - gill-slits
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-3154
  start: 3154.8
  end: 3168.4
  text: Эти складки кожи позднее развиваются в разные структуры. Ребёнок не может дышать ими. Я видел полных людей с пятью или шестью подбородками, но они не могут дышать. Никакими, только верхним. Это не жаберные складки, друзья.
  rating: orange
  verdict: 'Верно, что ребёнок не дышит этими складками и что из них развиваются другие структуры. Но именно это и интересно биологам: одинаковый зачаток у рыбы и человека развивается по-разному.'
  arguments:
  - gill-slits
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-3168
  start: 3168.8
  end: 3192.6
  text: 'Эрнст Геккель придумал это в Германии в 1869 году. Он преподавал в университете. Когда Геккель прочитал книгу, он разволновался и сказал: «Вот это да». Книга Дарвина вышла в 1859 году. Геккель прочитал её в 1860 году и сказал: Наконец, та теория, которая позволяет мне жить, как я хочу. Что он имел в виду… Что он имел в виду? Позволить мне избавиться от Бога.'
  rating: red
  verdict: Геккель действительно рано принял дарвинизм и был противником церкви. Но источника фразы «теория, которая позволяет мне жить, как я хочу» мы не нашли; и мотивы Геккеля не решают, похожи ли зародыши.
  arguments:
  - gill-slits
  rhetoric:
  - unverified-quote
  - ad-hominem-pivot

- id: lecture-4-3193
  start: 3193.7
  end: 3205.7
  text: Дарвин предсказал, что доказательство его теории будет найдено. Через 10 лет спустя у них не было доказательства. Геккель решил им помочь. Он изобрёл доказательства. Э-э, кстати, всё доказательство эволюции было придумано.
  rating: red
  verdict: 'Геккель действительно приукрашивал рисунки. Но из ошибки одного человека не следует, что «все доказательства эволюции придуманы»: ископаемые и генетика с Геккелем никак не связаны.'
  arguments:
  - science-conspiracy
  rhetoric:
  - loaded-language

- id: lecture-4-3206
  start: 3206.6
  end: 3255.3
  text: 'Геккель взял рисунки четырёхнедельного зародыша человека и собаки. И изменил их. Он сделал их одинаковыми. Похожими. Сверху настоящие рисунки. И снизу рисунки Геккеля. Он нарисовал разных животных в стадии зародышей. И сделал все зародыши похожими. Тогда он начал путешествовать по всей Германии и говорить: «Посмотрите, вот доказательство эволюции». Зародыши похожи, они проходят через стадию рыбы, амфибии, пресмыкающегося и млекопитающего. Он сказал: «Видите, мальчики и девочки, это доказательство эволюции». Но несколько лет назад кто-то сфотографировал настоящих зародышей в стадии развития. Нижний рисунок — это как они выглядят по-настоящему. Сверху подделки Геккеля.'
  rating: orange
  verdict: Что Геккель схематизировал и приукрасил рисунки зародышей, верно; это показали фотографии 1997 года. Но и на фотографиях ранние зародыши позвоночных заметно похожи, хотя и меньше, чем у Геккеля.
  arguments:
  - gill-slits

- id: lecture-4-3256
  start: 3256.9
  end: 3287.2
  text: Вообще-то люди подозревали с самого начала, что Геккель их обманул. И он был осуждён в своём же университете. И он был обвинён в обмане. Но его рисунки до сих пор находятся в учебниках. Он был обвинён в обмане в 1874 году. Его судили и обвинили в его же университете. Но они используют его рисунки в учебниках прямо сейчас. Я гарантирую, что это находится в учебниках здесь, в вашем городе.
  rating: red
  verdict: Коллеги, например анатом Вильгельм Гис в 1874 году, действительно обвиняли Геккеля в неточности. Но суда в университете не было. Рисунки в части учебников 1990-х годов ещё встречались, и биологи сами добились, чтобы их убрали.
  arguments:
  - gill-slits

- id: lecture-4-3288
  start: 3288.0
  end: 3301.1
  text: У человеческого зародыша есть жаберные складки, как у рыбы. Это интересно, это вообще неправда? Это в учебниках колледжей. Я гарантирую, возьмите любой светский учебник биологии, и вы найдёте эту информацию.
  rating: orange
  verdict: 'Повтор: «жаберные складки» означают глоточные дуги, а не жабры (разбор выше на 52:02).'
  arguments:
  - gill-slits
  rhetoric:
  - textbook-authority

- id: lecture-4-3301
  start: 3301.4
  end: 3329.9
  text: 'Почему? Посмотрите на это. Здесь показан пяти-шестинедельный человеческий зародыш, и говорится: Семимесячный зародыш выглядит снаружи как маленький нормальный ребёнок. Но это ещё не ребёнок. Не ребёнок семь месяцев. Хмм, это странно, так как 34% детей, рождённых на пятом с половиной месяце, выживают. Так выжил мой… сын. Что вы имеете в виду? Не ребёнок семь месяцев. Ангел Господень сказал: «Вот, ты беременна и родишь сына».'
  rating: orange
  verdict: Мы тоже рады каждому спасённому недоношенному ребёнку. Но учебник говорит о степени развития зародыша, а не о том, что он не человек; выживаемость на таком сроке зависит от уровня медицины и в 1990-х была ниже, чем сегодня.
  rhetoric:
  - textbook-authority
  - personal-story

- id: lecture-4-3330
  start: 3330.6
  end: 3348.5
  text: Нет, друзья, это ребёнок. Это человек с момента зачатия. И каждый доктор в мире знает, что жизнь начинается при зачатии. Она не начинается при рождении, она начинается при зачатии. Каждый знает, когда начинается жизнь. Ну тогда почему это ложь находится в учебниках.
  rating: green
  verdict: 'Мы тоже верим, что человек — человек с момента зачатия, и учебники эмбриологии начинают его развитие с оплодотворения. Поэтому «лжи в учебниках» тут нет: врачи спорят не о начале жизни, а о том, с какого срока её защищать.'

- id: lecture-4-3351
  start: 3351.3
  end: 3371.8
  text: Почему она находится в учебниках? Это единственный путь к оправданию абортов. Они хотят, чтобы вы думали, что это не человек и нет ничего плохого, если вы его убьёте. Я думаю, настоящая проблема — это дьявол. Ему было сказано в Эдемском саду, в Бытии, главе третьей, что в один день семя женщины поразит его в голову. И после этого он старается уничтожить каждого человека.
  rating: red
  verdict: 'Мы тоже считаем аборт тяжёлым грехом и верим, что дьявол — враг человека. Но эмбриология не придумана для оправдания абортов: она описывает, как развивается зародыш.'
  arguments:
  - evolution-morality
  rhetoric:
  - conspiracy

- id: lecture-4-3372
  start: 3372.6
  end: 3384.3
  text: Он хочет сократить мировое население с около 6 млрд до полумиллиарда. И у него есть много разных верных подчинённых, работающих по сокращению мирового населения. И аборт— это один из его способов.
  rating: red
  verdict: Плана «сократить население до полумиллиарда» и людей, которые его исполняют, никто не показал. Население Земли с тех пор выросло с 6 до 8 миллиардов.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-4-3385
  start: 3385.1
  end: 3417.8
  text: 'И это один из его любимых способов. Жак Кусто сказал: «Мы должны ликвидировать 350 000 человек ежедневно. Мы должны спасти планету». В Джорджии мы говорили об этом раньше. Вы найдёте камни-путеводители, на которых написано: «Сохраняйте человечество на уровне полумиллиона». Масоны Джорджии думают, что вы должны сократить мировое население до половины миллиона. Тед Тёрнер сказал: «Мы должны сократить мировое население на 95%». Хорошо, ты ты первый? И захвати с собой свою жену.'
  rating: orange
  verdict: Кусто и Тёрнер действительно говорили резкие слова о численности населения, но имели в виду снижение рождаемости, а не убийства. Камни в Джорджии поставил анонимный заказчик, и связи с масонами никто не доказал.
  arguments:
  - depopulation-plot
  rhetoric:
  - quote-mining
  - conspiracy

- id: lecture-4-3418
  start: 3418.9
  end: 3443.7
  text: 'Принц Филипп сказал: «Если бы я мог перевоплотиться, я бы вернулся на Землю как вирус-убийца, чтобы снизить уровень населения». Видите, они хотят сократить мировое население до 5 мая 2000 года. Я надеюсь, что они этого не сделают. Но аборт — это прекрасный путь осуществления этой цели. Около 1 млрд детей погибло от абортов. Это пятая часть населения всей планеты.'
  rating: orange
  verdict: Принц Филипп действительно написал эту мрачную фразу о вирусе в предисловии к книге 1986 года. Но это его личная резкость о перенаселении, а не общий план «их»; связывать её с абортами — домысел.
  arguments:
  - depopulation-plot
  rhetoric:
  - quote-mining

- id: lecture-4-3445
  start: 3445.3
  end: 3559.0
  text: 'Почему они говорят, что это не человек, когда все знают, что это человек? Ана Роса выжила при неудавшемся аборте, но ей отрезали руку. Люди говорят: «О, это ужасно, страшно». Да. А что, если у неё отрезали голову? Друзья, аборт — это убийство. Вы, наверное, слышали о моём городе. Я живу в Пенсаколе, во Флориде. У нас были расстреляны и убиты два доктора, взорвано и сожжено несколько клиник. Я не убивал докторов и не сжигал клиник, но я не думаю, что Иисус поступил бы так же. Иисус рос под римским контролем, но не ходил и не взрывал танки и не сжигал мосты. Но доктора были убийцами, это просто и ясно. Когда был застрелен первый доктор, я находился в Форт-Лодердейле. На следующий день я летел домой, и прямо впереди меня сидели две дамы из Нау. Национальной организации диких женщин. Они и собирались маршировать по городу с плакатами «За выбор», «за выбор». Заметили ли вы, что в новостях и учебниках их называют «за выбор»? А нас называют «антиаборт». Для этого есть причина. Она называется журналистическая свобода. Они называют вас «антиаборт», потому что «анти» имеет как бы негативный оттенок. Никто не хочет быть «анти». А если они назовут нас «за жизнь», а их «за смерть»? Это было бы лучше. Когда мы сходили с самолёта, я заметил, что у этих двух дам, то есть женщин, на футболках большими буквами было написано: «Выбор превыше всего». Я спросил их: Извините, что это значит? Выбор превыше всего. Они ответили: Мы верим, что у женщины есть право на выбор. Если у ребёнка это право Знали ли вы, что все, кто проголосовал за аборт, уже рождены? Подумайте об этом. Я сказал: «Мэм, я интересуюсь этим».'
  rating: neutral
  verdict: Нравственная оценка аборта и рассказ о попутчицах в самолёте. Мы тоже считаем жизнь нерождённого ребёнка драгоценной и осуждаем насилие против врачей; это вопрос веры и этики, а не научный довод лекции.
  rhetoric:
  - personal-story

- id: lecture-4-3559
  start: 3559.1
  end: 3585.9
  text: 'Право на выбор. У меня трое детей. Один был рождён дома, я выращивал хомяков, я преподавал биологию и анатомию. Я спросил: «Скажите мне, почему это право выбора прекращается при рождении?» Почему мы не разрешим ей убивать ребёнка после рождения? Это будет намного проще и безопаснее. Много женщин погибают от абортов. Погибает не только ребёнок, но и мать. Многие повреждены на всю жизнь. У 90 с чем-то процентов остаются психологические проблемы на долгое время.'
  rating: orange
  verdict: Что аборт может тяжело ранить женщину, верно. Но цифра «у 90 с чем-то процентов долгие психологические проблемы» не подтверждается исследованиями, а преподавание анатомии не делает её точнее.
  rhetoric:
  - self-authority

- id: lecture-4-3586
  start: 3586.3
  end: 3748.9
  text: 'Одна женщина написала мне: «Аборт — это убийца. Убийство. И каждая женщина, имевшая аборт, знает об этом». Приблизительно каждая женщина мучается этим долгое время, если не всю жизнь. Но, друзья, это не непростительный грех. Если вы сделали аборт, Бог любит вас. Он может простить вас, и он может спасти вас, и он может помочь вам исцелиться. Но вы не думаете, что то, что вы сделали, — хорошо, это плохо. Библия была написана убийцами. Царь Давид был убийцей. Не то чтобы это хорошо, это просто факт. Моисей был убийцей. Если вы убили вашего ребёнка, попросите у Бога прощения и начните служить ему. Разговаривая с женщинами, я спросил: Почему мы не дадим женщине право убивать ребёнка после рождения? У меня появилась блестящая идея. Давайте продлим право аборта до двухлетнего возраста. Я знаю много матерей с двухлетними детьми, которые думали об этом. Я не попрошу вас поднять руку, но я знаю, что вы здесь. Правда? У меня появилась блестящая идея. Давайте продлим право аборта, пока ребёнку не будет восемнадцати лет. Я спорю, они будут намного послушнее. Сын, ещё раз, и я убью тебя. Учитель, где сегодня Джон? А Джон вчера не сделал домашнюю работу, его мама сделала аборт. Тогда и оценки поднимутся. Ну, женщины больше не хотели разговаривать об этом и ушли. Я взял свои сумки, и когда я ждал такси, чтобы ехать домой, я заметил кинооператора. Он приехал с Чикаго для киносъёмки этого марша. Я подумал: «Подождите, только шесть человек будут маршировать по городу». Из этого сделают мировые новости. На вашей улице может собраться 100 000 человек против аборта. И это не сделает никаких новостей. Заметили ли вы это? Это одна из причин, почему я не покупаю газет. Я не хочу поддерживать эту экономику, я не хочу поддерживать либерализм. И когда звонят из газеты, чтобы мы её покупали к нам в офис, я поднимаю трубку. Несколько недель назад я поднял телефонную трубку. Алло? Это брат Ховинд? Женщина говорит: «Вы хотите подписаться на журнал новостей?» Я говорю: «Нет, у меня нет попугая». Она сказала: «Я не понимаю». Я сказал: «Видите, мэм, если б у меня был попугай, нам бы нужна была газета». Но она нам не нужна. Она сказала: «Сэр, о чём вы говорите?» Я сказал: «Мэм, я знаю, что вы не работаете на них, вы только пытаетесь продать мне газету. Но я не хочу покупать эту либеральную тряпню. Я не хочу, чтобы мои деньги поддерживали ихнюю пропаганду». Я думаю, что газеты хороши только для завёртывания рыбы или подстилки в птичьей клетке.'
  rating: neutral
  verdict: 'Пастырское слово: аборт — грех, но Бог прощает кающихся; с этим мы согласны. Дальше — сатирические шутки в споре об абортах и рассказ о газетах; это этика и политика, а не научные доводы.'
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-3749
  start: 3749.4
  end: 3790.8
  text: Эти нелегальные доктора им платят наличными без налогов за проведение абортов. Один доктор руководил или собственноручно провёл 60 000 абортов. И когда он сел и просмотрел фильм, сделанный в лаборатории при проведении аборта. Он видел, как ребёнок изгибался и защищался, стараясь избежать всасывающей трубки. Разрывающий ребёнка на кусочки. В двадцать раз мощнее вашего домашнего пылесоса. И теперь он стал местным адвокатом против абортов. И любой, кто хочет сделать аборт, должен заказать и посмотреть видеофильм «Безмолвный крик».
  rating: orange
  verdict: Бывший врач-абортмахер Бернард Натансон действительно стал противником абортов и снял фильм «Безмолвный крик» (1984). Но то, что плод на кадрах «защищается», врачи оспаривали; фильм — свидетельство, а не научное исследование.
  rhetoric:
  - personal-story

- id: lecture-4-3791
  start: 3791.8
  end: 3807.0
  text: Вы сначала просмотрите видео. Если вы всё равно хотите сделать аборт, придите ко мне. Я хочу поговорить с вами и встретиться, потому что у вас нет души. Только посмотрите фильм «Безмолвный крик». Вы можете купить его в любой антиабортной организации.
  rating: neutral
  verdict: Призыв посмотреть фильм перед решением об аборте. Резкое «у вас нет души» мы бы не повторили; к научным доводам это не относится.

- id: lecture-4-3808
  start: 3808.4
  end: 3838.9
  text: 'Вот логика, которую они используют для оправдания абортов. Они скажут: «Это не человек». Извините меня, это неправда, это было опровергнуто. Тогда они скажут: «Он нежизнеспособный, он не может жить сам по себе». Но вы тоже нежизнеспособны, начиная голыми на Северном полюсе? А? Жизнеспособный ли ребёнок после рождения? Положите его на тротуар на несколько месяцев. Давайте посмотрим, как он выживет. Подумайте об этой логике: только потому, что он не может жить сам по себе, у нас есть право на убийство.'
  rating: orange
  verdict: 'Мы тоже считаем зародыш человеческой жизнью. Но «жизнеспособность» — медицинский термин: способен ли ребёнок выжить вне матки при помощи врачей, а не «жить сам по себе» на улице; спор здесь нравственный, а не научный.'
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-3839
  start: 3839.6
  end: 4047.8
  text: 'Я знаю двадцатипятилетних детей, которые занимают деньги у своих родителей. Эй, папа, можешь занять мне денег? Выстрел. Ты должен жить сам по себе, сын. Оправданное убийство. Э-э, как насчёт этой логики? Они скажут: «Ребёнок может быть нежеланным». О, это блестяще. Есть нежеланные дети, которые уже рождены. Давайте убьём их всех. Мои родители переезжали четыре раза, когда я был маленьким, но я находил их каждый раз. Как насчёт этого: «Ребёнок может быть финансовым бременем»? Покажите мне ребёнка, который не является Каждый ребёнок— это финансовое бремя. Тогда они скажут, что ребёнок может быть от изнасилования или кровосмешания. Ну тогда вы убейте насильника. Не ребёнка? Казните насильника и усыновите ребёнка. В случае, если вы не понимаете, как это происходит, здесь участвуют три человека: мать, отец и ребёнок. И если мы должны убить одного из них, почему всегда это ребёнок? Почему нам не убить мать один раз? У меня появилась блестящая идея. Установите закон в вашем штате, э-э, в котором говорится, что если женщина хочет сделать аборт и идёт к доктору, у доктора должен быть мешочек с бумажками. На одной бумажке написано «ребёнок». На следующей написано «отец». И на одной «мать». Вы берёте наугад бумажку и видите, кто должен умереть, давая этим ребёнку равный шанс. Давайте прибавим ещё одну бумажку. Доктор. Давайте прибавим ещё одну. Губернатор. Ещё одну. Президент. А? По закону вы не можете убить оленя ночью, используя яркий луч Для этого существуют законы, не так ли? По крайней мере, дайте ребёнку равный шанс. Один доктор рассердился по этому поводу и сказал: Мистер Ховинд, а что, если женщина изнасилована? Должны её заставить родить ребёнка? Я сказал: «Сэр, разрешите мне задать вам вопрос: если женщина изнасилована и забеременеет, что крайне маловероятно, и очень редко вообще случается. Но если она изнасилована и рожает сына Пять лет спустя она держит ребёнка и готовит обед. Вдруг она вспоминает этот ужасный случай. Теряет контроль и убивает пятилетнего сына. Или дочь. Убийство ли это? Он сказал: «Конечно». Я сказал: «Сэр, если бы она убила его пять месяцев после рождения?» Было бы это убийством? Он сказал: «Да». Я сказал: «А если бы она убила его 5 минут после рождения, убийство ли это?» Он сказал: «Да». Я сказал: «Даже если ребёнок от изнасилования, это всё равно убийство». Он сказал: «Да». Я сказал: «А что, если она бы убила его 5 минут до рождения?» Как аборт частичного рождения. Если ваш сенатор-представитель проголосовал за это, с ним серьёзно что-то не в порядке. Меня удивляет, как президент Клинтон может поставить на это вето. Доктор был очень молчалив, когда я его спросил за 5 минут до рождения. Потому что он знал, что я загнал его в угол. Друзья, изнасилование ужасно, но этого не сделал ребёнок. Вы убейте насильника, не ребёнка.'
  rating: neutral
  verdict: 'Нравственные ответы на доводы сторонников абортов, шутки и разговор с врачом о «частичном рождении»; это этика, а не наука. Одна ошибка: беременность после изнасилования не «крайне редка»: по исследованиям, около 5% изнасилований, то есть примерно одно из двадцати, приводит к беременности.'
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-4051
  start: 4051.9
  end: 4073.8
  text: 'Они скажут: «Аборты законны». Но это не значит, что это правильно. В 1936 году Германский Верховный суд объявил, что евреи— не люди. Если вы еврей, вы не человек. В 1973 году Верховный суд США объявил, что слово «человек» не включает в себя нерождённых детей. Много общего?'
  rating: orange
  verdict: 'Что законное не всегда правильно, верно, и суды нацистской Германии действительно лишали евреев прав. Но сравнение с Гитлером само ничего не доказывает: о моральном статусе зародыша нужно спорить по существу.'
  rhetoric:
  - guilt-by-association

- id: lecture-4-4074
  start: 4074.7
  end: 4098.8
  text: Гитлер начал убивать и расстреливать евреев, потому что они не были людьми. У них не было никакой защиты в законе. Гитлер относился к евреям как к паразитам нации. Из его книги «Майн кампф». Это интересно, доктора или акушеры относятся к нерождённым детям как к паразитам в женском теле. Хмм, интересно, откуда у них появилась эта идея?
  rating: orange
  verdict: Гитлер действительно называл евреев паразитами, а врачи порой сравнивали плод с паразитом, говоря о питании за счёт матери. Но что это сравнение взято у Гитлера и отрицает человечность ребёнка, ничем не подтверждено; это вина по ассоциации.
  rhetoric:
  - guilt-by-association

- id: lecture-4-4100
  start: 4100.9
  end: 4151.3
  text: 'И когда Гитлер начал убивать евреев, это было законно. Я был в Ласбургском лагере несколько месяцев назад. Я также был в Нюрнберге, я видел несколько мест, где убивали евреев. Кучи и кучи обуви. Повсюду мёртвые тела. Или по меньшей мере 6 млн. Я был в помещении суда в Нюрнберге, где осуждённые солдаты говорили: Всё, что мы делали, было вполне законно, мы только выполняли приказы. Выстояла ли эта логика на суде? Нет, их признали виновными в убийстве, не так ли? И вы, абортционисты, ваша логика не выстоит перед судом Бога. Вы будете виновны, и все в мире увидят ваше осуждение. Ничего не пройдёт незамеченным, у Бога всё внимательно записывается. Но это ещё не день суда.'
  rating: neutral
  verdict: 'Нюрнбергский процесс: ссылка на закон и приказ не оправдала убийц. С этим мы согласны, как и с тем, что всякое дело предстанет перед судом Божьим.'
  rhetoric:
  - personal-story

- id: lecture-4-4152
  start: 4152.1
  end: 4171.5
  text: Вы знаете, во время революционной войны погибло 25 000 американцев. Во время Гражданской войны погибло 400 или 500 тыс. Во время Второй мировой войны погибло 400 000 человек. На сегодняшний день в Америке погибло 38 млн младенцев от абортов. И около одного миллиарда по всему миру.
  rating: orange
  verdict: 'Что абортов в США — десятки миллионов, верно. Но потери Гражданской войны занижены: сегодня их оценивают в 620–750 тысяч; и сравнение с войнами давит на чувства, а не на довод.'
  rhetoric:
  - scale-trick

- id: lecture-4-4173
  start: 4173.6
  end: 4191.9
  text: Друзья, мы в беде. В 1916 году Сэнгер организовала группу под названием «Запланированное семейство». Её целью было уничтожение низших рас. Она думала, что они были сорняками. Она думала, что евреи, чернокожие, мексиканцы были сорняками. Восточные расы были сорняками, их необходимо уничтожить.
  rating: orange
  verdict: Маргарет Сэнгер действительно поддерживала евгенику, и это тёмная страница истории. Но целью «уничтожить евреев, чернокожих и мексиканцев» она свою работу не называла, а Planned Parenthood под этим именем появилась в 1942 году.
  arguments:
  - darwin-hitler
  rhetoric:
  - loaded-language

- id: lecture-4-4192
  start: 4192.9
  end: 4212.5
  text: 'В книге «Женщины и новая раса» она написала: «Самое милосердное дело, которое большая семья предпринимает к одному из своих младенцев, — это убить его». В журнале «Женский повстанец» она сказала: «Нет богов, нет хозяев». Это был ихний девиз. Ихней целью было создание чистокровной расы.'
  rating: orange
  verdict: Фраза из книги «Женщина и новая раса» (1920) действительно есть, но там она — горькая ирония о детской смертности в бедных многодетных семьях, а не призыв убивать младенцев. Лозунг «Ни богов, ни господ» — подлинный.
  arguments:
  - darwin-hitler
  rhetoric:
  - quote-mining

- id: lecture-4-4213
  start: 4213.8
  end: 4222.4
  text: Звучит как у Гитлера, неправда? Кстати, в 1993 году один из его докторов написал артикль «Евгеническая стерилизация, срочная надобность».
  rating: orange
  verdict: Статья немецкого евгеника Эрнста Рюдина о стерилизации действительно вышла в журнале Сэнгер в 1933 году. Связь евгеники с нацизмом реальна, но это история евгеники, а не довод против биологии.
  arguments:
  - darwin-hitler
  rhetoric:
  - guilt-by-association

- id: lecture-4-4222
  start: 4222.9
  end: 4253.5
  text: 'Маргарет Сэнгер сказала: «Наиболее успешный метод подхода к неграм… Это через религию. Мы не хотим, чтобы было известно, что мы хотим истребить негритянское население. И простой негр не знает об этом, правда? Сейчас президент «Запланированного семейства» — негритянка. Фей Ватлтон. Гуманист года. Они пытаются спрятать великую миссию. Но они всё равно хотят создать чистокровную расу. Уничтожить низших.'
  rating: orange
  verdict: Слова из письма Сэнгер 1939 года о «негритянском проекте» подлинны и звучат тревожно, но в письме она боялась, что проект примут за истребление. Вывод, что организация и сейчас скрыто «уничтожает низших», не доказан.
  arguments:
  - darwin-hitler
  rhetoric:
  - quote-mining
  - conspiracy

- id: lecture-4-4254
  start: 4254.7
  end: 4280.4
  text: 'В 1952 году организация опубликовала документ о том, как планировать ваших детей. Они отвечают на вопросы. Вопросы о контроле рождаемости. Что такое контроль рождаемости? Аборт ли это? В 1952 году организация ответила: «Безусловно, нет». Для аборта необходима операция, она убивает жизнь ребёнка после её начала. Это опасно для вашего здоровья и жизни. Это может сделать вас бесплодными. Хм, не изменились ли они за 40 лет?'
  rating: green
  verdict: 'В целом верно: в брошюре Planned Parenthood 1963 года действительно сказано, что контроль рождаемости — не аборт и что аборт убивает жизнь ребёнка. Год у Ховинда неточен.'

- id: lecture-4-4280
  start: 4280.9
  end: 4302.4
  text: Видите, Сатана использует этот обман эволюции, чтобы уничтожить человечество. Аборт— это один из его многих инструментов. Мы поговорим об этом больше на видеокассете номер пять, о вещах, использованных для уничтожения человечества. Он хочет уничтожить человечество. Он лжец. И он обманывает детей, говоря им, что у него есть доказательства эволюции, хотя доказательств нет.
  rating: red
  verdict: Мы тоже верим, что сатана — враг и обманщик. Но эволюция — научная теория с множеством доказательств, а не орудие абортов; многие христиане принимают её и при этом защищают жизнь нерождённых.
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-4-4303
  start: 4303.3
  end: 4354.3
  text: В следующей секции мы поговорим о неправде в учебниках. И я расскажу вам, что вы можете сделать. Прямо здесь, в вашем городе. Как вы сможете помочь исправить это? Поддержать учителей, которые пытаются что-то делать. Практические шаги для исправления. После перерыва я ещё расскажу, чему учат наших детей. И расскажу, что вы можете предпринять на этот счёт. Спасибо. Спасибо, что вы пришли. Это вторая сессия о неправде в учебниках и о том, что можно сделать. Я забыл напомнить в последней сессии, что если вы хотите прочитать или дать кому-то хорошую книгу об абортах, это книга Джона Энкерберга. Книга о разных научных фактах и абортах и подобных вещах. Джон ведёт служение в штате Теннесси. Теперь немного об обманах в учебниках и что можно сделать на этот счёт?
  rating: neutral
  verdict: Конец первой сессии и начало второй, рекомендация книги Джона Анкерберга об абортах.

- id: lecture-4-4354
  start: 4354.8
  end: 4388.7
  text: В обычном учебнике говорится, что у человека есть аппендикс, который является остаточной структурой. Слово «остаточный» значит, что вам он больше не нужен. Они хотят, чтобы дети поверили, что это доказывает, что мы развиваемся, так как мы перестаём использовать аппендикс. Но фактом является то, что это неправда. Аппендикс— это часть иммунной системы. Вам нужен ваш аппендикс? Конечно же, вы можете жить и без него, это правда. Вы можете жить без двух рук и без двух ног. Без двух глаз и без двух ушей. Но это не доказывает, что они вам не нужны. Факт того, что вы можете жить без чего-то, не доказывает эволюцию.
  rating: red
  verdict: 'Что аппендикс участвует в работе иммунитета, верно. Но «рудиментарный» в биологии значит не «ненужный», а «утративший прежнюю главную функцию»: у травоядных на этом месте большая слепая кишка, где переваривается трава, а у человека она уменьшена.'
  arguments:
  - vestigial-organs
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-4390
  start: 4390.0
  end: 4412.8
  text: 'Они скажут детям: «У кита есть остаточный таз». Вот что написано в этой книге. У многих организмов сохраняются следы истории их эволюции. Например, у кита кости таза и ног являются ненужными остатками. В этом учебнике под рисунком кита написано: Таз кита является доказательством эволюции кита от четырёхкопытного земноводного млекопитающего.'
  rating: neutral
  verdict: Цитаты из учебников о тазовых костях кита; разбор — в следующем утверждении.
  rhetoric:
  - textbook-authority

- id: lecture-4-4414
  start: 4414.4
  end: 4449.6
  text: Извините меня, но эти кости кита — не таз или нога, или бедро, или вообще что-нибудь общее с ногой. Эти кости являются местом, к которому присоединены мускулы. И без этих мускул, и без этих костей киты не могут размножаться. Это не имеет ничего общего с ходьбой по земле. Это имеет дело с рождением китов. Автор, который написал это, или не сведущий в анатомии китов и не должен писать учебники. Или же он обманщик, пытающийся продвинуть свою теорию. Ну, друзья, это найдено в почти каждом учебнике биологии. Кто-то должен вырезать эту страницу.
  rating: red
  verdict: Что к тазовым костям кита крепятся мышцы, участвующие в размножении, верно. Но по строению это остатки таза, а у некоторых китов есть и остатки бедренной кости; выбор «невежда или обманщик» ложен.
  arguments:
  - vestigial-organs
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-4450
  start: 4450.2
  end: 4468.1
  text: Это детская книжка о китах. Посмотрите, что здесь написано в первом предложении. Представьте себе китов, ходящих по земле. Это правда? Кому-то нужно подучить анатомию. Киты никогда не ходили по земле. Они всегда были китами. Бог создал их.
  rating: red
  verdict: Мы тоже верим, что Бог сотворил китов. Но найдены ископаемые древних китов с ногами. Например, пакицет — зверь размером с волка, на четырёх ногах, но с ухом, устроенным как у кита. Это и есть «ходившие по земле» предки китов.
  arguments:
  - transitional-forms
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-4469
  start: 4469.2
  end: 4532.5
  text: 'В этом учебнике говорится: «У человека есть хвостовая кость без никакой явной функции». Я проводил дебат в Хантсвилле, Алабама. Я дискутировал с президентом Атеистической ассоциации Северной Алабамы. Или чего-то в этом роде. Он вышел перед всеми людьми и сказал: Товарищи, у нас есть доказательства эволюции. У людей есть хвостовая часть, которая им больше не нужна. Когда пришёл мой черёд, я сказал: Мистер Петерсон, я преподавал биологию и анатомию, и я знаю, что к хвостовой кости присоединены девять маленьких мышц. без которых невозможны некоторые очень важные функции. Я не скажу, что это за функции. Но поверьте мне, вы нуждаетесь в этих мускулах. Однако, мистер Паттерсон, если вы верите, что хвостовая часть не нужна, я, Кент Ховинд, заплачу, чтобы вашу кость вырезали. Сгибайтесь. Не прошло и минуты, как он подумал: «О, лучше б я этого не говорил». Да, лучше бы ты не говорил.'
  rating: red
  verdict: 'Что к копчику крепятся мышцы, верно. Но копчик — остаток хвоста: у зародыша человека хвост есть, а потом исчезает, и изредка дети рождаются с хвостиком. Опыт преподавания и шутка на дебатах этого не меняют.'
  arguments:
  - vestigial-organs
  rhetoric:
  - self-authority
  - personal-story

- id: lecture-4-4533
  start: 4533.0
  end: 4545.9
  text: И любой, кто говорит, что хвостовая часть остаточная, или не следует своей анатомии, или преднамеренный обманщик, пытающийся продвинуть свою теорию. Понимаете, они хотят показать детям доказательства эволюции.
  rating: red
  verdict: 'Называть копчик рудиментом — не невежество и не обман: рудимент может иметь новую работу, оставаясь остатком прежнего органа. Третий вариант — автор прав — Ховинд пропускает.'
  arguments:
  - vestigial-organs
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-4546
  start: 4546.3
  end: 4596.0
  text: 'На одном из моих дебатов я представлял факт за фактом, как я делаю сегодня, о неверных вещах, используемых для поддержки теории эволюции. Они просто неверны. Один профессор встал и сказал: «Мистер Ховинд прав. Эти вещи неверны. Однако, мистер Ховинд, у меня к вам вопрос. Вы показываете нам вещи в учебниках, которые неверны. Чем вы их замените?» Друзья, то, что он так сильно пытался не сказать, это: мы хотим, чтобы дети поверили в эту теорию. «Вы забираете все доказательства. Вы должны найти замену». О нет, сэр, видите, если у вас нет доказательства теории, это ваша проблема. И я рекомендую вам найти другую теорию. Видите, они знают, что если вы заберёте из учебника весь обман, не останется никакой поддержки эволюции.'
  rating: orange
  verdict: 'Что в учебниках бывают устаревшие примеры, признают и учёные. Но слова безымянного профессора на дебатах не доказывают, что без них «не останется никакой поддержки эволюции»: главные доказательства — ископаемые и генетика.'
  arguments:
  - science-conspiracy
  rhetoric:
  - personal-story

- id: lecture-4-4597
  start: 4597.0
  end: 4606.6
  text: И я думаю, что вместо государственных школах христианам необходимо сначала забрать детей из школ, если возможно. И тогда давайте постараемся забрать ложь из учебников.
  rating: neutral
  verdict: Призыв к христианам забирать детей из государственных школ; это выбор семьи, а не научный довод.

- id: lecture-4-4607
  start: 4607.2
  end: 4632.4
  text: Вы должны беспокоиться об обмане в учебниках. Заберите эти вещи из школьной системы. Кит с тазом. Остаточная хвостовая кость. Жаберные складки на человеческом зародыше — требуйте, чтобы эти вещи извлекли из учебников. Одно за одним вы сможете забрать из учебника всё предполагаемое доказательство. И вскоре у них не будет никакой поддержки для ихней теории, которой у них нет и сейчас. Нет никакой поддержки эволюции.
  rating: red
  verdict: 'Таз кита, копчик и глоточные дуги зародыша — не обман, а реальные факты анатомии (разборы выше). И «нет никакой поддержки эволюции» неверно: её подтверждают и независимые данные генетики.'
  arguments:
  - vestigial-organs
  rhetoric:
  - loaded-language

- id: lecture-4-4632
  start: 4632.8
  end: 4649.0
  text: Но они говорят, что хвостовая часть является остаточной. Друзья, остаточных органов нет. Но подумайте об этой логике. Если бы даже они и были, это противоречило бы эволюции. Лишение чего-то не объясняет его появления. Это лишение, это не прибавление.
  rating: red
  verdict: 'Рудименты есть. И они не «противоречат» эволюции: теория и не говорит, что всё только прибавляется; остаток органа показывает, от кого произошло животное.'
  arguments:
  - vestigial-organs
  rhetoric:
  - straw-man

- id: lecture-4-4649
  start: 4649.3
  end: 4687.7
  text: 'Это не помогает эволюции. В этом учебнике говорится: «Растения адаптировались к окружающей среде». Это слово — код. Они используют слово «адаптировались», потому что они не хотят говорить «придуманы». «Жабры — это адаптация к жизни в воде». Тогда как жили рыбы до того, как они адаптировались? Видите, друзья, в течение миллионов лет ни одна рыба не выжила. Почему они не говорят, что это особенность проекта? Они избегают слова «замысел», потому что тогда какой-то ребёнок встанет и спросит: «А кто тогда является конструктором?» Правда?'
  rating: red
  verdict: '«Адаптация» — не код для сокрытия замысла, а описание того, как признак помогает жить. Рыбы не жили без жабр: у их крошечных предков кислород проходил прямо через кожу, а жабры постепенно добавили поверхность для дыхания. Мы тоже видим за этим Творца, но это уже вопрос веры, а не биологии.'
  arguments:
  - science-conspiracy
  rhetoric:
  - straw-man

- id: lecture-4-4688
  start: 4688.8
  end: 4748.6
  text: 'Кстати, вам не нужно видеть конструктора, чтобы поверить, что он существует. Вы можете верить в дизайнера, никогда его не встречая. Я вам объясню. У меня есть часы Casio. Стоят 50 долларов. Сделаны в Японии. Это удивительный механизм. Он вмещает 150 телефонных номеров. Это калькулятор. Секундомер, будильник, счётчик. Он не говорит время. Вам нужно посмотреть на время для этого. Но это удивительное устройство. Но мне не нужно ехать в Японию и увидеть человека, кто сделал часы, чтобы поверить, что он существует. Будет логично, если я скажу: «Это удивительный механизм. И, я спорю, где-то есть умный конструктор». Логически. Встречу его или нет, не имеет никакого значения. И когда вы смотрите на природу, смотрите на мир, на Вселенную через телескоп или микроскоп, вы должны прийти к двум выводам. Есть конструктор. И он умён. Кто-то создал этот мир, друзья.'
  rating: green
  verdict: Мы тоже верим, что мир создан мудрым Творцом, и красота природы говорит об этом (Рим 1:20). Но из этого не следует, что Бог не мог творить через долгие природные процессы.
  arguments:
  - design-complexity

- id: lecture-4-4750
  start: 4750.4
  end: 4777.1
  text: Дьявол знает, что наука автоматически приведёт студентов ко Христу. Поэтому он работает очень тяжело, чтобы быть уверенным, что наука уведёт их от Христа. Поэтому всё усилие идёт на обучение теории эволюции. которая полностью лишена любого доказательства Нет никакого доказательства макроэволюции. Ноль. Но они продвигают её всё равно, потому что она помогает удерживать детей от Спасителя.
  rating: red
  verdict: 'Мы согласны, что наука может привести человека к Богу. Но эволюция не «лишена доказательств»: макроэволюцию подтверждают ископаемые, генетика и распространение видов, и многие учёные-христиане её принимают.'
  arguments:
  - microevolution-macro
  rhetoric:
  - loaded-language

- id: lecture-4-4777
  start: 4777.4
  end: 4811.0
  text: 'У Майкла Бихи есть прекрасная книга «Чёрный ящик Дарвина». Бихи — это известный микробиолог. Он посвящает целую главу описанию волоса бактерии. Волос бактерии способен двигать эту маленькую бактерию сквозь её среду эквивалентно человеку, бегущему 95 км/ч. Он объясняет, как сложен волос, и говорит: «Друзья, невозможно, чтобы это произошло само по себе. Оно должно быть кем-то задумано». Бихи, я предполагаю, продолжает верить в эволюцию. Но он не уверен, почему, ведь всё так сложно.'
  rating: orange
  verdict: Майкл Бихи действительно описал жгутик бактерии как «неупрощаемо сложный». Но он биохимик и принимает общее происхождение, в том числе людей и обезьян; а биологи показали, что части жгутика работают и по отдельности, в других системах.
  arguments:
  - design-complexity

- id: lecture-4-4812
  start: 4812.9
  end: 4839.1
  text: Эволюционисты очень виновны в чересчурном упрощении всего, относящегося к жизни. Они всё упрощают. Они не понимают. Дьявол одурачил их, даже этих блестящих учёных, которые понимают сложные вещи о Вселенной, о человеческом теле. об анатомии, о ботанике. Но они одурачены дьяволом, и они думают, что это должно было просто случиться. Потому что мы здесь. Дьявол обманывает их.
  rating: orange
  verdict: Что жизнь удивительно сложна, верно, и учёные знают это лучше всех. Но называть их «одураченными дьяволом» — не довод; эволюция не говорит, что жизнь «просто случилась».
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-4839
  start: 4839.2
  end: 4898.8
  text: 'Мне нравится показывать людям эту фотографию. И когда я показываю им эту фотографию, я задаю им вопрос: «Думаете ли вы, что это произошло случайно?» Они скажут: «Нет». Вы думаете, ветер мог сделать это? Эрозия, отслоение, тепловое расширение камня? Как это произошло? Они скажут: «Очевидно, это было придумано». О, это хорошо, очень хорошо. Теперь я хочу вам задать один вопрос. Думаете ли вы, что президент Вашингтон, например, произошёл случайно? Если они верят в эволюцию… Они должны ответить «да». Подождите, вы не думаете, что ихние лица могли случайно появиться на камне, но вы думаете, что вся сложная анатомия 50 триллионов клеток произошли случайно? Если вы верите в это, у меня к вам только один вопрос. Тупые ли вы ещё в какой-нибудь области? Друзья, это было придумано. Не нужно быть учёным, чтобы догадаться об этом.'
  rating: red
  verdict: 'Лица на горе Рашмор действительно высечены людьми. Но эволюция — не «случайность»: изменения у потомков случайны, а выживают и оставляют детей те, кому изменение помогло. Так фермер берёт на племя лучших, и порода меняется. А камень не размножается и ничего не передаёт потомкам.'
  arguments:
  - design-complexity
  rhetoric:
  - straw-man

- id: lecture-4-4899
  start: 4899.1
  end: 4935.7
  text: 'В этом учебнике говорится: «Кипящая вода в океанах содержит сложные химикаты. Прогресс химической смеси к живущему организму очень медленный». Вы думаете, что смесь просто ожила? Студентов учат, что неодушевлённые материалы ожили. Франческо Реди и Луи Пастер доказали, что это неправда. Этого не происходит, но эволюционист должен верить в самозарождение, чему нет никакого доказательства. У него нет другого выбора. Он должен верить, что неодушевлённый материал ожил. Было проведено множество экспериментов, пытающихся создать жизнь из неодушевлённых материалов.'
  rating: red
  verdict: Реди и Пастер действительно опровергли, что мухи и микробы заводятся сами в гниющей пище. Но гипотезы о химическом происхождении жизни говорят о других условиях и сроках; опыты Пастера их не касаются.
  arguments:
  - origin-of-life
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-4936
  start: 4936.0
  end: 4974.1
  text: 'В учебниках говорится: «Произошло много важных событий на протяжении архейской эры. Самым важным было возникновение жизни. Прогресс от сложных молекул к самому простому живущему организму является очень длинным процессом». Этого не произошло. Друзья, это пропаганда, они обманывают детей. В этом учебнике говорится: «Первые живущие клетки появились…» Они говорят «появились», как будто оно должно что-то значить. «…появились между четырьмя и тремя миллиардами лет назад». Нет никакого доказательства этого события. Хм, дети, вас на экзамене будут проверять, но этому нет никакого доказательства.'
  rating: red
  verdict: Как именно возникла жизнь, наука пока не знает. Но что она существовала 3,5 млрд лет назад, показывают древнейшие окаменелые микробы и строматолиты (слоистые каменные «подушки», которые строят колонии микробов); это данные, а не пропаганда.
  arguments:
  - origin-of-life
  rhetoric:
  - loaded-language

- id: lecture-4-4974
  start: 4974.5
  end: 5018.9
  text: «Первые самовоспроизводящиеся системы должны были появиться в этой органическом системе». Они говорят детям, что Миллер создал жизнь в лаборатории. Юри или Миллер? Подождите секунду. Вот что он сделал. Он взял несколько газов. Метан, аммиак, водяной пар и водород. Перемешал эти газы вместе и пропустил их через трубки. И при циркуляции там было место, где пробивала искра, предназначавшаяся для симуляции молний. С нижней стороны этого прибора был отсек для вылавливания всего, что сформируется. Он надеялся создать аминокислоты, которые являются строительными материалами для протеинов, протеины для клеток и клетки для жизни и ткань для жизни. Но у него произошла проблема. Он не доказал, как появилась жизнь.
  rating: orange
  verdict: 'Опыт Миллера 1953 года описан в целом верно. Но учебники не говорят, что Миллер «создал жизнь»: он показал, что аминокислоты могут образоваться из простых газов.'
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-4-5020
  start: 5020.3
  end: 5059.9
  text: Вообще-то проблема была намного хуже. Он не создал жизнь, потому что он исключил кислород. Видите, он забрал кислород из атмосферы, потому что жизнь не могла появиться в присутствии кислорода. При соединении всё сразу бы окислилось. Вот почему он сделал атмосферу без кислорода. Ну, с этим тоже есть проблема. Видите, озон состоит из кислорода. который блокирует ультрафиолетовый свет. И если вы не блокируете этот свет, то он уничтожит всё, что у вас есть. Жизнь невозможно создать без кислорода. Невозможно создать и с кислородом. И, как мне кажется, жизнь невозможно создать вообще.
  rating: red
  verdict: Что кислород разрушает многие органические молекулы, верно, и ранняя атмосфера кислорода почти не имела. Но от ультрафиолета защищает и толща воды, и минералы; «нельзя ни с кислородом, ни без» — не доказательство, а ложный выбор.
  arguments:
  - origin-of-life
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-5062
  start: 5062.0
  end: 5085.9
  text: Во-вторых, низшие слои камня, если даже ихняя тупая геологическая колонна права. Низшие слои сильно окислены. В них содержится больше кислорода, чем у нас сегодня. У нас около 21% кислорода. Но есть доказательства, что на Земле было 35%. Всё, что он сделал, было проблемой для эволюционистов. На Земле всегда был кислород. И каждый, кто изучает это, знает об этом.
  rating: red
  verdict: Что 300 млн лет назад кислорода в воздухе было больше, чем сейчас (около 35%), верно. Но в древнейших породах старше 2,4 млрд лет минералы показывают, что свободного кислорода тогда почти не было; «всегда был кислород» неверно.
  arguments:
  - origin-of-life
  rhetoric:
  - cherry-picking

- id: lecture-4-5087
  start: 5087.1
  end: 5111.5
  text: Миллер вообще-то отфильтровал продукт. С нижней стороны находился отсек, задерживающий продукт, чтобы он не циркулировал опять. Но это нереально для настоящей жизни. Он знал, что если вы… Что если бы он создал аминокислоты? Во второй раз они бы были уничтожены электрической искрой. Я думаю, что искра в 100 000 раз быстрее уничтожила бы их, чем создала новые. И выглядит как проигрышное дело для меня.
  rating: orange
  verdict: Ловушка в приборе Миллера действительно была, и критика упрощённости опыта справедлива. Но в природе продукты тоже уходят из зоны молний — в воду и осадки; цифра «в 100 000 раз быстрее разрушит» — личная догадка Ховинда.
  arguments:
  - origin-of-life

- id: lecture-4-5112
  start: 5112.3
  end: 5144.8
  text: В конце концов он получил 85% смолы и 13% карбоксиловой кислоты. Эти два вещества ядовиты для жизни и быстро соединяются с аминокислотами. Он добился успеха в производстве 2% аминокислот. Но опять он столкнулся с серьёзной проблемой. Он создал две аминокислоты, а для жизни необходимо двадцать. Эти вещества быстро соединяются со смолой или кислотой, и они никогда не соединяются друг с другом. Они соединяются со смолой. Э-э, Миллер был очень далеко от создания жизни.
  rating: orange
  verdict: 'Что в опыте Миллера образовалось много смолы, а до жизни очень далеко, верно. Но аминокислот было не две: уже в 1953 году нашли пять, а повторный анализ в 2008 году — 14 в том же опыте и 22 в его «вулканическом» варианте.'
  arguments:
  - origin-of-life

- id: lecture-4-5145
  start: 5145.5
  end: 5190.1
  text: Аминокислоты — это как буквы в алфавите. В английском алфавите только 26 букв. И есть только 20 аминокислот. Вы можете взять эти 26 букв и создать из них бесконечное количество слов. И нет границы тому, сколько страниц вы сможете написать, используя только 26 букв. И также, в зависимости от расположения, бесконечное число протеинов может быть произведено двадцатью аминокислотами. Но если вы начинаете бросать буквы на пол, чтобы создать параграф, чем больше букв в параграфе, тем меньше вероятности, что они произведут произвольно расположатся в порядке. Особенно учитывая, что они должны упасть лицевой стороной кверху. И если вы бросаете буквы и половина из них упадёт вверх ногами, у вас появится проблема.
  rating: orange
  verdict: 'Что белок — длинная упорядоченная цепочка и случайно сразу не соберётся, верно. Но молекулы — не буквы на полу: химические реакции идут не равновероятно, а первые цепочки, по гипотезам, были короткими и усложнялись постепенно.'
  arguments:
  - origin-of-life
  rhetoric:
  - false-analogy

- id: lecture-4-5190
  start: 5190.5
  end: 5213.4
  text: И что создал Миллер? Это половину правосторонних и половину левосторонних аминокислот. Это серьёзная проблема, так как в малейших протеинах находится от 70 до 100 аминокислот в чётком порядке. И все они левосторонние. Все молекулы ДНК и РНК — правосторонние. Этим экспериментом вы ничего не добьётесь, пытаясь создать жизнь в лаборатории.
  rating: orange
  verdict: 'Что в живых белках аминокислоты «левые», а опыт даёт смесь, верно. «Левые» и «правые» — как две перчатки: состав один, а форма зеркальная. Почему в живом только одна форма, пока открытый вопрос. Но «не решено» и «невозможно» — разные вещи.'
  arguments:
  - origin-of-life

- id: lecture-4-5214
  start: 5214.3
  end: 5241.8
  text: Если бы вы смогли, чтобы эти аминокислоты соединили протеины, они расщепляются в воде быстрее, чем они соединяются. Намного вероятнее, что они распадутся, чем они сойдутся. Понимаете вы или нет, но в океанах полно воды. Аж доверху. И броуновское движение разъединит эти молекулы друг от друга. И, конечно, они не соединятся. Нет, он не создал жизнь в лаборатории.
  rating: orange
  verdict: Что в воде цепочки аминокислот распадаются, верно. Поэтому учёные и рассматривают высыхающие лужи, поверхности минералов и горячие источники, где соединение идёт легче; шутка про «воду доверху» этих гипотез не касается.
  arguments:
  - origin-of-life
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-5242
  start: 5242.0
  end: 5287.5
  text: 'Но детей учат в учебниках: «Ребята, существует 20 видов аминокислот. Объясните, как этот факт…» А это факт? «…поддерживает идею, что всё живущее произошло от общего предка». Подождите минуточку. Это как если бы я пошёл в вашу библиотеку и показал вам, что каждая книга в вашей библиотеке состоит из только двадцати шести простых букв. Это доказывает, что все они произошли случайно? Нет, это доказывает, что интеллигентные люди были вовлечены в расположение этих букв в определённом порядке. И факт того, что все протеины в мире состоят из двадцати аминокислот, доказывает, что существует Творец, который написал код жизни.'
  rating: red
  verdict: Мы тоже верим, что Творец — автор жизни. Но у бактерии, гриба и человека одни и те же «буквы» ДНК означают одно и то же, как общие слова у родственных языков; это знак общего происхождения, а не «случайности». И выбор «общий предок или Творец» ложен — Бог мог творить через происхождение.
  arguments:
  - common-designer
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-5289
  start: 5289.4
  end: 5313.4
  text: Кстати, если бы это было не так, если бы все жизненные формы не произошли из двадцати основных аминокислот, тогда мы смогли бы есть только друг друга. Для того чтобы мы смогли есть помидор, он должен был бы изменён в человеческую клетку. И Бог должен был создать всё из одинаковых строительных материалов. Для того чтобы мы могли кушать разную пищу. Это здравый смысл.
  rating: orange
  verdict: 'Что мы можем питаться растениями и животными благодаря общим строительным веществам, верно, и мы видим в этом заботу Творца. Но это объяснение не исключает общего происхождения: одно другому не мешает.'
  arguments:
  - common-designer

- id: lecture-4-5314
  start: 5314.4
  end: 5376.7
  text: Эти люди говорят, что всё, что вам нужно, — это собрать все молекулы для жизни в одном месте и прибавить к ним энергию. Да? Если вы думаете, что всё, что вам необходимо для создания жизни, — это все молекулы в одном месте и энергия, Давайте проведём эксперимент. Давайте положим лягушку в соковыжималку. И включим её. Через секунду у вас будут все молекулы, необходимые для создания жизни. И в одном месте они будут. Теперь давайте добавим энергию. Давайте облучим их. Включим соковыжималку на миллион лет. Сколько понадобится времени, чтобы повторно собрать лягушку? Этого не случится. Если для создания жизни вам необходимо, чтобы все молекулы были в одном месте, пойдите в морг. Возьмите любое мёртвое тело. У вас будут все молекулы, необходимые для создания жизни человека. Не так ли? Э-э, что-то не так, правда? Жизнь не так уж и проста.
  rating: red
  verdict: Никто из учёных не утверждает, что лягушка или человек соберутся из молекул в миксере. Как возникла первая жизнь, пока не знают, но предположения учёных — о простейших молекулах, которые умели копировать себя и усложнялись очень постепенно.
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-4-5377
  start: 5377.9
  end: 5390.8
  text: 'Но в учебниках детям говорят: «Люди, вероятно, произошли от бактерий 4 млрд лет назад». Они говорят детям, что в этих семейных деревьях бактерия медленно развилась в человека. Всё это глупости.'
  rating: red
  verdict: Учебник говорит о происхождении всех живых существ от древних одноклеточных за миллиарды лет. Это подтверждают ископаемые и сравнение геномов; назвать это «глупостями» — не опровержение.
  rhetoric:
  - loaded-language

- id: lecture-4-5391
  start: 5391.9
  end: 5407.7
  text: 'Даже Мэри Лики знает это, и она верит в эволюцию. Стивен Гулд, профессор-марксист Гарвардского университета, сказал: «Эволюционные деревья в наших учебниках не основаны на ископаемых». Ископаемых доказательств эволюции нет. Но не в учебниках.'
  rating: red
  verdict: Гулд действительно писал, что ископаемые данные есть лишь на концах и в узлах эволюционных деревьев, а линии между ними — вывод. Но он же приводил переходные формы и защищал эволюцию; политические взгляды Гулда к делу не относятся.
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining
  - ad-hominem-pivot

- id: lecture-4-5408
  start: 5408.6
  end: 5427.8
  text: Правильно ли я это понимаю? Показывает ли это дерево, что у человека, у птицы и у крокодила был общий предок? Понимаю ли я это правильно? Этому они учат детей. Вам не нужно быть учёным, чтобы догадаться, что это разрушит чью-то веру в Библию.
  rating: purple
  verdict: 'Учебник действительно учит, что у человека, птиц и крокодилов был общий предок. Многие христиане это принимают и веру не теряют. А мы знаем тех, кто потерял её, услышав «или Библия, или наука», поэтому показываем: выбирать не обязательно.'
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-5429
  start: 5429.2
  end: 5442.9
  text: 'Иисус сказал: «А кто соблазнит одного из малых сих, верующих в Меня, тому лучше было бы, если бы повесили ему мельничный жернов на шею и потопили его в глубине морской». На суде Божьем придётся очень плохо каждому, кто учит эволюции.'
  rating: purple
  verdict: Слова Христа о соблазне малых (Мф 18:6) мы принимаем со всей серьёзностью. Но относить их ко всем учителям биологии — значит заранее считать эволюцию ложным учением; многие учителя-христиане учат ей с чистой совестью.
  rhetoric:
  - loaded-language

- id: lecture-4-5443
  start: 5443.3
  end: 5462.7
  text: В этом учебнике детям рассказывается о многих видах жизни. Всё множество жизненных форм на Земле произошло от общего предка, найденного в населении примитивных одноклеточных организмов. Но не осталось никаких событий. Вот снова доказательства нет, но вас будут проверять.
  rating: red
  verdict: 'Что ископаемого «самого первого предка» не найдено, верно. Но общее происхождение доказывают не одна находка, а совпадение многих данных: единый генетический код, общие гены и сходство «матрёшкой»: все позвоночные похожи, звери внутри них — ещё больше, обезьяны внутри зверей — ещё больше.'
  rhetoric:
  - textbook-authority

- id: lecture-4-5463
  start: 5463.1
  end: 5498.2
  text: Вообще, что такое примитивный одноклеточный организм? Живущий организм сложный. Он непримитивный. И, несомненно, он непростой. Меньше не значит проще. Парамекий чрезвычайно маленький. Их может поместиться тысячи в одной капле воды. Но они непростые. Каждый намного сложнее космического корабля. Вот микрочип в скрепке. Меньше — это сложнее. Вот муравей, который держит микрочип, который способен к обработке всех букв в Библии 200 раз за одну секунду.
  rating: orange
  verdict: Что любая клетка удивительно сложна, верно, и это повод славить Творца. Но «примитивный» в биологии значит «ранний, похожий на исходный», а не «простой»; путаница слов ничего не опровергает.
  arguments:
  - design-complexity
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-5500
  start: 5500.1
  end: 5550.3
  text: Меньше — это сложнее. Давайте сравним маленький мозг пчелы с насовским компьютером фирмы Крэй. Компьютер громадный. Пчелиный мозг маленький. Мы все согласимся, что есть разница в размере. Как насчёт скорости? Суперкомпьютер может обрабатывать 6 млрд калькуляций в секунду. Быстро. По подсчётам, пчела может обрабатывать триллион калькуляций в секунду. Пчелиный мозг быстрее суперкомпьютера в 166 раз. Как насчёт потребления энергии? Суперкомпьютер потребляет много мегаватт. Он очень неэффективный. Производит больше тепла, чем чего бы то ни было. Но пчелиный мозг потребляет только 10 микроватт.
  rating: orange
  verdict: 'Мозг пчелы действительно поразительно экономен. Но сравнение «триллион вычислений в секунду» взято неизвестно откуда, а мозг и компьютер работают по-разному; от этого не меняется главное: изумление сложностью не опровергает эволюцию.'
  arguments:
  - design-complexity
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-4-5552
  start: 5552.1
  end: 5612.2
  text: Пчела не только производит мёд. Она использует мёд как горючее, чтобы летать. И пчела может пролететь 400 000 км на одном литре мёда. Я хочу увидеть, как вы изобретёте машину, которая проедет 400 000 км на одном литре бензина. Мой Небесный Отец уже создал эту машину. Он умный? Как насчёт стоимости? Компьютер стоит 48 млн. Пчелиный мозг дешёвый. Пчёлы всегда разбиваются в лобовое стекло. Как насчёт обслуживающего персонала? О, много людей потеют, когда ломается суперкомпьютер. Никто не помогает пчеле, она лечится сама. Я хочу увидеть, как вы придумаете компьютер, который исправляет все свои поломки. Заменяет свой экран. Или хард-драйв, или клавиатуру. Самоисправляющийся компьютер. Неплохо, м? Как насчёт веса? Пчелиный мозг весит немного. Суперкомпьютер весит 1 035 кг с существенной системой охлаждения.
  rating: orange
  verdict: Мы тоже восхищаемся пчелой как творением Божьим. Но цифра «400 000 км на литре мёда» приведена без источника, а сравнение с суперкомпьютером по цене и весу показывает мудрость Творца, но не опровергает эволюцию.
  arguments:
  - design-complexity

- id: lecture-4-5613
  start: 5613.4
  end: 5645.3
  text: Давайте посмотрим. Суперкомпьютер громадный, медленный, неэффективный, стоит много денег, нужно следить за тупой вещью. И он был придуман. Нет ни у кого хотя бы с половиной мозгов, кто бы сказал, что суперкомпьютер произошёл от взрыва на электронной фабрике. Есть такие? Но они разворачиваются и говорят, что пчела произошла Подумайте об этом ещё один раз. Дьявол смеётся с вас за веру в его обман. И человеческий мозг в миллион раз сложнее пчелиного.
  rating: red
  verdict: Эволюция — не «взрыв на фабрике». Суперкомпьютеры не размножаются и не передают изменения потомкам, а пчёлы — да; поэтому их происхождение объясняется иначе. Шутка о «половине мозгов» — не довод.
  arguments:
  - design-complexity
  rhetoric:
  - straw-man

- id: lecture-4-5647
  start: 5647.2
  end: 5682.0
  text: 'Друзья мои, удивительно созданы. Когда я проводил дебат, я спросил одного профессора: «Сэр, человеческий мозг весит около одного килограмма. Верите ли вы, что ваш мозг — это ничего, кроме одного килограмма химикатов, которые случайно упорядочились на протяжении миллиардов лет?» Он сказал: «Да, я верю». Я сказал: «Тогда у меня к вам есть один вопрос, сэр. Если ваш мозг не представляет ничего, кроме кучи химикатов, то как вы можете доверять вашим мыслям и заключениям? Может быть, у вас несколько химикатов задом наперёд?»'
  rating: orange
  verdict: 'Вопрос, можно ли доверять разуму, если он возник естественно, серьёзный, и его обсуждают христианские философы (например, Алвин Плантинга). Но эволюция — не «случайное упорядочивание химикатов»: изменения случайны, но сохраняются те, что помогают выжить и оставить потомство.'
  rhetoric:
  - straw-man

- id: lecture-4-5684
  start: 5684.7
  end: 5717.5
  text: Видите ДНК. Рибонуклеиновая кислота, лучше известная как хромосомы, является самой сложной молекулой во всей Вселенной. В среднем 50 триллионов клеток находится в человеческом теле. Если вы извлечёте все ДНК из каждой клетки, то вы наполните этими ДНК около двух столовых ложек. Но если вы возьмёте эту неимоверно сложную молекулу и растянете её от конца к концу, то ДНК одного человека составляет две ложки, растянется от Земли до Луны и обратно 5 млн раз.
  rating: red
  verdict: 'ДНК — удивительная молекула, и мы тоже этим восхищаемся. Цифры у Ховинда неточны (хромосомы — это ДНК с белками, а ДНК тела дотянулась бы до Луны и обратно около 100 тысяч, а не 5 млн раз), но главное: удивительное устройство не опровергает эволюцию.'
  arguments:
  - design-complexity

- id: lecture-4-5719
  start: 5719.1
  end: 5747.0
  text: Этот кодекс ДНК находится в вашем теле прямо сейчас. Если вы распечатаете этот удивительный кодекс ДНК, вы найдёте, что он намного сложнее всех компьютерных программ, составленных человеком. Он неимоверно сложный. Эта молекула непостижима. Если вы распечатаете кодекс, найденный в ДНК вашего тела, когда вы закончите печатать, у вас будет достаточно книг, чтобы заполнить Великий каньон 40 раз.
  rating: orange
  verdict: 'Что ДНК хранит огромный объём сведений, верно. Но у всех клеток один и тот же геном: распечатанный, он займёт около сотни томов, а не 40 Больших каньонов.'
  arguments:
  - design-complexity
  rhetoric:
  - scale-trick

- id: lecture-4-5748
  start: 5748.5
  end: 5774.6
  text: Э-э, кто-то здесь работает с компьютерами? Я хочу увидеть, как вы сможете сконденсировать 40 великих каньонов э-э… в программу. CD-ROM, PKZIP, SciQuest. Мне всё равно, что вы будете использовать, но когда вы закончите, это должно поместиться в две столовые ложки. Мой Небесный Отец уже сделал это. Он умён, не правда? И не только это. Молекула может произвести хорошую копию самой себя.
  rating: orange
  verdict: ДНК действительно хранит сведения очень плотно и копирует себя; это повод восхищаться Творцом. Но то, что ДНК копирует себя с небольшими ошибками, и есть основа эволюции, а не довод против неё.
  arguments:
  - design-complexity

- id: lecture-4-5776
  start: 5776.6
  end: 5798.9
  text: Кстати, вы — это копия копии копии копии копии копии копии Адама. Возьмите любую компьютерную программу и сделайте копию. Возьмите эту копию. И сделайте ещё одну копию копии. И сделайте ещё одну копию копии, и сделайте так только 50 раз. Тогда возьмите пятидесятую копию, поставьте её в компьютер и запустите.
  rating: orange
  verdict: Копирование ДНК действительно очень точное, и в нём есть механизмы исправления ошибок. Но небольшие ошибки при копировании всё же бывают, и вредные отсеивает отбор; поэтому сравнение с испорченной программой не работает.
  arguments:
  - design-complexity
  rhetoric:
  - false-analogy

- id: lecture-4-5802
  start: 5802.3
  end: 5811.8
  text: 'Это то, что сделал Бог, друзья. Давид сказал: «Славлю Тебя, потому что я дивно устроен». У него даже не было микроскопа. И он понимал это?'
  rating: neutral
  verdict: 'Пс 138(139):14: «Славлю Тебя, потому что я дивно устроен». Мы разделяем это благоговение.'

- id: lecture-4-5812
  start: 5812.4
  end: 5834.2
  text: От зачатия до рождения к телу ребёнка прибавляется 15 000 клеток в минуту. Каждая клетка намного сложнее космического корабля. Хотели бы вы работать на фабрике, выпускающей 15 000 космических кораблей в минуту? На протяжении девяти месяцев. Вы ужасно устанете, когда вы закончите, не правда ли?
  rating: orange
  verdict: Что зародыш растёт удивительно быстро, верно. Но цифра «15 000 клеток в минуту» многократно занижена — к рождению у ребёнка триллионы клеток; а сравнение с «космическими кораблями» говорит о чувстве, а не о доводе.
  arguments:
  - design-complexity
  rhetoric:
  - scale-trick

- id: lecture-4-5837
  start: 5837.1
  end: 5860.6
  text: 'Вероятность случайного появления только одной молекулы ДНК, по подсчётам, составляет один шанс на 10 в 119-тысячной степени. Этого не происходит? Один профессор сказал мне: «Если бы случайно произошла только одна ДНК, эволюция продолжила бы появление остальных». Я сказал: «Я не верю, что одна ДНК произойдёт случайно». Ну, я вам дам одну. Я вам дам две.'
  rating: red
  verdict: 'Как возникла первая жизнь, пока не знают. Но Ховинд посчитал шанс того, во что никто не верит: что готовая ДНК собралась целиком за один раз. Это как считать, что дом сложится сам, хотя его строят по кирпичу.'
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-4-5861
  start: 5861.4
  end: 5976.3
  text: 'Я исследовал это. Я заметил, что чем больше у вас хромосом, тем вы сложнее. И таким образом вы более развиты. Я начал располагать некоторые вещи в порядке, основываясь на количестве хромосом, чтобы доказать, как произошла эволюция. Я обнаружил, что у пенициллина две хромосомы. Должна быть простейшая форма жизни. Медленно, через миллиарды лет, у него откуда-то появились ещё немного, и он медленно превратился в фруктовую муху. И тогда через миллионы, миллионы и миллионы лет медленно развился в помидор или домашнюю муху. Они близнецы, понимаете? И тогда очень медленно, через миллионы лет, развился в горох. И тогда очень медленно, через миллионы лет. Это секрет, ребята. Медленно он стал пчелой. И тогда медленно, через миллионы лет, у нас появилась тройняшка. Вы знали, что у опоссума, секвойи и бобов по 22 хромосомы? Средний учёный не может различить, что есть что. Давайте посмотрим дерево. Опоссум, боб. Э-э, что из них что? И тогда медленно, через миллионы лет, у нас появилось ещё несколько хромосом, и мы стали человеком. Вот здесь — 46. Э-э, нам бы ещё только две хромосомы, и мы можем стать табаком. Я знаю некоторых, у которых уже такой запах. Иногда, когда они заходят в лифт, я скажу: «Ну вы и развиваетесь. Вы уже перегнали меня! Как это у вас получилось?» И тогда очень медленно у вас может быть достаточно хромосом, чтобы вы стали картофелем. Девяносто. Вы не знали, что они такие сложные, правда? И когда-то в далёком, в далёком будущем — не случится при моей жизни. Может, в каком-то звёздном веке у нас будет достаточно хромосом, чтобы мы стали папоротником.'
  rating: red
  verdict: Биология не утверждает, что чем больше хромосом, тем организм «развитее»; число хромосом мало связано со сложностью. Поэтому пародия с пенициллом, горохом и табаком опровергает то, чего никто не говорил.
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-5977
  start: 5977.6
  end: 5988.9
  text: 'Когда я был в церкви после служения, ко мне подошла женщина и сказала: «Мистер Ховинд… я папоротник». Я пожал ей руку вот этой рукой. Я её больше не буду мыть.'
  rating: neutral
  verdict: Шутка о «женщине-папоротнике».

- id: lecture-4-5990
  start: 5990.7
  end: 6003.8
  text: 'Почему детей не учат количеству хромосом? А? Не подходит к теории эволюции, вот почему. Они скажут детям: «У нас есть доказательства молекулярной биологии». Да, мальчики и девочки. Последовательность ДНК доказывает это.'
  rating: red
  verdict: 'Число хромосом в учебниках не скрывают: его приводят в каждой главе по генетике. Оно просто не служит мерой «развитости», и эволюция не предсказывает, что должно.'
  arguments:
  - science-conspiracy
  rhetoric:
  - straw-man

- id: lecture-4-6004
  start: 6004.2
  end: 6020.9
  text: 'В этом учебнике говорится: «Дарвин предполагал, что все жизненные формы связаны между собой. Это предположение было проверено». Извините, что вы имеете в виду? Вы имеете в виду, что теория Дарвина была доказана? Это пропаганда, друзья. Кстати, это в учебнике колледжа.'
  rating: red
  verdict: 'Учебник говорит верно: гипотезу Дарвина о родстве всех живых существ проверили сравнением белков и ДНК, и она подтвердилась. Назвать это «пропагандой» — не довод.'
  rhetoric:
  - loaded-language

- id: lecture-4-6022
  start: 6022.1
  end: 6053.4
  text: Что они делают? Они берут последовательности аминокислот разных животных, растений и подобных вещей и располагают их, основываясь на ихнем различии. Вообще-то известно очень мало о последовательности аминокислот и о большинстве подобных вещей. Однако они нашли, что человек отличается от утки только на 11%. Вам до утки только 11%. Вы могли бы лететь на юг на зиму. Кто-то из вас хотел бы провести зиму на юге?
  rating: red
  verdict: 'Сравнение одного и того же белка, который есть почти у всех живых, у разных видов действительно делали, и порядок различий совпал с порядком родства, найденным по анатомии и ископаемым. «Известно очень мало» — неверно: сейчас прочитаны целые геномы.'
  arguments:
  - common-designer
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-6054
  start: 6054.7
  end: 6070.9
  text: 'Последовательность ДНК. Это должно быть доказательством эволюции. Но эксперты, которые понимают это, говорят: «Это доказательство эволюции может быть только творческим воображением». Вам нужно вообразить, что это доказывает вашу теорию.'
  rating: red
  verdict: Безымянных «экспертов» проверить нельзя. А родство животных сначала определили по костям, потом независимо — по ДНК, и получилось одно и то же дерево. Без общего происхождения такого совпадения ждать не с чего.
  arguments:
  - common-designer
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-4-6071
  start: 6071.1
  end: 6104.2
  text: 'Но в учебнике вам скажут: «Ребята, человек и орангутан похожи на 96%. Это доказывает, что у них был общий предок 15 млн лет назад». Но подождите минуточку. Это может значить, что сходство в кодексе ДНК доказывает, что у них был один создатель. Один и тот же конструктор написал код. Это не является доказательством общего предка. Вы не скажете, что потому что все программы Microsoft похожи друг на друга, это доказывает, что они произошли от азбуки Морзе. Нет, это доказывает, что их придумал один конструктор.'
  rating: red
  verdict: 'Что сходство можно объяснить и общим замыслом, — честное возражение. Но у человека и обезьян совпадают и «ошибки»: одинаково испорченный ген витамина C, одни и те же вирусные вставки в ДНК. Если в двух рукописях одни и те же опечатки в тех же местах, одну переписали с другой или обе — с общего образца.'
  arguments:
  - common-designer
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-6104
  start: 6104.8
  end: 6132.6
  text: 'Была определена функция только одного процента, некоторые говорят, что трёх, человеческого ДНК. Никто не знает функции остальных 99%. Они проанализировали только один процент. И если 99% этого 1% похоже на шимпанзе, это ничего не доказывает. Подождите, пока они проанализируют всё ДНК. И даже тогда, если они будут похожими, я скажу: общий создатель. Это всё, что это доказывает.'
  rating: red
  verdict: В 1990-х годах ДНК человека действительно была прочитана лишь частично. Но сегодня геномы человека и шимпанзе прочитаны полностью, и сходство подтвердилось. Мы тоже верим, что за всем стоит Творец, но ответ «так задумал Творец» подходит к любой находке, а общее происхождение заранее предсказало, какие совпадения найдутся.
  arguments:
  - common-designer

- id: lecture-4-6134
  start: 6134.1
  end: 6157.4
  text: Если вы возьмёте сходство в сборочных инструкциях производства Dodge Caravan и сравните их со сборочными инструкциями производства Plymouth Voyager, вы увидите, что они похожи на 99%. Доказывает ли это, что ихним предком был Фольксваген? Нет, это доказывает, что один и тот же человек написал инструкции, правда?
  rating: orange
  verdict: Что похожие инструкции пишут одни и те же люди, верно. Но машины не размножаются и не передают ошибки по наследству; у живых существ общие ошибки в ДНК указывают на общих предков.
  arguments:
  - common-designer
  rhetoric:
  - false-analogy

- id: lecture-4-6158
  start: 6158.0
  end: 6179.5
  text: Между человеком и обезьяной сотни различий. Они умышленно выбрали для рассмотрения несколько похожих вещей. И обучают этому в классах, доказывая, что у нас с обезьянами общий предок. Они не упоминают о различиях, которых насчитывается тысячами. В зависимости от того, что вы хотите сравнивать, вы можете сравнивать разные вещи и приходить к разным выводам.
  rating: red
  verdict: Различий между человеком и обезьянами действительно много, и учёные о них пишут. Но родство определяют по всему геному, а не по нескольким выбранным признакам; «умышленно скрывают различия» — домысел.
  arguments:
  - common-designer

- id: lecture-4-6179
  start: 6179.9
  end: 6204.6
  text: Кто-то сказал, что человеческий цитохром C, близкий, близок к подсолнечнику. Человеческий глаз близок к осьминогу. Если сравнивать удельный вес крови, то вы ближе всего к кролику или к свинье? Если сравнивать человеческое молоко, то вы родственны с ослом. Если бы не было никаких сходств, мы могли бы есть только друг друга. Бог сотворил всё, и поэтому мы можем есть почти всё. Это жизнь?
  rating: red
  verdict: По одному признаку действительно можно найти странное сходство. Поэтому родство и определяют по согласию тысяч признаков сразу; и по ним человек ближе всего к шимпанзе, а не к ослу или подсолнечнику.
  arguments:
  - common-designer
  rhetoric:
  - cherry-picking

- id: lecture-4-6205
  start: 6205.1
  end: 6249.2
  text: 'Однако, если вы думаете, что сходства что-то доказывают… Я хочу познакомить вас с моим исследованием. Я провёл многолетнее обширное исследование, основанное на содержании воды в разных объектах. В моём исследовании я обнаружил, что облако состоит из 100% воды. Арбузы из 97% воды. Только 3% разницы. Очень близкие родственники. Это доказывает, что арбузы произошли из облаков. Не только это, я нашёл потерянное звено: медуза. 98% воды. И, верите или нет, снег. Они идентичны. Вы никогда не узнаете разницу между медузой и снегом.'
  rating: red
  verdict: Содержание воды — не наследственный признак, поэтому «родство арбуза и облака» — карикатура. Биологи сравнивают последовательности генов, которые передаются от родителей детям.
  arguments:
  - common-designer
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-6252
  start: 6252.4
  end: 6287.7
  text: 'Они говорят, у нас есть свидетельства ископаемых. Дарвин в своей книге написал: «Если моя теория правильна, бесчисленные промежуточные разновидности наверняка должны были существовать». Ну и нашли они их? Давайте посмотрим, что говорят эксперты. Дэвид Рауп, известный эволюционист, говорит: «Во времена после Дарвина его защитники надеялись найти предсказуемые продвижения. Но они не были найдены. И чистая фантазия закралась в учебники». Ты имеешь в виду, что в учебниках фантазия? Дэвид, ты говоришь, что в наших учебниках находится обман? О да.'
  rating: red
  verdict: 'Рауп в 1981 году писал о том, что летопись не показывает плавного «прогресса», которого ждали, а не о том, что переходных форм нет. С тех пор найдено много переходных форм: тиктаалик (рыба с шеей и подобием локтей в плавниках), древние киты с ногами, пернатые динозавры.'
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining

- id: lecture-4-6288
  start: 6288.3
  end: 6322.6
  text: Они покажут детям эволюцию лошади. Вы видели что-либо подобное? Лошадь, происходящая от четырёхпалого предка, — это в каждом учебнике биологии. Минуточку, они должны говорить детям правду. Настоящая правда — это то, что у эогиппуса было 18 пар рёбер. У следующей лошади было только пятнадцать. Большое изменение, не думаете ли вы? У следующей было 19. О, прибавилось 4. И тогда назад к восемнадцати. Они не говорят детям, что и сегодня существует большое разнообразие лошадей. Есть много разновидностей лошади прямо сегодня, друзья.
  rating: orange
  verdict: Ряд предков лошади действительно не прямая линия, а ветвистый куст, и число рёбер у разных ветвей разное. Но смена пальцев, зубов и размеров у ископаемых лошадей по слоям хорошо прослеживается; куст не отменяет родства.
  arguments:
  - horse-evolution
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-6323
  start: 6323.3
  end: 6346.7
  text: Эти примеры, как эволюция лошади, не выстояли перед тщательной экзаменацией. Любой, кто понимает эволюцию лошади, знает, что всё это чепуха. Многие общеассоциируемые примеры, как эволюция семейства лошади, являются неумышленно фальсифицированными. Вы имеете в виду, что они обманывают детей? Да? Потому что у них нет ничего другого для замены.
  rating: red
  verdict: Что старые схемы «прямой лестницы» лошадей упрощены, говорят и сами палеонтологи. Но они заменили их ветвистым деревом, а не отказались от эволюции лошади; цитаты без имён этого не показывают.
  arguments:
  - horse-evolution
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-4-6347
  start: 6347.2
  end: 6371.0
  text: 'Вот проблема с этой эволюцией лошади. Человек по имени Отниел Марш придумал это всё в 1874 году. Когда они все были готовы на всё, чтобы найти доказательства теории Дарвина. Они придумывали доказательства, как делал Геккель. Марш сделал тоже. Он собрал животных со всего мира и расположил их в том порядке, в котором он хотел, чтобы они произошли: от маленьких к большим. Мы улучшаемся, увеличиваем, умнеем.'
  rating: red
  verdict: Марш действительно составил ряд лошадей в 1870-х годах, но по ископаемым из Северной Америки, лежавшим в слоях в том же порядке. С тех пор найдены сотни новых находок, и ряд уточнён, а не опровергнут.
  arguments:
  - horse-evolution
  rhetoric:
  - loaded-language

- id: lecture-4-6371
  start: 6371.4
  end: 6390.3
  text: 'Но они так и не найдены. Современные лошади найдены в слоях с так называемой древней лошадью. Древняя лошадь — это вообще не лошадь, это даман, живущий в Южной Америке даже сегодня. Есть много различий у этих разных животных, которых они помещают в последовательности: разные рёбра, зубы, пальцы — они не были найдены в таком порядке.'
  rating: red
  verdict: 'Гиракотерий (эогиппус) — не даман: у него другие зубы и строение, и живут даманы в Африке и Азии, а не в Южной Америке. Современные лошади в слоях с эогиппусом не найдены.'
  arguments:
  - horse-evolution

- id: lecture-4-6390
  start: 6390.9
  end: 6406.5
  text: 'И зоопарк Тулсы в конце концов снял свою выставку. Человек по имени Дан Хигс написал им письмо. «Почему у вас до сих пор выставлена эволюция лошади?» Директор ответил: «Потому что нам не дали денег, чтобы снять её». Нет денег, чтобы снять плохую выставку.'
  rating: orange
  verdict: Что зоопарк Тулсы убрал старую выставку, возможно; это не проверить. Но и смена выставки не значит, что эволюция лошади опровергнута; в научных музеях её показывают в уточнённом виде.
  arguments:
  - horse-evolution
  rhetoric:
  - personal-story

- id: lecture-4-6408
  start: 6408.3
  end: 6425.5
  text: В Пибодском музее в штате Коннектикут до сих пор показывают эволюцию лошади. Каждый раз, когда я посещаю музей, я вижу эту глупую выставку. Когда я стоял возле этой выставки, мимо неё проходили сотни школьников. Но им не говорили, что это неправда.
  rating: orange
  verdict: Выставка в музее Пибоди Йельского университета показывает настоящие ископаемые. Назвать её «глупой» — оценка, а не довод.
  arguments:
  - horse-evolution
  rhetoric:
  - loaded-language

- id: lecture-4-6426
  start: 6426.7
  end: 6447.9
  text: 'Если кто-то из вас живёт возле этого музея и вы смотрите сейчас эту кассету, вам нужно набрать много брошюр или видеокассет и начать служение. Когда дети выходят из музея, дайте им видео. Дайте книгу. Кассету, брошюру. Дайте им что-то, чтобы они узнали, что их только что обманули. Или когда они заходят, предупредите их: этот плакат неверный.'
  rating: neutral
  verdict: Призыв раздавать креационистские материалы у входа в музей.

- id: lecture-4-6449
  start: 6449.7
  end: 6475.8
  text: То, что вы можете расположить животных на бумаге в любом порядке, ничего не доказывает. Даже захороненные животные в определённом порядке ничего не доказывают. Если вы находите ископаемое в земле, вы не знаете, имело ли оно вообще предков или какое-то потомство. Порядок не имеет никакого значения. Если меня похоронят над хомяком, доказывает ли это, Что он мой дедушка? Нет.
  rating: red
  verdict: Что одна кость не говорит, были ли у животного потомки, верно. Но порядок ископаемых повторяется во всём мире, и он совпадает с деревом родства, найденным по ДНК живых видов; хомяк над человеком такого не даёт.
  arguments:
  - transitional-forms
  rhetoric:
  - false-analogy

- id: lecture-4-6476
  start: 6476.5
  end: 6524.1
  text: Я провёл исследование по этому поводу. Если вы думаете, что расположение вещей что-то доказывает, я начал располагать столовые приборы, чтобы изучить эволюцию. После интенсивного исследования я обнаружил, что первыми появились ножи. И тогда очень медленно, через миллионы лет, они изменились в ложку. Большое давление раздавило их, выгнуло и округлило. И тогда эрозия медленно разъела трещины на концах. Заняло миллионы лет, ребята, долгое время. Я знал, что они были расположены правильно, но мне не хватало одного звена. Особенно между ложкой и вилкой. Видите, ложки закруглённые и без углублений. Вилки квадратные и с углублениями. Это два прыжка за один раз, поэтому я знал, что существует потерянное звено, которого я не мог найти.
  rating: orange
  verdict: Шутка про ножи, ложки и вилки смешна, но столовые приборы не рождаются друг от друга. Ряды ископаемых строят не по сходству формы на глаз, а по слоям, анатомии и затем проверяют по ДНК живых родственников.
  arguments:
  - transitional-forms
  rhetoric:
  - false-analogy

- id: lecture-4-6525
  start: 6525.2
  end: 6585.8
  text: 'Однажды я летел в Коннектикут для проповеди. Я находился 1000 м над землёй, когда стюардесса подошла ко мне и вручила потерянное звено. Я не думаю, что она знала об этом. Но мой натренированный глаз учёного сразу это заметил. Ну, я сказал: «Вот это да». Я положил это в свой карман. Позднее мы пошли в ресторан. Там я нашёл ещё одно звено. Вот они здесь. Эволюция столовых приборов подходит к завершению. Это значит, что я готов к получению государственных денег. Мне нужно около $50 млн для завершения этого важного исследования на пользу человечеству. Я, наверное, получу их, правда? Вы знаете, что наше государство потратило $385 000, изучая, почему у аборигенов плохой запах? Я бы сказал им за $5. Они не моются. Никогда.'
  rating: neutral
  verdict: Продолжение шутки о «недостающем звене» столовых приборов и шутки о государственных расходах на науку. Насмешку над целым народом мы не повторяем; на довод это не влияет.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-6587
  start: 6587.0
  end: 6598.6
  text: Вы можете расположить буквы в порядке и доказать всё, что хотите. Вы можете изменить кот в кол, в пол, в пел, в пёс. И если вы будете заниматься этим достаточно долго, вы можете превратить себя в дурака.
  rating: orange
  verdict: 'Цепочку слов «кол — пол — пел — пёс» можно составить произвольно, это верно. Но ряды ископаемых не произвольны: они идут в том порядке слоёв, который предсказывает дерево родства, и новые находки этот порядок не ломают.'
  arguments:
  - transitional-forms
  rhetoric:
  - false-analogy

- id: lecture-4-6599
  start: 6599.8
  end: 6624.5
  text: 'Теперь они говорят детям, что птицы — это потомки динозавров. Слышали вы об этом? Птицы произошли от динозавров. Ребята, если вы не знаете, есть несколько различий между динозавром и птицей. Вы не ставите несколько перьев на динозавра и не говорите: «Давай, лети!» Это не так просто. Друзья.'
  rating: red
  verdict: Никто не говорит, что динозавру приклеили перья и он полетел. Найдены десятки пернатых динозавров (например, в Китае), и по ним видно, как перья, лёгкие кости и крылья появлялись постепенно, задолго до полёта.
  arguments:
  - transitional-forms
  rhetoric:
  - straw-man

- id: lecture-4-6626
  start: 6626.1
  end: 6663.0
  text: Видите, птицы покрыты перьями. Рептилии покрыты чешуёй. У птиц две ноги и два крыла. У рептилии четыре ноги. Если эти две передние ноги превратятся в крылья, кроме этого должно измениться множество других вещей. Должна появиться мышечная система, система циркуляции, нервная система, навигационная система, мозг динозавра должен контролировать полёт, что очень сложно. Множество изменений. Вдобавок на пути превращения в птицу, когда у него будет что-то между лапой и крылом, он не сможет ни бегать, ни летать. У него появится проблема, не так ли?
  rating: red
  verdict: 'Что перейти от лапы к крылу непросто, верно. Но промежуточная конечность полезна: ею можно ловить добычу, взбегать по склону, планировать, — это наблюдают и у нынешних птиц; и такие формы найдены среди ископаемых.'
  arguments:
  - transitional-forms
  rhetoric:
  - argument-by-incredulity

- id: lecture-4-6664
  start: 6664.4
  end: 6682.8
  text: 'Понимаете, птицы покрыты перьями. Рептилии покрыты чешуёй. Э-э, в учебнике говорится: «Птичье оперение произошло от защитной чешуи динозавров». О, это же обман. Чё-то воображение не знает пределов. Его нужно лечить.'
  rating: red
  verdict: Назвать учебник «обманом» — не довод. Перья и чешуя растут из сходных зачатков в коже и управляются родственными генами, а у пернатых динозавров видны простые нитевидные перья — промежуточный этап.
  arguments:
  - transitional-forms
  rhetoric:
  - loaded-language

- id: lecture-4-6686
  start: 6686.8
  end: 6715.0
  text: Перья чрезвычайно сложные. Они состоят из одного и того же протеина, что и чешуя. Но это не доказывает об общем предке. Это доказывает об общем инженере. Военный корабль и вилка сделаны из одинакового металла. Это не доказывает, что они произошли от железной консервы. На это есть два взгляда. С какой скоростью бежал телёнок? Это доказывает, что у них общий создатель.
  rating: orange
  verdict: Перья действительно сложны и состоят из того же белка, что и чешуя. Но корабль и вилка не размножаются; у живых существ общий белок и общие гены, которые его строят, указывают на родство. Одно не исключает Творца.
  arguments:
  - common-designer
  rhetoric:
  - false-analogy

- id: lecture-4-6716
  start: 6716.5
  end: 6730.3
  text: Лёгкие птицы отличаются от лёгких рептилий. Есть тысячи различий. И снова эволюционисты виновны в грубом упрощении проблемы изменения одного вида животного в другой. Всё очень сильно упрощено.
  rating: orange
  verdict: Что различий между птицами и рептилиями много, верно. Но у хищных динозавров (родни тираннозавра) уже были воздушные мешки, как у птиц, через которые воздух гонится по лёгким в одну сторону, — это видно по их костям; различия не так резки, как говорит Ховинд.
  arguments:
  - transitional-forms
  rhetoric:
  - argument-by-incredulity

- id: lecture-4-6732
  start: 6732.1
  end: 6769.2
  text: Вот проблемы с эволюцией рептилии к птице. Первое. Большая разница между лёгкими. Птицы найдены в слоях с динозаврами. Как же они могут быть предками, если они существовали в одно и то же время, даже по их неизвращённой геологической колонне? Чешуя и перья присоединены к телу по-разному. Они происходят от разных генов на хромосомах. У птиц четырёхкамерное сердце, у большинства рептилий только трёхкамерное. У рептилий кожаные яйца, у птиц яйца с твёрдой оболочкой. Тысячи различий. И эксперты знают, что нет никакого доказательства того, что рептилия могла превратиться в птицу. Но они говорят детям в школе, что оно есть.
  rating: red
  verdict: 'То, что птицы жили одновременно с другими динозаврами, не мешает родству: двоюродные родственники живут вместе. Многие «различия» сглажены находками: у ископаемых динозавров есть перья, птичьи лёгкие и твёрдые яйца.'
  arguments:
  - transitional-forms
  rhetoric:
  - straw-man

- id: lecture-4-6770
  start: 6770.5
  end: 6792.1
  text: Они покажут им фотографию ископаемого под названием археоптерикс. Вы слышали о таком ископаемом? Было найдено только шесть. Все были в Германии в одном месте. Только один был разрезан или вскрыт для изучения. Ископаемое археоптерикс, похожее на птицу размером с голубя. Длиной около 30 см.
  rating: orange
  verdict: Археоптериксов в 1990-х годах действительно было известно немного, и все они из Баварии. Сегодня их больше десятка, а главное — найдены десятки других переходных форм между динозаврами и птицами.
  arguments:
  - transitional-forms
  rhetoric:
  - cherry-picking

- id: lecture-4-6792
  start: 6792.9
  end: 6823.7
  text: 'Они говорят: Ребята, посмотрите на эту птицу. У неё есть когти на крыльях. Это доказывает, что она была динозавром. Извините меня, но сегодня у двенадцати птиц есть когти на их крыльях. У страуса, например, я не могу назвать их всех. Но есть двенадцать птиц с когтями на крыльях. Я хочу сказать, что переход от крыльев с когтями к крыльям без когтей будет потерей. Это не будет прибавлением. Так что происходит эволюция? Вы теряете всё, пока не получите всё.'
  rating: red
  verdict: 'Когти на крыльях есть у некоторых птиц, это верно. Но археоптерикс интересен сочетанием признаков: зубы, длинный костистый хвост, пальцы с когтями и перья одновременно. А потеря признака тоже бывает частью эволюции.'
  arguments:
  - transitional-forms
  rhetoric:
  - straw-man

- id: lecture-4-6825
  start: 6825.0
  end: 6860.3
  text: 'Тогда они скажут: В клюве птицы есть зубы. Видите эти зубы? Это доказывает, что она была динозавром. Извините, но у некоторых птиц есть зубы, у большинства нет. У некоторых рептилий есть зубы, у некоторых нет. У некоторых млекопитающих есть зубы, у некоторых нет. У некоторых из вас есть зубы, у некоторых нет. Это не доказывает, что все они были динозаврами. И снова я хочу подчеркнуть, что переход от зубов к неимению зубов — это потеря, не прибавление. Почему-то они думают, что если вы потеряете всё, что у вас есть, у вас будет всё? Эволюция так не происходит.'
  rating: red
  verdict: У ныне живущих птиц зубов нет, хотя гены для их развития сохранились в «выключенном» виде. Зубы археоптерикса — один из многих признаков его родства с динозаврами, а не единственный довод.
  arguments:
  - transitional-forms
  rhetoric:
  - straw-man

- id: lecture-4-6861
  start: 6861.7
  end: 6889.3
  text: Когда я ходил в школу, нас учили, что у человека был хвост. Но он потерял его, потому что он не нужен. Я подумал, не нужен. Вы когда-то думали, каким полезным был бы хвост? Вы когда-нибудь подходили к двери с сумками в двух руках? Было бы неплохо открыть эту дверь хвостом без никаких проблем. Было бы труднее одевать брюки, я понимаю это всё, но что вы имеете в виду? Он нам не нужен.
  rating: orange
  verdict: Это шутка. Но у обезьян, которые лазают, держась руками, а не прыгают по веткам, хвост для равновесия перестал помогать и уменьшился. Его остаток — копчик, а у зародыша человека хвостик виден.
  arguments:
  - vestigial-organs
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-4-6890
  start: 6890.3
  end: 6902.9
  text: 'Лютер Сандерленд написал прекрасную книгу «Энигма Дарвина». Она из каталога для продажи. Он написал письмо всем основным эволюционистам и спросил: «Где все доказательства?» Они ответили: «У нас его нет. Оно у кого-то другого».'
  rating: orange
  verdict: Книга Лютера Сандерленда «Загадка Дарвина» действительно существует. Но учёные в ней давали частные ответы, а не признавали, что доказательств «нет ни у кого»; с тех пор найдено множество переходных форм.
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining

- id: lecture-4-6903
  start: 6903.8
  end: 6956.4
  text: 'Колин Паттерсон написал книгу о эволюции. Он является директором Британского музея природной истории. Самая большая коллекция ископаемых в мире. Ни у кого нет больше ископаемых, чем у них. Сандерленд думал, что у них несомненно должно быть доказательство. Колин Паттерсон написал книгу, но он не показал никаких потерянных звеньев. Лютер написал ему письмо и спросил: «Мистер Паттерсон, почему вы не показали нам никаких потерянных звеньев?» Вы же написали книгу о эволюции. Паттерсон ответил: Я полностью соглашаюсь с вашими отзывами о недостатке эволюционных переходов в моей книге. Если бы я знал о них, ископаемых или живущих, я, конечно, бы упомянул о них. Я могу сказать с уверенностью, таких ископаемых нет. Видите, это не отсутствующие звенья, отсутствует вся цепь. После объяснения мы видим, что потерянных звеньев вообще нет.'
  rating: red
  verdict: 'Письмо Колина Паттерсона подлинное, но он был палеонтологом музея, а не директором, и позже жаловался, что его слова вырывают из контекста: он говорил о том, что по ископаемым трудно доказать прямое происхождение, а не что переходных форм нет.'
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining

- id: lecture-4-6957
  start: 6957.8
  end: 6971.6
  text: 'Даже Стивен Гулд сказал: Отсутствие ископаемых доказательств является придирчивой проблемой эволюции. Конечно, это проблема, Стив. Но почему ты обучаешь этому? Потому что единственная альтернатива — это создание.'
  rating: red
  verdict: Гулд действительно писал о «пробелах» в летописи. Но он же писал, что переходные формы между крупными группами есть, и жаловался, что креационисты цитируют его неверно; «альтернатива только сотворение» — ложный выбор.
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining
  - lozhnaya-dilemma

- id: lecture-4-6972
  start: 6972.2
  end: 6998.5
  text: Но Гулд и Элдридж придумали идею под названием «Скачкообразное равновесие», в которой говорится, что эволюция произошла очень быстро. И поэтому мы не находим никакого доказательства. Может, пресмыкающаяся отложила яйцо, из которого вылупилась птица. Извините меня, не говорите ли вы, что отсутствие доказательств доказывает эволюцию? Попробуйте сказать это судье на суде.
  rating: red
  verdict: «Прерывистое равновесие» (виды долго почти не меняются, а потом меняются сравнительно быстро) не говорит, что рептилия снесла яйцо, из которого вышла птица. Гулд и Элдридж говорили, что виды меняются за десятки тысяч лет — «быстро» по меркам геологии; этот вывод следует из ископаемых, а не из их отсутствия.
  arguments:
  - scientists-disagree
  rhetoric:
  - straw-man

- id: lecture-4-7002
  start: 7002.6
  end: 7020.3
  text: На протяжении лет они искали промежутки, но все найденные ископаемые похожи на сегодняшние живущие формы. Все они похожи. Но они думают, что эволюция произошла. И так как они не находят никаких потерянных звеньев, они думают, что она произошла быстро. Эволюция — это сказка, друзья. Она бесполезна.
  rating: red
  verdict: 'Многие ископаемые действительно похожи на нынешние организмы. Но множество не похоже ни на что живущее: трилобиты, динозавры, древние киты с ногами; называть эволюцию «сказкой» — не довод.'
  arguments:
  - transitional-forms
  rhetoric:
  - loaded-language

- id: lecture-4-7020
  start: 7020.7
  end: 7045.2
  text: В ихнем уме только два выбора. Эволюция произошла медленно, как сказал Дарвин. Или она произошла быстро, как Стивен сказал. Ну, есть ещё один выбор. Её никогда не было. О, они не хотят допустить этого. О, нет. Потому что эволюция не доказана и её невозможно доказать. Мы верим в эволюцию только потому, что единственная альтернатива — это создание. И это немыслимо.
  rating: red
  verdict: Фраза зоолога Д. Уотсона (1929) подлинная, но «невероятно» у него значит «противоречит наблюдаемым фактам», а не «немыслимо из страха». Эволюцию принимают из-за данных, и многие учёные верят в Творца.
  arguments:
  - transitional-forms
  rhetoric:
  - quote-mining

- id: lecture-4-7046
  start: 7046.4
  end: 7061.4
  text: Вы знаете настоящую причину, почему они верят в эволюцию? Они не хотят верить в создание. Они не хотят, чтобы Бог говорил им, что делать. И очень многие люди, идя по жизни, признают теорию эволюции, надеясь этим избавиться от Бога.
  rating: orange
  verdict: Есть люди, которые надеются избавиться от Бога с помощью эволюции, это правда. Но многие учёные, в том числе глубоко верующие, принимают её из-за данных; мотивы одних не решают, верна ли теория.
  arguments:
  - evolution-religion
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-7063
  start: 7063.5
  end: 7081.0
  text: Дьявол обманул вас, солгал вам. Он смеётся с вас. Вы пойдёте в ад. Не потому, что вы верите в эволюцию, но потому, что вы не поверили в Христа. И многие люди не верят Христу из-за этой тупой теории. Дьявол врёт.
  rating: purple
  verdict: 'Мы тоже верим, что спасение — через веру во Христа, и рады, что Ховинд говорит: в ад попадают не за эволюцию. Но мы знаем людей, которым путь ко Христу закрыли слова «или Библия, или наука». Поэтому нам важно показать, что выбирать не обязательно.'
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-4-7081
  start: 7081.6
  end: 7101.9
  text: 'Малкольм Маггеридж сказал: «Я убеждён, что теория эволюции будет одной из великих шуток в книгах истории будущего». Это шутка? Учёные, преподающие эволюцию… Великие шутки. И эта история может быть самой большой шуткой всех времён. В объяснении эволюции у нас нет ни одной йоты факта.'
  rating: red
  verdict: 'Малькольм Маггеридж — журналист и писатель, а не биолог; его мнение о «шутке» — оценка, а не данные. Фактов в пользу эволюции много: ископаемые, генетика, наблюдаемое видообразование.'
  rhetoric:
  - loaded-language

- id: lecture-4-7103
  start: 7103.0
  end: 7118.3
  text: 'Даже Дарвин в своей книге написал: «Предположение, что глаз мог быть сформирован естественным отбором, выглядит… я свободно признаюсь… абсурдным». Как слепой случай может создать видящий глаз? Вы когда-нибудь думали об этом?'
  rating: red
  verdict: Дарвин действительно написал, что эта мысль «кажется абсурдной». Но сразу после этого он объясняет, как глаз мог возникнуть постепенно — от светочувствительного пятна; Ховинд обрывает цитату на середине.
  arguments:
  - design-complexity
  rhetoric:
  - quote-mining

- id: lecture-4-7119
  start: 7119.2
  end: 7153.7
  text: 'Ну, в учебниках говорится: Ребята, сложная структура человеческого глаза может быть продуктом эволюции на протяжении миллионов лет. Почему слава не Богу? В этом учебнике показаны разновидности глаза, найденного в природе, и говорится: Вы можете лучше понять развитие глаза, если вы представите серию изменений на протяжении эволюции глаза. Вы должны вообразить эволюцию. Она никогда не происходит в лаборатории или природе. Она не найдена в ископаемых. Единственное доказательство — ваше воображение. Представьте себе, как она могла произойти.'
  rating: red
  verdict: 'Учебник показывает не воображаемые, а реально существующие у животных глаза: светочувствительное пятно, ямку, глаз-камеру без линзы, с линзой. Каждый этап работает, и это довод, что путь возможен, а не одно воображение.'
  arguments:
  - design-complexity
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-7154
  start: 7154.6
  end: 7167.6
  text: 'Друзья, глаза сложные. Библия говорит: «Бог образовал глаз». Достаточно ясно. Задняя часть глаза — сетчатка, содержит 137 млн светочувствительных ячеек в 2 кв. см.'
  rating: green
  verdict: Мы тоже верим, что «Насадивший ухо не услышит ли? и образовавший глаз не увидит ли?» (Пс 93:9). Глаз действительно сложен, и в сетчатке больше 100 млн светочувствительных клеток.
  arguments:
  - design-complexity

- id: lecture-4-7175
  start: 7175.0
  end: 7247.8
  text: 'Как-то раз кто-то позвонил мне в офис. Я никогда не знаю, кто позвонит нам в офис. Я поднял трубку и сказал:«Здравствуйте, евангелизм о сотворении». Голос на другом конце линии сказал: «Как можно быть таким тупым, чтобы верить в создание?» Я сказал: «Извините. Алло?» Он сказал:«Как можно быть таким тупым, чтобы верить в создание?» Я сказал: «Какой у меня выбор?» Он сказал: «Эволюция». Я спросил, почему я поверю эволюции? Он сказал: «Всё в мире так бедно разработано. Как вы можете верить в Создателя, когда всё так плохо придумано?» Я сказал: «Например, что, вы думаете, так плохо разработано?» Он сказал: «Человеческий глаз — это пример плохой конструкции». Я сказал: «В чём проблема, сэр?» Вы стареете, и вам приходится носить очки. Это проблема, сэр. Он сказал: «Глаз плохо разработан». Он сказал, что кровеносные сосуды находятся над сетчаткой, и солнечный свет должен пройти через них, чтобы достичь сетчатки. Я сказал: «Да, сэр, я знал об этом». Он сказал: «Вот видите, это плохая разработка. Сосуды блокируют часть света. Зрение было бы лучше, если бы кровеносные сосуды были за сетчаткой». Первоклассник придумал бы глаз лучше этого.'
  rating: neutral
  verdict: 'Начало рассказа о звонке скептика, который назвал глаз человека «плохо устроенным»: сосуды и нервы проходят перед сетчаткой. Ответ Ховинда разобран ниже.'
  rhetoric:
  - personal-story

- id: lecture-4-7249
  start: 7249.4
  end: 7309.2
  text: 'Я сказал: «Сэр, я хочу вам что-то объяснить». Потому что он сказал, что у осьминога глаз намного лучше, так как его кровеносные сосуды находятся сзади сетчатки. Я ответил: «Сэр, я хочу вам что-то объяснить. Мы живём в воздухе». И воздух не блокирует много ультрафиолетового света. И последняя защита для сетчатки от ультрафиолетового света — это кровеносные сосуды. Осьминог живёт в воде. Вода блокирует ультрафиолетовый свет, и им не нужны сосуды перед сетчаткой. Они могут видеть лучше с сосудами за сетчаткой. И если вы хотите поменяться глазами с осьминогом, пожалуйста. Но вы ослепнете через несколько дней. Глаза отлично разработаны для жизни на воздухе. Где мы и живём. Если у вас ещё тупые вопросы… Он сказал: «Нет, это всё». Ха. Плохо разработанный глаз. Очнитесь, он удивительно разработан.'
  rating: red
  verdict: Что устройство нашего глаза работает хорошо, верно. Но от ультрафиолета сетчатку защищают главным образом хрусталик и роговица, а не сосуды; осьминоги живут и у поверхности воды, и с их устройством глаза никто бы не ослеп.
  arguments:
  - design-complexity
  rhetoric:
  - personal-story

- id: lecture-4-7310
  start: 7310.7
  end: 7324.0
  text: Сегодня эволюционисты используют аргумент, что Бог так бы не сделал. Значит, это произошло. Но это очень шаткая логика, если вы подумаете об этом. Это, конечно, глупый путь для доказательства вашей теории.
  rating: orange
  verdict: Довод «Бог так бы не сделал» действительно слабый, это богословское суждение. Но биологи опираются не на него, а на то, что «неудобные» устройства легко объясняются происхождением от предков; Ховинд спорит с более слабой версией.
  rhetoric:
  - straw-man

- id: lecture-4-7325
  start: 7325.1
  end: 7374.6
  text: Глаза очень сложные, сложнее машины. Ну, давайте возьмём, например, машину. Представьте, что вашему сыну 16 лет. И он хочет ездить на машине. У меня было 102 машины с того времени, как я начал ездить. У меня никогда не было новой машины. Я покупал старые машины, ремонтировал их и продавал. Я делал почти всё, что можно сделать с машиной. Я ремонтировал моторы, коробки передач, глушители. Я знаю, как ремонтировать машины. Но понимание того, как разработана машина, не значит, что она не была создана. Только потому, что вы понимаете действия чего-то, это не объясняет происхождение чего-то. И здесь эволюционисты запутались. Они думают, что чем больше мы понимаем, как что-то действует, тем менее вероятно, что оно было сотворено. Оно должно было произойти. Понимание действия не исключает создателя.
  rating: orange
  verdict: 'Что понимание устройства не исключает Творца, верно, и мы согласны. Но Ховинд спорит с тем, чего биологи не утверждают: они не говорят, что «чем больше понимаем, тем меньше Бога»; это вопрос веры, а не науки.'
  arguments:
  - design-complexity
  rhetoric:
  - straw-man

- id: lecture-4-7375
  start: 7375.6
  end: 7427.1
  text: 'Представьте, что вашему сыну 16 лет. Всем моим детям уже было 16 лет. Ваш сын подходит к вам и говорит: Папа? Мне уже шестнадцать. Да. Ты вырос? Мы не думали? Ну, ты вырос. Он говорит: «Папа, у меня уже есть права». Сын, дай мне посмотреть на твои права. Ну и фотография. Похоже, однако. Он говорит: Э-э, папа, дай мне машину. Подожди минуточку, я хочу тебе что-то объяснить. Мы знали, что этот день придёт. Мы молились об этом долгое время. Мы не думаем, что ты готов для всей машины. Потому что машина — это сложная штука. Ты знаешь, что необходимо 3 000 болтов, чтобы удержать машину вместе, и нужен один чудак, чтобы её разбить.'
  rating: neutral
  verdict: Начало притчи о сыне, который просит машину, и шутки о сложности автомобиля.

- id: lecture-4-7429
  start: 7429.7
  end: 7465.8
  text: Сын, мы разрешим тебе медленно развиться в машину. В этом году мы тебе дадим 10% машины. В следующем может быть больше. Подождите минуточку, какая польза от 10% машины? Это то, что мы называем хламом, не так ли? Сколько вещей должно работать, чтобы работала машина? А сколько вещей должно быть неправильными, чтобы машина не работала? Одна из многих тысяч вещей. Как, например, неимение ключей. Правда?
  rating: red
  verdict: 'Что 10% машины бесполезны, верно. Но орган не растёт «процентами» готового устройства: каждая промежуточная форма — рабочий орган сам по себе, как светочувствительное пятно у червя полезно и без хрусталика.'
  arguments:
  - design-complexity
  rhetoric:
  - false-analogy

- id: lecture-4-7467
  start: 7467.3
  end: 7486.9
  text: Друзья, сложные вещи должны были быть созданными. Другого выхода нет. Но эволюционист не хочет согласиться с идеей, что есть Создатель. Поэтому он приходит к глупому выводу, что сложные вещи произошли случайно. Если будет достаточно времени. Не верьте этому. Дьявол обманывает вас.
  rating: red
  verdict: 'Мы тоже верим, что мир создан Богом. Но выбор «создан или случаен» ложен: многие христиане верят, что Творец действует и через законы природы, а эволюция — не чистая случайность: сохраняются те изменения, что помогают выжить.'
  arguments:
  - design-complexity
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-7487
  start: 7487.8
  end: 7509.1
  text: 'Всё-таки почему люди верят в эту теорию? Я принимал участие в сорока с чем-то дебатах в университетах, около 3 500 радио- и телепрограмм, куда все могут звонить и задавать вопросы. Я решил, что есть несколько причин, почему люди продолжают поддерживать теорию эволюции. Первое: они не знают, что есть другой выбор. Их учили только эволюции.'
  rating: orange
  verdict: Ховинд действительно провёл много дебатов. Но число дебатов не показывает, почему учёные принимают эволюцию; главная причина — данные, а не то, что людям «не рассказали о другом выборе».
  rhetoric:
  - self-authority

- id: lecture-4-7509
  start: 7509.7
  end: 7546.8
  text: 'Я проповедовал на Украине, в Советской Республике с переводом на русский. Э-э, когда я проповедовал в университете, собрались почти все профессора университета, чтобы послушать. Их было около тридцати. Они сидели в комнате, и на протяжении двух часов я рассказывал им о сотворении через переводчицу. Один из профессоров начал плакать. Профессор университета. Я спросил переводчицу: «Почему он плачет?» Она сказала: Он счастлив. Он никогда не слышал об истории сотворения. Он слышал только об эволюции. Он рад, что есть другой выбор.'
  rating: neutral
  verdict: Рассказ о профессоре на Украине, который заплакал, услышав о сотворении. Трогательная история, но к научному спору она отношения не имеет.
  rhetoric:
  - personal-story

- id: lecture-4-7549
  start: 7549.0
  end: 7565.6
  text: Сколько детей в этом городе никогда не слышали о сотворении? А? У дьявола есть свой путь. Он будет стараться, чтобы дети этого города не услышали историю о сотворении. Потому что пока они верят в эволюцию, они не будут искать Спасителя. Вот почему.
  rating: purple
  verdict: Мы тоже хотим, чтобы дети знали, что Бог — Творец, и искали Спасителя. Но учение о сотворении и научная теория эволюции не исключают друг друга; ребёнок может знать и то, и другое.
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-7566
  start: 7566.6
  end: 7598.9
  text: 'Некоторые верят в эволюцию, потому что от этого зависит ихняя работа. Они учат эволюции, потому что они не хотят потерять работу. Некоторые поддерживают эволюцию, потому что они надеются, что Бога нет. Они хотят избавиться от Бога, чтобы им не пришлось давать ответ. Некоторые поддерживают эволюцию по социально-политическим причинам. Мы говорим об этом на видеокассете номер пять. «Политика эволюции». Некоторые люди очень горды, чтобы признать свою неправоту. Тяжело сказать: «Я не прав». Но если вы верите в эволюцию, вы не правы.'
  rating: red
  verdict: Бывает, что люди держатся за взгляды из гордости или ради работы. Но это касается и сторонников, и противников эволюции; о верности теории судят по данным, а не по мотивам её сторонников.
  arguments:
  - science-conspiracy
  rhetoric:
  - ad-hominem-pivot

- id: lecture-4-7600
  start: 7600.0
  end: 7703.2
  text: 'Не обижайтесь на меня, э-э, так сказал Бог. Что он сотворил мир. Он написал это в книге. Много людей погибло, чтобы эта книга дошла до вас. Читайте и делайте, что в ней сказано. Что нам делать на этот счёт? Учебники заполнены теорией эволюции в этом городе. В каждом городе, где я был, книги заполнены этой теорией и обманом. Что нам делать по этому поводу? Вот практические шаги. Наша работа — быть солью земли. Соль раздражает. Вам не нужно пробовать раздражать кого-то. Старайтесь быть солью, и это будет раздражать их. Соль сохраняет. Соль придаёт вкус. Делает много вещей. Если вами никто не раздражён, вы, наверное, нехороший христианин. Вы можете судить человека по его врагам. Мы раздражаем людей, потому что мы стоим за что-то, что правильно. Наша работа — быть солью земли. Практические шаги. Требуйте, чтобы школы вырезали страницы с ложной информацией. Пойдите в школьное управление и скажите: «Я хочу, чтобы страница такая-то была вырезана из учебника». Ложная информация. Таким путём школе это не стоит ничего. Кто из вас помог бы? Добровольно. Бесплатно. Чтобы вырезать эти страницы. Поднимите руку. Видите, школе это не будет стоить ни копейки. Или вы сможете сделать, как сделал директор школы в Джорджии. Склейте страницы. Он не задавал никаких вопросов, он просто склеил страницы. Одним летом он взял все книги, нашёл все места с ложной информацией и склеил все страницы вместе. Той осенью NEA чуть не подпрыгнула до потолка.'
  rating: neutral
  verdict: 'Мы тоже верим, что Бог сотворил мир и что Писание — Его Слово, за которое умирали люди. Дальше — «практические шаги»: вырезать или склеивать страницы учебников. Что на них, разобрано выше; сами призывы — гражданская позиция, а не научный довод.'

- id: lecture-4-7703
  start: 7703.8
  end: 7735.6
  text: Кстати, если вы учитель школы, не будьте членом NEA. Есть другие организации, где вы можете получить вашу страховку. Не давайте денег этой левосторонней коммунистической организации. В конце моей семинарной книжки на жёлтых страницах есть список нескольких организаций, где есть информация, где вы можете получить страховку. Христианские организации для учителей школ. Любой человек, любящий Бога, не должен давать ни цента этой левосторонней организации.
  rating: orange
  verdict: Национальная ассоциация образования (NEA) — крупнейший профсоюз учителей США, и её политические позиции действительно спорны. Но называть её «коммунистической» — ярлык, а не довод.
  rhetoric:
  - loaded-language

- id: lecture-4-7736
  start: 7736.9
  end: 7748.8
  text: 'NEA чуть не подпрыгнула до потолка, когда этот директор склеил страницы. Они сказали: «Ты не можешь этого делать». Он сказал: «Я уже сделал». Они сказали: «Ты не можешь». Он сказал: «Я уже сделал, всё закончено». Клей уже высох.'
  rating: neutral
  verdict: Окончание истории о директоре, склеившем страницы учебников.

- id: lecture-4-7751
  start: 7751.1
  end: 7774.0
  text: Наклейте предупреждение на лицевой обложке. Хотя бы предупредите детей, что информация на странице такой-то неверная. Если вы обманываете детей в учебниках, по крайней мере предупредите их. Алабама приняла закон, в котором говорится, что на обложке учебника об эволюции должно быть предупреждение. Сделайте то же и здесь? Или для этого у вас недостаточно христиан в этом городе?
  rating: orange
  verdict: В Алабаме с 1995 года на учебники действительно клеили вкладыш-предупреждение об эволюции; это было решение школьного совета штата, а не закон. Но предупреждение о «спорной теории» не делает теорию неверной.
  rhetoric:
  - loaded-language

- id: lecture-4-7774
  start: 7774.8
  end: 7794.1
  text: Но кто будет возражать этому? Если в учебнике биологии находится ложная информация и вы требуете, чтобы студенты знали об этом, как они могут возразить этому? Это не попытка внесения Библии в школу, не так ли? Нет. Вы не пытаетесь внести создание в школу? Вы только хотите предупредить детей, что их обманывают?
  rating: orange
  verdict: Требовать точности учебников — законно. Но здесь заранее решено, что точная биология — это «обман»; предупреждать о нём — значит продвигать свою позицию, а не защищать от ошибки.
  rhetoric:
  - loaded-language

- id: lecture-4-7795
  start: 7795.4
  end: 7841.8
  text: 'Требуйте, чтобы они купили книгу «Промывают ли вам мозги». Мы выпускаем книгу «Промывают ли вам мозги с помощью научных учебников». Вы можете купить их по доллару, если вы покупаете пять штук. Или больше по себестоимости. Пойдите в школьное правление и скажите: Мы тратим 40 долларов на каждый учебник. Давайте потратим ещё один доллар и покажем детям ещё одну сторону. Если школьное правление согласится, то тогда… Тогда вы покупаете книги и даёте школьникам. Если школьное правление говорит: «Нет, нам не нужна эта книга», тогда вы опубликуете объявление. Пожалуйста, остановитесь и купите книгу, запрещённую школьным правлением. Теперь дети не только купят её, правда? Но они и прочитают её.'
  rating: neutral
  verdict: Реклама собственной книги о школьных учебниках и совет, как продвигать её через школьный совет.

- id: lecture-4-7844
  start: 7844.2
  end: 7871.2
  text: 'Может быть, вы захотите купить книгу «Законные права студента»? Студенты должны знать, что у них есть право освобождения от любых классов или материала, противоречащего ихней религии. Школа обязана законом предоставить альтернативный материал. Если вы не хотите, чтобы ваших детей учили эволюции, подите в школу и скажите: Я не хочу, чтобы моих детей учили эволюции. Я требую освобождения от таких классов. Но вам нужно знать кое-что на этот счёт.'
  rating: orange
  verdict: В США родители в ряде случаев действительно могут освободить ребёнка от отдельных занятий по религиозным причинам. Но общего права уйти с «любых» уроков, а тем более обязанности школы дать альтернативу биологии, нет.
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-7871
  start: 7871.9
  end: 7909.5
  text: 'Если у них есть плохая программа, например, голубые будут рассказывать о своей жизни. Вы скажете: «О, доктор Ховинд, вы назвали их голубыми». Я жил возле Сан-Франциско. Они голубые. Вы не боитесь, что они вас стукнут этой сумочкой? Нет. Но Бог любит их. Люди проповедуют против гомосексуализма, но не проповедуют против объедания. Или курения, или пьянства, или чего-то другого — это грех, как и все грехи. Они проповедуют против гомосексуализма, но не против похоти. Мы можем долго говорить об этом, э-э, но мы остановимся.'
  rating: neutral
  verdict: Отступление о школьных программах и о том, что Бог любит всех грешников, а осуждать нельзя избирательно; к научным доводам не относится.

- id: lecture-4-7910
  start: 7910.6
  end: 7961.7
  text: Так вот, если гомосексуалисты придут говорить в вашу школу… Они дадут детям бумажку, чтобы отказаться от класса. То есть, если вы не хотите, чтобы ваш ребёнок присутствовал, он должен получить родительское разрешение. Будьте внимательны. Если в вашей школе будет хорошая программа, вы должны получить родительское разрешение для посещения программы. Если это плохая программа, вы должны получить родительское разрешение, да, для отказа, потому что они знают, что 80% детей забудут о записке. Если её не приклеить ко лбу. Был ли у вас хоть один случай, когда ваш ребёнок забыл показать вам записку со школы? У всех, правда? Вы должны требовать, чтобы всякая программа была добровольной. Ну, давайте будем последовательными, потому что гуманисты хотят, чтобы всё было по-ихнему, ну, нечестно.
  rating: orange
  verdict: Требовать, чтобы спорные программы были добровольными, — законная позиция. Но утверждение, что школы нарочно рассчитывают на то, что 80% детей забудут записку, не подкреплено ничем.
  rhetoric:
  - conspiracy

- id: lecture-4-7963
  start: 7963.4
  end: 7986.8
  text: Купите эту книгу для детей, чтобы они знали свои права. Потому что незнание прав равняется неимению прав. Купите книгу Гейблеров, если вы хотите повлиять на выбор учебников в вашем обществе. Дайте им знать, что вы можете повлиять на то, по каким учебникам будут учиться ваши дети. Обычно учебники выбираются в январе. Э-э, в феврале или марте для заказа на следующий год.
  rating: neutral
  verdict: Рекомендации книг для родителей и сроки выбора учебников; на довод не влияет.

- id: lecture-4-7987
  start: 7987.8
  end: 8000.6
  text: Многие учителя — это искренние, преданные профессионалы. Очень много хороших учителей в системе. Это благочестивые люди, которые расстроены происходящим в курсе обучения. Многие не знают, что они могут учить о сотворении мира.
  rating: red
  verdict: 'Что в школах много хороших и верующих учителей, верно. Но в государственных школах США в 1987 году Верховный суд запретил выдавать «научный креационизм» за урок естествознания: суд признал его религиозным учением. Рассказывать о Библии на других уроках там можно.'
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-8001
  start: 8001.1
  end: 8022.3
  text: 'Во Флориде есть закон, в котором говорится: «Учебный материал должен быть точным». В наших учебниках находится неверный материал. Почти в каждом штате есть закон, обязывающий, чтобы материал был точным. В Алабаме есть закон, требующий, чтобы студенты были предупреждены о разнице между микро- и макроэволюцией. Почему бы вам не принять такой закон в вашем штате?'
  rating: orange
  verdict: Законы о точности учебников действительно есть. Но точность биологии проверяют учёные, а не по одному толкованию; деление на «микро» и «макро» как на разные процессы и есть то, что надо доказать.
  arguments:
  - microevolution-macro

- id: lecture-4-8024
  start: 8024.3
  end: 8051.4
  text: 'Требуйте, чтобы учебники были точными. Гитлер сказал: «Позвольте мне контролировать учебники, и я смогу контролировать страну». Он знал о молодых людях. Начните учить их неправде в пять-шесть-семь лет, и скоро они начнут верить ей на всю свою жизнь. Если ребёнок ходит в вашу школу 12 лет. Каким будет его взгляд на мир? Гуманистическим. Я думаю, что да.'
  rating: orange
  verdict: Что школа сильно формирует взгляды, верно. Но фразы Гитлера «дайте мне контролировать учебники…» в его текстах не нашли; это распространённая приписка.
  rhetoric:
  - unverified-quote

- id: lecture-4-8051
  start: 8051.5
  end: 8084.7
  text: Учителя должны знать, что они могут учить о науке сотворения. Верховный суд всегда поддерживал идею, что вы можете учить Библию в государственных школах. Мы обмануты ACLU. Вот что случилось. Они пытались забрать Библию из школ. Верховный суд постановил, что учителя не могут каять детей. Но они могут учить Библии. Они могут учить. ACLU обманула вас, придала этому другое значение. В школах можно учить Библию, можно иметь библейские классы. У меня есть много книг на эту тему.
  rating: orange
  verdict: Что изучать Библию как литературу и историю в государственных школах США можно, верно. Но учить «науке сотворения» на уроках естествознания нельзя; Ховинд смешивает эти две вещи.
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-8085
  start: 8085.1
  end: 8113.7
  text: Штаты могут требовать, чтобы учителя учили эволюции, но они не могут заставить их поверить в неё. Они могут только требовать представления об эволюции. Они не могут требовать, чтобы они говорили о создании. И если вы хотите внести создание мира в государственные школы, вы теряете своё время. Учителя могут говорить о сотворении, если они хотят. Вам не нужен разрешающий это закон. Они уже могут. Это как принятие закона, что вы можете дышать. Вы уже можете дышать?
  rating: red
  verdict: 'Что учителя не обязаны верить в эволюцию, верно. Но выдавать сотворение на уроке биологии за научную альтернативу учитель государственной школы США не вправе: так решил Верховный суд в 1987 году (см. выше).'
  rhetoric:
  - podmena-ponyatij

- id: lecture-4-8114
  start: 8114.4
  end: 8122.4
  text: Штаты могут принимать законы, требующие оговорки слабости теории эволюции. Техас принял такой закон, но он не поддержал его.
  rating: green
  verdict: 'Верно: в Техасе с конца 1980-х до 2009 года школьные правила требовали обсуждать «сильные и слабые стороны» научных теорий, потом это требование сняли.'

- id: lecture-4-8123
  start: 8123.1
  end: 8139.0
  text: Верховный суд постановил, что можно изучать Библию. Было много судебных дел, и в школах можно изучать Библию. В 1980 году Верховный суд постановил, что вы можете использовать Библию в государственных школах. Нужно сказать учителям об этом.
  rating: green
  verdict: 'Верно: в решении 1980 года (Stone v. Graham) Верховный суд США прямо допустил изучение Библии в школе в рамках истории, культуры и этики.'

- id: lecture-4-8139
  start: 8139.8
  end: 8196.5
  text: Если вы хотите узнать, что происходит в государственных школах, напишите Фреду. fred001@spectra.net И подпишитесь на The Loop. Вы начнёте получать 5 200 статей в день, посвящаясь во все новости образования во всём мире. Также купите видео «Кризис в классе». eagle@eagleforum.org Прекрасное видео о том, что происходит в классах государственных школ. Практические шаги для детей и заканчиваем. Дети, если вы хотите изменить ваших учителей, не спорьте с ними публично. Постарайтесь поговорить с ними после класса. Никакому учителю не нравится многолюдный спор. Если вы часто опаздываете на урок, наводите беспорядок, никогда не делаете домашнюю работу и не слушаете в классе, не говорите им, что вы христианин. Этим вы мне поможете. Во-первых, будьте хорошим учеником.
  rating: neutral
  verdict: 'Рекомендации рассылок и видео и советы детям: не спорить с учителем при всех, быть хорошим учеником. Совет добрый.'

- id: lecture-4-8196
  start: 8196.9
  end: 8235.8
  text: 'Практические шаги. Если на экзамене вы знаете, что ответ на вопрос имеет дело с эволюцией, Например, сколько лет Земле? И они хотят, чтобы вы ответили: «Четыре с половиной миллиарда лет». Но вы не верите в это. Вы можете сказать на экзамене: «В учебнике говорится: 4,5 млрд лет. Однако это неверно». Покажите учителю, что вы делали домашнюю работу. Но вы в это не верите. Вы можете сказать им это, они не могут заставить вас поверить в эволюцию. Вы можете освободиться от такого класса. Если каждый христианин освободит детей от обучения эволюции и все дети будут стоять в коридоре, учитель догадается: «Давай пропустим эту главу».'
  rating: red
  verdict: Что ученик может не соглашаться с учебником и уважительно сказать об этом, верно. Но возраст Земли около 4,5 млрд лет считают по распаду некоторых веществ в камнях, как возраст дерева по кольцам, и разные способы дают одно и то же. Лучше, чтобы ребёнок знал, на чём основан ответ учебника.
  arguments:
  - earth-age-billions

- id: lecture-4-8236
  start: 8236.6
  end: 8464.5
  text: 'Однажды мне позвонил человек и сказал: «Брат Ховинд! Моя дочка во втором классе. Она посмотрела ваши кассеты около 50 раз». Почему дети смотрят одну кассету снова и снова? Вы заметили это? Он сказал: «Моя дочка выучила почти весь материал на вашей кассете». Второй класс. Он сказал: «Только что мне позвонил учитель моей дочки и сказал: „Вы знаете что, сэр? Каждый раз, когда я говорю об эволюции, ваша дочка встаёт и поправляет меня“. Учитель сказал: „Я решил не говорить об эволюции до конца года“». Моей первой мыслью было: «Вот это молодец!» Моей второй мыслью было: «А почему мы отправляем на войну второклассников?» Второклассники не должны беспокоиться, чему их учат в школе. Друзья. Родители должны побеспокоиться, чтобы школьные учебники были точными. Родители должны убедиться, что самих учителей учат правде, чтобы потом они не могли распространять ложь. Ребята, вы можете дать своему учителю видео для просмотра дома? Особенно мужчине-учителю. Если у него есть видео и он держит пульт, его охватывает чувство власти. Это трудно объяснить. Женщины этого вообще не понимают. Ну, вы понимаете, мужчины. Когда вы держите пульт, это как… контроль. Вы знаете, о чём я говорю, правда? Однажды мне позвонил человек и сказал: «Мистер Ховинд, кто-то дал мне вашу видеокассету. Я посмотрел 10 минут, я так разозлился, что я выключил видео и выбежал из комнаты. Через 30 минут я успокоился, вернулся назад, посмотрел ещё 10 минут. Вы опять что-то сказали. Я разозлился, выключил кассету и выбежал. Через 30 минут я вернулся опять. Посмотрел кассету до конца и покаялся». Кассеты — это прекрасные инструменты в евангелизации. Мои кассеты без авторского права. Перепишите их, раздавайте. В мире идёт война. Не берегите пули во время войны. Молитесь за учителя. Это тяжёлая работа. Это трудная работа. Пригласите их на семинары о сотворении. Предложите им позвонить мне с вопросами. Предложите, чтобы в классе показали моё видео о сотворении. Родители, вы убедитесь в этом очень быстро. Чем дальше вы забираетесь по лестнице для получения разрешения, тем меньше вероятность его получения. Если вы скажете: «Я пойду к сенатору», чтобы показать кассету Ховинда в классе, вы не получите его. Учителя выучили, что многие студенты уже знают: легче получить прощение, чем разрешение. Не спрашивайте, можно ли это сделать. Просто сделайте. Нам звонят или пишут каждую неделю люди, покаявшиеся от кассеты, которую не взяли в школьной библиотеке. Кто-то поставил мою кассету в школьную библиотеку. Школьник принёс кассету домой, его мать просмотрела и покаялась, потом и отец. Мы слышим об этом каждую неделю. Предложите библиотеке кассету. У них есть другие разные вещи, не так ли? Станьте членом школьного правления и воздействуйте на правление. Вы можете быть членом комиссии, которая выбирает учебники. Иногда туда трудно попасть. Предложите и поддержите закон, обязывающий, чтобы учебники были точными. Или наклейте предупреждение. Старайтесь изменить учителей, они не враги, и Бог любит их. Измените учеников, и тогда не будет иметь значения, что находится в учебниках. И как я сказал в начале, лучшее решение — это забрать детей из школы. Я думаю, что система безнадёжно пропала. Сейчас давайте поможем тем, кто остался. Пишите письма в школьные управления, редакторам. Напоминайте людям о теме эволюции. Пожертвуйте книгой или кассетой в вашу библиотеку.'
  rating: neutral
  verdict: Истории о зрителях, советы родителям и учителям, призыв молиться за учителей и раздавать кассеты. Что учитель — не враг и за него надо молиться, мы согласны; научных доводов здесь нет.
  rhetoric:
  - personal-story

- id: lecture-4-8464
  start: 8464.8
  end: 8478.4
  text: Учите других, множество вещей можно делать. Сатана использует этот обман, чтобы отправлять людей в ад. Он обманщик. Невидимые вещи от созданий ясно видны от начала мира. Вот к чему всё это сводится, и мы заканчиваем.
  rating: purple
  verdict: Мы тоже верим, что невидимое Божье видно через творение (Рим 1:20). Но апостол говорит, что творение свидетельствует о Творце, а не о том, как Он творил; эволюция не мешает этому свидетельству.
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-4-8479
  start: 8479.6
  end: 8498.4
  text: Если верен рассказ о творении, тогда существует Создатель. Если эволюция верна, тогда Создателя не существует. Просто ясно. Если верен рассказ о творении, существуют правила. Но не с эволюцией. Если верно творение, есть смысл жизни. Если верна эволюция, нет смысла в жизни.
  rating: red
  verdict: Мы тоже верим, что есть Создатель, Его заповеди и смысл жизни. Но эволюция — теория о том, как менялись живые существа; она не утверждает, что Творца нет, и не отменяет ни правил, ни смысла.
  arguments:
  - evolution-morality
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-8499
  start: 8499.1
  end: 8510.7
  text: Было ли это причиной повышения самоубийств подростков после того, как в школе начали обучать эволюции? Нет смысла в жизни? В некоторых группах самоубийства повысились на 500%.
  rating: orange
  verdict: Рост подростковых самоубийств в США во второй половине XX века — настоящая беда. Но то, что он шёл одновременно с уроками биологии, не доказывает причины; у самоубийств много причин, и их изучают отдельно.
  arguments:
  - evolution-morality
  rhetoric:
  - post-hoc

- id: lecture-4-8512
  start: 8512.5
  end: 8524.1
  text: 'Если верно творение, человек — падшее существо и нуждается в Спасителе. Но дьявол не хочет, чтобы вы поверили в это. Поэтому он придумал эволюцию: «Вам не нужен Спаситель, вы развиваетесь, вы становитесь лучше».'
  rating: purple
  verdict: Мы тоже верим, что человек — падшее существо и нуждается в Спасителе. Но биологическая эволюция не учит, что люди «становятся лучше»; она вообще не говорит о грехе и спасении.
  arguments:
  - evolution-religion
  rhetoric:
  - straw-man

- id: lecture-4-8524
  start: 8524.5
  end: 8533.5
  text: Если верно творение, человек принёс смерть в мир, и смерть — это ужасная вещь. Если верна эволюция, смерть принесла человека в мир, и смерть — это удивительная вещь.
  rating: purple
  verdict: Мы тоже верим, что смерть — враг и что грех принёс смерть людям (Рим 5:12). Но была ли смерть животных до Адама, христиане спорят со времён отцов Церкви, а биология смерть не восхваляет, а лишь описывает.
  arguments:
  - death-before-fall
  rhetoric:
  - straw-man

- id: lecture-4-8533
  start: 8533.9
  end: 8537.5
  text: Если вы убьёте низших, как Гитлер убивал евреев, это прекрасно.
  rating: red
  verdict: 'Эволюция не учит, что убивать «низших» прекрасно: она описывает, что происходит в природе, а не велит людям, как поступать. Нацисты опирались на многовековую ненависть к евреям, а «высших» и «низших» рас наука не находит.'
  arguments:
  - darwin-hitler
  rhetoric:
  - guilt-by-association

- id: lecture-4-8539
  start: 8539.6
  end: 8553.4
  text: Если творение верное, есть жизнь после смерти. Но не с эволюцией. Если верно творение, вы можете знать будущее. Но не так с эволюцией, есть всегда неуверенность, куда я попаду после смерти. Мы не знаем.
  rating: orange
  verdict: Мы тоже верим в жизнь после смерти и надежду во Христе. Но биология о загробной жизни не говорит ни «за», ни «против»; противопоставление здесь ложное.
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-4-8553
  start: 8553.6
  end: 8773.7
  text: 'Дьявол — это обманщик, он отец лжи. Бог не человек, что он может обманывать. Бог не может обманывать. И он обещал, что всякий, кто призовёт имя Господне, спасётся. Если вы здесь и вы не спасены, вы можете быть спасёнными. Если вы умрёте сегодня, куда вы попадёте? Если вы не попадёте на небо, вы должны отдать своё сердце Иисусу. Я сделал это в 1969 году. Когда вы становитесь христианином… внезапно многое проясняется. Многое становится понятным. Если вы спасены, разрешите мне задать вам вопрос. Что вы делаете на Земле ради неба? Друзья, идёт война. Каждый должен делать что-то для Господа. Если вы не спасены, покайтесь. Если же вы спасены, займитесь трудом. Осталось мало времени, давайте что-то делать для Господа. Каждый должен делать что-то. Если вы не можете говорить о сотворении в школах или университетах, раздавайте видеокассеты. Вчера мне позвонили и сказали: «Мы сделали 900 копий ваших кассет и раздаём их». Мне позвонили из канадской церкви и сказали: «Мы сделали 3 000 копий и раздаём эти кассеты». Необязательно должны быть мои кассеты, любые. Делайте что-то. Давайте возьмёмся и выиграем эту войну. Встанем, преклоним головы и помолимся. Это одна из видеосерий о сотворении, эволюции, динозаврах. Однако намного важнее знания всей правды и научных фактов это уверенность в том, что вы попадёте в рай. Если вы никогда не доверились Христу как вашему Спасителю, то я скажу, что вы можете сделать, чтобы попасть в рай. Библия говорит, что все мы грешники. Мы ослушались Создателя, мы делали злые вещи. Мы грешники. Одни хуже других, по крайней мере, в человеческих глазах. Но мы все нарушили Божий закон. И Библия говорит, что мы должны покаяться. Покаяние — значит повернуться. Два значения: отвернуться от греха и повернуться к Богу. Бог ищет перемены в вашем сердце, когда вы говорите: «Боже, я больше не хочу грешить, прости, я обижал Тебя, я хочу жить правильно». Вы отворачиваетесь от греха и говорите: «Боже, пожалуйста, прости меня, спаси меня». В Библии к Римлянам 3:23 говорится, что все согрешили и лишены славы Божьей. Вы должны признаться, что вы грешник. Во-вторых, В Библии Римлянам 6:26 говорится: «Ибо возмездие за грех — смерть». Мы заслуживаем смерти. Но Иисус умер за вас. Он любит вас, он хочет, чтобы вы попали в рай. И кто попросит бесплатное спасение, Бог даст дар вечной жизни. Как сказано, Римлянам 6:23 — это бесплатный подарок. В Римлянам 10:13 говорится: «Ибо всякий, кто призовёт Имя Господне, спасётся». Скажите Богу: «Господь, я грешник, прости меня». Попросите Его, и Он даст вам бесплатный дар вечной жизни. Помолитесь со мной сейчас, и вы сможете принять Христа как Спасителя. Нет волшебных слов, Бог смотрит на ваше сердце. Если вы скажете от сердца, Бог простит вас. Скажите: «Дорогой Господь Иисус! Я знаю, что я грешник. Я нарушил Твой закон. Прости меня. Пожалуйста, засчитай Свою кровь на мой счёт. Прости мои грехи и прими меня на небо. Во имя Иисуса. Аминь». Библия говорит, что если вы призовёте Имя Господне, спасётесь. Если вы попросили Господа спасти вас, он спасёт вас. Теперь ваше задание — расти: читайте Библию, молитесь, ходите в церковь и начните возрастать, чтобы стать хорошим христианином. Большое спасибо. Пишите и звоните, мы будем рады помочь.'
  rating: neutral
  verdict: Евангельский призыв, свидетельство об обращении и молитва покаяния (Рим 3:23; 6:23; 10:13). Мы разделяем призыв довериться Христу; к научным доводам эта часть не относится.
