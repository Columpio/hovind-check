# Лекция 2 «Эдемский сад»: окончательная разметка (этап 6). Черновик, не в data/:
# часть меток пока без статей (см. NEEDS.md). Формат: data/README.md.
# Время — по локальному файлу = YouTube g-7cnkhgAjg.

- id: lecture-2-50
  start: 50.4
  end: 70.5
  text: Очень приятно, что мы опять вместе. Кто был на лекции утром? … Меня зовут Кент Ховинд. Я преподавал науку со старших классов 15 лет, а в последние 10 лет я путешествую, читаю лекции на тему «Сотворение, эволюция и динозавры».
  rating: neutral
  verdict: Приветствие и представление. Опыт школьного учителя сам по себе не делает доводы верными или неверными; их мы разбираем по существу.
  rhetoric:
  - self-authority

- id: lecture-2-71
  start: 71.5
  end: 80.7
  text: Перед этим мы узнали, что Библия говорит о возрасте Земли. Библия учит, что Бог сотворил весь мир за 6 дней, около 6 000 лет назад. Не миллионы лет назад.
  rating: purple
  verdict: 'Мы тоже верим, что мир сотворил Бог. Но «около 6000 лет» Библия прямо не говорит: это вывод из сложения родословий, а дни творения христиане с древности понимали по-разному. Это законный богословский спор.'
  arguments:
  - genesis-literal

- id: lecture-2-81
  start: 81.6
  end: 99.4
  text: 'Я хочу поговорить про Эдемский сад, о том, как он выглядел. В Библии во Втором Петра 3:3 написано: «Прежде всего знайте, что в последние дни явятся наглые ругатели». Вы знаете, что есть люди, которые насмехаются над Библией? Я встречаюсь с ними регулярно. Я их привлекаю как магнит.'
  rating: neutral
  verdict: Тема лекции и начало разбора 2 Пет 3. Что над Библией насмехаются, правда; о том, кого Ховинд называет «ругателями», ниже.

- id: lecture-2-100
  start: 100.2
  end: 118.2
  text: Там говорится, что они будут поступать по собственным своим похотям. И причина этого не в науке, а в их грехе. Нет научной причины для отвержения Библии. Но некоторым людям не нравится эта книга, они не хотят, чтобы Бог говорил им, что делать…
  rating: orange
  verdict: Что неверие бывает связано с нежеланием слушаться Бога, Писание говорит. Но объявлять, что у несогласных с молодой Землёй нет научных причин, а есть только грех, — значит не отвечать на их доводы.
  rhetoric:
  - ad-hominem-pivot

- id: lecture-2-120
  start: 120.0
  end: 145.8
  text: 'Ругатели будут … говорить: «Где обетование пришествия Его? Ибо с тех пор, как стали умирать отцы, от начала творения всё остаётся так же». Это важная фраза, мы говорим о ней на видеокассете четвёртой. … А в следующем стихе написано, что думающие так не знают. На греческом это значит «тупой по собственной воле».'
  rating: purple
  verdict: Пётр обличает тех, кто смеётся над обещанием второго пришествия, и мы тоже ждём Христа. Но переносить его слова на учёных-геологов — толкование, а многие из них верят в пришествие.
  rhetoric:
  - loaded-language

- id: lecture-2-148
  start: 148.3
  end: 195.2
  text: Ругатели не хотят знать о двух вещах. Первое, они не хотят знать, что словом Божьим — небеса и земля. Заметьте, что здесь больше, чем одно небо? … И потом здесь говорится, что небеса и земля составлены из воды и водою. … Ругатели не знают о сотворении. Они не понимают, что произошло 6 000 лет назад, когда Бог сотворил небо и землю, потому что то время сильно отличается от нашего.
  rating: purple
  verdict: 'Мы тоже верим, что небо и земля сотворены словом Божьим. Но в 2 Пет 3:5 нет ни даты, ни «6000 лет»: эту цифру Ховинд добавляет сам.'
  arguments:
  - genesis-literal

- id: lecture-2-196
  start: 196.0
  end: 234.1
  text: В следующем стихе написано, что ругатели не знают о потопе. «Потому тогдашний мир погиб, быв потоплен водою». Этот мир был уничтожен потопом 4 400 лет назад. … «Тот же мир сохраняется огню на день суда…» Это грядущий суд, который придёт и в ваш город. Ругатели не знают о сотворении. Они не знают о потопе. И не знают о грядущем суде Бога.
  rating: purple
  verdict: Мы тоже верим в грядущий суд, и Пётр действительно говорит о потопе. Но дата «4400 лет назад» — вывод из родословий, а размах потопа христиане понимают по-разному.
  arguments:
  - genesis-literal

- id: lecture-2-234
  start: 234.7
  end: 264.5
  text: 'Они не хотят допустить, чтобы Бог сотворил мир. Потому что это значит, что Он владеет миром и в мире есть правила. … И они не допускают потоп, потому что это значит, что у Бога есть право судить творение. … И они не допускают грядущий суд, потому что это значит, что им придётся дать отчёт за все грехи. Как-то я увидел наклейку: «Иисус скоро придёт! И какой Он злой».'
  rating: orange
  verdict: 'Что человек может бежать от ответственности перед Богом, верно. Но принимать древний возраст Земли — не то же, что отрицать Творца и суд: так думают и многие верующие.'
  rhetoric:
  - ad-hominem-pivot

- id: lecture-2-266
  start: 266.6
  end: 302.8
  text: 'Ну, давайте поговорим о сотворении. В первой главе Бытия написано: «В начале сотворил Бог небо и землю». А в пятом стихе написано: «И был вечер, и было утро: день». Это Библия версии Короля Якова, и если вы говорите на английском, вы должны её читать. Я коллекционирую разные переводы… Но некоторые версии изменены. Во многих нет слова «кровь». Из многих выкинуты целые стихи… И этому есть много причин, о которых мы говорим на видеокассете седьмой.'
  rating: purple
  verdict: 'Перевод короля Якова — прекрасный и почтенный перевод. Но разночтения новых переводов идут от более древних рукописей, а не от желания убрать слово «кровь»: о крови Христа они говорят десятки раз. Это спор о текстологии.'
  arguments:
  - kjv-only

- id: lecture-2-303
  start: 303.5
  end: 343.4
  text: 'В переводе Короля Якова говорится: «День один». Разговор идёт об определённом дне. … Вот, например, Исправленный стандартный перевод: «И был вечер, и было утро. Один день». … Здесь написано «один день» — очень неопределённо. А в стихе восьмом вместо «День второй» написано «второй день». А почему так произошло? Просто переводчики этой версии не верят в буквальное шестидневное сотворение, они верят в теорию разрыва.'
  rating: red
  verdict: В еврейском тексте Быт 1:5 стоит «йом эхад» — буквально «день один», так что «один день» точно передаёт оригинал. К тому же теорию разрыва прославила Библия Скофилда, основанная как раз на переводе короля Якова.
  arguments:
  - kjv-only
  rhetoric:
  - ad-hominem-pivot

- id: lecture-2-344
  start: 344.0
  end: 387.4
  text: Вы слышали об этой теории? В этой теории говорится, что между двумя первыми стихами Библии находится миллиарды лет. Они говорят, что в этом разрыве жила раса людей до Адама. Это то, чему учат в учебниках. И даже многие христианские школы учат этому… Они говорят, что тогда произошёл мятеж и суд над Люцифером. Подождите. Здесь кто-то был до Адама?… Давайте посмотрим, что говорит Библия.
  rating: purple
  verdict: 'Теорию разрыва Ховинд описывает в целом верно, и многие богословы её не разделяют. Но в школьных учебниках ей не учат: это богословская идея о Бытии, а не научная.'
  arguments:
  - genesis-literal

- id: lecture-2-388
  start: 388.1
  end: 428.4
  text: Исход 20:11. Это часть десяти заповедей, и Бог это написал сам на камне. «Ибо в шесть дней создал Господь небо и землю, море и всё, что в них». Я не вижу места теории разрыва. … «А в седьмой день почил». И если между первым и вторым стихом разрыв, то тогда это уже не седьмой день. На протяжении всей Библии этот день назван седьмым…
  rating: purple
  verdict: Исх 20:11 — серьёзный довод в пользу буквальных дней, и его надо принимать всерьёз. Другие толкователи видят здесь образец рабочей недели для человека, а не хронологию; это законный богословский спор.
  arguments:
  - genesis-literal

- id: lecture-2-429
  start: 429.9
  end: 461.5
  text: 'Также мы узнаём из Римлян, что смерть появилась из-за греха. Ничего не умирало до грехопадения Адама. Библия ясна: человеком вошла смерть. … И Библия говорит, что последний же враг истребится — смерть. Но если смерть уже была до Адама, тогда смерть — это не враг. Это часть создания. Но Библия говорит, что смерть вошла через грех человека.'
  rating: purple
  verdict: Мы тоже верим, что смерть — враг, и что через грех вошла смерть (Рим 5:12). Но Павел пишет, что смерть «перешла во всех человеков»; о смерти животных до грехопадения христиане спорят.
  arguments:
  - death-before-fall

- id: lecture-2-462
  start: 462.6
  end: 508.7
  text: 'И мы знаем, что Люцифер не был сброшен с неба между первым и вторым стихами. Потому что в Иезекииле говорится, что он находился в Эдеме, доколе не нашлось в нём беззакония. … И Эдемский сад не был сотворён до шестого дня. Тогда он не мог упасть с неба до первого дня. Мы также знаем из Иова 38, что все сыны Божьи восклицали от радости… Мы также знаем, что Бог посмотрел на всё и сказал: хорошо весьма. Это не было бы очень хорошо, если бы уже был плохой Сатана.'
  rating: purple
  verdict: Связь Иез 28 с падением сатаны — древнее толкование, хотя пророк прямо обращается к царю Тира. Когда пал сатана, Писание не говорит, поэтому довод держится на толковании, а не на тексте.
  arguments:
  - genesis-literal

- id: lecture-2-510
  start: 510.0
  end: 550.3
  text: Вот проблемы с этой теорией. Она была придумана в 1814 году. И это нестандартная позиция церкви. Она придумана шотландским проповедником. И эта теория противоречит Писанию. Также ставит смерть до греха. … Теория разрыва противоречит Писанию, науке, и она лишняя. Цель теории — чтобы Библия сказала, что Земле миллиарды лет. … Они пытались компрометировать Библию с современной теорией эволюции. И это ошибка… В конце Библия всё равно будет права.
  rating: orange
  verdict: 'Что теорию разрыва популяризировал шотландский проповедник Томас Чалмерс около 1814 года, верно. Но Дарвин издал свою книгу в 1859 году: Чалмерс отвечал на открытия геологии, а не на эволюцию.'
  arguments:
  - genesis-literal

- id: lecture-2-551
  start: 551.6
  end: 579.2
  text: 'Я также взял другие переводы, например перевод «Живая Библия», чтобы посмотреть, что там написано. Кеннет Тейлор сказал: «И произвела земля зелень…» День третий. Я подумал, что это хороший перевод. Пока я не увидел сноску. Внизу было написано: буквально — «период времени». Он говорит, что день — это вообще не день. День представляет собой длинный период времени.'
  rating: purple
  verdict: 'Сноска Кеннета Тейлора не выдумка: понимать «день» шире суток предлагали задолго до Дарвина, а Августин вообще не считал дни творения обычными сутками. Это законный богословский спор.'
  arguments:
  - genesis-literal

- id: lecture-2-580
  start: 580.1
  end: 600.9
  text: 'Вы слышали об этой идее? Это называется теория «день-эпоха». Они также используют 89-й псалом: «1 000 лет как день вчерашний» и Второе Петра 3:8: «что у Господа один день как тысяча лет». Но я хочу сказать, что ни один из этих стихов не говорит о создании. Здесь говорится, что время ничего не значит для Бога.'
  rating: purple
  verdict: Что Пс 89:4 и 2 Пет 3:8 говорят не о днях творения, а о том, что Бог выше времени, — верное замечание. Но из этого ещё не следует, что дни Быт 1 — обычные сутки.
  arguments:
  - genesis-literal

- id: lecture-2-602
  start: 602.4
  end: 636.3
  text: Они не говорят о создании, потому что в третий день Бог сотворил траву, растения и деревья. На четвёртый день Он сотворил солнце. Если дни — это миллионы лет, то скажите мне, как выжили растения без солнца на протяжении миллионов лет? И насекомые, опыляющие растения, появились на день пятый. А как насчёт субботы? Люди должны работать 6 млн лет и только потом отдыхать. Это бессмысленно. Нет, это были нормальные дни, как сегодняшний.
  rating: purple
  verdict: 'Возражение против теории «день-эпоха» законное: порядок дней Быт 1 не совпадает с порядком, который видит наука. Но многие толкователи делают другой вывод: Быт 1 вообще не научная хронология.'
  arguments:
  - genesis-literal

- id: lecture-2-636
  start: 636.9
  end: 645.3
  text: Книга под названием «Безвидна и пуста» полностью объясняет еврейский текст Бытия. Рассказывает о теории разрыва как о противоречащей Писанию и науке.
  rating: neutral
  verdict: Рекомендация книги против теории разрыва; на доводы не влияет.

- id: lecture-2-647
  start: 647.5
  end: 692.4
  text: 'Стих шестой. И сказал Бог: «Да будет твердь посреди воды». … А что такое твердь? … А многие говорят: «О, я знаю. Твердь — это Земля. Земля разделяет воду от воды». Нет, нет, нет, это не Земля. Когда вы читаете двадцатый стих, в нём написано: «И птицы да полетят над землёю, по тверди небесной». Вы знаете, птицы не летают в Земле. Птицы летают в воздухе. С двадцатого стиха видно, что твердь — это где летают птицы.'
  rating: purple
  verdict: 'Что птицы летают «по тверди небесной», в тексте есть. Но еврейское «ракиа» значит нечто твёрдое, «свод»: древние представляли небо куполом. Видеть здесь атмосферу — современное прочтение.'
  arguments:
  - vapor-canopy

- id: lecture-2-692
  start: 692.6
  end: 738.5
  text: 'Это первое небо. В Библии упомянуто три неба. Первое небо, где летают птицы. В Бытие 1:14 говорится: «Да будут светила на тверди небесной». Солнце, Луна и звёзды. Это второе небо. Третье небо упоминается во Втором Коринфянам в главе двенадцатой. Апостол Павел … был восхищён до третьего неба. … Небеса — множественное число — проповедуют славу Божию… Не одно, три неба.'
  rating: neutral
  verdict: Деление на «три неба» (воздух, звёзды, обитель Бога) — распространённое толкование; на научные доводы оно не влияет.

- id: lecture-2-739
  start: 739.4
  end: 763.3
  text: 'В Бытие 1:7 написано: «И создал Бог твердь, и отделил воду, которая под твердью, от воды, которая над твердью». Подождите минуточку. О чём здесь говорится? Вода над атмосферой. Почему в 148 псалме говорится: «Хвалите Его, небеса небес и воды, которые превыше небес»? Воды над атмосферой.'
  rating: purple
  verdict: Мы тоже читаем о «водах, которые превыше небес» (Пс 148:4). Но в картине мира древнего Востока это воды над небесным сводом, и считать их слоем воды над атмосферой — догадка, а не прямой смысл текста.
  arguments:
  - vapor-canopy

- id: lecture-2-765
  start: 765.2
  end: 781.4
  text: 'Почему во Втором Петра написано: «Земля составлена из воды и водою»? Я думаю, это странное выражение. Я думаю, что мы не знаем, как Бог сотворил небеса, и не знаем, как земля составлена из воды и водою. Как и написано в Библии, что произойдёт в последнее время.'
  rating: neutral
  verdict: 'Честная оговорка: что значит «земля составлена из воды и водою», мы точно не знаем.'

- id: lecture-2-781
  start: 781.9
  end: 794.2
  text: 'В Исаии говорится: «Господь восседает над кругом земли». Кстати, христиане, которые читают Библию, всегда знали, что Земля круглая. Некоторые думали, что Земля плоская, мы знали, что она круглая. Если бы они спросили, мы бы им сказали.'
  rating: orange
  verdict: 'Что образованные люди, и христиане тоже, знали о шарообразности Земли, верно: её вычислили ещё древние греки. Но еврейское «круг» у Исаии значит скорее «диск» или «окружность», а не шар.'
  arguments:
  - bible-science-foreknowledge

- id: lecture-2-797
  start: 797.0
  end: 805.5
  text: Тогда говорится, что Он распростёр небеса. Может быть, поэтому существует красное смещение. Интересно, а мы говорим об этом на кассете номер семь.
  rating: orange
  verdict: Образ «распростёр небеса» прекрасен, и мы тоже видим в мире славу Творца. Но поэтическая строка Исаии не описывает красное смещение, а само красное смещение — главный довод в пользу Большого взрыва, который Ховинд отвергает.
  arguments:
  - bible-science-foreknowledge

- id: lecture-2-806
  start: 806.0
  end: 831.1
  text: 'Сегодня в нашей атмосфере шесть слоёв: тропосфера, стратосфера, мезосфера, термосфера, экзосфера, ионосфера. Раньше был седьмой слой, слой воды над атмосферой. Некоторые думают, что это был слой льда. Это интересная теория, так как холодный лёд может висеть в магнитном поле. Эффект Мейснера. Но вся эта вода уже упала во время потопа, и теперь этой оболочки нет.'
  rating: red
  verdict: Эффект Мейснера — свойство сверхпроводников выталкивать магнитное поле; лёд не сверхпроводник и в магнитном поле Земли не «висит». Следов допотопного водяного или ледяного слоя над атмосферой нет.
  arguments:
  - vapor-canopy
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-833
  start: 833.0
  end: 848.1
  text: И поэтому Пётр сказал, что ругатели последних дней не будут знать, как Бог сотворил небеса и как Земля составлена из воды и водою. И что тогдашний мир погиб, быв потоплен водою. Здесь говорится о потопе.
  rating: purple
  verdict: Пётр действительно говорит о потопе, и мы в это верим. Но о водяном слое над атмосферой в его словах ничего нет.
  arguments:
  - vapor-canopy

- id: lecture-2-849
  start: 849.4
  end: 871.2
  text: Вот что произошло. Я думаю, что вода для потопа появилась из двух, возможно, трёх источников. Мы говорим об этом на кассете 6, «Теория Ховинда». Оболочка воды могла предохранять землю. И она также создавала эффект парника. Библия также говорит в псалме сто тридцать пятом, что Бог утвердил Землю на водах. Интересно, утвердил Землю на водах?
  rating: red
  verdict: Поэтические слова псалма «утвердил землю на водах» не описывают устройство планеты. А водяной покров с таким запасом воды дал бы не мягкую теплицу, а перегрев, как на Венере.
  arguments:
  - vapor-canopy

- id: lecture-2-872
  start: 872.2
  end: 911.5
  text: 'Очевидно, когда Бог сотворил землю, то под земной корой было намного больше воды. В двадцать третьем псалме говорится: «Господня земля … ибо Он основал её на морях и на реках утвердил её». Очевидно, Бог основал Землю на воде. Был … слой воды под земной корой. Слой камня, наверное, 20–30 км толщины. Слой воздуха, чтобы можно было дышать. И слой воды для предохранения. … Во время потопа все источники великой бездны и окна небесные отворились. И большинство воды потопа поднялось из бездны, а не сверху.'
  rating: red
  verdict: 'Сейсмические волны просвечивают Землю насквозь: под корой лежит твёрдая мантия, а не океан воды. Слоя воды под корой толщиной в километры нет и быть не может при таком давлении.'
  arguments:
  - hydroplates

- id: lecture-2-913
  start: 913.0
  end: 943.5
  text: 'Один … сказал: «Доктор Ховинд, вы понимаете, что если шёл такой сильный дождь, что затопил гору Эверест, то латентное тепло конденсации сварило бы весь мир?» Я сказал: вы правы, но вы строите карточный домик. Вся вода не произошла от дождя. Вода била из-под земли, и поэтому этой проблемы не было. Во-вторых, вода не покрыла Эверест. Этой горы тогда не было. Прочтите 104-й псалом. Горы поднялись в конце потопа. Горы поднялись, долины опустились, и вода сошла.'
  rating: red
  verdict: 'Возражение о тепле законное, но ответ его не снимает: вода из-под земли выделила бы не меньше тепла. На вершине Эвереста лежат морские известняки, а Гималаи растут десятки миллионов лет, а не поднялись за год.'
  arguments:
  - mountain-uplift
  rhetoric:
  - personal-story

- id: lecture-2-944
  start: 944.5
  end: 950.2
  text: '[Большой] каньон, наверное, был высечен за несколько дней. Мы говорим об этом на кассете шестой «Теория Ховинда».'
  rating: red
  verdict: Большой каньон прорезан в слоях, среди которых есть следы пустынь, почв и рек; на склонах лежат лавы возрастом до миллиона лет. За несколько дней так не получилось бы.
  arguments:
  - grand-canyon-flood

- id: lecture-2-951
  start: 951.6
  end: 975.5
  text: Во время потопа в Земле образовались трещины, которые мы можем увидеть даже сегодня. Таких трещин несколько. Например, трещина Сан-Андреас в Калифорнии. И многие другие. Я думаю, что эти трещины, которые мы видим сегодня, это те места, в которых во время потопа отворились все источники великой бездны. Я посетил несколько таких трещин, трещину в Новом Мадриде. Я думаю, это свидетельство потопа.
  rating: red
  verdict: Разлом Сан-Андреас — граница двух литосферных плит, сдвигающихся на несколько сантиметров в год, а сейсмозона Нью-Мадрид — древний разлом внутри плиты. С «источниками бездны» их ничто не связывает.
  arguments:
  - hydroplates

- id: lecture-2-976
  start: 976.3
  end: 993.4
  text: Но я думаю, что до потопа Земля была как большая теплица. Вы знаете, что такое теплица? И поэтому, очевидно, оболочка воды имела эффект теплицы. Вы знаете, что учёные до сих пор находят воду в космосе? Интересно.
  rating: orange
  verdict: 'Что в космосе есть вода, верно: в кометах, на спутниках, в межзвёздных облаках. Но к допотопному слою воды над Землёй это отношения не имеет.'
  arguments:
  - vapor-canopy
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-994
  start: 994.5
  end: 1040.0
  text: Недавно появилась новая теория. Недостаток кислорода уничтожил динозавров. … В 1993 году в Чикаго встретились специалисты по динозаврам. Они сказали, что у динозавров очень маленькие лёгкие и ноздри. У двадцатичетырёхметрового апатозавра ноздри размером как у лошади. … Он не смог бы выжить в нашей атмосфере. Он бы так тяжело дышал, что он бы загорелся. … Но очевидно, что они могли дышать, так как мы находим их кости по всему миру.
  rating: red
  verdict: У многих динозавров была птичья система дыхания с воздушными мешками, одна из самых эффективных у животных. Им не нужна была особая атмосфера, а «встреча в Чикаго» не названа так, чтобы её можно было проверить.
  arguments:
  - vapor-canopy
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-1040
  start: 1040.6
  end: 1082.3
  text: То как же жили динозавры? Если они жили в мире до потопа, то тогда было двойное давление атмосферы из-за оболочки воды. Если вы взберётесь на верхушку горы, то воздух будет разрежённым, будет трудно дышать. Но при двойном давлении легче дышать. Не только это, в атмосфере было больше кислорода. При исследовании янтаря … иногда в янтаре находят пузырьки воздуха, в которых на 50% больше кислорода, чем у нас сегодня. Вы знаете, что если бы вы жили в атмосфере с двойным давлением и в которой будет на 50% больше кислорода, тут только дышать было бы очень приятно.
  rating: red
  verdict: 'Пузырьки в янтаре плохо хранят воздух: газы проходят сквозь смолу, и выводы о «50% кислорода» не подтвердились. А жизнь при двойном давлении и избытке кислорода вызвала бы кислородное отравление.'
  arguments:
  - vapor-canopy

- id: lecture-2-1084
  start: 1084.8
  end: 1121.0
  text: 'Адам вздохнул бы и сказал: «Ева, давай ещё разок». Потому что кислород будет поступать не только в гемоглобин, но и плазма была бы насыщена кислородом. Что значит, что вы смогли бы бежать сотни километров не уставая. Я думаю, Еве не нужна была машина, они могли бегать к бабушке. Только у них не было бабушки. Ни тёщи. Поэтому это был рай. Нет, ну вообще-то у моей жены прекрасная мама.'
  rating: orange
  verdict: Это в основном шутки. Но в них спрятано утверждение, что при большем кислороде можно бежать сотни километров без усталости; на деле усталость зависит не только от кислорода, а постоянный избыток кислорода вреден.
  arguments:
  - vapor-canopy

- id: lecture-2-1121
  start: 1121.3
  end: 1131.6
  text: Но до потопа мир был другим. Оболочка воды увеличивала давление воздуха и фильтровала радиацию. И люди выздоравливали в то время намного быстрее.
  rating: red
  verdict: Ни повышенного давления, ни особой защиты от радиации до потопа геология не показывает. Что «люди выздоравливали быстрее», ничем не подтверждено.
  arguments:
  - vapor-canopy

- id: lecture-2-1132
  start: 1132.5
  end: 1190.0
  text: Вы помните ребёнка Джессику, которая упала в колодец в Техасе в восемьдесят седьмом году? Она упала в узкий двадцатисантиметровый колодец … Она находилась в нём два с половиной дня. Когда её вытащили из колодца, часть тела почернела. И доктор сказал, что необходимо ампутировать её ногу. Другой доктор предложил поместить её в гипербарическую кислородную камеру. … Накачали чистый кислород и увеличили давление. В течение нескольких часов в ноге восстановилась циркуляция крови. В конце им пришлось ампутировать только половину маленького пальца на ноге. … Сейчас у неё всё прекрасно.
  rating: green
  verdict: 'В целом верно: в 1987 году малышку Джессику Макклюр спасли из колодца в Техасе, и гипербарическая кислородная камера помогла сохранить ей ногу.'

- id: lecture-2-1191
  start: 1191.9
  end: 1238.6
  text: И самая большая кислородная камера находится в Пенсаколе. В неё помещается 30 человек. В Западной Германии с помощью гипербарического кислорода лечат всех пациентов с заболеванием сердца. В Англии лечат рассеянный склероз. … В Индии лечат проказу. Разные заболевания положительно реагируют на увеличение кислорода. … Много спортивных команд используют такие камеры. Они установили, что раненые игроки выздоравливают в два раза быстрее. … Интересно.
  rating: orange
  verdict: 'Гипербарический кислород действительно лечит ряд болезней: отравление угарным газом, кессонную болезнь, некоторые раны. Но лечение рассеянного склероза и проказы им не доказано, а «выздоравливают вдвое быстрее» — без источника.'
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-1241
  start: 1241.0
  end: 1258.2
  text: Например, можно купить маленькую камеру, как спальный мешок? Три с половиной тысячи долларов. И спать в ней ночью. Надо только укрыться потеплее, так как может быть там холодно. Я думаю, что Земля до потопа могла быть как такая камера. Это объяснит многие вещи.
  rating: red
  verdict: 'Камера — короткая процедура под присмотром врача. Жить в ней постоянно вредно: длительное дыхание кислородом под давлением отравляет лёгкие и нервную систему, так что «Земля-камера» была бы опасна.'
  arguments:
  - vapor-canopy

- id: lecture-2-1258
  start: 1258.6
  end: 1302.5
  text: Если вы выращиваете растения в таких условиях, как, например, доктор Ким Мори. Он выращивал помидоры с повышенным давлением углекислого газа, которым дышат растения. … Также он использовал пластический щит для защиты от ультрафиолетовых лучей. … Через два года его куст достиг высоты 5 м и принёс 907 помидоров. Сейчас куст находится в Токио, 12 м высоты и приносит 15 000 помидоров. Только один куст. И плоды … тоже сравнительно большого размера.
  rating: orange
  verdict: 'Томатное «дерево» с тысячами плодов действительно выращивали в Японии. Но это гидропоника: корни в питательном растворе, стебель на опорах, — а не опыт с давлением и защитой от ультрафиолета.'
  arguments:
  - vapor-canopy

- id: lecture-2-1305
  start: 1305.1
  end: 1327.8
  text: И вы сможете представить себе, что до потопа таким был весь мир? Все растения были намного больше. И приносили намного больше плодов. В три или четыре раза больше, чем сегодня. При увеличенном давлении и повышенном углекислом газе растения растут намного быстрее.
  rating: red
  verdict: Из одного тепличного куста нельзя вывести, что все растения до потопа были в разы больше. Углекислый газ ускоряет рост лишь до предела, если хватает воды, света и питания.
  arguments:
  - vapor-canopy

- id: lecture-2-1329
  start: 1329.4
  end: 1377.4
  text: 'Как-то атеист спросил меня: «Вы знаете, сколько угля под землёй?» … Он сказал: «Вы знаете, что угля больше, чем всех растений сегодня, чтобы произвести уголь». Я сказал: «Да, вы правы». Он сказал: «Видите, это доказывает, что уголь формировался миллионы лет». Я сказал: нет. Сегодня 70% мира под водой. То, что вы говорите, доказывает, что мир до потопа был другим. Раньше было намного больше деревьев. Они были больше размером. … Факт того, что угля больше, чем растений, доказывает, что произошёл потоп и разрушил допотопный мир. … Это не доказывает миллионы лет.'
  rating: red
  verdict: Угля действительно больше, чем растений сегодня, — но он копился сотни миллионов лет. Угольные пласты лежат десятками слоёв, разделённых морскими и речными отложениями, со следами корней на месте; один потоп так не откладывает.
  arguments:
  - fossil-fuels-flood
  rhetoric:
  - personal-story

- id: lecture-2-1378
  start: 1378.5
  end: 1390.9
  text: Слой воды над атмосферой был бы преградой вредной радиации. Солнце производит не только свет, но и ультрафиолетовые лучи, рентгеновые лучи, гамма-лучи, бета-лучи, которые вредны для тела.
  rating: orange
  verdict: Что Солнце излучает и ультрафиолет, и рентгеновские лучи, верно. Но рентген и гамма-лучи и так задерживает атмосфера, от ультрафиолета защищает озоновый слой, а слой воды, способный их остановить, задержал бы и свет.
  arguments:
  - vapor-canopy

- id: lecture-2-1391
  start: 1391.9
  end: 1444.7
  text: 'Вам когда-то делали рентген? В детстве я ломал девять костей. … Тогда вас ставят перед аппаратом … И доктор выходит из комнаты. … Он говорит: когда я нажму кнопку, то маленькие рентгеновые пули пройдут через ваше тело, как из автомата, и оставят много маленьких дырочек на вашей коже. … Вот почему у многих врачей-радиологов противоположный взгляд на мир. … Но эти дырочки очень маленькие, они заживают очень быстро.'
  rating: orange
  verdict: 'Рентген действительно может повреждать клетки, поэтому врач и выходит из комнаты. Но «дырочек в коже» он не оставляет: излучение повреждает молекулы, а не пробивает кожу, как пули.'
  arguments:
  - vapor-canopy
  rhetoric:
  - false-analogy

- id: lecture-2-1445
  start: 1445.3
  end: 1474.4
  text: Вы знаете, что солнце имеет такой же эффект каждый день вашей жизни? Кроме пасмурных дней, когда вода останавливает радиацию. Это происходит каждый день. И это сказывается на вашей коже. Ваше тело должно залечивать эти дырочки. Нет проблем. Но после сорока, пятидесяти или 60 лет ваша кожа начинает сдаваться. И на коже появляются морщины.
  rating: orange
  verdict: Верно, что солнечный ультрафиолет старит кожу и вызывает морщины. Но и в пасмурные дни большая часть ультрафиолета проходит сквозь облака, так что вода в небе от него не спасает.
  arguments:
  - vapor-canopy

- id: lecture-2-1478
  start: 1478.9
  end: 1516.8
  text: 'Тогда вы скажете: «Брат Ховинд, я не хочу, чтобы у меня были морщины». Извините, у вас есть три выбора. Первое, вы можете умереть раньше. Второе, вы можете носить бетонный или свинцовый зонтик всё время. И третье, вы можете сделать то, что сделала Елизавета Тейлор, кинозвезда, — пластическую операцию. … Извините, но все мы стареем. … Но до потопа этого не происходило. Библия говорит, что до потопа люди жили по 900 лет.'
  rating: red
  verdict: Что солнце старит кожу, верно. Но стареют и органы, куда свет не доходит, а Библия, говоря о долгой жизни патриархов, с водяным слоем её не связывает. Это догадка Ховинда, а не текст.
  arguments:
  - vapor-canopy

- id: lecture-2-1518
  start: 1518.1
  end: 1550.0
  text: 'Один человек, который уверяет, что он верит в сотворение, говорит, что они не жили 900 лет. Он говорит, что они считали каждый месяц как год. Поэтому их возраст нужно поделить на двенадцать. О, это ещё большее чудо. Енох жил 65 лет и родил Мафусала. Давайте посмотрим: 65 поделить на 12 — ему было пять с половиной лет, когда он стал отцом. Нет. Они жили 900 лет.'
  rating: purple
  verdict: 'Возражение против «месяцев вместо лет» по существу верно: при таком делении Енох стал бы отцом в пять лет. Как понимать большие числа Быт 5, христиане спорят; это законный богословский спор.'
  arguments:
  - genesis-literal

- id: lecture-2-1550
  start: 1550.6
  end: 1579.7
  text: И также они были больше размером. Вот я возле статуи Роберта Уодлоу. 2 м 74 см. … В пять лет этот человек был метр шестьдесят два. Большой мальчик. … Мы называем это гигантизмом. Ну, я думаю, что до потопа люди были ещё больше.
  rating: orange
  verdict: Цифры о Роберте Уодлоу верны. Но его рост — следствие болезни гипофиза, от которой он страдал и умер в 22 года; болезнь не говорит о том, какими были здоровые люди прошлого.
  arguments:
  - giants

- id: lecture-2-1580
  start: 1580.1
  end: 1596.7
  text: Вот фотография найденного скелета в итальянской угольной шахте. Три метра 52 сантиметра высоты. Точнее, длины. Он уже лежит. … Было бы неплохо иметь такого игрока в вашей баскетбольной команде. Правда?
  rating: red
  verdict: Скелета длиной 3,5 м из итальянской шахты в научных описаниях нет; известные снимки «гигантских скелетов» — фотомонтажи. Таких фото в музеях нет, а кости человека такого роста не выдержали бы веса тела.
  arguments:
  - giants

- id: lecture-2-1598
  start: 1598.8
  end: 1646.6
  text: 'Иногда женщины обижаются на меня. Они спрашивают: «Откуда я знаю, что это скелет мужчины?» … Я преподавал биологию и анатомию, и я знаю, как отличить скелет мужчины от скелета женщины. Не по числу рёбер. Только у Адама не хватало одного ребра. … Посмотрите на ноги. Если ноги показывают на магазин, это женщина. … Также посмотрите на челюстное соединение. Если оно изношено — это женщина. … Пожалуйста, не извиняйтесь.'
  rating: neutral
  verdict: Шутки об определении пола по скелету. Число рёбер у мужчин и женщин и правда одинаковое; на доводы это не влияет.

- id: lecture-2-1647
  start: 1647.4
  end: 1670.6
  text: Вы знаете, что были найдены гигантские скелеты, о которых вы не читаете в учебниках? Был найден скелет 2 м 95 см. Не слышали? В Неваде найден трёхметровый скелет. Некоторые люди хотят, чтобы вы поверили, что современный человек большой, сильный и умный. И что древние люди были маленькими и тупыми. Но я думаю, что всё наоборот.
  rating: red
  verdict: 'Учебники о гигантских скелетах молчат, потому что ни одного проверенного нет. И наука не учит, что древние люди были «тупыми»: она изучает их орудия, искусство и мозг, который был не меньше нашего.'
  arguments:
  - giants
  rhetoric:
  - straw-man
  - appeal-to-doubt

- id: lecture-2-1671
  start: 1671.4
  end: 1700.7
  text: В Уокертоне археологи и любители нашли восемь гигантских скелетов, около трёх метров. Все были одеты в тяжёлые медные доспехи. Через неосмотрительность откапывателей и незаинтересованность музеев эти находки разбросаны и потеряны. Но почему музеи не заинтересованы трёхметровыми скелетами? Четырёхметровый скелет был найден в Ломпок-Ранчо в Калифорнии, но позже остатки были перезахоронены.
  rating: red
  verdict: Это пересказ газетных историй, после которых не осталось ни одной кости для проверки. Музеи охотно выставляют необычные находки; «потерянные» скелеты — признак того, что проверять было нечего.
  arguments:
  - giants
  rhetoric:
  - appeal-to-doubt

- id: lecture-2-1702
  start: 1702.4
  end: 1724.8
  text: Сообщение о четырёхметровом скелете появлялось в округе Аризоны в 1891 году. Смитсоновский институт заинтересован, чтобы никто не нашёл эти скелеты. Прочитайте книгу «Смитсонгейт». Смитсоновский институт был основан, чтобы учить эволюции. Эти трёхметровые скелеты противоречат теории. Это явно не шимпанзе.
  rating: red
  verdict: Смитсоновский институт основан в 1846 году «для умножения и распространения знаний» — за 13 лет до книги Дарвина. Скрыть тысячи огромных костей от множества сотрудников и учёных за полтора века невозможно.
  arguments:
  - giants
  rhetoric:
  - conspiracy

- id: lecture-2-1727
  start: 1727.0
  end: 1743.4
  text: Это фотография черепа из Невады. Громадный человеческий череп. Эта стрелка показывает на нормальную человеческую кость. Сверху нормальная кость. Снизу найденная гигантская человеческая кость.
  rating: red
  verdict: Фотография без описания находки, места и хранения ничего не доказывает. Ни один «гигантский череп из Невады» не описан в научных работах.
  arguments:
  - giants

- id: lecture-2-1745
  start: 1745.0
  end: 1770.7
  text: 'Правительство Турции утверждает, что был найден скелет Ноя. Я не знаю, правда ли это, но они говорят, что скелет был больше трёх метров длины. Значит, и его локоть был больше. Всё-таки какого размера был ковчег? Люди спрашивают: «Как четыре человека могли построить такой большой ковчег?» А вы не видели их? Эй, сынок, принеси мне вот то дерево.'
  rating: orange
  verdict: Ховинд честно оговаривается, что не знает, правда ли это. Но тут же строит на слухе вывод о размере локтя и ковчега, а сообщений правительства Турции о «скелете Ноя» нет.
  arguments:
  - giants

- id: lecture-2-1774
  start: 1774.0
  end: 1790.6
  text: Вот эти челюсти находятся в Гателе в Турции. 16 см ширины. Вы могли бы свободно поставить вашу голову в эту челюсть. У нормального человеческого черепа челюсти ширина около 8 см. Этих — шестнадцать.
  rating: red
  verdict: Челюсти шириной вдвое больше человеческой в научных описаниях нет; без названия находки и места хранения её нельзя проверить. Крупные челюсти известны у вымерших обезьян, а не у людей.
  arguments:
  - giants

- id: lecture-2-1791
  start: 1791.4
  end: 1820.0
  text: 'Висконсин. Об этом тогда писалось в газетах. При раскопках холмов в 1904 году были найдены гигантские человеческие кости. Я поговорил с женщиной, которая владеет курортом. Теперь эти холмы находятся под водой. Штат Висконсин. Она сказала: «О да, я помню, были найдены гигантские кости». Она сказала: «У моей подружки, ей 104 года, у неё был череп. Я спрошу их, что с ним случилось». 104 года.'
  rating: red
  verdict: 'Курганы Висконсина изучены: в них лежат кости индейцев обычного роста. Пересказ со слов знакомой о черепе у её столетней подруги — не находка, которую можно проверить.'
  arguments:
  - giants
  rhetoric:
  - personal-story

- id: lecture-2-1821
  start: 1821.5
  end: 1827.0
  text: В Библии, в Бытии написано, что в то время на Земле были исполины. И я верю, что были исполины.
  rating: purple
  verdict: 'Мы тоже читаем в Быт 6:4 об «исполинах». Но значение еврейского «нефилим» спорно: одни видят великанов, другие — «могучих», «прославленных» людей. Это законный спор о толковании.'
  arguments:
  - giants

- id: lecture-2-1827
  start: 1827.8
  end: 1846.5
  text: 'И сказал Бог: сотворим человека по образу Нашему. Тогда, если мы сотворены по образу Божьему, то почему мы платим, чтобы наших детей учили, что вот это наш дедушка? Не будут ли их учить этому завтра в этом городе? Конечно, будут.'
  rating: orange
  verdict: Мы тоже верим, что человек сотворён по образу Божьему. Но образ Божий — не форма костей, и многие христиане верят в него, принимая общее происхождение человека и обезьян.
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-2-1847
  start: 1847.0
  end: 1887.2
  text: Что такое пещерный человек? Давайте взглянем на доску позора эволюции. Человек Небраски. Вы знаете, что был найден только один зуб человека Небраски? … Из одного зуба был построен скелет гуманоида. И так же построена его жена. Два человека с одного зуба. … Ну, они же профессионалы. Потом было установлено, что это зуб свиньи. Вот настоящий человек Небраски.
  rating: orange
  verdict: Что зуб «человека Небраски» оказался зубом вымершей свиньи пекари, верно. Но рисунок «семьи» сделал художник для газеты, а ошибку к 1927 году исправили сами учёные.
  arguments:
  - ape-men-frauds
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-2-1889
  start: 1889.2
  end: 1928.5
  text: Ещё один пример. Пилтдаунский человек. Это настоящая подделка. Чарльз Доусон взял человеческий череп и челюсти обезьяны и соединил их вместе. … Вы знаете, что большинство преподавателей университетов никогда не видели оригинала? … Но 500 человек получили докторские звания, изучая Пилтдаунского человека. Это была подделка, но она находилась в учебниках 40 лет.
  rating: orange
  verdict: Пилтдаунский человек действительно подделка. Но разоблачили его в 1953 году сами учёные, многие сомневались в нём с самого начала, а «500 диссертаций» — цифра без источника.
  arguments:
  - ape-men-frauds

- id: lecture-2-1930
  start: 1930.5
  end: 1949.9
  text: 'Интересно, сколько детей за 40 лет потеряли доверие к Библии? Я не хотел бы предстать перед Богом и сказать: я разрушил веру детей в Бога. Они могли стать миссионерами, проповедниками, но нет. Я разрушил их веру. Фу, это будет ужасно.'
  rating: neutral
  verdict: Мы разделяем страх разрушить чью-то веру. Он касается и тех, кто связывает веру со слабыми доводами, которые потом рушатся.

- id: lecture-2-1951
  start: 1951.1
  end: 1991.5
  text: 'Неандерталец. Неандерталец — это был нормальный человек, который болел артритом. С деформированной спиной. … Они сказали: «Он медленно поднимается». Нет, он больной, он опускается. Но о нём учат и сейчас. И в вашем городе здесь детям говорят, что неандерталец — это потерянное звено. … Прочитайте книгу «Похороненные заживо», в которой рассказывается о так называемом неандертальском человеке и других пещерных людях.'
  rating: red
  verdict: 'Что неандертальцы — люди и даже скрещивались с нашими предками, верно. Но «больной артритом современный человек» — давно опровергнутая догадка по одному скелету: найдены десятки скелетов с особым строением и их ДНК.'
  arguments:
  - ape-men-frauds
  rhetoric:
  - cherry-picking

- id: lecture-2-1993
  start: 1993.2
  end: 2022.2
  text: Также в учебниках находится австралопитек, ещё известный под именем Люси. Вы слышали об австралопитеке? Дональд Йохансон нашёл австралопитека в Эфиопии в 1974 году. Он назвал его Люси, потому что в то время он с друзьями слушал популярную песню Beatles «Lucy in the Sky with Diamonds»…
  rating: green
  verdict: 'Верно: Дональд Йохансон нашёл скелет в Эфиопии в 1974 году и назвал его Люси по песне «Битлз».'

- id: lecture-2-2023
  start: 2023.9
  end: 2049.0
  text: 'Вы знаете, что австралопитек — полтора метра высоты. Это явно обезьяна. Но Национальный географический журнал приписал коленный сустав австралопитеку. На самом деле этот сустав был найден в 2 км в стороне и на 70 [м] глубже в земле. На вопрос, почему это произошло, Йохансон сказал: по анатомическому подобию.'
  rating: red
  verdict: Коленный сустав найден в 1973 году отдельно, и Йохансон всегда описывал его как отдельную находку, а не часть Люси. У самой Люси сохранились таз и бедро, которые говорят о прямохождении.
  arguments:
  - ape-men-frauds

- id: lecture-2-2050
  start: 2050.5
  end: 2062.4
  text: Я никак не могу понять, почему они думают, что найденный камень в земле доказывает, что он наш предок. Мне кажется, что найденная кость доказывает, что она уже умерла.
  rating: orange
  verdict: Сама кость действительно не говорит, есть ли у неё потомки. Но о родстве судят по строению многих находок, их возрасту и генетике; шутка про «умершую кость» вопроса не решает.
  rhetoric:
  - vysmeivanie-vmesto-dovoda
  - argument-by-incredulity

- id: lecture-2-2064
  start: 2064.9
  end: 2088.5
  text: Вы не знаете, были ли у неё дети? Почему кости делают то, чего не могут делать обезьяны сегодня? Сегодня у обезьян есть дети, но у них нет человеческих детей. Почему всё это происходило только очень давно? А вы думали над этим? Если человек произошёл от обезьяны раньше, почему он не происходит сегодня?
  rating: red
  verdict: Наука не говорит, что человек произошёл от нынешних обезьян. У людей и обезьян был общий предок, как у двоюродных братьев общий дедушка, поэтому обезьяны и не рождают людей сегодня.
  rhetoric:
  - straw-man
  - appeal-to-doubt

- id: lecture-2-2089
  start: 2089.8
  end: 2133.2
  text: Однако Дональд Йохансон сказал, что коленный сустав доказывает, что австралопитек становится человеком. … Он сказал, что австралопитек становится человеком, потому что бедро находится под наклоном. У человека бедренная кость находится под наклоном, потому что бедро шире колен. У обезьян, живущих на земле, бедренная кость прямая. … У любой лазающей по деревьям обезьяны бедренная кость под наклоном. Только у обезьян, живущих на земле, прямое бедро. Поэтому наклонное бедро не доказывает, что обезьяна становится человеком.
  rating: orange
  verdict: Что наклон бедра бывает и у некоторых лазающих обезьян (например, у орангутанов), отчасти верно. Но у Люси он сочетается с человеческим строением колена и таза, а прямохождение подтверждают следы из Лаэтоли.
  arguments:
  - ape-men-frauds
  rhetoric:
  - cherry-picking

- id: lecture-2-2133
  start: 2133.7
  end: 2149.3
  text: Он сказал, что колено австралопитека больше, чем у нормальной обезьяны. Это правильно? Но это ничего не доказывает. Вы знаете, что у этой породы лошади кость больше, чем у нормальной? Доказывает ли это, что она превращается в грузовик? Нет.
  rating: orange
  verdict: Один большой сустав действительно мало что доказывает. Но учёные смотрят на форму колена, а не на размер; сравнение «лошадь — грузовик» подменяет живое родство превращением в машину.
  arguments:
  - ape-men-frauds
  rhetoric:
  - false-analogy
  - vysmeivanie-vmesto-dovoda

- id: lecture-2-2150
  start: 2150.3
  end: 2168.9
  text: В зоопарке Сент-Луиса находится фигура австралопитека с человеческими руками и ногами. Но не было найдено ни одной кости ни руки, ни ноги. Это пропаганда, это не образование. Это обман, и его нужно забрать из зоопарка.
  rating: red
  verdict: 'Кости кистей и стоп этого вида известны: множество их нашли в 1975 году в местонахождении «Первая семья» в Эфиопии. Модель в музее строят по ним, это не «обман».'
  arguments:
  - ape-men-frauds
  rhetoric:
  - loaded-language

- id: lecture-2-2171
  start: 2171.2
  end: 2194.8
  text: Также в пепле были найдены нормальные человеческие следы. Но о них сказали, что это следы гуманоидов, которые ходили прямо 3 млн лет назад. Почему они их называют гуманоидами? Может, человек всегда был человеком? Следы описаны как точно похожие на наши. Мне кажется, что если следы точно как наши, может, это человек?
  rating: orange
  verdict: Следы из Лаэтоли действительно очень похожи на человеческие и говорят о прямохождении. Но они отличаются формой стопы, и рядом в тех же слоях найдены кости австралопитеков, а не людей.
  arguments:
  - human-fossils

- id: lecture-2-2196
  start: 2196.4
  end: 2211.5
  text: Но вы знаете, что в Национальном географическом журнале они ставят на следы тёмных обезьяноподобных существ. Не было найдено в этом случае ни одной кости. Всё это воображение художника.
  rating: red
  verdict: 'В Лаэтоли найдены кости австралопитеков: челюсть оттуда даже стала эталонным образцом вида. Реконструкция опирается на них, а не только на воображение художника.'
  arguments:
  - ape-men-frauds

- id: lecture-2-2213
  start: 2213.6
  end: 2230.1
  text: И мне не нравится это. Почему потерянные звенья всегда темнокожие? Вы заметили это? Библия говорит, что все нации от одной крови, Деяния, глава двадцатая. И поэтому нет причины быть расистом. Это расистское отношение.
  rating: orange
  verdict: Мы тоже верим, что все народы — от одной крови (Деян 17:26). Но тёмную кожу древним жителям Африки рисуют по биологии жаркого климата, а не из расизма.
  rhetoric:
  - loaded-language

- id: lecture-2-2231
  start: 2231.5
  end: 2248.0
  text: Но в этом случае нашли только человеческие следы. И Окснард, эксперт по изучению австралопитека, сказал, что австралопитек — это не потерянное звено. Это просто необыкновенная обезьяна, и всё. И некоторые могут ещё жить сегодня.
  rating: orange
  verdict: Чарльз Окснард действительно считал австралопитеков боковой ветвью, а не нашими предками. Но он не называл их «просто обезьяной» и не говорил, что они могут жить сегодня; это добавлено.
  arguments:
  - ape-men-frauds
  rhetoric:
  - quote-mining

- id: lecture-2-2249
  start: 2249.5
  end: 2262.9
  text: Советую прочитать книгу о пещерных людях, которая называется «Кости раздора». Автор Марвин Любеноу. Эксперты говорят, что нет никакого доказательства тому, как произошёл человек. Его нет.
  rating: red
  verdict: Марвин Любеноу — автор-креационист, а «эксперты» не названы. Палеоантропологи согласны, что находок, связывающих людей и других приматов, очень много; спорят о деталях родословного дерева.
  arguments:
  - ape-men-frauds
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-2263
  start: 2263.3
  end: 2289.7
  text: Если в школе профессор скажет, что есть доказательства эволюции и что они знают, что человек произошёл, скажите, что Кент Ховинд сказал, что они не правы. Или они обманывают, и что я приду в их университет и проведу дискуссию даже против троих профессоров. Три против одного. Я провожу дебаты с людьми умнее меня. Но я всегда выигрываю. Потому что я прав, а они не правы. Очень легко победить в таком случае.
  rating: orange
  verdict: Готовность спорить публично заслуживает уважения. Но победа в дебатах зависит от ораторского умения и не доказывает правоты, а несогласного профессора не обязательно считать обманщиком.
  rhetoric:
  - self-authority
  - loaded-language

- id: lecture-2-2294
  start: 2294.4
  end: 2322.9
  text: Есть одно потерянное звено. У современного человека между ушами. Эти профессора проводят время в поисках костей в земле. Моя собака делает то же самое. Но мы не просим, чтобы ей платили налогоплательщики. … Библия говорит, что, называя себя мудрыми, они обезумели. Они хотят опровергнуть Бога.
  rating: orange
  verdict: 'Мы тоже помним слова Рим 1:22. Но палеонтология — не «рытьё костей, как собака», а учёные, изучающие древних людей, не обязательно хотят опровергнуть Бога: среди них есть и христиане.'
  rhetoric:
  - vysmeivanie-vmesto-dovoda
  - ad-hominem-pivot

- id: lecture-2-2323
  start: 2323.2
  end: 2333.3
  text: Я думаю, что до потопа не только растения и люди, но и животные тоже были больших размеров. Вот шестиметровый носорог. Большой носорог.
  rating: orange
  verdict: Гигантские безрогие носороги действительно жили. Но они вымерли больше 20 миллионов лет назад, а их размер — особенность вида, а не следствие допотопного климата.
  arguments:
  - giants

- id: lecture-2-2334
  start: 2334.4
  end: 2365.5
  text: Они скажут, что это доисторическое животное. Но что такое доисторическое? Слова «доисторический» нет в словаре 1766 года. Также в словаре 1860 года тоже нет слова «доисторический». Это слово было придумано около 100 лет назад, когда была популярна теория Дарвина. Есть такое слово — допотопный, но это вообще не доисторический. Между ними большая разница.
  rating: red
  verdict: Слово «доисторический» ввели археологи в 1830–1850-х годах, раньше книги Дарвина (1859). Оно значит «до появления письменности», а не «миллионы лет», так что подмена слов ничего не доказывает.
  rhetoric:
  - podmena-ponyatij

- id: lecture-2-2366
  start: 2366.1
  end: 2382.9
  text: 'Возьмём, к примеру, стрекозу. Люди скажут: «Ну и что? Сегодня тоже есть стрекоза». Но не такие. У этой метровый размах крыльев. И я бы не хотел, чтобы такая стрекоза врезалась в моё лобовое стекло на скорости 70 км/ч.'
  rating: orange
  verdict: Огромные стрекозы-меганевры действительно жили, с размахом крыльев около 70 см. Но это насекомые каменноугольного периода, примерно 300 миллионов лет назад, задолго до любых людей.
  arguments:
  - giants

- id: lecture-2-2385
  start: 2385.4
  end: 2429.3
  text: Здесь, в Аляске, есть у вас тараканы? … Вы знаете, что были найдены ископаемые таракана свыше 45 см длины? … Найдено ископаемое многоножки длиной свыше полутора метров. … Найдены ископаемые кузнечика 60 см длины. Ископаемые камыши 18 м длины. Ископаемое осла — три метра. Ископаемое буйвола с рогами размахом в 4 м. Ископаемое бобра — два с половиной метра. Вот человек, нашедший челюсть бобра. И вот его телефон.
  rating: red
  verdict: 'Часть находок реальна: многоножки до 2 м, бобры до 2,5 м. Но животные из эпох, разделённых сотнями миллионов лет, собраны в один «допотопный мир», а часть размеров, например таракан 45 см, преувеличена.'
  arguments:
  - giants
  rhetoric:
  - cherry-picking

- id: lecture-2-2430
  start: 2430.7
  end: 2438.6
  text: Друзья, если раньше были большие деревья, то нужны были большие бобры. Тогда тоже был баланс.
  rating: neutral
  verdict: Шутка про больших бобров; на доводы не влияет.

- id: lecture-2-2440
  start: 2440.4
  end: 2463.5
  text: Вы знаете, что 2 см зуба акулы равняются четырём или пяти метрам длины акулы. И по находкам зубов акул установлено, что акулы были около 27 м длины до потопа. Двойное давление атмосферы значило, что могло выжить больше рыбы. И рыбы тоже было намного больше. До потопа.
  rating: red
  verdict: Мегалодон по зубам оценивается примерно в 15–20 м, а не 27. Он жил миллионы лет назад, а не до потопа, и «двойное давление атмосферы» на рыб в воде не влияет.
  arguments:
  - giants

- id: lecture-2-2463
  start: 2463.9
  end: 2479.0
  text: Был другой мир. Были найдены громадные черепахи по нашим стандартам. Гигантские. Найдены четырёхметровые птицы. Хотели ли бы вы приготовить такую птицу на жатву?
  rating: orange
  verdict: Гигантские черепахи живут и сегодня, а огромные нелетающие птицы (моа, эпиорнис) вымерли сотни лет назад, часто из-за людей. Это не признак «другого мира» до потопа.
  arguments:
  - giants

- id: lecture-2-2481
  start: 2481.0
  end: 2500.1
  text: Ящерицы. Ящерицы никогда не перестают расти. Рептилии растут всю жизнь. Люди перестают расти в 16–18 лет. По крайней мере, вертикально. Некоторые продолжают расти горизонтально. … Рептилии не перестают расти.
  rating: green
  verdict: 'В целом верно: многие рептилии растут всю жизнь. Уточнение: с возрастом рост сильно замедляется и почти останавливается.'

- id: lecture-2-2500
  start: 2500.7
  end: 2523.6
  text: Интересно, как выглядели ящерицы в Эдемском саду? С двойным атмосферным давлением, где было много пищи и не было врагов. И пусть они живут 900 лет. Вот таких можно купить в зоомагазине. А что, если она будет весить где-то 10 тонн? Это будет динозавр.
  rating: red
  verdict: 'Динозавры — не большие ящерицы: у них ноги под телом, а не в стороны, другое строение таза и черепа. Старая ящерица никогда не станет динозавром, сколько бы она ни прожила.'
  arguments:
  - dinosaurs-are-lizards

- id: lecture-2-2524
  start: 2524.4
  end: 2541.9
  text: Динозавры — это большие ящерицы, которые жили с Адамом и Евой. Они не жили миллионы лет назад. Они всегда жили с человеком. Кости динозавра и человека были найдены вместе. Найдены человеческие изображения с динозаврами. Много тысяч таких изображений.
  rating: red
  verdict: 'Кости динозавров и людей в одних слоях не найдены: последние нептичьи динозавры вымерли около 66 миллионов лет назад. «Тысячи изображений» — в основном подделки и вольные толкования рисунков.'
  arguments:
  - dinosaurs-humans

- id: lecture-2-2543
  start: 2543.1
  end: 2558.9
  text: Мы говорим об этом на кассете о динозаврах и Библии. А ещё о живых динозаврах. В Перу было найдено 50 000 камней с изображениями динозавров и людей. У моих друзей есть такие камни. Но мы поговорим об этом позже.
  rating: red
  verdict: 'Камни из Ики — подделка: крестьянин Басилио Учуйя признался, что сам вырезал их для продажи туристам, копируя рисунки из журналов.'
  arguments:
  - dinosaur-depictions

- id: lecture-2-2560
  start: 2560.1
  end: 2607.3
  text: Если вы проезжаете по Техасу и свернёте на юг возле Уэйко, вы найдёте маленький городок Глен-Роуз. Я был там три раза. Через этот городок протекает речка Палакси. В 1908 году речку затопило. … Вода сорвала слой известняка и отнесла его на 30 км по течению. На новом дне находились тысячи следов динозавров. Из-за обилия следов на том месте сделали государственный парк. Парк Долины динозавров. … многие следы были вырезаны и выставлены в музеях для сохранения.
  rating: green
  verdict: 'Верно: на реке Палакси у Глен-Роуз множество настоящих следов динозавров, там устроен государственный парк «Долина динозавров».'

- id: lecture-2-2609
  start: 2609.5
  end: 2625.6
  text: Но также эти следы были больших размеров. Вот, например, мальчик, купающийся в одном из следов. Там также были найдены человеческие следы вместе со следами динозавра. Следы динозавра и человека вместе. Да.
  rating: red
  verdict: Следы динозавров здесь настоящие. Но «человеческие» — размытые следы динозавров и вырезанные на продажу подделки; в 1986 году даже Институт креационных исследований отказался от этого довода.
  arguments:
  - human-fossils

- id: lecture-2-2627
  start: 2627.2
  end: 2641.1
  text: Но это не обязательно, чтобы они были найдены вместе. Никто не нашёл следы человека и курицы в одном слое камня? Доказывает ли это, что человек и курица не жили в одно время? И я думаю, что некоторые динозавры живут ещё и сегодня.
  rating: orange
  verdict: Отсутствие совместных следов само по себе ещё не доказательство. Но окаменелостей миллионы, и кости людей и нептичьих динозавров нигде не лежат в одних слоях; сравнение с курицей этого не учитывает.
  arguments:
  - dinosaurs-humans
  rhetoric:
  - false-analogy

- id: lecture-2-2642
  start: 2642.3
  end: 2656.6
  text: Иногда следы человека находятся внутри следов динозавра. Эти следы больших размеров. Вот копия одного из следов, размер 98. Или же человек был большого роста, или же он выглядел очень смешно.
  rating: red
  verdict: Огромные «человеческие» следы внутри следов динозавра — это части тех же следов динозавра, у которых размыты отпечатки пальцев. Поэтому они и такие большие.
  arguments:
  - human-fossils

- id: lecture-2-2658
  start: 2658.6
  end: 2697.3
  text: Ну, скептики всегда думают, что это подделка. Их обычное мышление. И они сняли слой камня возле края и нашли новые следы под нетронутым известняком. Они даже распилили один из следов и сказали, что, выглядит, линии наслоения были нарушены компрессией. Это был отпечаток сжатия, не след эрозии. И человеческие шаги были двухметровыми. … Почему следы динозавров и людей находятся вместе? Потому что они жили в одно и то же время.
  rating: red
  verdict: Что раскопки Карла Бо открыли следы под нетронутым слоем, говорит о подлинности следов, но не о том, чьи они. Шаг в два метра для «человека» неправдоподобен, а для динозавра обычен.
  arguments:
  - human-fossils

- id: lecture-2-2698
  start: 2698.1
  end: 2745.2
  text: 'Мой друг присутствовал при раскопках, вот что он написал мне в письме: «Брат Ховинд, я вырос в Глен-Роуз. Я помогал доктору Бо с раскопками». Он сказал, что съёмочная группа Nova снимала раскопки. Nova не сняла следы или наши раскопки, но они взяли интервью у эволюциониста. И он им сказал, что он не видел ничего опровергающего эволюцию. Он не сказал им, что он отказался развернуться и посмотреть на следы… В Nova тоже знали, что этот человек не видел следов, но они ничего не сказали и дали доктору Бо меньше времени для ответа.'
  rating: orange
  verdict: Что фильм мог дать креационистам меньше времени, возможно. Но письмо друга не проверить, а следы Палакси подробно изучили и независимые геологи, и сами креационисты, отказавшиеся от довода.
  arguments:
  - science-conspiracy
  rhetoric:
  - personal-story

- id: lecture-2-2747
  start: 2747.4
  end: 2762.3
  text: Один человек сказал, что если найденные следы человека в юрском камне, это доказывает, что раньше были неизвестные динозавры с человеческими ногами. Хм, не знаю, как насчёт этого может быть.
  rating: orange
  verdict: 'Возражение безымянного оппонента подано в нелепом виде. Но учёные отвечают иначе: удлинённые следы оставили сами динозавры, ступая на всю ступню.'
  arguments:
  - human-fossils
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-2-2763
  start: 2763.3
  end: 2782.9
  text: Вы знаете, что был найден окаменевший молоток? У меня есть копия. Модель молотка. Некоторые люди говорят, что до потопа не было железа. Сначала почитайте Библию. Тувалкаин был ковачом орудий из меди и железа. … Потоп произошёл в главе шестой и восьмой. Железо было до потопа.
  rating: red
  verdict: Что Библия упоминает железо до потопа (Быт 4:22), верно. Но «лондонский молоток» — молоток XIX века, вокруг которого быстро наросла минеральная корка, а не допотопное орудие в древней породе.
  arguments:
  - human-fossils

- id: lecture-2-2783
  start: 2783.0
  end: 2815.5
  text: Этот колокол был найден в массе угля. Его нашёл Ньютон Андерсон. Позвоните и спросите, если вы не верите мне. В учебниках говорится, что каменноугольный период … был 250 млн лет назад. Я не согласен. В массе угля была найдена золотая цепочка в Иллинойсе. Этот колокол был найден в твёрдом камне в штате Массачусетс. Статуэтка найдена при бурении колодца на глубине 105 м, которой, по предположению, должно быть 12 млн лет.
  rating: red
  verdict: Колокол, цепочка и статуэтка известны по рассказам и газетам, без описания слоя и условий находки. Предметы падают в шахты и скважины и обрастают корками; геологическую шкалу это не опровергает.
  arguments:
  - human-fossils

- id: lecture-2-2816
  start: 2816.9
  end: 2828.6
  text: В Ираке было найдено что-то наподобие батареи. Очевидно, они знали об электричестве намного раньше, чем несколько сот лет назад. Найдены покрытые золотом предметы. Об электричестве знали очень давно.
  rating: orange
  verdict: Сосуд из Ирака действительно напоминает батарею. Но следов использования электричества у него нет, а золотили в древности амальгамой или фольгой; что это было, учёные спорят.
  arguments:
  - ancient-advanced-civilization

- id: lecture-2-2830
  start: 2830.2
  end: 2847.0
  text: Рабочие нашли человеческие кости и закалённый медный наконечник стрелы в серебряной жиле. Найдено много допотопных предметов, захороненных потопом. И слои Земли не сформировались на протяжении миллионов лет, они сформировались во время потопа.
  rating: red
  verdict: Слои Земли содержат следы пустынь, почв, рифов и высохших озёр, которые не могли возникнуть за один год под водой. Рассказы о находках в жилах этого не меняют.
  arguments:
  - flood-sediments

- id: lecture-2-2848
  start: 2848.1
  end: 2865.4
  text: 'В Бытие 1:29 написано: «И сказал Бог: вот, Я дал вам всякую траву, сеющую семя, какая есть на всей земле, и всякое дерево, у которого плод древесный, сеющий семя; вам сие будет в пищу». Бог сказал Адаму, чтобы он питался фруктами, овощами и семенами.'
  rating: neutral
  verdict: 'Пересказ Быт 1:29 верен: людям дана в пищу растительная пища. Отсюда Ховинд переходит к советам о здоровье, которые разбираем ниже.'

- id: lecture-2-2866
  start: 2866.9
  end: 2891.0
  text: 'Ну, мы этого уже не делаем. Мы питаемся бутербродом, картошкой фри и Pepsi. Бог сказал: «Питайтесь фруктами, овощами и семенами». Дети, когда вы кушаете персик, вы должны есть и семя. … Нет, это оболочка твёрдая, но внутри находится что-то наподобие орешка. Очень противная на вкус.'
  rating: red
  verdict: 'Совет детям есть ядрышки персиковых косточек опасен: в них амигдалин, из которого в организме выделяется цианид, и такими ядрышками травились. Бог дал в пищу плоды, но не всё в плодах съедобно.'
  arguments:
  - vitamin-b17-cancer

- id: lecture-2-2893
  start: 2893.7
  end: 2905.1
  text: Некоторые думают, морщиться, морщиться. Что это такое? Я раньше знал. Мой отец сказал, что если вы стареете, тогда, когда пересекаете комнату, чтобы поцеловать жену, но подойдя к ней, забываете, зачем вы это сделали.
  rating: neutral
  verdict: Шутка о забывчивости; на доводы не влияет.

- id: lecture-2-2906
  start: 2906.9
  end: 2930.0
  text: 'Вы скажете: семена есть невозможно, в них находится цианид. О, да, он полезный. Цианид полезный. Не сам по себе, но в семенах. Это часть состава витамина B17. … Витамин B17 найден в семенах. Он находится и в некоторых травах.'
  rating: red
  verdict: 'Амигдалин в косточках действительно выделяет цианид, но цианид — яд, а не польза. «Витамина B17» не существует: амигдалин не нужен организму и витамином не признан.'
  arguments:
  - vitamin-b17-cancer

- id: lecture-2-2931
  start: 2931.1
  end: 2944.8
  text: Вы, наверное, видели, что больной кот или собака едят траву. Вы знаете, что у диких животных никогда не бывает рака? У тех, кто в зоопарке, всегда. Вы знаете, что племена, употребляющие B17, не болеют раком?
  rating: red
  verdict: Что больные кошки едят траву, верно. Но рак у диких животных хорошо известен — у тасманийских дьяволов, белух, рыб; данных, что какие-то племена не болеют раком из-за «B17», нет.
  arguments:
  - vitamin-b17-cancer
  rhetoric:
  - appeal-to-doubt

- id: lecture-2-2947
  start: 2947.1
  end: 2990.6
  text: Например, племя хунза живёт в северном Пакистане в горах. … Люди племени в среднем жили 160 лет. Средний возраст в Америке — 72. Средний возраст медицинских докторов в Америке — 58. … Чем больше возникал контакт с внешним миром, тем сильнее падала длина жизни племени. Сегодня они живут около 90 лет.
  rating: red
  verdict: 'Документов о рождении у хунза не было, и рассказы о жизни до 160 лет не подтвердились при проверке. Что врачи в США живут в среднем до 58 лет, тоже не так: они живут не меньше остальных.'
  arguments:
  - vitamin-b17-cancer
  rhetoric:
  - cherry-picking

- id: lecture-2-2991
  start: 2991.9
  end: 3003.0
  text: И их любимая пища — абрикосовые семена. В абрикосовых семенах найдено больше витамина B17, чем где бы то ни было в природе. И в этом племени нет рака.
  rating: red
  verdict: Абрикосы хунза действительно едят. Но «нет рака» никто не проверял обследованиями, а амигдалин в косточках не защищает от рака.
  arguments:
  - vitamin-b17-cancer

- id: lecture-2-3004
  start: 3004.8
  end: 3023.2
  text: Вы скажете? Разве витамин может излечить рак? При лечении пищевой терапии процент выживания намного выше, чем при лечении обыкновенной терапии. Конечно, выживают не все, а есть и другие факторы. Ну, я думаю, что это самый разумный подход. Написана даже целая книга о причинах.
  rating: red
  verdict: Здоровое питание полезно и при болезни. Но в клиническом испытании 1982 года (клиника Мэйо и др.) летрил не помог ни одному больному раком, а у части вызвал отравление цианидом. Отказ от лечения ради него опасен.
  arguments:
  - vitamin-b17-cancer
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-2-3024
  start: 3024.7
  end: 3055.3
  text: На протяжении многих лет люди умирали от цинги. Британский флот потерял миллион матросов от цинги. Вы знаете, чем лечится цинга? Витамином C. Болезнь нехватки витамина. … Многие болезни лечатся витаминами. Авитаминоз, пеллагра, рахит. Это заболевания недостатка витаминов, и я думаю, что рак тоже.
  rating: red
  verdict: 'Что цингу, пеллагру и рахит лечат витаминами, верно. Но рак не болезнь нехватки витамина: это сбой роста клеток, связанный с мутациями, и из примера с цингой этого вывода сделать нельзя.'
  arguments:
  - vitamin-b17-cancer
  rhetoric:
  - false-analogy

- id: lecture-2-3055
  start: 3055.7
  end: 3071.2
  text: В Библии говорится, что Бог дал зелень на пользу человека, и хлеб, который укрепляет сердце человека. Интересно, хлеб укрепляет сердце? Так было раньше, когда хлеб пекли каждый день. Хлеб пекли каждый день, потому что он портился.
  rating: purple
  verdict: Мы тоже благодарим Бога за хлеб. Но «хлеб, который укрепляет сердце человека» (Пс 103:15) — поэтическое «подкрепляет силы», а не утверждение о сердечной мышце.
  arguments:
  - bible-science-foreknowledge

- id: lecture-2-3072
  start: 3072.4
  end: 3125.2
  text: 'Библия говорит, что корень всех зол есть сребролюбие. И люди, которые делали хлеб, думали: мы делаем 10 буханок, 5 из них пропадают, мы теряем деньги. … И они удалили из хлеба витамин E и лецитин. И семнадцать других витаминов. И придумали белый хлеб. … Но начали стремительно повышаться сердечные заболевания, параличи и проблемы кровообращения. Простая формула. Чем белее хлеб, тем быстрее вас нет. … Бог дал хлеб для подкрепления сердца. Мы всё испортили.'
  rating: orange
  verdict: 'Что в белой муке меньше клетчатки и витаминов, верно. Но в США с 1940-х годов муку обогащают витаминами, а у болезней сердца много причин: «чем белее хлеб, тем быстрее вас нет» — лозунг, а не вывод.'
  rhetoric:
  - post-hoc

- id: lecture-2-3126
  start: 3126.2
  end: 3158.6
  text: Есть две философии здоровья и медицины. Она основана на эволюции, в которой говорится, что ваше тело — это случайная коллекция химикатов, сформировавшихся на протяжении миллионов лет. Заболевания лечатся таблетками. Лекарственная терапия. Если у вас болит голова, вы идёте к доктору и принимаете аспирин. Подождите. Не лечите ли вы симптом вместо причины? Что причинило головную боль? Недостаток аспирина? Нет.
  rating: red
  verdict: 'Научная медицина не «основана на эволюции» и лечит не только симптомы: антибиотики убивают причину инфекции, хирург удаляет опухоль, прививка предупреждает болезнь. Лечить симптом тоже бывает нужно.'
  rhetoric:
  - lozhnaya-dilemma
  - straw-man

- id: lecture-2-3159
  start: 3159.8
  end: 3198.9
  text: Если вы едете по дороге и загорается лампочка масла, у вас есть два выбора. Найдите и исправьте проблему. Или отключите лампочку. Мы смеёмся, потому что это глупо — отключить лампочку. Но пойдите домой и откройте аптечку. И вы увидите полно вещей, отключающих лампочку. … И если вы всю жизнь лечите симптом вместо причины, когда-то с вами произойдёт катастрофа.
  rating: orange
  verdict: 'Мысль «ищи причину, а не только глуши симптом» верная, и врачи ей следуют. Но лекарство — не всегда «отключённая лампочка»: многие лекарства как раз устраняют причину.'
  rhetoric:
  - false-analogy
  - vysmeivanie-vmesto-dovoda

- id: lecture-2-3199
  start: 3199.4
  end: 3210.2
  text: Другая философия основана на креационизме, в котором говорится, что Бог сотворил наши тела, и Бог сотворил пищу для наших тел. Это пищевая терапия.
  rating: orange
  verdict: 'Мы тоже верим, что Бог создал наше тело и пищу. Но отсюда не следует, что лечить надо только пищей: врачи, лекарства и хирургия служат людям, и многие врачи — верующие христиане.'
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-2-3210
  start: 3210.7
  end: 3234.7
  text: Эти две философии касаются и государства. Если верна эволюция и нет Бога, то человек создал законы. Правила назначаются государством. И оно должно быть всесильным снабжателем. Это демократия. Демократия — это опасная и ужасная форма государства. Всегда становится диктатурой. Америка не является или не должна была быть демократией.
  rating: red
  verdict: 'Из биологии не следует, какой должна быть власть: эволюцию принимают и сторонники свободы, и сторонники сильного государства. А «демократия всегда становится диктатурой» — обобщение, которому противоречат многие страны.'
  arguments:
  - rights-from-creator
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-2-3235
  start: 3235.7
  end: 3269.5
  text: Другая система государства основана на креационизме, в которой говорится, что Творец создал законы. У нас есть неоспоримые права. Государство надо ограничить наказанием преступников и защитой. … Государство не должно иметь дело с образованием, социальным обеспечением, ни с чем, кроме наказания преступников и защиты страны. … Это называется республикой. В республике все повинуются закону.
  rating: orange
  verdict: Что права человека от Творца, мы тоже верим. Но устройство государства — вопрос политики, и христиане, верующие в сотворение, держатся разных взглядов на то, чем должно заниматься государство.
  arguments:
  - rights-from-creator
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-2-3275
  start: 3275.7
  end: 3290.3
  text: И меня очень раздражает, что сегодня политики стараются определить, что такое плохо и что хорошо, основываясь на голосовании. Нужно узнавать, что плохо и что хорошо, основываясь на «так говорит Господь». Мы потеряли это.
  rating: neutral
  verdict: Мы тоже верим, что добро и зло определяет Бог, а не голосование. Это исповедание веры; к научным доводам оно не относится.

- id: lecture-2-3291
  start: 3291.2
  end: 3328.8
  text: 'Наши отцы сказали: «Это очевидно, что все люди созданы равными и что их Творец наделил их неоспоримыми правами». … И невозможно поработить людей, которые знают, что их права от Бога. Они не будут хорошими слугами нового мирового порядка. Если вы хотите установить одно мировое государство, вы должны начать раньше на несколько сот лет и учить детей в школах, что их права происходят от государства. … Мы потеряли эту позицию наших отцов.'
  rating: orange
  verdict: Слова о правах, которыми Творец наделил людей, действительно есть в Декларации независимости США. Но что школы веками учат по плану «нового мирового порядка», ничем не подтверждено.
  arguments:
  - rights-from-creator
  rhetoric:
  - conspiracy

- id: lecture-2-3331
  start: 3331.6
  end: 3346.5
  text: 'Бытие 1:30: «А всем зверям земным, и всем птицам небесным, и всякому пресмыкающемуся по земле, в котором душа живая, дал Я всю зелень травную». Подождите. Животные ели траву. Это то, что здесь написано.'
  rating: purple
  verdict: Быт 1:30 действительно говорит, что Бог дал животным в пищу зелень. Но многие толкователи, от Августина до наших дней, не видят в этом утверждения, что хищников не было. Это законный богословский спор.
  arguments:
  - death-before-fall

- id: lecture-2-3346
  start: 3346.9
  end: 3357.6
  text: Вы знали, что до потопа комары не кусались? У вас здесь есть комары? До потопа они не кусались? Не кусали животных?
  rating: red
  verdict: Самкам кровососущих комаров кровь нужна, чтобы отложить яйца; без неё вид не размножается. Найден даже ископаемый комар с остатками крови в брюшке возрастом около 46 миллионов лет.
  arguments:
  - death-before-fall
  rhetoric:
  - appeal-to-doubt

- id: lecture-2-3359
  start: 3359.2
  end: 3372.1
  text: Вы представляете мир, где все питались растениями? Ничего вас не беспокоило? Адам и Ева ходили в джунгли поспать. Отдохнуть. Они не боялись? Трудно представить, но так было.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил мир «хорошим весьма». Но был ли рай миром без хищников и страха, Писание прямо не говорит; христиане понимают это по-разному.
  arguments:
  - death-before-fall

- id: lecture-2-3373
  start: 3373.8
  end: 3392.4
  text: 'Мы с женой остановились в отеле, в котором стоит огромный макет медведя гризли. Э-э, в клетке, кстати. А жена сказала: «Было бы неплохо поиграться с ним». Э-э, может быть, до потопа, но не сейчас. Они больше не играются.'
  rating: neutral
  verdict: Шутка о макете медведя; на доводы не влияет.

- id: lecture-2-3393
  start: 3393.9
  end: 3409.2
  text: 'Вы скажете: «Посмотрите на эти зубы. Животное питается мясом». Нет, извините, это панда. Всё было вегетарианским до потопа, согласно Библии. Бытие 1:29. Абсолютно всё.'
  rating: orange
  verdict: 'Что панда при зубах хищника ест бамбук, верно. Но одно исключение не отменяет правила: зубы, когти и кишечник большинства хищников устроены для мяса, и это видно и у ископаемых.'
  arguments:
  - death-before-fall
  rhetoric:
  - cherry-picking

- id: lecture-2-3410
  start: 3410.4
  end: 3465.0
  text: 'После потопа всё изменилось. В Бытие в главе девятой… Он сказал: «Да страшатся и да трепещут вас все звери земные». Первое изменение после потопа — животные стали бояться человека… А второе изменение, Бог сказал: «Всё движущееся, что живёт, будет вам в пищу». Теперь мы можем питаться мясом… Но это причиняет много страданий в мире.'
  rating: purple
  verdict: Быт 9:2–3 действительно говорит о страхе животных перед человеком и разрешает есть мясо. Вывод, что до потопа все животные были дружелюбными и травоядными, — одно из толкований; это законный богословский спор.
  arguments:
  - death-before-fall

- id: lecture-2-3466
  start: 3466.2
  end: 3491.4
  text: 'Апостол Павел сказал: «Ибо думаю, что нынешние временные страдания…» Есть ли страдания в сегодняшнем мире? Много? И это путает атеистов. Дарвин сказал: «Я озадачен. Я не намеревался писать атеистически. Но выглядит, что в мире так много страданий». Он не понимал, почему Бог разрешил львам убивать других животных.'
  rating: orange
  verdict: 'Слова близки к письму Дарвина Аса Грею 1860 года. Но страдания в природе — вопрос прежде всего для верующих: как благой Бог их допускает. Дарвин тогда не был атеистом.'
  rhetoric:
  - quote-mining

- id: lecture-2-3492
  start: 3492.3
  end: 3538.4
  text: Бог сотворил идеальный мир. И человек его разрушил. И вы не можете обвинить Бога за разрушенный мир. В Библии говорится, что одним человеком вошла в мир смерть… Вы не можете посмотреть на разбитую машину и обвинить завод… Бог сотворил идеальный мир, человек его разрушил. Сегодня мы живём на свалке. Но Бог всё это исправит.
  rating: purple
  verdict: 'Мы тоже верим, что грех исказил мир и Бог всё исправит. Но связывать с грехом Адама всякую смерть животных — толкование: Павел говорит о смерти, перешедшей «во всех человеков». Это законный богословский спор.'
  arguments:
  - death-before-fall

- id: lecture-2-3538
  start: 3538.8
  end: 3576.3
  text: 'Он обещал в Исаии 11: «Тогда волк будет жить вместе с ягнёнком, и барс будет лежать вместе с козлёнком… и малое дитя будет водить их». … «Мама, посмотри, какого большого кота я нашла». … «Отнеси его во двор и дай ему травки». Вы скажете, что львы не едят траву. Ну, когда-то они будут. В Библии говорится: лев, как вол, будет есть солому. Бог сделает всё, как было раньше. И столетний будет умирать юношей.'
  rating: purple
  verdict: Мы тоже надеемся на мир, обещанный в Ис 11. Но буквально ли львы станут есть солому или это образ мира в Царстве Божьем, христиане понимают по-разному.
  arguments:
  - death-before-fall

- id: lecture-2-3577
  start: 3577.4
  end: 3924.4
  text: Я верю, что всё будет как раньше, и мы будем царствовать со Христом тысячу лет. Дети, у вас будут собственные динозавры… Он сделает новое небо и новую землю… Это спектр электромагнитных волн… на небе у нас будут новые глаза, которыми мы сможем видеть весь спектр… Моим первым компьютером был IBM 8088… Если вы умрёте сегодня, где вы будете?… Идёт война… Делайте что-то для вечности.
  rating: neutral
  verdict: 'Проповедь о Царстве, новом небе и новой земле, шутки и призыв служить Богу. Мы разделяем эту надежду и призыв. Пример со спектром верен: глаз видит лишь малую часть электромагнитных волн.'

- id: lecture-2-3926
  start: 3926.4
  end: 3959.8
  text: 'Некоторые из вас думают: «Подождите, вы говорите, что динозавры жили с Адамом и Евой до потопа?» Угу. А что с ними случилось? … Вы скажете, динозавров? Они же большие. Большие были большими. Но маленькие были маленькими. И Ною тогда было 600 лет. Я думаю, он был достаточно умным, чтобы не брать самых больших. Можно взять двоих детёнышей разного пола, конечно.'
  rating: red
  verdict: Мы верим рассказу о Ное. Но что динозавры жили рядом с Адамом и плыли в ковчеге детёнышами, Библия не говорит, а ископаемые показывают, что нептичьи динозавры вымерли за десятки миллионов лет до людей.
  arguments:
  - dinosaurs-humans

- id: lecture-2-3963
  start: 3963.1
  end: 3976.9
  text: Тогда вы скажете, что же случилось с динозаврами? Мы говорим об этом на следующей сессии. Мы поговорим о динозаврах. Что о них упоминается в Библии и во всей истории? И некоторые, вероятно, ещё живут сегодня.
  rating: red
  verdict: В научном смысле птицы — потомки динозавров, и в этом смысле динозавры живы. Но живых нептичьих динозавров никто не нашёл, а все известные рассказы о них при проверке не подтвердились.
  arguments:
  - living-dinosaurs

- id: lecture-2-3979
  start: 3979.7
  end: 3997.3
  text: На кассете четвёртой мы будем говорить об обмане в учебниках. О тех вещах, которым учат студентов в школьной системе в вашем городе, которые были опровергнуты 100 лет назад. Их учат этому, потому что они хотят, чтобы дети поверили в эволюцию.
  rating: orange
  verdict: Устаревшие примеры иногда действительно задерживаются в учебниках, это бывает. Но обвинение, что их держат нарочно, чтобы дети поверили в эволюцию, пока ничем не подкреплено; отдельные примеры разберём в лекции 4.
  arguments:
