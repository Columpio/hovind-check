- id: lecture-2-3997
  start: 3997.6
  end: 4007.0
  text: Я убеждён, что Сатана использует эту теорию, чтобы посылать людей в ад. Это его цель. Он хочет, чтобы вы поверили в эволюцию и не приняли Иисуса Христа.
  rating: purple
  verdict: Мы тоже верим, что сатана хочет отвратить людей от Христа. Но многие христиане принимают эволюцию и верят во Христа; выбор «эволюция или Иисус» ставит людей перед ложным выбором.
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-2-4008
  start: 4008.7
  end: 4151.3
  text: Если вы не спасены, вы должны спастись… Давайте встанем и склоним головы и помолимся… Библия говорит, что все мы грешники… В Римлянам 3:23 говорится, что все согрешили и лишены славы Божьей… «Ибо возмездие за грех — смерть»… всякий, кто призовёт Имя Господне, спасётся… Дорогой Господь Иисус, я знаю, что я грешник… Читайте Библию, молитесь, ходите в церковь.
  rating: neutral
  verdict: Призыв к покаянию, евангельский призыв и молитва. Мы разделяем призыв довериться Христу; к научным доводам эта часть не относится.
