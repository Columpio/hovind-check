- id: lies-in-the-name-of-science-260
  start: 260.3
  end: 280.4
  text: В учебниках говорится, что красные звёзды медленно превращаются в белых карликов. Для этого нужно сотни тысяч, если не миллиардов лет. Однако все древние астрономы говорят, что Сириус была красной звездой. Но сегодня это белый карлик. Прошло 2 000 лет, а в учебниках пишут, что нужно сотни тысяч лет.
