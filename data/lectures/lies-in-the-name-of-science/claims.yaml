- id: lies-in-the-name-of-science-312
  start: 312.7
  end: 344.8
  text: Луна крутится вокруг Земли, и она медленно от неё отдаляется, примерно 4 см в год. Это значит, что раньше она была ближе. Но если Луну приблизить к Земле, то произойдёт беда. Так как Луна является причиной приливов и отливов. Если Луна была бы ближе, то приливы и отливы были бы сильнее из-за закона обратной пропорциональности. И несколько миллиардов лет назад Луна настолько была бы близка к Земле, что приливы покрывали бы всю Землю два раза в день. Но вы можете утонуть только один раз в день.
  rating: red
  verdict: Что Луна удаляется примерно на 3,8 см в год, верно. Но скорость зависит от приливов в океанах и в прошлом была меньше, поэтому простой пересчёт назад неверен; шутка про «утонуть раз в день» ничего не доказывает.
  arguments:
  - moon-recession
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lies-in-the-name-of-science-346
  start: 346.8
  end: 413.4
  text: Космос полон пыли, и она оседает на вещах, образуя слой пыли. В 1950-х годах учёные пытались посчитать, сколько пыли на Луне. И они подсчитали, что за каждые 10 000 лет на Луне накапливается слой пыли в 2 см. И они думали, что на Луну невозможно будет приземлиться. Корабль утонет в пыли. Поэтому были построены громадные посадочные подушки, с широкими подножьями, для равномерного распределения веса. Даже спускная лестница была укорочена на 30 см. Они ожидали, что на Луне будет много пыли, и астронавты утонут в пыли. Но когда астронавты приземлились, то убедились, что на Луне чуть более одного сантиметра пыли. Если Земле миллиарды лет, то где вся пыль? Поэтому на Луне оставили пластины для собирания пыли. По появлению пыли было определено, что за 1 млн лет собирается только 6 см пыли. Но это всё же составляет 345 м за 4,5 млрд лет. Поэтому пыль свидетельствует, что Луна молода.
  rating: red
  verdict: 'Что в 1950-е некоторые учёные опасались толстого слоя пыли, верно. Но ещё до «Аполлонов» станции показали, что пыли мало: её падает в сотни раз меньше, чем думали тогда, а под рыхлым слоем лежит грунт толщиной в метры.'
  arguments:
  - moon-dust
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-415
  start: 415.5
  end: 438.5
  text: 'В космосе постоянно летают кометы. И они постоянно теряют свой материал. Солнце обжигает комету, и поэтому она оставляет позади себя хвост. Но всегда терять невозможно. Скоро она совсем исчезнет. И поэтому продолжительность жизни комет меньше 10 000 лет. Ну тогда возникает вопрос: если Вселенной миллиарды лет, то почему до сих пор летают кометы?'
  rating: red
  verdict: Что кометы быстро теряют вещество, верно. Но новые кометы постоянно приходят из далёких областей Солнечной системы — пояса Койпера и облака Оорта, поэтому кометы есть и сегодня.
  arguments:
  - comets-lose-material

- id: lies-in-the-name-of-science-440
  start: 440.1
  end: 450.6
  text: Вокруг планеты Земля находится магнитное поле. Но оно слабеет, и Земля теряет магнитную силу. И по магнитным законам Земле не может быть больше 25 000 лет.
  rating: red
  verdict: 'Что магнитное поле Земли сейчас ослабевает, верно. Но оно не убывает равномерно: поле колеблется и много раз меняло направление, это записано в горных породах, поэтому нынешний спад нельзя переносить в прошлое.'
  arguments:
  - magnetic-field

- id: lies-in-the-name-of-science-451
  start: 451.9
  end: 488.0
  text: В Гренландии и Антарктике, где постоянно сухо и очень холодно, толщина ледников измеряется в километрах. Но годовые кольца очень тонкие. Глубочайшая скважина доходит до трёх с половиной километров глубины. Образцы из Гренландии, полученные после 1990 года, показывают, что северный климат был неустойчивым 135 000 лет назад. Учёные говорят, что летом верхний слой льда тает и образует воду. Потом перезамерзает и образуется прозрачный лёд. Зимой лёд не тает и образует белый лёд. Поэтому эти полосы, тёмные-светлые, обозначают 135 000 раз лето — зима.
  rating: orange
  verdict: 'Что в ледяных кернах считают тёмные и светлые годовые слои, верно. Но в центре ледника летом почти не тает: слои различают по пыли, химическому составу и проверяют по следам известных извержений вулканов.'
  arguments:
  - ice-core-layers
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-488
  start: 488.6
  end: 524.5
  text: Но, похоже, они не знали о потерянной эскадрилье. Во время Второй мировой войны несколько самолётов приземлились в Гренландии. У них кончилось горючее, и об этих самолётах забыли. Но в 1990 году один человек решил забрать их оттуда. Но всё оказалось не так просто. Эти самолёты находились очень глубоко подо льдом. 80 м за 48 лет — это где-то 1,7 м за один год. И самая глубокая скважина, которую пробурили, получается, возникла не за 135 000 лет, а всего за 1825 лет.
  rating: red
  verdict: Самолёты «потерянной эскадрильи» сели у побережья Гренландии, где снега выпадает очень много. Керны же бурят в центре ледяного щита, где за год ложится в разы меньше снега; скорость одного места нельзя переносить на весь ледник.
  arguments:
  - ice-core-layers
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-525
  start: 525.8
  end: 553.4
  text: Возвращаемся к самолётам. Тот человек по частям через скважину вытащил самолёты. Его зовут Боб Кардин. И когда он вытаскивал, он видел более сотни тёмных и светлых колец. Боб сказал, что они никакие не годовые кольца. Это не лето — зима, лето — зима. Это тепло — холодно, тепло — холодно. Таких может быть десять за один день. Но до сих пор их называют годовыми кольцами. Получается, что нас обманывают? Или они сами не знают, о чём говорят.
  rating: red
  verdict: 'Слои над самолётом могли оставить отдельные оттепели и бури, и годовыми их никто не считал. Выбор «обманывают или не знают» ложен: в центральных кернах годовые слои проверяют несколькими независимыми признаками.'
  arguments:
  - ice-core-layers
  rhetoric:
  - personal-story
  - lozhnaya-dilemma

- id: lies-in-the-name-of-science-554
  start: 554.2
  end: 560.7
  text: В наших учебниках давно уже не учат науке. Эти книги о том, чтобы вы знали то, что хотят эволюционисты.
  rating: red
  verdict: Учебники бывают устаревшими и упрощёнными, это верно. Но они пересказывают выводы, проверенные исследователями разных стран и вер, а не «желания эволюционистов»; обвинение нужно доказывать примерами, а примеры фильма проверки не выдерживают.
  arguments:
  - textbooks-poison
  rhetoric:
  - loaded-language

- id: lies-in-the-name-of-science-562
  start: 562.5
  end: 608.8
  text: Когда идут дожди, то 30% воды поступает в океан. И эта вода приносит с собой минеральные соли. Испарение забирает пресную воду и оставляет соль в океанах. И поэтому океаны приобретают соль каждый день. Но сегодня в океанах 4% соли. Это могло произойти за менее 5 000 лет. Если планете миллиарды лет, то почему… Когда идут дожди, то 30% воды поступает в океан. И эта вода приносит с собой минеральные соли. Испарение забирает пресную воду и оставляет соль в океанах. И поэтому океаны приобретают соль каждый день. Но сегодня в океанах 4% соли. Это могло произойти за менее 5 000 лет. Если планете миллиарды лет, то почему в океанах нет больше соли?
  rating: red
  verdict: Что реки приносят в океан соль, верно. Но соль и уходит из него — в осадки и породы дна, как в ванне, куда вода льётся из крана и тут же уходит в слив, поэтому солёность почти не меняется миллионы лет.
  arguments:
  - ocean-salt
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-610
  start: 610.2
  end: 668.8
  text: С 1836 года более ста исследователей в Королевской обсерватории Гринвича и в Военно-морской обсерватории США проводят непосредственное визуальное исследование, которое показывает, что диаметр Солнца уменьшается приблизительно на полтора метра в час. Диаметр Солнца настолько огромен, что это уменьшение остаётся незамеченным на протяжении сотен и даже тысяч лет. Тем не менее Солнце продолжает уменьшаться. По мнению исследователей, темпы сокращений не изменяются со времени образования Солнца. Используя даже самые консервативные данные, можно определить, что лишь 100 000 лет назад диаметр Солнца был ровно в два раза больше. А 20 млн лет назад край Солнца должен был касаться Земли. По мнению некоторых учёных, не более одного миллиона лет назад Солнце должно было быть таким огромным, что на Земле не могло быть никакой жизни. Принимая все эти данные, можно сделать выводы, что Солнечная система и Земля достаточно молоды. Не старше 10 000 лет.
  rating: red
  verdict: 'Работа 1979 года действительно сообщала о сжатии Солнца. Но более точные измерения этого не подтвердили: диаметр Солнца лишь чуть колеблется, а «темп не менялся со времени образования» — допущение, а не измерение.'
  arguments:
  - sun-shrinking
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-669
  start: 669.8
  end: 702.2
  text: И самое интересное, что израильский народ ведёт своё летоисчисление не от Рождества Христова, как это делаем мы. Да и во многих других странах. А с момента сотворения. Сейчас у них 5770-й год. На Руси очень долго считали время от сотворения мира. Конечно, это было очень неудобно. И когда христианская церковь предложила создать единую систему отсчёта лет, этот счёт постепенно приняли во многих странах. В России он был принят в 1700 году. Получается, по Торе и Библии нашей планете всего 6 000 лет. Вот тут уже становится интересно.
  rating: purple
  verdict: Мы тоже верим, что мир сотворил Бог. Но еврейский календарь и старый русский счёт «от сотворения мира» расходятся почти на 1750 лет, значит, точный возраст мира из Библии однозначно не вычислить; как читать родословия — законный богословский спор.
  arguments:
  - genesis-literal

- id: lies-in-the-name-of-science-703
  start: 703.2
  end: 727.5
  text: 'В конце XVII столетия все думали, что планете где-то около 6 000 лет. Но Джеймс Хаттон в 1795 году опубликовал книгу «Теория Земли», который сказал: «Я думаю, что Земля намного старше, ей миллионы лет». Эта книга сильно повлияла на шведского адвоката Чарльза Лайеля, который в 1830 году написал книгу «Принципы геологии», в которой была описана геологическая колонна.'
  rating: orange
  verdict: Что Хаттон и Лайель много сделали для учения о древней Земле, верно. Но Лайель был шотландцем, а не шведом, геологическую шкалу строили многие геологи, в том числе верующие, а о древности Земли спорили ещё до Хаттона.
  arguments:
  - earth-age-billions

- id: lies-in-the-name-of-science-728
  start: 728.5
  end: 771.2
  text: 'Что он с другими учёными сделал? Они взяли окаменелости спиральных моллюсков и расположили в таком порядке, как они предполагали, что они произошли. Но колонна никогда не была проверена. Вся она основана на круговой аргументации. Ископаемые датируются по слою Земли, в котором они были найдены. Слой Земли определяется по найденным в нём ископаемым. В этом и заключается круговая аргументация. Чарльз Лайель расположил разные слои Земли. Дал им имя, возраст, индексные ископаемые. Самое интересное, что эта геологическая колонна может быть найдена только в одном месте в мире: в учебниках. Её не существует. Да, разные слои на Земле есть. Но вопрос: как они произошли?'
  rating: red
  verdict: Что слои на Земле есть, фильм признаёт. Но их порядок видно в обрывах, а возраст проверяют по прослойкам вулканического пепла, где есть радиоактивные «часы», так что круга нет, а всей колонне в одном месте быть и не нужно.
  arguments:
  - fossil-layers
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lies-in-the-name-of-science-772
  start: 772.1
  end: 794.5
  text: 'Если в школе в течение 11 лет говорить, что слой за слоем Земля накапливалась в течение миллионов лет, то они в это поверят. Но есть другой взгляд: что все эти слои образовались в одно время, в дни потопа. Если взять бочку грязи, и добавить туда воды, разболтать это всё, то можно увидеть, как образовываются слои. Гидрологическая сортировка.'
  rating: red
  verdict: Что вода сортирует частицы и в банке с грязью получаются слои, верно. Но в настоящих слоях есть следы пустынь, почв, коралловых рифов и соляных озёр, которые за один потоп возникнуть не могут.
  arguments:
  - flood-sediments
  rhetoric:
  - false-analogy

- id: lies-in-the-name-of-science-796
  start: 796.4
  end: 804.3
  text: То, что Всемирный потоп действительно был, уже практически из учёных, никто не сомневается. С каждым годом всё больше доказательств находит этому.
  rating: red
  verdict: Что у многих народов есть предания о потопе, верно. Но геологи не признают всемирного потопа, следов единой годичной катастрофы в слоях нет, а «учёных, которые не сомневаются», фильм не называет.
  arguments:
  - flood-geology-general
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-805
  start: 805.3
  end: 828.4
  text: Кстати, датировка по радиоуглеродному анализу тоже не может быть принята как точным анализом. Так как происходят три допущения. Первое. Изначально в существе не было углерода C-14. Второе. Распад C-14 происходит с постоянной скоростью. Третье — нет внешнего воздействия. Однако эксперименты показывают, что все эти допущения неверны.
  rating: red
  verdict: 'Что у любого метода есть допущения, верно. Но фильм пересказал их неверно: живой организм как раз набирает углерод-14 из воздуха и пищи, а точность метода проверили по деревьям, чей возраст известен по годичным кольцам.'
  arguments:
  - radiometric-dating
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-830
  start: 830.7
  end: 851.2
  text: Теперь рассмотрим, как описано в Ветхом Завете сотворение нашей Солнечной системы и нашей планеты. Сразу объясню, почему я это делаю, так как многие скажут, что это ненаучно. Однако факты, которыми сейчас располагают учёные, всё больше и больше находят подтверждений в Библии. Поэтому за весь фильм нам неоднократно придётся столкнуться с ней. Чтобы понять, почему происходит именно так.
  rating: orange
  verdict: 'Мы тоже верим, что Библия — Слово Божье. Но мысль, что учёные всё чаще находят в ней свои открытия, преувеличена: такие «открытия» люди знали задолго до науки или вычитывают в стихах задним числом.'
  arguments:
  - bible-science-foreknowledge

- id: lies-in-the-name-of-science-855
  start: 855.0
  end: 936.9
  text: 'В начале сотворил Бог небо и землю. Земля же была безвидна и пуста, и тьма над бездной, и Дух Божий носился над водою. И сказал Бог: Да будет свет. И стал свет. И увидел Бог свет, что он хорош, и отделил Бог свет от тьмы. И назвал Бог свет днём, а тьму ночью. И был вечер, и было утро: день один. И сказал Бог: Да будет твердь посреди воды, и отделяет она воду от воды. Интересно. Твердь Что такое твердь? Многие говорят, что твердь — это земля. Земля отделяет воду от воды. Нет, стоп. Это не Земля. В двадцатом стихе написано: «И птицы да полетят над землёй, по тверди небесной». Вы знаете, птицы не летают в земле. Птицы летают в воздухе. Это первое небо. Вообще в Библии описано три неба. Первое небо — это где летают птицы. В четырнадцатом стихе написано: «И сказал Бог: да будут светила на тверди небесной». Солнце, Луна и звёзды — это второе небо. Третье небо упоминается во Втором Коринфянам, главе двенадцатой. Апостол Павел после того, как его побили камнями, был восхищён до третьего неба. Третье небо. Это небо, где живёт Бог.'
  rating: neutral
  verdict: 'Повторное чтение Быт 1:1–20 и 2 Кор 12:2. Мы тоже принимаем давнее толкование о трёх небах: небо птиц, небо светил и обитель Божия. Спор о том, что такое твердь, — не о науке.'

- id: lies-in-the-name-of-science-937
  start: 937.9
  end: 963.4
  text: 'Вернёмся к моменту сотворения. В седьмом стихе написано: «И создал Бог твердь, и отделил воду, которая под твердью, от воды, которая над твердью. И стало так». Так, подождите, о чём тут говорится? Вода над атмосферой. Почему в 148-м псалме говорится: «Хвалите Его, небеса небес и воды, которые превыше небес». Воды над атмосферой.'
  rating: purple
  verdict: 'Мы тоже верим, что воды и небеса сотворил Бог (Пс 148:4). Но «воды над твердью» как слой воды над атмосферой — лишь одно толкование. Наука его не подтверждает: такой слой раскалил бы Землю, и от этой догадки отказались даже креационистские институты.'
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-964
  start: 964.3
  end: 977.7
  text: Я думаю, мы не знаем, как Бог сотворил небеса и как земля сотворена из воды и водою. Мы можем только догадываться. Поэтому всё, что я вам сейчас приведу, является теорией, как вода может быть над атмосферой.
  rating: neutral
  verdict: 'Честная оговорка: дальнейшее — лишь предположение. Ниже, однако, оно подаётся уже как факт.'

- id: lies-in-the-name-of-science-978
  start: 978.4
  end: 993.2
  text: 'В Исаии, в сороковой главе, говорится: «Он есть Тот, Который восседает над кругом земли». Кстати, христиане всегда знали, что планета круглая. Хотя в то время было утверждение, что Земля плоская. Если бы они спросили, они бы им сказали.'
  rating: orange
  verdict: Что Ис 40:22 говорит о «круге земли», верно. Но о шарообразности Земли знали ещё греки до Христа, Эратосфен измерил её окружность; а рассказ, будто тогда все считали Землю плоской, — поздний миф.
  arguments:
  - bible-science-foreknowledge

- id: lies-in-the-name-of-science-994
  start: 994.1
  end: 1022.0
  text: До потопа мир был другим. В наше время существует шесть слоёв атмосферы. Тропосфера, стратосфера, мезосфера, термосфера, экзосфера, ионосфера. Раньше был седьмой слой. Слой воды над атмосферой. Некоторые думают, что это был слой льда. Это хорошая теория, так как холодный лёд может висеть в магнитном поле — эффект Мейснера. Но вся эта вода упала во время потопа, и теперь этой оболочки нет.
  rating: red
  verdict: 'Что у атмосферы есть слои, верно. Но слоя воды или льда над ней не было: он раскалил бы Землю, а эффект Мейснера — это когда магнит парит над особым металлом на страшном морозе; со льдом так не бывает.'
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1023
  start: 1023.5
  end: 1038.5
  text: Оболочка воды предохраняла землю, и она создавала эффект парника. Создавал двойное давление атмосферы. Если забраться на верхушку горы, то там воздух будет разреженным. И будет трудно дышать. Но при двойном давлении легче дышать.
  rating: red
  verdict: Что на высоте дышать трудно, верно. Но столько воды над небом создало бы такой парниковый эффект, что жизнь на поверхности стала бы невозможной; поэтому от этой гипотезы отказались даже креационистские институты.
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1039
  start: 1039.2
  end: 1064.9
  text: При исследовании воздуха из янтаря было обнаружено, что кислорода было на 50% больше, чем сегодня. Вы знаете, что если бы вы жили при двойном атмосферном давлении и в котором будет на 50% больше кислорода, то только дышать было бы очень приятно. Потому что кислород поступал бы не только в гемоглобин, но и плазма была бы им насыщена. Это означает, что вы могли бы бегать 100 км, не уставая.
  rating: red
  verdict: Пузырьки в янтаре действительно изучали, и отдельные измерения давали высокое содержание кислорода. Но янтарь не хранит древний воздух неизменным, и результаты разных работ расходятся; а пробежать 100 км «не уставая» не даст никакой воздух.
  arguments:
  - vapor-canopy
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-1065
  start: 1065.6
  end: 1110.3
  text: Приведём несколько фактов. В Техасе в 1987 году ребёнок Джессика МакЛюр упал в колодец шириной 20 см и вывихнул две ноги, пробыв там 2,5 дня. После того, как её вынули, часть её тела почернела. И доктор сказал, что необходимо ампутировать её ногу. Другой доктор предложил поместить её в кислородную гиперболическую камеру. Это кислородная камера большого давления. Раньше эти камеры использовались только для водолазов. Врачи поместили Джессику в такую камеру. Накачали чистый кислород и увеличили давление. В течение нескольких часов, в ноге восстановилась циркуляция крови. В конце им пришлось ампутировать лишь половину маленького пальца на ноге. Сейчас у неё всё прекрасно.
  rating: orange
  verdict: 'Спасение Джессики Маклюр и лечение в барокамере — реальная история. Но короткий лечебный сеанс под давлением не доказывает, что жить при двойном давлении полезно: кислород под давлением долго вдыхать вредно.'
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1111
  start: 1111.2
  end: 1139.7
  text: И самая большая камера находится в Пенсаколе. В неё помещается 30 человек. В Западной Германии пациенты с особым сердечным заболеванием срочно направляются на трёхнедельный курс интенсивного лечения с помощью гиперболического кислорода. В Англии лечат рассеянный склероз. Во Франции при лечении артрита и сосудистого некроза. В Индии лечат проказу. В Бельгии имплантация конечностей. В Японии 200 камер для лечения внезапной слепоты и глухоты.
  rating: orange
  verdict: Барокамеры действительно применяют в медицине, например при отравлении угарным газом и для заживления ран. Но часть перечисленных показаний не подтверждена, а лечение больных ничего не говорит о жизни до потопа.
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1140
  start: 1140.7
  end: 1167.1
  text: Доктор Кимори выращивал помидоры с повышенным давлением углекислого газа, которым дышат растения, и использовал специальный щит для защиты от ультрафиолетового света. Через два года его куст достиг 5 м и принёс 907 помидор. Спустя 7 лет он достиг 12 м и приносил 15 000 помидор. Только один куст. И плоды с такого куста были тоже сравнительно большого размера.
  rating: orange
  verdict: Помидорное «дерево» с тысячами плодов действительно выращивали. Но рекорд дала гидропоника — питание корней раствором в теплице, а не повышенное давление воздуха, и к допотопному миру это отношения не имеет.
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1167
  start: 1167.8
  end: 1175.8
  text: И вы можете представить, что до потопа таким был весь мир? Все растения были намного больше. Так же, как и животные и люди.
  rating: red
  verdict: 'Научных следов того, что до потопа «всё было больше», нет: гигантские растения и животные жили в разные эпохи, разделённые миллионами лет, а не вместе в одном допотопном мире.'
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-1176
  start: 1176.8
  end: 1182.7
  text: В Библии написано, что допотопные люди жили около 900 лет. Что это? Ошибка или вымысел?
  rating: green
  verdict: 'Верно: в Быт 5 допотопные праотцы живут по 900 с лишним лет (Адам — 930, Мафусаил — 969). Фильм здесь лишь ставит вопрос; объяснение «воздухом до потопа» разобрано ниже.'

- id: lies-in-the-name-of-science-1183
  start: 1183.2
  end: 1224.3
  text: Найденные раскопки показывают, что не только динозавры были больших размеров, но и другие животные. Даже люди. В Бриверзвиле в 1879 году был найден скелет. Три метра длины в каменном погребении. В Неваде, в русле озера Гумбольдт, в июне 1931 года также был найден скелет трёхметровой длины. В Элкертауне группа археологов-любителей в 1925 году нашла и откопала следы восьми гигантов длиной до трёх метров. Все они были облечены в тяжёлые медные доспехи. Через неосмотрительность откапывателей и всеобщую незаинтересованность археологических музеев эти находки разбросаны и потеряны.
  rating: red
  verdict: Сообщения о трёхметровых скелетах — газетные истории XIX–XX веков, и ни одной такой кости в музеях нет. «Находки потеряны» — как раз то, что делает их непроверяемыми.
  arguments:
  - giants

- id: lies-in-the-name-of-science-1226
  start: 1226.5
  end: 1247.1
  text: Скелет высотой 4 м был найден солдатами в Ломпок-Ранчо в Калифорнии в 1883 году. Остатки были перезахоронены. Также о четырёхметровом скелете появились сообщения во многих газетах в округе Тусона, Аризона, в 1891 году. У человека было шесть пальцев. Длинные волосы и птицеобразная маска.
  rating: red
  verdict: Это снова газетные рассказы, а «перезахороненные» кости проверить нельзя. Ни одного скелета великана учёные так и не получили в руки, а без костей нет и находки.
  arguments:
  - giants

- id: lies-in-the-name-of-science-1247
  start: 1247.8
  end: 1254.1
  text: Эволюционисты заинтересованы, чтобы никто не увидел эти скелеты. Потому что они явно не похожи на шимпанзе.
  rating: red
  verdict: 'Скелет великана стал бы находкой века для любого антрополога, прятать его незачем. И эволюции он бы не противоречил: никто не утверждает, что люди должны быть похожи на шимпанзе.'
  arguments:
  - science-conspiracy
  rhetoric:
  - conspiracy

- id: lies-in-the-name-of-science-1259
  start: 1259.1
  end: 1289.9
  text: 'Громадный человеческий череп был найден в Лавлоке, Невада, в 1911 году. При раскопках холмов в Висконсине в 1904 году были найдены гигантские человеческие кости, которые были в три раза больше нормальных костей. Мы видим: сверху нормальная человеческая кость пальца, снизу — гигантская. Эти челюсти находятся в отеле Турции, 16 см ширины. При том, что у нормального человека челюсти 8 см. Вы спокойно могли бы поставить свою голову в эти челюсти.'
  rating: red
  verdict: Кости «великанов» из Лавлока и курганов Висконсина при проверке оказывались обычного размера или их не удавалось найти. Снимки «гигантской» фаланги и челюсти без музейного номера и описания ничего не доказывают.
  arguments:
  - giants

- id: lies-in-the-name-of-science-1290
  start: 1290.8
  end: 1305.5
  text: Так почему же нам об этом не говорят в школах? Думаю, потому что это противоречит теории эволюции. А раз противоречит, значит, этого не может быть. Это, кстати, любимые фразы учёных. Это не может быть, потому что этого не может быть.
  rating: red
  verdict: 'Учёные не отвергают находки за то, что они «противоречат эволюции»: им нужны сами кости для проверки. О великанах не рассказывают в школах потому, что ни одного такого скелета никто не предъявил.'
  arguments:
  - science-conspiracy
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-1306
  start: 1306.2
  end: 1326.1
  text: Я думаю, во многих музеях хранятся скелеты гигантов. Но не на общем обозрении. А в тайных складах. Доступ к которым имеет ограниченный круг людей. Думаю, очень много различных артефактов хранятся там. Но нам о них знать не нужно. Но иногда то или иное сообщение проскальзывает в Интернете или новостях.
  rating: red
  verdict: Тайных хранилищ с великанами никто не видел, это догадка автора фильма. Музейные фонды закрыты от публики из-за нехватки места, но открыты исследователям разных стран, и такую тайну им не удержать.
  arguments:
  - science-conspiracy
  rhetoric:
  - conspiracy

- id: lies-in-the-name-of-science-1327
  start: 1327.2
  end: 1366.6
  text: Ну, в общем, заурядные руины. Но здесь найдено три древних захоронения. Содержимое которых было уже далеко не заурядным. По словам местного проводника, археологи нашли здесь человеческие кости в два раза больше обычных. Американцы раскопали несколько гигантских людей, измерили их. И положили на место. А я вот сейчас здесь лежал. Наш гид показал нам копию отчёта о раскопках. Он сам помогал американцам в детстве. В копии указаны места находок, но не указаны их размеры. Почему археологи умолчали о длине обнаруженных ими костей?
  rating: red
  verdict: Сюжет держится на словах гида, а отчёт о раскопках, как признаёт сам сюжет, размеров не содержит. Умолчание в отчёте — не доказательство великанов, а повод проверить, а не верить пересказу.
  arguments:
  - giants
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-1372
  start: 1372.7
  end: 1415.3
  text: Согласно местным легендам, гиганты действительно жили на острове. Но они строили Нан-Мадол. Гиганты были злыми и приносили много бед обычным людям. В конце концов нашёлся герой, который перебил их до единого. Хотелось бы взглянуть на гигантские кости. Ну, даже если бы у нас было оборудование и разрешение на раскопки, я бы вряд ли рискнул. Хватает мистики и без этого. Это явно пропилено, Марк, смотри. Я её шевельнуть не могу. Нет, вообще без шансов. Одна из самых маленьких балочек.
  rating: neutral
  verdict: 'Продолжение телесюжета: местные легенды и каменные блоки; новых данных нет.'

- id: lies-in-the-name-of-science-1417
  start: 1417.0
  end: 1456.2
  text: Также при раскопках встречались и такие ископаемые, как шестиметровый носорог. Стрекоза с метровым размахом крыльев. Сорокапятисантиметровые тараканы. Многоножка 1,8 метра. Кузнечик 60 см длины. Камыш 18 м длины. Находили ископаемые бобра 2,5 метра. В Техасе осла трёх метров. Найдены ископаемые рога буйвола размахом 4 м. Трёхметровые рога находятся в музее доктора Баха. По находкам зубов акул было установлено, что они достигали 27 м. Были найдены громадные черепахи. Четырёхметровые птицы и ящерицы.
  rating: orange
  verdict: Многие из этих животных действительно были, например гигантские стрекозы каменноугольного периода и мегалодон. Но жили они в разные эпохи, разделённые миллионами и сотнями миллионов лет, а не в одном допотопном мире; часть цифр преувеличена.
  arguments:
  - giants
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-1456
  start: 1456.9
  end: 1481.7
  text: Ящерицы не перестают никогда расти. Так выглядит обычная ящерица. Интересно, как выглядели бы ящерицы в Эдемском саду с двойным атмосферным давлением, с кислородом на 50% больше, чем сейчас, где было бы много пищи? Не было врагов. И пусть они живут 900 лет. Весить она будет где-то 10 тонн. Ух ты! Это был динозавр.
  rating: red
  verdict: Динозавры — не большие ящерицы, у них иначе устроены таз и ноги. Годичные слои в их костях показывают, что росли они быстро и жили десятки лет, а не сотни; да и ящерицы со временем обычно перестают расти.
  arguments:
  - dinosaurs-are-lizards

- id: lies-in-the-name-of-science-1482
  start: 1482.4
  end: 1493.2
  text: Динозавры — это большие ящерицы. Они не жили миллионами лет назад. Они всегда жили с человеком. Об этом свидетельствуют многие факты. Вот некоторые из них.
  rating: red
  verdict: Динозавры — не ящерицы, а отдельная группа пресмыкающихся. Их кости лежат в слоях на десятки миллионов лет глубже любых следов людей, и мест, где они надёжно найдены вместе, нет.
  arguments:
  - dinosaurs-humans

- id: lies-in-the-name-of-science-1494
  start: 1494.1
  end: 1506.2
  text: Вальдемаром Джульсрудом найдены десятки тысяч статуэток в окрестностях Акамбаро, изображающих динозавров в движении. Они были выполнены, на удивление, реалистично. Как будто их выполняли с натуры.
  rating: red
  verdict: 'Фигурки из Акамбаро действительно существуют, но учёные их при раскопках не находили: археолог выяснил, что с 1944 года их лепила местная семья и продавала собирателю по песо за штуку. Образцы, судя по всему, брали из кино и комиксов, а не с натуры.'
  arguments:
  - dinosaur-depictions

- id: lies-in-the-name-of-science-1508
  start: 1508.3
  end: 1536.4
  text: В 1966 году в Перу профессору медицины Хавьеру Кабрере попадается в руки камень с изображением странной рыбы, который был найден в древнем индейском захоронении. Рисунок явно напоминал кистепёрую рыбу. С тех пор профессор стал скупать подобные камни, на которых также встречались и изображения динозавров. Доисторические ящеры, нарисованные неизвестными художниками, мирно соседствовали с человеком и даже использовались как ездовые животные.
  rating: red
  verdict: Камни Ики Кабрере продавал местный крестьянин Басилио Учуйя, и он признавался, что вырезал рисунки сам, по картинкам из журналов. Древнего происхождения этих рисунков никто не доказал.
  arguments:
  - dinosaur-depictions

- id: lies-in-the-name-of-science-1537
  start: 1537.0
  end: 1543.2
  text: Также практически все народы мира сложили легенды о драконах, которые имеют большую схожесть с динозаврами.
  rating: orange
  verdict: Что драконы есть в преданиях многих народов, верно. Но драконы легенд очень разные — крылатые, огнедышащие, змеи — и на реальных динозавров мало похожи; древние и сами находили окаменелые кости и складывали о них сказания.
  arguments:
  - dragon-legends

- id: lies-in-the-name-of-science-1544
  start: 1544.1
  end: 1562.3
  text: В 1982 году в штате Техас, США, были найдены трёхпалые следы динозавра, и в этом же слое — следы человека. Однако эволюционисты говорили, что это всё фальсификация. И так и не приняли эти факты. Хотя исследователи подтвердили, что след был оставлен гигантом ростом около 7 м.
  rating: red
  verdict: Следы у реки Палакси изучали и учёные, и креационисты. «Человеческие» следы оказались размытыми следами динозавров или вырезками, и даже Answers in Genesis, крупнейшая организация сторонников молодой Земли, единомышленники Ховинда, советует не приводить их как довод.
  arguments:
  - human-fossils
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-1566
  start: 1566.3
  end: 1571.0
  text: Есть свидетельства, что до сих пор в том или ином месте планеты люди встречаются с динозаврами.
  rating: red
  verdict: Рассказы о встречах с живыми динозаврами не подкреплены ни одной костью, тушей или ясным снимком. Без проверяемых останков рассказы очевидцев ничего не доказывают.
  arguments:
  - living-dinosaurs

- id: lies-in-the-name-of-science-1581
  start: 1581.7
  end: 1604.7
  text: Сейчас я предлагаю ознакомиться с теориями происхождения жизни на Земле. Итак, на сегодняшний день существуют три основных теории происхождения жизни. Первое. Это сотворение. Творец создал птиц, рыб, животных и человека. Второе. Первородный бульон, в котором зародились первые клетки. Третье. Современная теория о том, что планету заселили инопланетяне.
  rating: orange
  verdict: 'Что Творец создал всё живое, мы тоже верим. Но «три теории» перечислены неравноценно: инопланетяне — не научная теория, а химическое начало жизни с верой не спорит: Бог может творить и через законы природы, как Он растит хлеб через землю и дождь.'
  arguments:
  - origin-of-life
  rhetoric:
  - lozhnaya-dilemma

- id: lies-in-the-name-of-science-1605
  start: 1605.5
  end: 1620.5
  text: Начнём с третьей. Теория, что планету заселили инопланетяне. Или что инопланетные существа создали жизнь, или влияли на эволюцию, или сами экспериментировали, скрещивая один вид с другим, или всё, что подходит под эту теорию, считаю глупой.
  rating: neutral
  verdict: Автор называет «инопланетную» версию глупой; научной теорией она и не считается.

- id: lies-in-the-name-of-science-1620
  start: 1620.9
  end: 1635.3
  text: Во-первых, нет никаких доказательств о существовании инопланетных существ. Все видеосъёмки различных летательных аппаратов свидетельствует лишь тем, что правительство стран ищет новые виды вооружения и испытывает различные новые изобретения.
  rating: green
  verdict: 'По сути верно: доказательств существования инопланетян нет, а многие видео НЛО оказались испытаниями техники, зондами и дронами, хотя и не все.'

- id: lies-in-the-name-of-science-1635
  start: 1635.9
  end: 1658.5
  text: Однако постоянно возникают факты, что в тех или иных местах находят древнее НЛО. Так, например, в 1996 году российский спутник обнаружил в Антарктиде, в тающих льдах, практически неповреждённый неопознанный летающий объект гигантских размеров. Ну, в связи с тем, что Россия не смогла самостоятельно извлечь НЛО, она попросту взорвала объект, чтобы он не достался никому.
  rating: red
  verdict: 'История о НЛО в Антарктиде, найденном российским спутником и взорванном, не подтверждена ни одним проверяемым источником: ни снимков, ни сообщений космических агентств, ни свидетелей нет.'
  rhetoric:
  - conspiracy

- id: lies-in-the-name-of-science-1660
  start: 1660.0
  end: 1687.6
  text: Что из этого мы видим? Думаю, вряд ли Россия взорвала этот объект. Думаю, всё же сейчас она изучает где-то. Хотя умом Россию не понять. Наш Иван способен на всякое. Ну, поговорим о корабле. Не факт, что он имел внеземное происхождение. Почему бы развитой цивилизации, о которой мы поговорим чуть позже, не создать этот объект? Почему-то всё то, что сделано сейчас, у нас сразу принимается как неземным происхождением.
  rating: neutral
  verdict: Шутка о России и догадка, что объект изучают; затем намёк на древнюю цивилизацию, разобранную ниже.

- id: lies-in-the-name-of-science-1688
  start: 1688.4
  end: 1710.2
  text: Есть мнение, что все построенные НЛО Россией и США служат для инсценировки нападения инопланетян на нашу планету. Об остальном позаботятся средства массовой информации. С какой целью? Да с той, что когда развеется миф об угрозе международного терроризма, который ориентирован для поддержания экономики, для дальнейшего процветания потребуется новый образ врага. Враг из космоса.
  rating: red
  verdict: «Есть мнение» — без автора и доказательств. Ничто не подтверждает, что правительства строят НЛО для инсценировки вторжения; это догадка, которую можно подогнать под любые события.
  rhetoric:
  - conspiracy
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-1710
  start: 1710.6
  end: 1739.6
  text: 'Что, возможно, и выльется… Во-вторых, если принять во внимание, что инопланетяне действительно существуют, у нас возникают всё те же вопросы: как они произошли? Откуда появились? Откуда возникли и кто их сотворил? Извините, но ответов нет. Мы не можем о происхождении человека ничего доказать. Куда уж нам до существ других планет? Всё же я считаю это вымыслом Голливуда и пусть это останется лишь фантазии сценаристов и режиссёров. Эту теорию я считаю разрушенной.'
  rating: orange
  verdict: 'Что гипотеза о пришельцах лишь переносит вопрос о начале жизни на другую планету, верно. Но «о происхождении человека ничего доказать нельзя» неверно: ископаемые и генетика рассказывают о нём очень много.'
  arguments:
  - past-not-observable
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-1744
  start: 1744.3
  end: 1771.4
  text: В XIX веке была популярна теория самозарождения. Возникновение жизни постепенно из неживой материи. Она возникла из повседневного исследования появления личинок из несвежего мяса. Эта теория была опровергнута в шестидесятые годы XIX века. Французский учёный Луи Пастер однозначно доказал, что никакого самозарождения не существует. И тогда противникам сверхъестественного происхождения жизни пришлось замолчать на более чем полстолетия.
  rating: orange
  verdict: Что Пастер опроверг самозарождение личинок и микробов в готовой пище, верно. Но он опроверг появление живых существ за дни, а не медленное возникновение первых простейших систем из химии миллиарды лет назад; это разные вопросы.
  arguments:
  - origin-of-life
  rhetoric:
  - podmena-ponyatij

- id: lies-in-the-name-of-science-1772
  start: 1772.7
  end: 1788.0
  text: Затем, в 1936 году русский биохимик Опарин выдвинул гипотезу о происхождении жизни в неком первобытном океане. Опаринская теория дала то основание, на базе которого поколения учёных с тех пор строили все труды своей жизни.
  rating: green
  verdict: 'Верно: Опарин выдвинул гипотезу о возникновении жизни в первичном океане (первая работа — 1924 год, книга — 1936), и она легла в основу многих исследований.'
  arguments:
  - origin-of-life

- id: lies-in-the-name-of-science-1788
  start: 1788.7
  end: 1831.5
  text: Итак, первобытный бульон. Что же это такое? После того как наша планета образовалась 4,5 млрд лет назад, под воздействием сильно нагретой атмосферы и постоянно возникающих электрических разрядов в виде молний Каким-то образом химические элементы образовали живую клетку. И доказательством всего этого считается опыт, который провёл Стэнли Миллер. Он взял несколько простых веществ, немного метана, аммиака, водяного пара, соединил их электрической искрой, подобно тому, как молнии вспыхивали то здесь, то там, в атмосфере Древней Земли, и через неделю он получил аминокислоты, строительный материал для протеина. И это было превознесено как создание жизни в экспериментальной пробирке.
  rating: orange
  verdict: 'Опыт Миллера 1953 года пересказан верно: из простых газов и искр за неделю получились аминокислоты. Но учёные называли это не «созданием жизни», а первым шагом: кирпичики жизни получаются по законам химии, которые вложил в природу Творец, как соль выпадает кристаллами из рассола.'
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-1832
  start: 1832.3
  end: 1850.7
  text: Я использовал этот пример, когда преподавал эволюцию, но, взглянув на остальные факты, я обнаружил три недостатка этого выдающегося эксперимента. Во-первых, у него были не те начальные вещества, во-вторых, он использовал не те условия, а в-третьих, у него получился не тот результат. Опыт был просто великолепный.
  rating: orange
  verdict: 'Что опыт Миллера не создал жизнь, верно. Но то, что говорящий в фильме сам преподавал этот пример, — не довод. Три «недостатка» разобраны ниже, и главного вывода они не отменяют: из простых газов под действием искры получаются вещества, из которых построено живое.'
  arguments:
  - origin-of-life
  rhetoric:
  - self-authority

- id: lies-in-the-name-of-science-1850
  start: 1850.8
  end: 1867.3
  text: Опыт Миллера предполагал, что атмосфера состояла из метана и аммиака, газов, которые не могли присутствовать в больших количествах, потому что аммиак разлагался бы под воздействием ультрафиолетовых лучей. А метан можно было бы обнаружить в древнем осадочном глинозёме, но его там не оказалось.
  rating: orange
  verdict: 'Что метана и аммиака в древнем воздухе, скорее всего, было меньше, чем у Миллера, верно: сегодня считают, что там были в основном азот и углекислый газ. Но и из такой смеси искра даёт заметное количество аминокислот.'
  arguments:
  - origin-of-life

- id: lies-in-the-name-of-science-1867
  start: 1867.8
  end: 1883.5
  text: Миллер также не включил кислород, потому что знал, что кислород разрушит молекулы вещества, которые он хотел получить. Но на максимально доступных глубинах Земли мы находим оксидированные камни, которые предполагают, что атмосфера всегда была богата кислородом.
  rating: red
  verdict: 'Атмосфера не всегда была богата кислородом: он накопился в воздухе около 2,45 млрд лет назад, а до того его сразу поглощали горные породы. Миллер не добавлял кислород, потому что в древнейшем воздухе его почти не было.'
  arguments:
  - origin-of-life

- id: lies-in-the-name-of-science-1885
  start: 1885.8
  end: 1935.5
  text: Миллер также использовал неверные условия. Он использовал электрическую искру для соединения молекул газа. Проблема в том, что искра, которая соединяет аминокислоты, также разрывает их. И разрыв происходит намного чаще, чем соединение. Химические элементы, соединённые в пробирке, были бы разорваны той же искрой, что соединила их. Миллер, как биохимик, знал об этом, поэтому он оперировал газами и выделял нужные ему молекулы, используя известный биохимический приём. Но это был обман. Опыт предполагал моделирование жизни без вмешательства разума. А Миллер использовал свои опыт и знания, чтобы не допустить разрушения нужных ему молекул. Условия были уже не те. И потом он получил не тот результат.
  rating: orange
  verdict: 'Что искра и разрушает молекулы, верно, поэтому Миллер отводил готовые вещества вниз, в воду, подальше от искры. На Земле так же: молния бьёт в воздухе, а дождь смывает получившееся в море. Обмана тут нет.'
  arguments:
  - origin-of-life
  rhetoric:
  - loaded-language

- id: lies-in-the-name-of-science-1936
  start: 1936.5
  end: 1973.3
  text: Основным продуктом опыта Миллера был дёготь, присутствие которого является серьёзной помехой для течения органических реакций. Также было получено небольшое количество аминокислот, составляющих протеины в живых организмах. Проблема в том, что Миллером были получены правозакрученные и левозакрученные аминокислоты. Только левозакрученные аминокислоты составляют протеины в живых существах, а одной правозакрученной достаточно для предотвращения их образования. В действительности Миллер получил ядовитую смесь, которая полностью исключает даже малейшую вероятность появления жизни в результате химической эволюции.
  rating: orange
  verdict: Что в опыте вышли вперемешку «правые» и «левые» аминокислоты (они зеркальны, как правая и левая перчатки) и много смолы, верно, и как жизнь выбрала только «левые», пока до конца не ясно. Но «не знаем» не значит «невозможно».
  arguments:
  - origin-of-life
  rhetoric:
  - loaded-language

- id: lies-in-the-name-of-science-1974
  start: 1974.7
  end: 2033.9
  text: 'Вы можете сказать: «Но если всё сказанное правда, то как насчёт эволюционистов, которые верят во всё это?» Но интересно то, что эволюционисты согласятся со мной. Однажды я присутствовал на дебатах в Государственном университете Сан-Диего. Я просто был в аудитории, но двое моих друзей, доктор Генри Моррис и доктор Дуэйн Гиш, участвовали в споре на стороне креационистов. В конце дебатов кто-то из аудитории заметил: «Леди и джентльмены, сегодня вечером своим присутствием в этой аудитории нас почтил доктор Стэнли Миллер». И Гиш объяснил, почему опыт Миллера не может произвести живое из неживого. Доктора Миллера спросили: «Вы хотите ответить на то, что доктор Гиш сказал о ваших опытах?» Доктор Миллер ответил: «Нет». Он не верил в это уже давно. Он знал о существующих проблемах. Вот так вот. Сам Миллер признался в провале своего опыта. Хотя эволюционисты всё больше и больше пытаются доказать, что опыт Миллера подтверждает факт возникновения жизни в первобытном бульоне.'
  rating: orange
  verdict: 'Возможно, Миллер действительно не стал отвечать на тех дебатах. Но молчание — не признание: Миллер до конца жизни (2007) продолжал опыты о происхождении жизни и от своей работы не отказывался.'
  arguments:
  - origin-of-life
  rhetoric:
  - personal-story

- id: lies-in-the-name-of-science-2033
  start: 2033.9
  end: 2056.9
  text: Итак, это первая дыра в теории происхождения жизни у эволюционистов. Так кто же такие эволюционисты? Все учёные мира делятся на две группы. Это эволюционисты, учёные, которые придерживаются теории Дарвина, и креационисты, учёные, которые верят в создание жизни Творцом. Теория Дарвина как раз и служит продолжением теории возникновения жизни в первобытном бульоне.
  rating: red
  verdict: 'Учёные не делятся на «эволюционистов» и «креационистов»: многие верующие учёные принимают эволюцию и верят в Творца. А теория Дарвина объясняет, как менялась уже существующая жизнь, а не как она возникла.'
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma
  - podmena-ponyatij

- id: lies-in-the-name-of-science-2057
  start: 2057.0
  end: 2089.5
  text: Теория зарождения жизни из первобытного бульона на Земле многими учёными отвергнута. И по воле Фрэнсиса Крика, лауреата Нобелевской премии за участие в расшифровке генетического кода, появилась новая гипотеза — панспермия. Самозарождение жизни на какой-то далёкой планете, где нет кислорода, мало воды, много водорода, метана, аммиака, есть высококачественная радиация и так далее. А затем жизнь как-то забрасывается на Землю. Но и эта гипотеза не выдерживает критики со стороны теории вероятностей.
  rating: orange
  verdict: Что Крик допускал занесение жизни из космоса, верно. Но химическое начало жизни учёные не отвергли, а изучают дальше. А довод «по теории вероятностей» исходит из того, что белок собирается разом и наугад; так никто не считает.
  arguments:
  - origin-of-life

- id: lies-in-the-name-of-science-2089
  start: 2090.0
  end: 2113.7
  text: 'Выдвинуто несколько иных, не менее фантастических гипотез. Например, теория прерывистого равновесия Стивена Джея Гулда или других. Но все они обладают одним общим существенным изъяном: не могут объяснить возникновение генетического материала, то есть откуда взялась информация, закодированная в генах. Согласно которой из атомов и молекул строятся белки, ферменты, клетки и органы.'
  rating: red
  verdict: 'Гулд писал о том, быстро или медленно менялись виды, а не о начале жизни. А первую наследственную запись, по одной из версий, хранила РНК: она умеет и хранить запись, как ген, и работать, как белок.'
  arguments:
  - origin-of-life
  rhetoric:
  - podmena-ponyatij

- id: lies-in-the-name-of-science-2114
  start: 2114.5
  end: 2135.2
  text: Теория эволюции, появившаяся в XIX веке, заключает в себе мысль о том, что всё живое появилось на планете совершенно случайно. Человеком, выдвинувшим эту теорию, был естествовед-любитель Чарльз Дарвин. Он раскрыл свою теорию в книге «Происхождение видов путём естественного отбора», опубликованную в 1859 году.
  rating: red
  verdict: 'Что книга Дарвина вышла в 1859 году, верно. Но теория эволюции не говорит, что всё «совершенно случайно». Как хозяин оставляет на племя лучших кур, так и в природе потомство чаще оставляют самые приспособленные: этот отбор не слепой случай.'
  arguments:
  - evolution-religion
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-2135
  start: 2135.4
  end: 2155.5
  text: Это произведение в кратчайший срок завоевало популярность. Причиной этому была не научная ценность книги, а сам идеологический подход, проповедуемый в ней. Дарвин обеспечил поддержку материалистической философии, отрицающей существование Бога. Её фанатические приверженцы страстно поддержали эту идею.
  rating: red
  verdict: 'Что книгу быстро раскупили и ею пользовались атеисты, верно. Но приняли её и верующие: друг Дарвина Аса Грей, американский ботаник и христианин, сам продвигал её в Америке. Мотивы читателей не говорят, верна ли теория.'
  arguments:
  - evolution-religion
  rhetoric:
  - ad-hominem-pivot

- id: lies-in-the-name-of-science-2156
  start: 2156.5
  end: 2182.1
  text: Согласно дарвинской теории, все живые существа произошли от одного предка и развивались на протяжении долгого времени, подвергаясь постоянным изменениям. Сам же Дарвин не смог предоставить миру ни одного доказательства и сам же писал, что существует множество фактов, служащих опровержению его теории. Он надеялся, что они исчезнут с развитием науки, но развивающаяся наука
  rating: red
  verdict: Дарвин действительно посвятил главу «трудностям теории», но тут же отвечал на них, а книга полна доказательств — от одомашнивания до распределения видов по островам. Сегодня подтверждений у теории гораздо больше.
  rhetoric:
  - quote-mining

- id: lies-in-the-name-of-science-2182
  start: 2182.2
  end: 2251.5
  text: 'начала опровергать один за другим, казалось бы, нерушимые постулаты эволюции. Самым большим тупиком для теории эволюции является невероятно сложное строение клетки, объяснить которое случайностью просто невозможно. Все живые существа состоят из клеток, размер которых сотни долей миллиметров. Некоторые организмы состоят всего лишь из одной клетки, но даже они имеют очень сложную структуру. Одна клетка включает в себя тысячу частиц, взаимодействующих друг с другом. Клетку можно сравнить с городом, с находящейся в нём электростанцией, заводами, конвейерами, лабораториями, складами, которые контролируют все процессы в клетке. Американский математик и астроном, профессор Фред Хойл, говорил: «Образование живой клетки случайным образом, по принципу „само по себе“, так же невозможно, как и создание ураганами „Боинга-747“ по чистой случайности из кучи хлама». Вот ещё одна дыра в теории эволюционистов. Но мы продолжим дальше разбирать теорию. Допустим, клетка появилась и даже преобразовалась во многоклеточные организмы.'
  rating: red
  verdict: 'Что клетка устроена удивительно сложно, верно, и мы видим в этом премудрость Творца. Но эволюция не говорит, что клетка собралась сразу, как «Боинг» от урагана: речь о долгом пути из множества малых шагов. А сам Хойл, автор этого сравнения, считал, что жизнь занесена из космоса.'
  arguments:
  - design-complexity
  rhetoric:
  - argument-by-incredulity

- id: lies-in-the-name-of-science-2251
  start: 2251.5
  end: 2267.4
  text: Так как же смогли эти существа преобразоваться в другие? До сих пор с каждым годом всё больше и больше различных теорий, как это могло быть, выдвигается учёными. Но факт остаётся фактом. Никаких ископаемых с переходными звеньями никогда не было найдено.
  rating: red
  verdict: Переходные формы найдены. Например, тиктаалик — рыба с жабрами, но с шеей и крепкими костями в плавниках; есть и цепочка звеньев между наземными зверями и китами.
  arguments:
  - transitional-forms

- id: lies-in-the-name-of-science-2267
  start: 2267.4
  end: 2293.7
  text: Однако эволюционисты выдвигают теорию, что одни виды животных переходят в другие посредством мутации. Но и эта теория не нашла никаких доказательств. Однако опыты смогли доказать, что мутации приводят лишь к болезням, уродству и вымиранию вида, но никак не к образованию нового. Никогда мутация не сможет добавить что-то новое организму. Так, например, крыла к бескрылому или глаза безглазому.
  rating: red
  verdict: Что большинство мутаций вредны или ничего не меняют, верно. Но полезные тоже известны, например устойчивость к болезням, а удвоение генов даёт новые гены; «крыла сразу у бескрылого» теория и не обещает.
  arguments:
  - mutations-harmful
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-2294
  start: 2294.6
  end: 2348.4
  text: Долгое время переходным звеном от ящерицы к птице считалась необычная птица археоптерикс. У археоптерикса были крылья и перья, как у птицы. Но на крыльях были когти. На грудине не было кости киля, а в клюве росли зубы. То есть у неё было много черт, присущих рептилии. Но давайте внимательно посмотрим на эту птицу. Оказывается, у некоторых современных птиц есть когти на крыльях. Зубы встречались у ископаемых других птиц того времени. Отсутствие киля. Оказывается, у археоптерикса была массивная тушка. То есть то место, где крепятся мускулы, обеспечивающие мах крыла. Перо имело строение современной птицы и свидетельствует, что она могла свободно летать. Большинство учёных считают, что археоптерикс — это просто один из исчезнувших видов птиц и не является переходным звеном.
  rating: red
  verdict: Что археоптерикс был покрыт перьями и, вероятно, летал, верно. Но зубы, когти, длинный костистый хвост и отсутствие киля — черты пресмыкающихся, и большинство палеонтологов считают его переходной формой, споря лишь о его месте в родословной.
  arguments:
  - transitional-forms
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-2348
  start: 2348.4
  end: 2410.2
  text: Ещё одним якобы доказательством переходных форм являлась рыба целакант. Эволюционисты на протяжении многих лет считали, что эта рыба обладала свойствами земных животных. В пример приводились её примитивные ноги и полулёгкие. Комментарии по поводу целаканта были предоставлены как научный факт. Сказочные рисунки, показывающие выход рыбы на сушу, вошли в учебники. Когда же в 1938 году в Индийском океане был выловлен живой целакант, который считался вымершим, было обнаружено, что между той рыбой и целакантом нет никакой разницы. У целаканта не было ни примитивных ног, ни неполноценных лёгких. И, кроме того, это была рыба, жившая на глубине, не способной подняться со 180-метровой глубины. Поэтому, если в учебниках по биологии наткнётесь на археоптерикса или целаканта, смело можете утверждать, что это всё ложь и давно является опроверженной информацией. Ненахождение переходных форм также является существенным провалом в теории эволюции.
  rating: red
  verdict: Что живой целакант пойман в 1938 году, верно, и предком четвероногих учёные его не считают. Но в плавниках у него и правда кости, как в маленьких лапах, и есть остаток лёгкого; а предки четвероногих — его древние родственники с такими же плавниками.
  arguments:
  - transitional-forms
  rhetoric:
  - loaded-language

- id: lies-in-the-name-of-science-2410
  start: 2410.8
  end: 2455.6
  text: А сейчас давайте посмотрим на доску позора эволюции. Названа она так, потому что на ней показаны различные фальсификации переходных звеньев одного вида в другое. Австралопитек. В 1924 году палеонтолог Раймонд Дарт нашёл скелет человекоподобной обезьяны. При дальнейшем исследовании было выяснено, что этот скелет ничем не отличается от скелета шимпанзе. Тогда эволюционисты стали утверждать, что отличие в том, что австралопитек ходил вертикально, то есть на двух ногах. Однако это утверждение было опровергнуто Соли Сокерманом и Чарльзом Оксфордом, двумя всемирно известными палеонтологами. Таким образом, австралопитек оказался всего лишь представителем вымершего рода обезьян.
  rating: red
  verdict: 'Дарт нашёл не скелет, а череп ребёнка, и от черепа шимпанзе он отличается. Позже нашли кости таза и стоп и даже цепочку окаменевших следов: эти существа ходили на двух ногах, хотя людьми не были.'
  arguments:
  - ape-men-frauds
  rhetoric:
  - loaded-language

- id: lies-in-the-name-of-science-2457
  start: 2457.0
  end: 2483.7
  text: Останки, распределённые эволюционистами на мифические классы типа хомо эректус, хомо эргастер, хомо сапиенс, в действительности принадлежат различным человеческим племенам. При изучении не нашлось никакой разницы между найденными экземплярами остатков и скелетом современного человека. Единственная разница заключается в структуре изменений черепа. Однако она до сих пор наблюдается у различных человеческих рас.
  rating: red
  verdict: 'Человек прямоходящий отличается от нас не только черепом: у него меньше мозг, массивные надбровья, другие челюсти и зубы. Разницы такого размера между нынешними народами нет: все люди сегодня — один вид.'
  arguments:
  - ape-men-frauds

- id: lies-in-the-name-of-science-2484
  start: 2484.1
  end: 2501.4
  text: Пилтдаунский человек. В течение 35 лет череп пилтдаунского человека считался промежуточным звеном между человеком и обезьяной. Но сотрудники Британского музея обнаружили, что Чарльз Доусон умышленно подогнал и вставил челюсть от обезьяны в человеческий череп.
  rating: orange
  verdict: Что пилтдаунский череп — подделка, верно. Но разоблачили её сами учёные в 1953 году, к тому времени он уже плохо вписывался в другие находки, и подделка одного черепа не отменяет сотен настоящих.
  arguments:
  - ape-men-frauds
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-2503
  start: 2503.6
  end: 2514.2
  text: Питекантроп. На самом деле был найден на острове Ява череп обезьяны, а спустя год в четырнадцати метрах бедренная кость человека.
  rating: red
  verdict: Что бедро, скорее всего, человеческое и более позднее, верно. Но черепная крышка не обезьянья (около 940 см³, у гиббона около 100, у нас около 1350), а на Яве и в Китае нашли много других остатков этого вида.
  arguments:
  - ape-men-frauds

- id: lies-in-the-name-of-science-2515
  start: 2515.5
  end: 2525.2
  text: Неандерталец. Сейчас доказано, что это был человек в полном смысле этого слова. Только с деформированной спиной. Возможно, он просто болел артритом.
  rating: orange
  verdict: 'Что неандертальцы — люди с большим мозгом, близкие к нам, верно: у нынешних людей есть немного неандертальских генов, потому что наши предки рожали с ними общих детей. Но «сгорбленный» облик дала ошибка ранней реконструкции, а скелет неандертальца по форме заметно отличается от нашего.'
  arguments:
  - ape-men-frauds

- id: lies-in-the-name-of-science-2526
  start: 2526.2
  end: 2541.6
  text: Человек Небраски. Кто-то нашёл один зуб, и по нему была выстроена реконструкция всего существа и нарисована в учебниках. А на самом деле это оказался зуб свиньи. Такова доска позора эволюции.
  rating: orange
  verdict: Что «небрасский человек» оказался зубом пекари, похожей на свинью, верно. Но рисунок появился в популярном журнале, а не в учебниках, и ошибку через несколько лет исправили сами учёные.
  arguments:
  - ape-men-frauds
  rhetoric:
  - cherry-picking

- id: lies-in-the-name-of-science-2543
  start: 2543.2
  end: 2575.8
  text: 'Помните нашу русскую сказку про Ивана-Царевича, который стрельнул однажды из лука и пошёл искать свою невесту? Стрела оказалась на болоте. И стрелу держала лягушка. Эта лягушка по ночам превращалась в прекрасную девушку. Я задам вам вопрос: «Такое может быть на самом деле?» Вы ответите: «Конечно, нет». Но учёные утверждают, что может, только должно пройти миллионы лет. Итак, значит, если лягушка сразу превращается в человека, это сказка. А если за миллионы лет — это наука.'
  rating: red
  verdict: 'Наука не говорит, что лягушка превращается в человека. Лягушка нам не предок: как у троюродных братьев общий прадед, так и у лягушек с людьми был очень давний общий предок, не лягушка и не человек. А от сказки научные выводы отличает проверка ископаемыми и генетикой.'
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lies-in-the-name-of-science-2576
  start: 2576.3
  end: 2594.3
  text: 'Возникает у меня вопрос: почему, если даже эволюционисты признали, что все найденные переходные звенья — это подделки и не являются доказательством, то почему нас об этом учат в учебниках? Может, хватит в учебниках писать то, что было опровергнуто ещё в середине XX века?'
  rating: red
  verdict: 'Никто не признавал, что «все переходные звенья — подделки»: подделкой был Пилтдаун, ошибкой — «небрасский человек», а остальные находки хранятся в музеях и изучаются. Учебники описывают настоящие окаменелости.'
  arguments:
  - transitional-forms
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-2594
  start: 2594.8
  end: 2642.7
  text: Хорошо. Пусть была эволюция. Пусть человек произошёл от какого-то другого существа. Уважаемые эволюционисты, ответьте мне на вопрос. Как душа человека смогла появиться в процессе эволюции? Что? Вы скажете, что душа не доказана? А как же сотни тысяч свидетельств людей, у которых была клиническая смерть? Когда они все описывают одно и то же состояние полёта по туннелю к свету. При этом испытывая необъяснимое чувство любви и нежности. И из этого состояния им не хотелось возвращаться. Как же тысячи свидетельств того, что люди видели себя со стороны, всё, что происходило во время операции? Извините меня, но тут у эволюционистов большие провалы. И отговорки, что это всё типа иллюзии, создаваемые мозгом, туда тут не подойдут.
  rating: orange
  verdict: 'Мы тоже верим, что у человека есть душа от Бога. Но автор фильма ставит выбор «либо эволюция, либо душа», которого нет: христиане по-разному понимают происхождение души, и многие, кто принимает эволюцию, верят в душу. Околосмертный опыт объясняют по-разному, и на этот спор он не ложится.'
  rhetoric:
  - lozhnaya-dilemma

- id: lies-in-the-name-of-science-2643
  start: 2643.9
  end: 2668.3
  text: 'Однажды у эволюциониста спросили: «Почему вы учите теории эволюции, не имея при этом доказательств?» На что он ответил: «У нас нет другой теории. Поэтому мы учим тому, что знаем». Вот так нам и промывают мозги с детства и вдолбливают то, чего ещё не смогли доказать. А после школы дети уже не могут принять другие факты, так как 11-летнее впихивание ложной информации уже осело в ихнем мозге.'
  rating: red
  verdict: 'Безымянная «цитата» — не довод. Доказательства эволюции есть, и часть видели своими глазами: в XX веке в США из завезённых козлобородников возникли два новых вида растений. А называть уроки биологии «промыванием мозгов» — оценка вместо довода.'
  arguments:
  - textbooks-poison
  rhetoric:
  - appeal-authority-unnamed
  - loaded-language

- id: lies-in-the-name-of-science-2669
  start: 2669.3
  end: 2701.8
  text: 'Одно радует: что в современной альтернативной истории начинают появляться факты о действительном прошлом. Так, например, при изучении древних построек: пирамиды Гиза в Египте, храмы племени майя в Мексике, Наска, Баальбек и других построек — было принято решение, что ранее существовала очень развитая цивилизация. И, возможно, превосходила по знаниям нас, современных людей. Так что же за цивилизация ранее существовала? Какие находки были найдены и что вообще привело к такому мнению? Я приведу лишь малую часть фактов.'
  rating: red
  verdict: 'Что древние постройки поражают мастерством, верно. Но археологи не приходили к выводу о сверхразвитой древней цивилизации: пирамиды, храмы майя, Наску и Баальбек построили известные народы, оставившие следы своей работы.'
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-2702
  start: 2702.6
  end: 2729.8
  text: Во-первых, начнём с Великой пирамиды в Египте. Вспомним, что мы учились в школе из учебников. Сразу вспоминаются картинки, как множество рабов таскают огромные каменные блоки для постройки пирамиды. Но действительно ли египтяне строили эту пирамиду? Или они просто нашли эти постройки и решили использовать их по своему усмотрению? Второй более убедительно смотрится. Потому что тех технологий, которыми была построена пирамида, у египтян не было.
  rating: red
  verdict: 'Что пирамиды — огромный труд, верно, а толпы рабов — скорее образ из кино. Но строителей Гизы археологи знают: найдены их посёлок, пекарни, гробницы с именами и папирусы о доставке камня.'
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - argument-by-incredulity

- id: lies-in-the-name-of-science-2730
  start: 2730.5
  end: 2779.7
  text: Массивные каменные блоки из прочного гранита, которые обработаны настолько идеально ровно, что возникает мысль, что оно обрабатывалось каким-то машинным устройством и явно не вручную. И доказательством этого служат найденные пропилы. Как считается, дисковой пилой. Также найдены многочисленные отверстия, которые можно было просверлить, используя явно какие-то современные технологии, которых у египтян не было. А вот это уже не детские забавы. Идеально ровная поверхность. По кривой. И вдоль всё ровно точно такое же. Как это можно было сделать без современных инструментов, представить просто невозможно. Точнее, этого просто вообще нельзя сделать без современных инструментов.
  rating: red
  verdict: Что египетские мастера обрабатывали камень очень точно, верно. Но пропилы и сверлёные отверстия объясняются медными пилами и трубчатыми свёрлами с песком; археологи повторяли такую работу, а «невозможно представить» — не довод.
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - argument-by-incredulity

- id: lies-in-the-name-of-science-2780
  start: 2780.6
  end: 2803.8
  text: Те же технологии наблюдаются и в Мексике, в том месте, где жили племя майя. Понятно, что индейцы сами не смогли бы всё построить. Поэтому считается, что они уже пришли на развалины некоего храма и его уже сами достраивали. Опять тут же присутствуют громадные каменные блоки с ровной поверхностью. Как раз они и заставляют задуматься, как эти блоки были сюда доставлены.
  rating: red
  verdict: 'Археологи не считают, что майя «пришли на чужие развалины»: найдены их надписи о строительстве, каменоломни и следы перестроек храмов. Сомнение, что индейцы «сами не смогли», ничем не подкреплено.'
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - argument-by-incredulity
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-2807
  start: 2807.0
  end: 2836.5
  text: Не менее интересно изображение Наска, недалеко от Перу. Тут уж поистине интерес возникает. Как? Кто, зачем и для чего сделал такие изображения животных? птиц, насекомых, людей, которые можно увидеть лишь с высоты птичьего полёта. Опять же, много версий, что это делалось для инопланетян. Я же считаю, что это делалось для той же цивилизации, которая умела летать. Или на сконструированных аппаратах, или на динозаврах. Например, птеродактили.
  rating: red
  verdict: 'Чтобы нарисовать линии Наски, летать не нужно: исследователи повторяли такие рисунки с колышками и верёвками. А птерозавры вымерли за десятки миллионов лет до людей.'
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-2838
  start: 2838.0
  end: 2851.5
  text: И самое интересное мы можем увидеть в Баальбеке. Там самые большие колонны храма. Самые большие блоки каменной кладки. И самый большой в мире блок, который в эту кладку не попал, так и остался неподалёку в каменоломне.
  rating: green
  verdict: 'Верно: в Баальбеке огромные римские блоки, а крупнейшие, весом до 1650 тонн, так и остались в древней каменоломне.'

- id: lies-in-the-name-of-science-2852
  start: 2852.9
  end: 2876.5
  text: В одном из арабских манускриптов, найденных здесь, говорится о легендарном царе Нимроде, который послал сюда гигантов для того, чтобы восстановить Баальбек после Всемирного потопа. Другая аналогичная версия утверждает, что Баальбек вообще самое древнее в мире сооружение, построенное сыном Адама Каином и заселённое им гигантами, которые позднее за свои злодеяния были наказаны потопом.
  rating: orange
  verdict: Такие средневековые легенды действительно есть. Но храмы Баальбека построили римляне, строительство шло больше двух веков, это видно по надписям и стилю; рассказ о Каине и гигантах — сказание, а не история.
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-2877
  start: 2877.0
  end: 2893.3
  text: Вот тут интересно. Почему обо всём этом нам не рассказывают в школах? Наверное, потому что наши предки-обезьяны ну никак не могли это построить. Поэтому, может, хватит в школах обучать эволюции. Может, пора приводить действительно факты истории, которые находятся на нашей планете?
  rating: red
  verdict: 'В школах рассказывают о пирамидах и древних храмах, и их строители известны. Эволюция говорит о предках человека миллионы лет назад, а пирамиды строили люди нашего вида: одно другому не противоречит.'
  arguments:
  - science-conspiracy
  rhetoric:
  - straw-man

- id: lies-in-the-name-of-science-2894
  start: 2894.2
  end: 2925.6
  text: Нередко золотые фигурки экзотических птичек были найдены в захоронении древних индейских вождей. Специалисты по аэродинамике с первого взгляда понимают, что фигурки изображают вовсе не птиц. Дельтовидное крыло под туловищем и вертикальный киль в природе у пернатых не встречается. Загадочный экспонат отправляют в военную лабораторию, где его помещают в аэродинамическую трубу. Первые же испытания показывают, что золотая птица по своим лётным характеристикам превосходит все мировые достижения.
  rating: red
  verdict: Золотые фигурки из Колумбии археологи считают изображениями птиц, рыб и насекомых. Рассказа о «военной лаборатории» и испытаниях в трубе никто не подтвердил, а источника этого рассказа фильм не называет.
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-2929
  start: 2929.2
  end: 2940.2
  text: Также некоторые египетские иероглифы напоминают нам современные вертолёты и танки. Есть теория, что с помощью вот такого вертолёта древние перевозили огромные каменные блоки на большие расстояния.
  rating: red
  verdict: '«Вертолёт» в Абидосе — наложение иероглифов: по объяснению египтологов, рисунок сложился из разных надписей, испорченных при реставрации. Машины там нет, а «перевозка блоков вертолётом» держится только на этом сходстве.'
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-2945
  start: 2945.3
  end: 2969.1
  text: 'Во всех древних текстах их называют богами. Ну вот тут нужно подумать: а почему? Может, потому что были они высокого роста и обладали обширными знаниями. Кстати, сейчас часто их из-за этого называют пришельцами, которые прилетели на нашу планету, чтобы дать нам знания и различные достижения. Но, судя по всему, эти знания у нас не прижились, раз были утеряны.'
  rating: orange
  verdict: 'Что во многих древних текстах есть рассказы о богах-учителях, верно. Но вывод, что это были высокорослые люди с утраченными знаниями, — догадка без доказательств: ни великанов, ни утраченных технологий археология не находит.'
  arguments:
  - giants

- id: lies-in-the-name-of-science-2969
  start: 2969.9
  end: 2988.4
  text: Судя из всего вышесказанного, можно попробовать восстановить всю последовательность событий, начиная от сотворения. Вы можете не соглашаться с этим, потому что это моё мнение. У вас может оказаться своё. Я считаю, что Бог сотворил Землю, траву, животных и людей за шесть дней.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил землю, растения, животных и людей. Автор честно называет шесть дней своим мнением; многие христиане читают дни творения иначе, это законный богословский спор.
  arguments:
  - genesis-literal

- id: lies-in-the-name-of-science-2989
  start: 2989.0
  end: 3001.3
  text: У Адама с Евой появились дети, не только описанные в Библии Каин и Авель. Думаю, за 900 лет родились много сыновей и дочерей, которые женились друг на друге. В этом нет ничего удивительного. У них просто не было выхода.
  rating: neutral
  verdict: 'Мы тоже принимаем этот древний ответ: дети Адама и Евы вступали в браки между собой, так толковали и Августин, и многие протестанты. К науке это не относится.'

- id: lies-in-the-name-of-science-3002
  start: 3002.4
  end: 3013.8
  text: Кстати, генетики, анализируя гены различных наций, сделали вывод, что все люди произошли от одного потомка — человека. Ух ты! Если они бы прочли Библию, то они бы знали об этом.
  rating: orange
  verdict: 'Генетики нашли «митохондриальную Еву», от которой все люди идут по материнской линии. Но она жила больше 100 000 лет назад и была не единственной женщиной своего времени. Это не опровергает библейскую Еву: генетика говорит об одной линии наследования, а не о первой женщине.'
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-3014
  start: 3014.8
  end: 3028.5
  text: Итак, возвращаясь к Адаму и его детям. Они населяли Землю и смогли построить многие архитектурные сооружения в виде пирамид из мегаблоков с идеально ровной поверхностью, предназначение которых ещё предстоит выяснить специалистам.
  rating: red
  verdict: Пирамиды строили египтяне Древнего царства около 4500 лет назад, это подтверждают надписи и посёлки строителей. Никаких следов «допотопных» строителей археология не знает.
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-3028
  start: 3028.7
  end: 3037.4
  text: Итак, благодаря двойному атмосферному давлению и на 50% большему кислорода, чем сейчас, люди могли жить 900 лет.
  rating: red
  verdict: 'О долголетии допотопных людей мы читаем в Бытии. Но двойного давления и лишнего кислорода не было: для этого над небом нужен десятиметровый слой воды, а «кислород в янтаре» оказался ошибкой. Да и жить в таком воздухе вредно для лёгких.'
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-3037
  start: 3037.6
  end: 3043.8
  text: И ростом они были до 12 м, возможно, и больше. По некоторым версиям, рост доходил до 40 м.
  rating: red
  verdict: 'Рост 12–40 м для человека невозможен: при увеличении роста вес растёт быстрее прочности костей, и они бы не выдержали. Таких скелетов нет, а «некоторые версии» не названы.'
  arguments:
  - giants
  rhetoric:
  - appeal-authority-unnamed

- id: lies-in-the-name-of-science-3044
  start: 3044.1
  end: 3069.7
  text: 'Но за 2 000 лет увидел Господь, что велико развращение человеков на земле и что все мысли и помышления сердца их были зло во всякое время. И раскаялся Господь, что создал человеков на земле. И сказал: «Истреблю с лица земли человеков, которых Я сотворил, от человеков до скотов, и гадов, и птиц небесных истреблю, ибо Я раскаялся, что создал их».'
  rating: neutral
  verdict: Чтение Быт 6:5–7 — переход к рассказу о потопе.

- id: lies-in-the-name-of-science-3070
  start: 3070.6
  end: 3086.2
  text: Затем был потоп. Вода, которая была над атмосферой, пролилась дождями. Плюс было много других источников вод. Также найдены пирамиды под водой. Что также свидетельствует о потопе. Вода затопила многие постройки.
  rating: red
  verdict: Мы верим, что Писание говорит о потопе, а как его понимать — богословский вопрос. Но водяного покрова над атмосферой не было, а «подводные пирамиды» большинство геологов считают природными скалами.
  arguments:
  - vapor-canopy

- id: lies-in-the-name-of-science-3086
  start: 3086.9
  end: 3113.0
  text: А если учесть, что допотопная раса людей могла летать, и знания у них были намного больше наших, то почему бы им не летать на Луну или Марс? Если мы это смогли… то, думаю, и они могли. Они же всё же знали, что звёзд — как песчинок на берегу и что Земля в форме шара подвешена ни на чём. Возможно, они могли оставить пирамиды и лицо Сфинкса на Марсе. Если эти постройки действительно рукотворные.
  rating: red
  verdict: Что звёзд невероятно много, верно. Но следов полётов древних людей нет, а «лицо» на Марсе на подробных снимках оказалось обычным холмом, «пирамиды» — природными скалами.
  arguments:
  - ancient-advanced-civilization

- id: lies-in-the-name-of-science-3113
  start: 3113.9
  end: 3125.3
  text: Я считаю, что всё это могло быть на самом деле. И эта теория, мне кажется, намного реальней, чем миллиардный след возникновения жизни из неживой материи или какая-либо инопланетная цивилизация.
  rating: orange
  verdict: 'Автор честно говорит, что это его мнение. Но выбор «моя реконструкция или жизнь из неживого и пришельцы» ложен: вера в Творца не требует ни великанов, ни допотопных летательных аппаратов.'
  rhetoric:
  - lozhnaya-dilemma
  - argument-by-incredulity

- id: lies-in-the-name-of-science-3126
  start: 3126.1
  end: 3139.5
  text: А если теория сотворения верна? Тогда есть Творец всего. И, возможно, пора уже нам задуматься о том, что будет с нами после нашей физической смерти. Готовы ли мы встретиться с Создателем?
  rating: neutral
  verdict: Финальный призыв задуматься о встрече с Творцом. Мы его разделяем; к научным доводам он не относится.
