- id: lies-in-the-name-of-science-242
  start: 242.9
  end: 259.4
  text: Галактики — это звёзды, которые крутятся большими группами. Внутренние звёзды крутятся быстрее внешних. Если бы галактикам было миллиарды лет, то у них бы не было спиральных концов. Существование спиральных галактик доказывает, что им нет миллиардов лет.
  rating: red
  verdict: 'Что внутренние звёзды галактики обращаются быстрее, верно, и задачу «закручивания» астрономы знают. Её объясняют волны плотности: рукав — не одни и те же звёзды, а сгущение, через которое звёзды проходят, как машины через пробку.'
