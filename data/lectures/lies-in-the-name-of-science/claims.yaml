  end: 310.5
  text: Почему Луна Юпитера горячая? Она имеет сильное магнитное поле, а магнитные поля возникают под движением расплавленного жидкого металла внутри планеты. Но ведь планета должна была охладиться до твёрдости миллиарды лет назад.
