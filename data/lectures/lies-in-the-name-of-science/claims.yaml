- id: lies-in-the-name-of-science-114
  start: 114.8
  end: 139.3
  text: Откуда появились законы при взрыве точки? Да и вообще, откуда появилась энергия для Большого взрыва? Первое начало термодинамики говорит, что материя и энергия не могут быть созданы и разрушены ни одним известным естественным процессом. Второй закон добавляет, что материя и энергия становятся всё менее и менее полезными. Другими словами, энергия не могла возникнуть сама по себе.
  rating: orange
  verdict: Законы термодинамики пересказаны близко к учебнику. Но они описывают процессы внутри уже существующего мира и не говорят, как он начался; что начало мира — дело Творца, мы тоже верим, но физика тут ничего не опровергает.
  arguments:
  - pervyj-zakon-termodinamiki

- id: lies-in-the-name-of-science-140
  start: 140.6
  end: 180.2
  text: 'Издревна, на протяжении тысячелетий преобладала всего лишь одна теория. Теория сотворения. Все, я думаю, её сейчас знают, так как она до сих пор является из основных теорий происхождения Вселенной. Прочтём её. В начале сотворил Бог небо и землю. Земля же была безвидна и пуста, и тьма над бездной, и Дух Божий носился над водою. И сказал Бог: Да будет свет. И стал свет. И увидел Бог свет, что он хорош, и отделил Бог свет от тьмы. И назвал Бог свет днём, а тьму ночью. И был вечер, и было утро: день один.'
  rating: neutral
  verdict: Чтение Быт 1:1–5; мы тоже верим этим словам. Что «тысячелетиями была одна теория», неточно (у разных народов были свои рассказы о начале мира), но на довод это не влияет.

