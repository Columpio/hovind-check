- id: lies-in-the-name-of-science-212
  start: 212.8
  end: 234.0
  text: Конечно, вы скажете, что Библия написана людьми, и что это всё неправда. Но подождите. Мы ещё не раз вернёмся к тому, что в ней написано, и вы сами сможете определить, правда это или нет. К тому же, Библия признана исторической книгой, книгой, по которой изучают историю. Поэтому пока уберём всю религиозность и будем относиться к ней как к исторической книге.
