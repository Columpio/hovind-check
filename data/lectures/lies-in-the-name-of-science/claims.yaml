  start: 181.7
  end: 195.1
  text: Как мы видим, за один день была создана Вселенная. Тогда не возникает вопросов, которые возникали при теории Большого взрыва. Понятно, откуда возникла материя, откуда появились законы. Всё это было создано.
  rating: purple
  verdict: Мы тоже верим, что материя и законы природы созданы Богом. Но вера в Творца отвечает на вопрос «кто», а модель Большого взрыва — «как»; противопоставлять их не нужно, а сколько длился «день один», христиане понимают по-разному.
