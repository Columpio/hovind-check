- id: lies-in-the-name-of-science-80
  start: 80.6
  end: 100.8
  text: 'У меня сразу возникают вопросы: откуда появилась материя? Кто сотворил вещество? Как возникло пространство, в котором была эта точка, этот вакуум? Как при взрыве атома смогло получиться столько веществ, разных элементов — практически вся таблица Менделеева, да ещё в таких масштабах, как несколько сотен тысяч галактик?'
