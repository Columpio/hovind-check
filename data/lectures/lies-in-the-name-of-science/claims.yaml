  text: 'Самая популярная модель — это теория Большого взрыва. Она гласит: около 20 млрд лет назад вся материя Вселенной сконцентрировалась в очень напряжённом регионе, который могла быть меньше точки. То есть практически ничего. С размером в атом. После чего по непонятным причинам она взорвалась, образуя галактики. Это мнение учёных, как они себя называют.'
