  text: Но возникает один вопрос, на который никто не может ответить. Как появился Бог? Вот тут теория сотворения и теория Большого взрыва схожи. В одной нельзя сказать, откуда появился Создатель, в другой — откуда взялась начальная точка.
  rating: orange
