- id: lecture-6-6030
  start: 6030.4
  end: 6223.8
  text: Слава Богу, что кровь Иисуса Христа омыла мои грехи. А то мне было бы очень плохо. Если вы не омыты кровью Иисуса, горе вам. Но он любит вас и хочет спасти вас. Мы все умрём. И я умру тоже. Я постараюсь, чтобы это было моё последнее дело. Но это произойдёт. Это произойдёт и с вами. Вы будете мёртвыми долгое время. Где вы будете? Или же, если вы спасены, что вы покажете за свою жизнь? Что? Вы всё это оставите? Возьмите кого-то с собой на небо. Не большого, так маленького. Помогите кому-то спастись. Каждый должен привести кого-то ко Христу. Если не знаете, как научитесь. Если вы боитесь, раздавайте брошюры, видеокассеты, делайте что-то Потоп должен напоминать нам о Божьем суде. Должен побуждать нас проводить людей ко Христу. Это одна из видеосерий о создании эволюции динозавров. Однако намного важнее знания правды и научных фактов эта уверенность в том, что Что вы пойдёте в рай? Если вы никогда не доверились Христу как Спасителю Я расскажу, как можно попасть в рай. Библия говорит, что все мы грешники, все мы нарушили Божий закон, мы ослушались Создателя, Мы грешники. Одни хуже других, по крайней мере, в человеческих глазах. Но все мы нарушили божьи законы. И Библия говорит, что мы должны покаяться. Отвернуться от греха и повернуться к Богу. Бог ищет перемены в вашем отношении, когда вы говорите:«Боже, я больше не хочу грешить, я хочу жить правильно». И вы отворачиваетесь от греха и поворачиваетесь к Богу и просите прощения. В Библии в Римлянам 3:23 говорится, что все согрешили и лишены славы Божьей. Вы должны признаться, что вы грешник. Во-вторых, в Римлянам 6:26 говорится:«Ибо возмездие за грех— смерть». Мы заслуживаем смерть и ад. Ну Иисус умер за вас? Он любит вас. Он хочет, чтобы вы попали в рай. И кто попросит бесплатное спасение, Бог даст вечную жизнь, как сказано в Римлянам 623. Это подарок. В Римлянам 10:13 говорится Ибо всякий, кто призовёт Имя Господне, спасётся. Скажите Богу, Господь. Я грешник. Прости меня. Попросите его, и он даст вам бесплатный дар вечной жизни. Помолитесь со мной сейчас, и вы сможете принять Христа как Спасителя. Здесь нет волшебных слов. Бог смотрит на ваше сердце. Скажите, дорогой Господь Иисус. Я знаю, что я грешник. Я нарушил твой закон, прости меня. Засчитай свою кровь на мой счёт. Прости мои грехи и прими меня на небо. Во имя Иисуса Христа. Аминь Библия говорит, что если вы призовёте Имя Господне и спасётесь, Если вы попросили Господа, Он спасёт вас. Теперь вам надо расти, читайте Библию, молитесь, ходите в церковь. Возрастайте, чтобы стать хорошим христианином. Спасибо. Пишите, мы будем рады рады помочь.
  rating: neutral
  verdict: Проповедь, изложение Евангелия и молитва покаяния для зрителей. Мы разделяем призыв довериться Христу.
