- id: lecture-6-50
  start: 50.2
  end: 59.4
  text: Спасибо, что вы пришли. Моё имя Кинт Ховинд. Я преподавал науку 15 лет, и теперь последние 11 лет я путешествую и говорю о сотворении Эволюции и динозаврах.
  rating: neutral
  verdict: 'Представление. Пятнадцать лет преподавания в школе — опыт, но не довод: сказанное ниже проверяем по существу, а не по званию лектора.'
  rhetoric:
  - self-authority

- id: lecture-6-60
  start: 60.1
  end: 71.7
  text: На моём семинаре мы говорим на разные темы. Краткий обзор информации. Библия учит, что Бог сотворил весь мир за 6 дней около 6 000 лет назад. Земле нет миллиардов лет, как учат учебники.
  rating: purple
  verdict: 'Мы тоже верим, что мир сотворил Бог. Но цифру «6000 лет» Библия не называет: это вывод из сложения родословий, и многие христиане понимают дни творения иначе. Это законный богословский спор.'
  arguments:
  - genesis-literal

- id: lecture-6-72
  start: 72.9
  end: 104.6
  text: 4 400 лет назад был потоп. Об этом мы будем говорить сегодня. Что было причиной потопа? И что произошло после потопа? До потопа мир многим отличался. Люди жили по 900 лет. И это было время гигантских динозавров. Динозавры— это большие ящерицы, которые жили с Адамом и Евой в Эдемском саду. Они не жили миллионы лет назад. Иной взял их в ковчег. Об этом мы говорим на кассете Третьей. А на кассете второй мы говорим, почему они жили 900 лет и каким было первоначальное творение.
  rating: red
  verdict: Что Ной спас животных от потопа, мы читаем в Библии. Но кости динозавров лежат в слоях, где нет ни людей, ни крупных млекопитающих, и ни одного следа их совместной жизни не найдено.
  arguments:
  - dinosaurs-humans

- id: lecture-6-105
  start: 105.5
  end: 118.4
  text: На кассете четвёртой мы говорим об обмане в учебниках, с помощью которого учеников заставляют поверить в сумасшедшую теорию эволюции. В учебниках находится чистая ложь, по-другому выразиться невозможно. Просмотрите четвёртую кассету.
  rating: orange
  verdict: Ошибки в учебниках бывают, и их нужно исправлять. Но резкие ярлыки для учебников и «сумасшедшая теория» — оценка, а не довод; что именно в учебниках неверно, Ховинд разбирает в лекции 4.
  arguments:
  - textbooks-poison
  rhetoric:
  - loaded-language

- id: lecture-6-119
  start: 119.3
  end: 137.7
  text: На кассете пятой мы говорим о философском влиянии учения эволюции. Если человек— это только зверь. Как это влияет на мир? Это связано с коммунизмом, социализмом, марксизмом. И также новым мировым порядком. Но сегодня мы поговорим о потопе.
  rating: orange
  verdict: Что идеями эволюции злоупотребляли политики, верно. Но биология не учит, что «человек — только зверь», а связь с «новым мировым порядком» Ховинд не показывает, только объявляет.
  arguments:
  - evolution-morality
  rhetoric:
  - conspiracy

- id: lecture-6-137
  start: 137.9
  end: 152.7
  text: Что причинило потоп во дни Ноя? В Библии сказано, что Бог сотворил небо и землю. Наши основатели придерживались философии, что Бог сотворил всех людей равными. Они верили в создателя, который решал, что правильно и неправильно.
  rating: green
  verdict: 'Верно: Бог — Творец неба и земли, и создатели США в Декларации независимости писали, что права людям даёт Творец. С этим мы согласны.'

- id: lecture-6-153
  start: 153.1
  end: 176.2
  text: В первоначальном творении была оболочка воды над землёй. И мы говорим об этом на кассете второй, о воде над атмосферой. упомянутой в Бытие 1.7, что объясняет, почему люди жили по 900 лет Средний возраст до потопа был 912 лет. После потопа возраст сократился до 400 лет. Потом 200 лет, и сегодня немногие доживают до 100 лет.
  rating: red
  verdict: Что Библия говорит о долгой жизни допотопных людей, верно. Но слоя воды над атмосферой физика не допускает, и даже креационистские организации от этой гипотезы отказались; Быт 1:7 о нём прямо не говорит.
  arguments:
  - vapor-canopy

- id: lecture-6-177
  start: 177.5
  end: 194.9
  text: Почти в каждой древней культуре есть легенды о золотом веке. Когда люди жили тысячу лет. В Библии говорится о 969 лет. И, конечно, легенды преувеличивают. Но было время, когда люди жили около тысячи лет. И допотопный мир. Был удивительно потрясающим.
  rating: purple
  verdict: Мы тоже верим Писанию, говорящему о долгой жизни патриархов; как понимать эти числа, христиане спорят. Но легенды о «золотом веке» есть у многих народов и сами по себе буквальных чисел не подтверждают.
  arguments:
  - genesis-literal

- id: lecture-6-196
  start: 196.8
  end: 225.8
  text: Но почему бы Бог уничтожил этот совершенный мир? Этот удивительный мир с огромными людьми, которые достигали трёхметрового размера. Мы говорим об этом на кассете Второй. Почему они были такими большими и жили так долго? И динозавры, и красивый эдемский сад. Весь мир Почему бы Бог уничтожил мир? И как это произошло? Почему вдруг мир был затоплен? Прекрасный мир, и Бог решает его уничтожить. Почему?
  rating: red
  verdict: О великанах Библия упоминает, но скелетов допотопных людей ростом три метра не найдено; древние люди по останкам были не выше нынешних.
  arguments:
  - giants

- id: lecture-6-226
  start: 226.5
  end: 267.5
  text: Бытие шесть увидел Господь, что велико развращение человеков на Земле и что все мысли и помышления сердца их были зло во всякое время. Прямо как сегодня, не правда ли? И раскаялся Господь, что создал человека на земле, и воскорбел в сердце Своём. И сказал Господь:«Истреблю с лица Земли человеков, ибо я раскаялся, что создал их». Но земля раслилась пред лицом Божьим, ибо всякая плоть извратила путь свой на земле,— говорит Библия. И сказал Бог Ною:«Сделай ковчег, потому что будет потоп». Бог решил уничтожить мир из-за человеческого зла. Мир должен был пострадать из-за человеческого непослушания.
  rating: neutral
  verdict: 'Пересказ шестой главы Бытия: Бог судит человеческое зло. Это мы тоже принимаем.'

- id: lecture-6-268
  start: 268.2
  end: 320.1
  text: Во Втором Петре говорится, что в последние дни явятся наглые ругатели, поступающие по собственным своим похотям и говорящие:«Где обетование пришествия Его? Ибо с тех пор, как стали умирать отцы от начала творения, всё остаётся так же». Думающие так не знают. Заметьте эту фразу. Думающие так не знают. На греческом это значит тупые по собственной воле. Ругатели не знают о двух вещах. Первое, как Бог сотворил небеса и землю, и они составлены из воды и водою. Мы говорим об этом на кассете второй— об оболочке воды. Ругатели не знают о сотворении. Также они не знают и о потопе. Потому тогдашний мир погиб, быв потоплен водою. Этот мир был полностью уничтожен потопом во дни Ноя.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил мир и что потоп при Ное был Божьим судом. Но Пётр обличает тех, кто отрицает Суд, а не христиан, по-разному понимающих размах потопа; это законный богословский спор.
  arguments:
  - local-flood

- id: lecture-6-321
  start: 321.0
  end: 375.9
  text: Ну почему Бог использовал потоп? Почему он не сделал чудо? Не сказал все, кроме Ноя, умрите. Он мог так сделать, правда? Тогда почему Бог использовал потоп? Потом потоп уничтожил всю недвижимость, не так ли? Он уничтожил дом Ноя. И так же все другие дома. Ну почему потоп? Есть несколько причин для этого. Во-первых, потоп оставил доказательства, в отличие от чуда. Во-вторых, результаты напоминают нам о наказании греха. И, в-третьих, с потопом людям было дано предупреждение и шанс для раскаяния. Бог сказал Ною строить ковчег. И кто не раскаялся, тогда уже было поздно. Это был явный знак Божьей милости. Божьей любви Его благодати. Он не хочет, чтобы кто погиб, но раскаялись,— говорит Библия.
  rating: purple
  verdict: Что потоп напоминает о суде над грехом и о долготерпении Бога, мы тоже верим. Но оставил ли он всемирный след в геологии — вопрос проверки, и уже геологи-христиане XIX века такого следа не нашли.
  arguments:
  - flood-geology-general

- id: lecture-6-377
  start: 377.2
  end: 420.4
  text: Итак Что причинило потоп? Мы поговорим об этом сегодня. Что такое теория одного материка? Кто слышал о том, что все континенты были одним большим материком? И что об этом говорит Библия? Упоминается ли в Библии о ледниковом периоде? Что заморозило мамонтов? Как сформировались горы и океаны? Мы поговорим об этом всём сегодня. Будет представлено много информации и представлено мировоззрение для объяснения, как потоп может объяснить то, То, что мы видим в мире сегодня. Почему мир внезапно был потоплен? Мог ли дождь затопить всю землю? И куда девалась вода? Это хороший вопрос. Где вода и где доказательства?
  rating: neutral
  verdict: 'План лекции: единый материк, ледниковый период, мамонты, горы и океаны, куда ушла вода.'

- id: lecture-6-422
  start: 422.3
  end: 449.4
  text: Теория одного материка. В школе учат, что все континенты были одним большим материком. В этом учебнике, например, говорится, что Южная Америка и Африка подходят друг к другу. Они говорят, что формы континентов подходят, и одинаковые ископаемые находятся на противоположных сторонах океана. И также вспомнят о магнитных линиях на Среднеатлантическом хребте. Это три доказательства в поддержку этой теории.
  rating: green
  verdict: 'Верно: форма берегов, одинаковые ископаемые по обе стороны океана и магнитные полосы на дне — действительно главные школьные доводы. Сегодня к ним добавились прямые измерения движения плит по спутникам.'

- id: lecture-6-450
  start: 450.4
  end: 479.9
  text: Но есть вещи, о которых они не говорят. Вот то, о чём они не говорят в школе. На рисунках Африка уменьшена на 40%. Также они не говорят, что на их карте нет Мексики и Центральной Америки. Посмотрите на эту карту и скажите мне, где Мексика? Панама. Коста-Рика Гватемала Гондурас, Белиз, Никарагуа. Где они? Их нет, не так ли?
  rating: red
  verdict: Реконструкции Пангеи совмещают материки по краю шельфа, а не по береговой линии, и Африку никто не уменьшает. Центральной Америки на них нет потому, что этот перешеек сложился гораздо позже.
  arguments:
  - continental-drift
  rhetoric:
  - appeal-to-doubt

- id: lecture-6-481
  start: 481.3
  end: 516.0
  text: Также они не говорят, что одни континенты были повёрнуты в одну сторону, а другие— в другую. Но континенты просто не поворачиваются. Также они не говорят, что если забрать воду из океанов То под ней Земля? Континенты— это не просто плавающие листы в ванне. Они все соединены. Вокруг Земли находится кора. И это правда, что на Земле есть трещины. Я был на некоторых трещинах, на сдвиге Сан-Адрея в Калифорнии, на дне Мадридской трещине. И также на других трещинах.
  rating: red
  verdict: Геологи и не говорят, что материки плавают, как листы в ванне. Движутся плиты литосферы вместе с дном океана, а повороты плит измерены по древней намагниченности пород.
  arguments:
  - continental-drift
  rhetoric:
  - straw-man

- id: lecture-6-517
  start: 517.5
  end: 525.8
  text: Ну, давайте посмотрим на эти доказательства с другой точки зрения. Учеников необходимо обучать. Давайте покажем им все стороны этой теории.
  rating: neutral
  verdict: Призыв показать ученикам все стороны теории. Проверять доводы с разных сторон — хорошая мысль; ниже смотрим, насколько честно это делает сам Ховинд.

- id: lecture-6-527
  start: 527.5
  end: 591.3
  text: В школе вам скажут, что на дне среднеатлантического хребта есть магнитные противоположности. Будьте осторожны. Так как это неправда. Магнитных противоположностей нет. Но в ваших учебниках вы увидите прямые линии так называемых переменных полярностей. Это неправда. Это просто обман. Специалисты скажут, что магнитные блоки коры не отражают реальности. Ничего такого не произошло. Что произошло, когда было проверено дно Среднеатлантического хребта, то были найдены места сильного и слабого магнетизма? Это не противоположности. Это изображено с помощью Синуседальной волны— сильный и слабый магнетизм. Ну, кто-то провёл линию посреди кривой и сказал, что всё под линией противоположно. И это просто неправда. Потому что линия должна быть вот здесь. Магнитных противоположностей на дне океана нет, есть только места слабого и сильного магнетизма.
  rating: red
  verdict: 'Что на дне есть полосы сильного и слабого магнетизма, верно. Но это и есть след смены полюсов: в одних полосах породы намагничены по нынешнему полю, в других — против него, и слово «обман» этого не отменяет.'
  arguments:
  - magnetic-field
  rhetoric:
  - loaded-language

- id: lecture-6-592
  start: 592.0
  end: 631.1
  text: В Бытие 7 сказано, что разверзлись все источники Великой бездны, и окна небесные отворились. Я думаю, что причиной магнитных аномалий были источники бездны. В Библии сказано, что было много воды под земной корой. Когда вода била из-под земли, то земная кора треснула. И верхняя кора начала раздвигаться, образовывая трещину. При поднятии воды трещина расширялась, при этом раздвигая континенты. При расхождении континента внутренний слой поднялся. И этот слой называется базальт. И при поднятии базальта в нём образовывались трещины, в которые попадала вода.
  rating: red
  verdict: Мы тоже читаем, что «разверзлись все источники великой бездны». Но слоя воды под корой, который мог бы раздвинуть материки за год, сейсмология не находит, и Быт 7:11 о механике коры не говорит.
  arguments:
  - hydroplates

- id: lecture-6-632
  start: 632.8
  end: 670.8
  text: У базальта есть интересное свойство. Если базальт очень горячий, он не сохраняет сильных магнитных способностей. А при охлаждении он сохраняет сильные магнитные способности. И в Среднеатлантическом океане были измерены места трещин. Сильный и слабый магнетизм— не противоположностей. Там нет противоположностей. Нет такого места на океанском дне, где бы компас вместо севера показал на юг. Это просто неправда. Не верьте этому. На Земле есть трещины, это не вопрос. Но это не произошло на протяжении миллионов лет. Это, наверное, произошло во время потопа.
  rating: red
  verdict: 'Что горячий базальт не хранит намагниченности, а остывая, запоминает поле, верно. Но компас показывает нынешнее поле, а инверсию измеряют в самом камне: в половине полос его намагниченность направлена на юг.'
  arguments:
  - magnetic-field
  rhetoric:
  - podmena-ponyatij

- id: lecture-6-671
  start: 671.3
  end: 712.8
  text: Также в учебниках говорится, что морское дно рециркулируется. Это также важная часть теории одного материка. На дне океана нет достаточного накопления осадков для миллиардов лет. Когда идёт дождь, осадки смываются в океаны. Но накопление осадков в океане свидетельствует о нескольких тысячах лет эрозии. Это представляет смущающую проблему. Если Земле миллиарды лет, почему в океанах нет больше осадков? И поэтому была придумана теория одного материка и рециркуляции морского дна. Чтобы ответить на вопрос:«Где пропавшие осадки?» Они скажут, осадки рециркулируются. Я так не думаю.
  rating: red
  verdict: 'Осадков на дне мало потому, что само дно молодое: его возраст не больше примерно 180 млн лет, и старое дно уходит под материки. Тектонику плит открыли по магнитным полосам и землетрясениям, а не ради «пропавших осадков».'
  arguments:
  - young-earth-clocks

- id: lecture-6-713
  start: 713.7
  end: 741.0
  text: В учебниках говорится, что континенты двигаются со скоростью роста ногтя. И это не очень быстро. Этому нет положительного доказательства. Может, континенты и двигаются. Однако настоящее движение плит не доказывает, что плиты двигались всегда Также не доказывает, что скорость была всегда одинаковая, и студентов нужно учить и другим предположениям. которые существуют
  rating: orange
  verdict: Что нынешняя скорость сама по себе не доказывает прошлую, верно. Но движение плит измерено спутниками, а о прошлом говорят возраст дна и магнитные полосы; «доказательств нет» — неправда.
  arguments:
  - continental-drift

- id: lecture-6-742
  start: 742.0
  end: 774.7
  text: Я живу в нескольких километрах от десятой трассы в Пенсаколе. Вот здесь. Эта дорога проходит от Лос-Анджелеса до Джексон Вилла. Если я увижу машину, едущую по дороге на восток со скоростью 70 км/ч Доказывает ли это, что машина выехала из Лос-Анджелеса четыре дня назад? Нет. Может, она только въехала на дорогу? И движение континентов не доказывает, что они двигались всегда. Может, это началось после потопа?
  rating: orange
  verdict: 'Пример с машиной честен в одном: по одной скорости путь не восстановить. Но у материков есть «одометр» — возраст дна растёт от хребта к краям, а цепочки вулканов вроде Гавайских отмечают путь плиты.'
  arguments:
  - continental-drift
  rhetoric:
  - false-analogy

- id: lecture-6-776
  start: 776.4
  end: 817.9
  text: Теория континентального дрейфа очень важна для эволюционистов, потому что они стараются избежать две проблемы. Первое— магнитное поле Земли слабеет, указывая на возраст Земли в меньше, чем 25 000 лет. И для ответа они придумали оборотные изменения магнетизма, но это не так. Не верьте этому. Фактом является то, что Земле нет миллионов лет. Вторая. Мало осадков в океанах указывает на несколько тысяч лет накопление. Вот почему детей учат теории одного материка и континентальному дрейфу. Не потому, что теории обоснованы, но потому, что они помогают им верить, что Земле миллиарды лет.
  rating: red
  verdict: Мысль о дрейфе материков высказал Вегенер в 1912 году, задолго до спора о возрасте поля, а обратную намагниченность лав нашли на суше. Приписывать геологам скрытый мотив — не значит опровергнуть их данные.
  arguments:
  - science-conspiracy

- id: lecture-6-820
  start: 820.7
  end: 841.1
  text: Как насчёт ледникового периода? Был ли такой период? Доходил лёд до Мисури? Да, ледниковый период имел место в истории. Говорится ли о нём в Библии? И что заморозило мамонтов? Эти большие животные найдены замороженными в стоячем положении. И с непереваренной пищей в их желудках.
  rating: orange
  verdict: Что ледниковый период был и лёд доходил до Миссури, верно. Но мёрзлых туш мамонтов найдено немного, «стоя» ни одна не замёрзла, а пища в желудке у некоторых — обычное дело для быстрой гибели.
  arguments:
  - mammoths-frozen

- id: lecture-6-842
  start: 842.7
  end: 870.3
  text: Что же случилось с мамонтами? Мне стало интересно. Я слышал, что за один год было найдено 20 000 пар бивней. Никто не знает, сколько мамонтов погибло. Многие специалисты утверждают, что в полярных регионах погибло около 5 млн мамонтов. Их находят даже во Флориде. В окаменев виде, конечно Но в регионах Северного полюса некоторые до сих пор заморожены.
  rating: orange
  verdict: Останков мамонтов действительно очень много. Но почти всё это кости и бивни, а не замороженные туши, и по радиоуглероду они разного возраста — гибель растянута на десятки тысяч лет.
  arguments:
  - mammoths-frozen
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-872
  start: 872.4
  end: 899.6
  text: Вы слышали по новостям, что был найден неповреждённый замороженный мамонт? И происходят попытки по извлечению ДНК для попытки клонирования. Это было бы интересно. Не доказала бы эволюцию, но было бы интересно. Так как насчёт мамонтов? Они найдены в Сибири, в Аляске. Что случилось с мамонтами? Некоторые мамонты заморожены стоя. Не все Непереваренная пища в желудке.
  rating: neutral
  verdict: Новость о попытках клонировать мамонта и повтор вопроса о мамонтах (разбор на 13:40).

- id: lecture-6-901
  start: 901.5
  end: 920.5
  text: Они задохнулись, в лёгких нет воды. Не верьте, если кто скажет, что они утонули. Это неправда. Если вы попадаете в воду, вы не замерзаете в твёрдый блок льда. Это берёт время. Температура может быть-50°C, но подо льдом 0°C. Поэтому они не могли замёрзнуть.
  rating: red
  verdict: 'Как погибли отдельные мамонты, изучают по каждой находке: одни увязли в болоте или иле, другие провалились. Найденные туши часто частично разложились и обглоданы, то есть мгновенно не замерзали.'
  arguments:
  - mammoths-frozen

- id: lecture-6-922
  start: 922.1
  end: 935.3
  text: Маленькие кристаллы льда в крови указывают, что они замёрзли меньше, чем 5 часов. При медленном замерзании кристаллы были бы больше. Как можно заморозить слона в меньше чем 5 часов?
  rating: red
  verdict: Исследования «кристаллов льда в крови мамонта», показавших заморозку за 5 часов, Ховинд не называет. Мясо найденных туш обычно несёт следы гниения, а это говорит о медленном промерзании.
  arguments:
  - mammoths-frozen
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-935
  start: 935.9
  end: 967.7
  text: Мне стало интересно. И когда я чего-то не знаю... Я им Обычно задаю вопросы. Я хотел узнать, за сколько времени можно заморозить слона. Как-то раз я позвонил в отдел замороженных продуктов в Нью-Йорке. Я позвонил туда. Я спросил. Что произойдёт, если я поставлю слона в холодильник? Несколько минут на другом конце была тишина. Потом он сказал:«У вас будет наполненный холодильник».
  rating: neutral
  verdict: Шутливый рассказ о звонке в отдел замороженных продуктов; подводка к следующему доводу.
  rhetoric:
  - personal-story

- id: lecture-6-968
  start: 968.9
  end: 1002.4
  text: Я сказал:"Да, я знаю, но сколько займёт времени, чтобы заморозить слона? Он сказал, что за 24 часа замораживается 30 см мяса. Если вы поставите слона в холодильник, то внешняя часть заморозится, тепло останется внутри, и внутренняя часть сгниёт. Находясь внутри замороженной оболочки. Я сказал:"Нет, это не подойдёт". Мне нужно заморозить слона, чтобы пища в его желудке была свежей. Так как после его смерти кислота в желудке будет продолжать работать, поэтому мне надо заморозить его за 5 часов.
  rating: orange
  verdict: 'Что большая туша промерзает медленно и изнутри гниёт, верно. Но так и было: туши мамонтов несут следы разложения, а пища в желудке не была «свежей», поэтому заморозка за 5 часов не нужна.'
  arguments:
  - mammoths-frozen
  rhetoric:
  - personal-story

- id: lecture-6-1004
  start: 1004.7
  end: 1041.8
  text: Я звонил многим людям из мясохладобойной промышленности. И единодушным ответом было то, что если вы хотите заморозить мамонтов меньше, чем 5 часов Это произойдёт при-185°C по Цельсию. или жидким азоте Но на Земле такой температуры не бывает. Соответственно национальному географическому журналу, самая холодная температура на Земле достигла-88°C. Это холодно. Но недостаточно, чтобы заморозить мамонтов. Где можно найти 185° ниже нуля?
  rating: red
  verdict: 'Что самый сильный мороз на Земле около −89 °C, верно. Но −185 °C требуется только для задачи, которой не было: мамонтов не замораживали мгновенно, их засыпало и сковало вечной мерзлотой.'
  arguments:
  - mammoths-frozen
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-1042
  start: 1042.4
  end: 1073.7
  text: Сегодня я вам представлю теорию Ховинда. О том, как я думаю, что произошло. Я отдаю должное многим людям, я прочитал много книг с разными мнениями о причинах потопа. Я постарался сложить всё это вместе в теорию, которая имеет смысл для меня. Может, у вас другая теория, но так как это уже произошедшее историческое событие Мы ничего не можем доказать. Мы соберём информацию в теорию и проверим, имеет ли она смысл. Давайте сегодня мы посмотрим на теорию Ховинда. Но перед этим я хочу сделать краткий обзор науки.
  rating: orange
  verdict: Что прошлое нельзя повторить, верно. Но его проверяют по следам, как следствие без свидетелей; мерить теорию только тем, «имеет ли она смысл», значит снять с неё всякую проверку.
  arguments:
  - past-not-observable

- id: lecture-6-1074
  start: 1074.7
  end: 1105.7
  text: В физике есть закон обратной пропорциональности. в котором говорится, что если два предмета влекомы друг к другу Как два магнита или планеты. То сила притяжения между двумя объектами обратно пропорциональна квадрату расстояния между ними. При сокращении расстояния пополам. Сила притяжения увеличивается в четыре раза. Земля и Луна притягиваются к гравитации. И если Луна приблизится к Земле в три раза, Сила притяжения увеличивается в девять раз.
  rating: green
  verdict: 'Верно: сила тяготения убывает обратно квадрату расстояния; вдвое ближе — вчетверо сильнее.'

- id: lecture-6-1106
  start: 1106.9
  end: 1155.2
  text: 'Этот закон можно применить к разным вещам. Его можно применить к гравитации. К свету, к магнетизму и к девушкам. При половине расстояния притяжение увеличивается в четыре раза. Я путешествую каждую неделю. Я был дома пять воскресенье за последние 10 лет. Я много путешествую. Что значит, что я приезжаю домой каждую неделю? И когда я в десяти шагах от моей жены, это как:«Привет, дорогая, как дела?» При половине расстояния это как:«Вау, ты выглядишь красиво, дорогая!» Если сократить расстояние ещё наполовину, уже поздно. Секрет: находитесь на расстоянии, и будет меньше проблем.'
  rating: neutral
  verdict: Шутка о жене и законе обратных квадратов.

- id: lecture-6-1157
  start: 1157.0
  end: 1183.9
  text: Следующая вещь для запоминания. Особенности вращающейся поверхности. При столкновении с вращающейся поверхностью поверхность начинает качать и потом вращается ровно под новым углом. И при качании поверхность. Следует предсказуемому образцу. Можно даже определить, когда произошло столкновение. Начертив кривую колебаний по отношению ко времени. Хм, интересно.
  rating: green
  verdict: 'В общих чертах верно: вращающееся тело после удара раскачивается по предсказуемому закону. Как Ховинд применяет это к Земле, разобрано ниже.'

- id: lecture-6-1185
  start: 1185.5
  end: 1206.6
  text: Очевидно, Земля тоже колебалась. Множество измерений и указателей показывают, что Земля колебалась в своей истории. Но что причинило эти колебания? Стаунхэндж, очевидно, был точкой наблюдения за солнцем. построенный для наблюдения Солнца во время солнцестояния Но сегодня это невозможно.
  rating: red
  verdict: 'Стоунхендж и сегодня показывает солнцестояние: каждый год люди собираются там встречать рассвет 21 июня. Наклон земной оси меняется медленно и предсказуемо, на доли градуса за тысячи лет.'
  arguments:
  - ice-meteor-flood

- id: lecture-6-1207
  start: 1207.2
  end: 1247.4
  text: А Менра тоже был построен для наблюдения за солнцем. Известный австралийский астроном Джордж Додвилл собрал информацию из солнечных наблюдений. И пришёл к выводу, что что-то столкнулось с Землёй и было причиной колебаний Земли. Земля качалась около тысячи лет и потом стабилизировалась. И сегодня Земля находится под наклоном в 23,5°. Додвил собрал эту информацию из древних наблюдений за летним солнцестоянием. самой северной точкой Солнца от Экватора. Обычно 20-е или 21 июня. Чаща двадцать первая. Додвил сказал, что составленная им кривая показала, что Земля колебалась.
  rating: red
  verdict: Додвелл был настоящим астрономом, но его вывод о «качании» Земли не опубликован в научных журналах и не принят. Разброс древних измерений объясняют их неточностью, а мальтийская Мнайдра и сегодня ловит солнце в равноденствие.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1248
  start: 1248.5
  end: 1276.0
  text: Замечу, что кривая на его графике точно похожа на кривую крутящегося объекта после удара. Он предположил, что что-то столкнулось с Землёй около 450 лет назад. 4 350 лет назад Это время библейского потопа. Что же произошло? Могло ли столкновение с Землёй быть причиной потопа? Это часть теории о причинах потопа во дни Ноя.
  rating: red
  verdict: Дату удара Додвелл подогнал под библейскую хронологию; независимых следов удара 4350 лет назад нет. Совпадение кривой с «кривой после удара» — впечатление Ховинда, а не расчёт.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1277
  start: 1277.7
  end: 1303.0
  text: Сегодня Земля под наклоном, что является причиной сезонов, и впервые холодная погода упоминается после потопа в Бытие 8. Если бы земля не была наклонена, то всё время была бы весенняя погода. Было бы немного холоднее на полюсах и теплее на экваторе. Ну, в основном весна была бы целый год. Очень возможно, что раньше Земля не находилась под наклоном.
  rating: red
  verdict: Что смена времён года вызвана наклоном оси, верно. Но уже в Быт 1:14 светила даны «для времён», а первое упоминание холода не значит, что его не было; следов «вечной весны» без наклона нет.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1305
  start: 1305.2
  end: 1322.9
  text: 'Ещё одно обстоятельство: на Луне есть кратеры, но они расположены неравномерно. Если бы Луна находилась под ударами метеоритов на протяжении миллиардов лет Краторы были бы расположены равномерно. Но это не так. То же самое на Меркурии. Краторы расположены неравномерно.'
  rating: red
  verdict: 'Кратеры неравномерны потому, что часть поверхности позже залили лавы: тёмные «моря» Луны моложе и почти без кратеров. Именно по плотности кратеров учёные и сравнивают возраст участков.'
  arguments:
  - ice-meteor-flood

- id: lecture-6-1324
  start: 1324.4
  end: 1352.3
  text: Что же произошло? На Марсе есть каньоны больше великого каньона. Ну, на Марсе почти нет воды. Тогда как это возможно? Очевидно то, что образовало каньоны Пропала. Там нет больших океанов. Что произошло и сформировало кратеры и каньоны на планетах? Мы поговорим об этом в теории Ховинда.
  rating: orange
  verdict: Что на Марсе есть каньон больше Большого, верно. Но долина Маринер — в основном разлом коры, а русла древних потоков говорят о воде, которая сейчас лежит льдом в полярных шапках и под грунтом.
  arguments:
  - ice-meteor-flood
  rhetoric:
  - appeal-to-doubt

- id: lecture-6-1352
  start: 1352.6
  end: 1364.6
  text: Ещё одно обстоятельство— эффект Майзнера. Наблюдается, когда магнит не может соприкоснуться с другим магнитом. Вы знаете, о чём я говорю. И это называется эффектом Мазнера.
  rating: red
  verdict: Эффект Мейснера — не отталкивание двух магнитов, а вытеснение магнитного поля сверхпроводником, охлаждённым почти до абсолютного нуля. Ниже на этой ошибке держится довод о «водяной оболочке».
  arguments:
  - vapor-canopy

- id: lecture-6-1366
  start: 1366.5
  end: 1381.5
  text: Следующее. По космосу летают кометы. которые чрезвычайно холодные Часто их температура достигает до 200—240° ниже нуля. Их нельзя лизать.
  rating: green
  verdict: 'Верно: ядра комет вдали от Солнца очень холодные, около −200 °C и ниже.'

- id: lecture-6-1384
  start: 1384.8
  end: 1413.8
  text: Я хочу узнать, были ли вы глупы, как я в детстве. У кого кусок языка остался примороженным к чему-то во время зимы? Как-то старший брат сказал мне Я спорю, ты не сможешь облизать эту железку. Был январь. 20° мороза. Я сказал:«Ты уверен? Я смогу». Э Еле дождёшься, пока кто-то не польёт язык водой.
  rating: neutral
  verdict: Детская история о языке, примёрзшем к железу.

- id: lecture-6-1415
  start: 1415.7
  end: 1428.5
  text: Холодные объекты существуют в космосе. Минус 200°. Это достаточно холодно, чтобы заморозить мамонтов. Нормального холода в-88°C недостаточно.
  rating: red
  verdict: Лёд из космоса, падая сквозь атмосферу, сильно нагревается, а снег при −185 °C у поверхности быстро согрелся бы. Заморозить им мамонтов нельзя, да и мгновенной заморозки, как показано выше, не было.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1429
  start: 1429.6
  end: 1445.9
  text: Ещё одна вещь. Если вы бросите снежок резко То он распадётся в воздухе. И снежком нельзя выстрелить из пушки, он мгновенно распадётся. Есть определённая скорость. после которой снежок распадается
  rating: orange
  verdict: 'Что рыхлый снежок разлетается от сопротивления воздуха, верно. Но в космосе воздуха нет: ледяное тело там разрушают приливные силы планеты, и к снежку из пушки это мало относится.'
  arguments:
  - ice-meteor-flood

- id: lecture-6-1448
  start: 1448.5
  end: 1471.6
  text: Следующая вещь. На Земле есть магнитное поле, которое является причиной северного сияния. Большинство частиц солнечной энергии притягиваются к полюсам. Кто видел Северное сияние? Я видел северное сияние несколько раз. Это великолепно, когда небо загорается На Северное сияние стоит посмотреть.
  rating: green
  verdict: 'Верно: магнитное поле Земли направляет заряженные частицы Солнца к полярным областям, и там возникает полярное сияние.'

- id: lecture-6-1473
  start: 1473.2
  end: 1495.7
  text: 'Ещё одна вещь: допотопный мир отличался от сегодняшнего мира. Библия учит, что вода была над атмосферой. Наверное, с Ноль, да? Поддерживаемый эффектом Майзнера. Это упоминается в Бытие 1.7; во Втором Петра 3 и в Псалме 148— вода над атмосферой. Земля многим отличалась.'
  rating: red
  verdict: Мы тоже читаем о «водах над твердью» (Быт 1:7). Но эффект Мейснера бывает только у сверхпроводников при сильном холоде, и удержать им воду над атмосферой нельзя; многие толкователи видят здесь древний образ неба.
  arguments:
  - vapor-canopy

- id: lecture-6-1496
  start: 1496.3
  end: 1533.9
  text: Следующая вещь. В Библии упоминается человек по имени Фалик. Кем был Фалик? Читая бытие десять Мне не хочется этого говорить. Но бытие 10— это скучная глава. В ней находится множество имён, которые почти невозможно произнести. Тот родил того, и тот родил того, и так далее. И когда вы читаете эту главу, стараясь выполнять свой ежедневный долг Вы прочитайте стих двадцать пятый, в котором написано, что у Евера родились два сына. Имя одному Фалик. Потому что во дни его Земля разделена.
  rating: neutral
  verdict: Пересказ Быт 10:25 о Фалеке, «потому что во дни его земля разделена».

- id: lecture-6-1535
  start: 1535.6
  end: 1563.6
  text: Здесь мы первый раз видим примечание об одном из этих людей. Почему здесь написано, что во дни его земля разделена? Потом написано, что имя брата его— Иоктан. Что значит сокращение? Фалик— значит разделённый, и октан— значит сокращение. Что же произошло во дни Фалика? Мы говорим об этом в теории Ховинда, о том, что я думаю, произошло во дни Фаллика. Разделив и сократив Как сказано в Библии.
  rating: purple
  verdict: Мы тоже принимаем Быт 10:25 как Слово Божье. Но большинство толкователей связывают «разделение земли» с разделением народов после Вавилонской башни, а не с расколом материков; это законный богословский спор.
  arguments:
  - continental-drift

- id: lecture-6-1564
  start: 1564.5
  end: 1589.7
  text: Следующая вещь. В допотопном мире был слой воды под земной корой. В псалме 135 написано:«Утвердил землю на водах». Под земной корой было намного больше воды. Очевидно, она прорвалась наружу во время потопа и всех потопила. Большая часть воды не появилась от сорокадневного дождя. Она поднялась из-под земли. Из подземных водохранилищ
  rating: red
  verdict: 'Слова «утвердил землю на водах» (Пс 135:6) — поэтический образ. Под корой лежит твёрдая мантия: это видно по сейсмическим волнам, а сплошного подземного океана, способного затопить Землю, там нет.'
  arguments:
  - hydroplates

- id: lecture-6-1591
  start: 1591.9
  end: 1687.1
  text: Ещё одна вещь. Возможны два взгляда на вещи. С какой скоростью бежал тот телёнок, если вы помните четвёртую кассету? Сегодня мы представим вам теорию Ховинда о том, что произошло причиной всемирного потопа. Я принял здравое решение, что я буду верить Библии, пока не будет доказано, что Библия неверна. Некоторые мои знакомые решили, что они не будут верить Библии. Пока не будет доказано, что Библия верна. Как-то раз атеист подошёл к проповеднику И он сказал:«Я не верю ничему в Библии». Проповедник сказал:«Вы не верите?» Он сказал:"Нет, я не верю ничему. Вы должны её доказать. Если вы не докажете научно. Я не поверю. Он сказал проповедник:«Если вы научно докажете хоть один стих...» То я поверю в Библию. Проповедник сказал Хорошо? Он схватил атеиста за шею, схватил его нос и начал крутить его из стороны в сторону. Через некоторое время у атеиста потекла кровь, и он сказал:«Что вы делаете?» Проповедник сказал:"О, я доказываю Библию, написано, что толчок в нос производит кровь". Тристи. Притчи 30:3. Я не рекомендую, чтобы вы это повторили, но так написано. Вот что я сделаю сегодня. Я расскажу вам, о чём я буду говорить, потом представлю теорию, и потом мы закончим и разойдёмся. Значит, сначала я расскажу вам, о чём я буду говорить, представлю теорию и потом повторю её. Говорят, это хорошая техника обучения. Краткий обзор. Восемь пунктов теории Ховинда.
  rating: neutral
  verdict: Переход к «теории Ховинда», решение верить Библии и анекдот об атеисте и проповеднике. Мы тоже доверяем Писанию; вопрос в том, как его читать, а не в доверии.

- id: lecture-6-1689
  start: 1689.7
  end: 1702.0
  text: Первая Ной и семья находились в безопасности в ковчеге. Второе, ледяной метеор пролетал по солнечной системе. Он рассыпался и оставил кратеры и кольца вокруг некоторых планет.
  rating: red
  verdict: Что Бог сохранил Ноя в ковчеге, мы читаем в Библии. Но следов ледяного метеора 4350 лет назад нет, а кольца и кратеры планет по многим признакам гораздо старше.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1703
  start: 1703.4
  end: 1715.1
  text: При приближении к Земле метеор рассыпался из-за закона обратной пропорциональности и увеличения скорости И большая часть ледяных фрагментов была притянута к полюсам из-за сильного магнитного поля Земли.
  rating: red
  verdict: 'Лёд не притягивается магнитом: он слабо отталкивается от поля (диамагнетик). Поэтому магнитное поле Земли не могло стянуть ледяные обломки к полюсам.'
  arguments:
  - ice-meteor-flood

- id: lecture-6-1717
  start: 1717.4
  end: 1739.6
  text: 'Четвёртое. Внезапное накопление льда на полюсах было причиной трескания земной коры, что открыло источники Великой бездны, заставило Землю колебаться на протяжении тысячи лет. И содействовала разрушению допотопной оболочки. Всё это полностью затопило мир. Вода появилась из трёх источников: из-под коры. От дождя. И от тающего льда.'
  rating: red
  verdict: Мы тоже верим в потоп как Божий суд. Но ни треснувшей за день коры, ни «качания» Земли тысячу лет, ни разрушенной водяной оболочки геология не видит; это цепочка догадок, а не наблюдений.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1740
  start: 1740.6
  end: 1761.9
  text: Пятое. В течение первых месяцев потопа мёртвые животные осели в бурлящей воде. Образовывая громадные залежи ископаемых. Также накопления растений превращались в уголь под давлением. Образовуя залежи ископаемых и угля, сформированных потопом.
  rating: red
  verdict: Пласты угля несут корни на месте роста и почвы под ними, а ископаемые лежат в постоянном порядке по слоям. Месяц бурлящей воды такой картины не даёт.
  arguments:
  - fossil-fuels-flood

- id: lecture-6-1762
  start: 1762.7
  end: 1786.5
  text: Шестое. В течение последних месяцев потопа нестабильные плиты треснувшейся Земли начали перемещаться и наклоняться. Плиты размером как Техас или как вся Америка? При наклонении одна сторона поднимается, а другая опускается. И бурлящая вода образовала большой каньон. За несколько часов. Напор воды в мягких осадках.
  rating: red
  verdict: Большой каньон вырезан в твёрдых породах, где лежат и следы пустынных дюн, и окаменелые почвы. Размыть такие слои за несколько часов вода не может.
  arguments:
  - grand-canyon-flood

- id: lecture-6-1787
  start: 1787.4
  end: 1807.3
  text: 'Седьмое. На протяжении нескольких сот лет шапки полярного льда медленно таяли, поднимая уровень океанов. Делай глубже, холоднее и шире. И этим разделяет Землю на континенты. И восьмое: на Земле до сих пор видны эффекты этого ужасного потопа. который уничтожил мир Вот это и есть теория Ховинда.'
  rating: red
  verdict: 'Что после оледенения море поднялось и разделило сухопутные мосты, верно. Но материки разошлись не от таяния льда: океаны лежат на другой, тонкой коре, и их дно раздвигается миллионы лет.'
  arguments:
  - ice-age

- id: lecture-6-1808
  start: 1808.4
  end: 1889.4
  text: Но и с семьёй находились в ковчеге. Бытие семь. И сказал Господь Ною:«Войди ты». Остановимся. Бог мне сказал ною. Пойди в ковчег. Правда? Он сказал:«Войди в ковчег». Скажите мне, где должен быть Бог, чтобы так сказать? В ковчеге. Таких мест в Библии много. Придите ко мне все труждающиеся и обределённые и обременённые, и я успокою вас. Тогда придите и рассудим,— говорит Господь. Я думаю, вам нужно изучить такие стихи и прийти к Иисусу, если вы не спасены. Он любит вас, он хочет вас спасти. Легко и прекрасно служить Господу в этой жизни. Просто придите к нему с вашими проблемами, и он их разрешит. И сказал Господь:«Войди в ковчег, и животные вошли по паре от рода, и некоторые по сем». И затворил Господь за ними. Это вечная безопасность, когда Бог закрывает дверь. То она протекать не будет. Меня спрашивают Вы верите, что вы находитесь под вечной охраной? Да, я родился в семье Бога. И он вечно со мной. Некоторых своих детей он берёт домой и возлагает венец. Ну, если вы божьи дети, вы в вечной безопасности. Вы идёте на небо.
  rating: neutral
  verdict: 'Проповедническое отступление: «войди в ковчег», призыв прийти к Иисусу и мысль о вечной безопасности спасённых. О последнем христиане разных церквей спорят; к науке эта часть не относится.'

- id: lecture-6-1890
  start: 1890.1
  end: 1916.8
  text: Что случилось? Ледяной метеор пролетел по солнечной системе и начал рассыпаться. Фрагменты начали ударяться в планеты. Куски льда ударяли Марс. На Марсе днём очень жарко, и лёд начал таять на Марсе. Этим создавая наводнение. Но потом вода испарилась. Исчезла. Пропала в космосе. И эти наводнения на Марсе сформировали каньоны примерно в то же время, что и на Земле.
  rating: red
  verdict: Каньоны и русла Марса по числу кратеров на их дне древние, сотни миллионов лет и больше. Связывать их с потопом на Земле нечем.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1918
  start: 1918.0
  end: 1943.9
  text: Так как эта катастрофа подействовала на всю Солнечную систему. Некоторые фрагменты были задержаны гравитационным потоком планет и стали спутниками этих планет. По меньшей мере вокруг четырёх планет находятся ледяные кольца. Откуда появился этот материал? Кольца вокруг планет состоят из камня и льда. Интересно. Это могло произойти во время потопа.
  rating: red
  verdict: Кольца есть у всех четырёх планет-гигантов, это верно. Но захватить спутник непросто, кольца у разных планет разного состава и возраста, и следов одного ледяного метеора на всех сразу нет.
  arguments:
  - ice-meteor-flood
  rhetoric:
  - appeal-to-doubt

- id: lecture-6-1944
  start: 1944.5
  end: 1968.3
  text: Третья. При приближении метеора или фрагмента метеора к Земле или Земля прошла через хвост метеора Независимо от этого, я думаю, что большое количество льда было притянуто на северный и Южный полюса. Магнитным полем Земли. Очень холодный лёд, немного намагничен. И легко статически заряжается. Эти два фактора могут объяснить причину притягивания льда на полюса.
  rating: red
  verdict: 'Лёд не намагничен: он диамагнетик и слабо отталкивается от магнита. Статический заряд тоже не притянет глыбы к полюсам.'
  arguments:
  - ice-meteor-flood

- id: lecture-6-1970
  start: 1970.9
  end: 1992.2
  text: Пролетая по космосу, метеор распался, и фрагменты в основном упали на полюса. Что заставило Землю качаться несколько тысяч лет спустя? Здесь присутствуют крутящийся объект и тяжёлая масса льда, производя эффект качания. Пролетая по космосу, метеор распался, и масса льда заставила Землю качаться.
  rating: red
  verdict: Тяжёлая шапка льда действительно меняет вращение Земли, но на доли секунды и сантиметры смещения полюса. «Качания» на тысячу лет она не вызывает.
  arguments:
  - ice-meteor-flood

- id: lecture-6-1994
  start: 1994.7
  end: 2008.4
  text: И когда у вас есть лёд в-185°C, вы заморозите мамонтов в стоячем положении. Из-за внезапного накопления льда земная кора потрескалась. Разверзая источники Великой бездны, из которых била вода. Покрыв всю землю.
  rating: red
  verdict: 'Мамонты не замерзали стоя: тела находят в иле, болотных и речных отложениях, часто частично разложившимися. Лёд при −185 °C у поверхности Земли продержаться не мог бы.'
  arguments:
  - mammoths-frozen

- id: lecture-6-2010
  start: 2010.2
  end: 2017.0
  text: На Северном полюсе найдены замороженные рыси, верблюды. Ну, верблюды не живут на Северном полюсе.
  rating: red
  verdict: Верблюдов в Арктике действительно находили, но ископаемые кости (остров Элсмир), которым около 3,5 млн лет, а не замороженные туши. Тогда климат Арктики был теплее.
  arguments:
  - mammoths-frozen

- id: lecture-6-2017
  start: 2017.8
  end: 2047.0
  text: Там найдены не только замороженные животные, там найдены странные вещи. И странно, и часто буря буря сквозь лёд там находят уголь. Но уголь состоит из растений. На этой карте показано местонахожение шахты, добывающей антроцитовый уголь. Но так как уголь состоит из растений, А на Антарктике нет растений? Появляется проблема. Как появился уголь на Антарктике?
  rating: orange
  verdict: 'Уголь в Антарктиде действительно есть. Это не загадка: сотни миллионов лет назад там был тёплый климат и росли леса, это видно по их отпечаткам и почвам в тех же слоях.'
  rhetoric:
  - appeal-to-doubt

- id: lecture-6-2048
  start: 2048.2
  end: 2062.1
  text: Адмирал Берт сообщил, что он видел пальмовые деревья подо льдом на Южном полюсе. Но пальмы не растут возле Южного полюса. Они даже не растут в Северной Флориде, потому что там очень холодно для пальм.
  rating: red
  verdict: В отчётах адмирала Бёрда нет пальм подо льдом Южного полюса; этот рассказ ходит без источника. Ископаемые растения в Антарктиде есть, но это древние отложения, а не пальмы под нынешним льдом.
  rhetoric:
  - unverified-quote

- id: lecture-6-2064
  start: 2064.6
  end: 2091.5
  text: Найдены тысячи ископаемых динозавров в 640 км от Южного полюса. Динозавры питаются травой. Большинство из них Тысячи хорошо сохранившихся листьев найдены в Антарктиде. Соответственно этой статье, 400 км от Южного полюса. Тысячи и тысячи листьев, сохранивших первоначальную клеточную структуру. Они сдавлены в слои.
  rating: orange
  verdict: Динозавры и ископаемые листья в Антарктиде действительно найдены. Но это говорит о том, что миллионы лет назад там было тепло, а не о внезапной катастрофе; «тысячи динозавров» — преувеличение.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-2093
  start: 2093.7
  end: 2112.7
  text: Один учёный выдвинул теорию и считает, что в Землю до сих пор ударяются ледяные метеоры. Кстати, несколько лет назад было замечено Что куски льда размером как дома врезаются в землю каждый день. Фрагменты льда до сих пор летают по космосу. При столкновении с атмосферой они испаряются и попадают на Землю в виде воды.
  rating: orange
  verdict: Гипотезу о «малых кометах» размером с дом, падающих каждый день, в 1980-е выдвинул физик Луис Фрэнк. Её проверяли и не подтвердили, а Ховинд подаёт её как наблюдение.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-2113
  start: 2113.1
  end: 2136.6
  text: Посмотрев на Землю, вы увидите, что на ней два северных полюса. Настоящий Северный полюс и магнитный Северный полюс. Ваш компас показывает на магнитный Северный полюс, и здесь в мисуре нет проблем. Но в Аляске есть немаленькая разница между настоящим и магнитным Севером. И вам нужно учитывать это. Особенно, если вы пилот. Это очень важно.
  rating: green
  verdict: 'Верно: географический и магнитный северные полюса не совпадают, и лётчики это учитывают.'

- id: lecture-6-2137
  start: 2137.6
  end: 2143.6
  text: Выглядит, что ледниковый период сконцентрирован вокруг магнитного Северного полюса. Я думаю, вот что произошло.
  rating: red
  verdict: Ледниковые щиты лежали в Канаде, Скандинавии и Антарктиде, а не вокруг одного магнитного полюса, который к тому же постоянно смещается. Лёд магнитом не притягивается.
  arguments:
  - ice-age

- id: lecture-6-2143
  start: 2143.7
  end: 2180.2
  text: Мамонты едят тропические растения. Прекрасный день Вдруг пошёл снег. Они никогда не видели снега. Один из них сказал:«Какая-то странная погода сегодня». Идёт снег. О, это холодный снег. Минус 185°C по Цельсию. или по Фарренгейту, я не знаю, как они определяют погоду Он сказал:"Холодно, надо уходить". Они начали бежать, снег становился глубже и глубже и скоро они замёрзли стоя. Они даже не смогли упасть. Вы когда-нибудь были в таком глубоком снегу, где невозможно упасть? Просто невозможно упасть.
  rating: orange
  verdict: Сценка смешит, но в ней спрятан довод «мамонты замёрзли стоя в снегу при −185 °C». Ни одной туши «стоя» не найдено, а мамонты ели не тропические растения, а траву холодной степи.
  arguments:
  - mammoths-frozen

- id: lecture-6-2181
  start: 2181.2
  end: 2212.0
  text: Снег становился глубже и глубже и начал скользить к экватору, оставляя ледниковые эффекты. Куски льда размером как Техас, скользили по местности со скоростью 150 км/ч, прорывая ледниковые каналы, которые найдены на северных и южных широтах Земли. Некоторые следы длятся по несколько километров. Лёд дошёл до штата Миссури. И земля была покрыта водой в жидком или твёрдом виде. Всё равно вода. Потому что оболочка разрушилась.
  rating: red
  verdict: Ледниковые борозды и морены оставили медленно ползущие ледники, а не глыбы размером с Техас на скорости 150 км/ч. Ледники движутся на метры и сотни метров в год.
  arguments:
  - ice-age

- id: lecture-6-2214
  start: 2214.3
  end: 2236.5
  text: Когда холодный воздух встречается с нормальным, идёт дождь. Из двух полюсов Земли шёл холодный воздух, как из холодного холодильника. Это, наверное, и произошло. Холодный воздух встретился с нормальным, образуя дождь и разрушая допотопную оболочку. которая покрывала землю В Библии написано, что разверзлись все источники Великой бездны, и окна небесные отворились.
  rating: red
  verdict: Мы тоже читаем, что «окна небесные отворились». Но холодный воздух с полюсов не может разрушить слой воды над атмосферой, которого, как показано выше, быть не могло.
  arguments:
  - vapor-canopy

- id: lecture-6-2236
  start: 2236.9
  end: 2266.7
  text: Если у вас будет возможность, прочитайте книгу Праведного. Это интересная книга. О ней говорится два раза в Библии. В главе шестой написано. В этот день Господь пошатнул всю землю, и солнце померкло, и основания мира неистовали. И вся Земля была в сильном движении, и молнии сверкали, и гром гремел И все основания Земли были разбиты. Эта книга не является частью Библии. Но всё же это интересное описание потопа из древнего документа.
  rating: orange
  verdict: Книга Праведного действительно упомянута в Нав 10:13 и 2 Цар 1:18, но она утеряна. Известная сегодня «Книга Яшар» — средневековое сочинение, и древним свидетельством о потопе она служить не может.
  rhetoric:
  - unverified-quote

- id: lecture-6-2269
  start: 2269.4
  end: 2291.1
  text: Следующая в теории. Из-за этого внезапного накопления льда на полюсах земная кора треснула. Движение льда оставило следы, что захоронило мамонтов, пошатнуло землю и уничтожило допотопный мир. И оболочку воды. В Бытие девять написано:«Покрылись все высокие горы, которые есть под всем небом». Мировой потоп.
  rating: red
  verdict: Что Писание говорит о потопе как о суде над всем миром, мы принимаем. Но механизм «лёд упал на полюса и расколол кору» — догадка без следов в породах (разбор на 28:37).
  arguments:
  - ice-meteor-flood

- id: lecture-6-2291
  start: 2291.9
  end: 2312.2
  text: Если вы уменьшите землю до размера бильярдного шара, то она будет более гладкая, чем сам шар. Если землю уменьшить до тридцатисантиметрового глобуса, то вся вода Земли не заполнит даже столовые ложки. Океаны громадный. Но они небольшие по сравнению с размером земли. Очень мало воды.
  rating: green
  verdict: 'В общих чертах верно: в масштабе Земля очень гладкая, а вся вода на глобусе в 30 см уместилась бы примерно в столовую ложку-другую.'

- id: lecture-6-2315
  start: 2315.4
  end: 2382.0
  text: Интересно, что вершина горы Эверест покрыта морскими ракушками. И моллюсками. Вот окаменелые моллюски в закрытом виде. Прежде всего, я хочу заметить, что гора Эврест находится Далеко от берега. Во-вторых. Моллюски не любят подниматься в горы. В-третьих, после смерти моллюски открываются. Сразу. Вы можете приехать в Пенсаколу, пойти на пляж и найти множество ракушек. Но вы никогда не найдёте закрытые ракушки. Если они мёртвые. Они открываются, мускулы расслабляются. Вы можете найти две подходящие ракушки, но не закрытые. Только если они живые. Для того чтобы найти окаменелые, закрытые ракушки, нужно захоронить их в живом виде. Есть места, где найденные окаменелые моллюски в закрытом виде в слоях по несколько метров. Окаменевшие моллюски. Интересно.
  rating: orange
  verdict: Что на Эвересте лежат морские окаменелости, верно. Но это известняки древнего морского дна, поднятые столкновением Индии с Азией; для этого не нужно, чтобы вода покрывала нынешнюю вершину.
  arguments:
  - mountain-uplift

- id: lecture-6-2382
  start: 2382.8
  end: 2404.5
  text: Бытие семь написано, что разверзлись все источники Великой бездны. Я думаю, что с землёй что-то столкнулось, как глыба льда на полюсах. Земная кора треснула. Источники бездны открылись, и на земле до сих пор видны трещины, которые называются линиями сброса. И когда поднялась горячая вода Она убила рыбу и животных в пределах эффективного радиуса.
  rating: red
  verdict: Разломы коры действительно есть. Но они образуются при движении плит и землетрясениях, которые идут и сегодня, а не от одного удара льда; горячей воды «из бездны» в них не находят.
  arguments:
  - hydroplates

- id: lecture-6-2405
  start: 2405.4
  end: 2445.1
  text: При поднятии воды вдоль трещин. Вода размоет стороны трещин и начнёт их раздвигать. Это поможет внутреннему слою подняться. более раздвигая стороны трещин При поднятии внутреннего слой или базальта начнёт трескаться. Объясняя магнитные аномалии, и поверхности начнут двигаться назад. Двигаясь назад, они остановятся. Это как ковёр, когда он упрётся в стенку, он остановится и начнёт гнуться. Изогнутые горы по всему миру указывают, что они были сжаты со стороны А не снизу. Это было сжатие со стороны. Интересно, почему есть такие горы?
  rating: red
  verdict: 'Что складчатые горы сжаты сбоку, верно: это признают и геологи. Но сжимают их сходящиеся плиты на протяжении миллионов лет, а магнитные полосы дна показывают смены полюсов, а не трещины в базальте.'
  arguments:
  - mountain-uplift
  rhetoric:
  - false-analogy

- id: lecture-6-2445
  start: 2445.8
  end: 2477.3
  text: И эта горячая вода также убьёт диатомий. Диотомия— это маленькие организмы, которые живут в океане. Их тело состоит из кремнезёма. Когда они умирают, их тела падают на дно. И потом тела их детей. внуков и так далее Говорят, что необходима 1 000 лет для накопления двух с половиной см диатом. Потому что они очень маленькие. Когда скопление высыхает, оно называется диатомовой землёй. Вы слышали об этом?
  rating: orange
  verdict: 'Что диатомит — это скопление панцирей диатомей, верно. Но скорость их накопления сильно разная: в местах «цветения» воды она во много раз выше, а Ховинд берёт одно число для всех.'
  arguments:
  - flood-sediments
  rhetoric:
  - cherry-picking

- id: lecture-6-2478
  start: 2478.3
  end: 2494.8
  text: Эта земля используется для разных вещей, используется для бассейнных фильтров, стиральных порошков, удобрений, изоляции. Для всего этого используется детомовая земля. Если вы разольёте машинное масло на асфальте Посыпьте его этой землёй, и она впитает масло.
  rating: neutral
  verdict: Бытовые применения диатомита.

- id: lecture-6-2495
  start: 2495.4
  end: 2522.7
  text: Самый большой карьер Диатомовой земли, о котором я знаю Находится в Южной Калифорнии. Он расположен прямо на трещине Сан-Андрея. И там диатомовая земля составляет 460 м глубины. Я посетил то место. Совершил экскурсию И даже говорил с рабочими. В семьдесят шестом году при раскопках диатомовой земли был найден ископаемый скелет. Акулы.
  rating: orange
  verdict: Карьер диатомита в Ломпоке и находка 1976 года реальны. Но найден был, по сообщениям, скелет кита, а не акулы, и подробности Ховинд передаёт со слов рабочих.
  rhetoric:
  - personal-story

- id: lecture-6-2524
  start: 2524.4
  end: 2551.5
  text: Миллиарды ископаемых, найденные в Диатомовой земле. Но в этот день была найдена акула. которая находилась на своём хвосте 24 метра длины. Так как слои камня были наклонены вместе с акулой, то проблемой является не высота акулы, а Ну, трёхметровая толщина. Если нужно тысяча лет для накопления двух сантиметров диатомовой земли, Не думаете ли вы, что акула бы сгнила за 60 или 70 тыс. лет?
  rating: red
  verdict: Скелет лежал в наклонённых слоях, а не «стоял на хвосте», и диатомит Ломпока местами накапливался быстро. Одна быстрая находка не опровергает медленного накопления в других местах.
  arguments:
  - polystrate-fossils
  rhetoric:
  - cherry-picking

- id: lecture-6-2553
  start: 2553.6
  end: 2583.9
  text: Животные, умирающие сегодня в океане, не окаменевают. Их разрывают, их съедают или они разлагаются? Они сгнивают. И чтобы получить ископаемую акулу в диатомовой земле. Сохранившуюся Необходимо захоронить её очень быстро. Я думаю, вот что произошло. Горячая вода убила всех диатомей в радиусе нескольких сот километров. И они заснежили на дно. Произошло очень быстрое накопление во время потопа.
  rating: orange
  verdict: Что для окаменения нужно быстрое захоронение, верно, геологи с этим согласны. Но быстро захоронить можно местным оползнем или «цветением» воды; всемирный потоп для этого не нужен.
  arguments:
  - flood-sediments

- id: lecture-6-2584
  start: 2584.6
  end: 2624.0
  text: При посещении карьера бригадир подарил мне этот кусок земли. Кусок, как видите, небольшой. Но он содержит сотни ископаемых рыб. Он сказал, что они всё время находят такие ископаемые. Он сказал, что однажды ночью они нашли ископаемое Птиродактля с восемнадцатиметровым размахом крыльев. Но они продолжали работать, потому что если скажешь какому-то университету, что вы нашли ископаемое Придётся прекратить работу, пока они не выкопают его. Что приведёт к потере денег? Но им нужны деньги, поэтому они продолжали работать. Они находят там множество ископаемых. Позвоните им и спросите.
  rating: red
  verdict: 'Птерозавров с размахом крыльев 18 метров не известно: самые большие — около 10–11 метров. Рассказ бригадира о находке, тайно уничтоженной ночью, проверить нельзя.'
  rhetoric:
  - personal-story
  - unverified-quote

- id: lecture-6-2625
  start: 2625.1
  end: 2663.0
  text: В Довере в Англии найден мел толщиной в 100 м. Твёрдый мел. Вы сможете отломать кусок утёса и писать им по доске. Отсюда и происходит название— меловой период. Хм Что же интересно произошло? Решили ли все животные пойти в Англию и умереть, чтобы создать слой мела? Или может произошла катастрофа? Быстрая перемена температуры воды. Я думаю, это и произошло. Бытие 7 написано:«Вода же усиливалась». Мир был уничтожен потопом.
  rating: red
  verdict: Мел Дувра сложен панцирями микроскопических водорослей, и в нём видны слои с ходами донных животных и кремнёвыми прослойками. Это говорит о долгом спокойном накоплении, а не о резкой гибели.
  arguments:
  - flood-sediments
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-6-2663
  start: 2663.8
  end: 2680.7
  text: 'Пятый пункт теории Ховинда: в течение первых месяцев потопа мёртвые животные осели. Волнующаяся вода кружила их в так называемых водоворотах. Образовуя громадные груды мёртвых животных и растений. Одни слои образовали пласты угля, другие слои образовали Ископаемые залежи.'
  rating: red
  verdict: Водовороты сваливают остатки в беспорядке, а ископаемые лежат слоями в постоянном порядке, и под пластами угля сохраняются почвы с корнями. Повтор пятого пункта теории (разбор на 29:00).
  arguments:
  - fossil-fuels-flood

- id: lecture-6-2683
  start: 2683.6
  end: 2700.6
  text: Вы когда-нибудь видели картинки с песком между стёклами? Перевернув картинку, образуется другой рисунок. Заметьте, что песок всегда создаёт слои. Интересно, как при потопе Потоп образовал все эти слои. Не миллионы лет накопления.
  rating: red
  verdict: Что вода быстро раскладывает песок слоями, верно. Но в настоящих толщах есть следы пустынь, почв, высохших морей и норы животных, которых песочная картинка не даёт.
  arguments:
  - flood-sediments
  rhetoric:
  - false-analogy

- id: lecture-6-2701
  start: 2701.3
  end: 2724.5
  text: В этих водоворотах животные начинали гнить. То голова отпадёт, то хвост, то рёбра. И это привело к появлению кладбищ динозавров, скрученные ископаемые кости в сплетённых и искривлённых позициях. Разъединённые части тел. Но на них нет следов зубов. Они не были разорваны Хищником. Они гнили и распались, вероятно, при потопе.
  rating: red
  verdict: Скопления костей динозавров действительно есть, но они разного возраста и лежат в разных слоях; на многих костях как раз видны следы зубов. Это местные наводнения и засухи, а не один потоп.
  arguments:
  - fossil-graveyards

- id: lecture-6-2726
  start: 2726.2
  end: 2741.4
  text: Концентрация ископаемых была замечательна. Они были нагромождены подобно куче брёвен. Найдены миллиарды ископаемых. Эволюционистам нетрудно найти ископаемые, им трудно найти потерянные звенья между разными видами ископаемых. Вот где проблема.
  rating: red
  verdict: 'Переходные формы найдены и описаны: от рыб к четвероногим (тиктаалик), от динозавров к птицам, от наземных зверей к китам. Ископаемых действительно очень много.'
  arguments:
  - transitional-forms

- id: lecture-6-2742
  start: 2742.4
  end: 2783.8
  text: Как-то раз на дискуссии профессор сказал У нас есть доказательства эволюции. Мы нашли ископаемое, которое является потерянным звеном между этим и этим животным. Я сказал:"Извините". Но если вы находите ископаемое в земле Всё, что вы знаете о нём. Оно умерло. Вы не знаете, что у него были дети, тем более разные. Во-вторых Я хочу задать вопрос Как получилось, что это ископаемое может делать то, чего не могут делать животные сегодня? Вы говорите, что эта кость может произвести животное, непохожее на себя. Тогда почему животные и сегодня не могут делать этого? Это всё было очень давно. Но почему-то это не происходит сегодня.
  rating: red
  verdict: 'Что у кости не узнать, были ли у животного дети, верно. Но о родстве судят не по одной кости, а по ряду форм в нужных слоях, а эволюция не утверждает, что животное рождает «непохожее»: изменения малы и копятся поколениями.'
  arguments:
  - transitional-forms
  rhetoric:
  - straw-man

- id: lecture-6-2784
  start: 2784.6
  end: 2816.7
  text: Я думаю, что ископаемые сформировались из-за потопа. Можно говорить целый день о примерах ископаемых. В бельгийской углевой шахте были найдены тысячи скелетов Егуана Дона. Сотни следов динозавров найдены по всему миру. Хорошо сохранённые следы. В некоторых местах найдены тысячи таких следов в месте. Информация Кару в Африке найдено 80 000 млн ископаемых позвоночных животных. 800 млрд
  rating: orange
  verdict: Берниссар и Кару реальны. Но игуанодоны Берниссара, по последним исследованиям, гибли в разное время, а «800 млрд» позвоночных в Кару — оценка, повторяемая креационистами без проверки; следы на суше потопу как раз противоречат.
  arguments:
  - fossil-graveyards

- id: lecture-6-2819
  start: 2819.3
  end: 2841.1
  text: На острове Аксел в Канаде найдены окаменевшие пни красного дерева. Ну, если вы посмотрите на данные То на этом острове не растёт ни одного дерева. Особенно красного. Им нужен специальный климат. Они растут всего лишь в нескольких местах в мире. Ну вот они найдены в Канаде возле Северного полюса.
  rating: orange
  verdict: Окаменелый лес на острове Аксель-Хейберг реален. Но это метасеквойи, а не красное дерево, и они говорят о тёплом климате Арктики миллионы лет назад; ни один ствол не принесён потопом — пни стоят на месте роста.
  arguments:
  - fossil-graveyards

- id: lecture-6-2841
  start: 2841.7
  end: 2866.1
  text: Поэтому по теории Ховинда окаменение происходит очень быстро. Животные должны быть захоронены, и они могут окаменеть за менее чем 100 лет. Вот окаменелое водное колесо. Вода бежала по колесу, когда оно превратилось в камень. Вот окаменевшая рыба при рождении. Окаменела при рождении. Не нужно миллионов лет, чтобы родиться. Слава Богу. Да?
  rating: orange
  verdict: Что при нужных условиях окаменение бывает быстрым, признают и геологи. Но водяное колесо лишь покрылось известковой коркой, а возраст окаменелостей определяют не скоростью окаменения, а слоями и датировкой.
  arguments:
  - rapid-fossilization
  rhetoric:
  - straw-man

- id: lecture-6-2867
  start: 2867.5
  end: 2903.9
  text: Вот окаменевший сапог ковбоя с ногой внутри. Было установлено, что сапог был изготовлен в пятидесятых годах. Нога ковбоя в сапоге. Наверное, ему отстрелили ногу или что-то произошло. И она окаменела. Вот окаменелая шляпа. Найденная в Новой Зеландии. Не позволяйте им говорить, что для окаменения нужны миллионы лет. Из Аризоны мне прислали окаменевший мелок. Кто-то его нашёл? Он окаменелый.
  rating: red
  verdict: Ни один геолог не утверждает, что окаменение всегда требует миллионов лет. «Сапог с ногой» — кости внутри кожаного сапога в минеральной корке, а не настоящая окаменелость.
  arguments:
  - rapid-fossilization
  rhetoric:
  - straw-man

- id: lecture-6-2905
  start: 2905.0
  end: 2951.7
  text: В Теннесси, в 1881 году умер человек, его похоронили. 14 лет спустя умерла его жена. Решив похоронить её возле мужа, они выкопали яму, но туда просочилась вода. Это повторилось два раза, и её Похоронили в другом месте. Внуки забеспокоились за дедушку и за воды. И решили его перезахоронить. Как оказалось, его тело полностью превратилось в камень. Он окаменел за 14 лет. Находясь в проточной воде. Окаменевший человек. Тело превратилось в камень, вероятно, в результате постоянного течения воды и, возможно, минералов за такой период времени. Окаменение не занимает миллионы лет. Происходит быстро в благоприятных условиях.
  rating: orange
  verdict: Истории о «каменных» телах в сырой земле известны, но обычно это жировоск — превращение жира тела в воскоподобную массу, а не окаменение. Возраста пород это не касается.
  arguments:
  - rapid-fossilization
  rhetoric:
  - personal-story

- id: lecture-6-2952
  start: 2952.1
  end: 2985.0
  text: Ученикам в школе скажут, что у каждого слоя Земли разный возраст и что ископаемые расположены по их развитию. Простые внизу. Сложный наверху. Во-первых, они так не расположены. И глупо спорить на эту тему, потому что они не расположены, как написано в учебнике. Даже эволюционисты соглашаются с этим. Давид Раб сказал:«Я не знаю, почему вы спорите, но они не расположены в чётком порядке». Но если они и расположены в определённом порядке, это из-за движения воды. Вода разделяет вещи.
  rating: red
  verdict: Ископаемые в целом лежат в постоянном порядке, это видно по всему миру. Рауп говорил о том, что летопись неполна и неравномерна, а не что порядка нет; цитата приведена без источника и смысла.
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-6-2986
  start: 2986.2
  end: 2998.8
  text: Эволюционисты датируют слои по ископаемым. И датирует ископаемые по слоям. Круговая аргументация. Мы говорим об этом на кассете четвёртой. Движение воды автоматически их сортирует.
  rating: red
  verdict: Порядок слоёв установили ещё в начале XIX века, до Дарвина, а возраст слоёв сегодня измеряют радиометрически по вулканическим прослойкам. Круга здесь нет.
  arguments:
  - fossil-layers

- id: lecture-6-2999
  start: 2999.2
  end: 3054.7
  text: Детям скажут, что моллюски произошли первыми, и поэтому их ставят в нижнюю часть геологической колонны. Я хочу обратить ваше внимание на несколько вещей. Возможно, что моллюски расположены внизу, а птицы вверху и за место их обитания Когда начинается потоп? То моллюски уже на дне. Правда? И, вероятно, они будут захоронены первыми, а птицы будут захоронены в потопе последними. Потому что они будут летать, пока не закончится бензин. Правда? Может, животные расположены, основываясь на разуме? Как любой может догадаться, моллюски не очень умный. Может, они расположены, основываясь на подвижности? Вы знали, что моллюски не могут быстро бегать? Может, они расположены, основываясь на плотности тела. Вы знаете, что раковина моллюска тяжелее птичьего пера? Не позволяйте им говорить, что они основаны на эволюции. Нет, они расположены на основе потопа.
  rating: red
  verdict: 'Сортировка водой не объясняет порядка: ласты морских ящеров не ниже рыб, а цветковые растения не «убегали» от потопа, но всегда лежат только в верхних слоях. Шутка про бензин не заменяет довода.'
  arguments:
  - fossil-layers
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-6-3054
  start: 3054.8
  end: 3072.9
  text: Бытие семь написано, что покрылись все высокие горы, какие есть под всем небом. Вся Земля была под водой. Хьюас Оди и его последователи учат, что это был местный потоп во дни Ноя. Извини, Хью, но если покрылись горы... Это уже не местный потоп.
  rating: purple
  verdict: Мы тоже верим, что потоп был настоящим судом. Но слова «все высокие горы под всем небом» многие толкователи понимают как описание с точки зрения Ноя; так понимали и христиане-геологи XIX века. Это законный богословский спор.
  arguments:
  - local-flood

- id: lecture-6-3074
  start: 3074.2
  end: 3101.2
  text: 'Второй вопрос: зачем Бог сказал Ною построить большой ковчег? Заполнить его животными и находиться в нём целый год Если это был просто местный поток. Почему он не сказал Ною, чтобы он переехал? А? Я об этом догадался, и я думаю, что Бог догадался бы так же сделать. И зачем спасать животных от местного потопа? Потому что в других частях мира полно животных.'
  rating: purple
  verdict: 'Вопрос «зачем тогда ковчег» серьёзный, и сторонники местного потопа на него отвечают: ковчег — знак суда и спасения, а не только способ уехать. Это законный богословский спор, его не решает «я бы догадался».'
  arguments:
  - local-flood
  rhetoric:
  - argument-by-incredulity

- id: lecture-6-3101
  start: 3101.6
  end: 3130.5
  text: Нет, это был всемирный потоп. И я уверен, что Хьюрас умный человек Но то, чему он учит Просто ересь. Купите книгу«Сотворение и время», и вы увидите, во что верит Хью Рас. Это большая трагедия. Он поглотил многих христиан. Его показывают по христианским программам. Когда он не верит в то Что говорит Библия? Он может говорить, что он верит, но он не верит. Это был неместный А всемирный потоп.
  rating: purple
  verdict: Хью Росс — христианин, признающий богодухновенность Писания; он спорит о толковании, а не о вере в Бога. Назвать брата по вере «еретиком» за иное понимание размаха потопа — не довод.
  arguments:
  - local-flood
  rhetoric:
  - loaded-language

- id: lecture-6-3132
  start: 3132.2
  end: 3165.5
  text: Ну куда делась вся вода? Если был потоп, где вся вода? Бытие восемь написано:«И воды остановились». Это значит, что воды упали. Воды не стало. В новых версиях Библии это изменено. Там говорится, что воды убыли. Нет Воды остановились. Важная разница. В псалме 103 говорится Ты поставил Землю на твёрдых основах. Не поколеблется она во веки и веки. Бездную, как одеянием покрыл ты её. На горах стоят воды.
  rating: purple
  verdict: Вопрос «куда делась вода» законный. Но английское abated в Библии короля Якова и значит «убыли», как в новых переводах, так что разницы нет; а Пс 103 говорит о сотворении, а не о потопе.
  arguments:
  - kjv-only

- id: lecture-6-3167
  start: 3167.8
  end: 3192.6
  text: Я думаю, вот что произошло. В течение последних месяцев потопа плиты Земли переломались, и они начали наклоняться И перемещаться. При поднятии одной стороны другая сторона опускается и вода сбегает в низкое место. Земная кора была переломана как яичная скорлупа. Это было причиной очень быстрого формирования большого каньона. Мы поговорим об этом позже.
  rating: red
  verdict: Мысль, что вода стекала с поднимающихся материков, — догадка. Каньон вырезан в твёрдых породах, а не в мягком осадке, и река Колорадо врезалась в поднимающееся плато постепенно.
  arguments:
  - grand-canyon-flood

- id: lecture-6-3193
  start: 3193.2
  end: 3222.9
  text: В псалме 103—7 написано:«От прещения твоего бегут они, от гласа Твоего быстро уходят». Вода ушла. В стихе восьмом написано. Восходят на горы, нисходят в долины. В английском языке это старая фраза, и во многих Библиях есть сноска, объясняющая, что это значит. Горы возвысились, долины понизились. И во время потопа толстые слои Земли поднялись. Тонкие слои опустились.
  rating: purple
  verdict: Мы тоже читаем Пс 103 как хвалу Творцу. Но стихи 5–9 говорят о сотворении, о водах, которым Бог положил предел, «чтобы не возвращались покрыть землю»; относить их к потопу — одно из толкований.
  arguments:
  - mountain-uplift

- id: lecture-6-3223
  start: 3223.5
  end: 3250.9
  text: Земная кора под континентами очень толстая, около 50 км. Где мы стоим? Но под океанами она всего лишь 5 или 8 км. Континентальная кора очень толстая, а океанская кора тонкая. И тонкие места осели, заставляя другие места подняться. И вода сбегала с высоких мест. И земля до сих пор разломана на плиты. И они немного двигаются. Но всё это из-за потопа 4 400 лет назад.
  rating: red
  verdict: Что материковая кора толстая, а океанская тонкая, верно. Но возраст дна и движение плит измерены, и подъём гор продолжается со скоростью миллиметры в год; относить всё к году потопа данные не позволяют.
  arguments:
  - mountain-uplift

- id: lecture-6-3251
  start: 3251.3
  end: 3280.9
  text: Если вы надавите в одном месте земли и какое-то другое место поднимется, Вы когда-нибудь спали на водяном матрасе? Если вы войдёте в спальню, когда ваша жена спит на водяном матрасе, Тихо возьмёте стул, подпрыгните и Как можно выше. И прыгните на вашу сторону матраса. Вы сможете подбросить её аж до потолка. Потому что когда одно место опускается, другое должно подняться. Это и произошло с Землёй во время потопа. И вода начала сбегать с поднимающихся гор.
  rating: orange
  verdict: 'Что там, где кора опускается, она где-то поднимается, отчасти верно. Но Земля не водяной матрас: горы поднимаются медленно при сжатии плит, и «подбросить до потолка» за дни нельзя.'
  arguments:
  - mountain-uplift
  rhetoric:
  - false-analogy

- id: lecture-6-3284
  start: 3284.1
  end: 3319.3
  text: И если вода стекала быстро, будет много эрозии. Если вода стекала медленно, будет мало эрозии. Это зависит от объёма воды и наклона земли. Всё очень просто. Пролетая по Западному США, вы увидите огромные места эрозии. Но в этой местности почти нет дождя. В местах, где почти не идёт дождь Находятся, находится полно эрозии. Что произошло? Я думаю, это произошло от воды потопа, не произошло на протяжении миллионов лет. Горы поднялись, и вода стекла в низкие места.
  rating: red
  verdict: 'Мало дождя сегодня — не значит мало его было раньше: климат менялся, а редкие ливни в пустыне размывают очень сильно. Следы одного стока с материков в рельефе Запада не видны.'
  arguments:
  - flood-runoff
  rhetoric:
  - argument-by-incredulity

- id: lecture-6-3320
  start: 3320.0
  end: 3337.3
  text: Интересно, если вы посмотрите на карту, почти всегда горные хребты следуют по бережным линиям. Скалистые горы параллельно Тихому океану. Анды параллельно Южному Тихому океану. Даже а Палачи параллельно Североатлантическому. Выглядит, что горы и океаны сформировались в одно время.
  rating: orange
  verdict: 'Что многие хребты идут вдоль побережий, верно. Это объясняет тектоника плит: горы встают там, где плиты сходятся, то есть на краях материков; одновременности это не доказывает.'
  arguments:
  - mountain-uplift

- id: lecture-6-3337
  start: 3337.6
  end: 3357.7
  text: И по всему миру найдены изогнутые слои камня. Я не знаю, понимаете ли вы или нет, но камень не гнётся. И эти изогнутые камни указывают, что они были изогнуты, когда они были мягкой землёй. Они не были изогнуты медленно, они изогнулись быстро, как слой мягкой земли. Это произошло во время потопа.
  rating: red
  verdict: 'Камень гнётся: под большим давлением и нагревом глубоко в коре породы деформируются пластично, и в изгибах видны вытянутые зёрна минералов. Мягкость осадка для складок не нужна.'
  arguments:
  - mountain-uplift

- id: lecture-6-3358
  start: 3358.9
  end: 3373.5
  text: Поднятие гор сформировало метаморфические породы, изменяя их под действием давления на осадочные слои. В то же время при трескании камня появится извержённая инклюзивная порода камня. Проходящая через известняк
  rating: orange
  verdict: Метаморфизм и интрузии описаны верно. Но чтобы магма остыла и стала гранитом, нужны тысячи и миллионы лет; год потопа для этого слишком короток.
  arguments:
  - mountain-uplift

- id: lecture-6-3374
  start: 3374.7
  end: 3430.4
  text: После потопа вода сбегала в океаны, но океаны были меньше, чем сейчас. Я верю, что когда Ной сошёл с ковчега Океаны были меньшими. А континенты намного больше. Вот здесь был берег, друзья. Англия и Ирландия не были островами, они были частью Франции. Если вы снизите уровень воды... Всё соединено. Глубина Ламанша всего 50 м. Самая глубокая точка Ламанша— 50 м. Ширина 50 км. Ну, глубина всего 50 м. Снизив уровень воды, вы увидите, что Россия и Аляска соединены вместе. Всё в мире было соединено. Флорида была полторы тысячи километров ширины. Вы могли бы перепрыгнуть с Флориды в Кубу. И тогда перепрыгнуть в Мексику.
  rating: orange
  verdict: 'Что в ледниковый период уровень моря был ниже и Британия соединялась с Европой, а Азия с Аляской, верно. Но это было 20 тысяч лет назад, а Флорида с Кубой не соединялись: между ними глубокий пролив.'
  arguments:
  - flood-runoff

- id: lecture-6-3432
  start: 3432.9
  end: 3446.3
  text: Может быть, в Мексиканском заливе не было воды до поднятия уровня океана? И со временем вода наполнила Мексиканский залив. Средиземное море, Чёрное море, Каспийское море. Они были наполнены поднимающейся водой.
  rating: red
  verdict: 'Мексиканский залив и Средиземное море — глубокие впадины с океанским дном, существующие миллионы лет. Подъём моря на сотню метров заполнить их не мог: они намного глубже.'
  arguments:
  - flood-runoff

- id: lecture-6-3448
  start: 3448.1
  end: 3469.8
  text: Океаны состоят из двух Из двух частей. Глубокая часть называется бездной, мелководная часть называется континентальным шельфом. Я верю, что континентальный шельф— это старые линии берегов, когда Ной сошёл с ковчега. Но и мог ходить по всему миру, мог пойти в Австралию. Часто спрашивают, как появились животные в Австралии после потопа? Они пошли туда?
  rating: red
  verdict: 'Шельф действительно затопленный край материков, и в ледниковый период часть его была сушей. Но до Австралии и тогда нельзя было дойти по суше: на пути лежали глубокие проливы.'
  arguments:
  - flood-runoff

- id: lecture-6-3471
  start: 3471.8
  end: 3515.6
  text: Что же было причиной заполнения океанов? И как они наполнились? Почему существует континентальный шельф? И что же произошло во дни фалика? Библия говорит, что в последние дни ругатели не будут знать о потопе. Потоп объясняет геологию. После короткого перерыва мы поговорим о том, что произошло во дни Фаллика, о причинах формирования континентального шельфа, наполнения океанов, формирование угля И покажем вам, что произошло на горе Сент-Хелленс 20 лет назад. И мы покажем, как теория Ховинда относится к вам и ко мне сегодня. Духовное применение. После перерыва.
  rating: neutral
  verdict: Анонс второй части и перерыв.

- id: lecture-6-3545
  start: 3545.2
  end: 3580.9
  text: Давайте продолжим теорию Ховинда. Что было причиной потопа во дне Ноя и где доказательства? В Библии написано, что Бог сотворил небо и землю. И наши основатели считали основным принципом, что они были созданы Богом. И что права происходят от создателя И они неоспоримы. Сегодня у нас целое поколение людей выросло вере в эволюцию. Где говорится, что права происходят от государства Вместо того, что права происходят от Бога... Что создаёт всецело новую философию, по которой живут студенты.
  rating: orange
  verdict: Что права человека даёт Творец, мы тоже верим. Но теория эволюции ничего не говорит о том, откуда права, и многие принимающие эволюцию христиане верят в Бога как их источник.
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-6-3582
  start: 3582.3
  end: 3606.1
  text: Мы ещё поговорим о потопе и его последствиях. Я хочу представить философию, по которой мы должны жить. Бог создал этот мир. Бог уничтожил его потопом. Это его мир, он может разрушить его, если он хочет. И он возвращается судить снова. И если вы ещё не спасены, Библия говорит, что вы идёте в ад. Нравится вам это или нет? Ну так случится.
  rating: neutral
  verdict: 'Проповедь: Бог — Творец и Судья, и Он придёт судить. В это мы тоже верим.'

- id: lecture-6-3606
  start: 3606.9
  end: 3625.0
  text: До потопа мир был другим. Люди жили по 900 лет. После потопа всё изменилось. Потоп был важным событием в истории мира. Нам нужно понять, что сделал потоп. Или вы не поймёте геологии сегодняшнего мира. После потопа жизнь сократилась из-за разрушения оболочки.
  rating: red
  verdict: 'Что Библия говорит о сокращении жизни после потопа, верно. Но объяснять это разрушением водяной оболочки нельзя: такой оболочки быть не могло (разбор на 2:33), а геология объясняется и без потопа.'
  arguments:
  - vapor-canopy

- id: lecture-6-3626
  start: 3626.3
  end: 3645.8
  text: Теория Ховинда. Пункт шестой. В течение последних месяцев потопа нестабильные плиты Земли передвинулись. Это причинит опускание тонких мест коры и поднятие толстых мест. Вода начнёт уходить, формируя большой каньон Колорадо примерно за несколько недель, не миллионы лет эрозии.
  rating: red
  verdict: Повтор шестого пункта теории (разбор на 29:22). Слои каньона твёрдые, со следами дюн и почв; за несколько недель воды их не прорезать.
  arguments:
  - grand-canyon-flood

- id: lecture-6-3646
  start: 3646.3
  end: 3669.7
  text: Уменьшив землю до размера бильярдного шара, она будет более гладкой, чем сам шар. И тридцатикилометровая выпуклость незначительна для тринадцатитысячнокилометровой земли. Из космоса невозможно найти гору Эверест. Невозможно найти восьмикилометровую гору из космоса. Так же, как и скалистые горы, они незначительны в сравнении с размером Земли.
  rating: orange
  verdict: 'Что в масштабе Земли горы невелики, верно. Но Эверест хорошо виден с орбиты, а «гладкость» не значит, что воды хватит покрыть горы: для этого нужно втрое больше воды, чем есть в океанах.'
  rhetoric:
  - scale-trick

- id: lecture-6-3670
  start: 3670.4
  end: 3694.4
  text: Сбегающая вода оставила много эрозии. Мы видим много эрозии по всему миру, в местах, где очень мало дождя. Проезжая по Ломпок в Калифорнии, на стороне дороги было много эрозии. Происшедший от одного ливня Я подошёл и сделал несколько снимков. Здесь вы можете видеть миниатюрные бесплодные земли после одного ливня.
  rating: orange
  verdict: Что один ливень может сильно размыть рыхлый склон, верно и честно показано. Но это рыхлая насыпь у дороги; твёрдые породы так не размываются, и пример скорее против одного потопа.
  arguments:
  - flood-runoff
  rhetoric:
  - personal-story

- id: lecture-6-3695
  start: 3695.3
  end: 3750.1
  text: Центральная часть Соединённых Штатов Фиолетовая площадь на этой карте. Это водосборный бассейн Миссисипи. Чикаго находится выше Нового Орлеана на 180 м. Это высота Чикаго над уровнем моря. Между Чикаго и Новым Орлеаном 1 500 км. И это значит, что река Миссисипи снижается на 180 м. За 1 500 Километров. Что значит, что Миссисипи снижается 12 см на каждый километр? 12 см снижения на 1 км. Э-э, почти ровно. И Миссисипи медленно течёт вниз. Если вы построите плотину через долину Миссисипи То Фиолетовая площадь будет затоплена Конечно, для этого понадобится громадная платина.
  rating: neutral
  verdict: Пояснение о малом уклоне Миссисипи и о плотине — подводка к модели прорванной запруды.

- id: lecture-6-3752
  start: 3752.0
  end: 3772.0
  text: Если вы построите плотину через Большой каньон Колорада. То затопится площадь за каньоном и образуется громадное озеро В учебниках детей будут учить, что Большой каньон медленно сформировался на протяжении миллионов лет. В этом учебнике написано:«На протяжении миллионов лет река Колорада высекла большой каньон из твёрдого камня».
  rating: orange
  verdict: Учебник действительно говорит, что каньон вырезала река за миллионы лет; это вывод геологии. Модель прорыва озера Ховинд противопоставляет ему ниже, а не здесь.
  arguments:
  - grand-canyon-flood
  rhetoric:
  - textbook-authority

- id: lecture-6-3772
  start: 3772.8
  end: 3829.0
  text: Как там на дебате Атист сказал. Мистер Ховинд, очевидно, понадобилось много миллионов лет для формирования большого каньона. Я сказал:"Сэр", я был на Большом каньоне. Есть несколько вещей, о которых вы должны знать. Вы знаете, что вершина каньона находится на высоте 2 000 м над уровнем моря? Дню каньона. Дно каньона— 600 м над уровнем моря. Но река вливается в каньон на высоте 900 м. И река течёт вниз. Когда горы поднимаются в одно и то же время. При 600 высоте реки высота гор составляет 2 000 м. На этой фотографии мы видим снеговую линию. Большой каньон представляет собой прорванную плотину. Он проходит по старой извилине под названием подъём Каяба.
  rating: red
  verdict: Что река входит в каньон ниже его вершины, верно. Но плато поднималось медленно, а река успевала врезаться, как пила в бревно, которое поднимают; следов прорванной запруды на плато нет.
  arguments:
  - grand-canyon-flood
  rhetoric:
  - personal-story

- id: lecture-6-3832
  start: 3832.6
  end: 3874.1
  text: Я сказал профессору. Я сказал:«Сэр, вы знаете, что вершина каньона выше, чем дно». Он сказал да. Тогда я сказал:«Вы знаете, что река течёт только по дну». Он сказал:"Конечно". Я сказал:«Вы знаете, что вершина выше, чем место влияния реки?» Две тысячи больше, чем 900, правда? Я сказал. Реки не текут вверх. И невозможно, чтобы река высекла этот каньон. Потоп сделал большой каньон. Он сформировался от воды.
  rating: red
  verdict: Геологи и не говорят, что река текла вверх. Плато поднималось под рекой, а она успевала врезаться; так образуются и другие каньоны, например на реках, пересекающих горы.
  arguments:
  - grand-canyon-flood
  rhetoric:
  - straw-man

- id: lecture-6-3876
  start: 3876.7
  end: 3922.1
  text: 'Даже сами учебники признаются, что большой каньон сбивает с толку. Потому что он петляет из стороны в сторону. Но у него крутые стороны. Это противоречащее свойства. Петляние реки, как Миссисипи. Указывает на маленький уклон И что река не течёт очень быстро. Крутые стороны указывают на быстрое течение реки. которая течёт под большим наклоном У Большого каньона Колорадо есть крутые стороны. И он петляет. Учёные озадачились Как сформировался этот каньон? Как река сделала такое? Вот где вся проблема: река этого не сделала, это сделал потоп. Невозможно, чтобы река сформировала каньон.'
  rating: red
  verdict: 'Извилистое русло с крутыми стенами — известное явление, «врезанные меандры»: река петляла по равнине, а когда местность поднялась, врезалась, сохранив изгибы. Учёных это не озадачивает.'
  arguments:
  - grand-canyon-flood
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-6-3922
  start: 3922.6
  end: 3963.3
  text: Катастрофа может изменить недвижимость. Вот осевший дом после землетрясения в Японии. При землетрясении вода поднимается кверху. И 150 м верхней части Земли станет как суп. Поглощая строение. Землетрясение в Аляске в шестьдесят четвёртом году сильно повредило поверхность. Я остановился в Готеле возле места землетрясения. Там можно увидеть место, где провалилась земля на 10 м. Сейчас там, конечно, посажена трава, и жизнь продолжается. Но землетрясения могут принести большие изменения.
  rating: green
  verdict: 'Верно: землетрясения меняют рельеф за секунды, грунт разжижается, как при Аляскинском землетрясении 1964 года. Катастрофы геологи признают и изучают.'

- id: lecture-6-3964
  start: 3964.2
  end: 4035.5
  text: Когда в восьмидесятом году взорвался вулкан на Сейн-Хелленс В течение нескольких секунд обвалилась вся северная часть горы. Движение Земли достигло 150 км/ч. Вулкан освободился, выбрасывая пепел и пар. В то время моя сестра жила в 100 килом/ места происшествия. После извержения вокруг оседал пепел. Вот фотография разлетающегося пепла на горе Сент-Ханз. Кипящие облака пепла разлетались по стране, и от них погибло 60 человек. И кто знает сколько зверей Вот машина, засыпанная пеплом по стёклам. Кстати, это плохо для покраски. Учёные начали наблюдать за разлетающимся пеплом. Часть пепла полностью окружила мир в ветровых течениях. Вокруг всего мира. Но почти весь пепел осел в жёлтом регионе. покрыл сотни и тысяч кв. километров земли От вулкана Сен-Хелленс произошёл всего лишь один кубический километр. Пепла. Немного в сравнении с большими вулканами. Этот вулкан считается маленьким. Но разлетевшийся пепел осел слоями.
  rating: green
  verdict: 'В целом верно: при извержении Сент-Хеленс в 1980 году обрушился северный склон и погибло 57 человек, а пепла было около одного кубического километра и он лёг слоями.'

- id: lecture-6-4037
  start: 4037.9
  end: 4064.1
  text: При движении Земли произошли странные вещи. Горячая земля при движении преградила путь некоторым ручьям и речкам. Долины были горячей грязью с землёй. Одна семья построила дом. Они были готовы переезжать, но после извержения оползень засыпал дом, и от него осталась только второй та же крыша. И потом они решили не въезжать.
  rating: neutral
  verdict: Рассказ о доме, засыпанном оползнем.

- id: lecture-6-4066
  start: 4066.8
  end: 4113.1
  text: Здесь вы можете увидеть потоки грязи вокруг реки Туту. Куски льда размером как дом были сорваны с вулкана и после покрыты горячей землёй. Когда лёд покрыт чем-то горячим. Появляется проблема. Потому что когда лёд встаёт водой Он немного сжимается. Но когда он встаёт паром, он увеличивается в 1 700 раз. И ничего этого не остановит. Эти куски льда растаяли, испарились и взорвались под оползнями, образуя паровые взрывы. Сначала думали, что это извержение. Ну, это были взрывы льда. Взрывы образовали большие дыры. И грязь заполнила их опять, оставляя следы эрозии на сторонах этих ям от паровых взрывов.
  rating: green
  verdict: 'Верно: при таянии и вскипании погребённого льда под горячими отложениями Сент-Хеленс происходили паровые взрывы, оставившие воронки.'

- id: lecture-6-4114
  start: 4114.0
  end: 4129.9
  text: И я гарантирую, что когда-то профессор приведёт сюда учеников и скажет Вы видите эти следы эрозии? Они взяли миллионы лет. Ну, какой-то ученик скажет:«Мой папа всё видел, это заняло 5 минут, учитель?» Вы не допускаете катастрофу.
  rating: orange
  verdict: Выдуманный профессор, отрицающий катастрофы, — карикатура. Геологи сами изучают Сент-Хеленс и легко отличают свежие рыхлые отложения от древних твёрдых пород.
  rhetoric:
  - straw-man

- id: lecture-6-4130
  start: 4130.9
  end: 4198.1
  text: 'Река Тутл тоже была перегорожена. Я видел эту реку, и я не знаю, почему они называют её рекой. Скорее, я бы назвал это ручейком. Но они говорят, что это река. Поток грязи остановил эту реку. И несколько дней спустя за этим оползнем образовалось большое озеро. Но как только уровень воды поднялся до вершины оползня, вода его быстро размыла, и произошла быстрая эрозия. С одной стороны долины накопилась грязи земля С другой стороны, накопилась вода. Когда вода начала переливаться через верх, она начала создавать протоки и скоро потекла с большой скоростью и шумом. Унося с собой разные виды обломков: песок, гравий, брёвна, пни. Вода превратилась в жидкую шкурку. Вода прорвалась и вырезала массивный каньон. 330 м ширины, 50 м высоты. И 670 м длины. Всё это произошло за 15 минут. И на дне вы увидите маленький ручеёк. Под названием Река Туту.'
  rating: green
  verdict: 'В целом верно: в 1982 году грязевой поток у Сент-Хеленс прорезал каньон в рыхлых отложениях за считанные часы. Это пример быстрой эрозии рыхлого материала.'

- id: lecture-6-4200
  start: 4200.6
  end: 4237.7
  text: Если вы думаете, что маленькая речка сделала этот большой каньон Вы ошибаетесь. Это произошло от одной катастрофы. Как только вода переливается через преграду, эрозия происходит быстро, и каньоны появляются быстро. Это и произошло во время потопа во дни Ноя. Если вы посмотрите на мир с точки зрения креционизма, Он приобретает новый смысл. Потоп образовал эти признаки. Посмотрите на сухой водопад в Монтане. Говорят, что он больше Ниагарского водопада в тысячу раз. Но в нём нет воды. Полностью сухой. Называется«Сухой водопад Монтаны».
  rating: red
  verdict: Быстрый размыв рыхлого пепла не переносится на твёрдые породы Большого каньона. Сухой водопад Драй-Фолс в штате Вашингтон оставили ледниковые паводки около 15 тысяч лет назад, а не Ноев потоп.
  arguments:
  - grand-canyon-flood

- id: lecture-6-4238
  start: 4238.2
  end: 4288.6
  text: Спустившись в каньон горы Сен-Хелленз, было обнаружено, что стороны каньона состоят из слоёв. Тысячи и тысячи пластов пород. Подождите. Вся эта грязь была смыта туда за один раз. И каньон был сформирован за один раз. Почему он состоит из тысяч наслоений? Возьмите банку земли, налейте в неё воды и взболтайте. Поставьте банку, и вы увидите, как образуются слои за несколько секунд прямо на ваших глазах. Поток горячей земли автоматически разделился на слои. Я гарантирую, что когда-то какой-то профессор приведёт сюда учеников и скажет, что каждый слой разного возраста. Он скажет:"Вот здесь представлены 50 млн лет". Извините, профессор, но здесь представлен один оползень.
  rating: red
  verdict: Что рыхлые слои у Сент-Хеленс легли за часы, верно. Но геологи различают такие отложения и толщи с почвами, норами и следами высыхания; «50 миллионов лет» никто здесь не называл.
  arguments:
  - flood-sediments
  rhetoric:
  - straw-man

- id: lecture-6-4289
  start: 4289.7
  end: 4307.1
  text: За несколько минут произошла быстрая эрозия на северной стороне горы Сен-Хелленс. И эта маленькая река не образовала каньон тоже. Просто она протекает по этому месту. Каньон Колорадо— это просто обвалившаяся запруда. Всё произошло очень быстро.
  rating: red
  verdict: Каньон у Сент-Хеленс прорезан в рыхлом пепле, а Большой каньон — в твёрдых известняках и песчаниках. Сходство формы не делает сходным происхождение.
  arguments:
  - grand-canyon-flood
  rhetoric:
  - false-analogy

- id: lecture-6-4309
  start: 4309.7
  end: 4343.9
  text: При извержении было вырвано множество деревьев. Большое количество. Я посетил те места несколько лет после извержения, когда мой зять был пилотом. Мы летели над местностью, заполненной поваленными деревьями. Если вы не были в Вашингтоне или Орегоне и не видели громадных деревьев, то Вы не поймёте, о чём я говорю. Это гигантские деревья. Некоторые деревья диаметром в 2,5 м. Трудно представить размер этих деревьев. Их нужно только увидеть. Такие вырванные деревья лежали там повсюду.
  rating: neutral
  verdict: Рассказ о поваленном лесе у Сент-Хеленс.
  rhetoric:
  - personal-story

- id: lecture-6-4344
  start: 4344.5
  end: 4407.3
  text: Когда я летел оттуда, я сидел возле вице-президента деревообрабатывающей компании. Он сказал:«Братховен, вы хотите знать разницу между государственным и частным имуществом?» Я сказал да. Он сказал:«После извержения вулкана мы были владельцами половины уничтоженной территории». Другая половина принадлежала государству. Они решили, чтобы природа восстановилась сама по себе. Группа любителей деревьев сказала:«О, нам нужно сохранить деревья, не трогайте их». Но мы, в отличие, собрали все верные деревья и посадили новые деревья. Так как они не почистили свою территорию, эрозия Смыло большую часть почвы, и их земля оказалась уничтоженной. Сегодня, 20 лет спустя, их деревья метр высоты. На нашей части мы почистили землю, посадили молодые деревья и сегодня они шестиметровой длины. На нашей территории быстро растёт лес. Их территория всё ещё опустошена 20 лет спустя.
  rating: orange
  verdict: Часть пострадавших земель действительно оставили для изучения естественного восстановления, а частные земли засадили. Рассказ соседа по самолёту — не довод, и к потопу он отношения не имеет.
  rhetoric:
  - personal-story

- id: lecture-6-4409
  start: 4409.3
  end: 4441.4
  text: Идея движения в защиту природы основана на первом пункте Карла Маркса. Отмена частного имущества. Бог сказал нам быть управителями этой Земли. И нам можно срезать дерево. Один человек разозлился и сказал:«У деревьев есть права». Я сказал, у кислорода тоже есть право. И вам нужно прекратить дышать. Так можно зайти далеко? Если вам нужно дерево, спилите его и посадите другое, пожалуйста.
  rating: orange
  verdict: Что Бог поручил людям управлять землёй, мы тоже верим. Но охрана природы не «основана на Марксе», а насмешка над собеседником не отвечает на его довод.
  rhetoric:
  - ad-hominem-pivot
  - vysmeivanie-vmesto-dovoda

- id: lecture-6-4441
  start: 4441.9
  end: 4484.7
  text: Кто-то мне сказал, что оттуда вывозится 900 грузовиков с брёвнами ежедневно на протяжении шести лет. Вывозятся миллионы деревьев. И это составляет только 10%. поваленных деревьев Нереальное опустошение от одного вулкана. В озеро попало столько деревьев, что можно ходить по воде. Тысячи деревьев плавают по озеру Спирит. 8 000 гектаров озера были покрыты деревьями. Деревья там не выросли. Ветер переносил эти деревья по воде из стороны в сторону, и их кора начала отпадать, как вы увидите из фотографий. Эти брёвна до сих пор плавают в этом озере спирит.
  rating: neutral
  verdict: Рассказ о масштабе вывала леса и о брёвнах на озере Спирит.

- id: lecture-6-4487
  start: 4487.3
  end: 4526.4
  text: Прошло 20 лет. И деревья уже не все. До сих пор плавают по озеру. Многие брёвна начали Плавать в вертикальном положении. Обычно часть с корнем тонет, и деревья едва выступают над поверхностью воды. Многие деревья начинают опускаться на дно и погружаться в ил. И многие деревья находятся в или на глубине пяти-семи метров. Выглядит, как будто они там выросли. Но они там не выросли. Эти деревья находятся виле, если эта территория высохнет Деревья окаменеют в стоячем положении.
  rating: green
  verdict: 'Верно: брёвна на озере Спирит тонули стоя и вязли в иле. Это реальное наблюдение; что из него следует, разобрано ниже.'

- id: lecture-6-4529
  start: 4529.2
  end: 4554.1
  text: Окаменелые деревья в вертикальном положении и проходящие по многим слоям Земли, найдены по всему миру. Это обычное явление. Это многослойные ископаемые. Окаменевшие стоячие деревья сформировались во время потопа, а не на протяжении бесконечности. И если длина глина вокруг дерева смоется То она упадёт. Окаменелые деревья в вертикальном положении— обычное явление.
  rating: red
  verdict: Стволы сквозь слои действительно бывают, их объясняют быстрым местным засыпанием — паводком или пеплом. Это говорит о быстроте одного слоя вокруг ствола, а не о том, что за год легли все слои Земли.
  arguments:
  - polystrate-fossils

- id: lecture-6-4555
  start: 4555.2
  end: 4574.0
  text: Вот я стою возле такого дерева. Найдено 27 последовательных слоёв деревьев в вертикальном положении, проходящих по разным слоям. Говорят, что эти слои разного возраста. Нет. Всё это произошло во время потопа, который продолжался целый год. Накопились тысячи метров осадков.
  rating: red
  verdict: В «окаменелых лесах» Йеллоустона на разных уровнях находят почвы и корни на месте роста. Значит, лес рос, засыпался пеплом и вырастал снова — много раз, а не за год.
  arguments:
  - polystrate-fossils

- id: lecture-6-4574
  start: 4574.1
  end: 4594.6
  text: Если грязь смыта и дерево падает на землю, оно разломается на куски. Я не знаю, или вы когда-нибудь спиливали деревья, но когда дерево падает Оно не распадается на куски автоматически. Кто это уже заметил? Но поломанные и окаменевшие деревья найдены по всему миру.
  rating: orange
  verdict: 'Окаменевшие стволы раскалываются потому, что камень хрупок: трескается уже окаменевший ствол. Катастрофы для этого не нужно.'
  arguments:
  - polystrate-fossils
  rhetoric:
  - appeal-to-doubt

- id: lecture-6-4597
  start: 4597.7
  end: 4609.1
  text: В Аризоне на окаменев дереве были найдены следы топора. Кто-то когда-то рубил это дерево? Когда оно ещё не окаменело, конечно.
  rating: red
  verdict: Где, кем и когда найдены «следы топора», Ховинд не говорит; проверить нельзя. Окаменелый лес Аризоны лежит в слоях с динозаврами, где следов людей нет.
  arguments:
  - human-fossils
  rhetoric:
  - unverified-quote

- id: lecture-6-4612
  start: 4612.4
  end: 4638.5
  text: Эти водолазы спустились под плавающие брёвна. Вот они, между брёвен. Они заметили, что при движении брёвен с них спала вся кора. Это кора и обломки оседают на дно. И на дне озера Спирид находится полутораметровый слой коры и осадков. Эта кора покроется илом и грязью и превратится в уголь. Уголь формируется из осадков и растительности при большом давлении.
  rating: orange
  verdict: Что кора на дне озера Спирит может со временем стать торфом, а потом углём, верно в принципе. Но в настоящих угольных пластах есть корни на месте роста, а не только снесённая кора.
  arguments:
  - fossil-fuels-flood

- id: lecture-6-4641
  start: 4641.0
  end: 4655.0
  text: Уголь можно сделать за один час в лаборатории. Растительный материал при большом давлении и температуре превращается в уголь за 1 ч. Я думаю, что после потопа нижние слои превратились в уголь за несколько сот лет. Возможно.
  rating: orange
  verdict: В лаборатории действительно получают углеподобное вещество за часы, но при высоких температуре и давлении. Это не доказывает, что природный уголь образовался за сотни лет.
  arguments:
  - fossil-fuels-flood

- id: lecture-6-4656
  start: 4656.9
  end: 4673.1
  text: Но во время потопа скопления брёвен уничтоженного леса плавали по воде. Оставляя за собой кору обломки. Эти кучи брёвен достигали размера Техаса. Оставляя за собой осадки. которые в конечном счёте образовали карьеры угля
  rating: red
  verdict: Плавучие «острова брёвен» размером с Техас — догадка. Под многими пластами угля лежат почвы с корнями, а значит, лес рос на месте, а не был принесён водой.
  arguments:
  - fossil-fuels-flood

- id: lecture-6-4675
  start: 4675.8
  end: 4691.4
  text: В вашей местности есть уголь? Я родом из Центрального Иллинойса, где находится множество угольных шахт. в которые в детстве водил меня отец Уголь почти всегда найден и находится в слоях.
  rating: neutral
  verdict: Воспоминание об угольных шахтах Иллинойса.

- id: lecture-6-4696
  start: 4696.4
  end: 4727.8
  text: Я вёл дискуссию с доктором Скоттом по радио, и она сказала Доктор Ховинд, на Среднем Западе существует 80 отдельных слоёв угля. Если посмотреть на количество угля в мире, то вся биомасса мира сегодня не смогла бы произвести столько угля. Необходимо огромное количество времени для образования угольных слоёв. Извини, Джимми, в твоём взгляде есть проблема. Это правда, что есть 80 разных слоёв угля? И что не хватит всех деревьев, чтобы произвести столько угля? Она права.
  rating: green
  verdict: 'Ховинд честно признаёт: на Среднем Западе десятки угольных пластов, и биомассы одного мира для них не хватит. Именно это и говорит о многих лесах в разные эпохи.'
  rhetoric:
  - personal-story

- id: lecture-6-4728
  start: 4728.3
  end: 4746.7
  text: Однако она предполагает, что мир до потопа был таким, как сейчас. Сегодня 70% мира находится под водой. Предположим, что до потопа под водой было 20%. И условия были другими. Повышенное давление воздуха, больше углекислого газа и громадные деревья.
  rating: red
  verdict: Допущение «до потопа суши было 80 %» ничем не подтверждено. Даже если бы так было, пласты угля разделены морскими слоями, то есть леса росли и затоплялись много раз.
  arguments:
  - vapor-canopy

- id: lecture-6-4749
  start: 4749.1
  end: 4774.3
  text: Мир сегодня не только под водой. На больших частях лежит лёд или находятся пустыни. Очень маленькая часть Земли пригодна для жизни человека. Всего 3%. Я не думаю, что Бог так сотворил всё это. Сегодня мы живём в разрушенном мире. Начальное творение сильно отличалось. Я думаю, что в допотопном мире было намного больше деревьев, из которых и сформировался уголь.
  rating: orange
  verdict: Мы тоже верим, что мир пострадал от греха. Но «3 % пригодной земли» — сильное занижение, а вывод о другом допотопном мире сделан, чтобы спасти довод об угле, без данных.
  arguments:
  - vapor-canopy

- id: lecture-6-4774
  start: 4774.9
  end: 4791.7
  text: Слои угля часто ответвляются. Но если проследить за ними на протяжении нескольких миль То они снова сходятся. И это доказывает, что слои угля не могут быть разного возраста. Они все произошли в одно время.
  rating: red
  verdict: 'Пласты угля действительно ветвятся и сходятся: так бывает, когда в одно болото на время заходила река и наносила песок. Это говорит о долгой истории болота, а не об одном потопе.'
  arguments:
  - fossil-fuels-flood

- id: lecture-6-4792
  start: 4792.1
  end: 4798.3
  text: В некоторых местах слои угля достигают 30 м. Для этого нужно много деревьев.
  rating: neutral
  verdict: Замечание о толщине угольных пластов.

- id: lecture-6-4799
  start: 4799.6
  end: 4826.8
  text: Также в угле находят человеческие предметы пользования. Этот колокол был найден в куске угля. Он находится у Ньютона Андерсона, вот номер его телефона. Этот сосуд был найден в куске камня, которому, по предположению, было 600 млн лет Предмет, похожий на свечу зажигания, был найден в куске камня. Золотая цепочка была найдена в угле Валланойсе 100 лет назад.
  rating: red
  verdict: Рассказы о колоколе, сосуде и цепочке в угле — старые газетные истории без научного описания. «Свеча зажигания» из Кософа оказалась свечой 1920-х годов в корке из минералов.
  arguments:
  - human-fossils
  rhetoric:
  - unverified-quote

- id: lecture-6-4829
  start: 4829.3
  end: 4853.3
  text: Резной камень найден в шахте в Айова. Железная чаша найдена в шахте в Оклахоме. Подошва обуви найдена в шахте в Неваде. Поломали уголь и увидели подошву. На ней можно было увидеть шов и стоптанный каблук. Но говорили, что камню было 213 млн лет. Неправда. Он сформировался при потопе.
  rating: red
  verdict: «Подошва» в Неваде — известная газетная история 1920-х годов; учёные, изучавшие образец, сочли его природным образованием. Возраст пород это не опровергает.
  arguments:
  - human-fossils
  rhetoric:
  - unverified-quote

- id: lecture-6-4853
  start: 4853.9
  end: 4872.7
  text: В Бытие восьмой главе написано, что воды остановились. Написано, что вода постепенно возвращалась с Земли. Это интересная фраза. На еврейском это Звучит Халлагвашаб. Вала вода убывала и прибывала. Убывает и пребывает. Как сильный прилив и отлив.
  rating: purple
  verdict: Мы тоже читаем, что вода «постепенно возвращалась» (Быт 8:3). Но еврейский оборот значит «постепенно», «всё более», и о приливах и отливах в стихе речи нет; это толкование Ховинда.
  arguments:
  - flood-geology-general

- id: lecture-6-4874
  start: 4874.9
  end: 4923.1
  text: Я думаю, что в начале потопа осадочные породы осели на дно и сформировали горизонтальные слои. И тогда в Библии написано, что горы поднялись, и долины осели, и Земля изменилась из-за нескольких факторов. Может, из-за движения от расширения трещин при изменении базальта. или от поднятия воды из-под слоя камня причинила обвалы в нескольких местах И это причинит. Эрозию. Бушующие волны на поверхности воды сметали неровные места и оставляли новые осадочные слои. И геологи это называют, в геологии это называется несогласным залеганием пород. Не согласные напластовывание пород под разными углами. Это не произошло за миллионы лет. Произошло при потопе.
  rating: red
  verdict: 'Угловые несогласия реальны, но на границе часто лежат почвы, галька и следы выветривания: нижние слои успели окаменеть, накрениться и размыться до того, как легли верхние. Год потопа для этого слишком мал.'
  arguments:
  - flood-sediments

- id: lecture-6-4924
  start: 4924.6
  end: 4959.6
  text: Написано:«Насмешники не знают о потопе». Потом написано, что остановился ковчег в седьмом месяце на горах Араратских. Но Ной не выходил до тринадцатого месяца. По нескольким причинам. Первое, ещё не было сухо. Вторая была опасна, и ещё не утихли бури. И третье, на Земле не было еды. Так как ещё ничего не выросло. В течение шести месяцев выросло много растений. Что ж, что животные смогли бы выжить. Бытие 8:5 написано, что вода постепенно убывала.
  rating: purple
  verdict: Мы тоже верим повествованию о Ное. Почему Ной ждал выхода из ковчега, Библия прямо не говорит; объяснения Ховинда — благочестивые догадки, и спорить о них не нужно.
  arguments:
  - genesis-literal

- id: lecture-6-4960
  start: 4960.1
  end: 5009.4
  text: Вот теория Ховинда. На протяжении нескольких сот лет гигантские шапки льда медленно таяли. Изменяя океан. Первое— океаны стали шире, глубже. И холоднее от тающего льда. Снизив уровни, уровень воды, вы заметите, что Австралия соединена с Вьетнамом. Вы смогли бы пойти в любое место мира, потому что всё соединено между собой землёй. И если вы сохраните часть воды в виде льда на полюсах То уровень воды будет ниже. В первые несколько сотен лет люди могли ходить по всему миру. При таянии льда остались фрумленные и терминальные морены. Эти ледниковые эффекты произошли. Но не миллионы лет назад.
  rating: red
  verdict: 'Что морены и друмлины оставлены ледниками, верно. Но оледенений было много, а Австралия и в самые холодные эпохи не соединялась с Вьетнамом сушей: их разделяли глубокие проливы.'
  arguments:
  - ice-age

- id: lecture-6-5013
  start: 5013.9
  end: 5043.4
  text: В Бытие десять написано. У Евера родились два сына. Имя одному— Фалик. Потому что во дни его Земля разделена. Фалик родился 100 лет после потопа. В эти дни разделилась Земля. И есть на этот счёт несколько теорий. Некоторые думают, что в это время Земля разделилась на языки и нации. Может быть, это приемлемая теория.
  rating: neutral
  verdict: Пересказ Быт 10:25 о Фалеке. Мысль, что «разделение земли» — разделение народов, и мы считаем приемлемой.

- id: lecture-6-5043
  start: 5043.7
  end: 5058.5
  text: Некоторые думают, что континенты появились от одного континента. Я не верю в это. Потому что если вы передвинете континент на метр, это причинит такое землетрясение и прилив. которые уничтожат всё живое в мире Я не верю в это, хотя этому и учат.
  rating: red
  verdict: 'Материки не сдвигают на метр разом: плиты движутся на сантиметры в год, и напряжение разряжается землетрясениями. Кстати, расколоть Землю на материки за дни потопа было бы куда разрушительнее.'
  arguments:
  - continental-drift
  rhetoric:
  - straw-man

- id: lecture-6-5058
  start: 5058.9
  end: 5074.7
  text: Некоторые думают, что вода поднялась и отделила высокие места в острова и континенты. Вода поднялась от таяния льда. Некоторые думают, что Земля была поделена между людьми. Может, так и произошло. Или комбинация причин. Я не знаю, что произошло.
  rating: neutral
  verdict: Другие версии «разделения земли»; Ховинд честно признаёт, что не знает.

- id: lecture-6-5076
  start: 5076.0
  end: 5093.7
  text: От таяния льда океаны стали глубже, шире и холоднее. И накопление ЦО2. Вода уничтожит парниковый пери-эффект и будет пропускать больше радиации, что сократит продолжительность жизни. Несколько причин сокращения жизни.
  rating: red
  verdict: 'Сокращение жизни после потопа описано в Библии. Но объяснение через исчезнувший «парниковый покров» и радиацию не подтверждается: радиация у поверхности Земли слишком мала, чтобы так сокращать жизнь.'
  arguments:
  - vapor-canopy

- id: lecture-6-5096
  start: 5096.3
  end: 5131.4
  text: Глубина старого ламанша всего 30 м. Пятьдесят километров ширины и 30 м глубины. Нет, они глубоко. Я думаю, что поднимающаяся вода заполнила долины и образовала Средиземное море. Когда Средиземное море заполнилось Вода потом заполнила Чёрное море и Каспийское море. Это произошло от поднятия уровня воды в океанах от таяния льда. Это теория Ховинда о том, что могло произойти. Я думаю, что континентальный шельф— это старая линия берега.
  rating: orange
  verdict: Что после оледенения море поднялось и заполнило Ла-Манш, а шельф — бывший берег, верно. Но Средиземное и Каспийское моря существуют миллионы лет, и всё это растянуто на тысячи лет, а не на сотни.
  arguments:
  - ice-age

- id: lecture-6-5132
  start: 5132.3
  end: 5150.3
  text: И последнее. На Земле до сих пор видны эффекты Божьего суда. Бог несомненно ненавидит грех. Вещи вокруг нас должны напоминать нам о Божьем суде. Когда вы смотрите на каньоны. Когда вы заправляете бензин Это последствия Божьего суда.
  rating: purple
  verdict: Мы тоже верим, что Бог ненавидит грех и судит его. Но каньоны и нефть образовались задолго до человека, и видеть в них след потопа — толкование, а не наблюдение.
  arguments:
  - flood-geology-general

- id: lecture-6-5152
  start: 5152.5
  end: 5165.5
  text: Люди и животные погибли в этом потопе. И их тела превратились в нефть или уголь. Уголь, находясь под большим давлением. Электричество, которым мы пользуемся, могло произойти из углевой электростанции.
  rating: red
  verdict: Нефть образовалась в основном из морского планктона и водорослей, а уголь — из растений; человеческих останков в них нет. Залежи лежат в слоях очень разного возраста.
  arguments:
  - fossil-fuels-flood

- id: lecture-6-5168
  start: 5168.0
  end: 5179.8
  text: Были найдены кости группы динозавров. В учебниках напишут. Миллионы лет назад Нет, это не доказательство. Это доказательство потопа.
  rating: red
  verdict: 'Скопления костей динозавров есть, но они лежат в разных слоях и разного возраста: каждое — отдельная местная беда, а не один потоп.'
  arguments:
  - fossil-graveyards

- id: lecture-6-5181
  start: 5181.8
  end: 5207.3
  text: Когда вы смотрите на Землю с христианской точки зрения, вы думаете Мне нравятся красивые каньоны. Друзья, это просто испорченное Поверхность. И это доказательство суда. Бог послал потоп, чтобы оставить доказательства. Как видно, он разрушил эту землю. Если вы смотрите на карстовый рельеф... на месторождение нефти, на месторождение угля и точки зрения потопа Всё имеет смысл.
  rating: purple
  verdict: 'Мы тоже смотрим на мир как христиане. Но «христианский взгляд» не равен потопной геологии: многие верующие видят в каньонах красоту творения, а не «испорченную поверхность».'
  arguments:
  - flood-geology-general
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-6-5208
  start: 5208.2
  end: 5215.4
  text: Мы продаём хорошую книгу Вольтера Брауна в начале. Его взгляд немного отличается от теории Ховинда, но я попробую его изменить.
  rating: neutral
  verdict: Реклама книги Уолтера Брауна.

- id: lecture-6-5217
  start: 5217.1
  end: 5245.2
  text: Я хочу закончить несколькими мыслями. Это фотография ископаемого рыбы. Поедающий другую рыбу. Или же одна из этих рыб— зубной врач. Я не уверен. Но вы знаете, что рыбы не думали, что они погибнут в тот день. Рыба не успела заглотнуть маленькую рыбу, как я думаю, начался потоп. Источники бездны открылись, и их накрыло обвалом. И они проснулись. Мёртвыми.
  rating: orange
  verdict: Окаменелые рыбы, глотающие рыбу, действительно найдены, и это говорит о быстром захоронении. Но быстро хоронит любой местный обвал или замор; всемирный потоп отсюда не следует.
  arguments:
  - fossil-graveyards

- id: lecture-6-5247
  start: 5247.1
  end: 5851.4
  text: 'Вы знаете, что и вы в один день прекрасный проснётесь мёртвыми. И вы будете мёртвыми долгое время. Библия говорит: человеком положено однажды умереть. А потом суд. Гарри Труман жил на стороне горы Сен-Хеллендс. Мой друг из Сент-Луиса засвидетельствовал Гарри. Он рассказал, что Гарри был очень скверным человеком, выражался нецензурно. Он внимательно слушал Евангелие. Но подтвер, потом отверг то, о чём я говорил. Он отверг Иисуса Христа. Некоторое время спустя его предупредили, что вулкан может взорваться и ему необходимо переехать. Он жил прямо на стороне горы. Ну, он сказал, что он не хочет переезжать. И он там остался жить. Кстати Он там до сих пор. Его так и не нашли. Наверное, он где-то 100 м под землёй. Гарри был предупреждён. Но отказался. Насколько мы знаем, он сейчас в аду. Не глупо ли жить на стороне вулкана? Тебя предупреждают, а ты говоришь Нет, я останусь здесь. Не соглашаешься переехать? Это не очень умно, правда? Но вы знаете, что очень много людей в Америке и в мире делают то же самое. Мы живём на планете, которая будет взорвана, сожжена, уничтожена. Мы все погибнем. Иисус предусмотрел путь к спасению, чтобы мы не платили за грех. Мы можем быть прощены. Они отказываются от возможности быть спасёнными. Я лично не понимаю такого мышления. Или недостатка мышления. Библия говорит:«Имеющий сына имеет жизнь, не имеющий сына Божьего не имеет жизни». Без Иисуса мы пропали. Бог не желает, чтобы кто погиб. Второе Петра. Он хочет спасти всех. Он желает всех спасти. Если вы попросите Бога Он вас простит? В Матфее говорится:«Ну, как было во дне Ноя, так будет и в Пришествие Сына человеческого». Ибо как во дни перед потопом ели, пили, женились и выходили замуж до того дня, как вошёл Ной в ковчег, и не думали, пока не пошёл, пришёл потоп и не истребил всех. Так будет и пришествие Сына человеческого. Всем нам нужно явиться пред Судилище Христова. Итак, зная страх Господень, мы вразумляем людей. Вы знаете, что заставляет меня путешествовать и говорить о Боге? Бог ненавидит грех. Он ненавидит мой грех и ваш грех. И я пытаюсь убедить людей и отдать сердце Иисусу Христу. Это мой мотив. Библия говорит:«И мудрый привлекает души». Я хочу быть мудрым. Я хочу приводить людей ко Христу во время Гражданской войны. Вообще-то, это была война Линкольна. Это долгая история. Деревенский деревенский парень из Алабамы решил записаться на войну против янков. Он прошёл учебный лагерь, получил тренировку, рюкзак, ружьё, униформу и пошёл на фронт к повстанцам сражаться с янками. Он пришёл на поле боя и сказал сержанту:«Сэр, я готов к сражению». Сержант ответил:«Мы очень рады, что ты здесь». Смотри, вон там в траншее сидят янки, мы сидим здесь. Твоей работой будет охрана нашей траншеи. Он сказал:"Сержант, я не приехал сюда охранять, я приехал воевать". Могу я пойти воевать? Сержант сказал:"Ты не понимаешь, у нас нет приказа". Ты охраняй траншею и следи за янками. А когда мы получим приказ? Тогда мы пойдём в бой. Парень злился всё сильнее. Он не приехал маршировать, он приехал воевать. Янки вот там, почему он не может с ними воевать? Но он всё же охранял траншею. Некоторое время спустя он не выдержал. Он видел янгов, он приехал воевать. Почему же не воевать? Он потерял контроль. Всё бросил. Выпрыгнул из траншеи и с криками побежал прямо в сторону траншеи янков. Он всё это проделал в одиночестве. Янки были ошеломлены. Они спрашивали, что с ним? Он что, самоубийство? Этот деревенский парень пробежал всё расстояние и прыгнул в траншею врага. Схватил первого янки и свалил его одним ударом. Это был деревенский парень большого размера. Он схватил своего пленника, вылез из траншеи и побежал назад к повстанцам. Никто не стрелял. Когда он прибежал назад, вокруг него собрались повстанцы и спросили Что это такое? Он сказал:"Это янки"? Они сказали:"Мы знаем", где ты его взял? Он сказал вот там. Там осталось ещё очень много. Он сказал У вас всех мог бы быть человек, если бы вы захотели У вас всех мог бы быть человек Если бы вы захотели Знаете, я думаю, что многие христиане попадут на небо в одиночестве. Они никого не привели ко Христу. И когда они попадут на небо, они увидят, что вокруг кого-то будет целая толпа. И они спросят:«Где ты их взял?» И кто-то скажет. А вон там на земле У вас тоже мог бы быть человек, если бы вы захотели Вопрос. Кого вы берёте на небо с собой? Вы привели кого-нибудь ко Христу? Это не так трудно. Иисус приходит скоро. Вы должны спасти кого-то. Вы скажете:«Я не знаю как». В одно время я тоже не знал. Я вырос в теории Аланойс. Когда я покаялся, я начал ездить на автобусе в независимую фундаментальную баптистскую церковь. Я читал Библию, возрастал в благодати. Однажды мой друг из Пресвитерианской церкви предложил Кент. Ты хочешь пойти со мной на ярмарку, где у нас есть место для организации жизнь кампуса и где мы стараемся приводить людей ко Христу на этой ярмарке? Я сказал:"Да, я хочу пойти", только я не знаю, как это делать. Он сказал:"А ты не беспокойся. Твоим заданием будет пойти в толпу и предлагать людям заполнить короткую анкету". Там будет 10 вопросов. И последний будет таким. Хотите ли вы лучше узнать Бога? И если кто-то ответит«да». Я должен был привести их к палатке и сказать Герман— это Джордж. Он хочет лучше узнать Бога. Я должен был приводить людей к душе спасателям. Достаточно просто и мне нравилось. Первые два дня я раздавал анкеты и приводил людей к душе спасателя. На третий день я подходил к людям, предлагал им заполнять анкету. И делал то же самое, приводил людей к душе спасателя. В тот день я подошёл в толпе к большому футболисту. И я спросил:«Сэр, вы не хотите лучше узнать Бога?» Он сказал:"Да, я хочу". Я сказал:"Пойдём со мной". Я уже знал, что нужно делать. Мы подошли к палатке. Я открыл дверь. И там никого не было. Позже я узнал, что они свидетельствовали сиамским близнецам. На ярмарке в тот день были сиамские близнецы Ланни и Дани. И один из них покаялся. Другой не покаялся. И они решили на следующий день пойти и поговорить с Даней. который покаялся Они решили рассказать ему о Вознесении. Ваня, конечно, сидел рядом. Он сказал:"Что же случится со мной?" Тебе будет трудновато. Я лучше покаяться. Да, тебе лучше покаяться. И он покаялся на следующий день. Всё, что я знал,— это то, что в палатке никого не было. Палатка была пустая. Футболист посмотрел на меня и сказал:«Ну что будем делать?» Я сказал, э-э-э... А-а, я, наверное, расскажу тебе. Я никого не привёл к Богу в моей жизни. Я не знал, как. Мы сели на сиденье. Я не знал, что делать. Я вытащил брошюру«Четыре духовных закона Бога». Я не знал, что делать. И так как я не знал, что делать, я начал читать брошюру. Закон первый: ты грешник. Закон второй: Христос умер за тебя и хочет тебя спасти. И так далее. Страницу за страницей. На последней странице было написано:«Если вы хотите принять Христа, Помолитесь этой молитвой. И я тоже сказал:«Вы хотите принять Христа?» Он сказал:"Да, я хочу". Я подумал:"О, что же делать дальше?" Сам предложил и не знаю, что делать. Там было написано:«Помолитесь этой молитвой». И я сказал:«Давай закроем глаза, склоним головы, и я буду молиться, а вы повторяйте за мной». Мы закрыли глаза, но я закрыл только один глаз. Я читал молитву с брошюры. Так как я не знал, что делать Я читал молитву:«Дорогой Иисус, я грешник. Я знаю, ты умер за меня». Спаси меня. Он повторял это за мной.'
  rating: neutral
  verdict: 'Евангельский призыв и рассказы о благовестии: смерть и суд, история Гарри Трумэна, притча о солдате, свидетельство на ярмарке. Мы разделяем призыв довериться Христу; к научным доводам эта часть не относится.'

- id: lecture-6-5851
  start: 5851.8
  end: 5861.9
  text: Когда мы закончили, помолившись простой молитвой И он принял Иисуса. Кстати, это всё, что нужно, чтобы спастись, не нужно ничего прибавлять. Бог не желает, чтобы кто погиб.
  rating: purple
  verdict: Мы тоже верим, что спасение — дар по вере, а не по делам. Но довольно ли «простой молитвы», и как с этим связаны покаяние и крещение, разные церкви понимают по-разному; это законный богословский спор.
  rhetoric:
  - podmena-ponyatij

- id: lecture-6-5863
  start: 5863.4
  end: 6020.4
  text: 'Он посмотрел на меня со слезами на глазах и сказал:«Кент...» Я беспокоился о смерти несколько последних недель. Я очень благодарен тебе. И он ушёл. Больше я его не видел. После этого. Я встал на колени возле сиденья, прямо на ярмарке. Я сказал. Господи Это я. Кент Я спасён только несколько месяцев. Мне 16 лет. Я не знаю, что ты ожидаешь от меня, господь. Я не знаю. Ну, Господи, если можно. Я хочу делать это всю мою последующую жизнь. Я хочу приводить людей к Иисусу. Прошёл уже 31 год, и мне до сих пор нравится Приводить людей ко Христу. Некоторые из вас спасены, но никогда этого не делали. Правда? Вы могли бы? Вы могли бы, если бы вы не беспокоились о той игре Дьявол отвлёк вас ненужными вещами. Вы должны сосредоточиться на чём-то вечно важном. И это не деньги. Это не машины, не одежда, не игры. Это души. Нам нужны души спасатели в этой стране. Как вы думаете, есть ли неверующие люди в радиусе 10 миль отсюда? Наверное. Некоторые скажут:«Если я пойду свидетельствовать, они от меня уйдут». Куда? Вад номер два. Есть только один ад. Говорите им о Боге. У меня есть правило: кому свидетельствовать, а кому нет. Я проверяю. Дышат они или нет? Если вы чувствуете, что они дышат... Засвидетельствуйте им. Если же они не дышат Не свидетельствуйте. Все должны слышать Евангелие. Иисус скоро придёт. Если вы умрёте сегодня, Куда вы попадёте? Вы будете мёртвыми долгое время. Лучше приготовьтесь к этому. Куда вы попадёте, если вы умрёте сегодня? Если вы не уверены, что вы попадёте на Небо, вам надо покаяться.'
  rating: neutral
  verdict: Конец рассказа и личное посвящение служению; призыв приводить людей ко Христу.

- id: lecture-6-6021
  start: 6021.0
  end: 6028.3
  text: Явно видно, что Бог уничтожил мир. И он приходит судить мир снова. И мы все будем стоять пред Богом.
  rating: orange
