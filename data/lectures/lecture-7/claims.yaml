- id: lecture-7-49
  start: 49.5
  end: 69.8
  text: Спасибо, что вы пришли. Моё имя Кент Ховинд. Я преподавал науку в школе 15 лет, а теперь за последние 10 лет я путешествую и говорю о сотворении, эволюции и динозаврах. Давайте быстро просмотрим, о чём мы уже говорили на семинаре. Так как это будет кассета седьмая, мы уже прошли много материала. Поэтому я хочу повторить некоторый материал.
  rating: neutral
  verdict: Представление и переход к повторению пройденного. О том, что преподавание в школе не делает Ховинда учёным, сказано в разборе лекции 1.
  rhetoric:
  - self-authority

- id: lecture-7-70
  start: 70.0
  end: 98.1
  text: Библия учит, что Бог сотворил всю Вселенную за 6 дней около 6 000 лет назад. 4 400 лет назад был потоп, когда Ной построил ковчег и спас животных. До потопа животные и люди жили долгое время. Люди жили по 900 лет. Мы говорим об этом на первой и на второй кассете. Как доказать, что Земле нет миллиардов лет? Как они жили по 900 лет, потому что сегодня так долго жить невозможно.
  rating: purple
  verdict: Мы тоже верим в сотворение и потоп. Сложив годы в родословиях Быт 5 и 11, правда получишь около 6000 лет. Но этой суммы Библия не подводит, а греческий и еврейский тексты расходятся на полторы тысячи лет, поэтому христиане с древности спорят, точная ли это хронология.
  arguments:
  - genesis-literal

- id: lecture-7-99
  start: 99.6
  end: 116.7
  text: На третьей кассете мы говорим, что динозавры всегда жили с человеком, что о них упоминается в Библии, в истории, и, наверное, некоторые до сих пор живы. И если вы заинтересуетесь, приобретите мой каталог. Мой семинар уже 15 часов длины, и на нём я отвечаю на многие интересные вопросы.
  rating: red
  verdict: Пересказ лекции 3. В слоях с костями динозавров нет ни людей, ни коров, ни лошадей, а по возрасту этих слоёв динозавры вымерли около 66 млн лет назад. Живых динозавров никто не нашёл, а библейские тексты о них разобраны в статьях о доводах.
  arguments:
  - dinosaurs-humans

- id: lecture-7-121
  start: 121.6
  end: 148.3
  text: На четвёртой кассете мы говорим об обмане в учебниках. Детей учат вещам, которые неверные. Учат обману, чтобы дети поверили в теорию эволюции. На пятой кассете мы показываем связь эволюции с развитием коммунизма, социализма, марксизма, нового мирового порядка. Это политическая импликация. На шестой кассете мы говорим о потопе. Что произошло и как сформировался каньон Колорадо.
  rating: red
  verdict: Что в учебниках встречаются устаревшие примеры, верно. Но сознательного обмана детей и связи эволюции с коммунизмом Ховинд не доказывает; эти доводы разобраны в лекциях 4 и 5.
  arguments:
  - textbooks-poison
  rhetoric:
  - loaded-language

- id: lecture-7-148
  start: 148.8
  end: 211.9
  text: Сегодня мы рассмотрим вопросы, которые не были рассмотрены раньше. Так как я постарался оставить сложные научные вопросы в конце семинара. Одна из наших задач, как христиан, это обратиться сердцем, чтобы узнать. Мы должны научиться. Наша задача — всегда быть готовыми дать ответ всякому, требующему отчёта в нашем уповании. Сегодня я хочу показать, что мы, христиане, можем изучать и понимать этот мир. Христиан часто обвиняют в неосведомлённости. И я сильно возмущаюсь, когда слышу такое. Я думаю, вы тоже. Многие атеисты думают, что если вы верите в Библию, то вы глупы. Я бы сказал, что если вы не верите Библии, то тогда с вами не всё в порядке. Но с помощью этой книги, Библии, изменилось много жизней, включая и мою. Давайте перейдём к вопросам. Кстати, если вы не успели передать свой вопрос, вы можете это сделать на перерыве. Просто запишите вопрос и передайте его мне.
  rating: neutral
  verdict: Переход к вопросам. Мы согласны, что христианин должен быть готов дать ответ о своей вере (1 Пет 3:15) и что вера не мешает изучать мир.

- id: lecture-7-212
  start: 212.7
  end: 247.0
  text: Как мы можем видеть звёзды на расстоянии миллиардов световых лет? Это популярный вопрос. Как можно видеть звёзды на расстоянии миллиардов световых лет? Существует много звёзд. И мне нравится изучать звёзды. Это называется астрономия. В Библии, в Бытии 1 написано, что Бог сотворил звёзды для знамения и времён. Бог создал их, чтобы Адам мог их видеть. Не так ли? Было бы неумно для Бога сделать что-то, что Адам не мог бы видеть миллионы лет. Он так сделал, чтобы Адам их видел.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил звёзды «для знамений, и времён». Но из этого стиха не следует, что Адам должен был видеть свет каждой звезды; это толкование, а не слова Писания.
  arguments:
  - distant-starlight

- id: lecture-7-247
  start: 247.4
  end: 257.8
  text: Было установлено, что, вероятно, существует столько звёзд, что на каждого человека на Земле пришлось бы по 2 триллиона звёзд. Достаточно много.
  rating: green
  verdict: 'Верно: по грубой оценке Европейского космического агентства, звёзд во Вселенной от 10²² до 10²⁴, то есть больше триллиона на каждого жителя Земли.'

- id: lecture-7-258
  start: 258.8
  end: 309.0
  text: 'Итак. Как мы можем видеть звёзды? Даже атеисты скажут, что звёзды так далеко, что они кажутся точками света. Мы не можем видеть их размера или формы. Тогда как можно различить разные типы звёзд? Для большинства звёзд есть только одна видимая характерная черта: цвет их света. Невозможно увидеть их размера, только цвет. Посмотрев на самую близкую звезду через самый сильный телескоп, вы увидите точку. Перед запуском сильного телескопа меня спросили: «Доктор Ховинд, вы боитесь, что они смогут доказать эволюцию?» Я сказал: «Нет. Я знаю, что они там найдут». Они спросили: «Что?» Я сказал: «Они увидят ещё больше звёзд». И это то, что они нашли. Ещё множество звёзд. У нас громадный Бог.'
  rating: orange
  verdict: Что почти все звёзды даже в телескоп видны точками, верно. Но по свету звезды узнают её состав, температуру и скорость, а у некоторых звёзд, например у гиганта Бетельгейзе, уже сфотографирован диск.
  arguments:
  - distant-starlight
  rhetoric:
  - personal-story

- id: lecture-7-309
  start: 309.9
  end: 332.6
  text: 'Если вы хотите узнать расстояние до далёкого предмета, вы используете тригонометрию. Кто из нас из вас изучал тригонометрию в школе? Я обучал тригонометрии в школе. Мне нравится этот класс, что-то практичное. Вы изучаете алгебру, потом тригонометрию, и студенты спрашивают: «Когда мне это пригодится?» Я говорю: «Наверное, никогда. Только в пятницу на экзамене».'
  rating: neutral
  verdict: Шутка о тригонометрии — подводка к объяснению, как измеряют расстояния до звёзд.

- id: lecture-7-334
  start: 334.7
  end: 367.2
  text: В тригонометрии, если вы хотите измерить расстояние до далёкого предмета, вам нужны две точки наблюдения. Знать расстояние между точками и измерить углы. Это не очень сложно. Для этого есть несколько формул, как, например, синус, косинус и тангенс. И также несколько других. Ну, как можно узнать расстояние к звезде? Очевидно, вы не можете пойти и измерить расстояние. Тогда как можно его измерить? Можно поставить двое человек с противоположных сторон Земли, этим увеличив основание треугольника.
  rating: green
  verdict: 'Верно: расстояние до недоступного предмета находят треугольником — по базе между двумя точками наблюдения и углам. Так работают и землемеры, и астрономы.'

- id: lecture-7-370
  start: 370.5
  end: 430.8
  text: Но диаметр Земли ничто в сравнении со звёздным расстоянием. И поэтому нам нужна большая основа. Для увеличения расстояния было решено смотреть на звезду в январе, потом подождать 6 месяцев — это полпути вокруг Солнца — и смотреть на звезду в июне. И тогда у нас будет большая основа для треугольника. Орбита Земли вокруг Солнца создаёт гигантский круг. Однако это только 16 световых минут в диаметре. Вместо расстояния в километрах мы перейдём на световые минуты. От Земли до Солнца 8 световых минут. Значит, диаметром будет 16 световых минут. Но один год состоит из 525 948 минут. И если вы посмотрите на звезду на расстоянии одного светового года, хотя таких близких звёзд нет,
  rating: green
  verdict: 'Верно: базой астрономы берут орбиту Земли, наблюдая звезду с промежутком в полгода. Это годичный параллакс; звёзд ближе светового года действительно нет.'

- id: lecture-7-431
  start: 431.3
  end: 490.9
  text: но если вы посмотрите на эту звезду с противоположных концов орбиты Земли… Мы переведём всё в сантиметры, чтобы было легче. Два наблюдателя будут находиться на расстоянии 16 см. И они в телескопы смотрят на звезду на расстоянии 525 948 сантиметров, что составляет 5 км 260 м. Если два человека на расстоянии 16 см будут смотреть на точку на расстоянии 5 км 260 м, вы согласитесь, что это образует очень тоненький треугольник? Это чтобы измерить один световой год, используя орбиту Земли вокруг Солнца. И это образует угол в 0,0017°. Если вы захотите измерить 100 световых лет, вам придётся передвинуть точку на 526 км с основой в 16 см.
  rating: orange
  verdict: 'Модель в сантиметрах наглядна, и угол посчитан верно: около 0,002°. Но Ховинд умалчивает главное: такие крошечные углы астрономы действительно измеряют.'
  arguments:
  - distant-starlight
  rhetoric:
  - scale-trick

- id: lecture-7-491
  start: 491.8
  end: 527.8
  text: Я хочу заметить, что такой угол измерить очень трудно. Также трудно точно определить, где мы были на орбите ровно 6 месяцев назад. Не думаете ли вы, это было бы предположением, говоря, где точно мы были? Нужно быть очень точным, мы говорим об очень маленьких числах. Просто невозможно измерить расстояние к звёздам. Это невозможно. В учебнике говорится, что можно измерить расстояние в 100 световых лет. Я сомневаюсь, но пусть будет 100. Пусть будет 500. Ну, вы не сможете измерить 10 млрд. Конгресс не знает, но между 500 и 10 млрд есть разница.
  rating: red
  verdict: 'Что угол очень мал, верно. Но из космоса, где воздух не мешает, сдвиг звезды за полгода меряют так точно, будто из Москвы видят монету в Лиссабоне: спутник «Гиппаркос» измерил так более 100 000 звёзд, а «Гайя» — больше миллиарда.'
  arguments:
  - distant-starlight
  rhetoric:
  - argument-by-incredulity

- id: lecture-7-529
  start: 529.5
  end: 550.9
  text: Во-первых, мы не можем измерять расстояние, они могут находиться на больших расстояниях. Я не знаю, вы не знаете. И никто не знает, как они далеко. Во-вторых, мы не знаем, что свет всегда движется с одной скоростью. Мы даже не знаем, что такое свет. Никто не знает, что такое свет. Мы знаем, что он делает, но никто не знает основной характеристики. Что такое свет?
  rating: red
  verdict: 'Что о природе света ещё есть вопросы, верно. Но свет — одно из самых изученных явлений: его скорость в пустоте измерена очень точно, а расстояния до множества звёзд известны.'
  arguments:
  - speed-of-light-decay

- id: lecture-7-551
  start: 551.3
  end: 565.5
  text: И мы не знаем, что свет движется с одинаковой скоростью. Кстати, идея чёрных дыр в том, что сила тяжести влияет на свет. Что свет может остановиться при достаточной силе тяжести. С чего видно, что скорость света не постоянна.
  rating: orange
  verdict: 'Что тяготение действует на свет, верно. Но чёрная дыра не тормозит свет: её притяжение так сильно, что свет просто не может вырваться наружу. Скорость света в пустоте от этого не меняется.'
  arguments:
  - speed-of-light-decay
  rhetoric:
  - podmena-ponyatij

- id: lecture-7-565
  start: 565.9
  end: 572.8
  text: В 99-м году скорость света была замедлена до 60 км/ч. Интересно.
  rating: orange
  verdict: 'Что свет можно замедлить, верно: в 1999 году его замедлили примерно до 60 км/ч, пропуская через охлаждённый газ. Но постоянна скорость света в пустоте, и опыт в веществе о ней ничего не говорит.'
  arguments:
  - speed-of-light-decay
  rhetoric:
  - podmena-ponyatij

- id: lecture-7-574
  start: 574.0
  end: 628.7
  text: Я не думаю, что скорость света постоянная. Кстати, для измерения скорости света используются атомные часы. Как-то один астроном — я уже забыл его имя — он заметил, что скорость света замедляется. По записям за последние 100 лет скорость уменьшалась. С помощью графика он установил, что за последние 100 лет скорость света уменьшалась. И прекратила уменьшаться в 1962 году. Это когда начали использовать атомные часы для определения скорости света. Подождите. Если атомные часы используют колебания цезиевого атома 133, тогда, если скорость света и замедляется, то часы замедляются тоже. И это называется «резиновый метр». И неудивительно, что больше не заметно уменьшения скорости света. Они измеряют свет светом.
  rating: red
  verdict: 'Это довод Барри Сеттерфилда: разброс старых, менее точных измерений он принял за спад скорости. Скорость света проверяли разными независимыми способами, а креационистские организации сами советуют этим доводом не пользоваться.'
  arguments:
  - speed-of-light-decay
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-629
  start: 629.1
  end: 651.1
  text: 'В-третьих, когда Бог закончил, творение было совершенно. Бог не создал двух детей в Эдемском саду, не дал им мешок семян и не сказал: «Посадите их, это ваш обед». Нет, это были взрослые люди в цветущем саду. Всё было совершенно. Деревья были выросшими, на деревьях уже росли фрукты. Адам и Ева были взрослыми, и был виден звёздный свет.'
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил Адама и Еву взрослыми, и обмана в этом нет. Но свет далёких звёзд несёт «записи» событий, например взрывов звёзд. Свет, созданный в пути, был бы как видео пожара в доме, который никогда не горел, а Бог не обманывает.
  arguments:
  - distant-starlight

- id: lecture-7-652
  start: 652.7
  end: 688.7
  text: У нас, людей, есть проблема. Мы пытаемся поставить наши ограничения на Бога. Мы можем быть только в одном месте в данный момент. И мы предполагаем, что и Бог может быть только в одном месте в данный момент. Большая ошибка в логике. Мы думаем, что Бог может делать только то, что мы можем делать. Ну, я бы не поклонялся такому Богу. Мой Бог безграничный, всесильный, всезнающий, всемогущий, может делать всё, всесильный и вездесущий. Он всё знает, он всё видит, и он всё равно нас любит. Хвалите Бога за его милость.
  rating: neutral
  verdict: 'Мы согласны: Бог безграничен, и мерить Его нашими мерками нельзя. Вопрос лишь в том, что Он сделал, а это мы узнаём и из Писания, и из самого творения.'

- id: lecture-7-691
  start: 691.6
  end: 743.4
  text: 'Люди спрашивают: не доказывает ли красное смещение, что звёзды на расстоянии миллиардов лет? Когда свет проходит через призму, свет разлагается на красный, оранжевый, жёлтый, зелёный, синий, фиолетовый. Если посмотреть на спектр света звезды, то красный свет смещён от своего нормального положения. Оттуда и выражение «красное смещение». И они думают, что можно узнать расстояние к звёздам, если красное смещение указывает на эффект Доплера. Мы знаем, что эффект Доплера действует на звук. Например, когда к вам приближается поезд, он сближает звуковые волны вместе. И поэтому мы слышим высокий звук. И если поезд удаляется, то звук начинает уменьшаться. Это эффект Доплера. Поэтому предполагается, что звёзды удаляются так быстро, что доходящий до нас свет будет рассеян с помощью эффекта Доплера. Интересная теория, но не доказана.'
  rating: orange
  verdict: 'Эффект Доплера Ховинд объясняет верно. Но «теория» в науке — не догадка: связь красного смещения с расстоянием проверена независимыми способами, например по цефеидам — звёздам-«маякам», настоящую яркость которых узнают по тому, как часто они мигают.'
  arguments:
  - distant-starlight
  rhetoric:
  - podmena-ponyatij

- id: lecture-7-744
  start: 744.2
  end: 783.8
  text: Никто с уверенностью не знает, что причиняет красное смещение. Однако эксперты скажут, что раньше были признаки того, что красное смещение указывает на расстояние к галактикам. Это для квазаров. Однако диаграмма показывает широкую рассеянность в явном сиянии красного смещения. На самом деле почти нет соотношения сияния к красному смещению. Либо у квазаров очень широкий диапазон внутреннего свечения — это их сияние, — как думают многие люди, или же их красное смещение не указывает на расстояние. Если кто-то скажет, что он знает расстояние к звезде по красному смещению, извините, вы не знаете, разницу определить просто невозможно.
  rating: red
  verdict: Что яркость квазаров сильно различается, верно. Но связь красного смещения с расстоянием проверяют по галактикам с известным расстоянием, а не по квазарам; для звёзд нашей Галактики красное смещение вообще не используют.
  arguments:
  - distant-starlight
  rhetoric:
  - cherry-picking

- id: lecture-7-784
  start: 784.4
  end: 820.6
  text: Возможно, что из-за оболочки воды, которая была вокруг Земли до потопа, звёзды были видны лучше. Было проведено интересное исследование, что оболочка льда вокруг Земли могла бы быть как фотоусилитель. Адам, наверное, видел звёзды лучше, чем мы. Если атмосфера была сжата до 15—20 км вместо 150 км, не только дышать было бы легче, но было бы меньше атмосферного искажения. Например, вы знаете, как мерцают звёзды? Но за атмосферой они не мерцают.
  rating: red
  verdict: 'Что атмосфера мешает разглядывать звёзды, верно: поэтому телескопы ставят в горах и выводят в космос. Но водяного или ледяного покрова над Землёй не было, а «исследование» Ховинд не называет.'
  arguments:
  - vapor-canopy
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-821
  start: 821.6
  end: 886.2
  text: Красное смещение не определяет расстояние. «Новости науки». Ещё один ряд наблюдений указывает, что Вселенная как выглядит от 8,4 до 10,6 млрд лет. Работа основывается на показаниях космического телескопа «Хаббл» для получения расстояния к далёким галактикам. Группа во главе с этими англичанами использовали двойной метод для определения константы. Подождите. Как можно определить константу? Эта константа является одним из множителей в формуле получения расстояния. И эту константу нужно определить. Не думаете ли вы, что это изменит результат вашей формулы? Раньше говорили, что Вселенной 20 млрд лет, потом 18, потом 16. Сейчас они говорят 8 или 10. Я думаю, они не знают. Приходя к выводам, необходимо быть очень осторожными, потому что все измерения константы Хаббла содержат огромные систематические ошибки. Я с этим согласен.
  rating: red
  verdict: 'Что оценки постоянной Хаббла в 1990-х расходились, верно. Но уточнение — нормальная работа науки: сегодня разные методы дают возраст Вселенной около 13,8 млрд лет, и ни один не даёт тысяч.'
  arguments:
  - distant-starlight
  rhetoric:
  - cherry-picking

- id: lecture-7-887
  start: 887.0
  end: 910.3
  text: Как я сказал, всё, что вы видите, — это точка света. Смотря на самую близкую звезду Альфа Центавра через самый сильный телескоп, вы увидите точку. Мы не знаем их размера или на каком они расстоянии. Я думал, что Бог сотворил звёзды для того, чтобы мы могли посмотреть на звёзды и сказать Какому всесильному Богу мы поклоняемся? Аминь.
  rating: red
  verdict: Повтор (разбор на 4:18). Звёзды видны точками, но расстояние до Альфы Центавра — около 4,3 светового года — измерено по параллаксу ещё в 1838–1839 годах.
  arguments:
  - distant-starlight

- id: lecture-7-910
  start: 910.9
  end: 934.5
  text: 'Даже ближайшие цефеиды так далеко, что трудно определить их полное расстояние с любой точностью. Все большие расстояния в астрономической литературе содержат ошибки на 10%. Только по этой причине. И мы знаем, что тусклость — это яркость звезды — является результатом двух причин: расстояния и поглощающего элемента в космосе. И как правило, невозможно точно установить разницу между двумя.'
  rating: orange
  verdict: Что большие расстояния известны с погрешностью и что пыль ослабляет свет, верно. Но погрешность в 10% не превращает миллиарды световых лет в тысячи, а пыль не только ослабляет свет, но и краснит его, поэтому её учитывают по цвету звёзд.
  arguments:
  - distant-starlight
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-935
  start: 935.2
  end: 963.3
  text: 'В основном вот что происходит. Они смотрят на звезду и говорят: «Эта звезда яркая, а вот эта не яркая, значит, она находится дальше». Не нужно быть умным, чтобы предположить, что эта звезда ярче, потому что она ближе. Или потому, что она ярче, или потому, что между ней и нами нет облака пыли. Мы просто не знаем. И не разрешайте кому-то говорить: «Мы знаем, что Вселенной миллиарды лет, потому что звёзды находятся на расстоянии миллиардов световых лет».'
  rating: red
  verdict: Астрономы не судят о расстоянии по одной яркости. Если знаешь, что лампочка на 100 ватт, по её тусклости поймёшь, далеко ли она. Так и у звёзд-«маяков» (мигающих цефеид, взрывов-сверхновых) настоящая яркость известна заранее, а пыль учитывают отдельно.
  arguments:
  - distant-starlight
  rhetoric:
  - straw-man

- id: lecture-7-964
  start: 964.9
  end: 978.0
  text: 'В Библии написано, что Бог восседает над кругом Земли. Христиане всегда знали, что Земля круглая. Потом там говорится, что он распростёр небеса. Это повторяется в нескольких местах в Библии: «Распростёр небеса».'
  rating: purple
  verdict: Мы тоже верим, что Бог «восседает над кругом земли». Но «круг» в Ис 40:22 — образ, а не сообщение о шаре; о шарообразности Земли писали ещё греческие учёные до Христа.
  arguments:
  - bible-science-foreknowledge

- id: lecture-7-979
  start: 979.4
  end: 1001.5
  text: Может, поэтому и существует красное смещение из-за растягивания небес. Бог сказал, и всё распростёрлось. Я не знаю. Красное смещение могло произойти из-за растягивания небес, может, свет теряет скорость после больших расстояний или из-за эффекта Доплера. Или свет меняет скорость, проходя возле чёрной дыры или галактики. Но фактом является то, что мы не знаем причины.
  rating: orange
  verdict: 'Любопытно, что «растяжение небес» близко к принятому объяснению: красное смещение галактик вызвано расширением пространства. Неверно лишь, что причина неизвестна; «уставший свет» проверяли, и он с наблюдениями не сходится.'
  arguments:
  - distant-starlight

- id: lecture-7-1002
  start: 1002.5
  end: 1053.5
  text: Интересная вещь. Я не хочу сегодня отвлекаться из-за недостатка времени, но, может, вы заинтересуетесь изучением подлинных символов Зодиака? Очевидно, когда Бог сотворил Землю, у Адама не было Библии. И выглядит, что Бог мог дать Адаму историю Евангелия в звёздах. И все созвездия Зодиака рассказывают Евангелие, как Дева родит Сына, и Он станет львом, который будет царствовать. И в середине всего этого появится дракон, пытаясь всё разрушить. Интересная история о Евангелии в звёздах. В Библии говорится о разных созвездиях. Хима, Кесиль. Поэтому, возможно, что первоначальное Евангелие было в звёздах. И сегодня, конечно же, оно извращено в гороскоп. Очень интересно изучать созвездие. Но, однако, сейчас у нас нет много времени.
  rating: purple
  verdict: Мы тоже верим, что «небеса проповедуют славу Божию» (Пс 18:2). Но мысль, что созвездия Зодиака изначально пересказывали Евангелие, — догадка XIX века; в Писании её нет.
  arguments:
  - pyramid-prophecy

- id: lecture-7-1056
  start: 1056.6
  end: 1100.5
  text: Почему Бог использовал потоп, а не сделал чудо и просто не уничтожил всех людей? Бог мог сделать и так. Как я уже сказал на кассете шестой, потоп оставил доказательства, в отличие от чуда. И результаты потопа должны напоминать нам о том, что сделал Бог. Также было предупреждение. Может, у Ноя взяла 100 лет на постройку ковчега? Людям дано было 100 лет для размышления. Покайтесь. Но они не захотели. Не очень умное решение. В Библии написано, что Бог долготерпел во дни Ноя. Я думаю, что потоп показывает божью милость и долготерпение. Он им дал, может, ещё 100 лет. Он славный Бог.
  rating: purple
  verdict: 'Что потоп показывает и суд, и долготерпение Божье (1 Пет 3:20), мы тоже верим. Но геологических следов всемирного потопа нет: слои Земли говорят о долгой истории (разбор лекции 6).'
  arguments:
  - flood-geology-general

- id: lecture-7-1102
  start: 1102.3
  end: 1148.6
  text: Как насчёт датирования углеродом? Это очень популярный вопрос. Я хочу объяснить, что такое датирование углеродом. Когда солнечный свет или звёздный свет попадает в атмосферу, он производит радиоактивный углерод. Углерод 14. Радиоактивный углерод нестабильный и начинает, как говорится, распадаться. При распадении он следует предсказуемому периоду полураспада. Углерод 14 радиоактивный. Если вы используете счётчик Гейгера, то вы услышите щелчки. Он показывает радиоактивность углерода. Углерод 14 распадается. И в лаборатории установили, что нужно 5 730 лет для распада половины углерода 14.
  rating: green
  verdict: 'Верно, с одной поправкой: радиоуглерод образуется не от солнечного света, а от космических лучей. Половина его действительно распадается примерно за 5730 лет.'

- id: lecture-7-1150
  start: 1150.4
  end: 1189.7
  text: Я попытаюсь объяснить, как это происходит, чтобы все поняли, что это не так трудно. Значит, углерод 14 распадается. Наша атмосфера содержит 78% азота, 21% кислорода и 0,06% углекислого газа и 0,0000765% радиоактивного углерода. Молекулы радиоактивного углерода и кислород производят углекислый газ. Растения дышат углекислым газом. Но растениям всё равно, радиоактивный углекислый газ или нет. Им нет разницы.
  rating: neutral
  verdict: 'Азот и кислород названы верно, углекислого газа на деле около 0,04%, а не 0,06%. А радиоуглерода в воздухе в миллионы раз меньше названного: примерно один атом на триллион атомов углерода. На принцип метода это не влияет.'

- id: lecture-7-1193
  start: 1193.8
  end: 1233.7
  text: Растения дышат углекислым газом. И этот процесс называется фотосинтез. Они поглощают углекислый газ, перемешивают его с водой, солнечным светом и хлорофиллом и производят сахар. И кислород. И в молекулах сахара находится радиоактивный и простой углерод. Но растения об этом не знают. Потом приходят животные. Едят растения и таким способом радиоактивный углерод попадает в наши тела. И в каждом из нас есть маленькая молекула радиоактивного углерода. Потому что мы съели растение или животное, которое съело растение с радиоактивным углеродом.
  rating: green
  verdict: 'Верно: радиоуглерод попадает в растения при фотосинтезе, а в животных и людей — с пищей.'

- id: lecture-7-1234
  start: 1234.7
  end: 1266.7
  text: Когда растение или животное умирает, углерод 14 больше не прибавляется. Предполагается, что количество углерода 14 в атмосфере, Пропорция. Очень маленькая фракция. Предполагается, что эта пропорция такая же, как и в нас и в растениях. Возможно, это и так, я не знаю, и никто не знает, какая пропорция. Так как в атмосфере находится 0,0000765%, они предполагают, что в растениях и животных находится такое же количество.
  rating: orange
  verdict: 'Ховинд честно говорит, что это возможно. Но долю радиоуглерода в живых организмах измеряют, а её изменения в прошлом восстановлены по годичным кольцам деревьев: их возраст известен простым счётом колец, и по ним даты поправляют.'
  arguments:
  - radiometric-dating

- id: lecture-7-1268
  start: 1268.2
  end: 1308.2
  text: 'После смерти растения или животного углерод 14 начинает распадаться. И около половины распадается за 5 730 лет. И в теории говорится, если вы нашли ископаемое, в котором содержится углерод, и если в нём находится только половина нужного количества углерода 14, то тогда вы говорите, что она умерла 5 730 лет назад. Потому что половина углерода 14 распалась. Как это измеряется? Полжизни: одна четвёртая, одна восьмая, одна шестнадцатая, одна тридцать вторая. И так далее. Обычно после пяти полужизней нельзя измерить разницу.'
  rating: green
  verdict: Принцип расчёта верен. Только современные приборы измеряют радиоуглерод не до пяти, а примерно до девяти периодов полураспада — около 50 000 лет.

- id: lecture-7-1309
  start: 1309.5
  end: 1341.6
  text: Если кто-то вам скажет, что Вселенной миллиарды лет по датированию углеродом, будьте уверены, что они даже не знают, о чём они говорят. Даже если бы датирование помогло, то не больше, чем на 30—40 тыс. лет. И когда они говорят «миллионы лет», забудьте о них. Они не знают, о чём они говорят. Датирование работает только на несколько тысяч лет. Так кажется, что оно работает на несколько тысяч лет. Ну, есть много явных предположений. Я объясню.
  rating: orange
  verdict: 'Верно: радиоуглеродом нельзя измерить миллионы лет, и учёные так не делают. Возраст пород измеряют другими изотопами — ураном, калием, рубидием, у которых периоды полураспада в миллиарды лет.'
  arguments:
  - radiometric-dating
  rhetoric:
  - straw-man

- id: lecture-7-1342
  start: 1342.1
  end: 1352.4
  text: Предположение первое. Они предполагают, что количество углерода 14 в атмосфере всегда было одинаковым. И мы знаем, что это неправда. Я сейчас покажу.
  rating: orange
  verdict: 'Что доля радиоуглерода в атмосфере менялась, верно, и учёные знают это с 1950-х. Поэтому даты поправляют по образцам известного возраста: годичным кольцам деревьев, озёрным слоям, которые ложатся по одному в год, и кораллам.'
  arguments:
  - radiometric-dating

- id: lecture-7-1353
  start: 1353.3
  end: 1392.7
  text: 'Если я вам скажу: «Наполнить бочку водой, в которой я сделал дырки»? При наполнении вода начинает выливаться в дырки. Два процесса происходят одновременно. Наполнение и утечка. В итоге вы достигнете стадию равновесия. Вы никогда не сможете заполнить бочку. Понимаете? Вода вытекает со скоростью прибывания, так как чековая книжка. Солнечный свет производит углерод 14. Это называется процесс наливания. Распад углерода — это процесс выливания.'
  rating: neutral
  verdict: 'Аналогия с дырявой бочкой честная: образование и распад радиоуглерода действительно стремятся к равновесию.'

- id: lecture-7-1394
  start: 1394.2
  end: 1447.5
  text: 'Было решено, что атмосфера достигает равновесия за 30 000 лет. Это значит, что если бы вы создали новую Землю из ничего, как написано в Библии, и поставили её в Солнечную систему, то за 30 000 лет она уравновесится с постоянным количеством углерода 14. Но атмосфера Земли ещё не достигла равновесия. Что доказывает, что Земле ещё даже нет 30 000 лет. Когда только было придумано датирование углеродом в пятидесятых годах, Либби сказал: «Мы знаем, что Земле миллионы лет. Поэтому мы можем забыть за проблему равновесия». Извините. Здесь ваша ошибка. Равновесие ещё не достигнуто, и Земле нет миллионов лет. Только около 6 000 лет.'
  rating: red
  verdict: 'Что радиоуглерода сейчас образуется больше, чем распадается, заметили сами учёные. Но кольца деревьев показывают: тысячи лет его уровень то рос, то падал, а не копился от нуля: магнитное поле Земли и Солнца, как зонтик, то сильнее, то слабее заслоняет от космических лучей.'
  arguments:
  - radiometric-dating
  rhetoric:
  - quote-mining

- id: lecture-7-1448
  start: 1448.2
  end: 1478.5
  text: Есть график, по которому они определяют возраст предмета. Шестнадцать щелчков счётчика Гейгера указывают на количество углерода 14 в атмосфере сегодня. 8 щелчков указывает на возраст 5 730 лет. Я всё немного упрощаю. Четыре щелчка — 11 000 лет. Два щелчка — 17 000 лет. Если вы получаете два с половиной щелчка, вы устанавливаете возраст по кривой. Вот как это происходит.
  rating: green
  verdict: 'Упрощение честное: по доле оставшегося радиоуглерода возраст находят по кривой распада.'

- id: lecture-7-1480
  start: 1480.4
  end: 1562.5
  text: 'Если вы зайдёте в комнату и увидите горящую свечу, я вас спрошу: «Когда зажгли свечу?» Вы скажете: «Я не знаю, я только что пришёл». Хорошо. Давайте посмотрим или мы сможем узнать, когда она была зажжена. Это эмпирическая наука. Мы измерим длину свечи. Мы измеряем очень внимательно и устанавливаем, что длина 17 см. А теперь кто может мне сказать, когда она была зажжена? Это не поможет? Давайте измерим скорость сгорания свечи. Мы засекаем время олимпийским секундомером до точности. И после обсуждения и публикации статей мы соглашаемся, что скорость сгорания — один сантиметр за час. У нас есть два фактора: высота и скорость сгорания. Кто мне скажет, сколько она горела до того, как мы пришли? Никто. Я скажу вам почему. Теперь нам придётся перейти к предположениям. Первое предположение. Какая начальная высота? Двадцать метров. 20 км, 20 см. Мы не знаем. Предположение второе: горела она всегда с одинаковой скоростью. Неизвестно.'
  rating: orange
  verdict: 'Аналогия со свечой верна в одном: нужны начальное количество и скорость. Но скорость распада изотопов не меняется ни от жары, ни от давления, а начальное количество проверяют: сравнивают несколько разных минералов из одного камня, и по ним видно, сколько продукта распада было в самом начале.'
  arguments:
  - radiometric-dating
  rhetoric:
  - appeal-to-doubt

- id: lecture-7-1563
  start: 1563.4
  end: 1597.9
  text: Найдя ископаемое, вы можете измерить количество углерода. Вы можете узнать скорость распада. И тогда вы начнёте предполагать. Сколько было углерода до смерти? Распадался ли он с одной скоростью? Мы не знаем. Если над землёй была оболочка воды или льда, как написано в Библии… То количество углерода было бы ещё меньше И потоп, когда Земля полностью покрылась водой, это полностью изменит количество углерода в атмосфере. Это радикально нарушит все нормы после потопа.
  rating: red
  verdict: Скорость распада известна и проверена опытами. Водяного покрова над Землёй не было, а ряды годичных колец деревьев идут без перерыва дальше чем на 4400 лет назад, через предполагаемый потоп.
  arguments:
  - radiometric-dating

- id: lecture-7-1600
  start: 1600.6
  end: 1613.1
  text: Предположим, что до потопа было только два щелчка в минуту. Мы нашли ископаемое только с одним щелчком в минуту. Мы предположили, что всё начинается с шестнадцати щелчков. И посчитали возраст 20 000 лет.
  rating: orange
  verdict: Арифметика примера верна. Но допущение «до потопа было два щелчка» ничем не подтверждено, а реальную долю радиоуглерода в прошлом измеряют по кольцам деревьев и сталагмитам.
  arguments:
  - radiometric-dating

- id: lecture-7-1614
  start: 1614.6
  end: 1634.3
  text: Когда это не так? Я приведу несколько примеров. Оболочка живого моллюска датирована в возрасте 2300 лет. Живые моллюски. Свежеубитому тюленю дали 1300 лет. Оболочке живой улитки по датированию дали 27 000 лет.
  rating: orange
  verdict: 'Такие даты действительно получались. Это «резервуарный эффект»: моллюски и тюлени получают углерод из морской воды или известняка, где радиоуглерода меньше. Учёные сами описали эти случаи и вводят поправки.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1635
  start: 1635.7
  end: 1678.1
  text: Одной части мамонта было 29 000 лет, другой— 44 000 лет. Две части одного животного. Одной части найденного мамонта было 40 000 лет, другой— 26 000. А дереву под мамонтом было только 9 000 лет. Какую же дату опубликуют? Ноге мамонта Фэрбанкского залива было 15 000 радиоактивных лет. Когда коже была 21 000. Снова две даты с одного животного. Двум мамонтам с одного места было 22 и 16 000 лет. К какой дате вы поверите? Живых пингвинов датировали в возрасте 8 000 лет.
  rating: orange
  verdict: 'Разброс дат мамонтов бывает: старые образцы загрязняются современным углеродом. Но часть «двух дат» взята от разных мамонтов, у мамонтёнка Димы даты сходятся, а сам метод сверяют с кольцами деревьев, возраст которых известен счётом. Живых пингвинов «старит» морской углерод, как и тюленя.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1679
  start: 1679.5
  end: 1718.5
  text: В Калифорнии Карл Свишер использует самые последние методы датирования человеческих ископаемых. Хомо эректус и Хомо сапиенс. Он думал, что Хомо эректус жил 250 000 лет. И он начинает датирование с предвзятым мнением. Ему нужно получить 250 000 лет. Но он получал поразительные даты. От 27 000 до 53 000 лет. Я хочу заметить, что это 96%-я ошибка. И это и самый лучший метод.
  rating: red
  verdict: 'Свишер в 1996 году действительно получил для яванских Homo erectus 27–53 тыс. лет. Это была ошибка, и нашли её сами учёные: повторные измерения разными методами сошлись на 108–117 тыс. лет. Даты уточняют открыто, а не скрывают.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1721
  start: 1721.1
  end: 1730.2
  text: Как долго они продержатся в суде? «Судья, я не прав на 96%, но вы должны посадить этого человека».
  rating: neutral
  verdict: Шутка про суд к предыдущему примеру; ответ на него — выше.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-1731
  start: 1731.3
  end: 1742.2
  text: Если вы датируете образец известного возраста, датирование неверно. Если вы датируете образец неизвестного возраста, предполагается, что датирование верно.
  rating: red
  verdict: 'Наоборот: методы проверяют именно на образцах известного возраста — кольцах деревьев, исторических извержениях, — и в своих границах они дают верные даты. Ошибки бывают, когда метод применяют вне его границ.'
  arguments:
  - radiometric-dating
  rhetoric:
  - straw-man

- id: lecture-7-1745
  start: 1745.4
  end: 1770.5
  text: 'Датируя ископаемое, они датируют его по слою геологической колонны, в которой оно и найдено. Ископаемые были и продолжают быть лучшим и наиболее точным методом датирования и соотношения камней, в которых они находятся. Один человек сказал:«Я не могу вспомнить ни одного случая с использованием радиоактивного распада для датирования ископаемых». Они не датируют ископаемые по углероду. Они говорят: возраст ископаемого по слою камня.'
  rating: red
  verdict: Что слои сопоставляют по окаменелостям, верно. Но порядок слоёв верующие геологи установили ещё до Дарвина, просто глядя, что лежит сверху, а что снизу. Годы появились позже, из тысяч измерений прослоек вулканического пепла.
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-7-1770
  start: 1770.8
  end: 1778.2
  text: Всё основано на геологической колонне, о которой мы говорим на кассете четвёртой. Её не существует. Разве что в учебниках.
  rating: red
  verdict: Что полной колонны в одном месте обычно нет, верно. Но в некоторых местах, например в Уиллистонском бассейне (Северная Дакота), есть слои всех периодов, а в других колонну складывают из перекрывающихся частей, как карту из соседних листов.
  arguments:
  - fossil-layers

- id: lecture-7-1779
  start: 1779.7
  end: 1805.2
  text: Радиометрическое датирование не было бы осуществимо, если бы геологическая колонна не появилась вначале. Камни датируют ископаемые, но ископаемые датируют камни намного точнее. Стратиграфия не может избежать такой аргументации. Если эта наука настаивает на использовании только временных принципов, потому что кругообразие свойственно. Это всё основано на круговой аргументации. Посмотрите кассету четвёртую.
  rating: red
  verdict: 'Цитаты даны без источника. Круга здесь нет: порядок слоёв видно в обрывах, окаменелости лишь помогают узнать тот же слой в другом месте, а годы дают измерения прослоек вулканического пепла, которым эволюция не нужна.'
  arguments:
  - fossil-layers
  rhetoric:
  - quote-mining

- id: lecture-7-1805
  start: 1805.6
  end: 1822.5
  text: За последние два года была получена абсолютная дата для пласта над слоями Тринил, которая содержит интересный показатель в 300 000 лет плюс или минус 300 000 лет. Ха, интересно, какой же всё-таки возраст? А, всё, я понял.
  rating: orange
  verdict: Большая погрешность — честное указание, что метод в этом случае дал мало. Учёные не прячут погрешностей, а уточняют дату другими способами.
  arguments:
  - radiometric-dating
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-1823
  start: 1823.7
  end: 1831.9
  text: Лунные камни были отданы в шесть разных лабораторий и были получены шесть разных возрастов. От 2,5 до 4,6 млрд лет.
  rating: red
  verdict: 'Лунные образцы действительно разного возраста: это разные породы, застывшие в разное время. Но все их даты — миллиарды лет; ни одна лаборатория не получила тысяч.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1833
  start: 1833.3
  end: 1860.5
  text: 'Я разговаривал с Дасоном. Вот его номер телефона и адрес веб-страницы. Он был ответственным за датирование камней Луны для НАСА. Я спросил его: «Сколько лет камням?» Он сказал: «Мы не знаем». Мы получили даты от 10 000 лет до нескольких миллиардов лет. Он сказал: «Какой возраст вам нужен?» Выбирайте.'
  rating: red
  verdict: Пересказ частного разговора проверить нельзя, а научные статьи можно. Опубликованные даты лунных пород лежат в пределах примерно 3–4,5 млрд лет; «10 000 лет» среди них нет.
  arguments:
  - radiometric-dating
  rhetoric:
  - personal-story

- id: lecture-7-1862
  start: 1862.0
  end: 1899.1
  text: В этой книге есть замечательная глава о датировании. Последняя глава показывает, как они могут изменять даты при возникновении нужды. Например, они датируют слой пепла с помощью калия-аргона. При извержении вулкана образуется слой пепла. И в теории говорится, что если ископаемое найдено под слоем пепла, оно должно быть старше. Ископаемое над слоем пепла должно быть моложе. Звучит неплохо. И они просто датируют эти слои. И если ископаемое найдено между слоями, возраст должен быть между двумя датами слоёв.
  rating: orange
  verdict: 'Метод описан верно: ископаемое между двумя слоями пепла моложе нижнего и старше верхнего. А обвинение, что даты «меняют по нужде», построено на одной истории, разобранной ниже.'
  arguments:
  - radiometric-dating
  rhetoric:
  - loaded-language

- id: lecture-7-1900
  start: 1900.3
  end: 1933.9
  text: Но существует проблема. Слою пепла КБС было 212–230 млн лет. Это был общепринятый возраст пепла КБС в 1970 году. В 1972 году Ричард Лики нашёл совершенно нормальный череп современного человека под пеплом КБС. Подождите. Много лет они учили детей, что люди развились всего несколько миллионов лет назад. Ну, этому черепу 200 млн.
  rating: red
  verdict: 'Ещё в 1970 году слой вулканического пепла KBS датировали 2,6 млн лет, а пробы с сотнями миллионов лет признали загрязнёнными обломками древних пород. Череп 1470 — не современный человек, а вымерший Homo rudolfensis: мозг около 750 см³, почти вдвое меньше нашего.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1935
  start: 1935.1
  end: 1954.4
  text: Значит, либо вы должны сказать, что человек жил 200 млн лет, что полностью опровергает эволюцию. Или вы должны изменить возраст пепла КБС. Если бы они не нашли этот череп, они не изменили бы даты. Эта находка заставила их изменить даты этого слоя пепла.
  rating: red
  verdict: Дату этого слоя пепла действительно пересмотрели, но с 2,6 до 1,9 млн лет, а не с 212 млн. Спор шёл открыто десять лет, и решили его повторные измерения разными методами.
  arguments:
  - radiometric-dating
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-7-1956
  start: 1956.0
  end: 1975.6
  text: Они взяли 10 образцов пепла. И возраст слоя пепла теперь от полумиллиона до 2,5 млн лет. В отличие от 212 млн лет. Я хочу заметить, что это пятисотная ошибка. Опять я должен повторить, что они не знают возраста.
  rating: red
  verdict: «Ошибка в 500 раз» получается, только если считать загрязнённую пробу общепринятой датой. Окончательный возраст слоя пепла — около 1,9 млн лет — подтверждён несколькими методами.
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-1976
  start: 1976.5
  end: 2006.8
  text: В 1770 году Жорж Бюффон сказал, что Земле 70 000 лет. В 1905 году Земле официально было 2 млрд лет. Что случилось за 200 лет? Кстати, сегодня студентам говорят, что Земле 4,6 млрд лет. Выглядит, что Земля стареет на 21 млн лет за один год. Это около 40 лет в минуту. О, быстро стареем.
  rating: orange
  verdict: 'Что оценки возраста Земли росли, верно: Бюффон считал по остыванию раскалённых шаров, а радиоактивность открыли лишь в 1896 году. С появлением точных методов оценка устоялась: 4,5–4,6 млрд лет держится с 1950-х.'
  arguments:
  - earth-age-billions
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-2007
  start: 2007.9
  end: 2021.3
  text: Информация о датировании углеродом. Получены фантастические даты. Неподходящие даты отвергаются. Тогда зачем датировать, если используется предположенный возраст? Зачем тратить время?
  rating: red
  verdict: Загрязнённые пробы действительно отбрасывают, и это описывают в статьях. Но даты проверяют повторными пробами и разными методами; результат не подгоняют под заранее нужный возраст.
  arguments:
  - radiometric-dating
  rhetoric:
  - loaded-language

- id: lecture-7-2024
  start: 2024.5
  end: 2052.9
  text: 'Предполагается, что первоначальное содержание углерода известно. Но я хочу сказать, что нет, вы этого не знаете. Скорость распада никогда не меняется. Это предположение нельзя доказать. Образец не был заражён. Я хочу заметить, что все известные распады: калий-аргон, уран-свинец, углерод-14 — все они негативные. Это противоположность тому, что нужно эволюции. Им нужно найти что-то другое.'
  rating: red
  verdict: 'Допущения датировок проверены: скорость распада не менялась в опытах, загрязнение выявляют повторными пробами. А «распад — противоположность эволюции» — игра слов: распад атомов и изменения живых существ — разные процессы.'
  arguments:
  - radiometric-dating
  rhetoric:
  - podmena-ponyatij

- id: lecture-7-2055
  start: 2055.7
  end: 2086.3
  text: Ещё один вопрос. Были ли найдены свежие кости динозавров? Да. В книге «Великие приключения динозавров Аляски», на странице восемьдесят седьмой. Вы можете прочитать свою книгу. Это потрясающая книга. В Аляске были найдены свежие кости динозавров. Не ископаемые. Они прокопали несколько метров через уголь и нашли замороженные кости. Некоторые окаменелые и некоторые лёгкие. Не указывающие на окаменения.
  rating: orange
  verdict: 'Слабо окаменевшие кости динозавров на Аляске действительно находят, хотя и они ископаемые: окрашены железом, часть окаменела. Сохранность говорит об условиях захоронения, а возраст слоёв (около 69 млн лет) измерен независимо.'
  arguments:
  - soft-tissue

- id: lecture-7-2087
  start: 2087.1
  end: 2101.8
  text: В журнале «Наука» девяносто третьего года была описана находка динозавра. Тонкая структура костей была сохранена до такой степени, что характеристика клеток могла быть сравнима с клетками кости курицы. Очень хорошо сохранились.
  rating: orange
  verdict: Что строение кости динозавра бывает видно в микроскоп до клеток, верно. Но сохранность формы — это минеральный слепок, а не свежая ткань; молодость кости она не доказывает.
  arguments:
  - soft-tissue

- id: lecture-7-2102
  start: 2102.4
  end: 2119.2
  text: В северо-западной Аляске в 1961 году геолог нашёл пласт костей динозавров. В неископаемом виде. Молодой эскимос нашёл нижнюю часть челюсти динозавра, которая была в свежем виде, не в ископаемом виде.
  rating: orange
  verdict: 'Находка 1961 года реальна: кости на севере Аляски слабо окаменели. Позже их определили как кости утконосых динозавров мелового периода; возраст слоёв измерен независимо.'
  arguments:
  - soft-tissue

- id: lecture-7-2123
  start: 2123.7
  end: 2156.0
  text: Тогда как насчёт датирования по калию-аргону? Всё та же проблема. Только с большими числами. Полжизни калия-40 равняется 1,3 млрд лет. Они датировали базальт с горы Этна в Сицилии. Они знали время извержения. 122 года до нашей эры. Но по калию-азоту получили возраст в 250 000 лет. Они опровергли результат, зная, что он неверен. А как насчёт тех дат, которые вы не знаете? Как вы узнаете, что они неверны?
  rating: red
  verdict: 'Период полураспада калия-40 назван верно. Но молодую лаву калий-аргоновым методом не датируют: для камня, которому десятки лет, немного «лишнего» аргона в кристаллах — это вся «сумма», и дата выходит огромной. Это известное ограничение метода, а не его провал.'
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-2156
  start: 2156.6
  end: 2193.9
  text: Лавис Гавайского вулкана, 1801 год, по калию-аргону было 1,6 млн лет. Базальту с горы Килауэа-Ики, 1959 год, по калию-аргону было 8,5 млн лет. Базальту с Италии дали 700 000 лет, когда ему было только 30 лет. Другому вулкану 1972 года в Сицилии дали возраст в 350 000 лет. Как и все другие методы датирования, калий-азот тоже не работает.
  rating: red
  verdict: Все примеры — молодые лавы, где метод заведомо не работает из-за «лишнего» аргона; об этом писали сами авторы измерений. В камне возрастом в миллионы лет тот же лишний аргон теряется, как копейки на миллионном счёте, а другие «часы» на нём показывают то же время.
  arguments:
  - radiometric-dating
  rhetoric:
  - cherry-picking

- id: lecture-7-2196
  start: 2196.6
  end: 2206.8
  text: Нам нужен свидетель, как у нас в Библии, Бог сказал, как он это сделал и когда, и нам нужно читать и верить. Та же самая проблема и с этим методом датирования.
  rating: purple
  verdict: Мы тоже верим Божьему слову о творении. Но Писание не говорит, сколько лет Земле, а прошлое изучают по следам, как следователь раскрывает дело без свидетеля.
  arguments:
  - past-not-observable

- id: lecture-7-2208
  start: 2208.1
  end: 2252.6
  text: 'Если был потоп, то где все человеческие кости? Хороший вопрос. Этот допотопный мир был уничтожен. Не должны ли мы найти признаки цивилизации? Люди говорят: «Если был потоп, почему бы нам не раскопать их жилища?» Хороший вопрос. Если бы у нас был идеальный мир, идеальная погода, вам, наверное, не нужен был бы дом. Или нужен? Если бы животные были травоядными, как написано в Библии, вам не нужна была бы от них защита. Вы не нуждались бы в дорогах? Всё росло бы возле вас, не нужен был бы магазин. Что бы вы надеялись найти от идеального мира?'
  rating: orange
  verdict: 'Вопрос честный. Но ответ «в идеальном мире не было домов» — догадка: Бытие само говорит, что Каин построил город, а Тувалкаин ковал медь и железо (Быт 4:17–22).'
  arguments:
  - no-antediluvian-humans

- id: lecture-7-2254
  start: 2254.3
  end: 2304.4
  text: Любинов говорит, что было найдено около 4 000 человеческих остатков. Конечно, я не знаю, прав-прав он или нет, но давайте предположим, что это разумное число. Большинство просто кости, найдено очень мало полных человеческих скелетов. Если Бог сотворил мир 6 000 лет назад, он был полон растений и животных, и было только двое человек. И во время потопа, 1600 лет спустя, мир был полон растений и животных. Но не полон людьми. Что значит, что утонуло больше животных, чем людей. И вероятность находки ископаемых людей намного меньше вероятности находки ископаемых животных. Население было маленьким. Причиной потопа было уничтожение человека. И Бог уничтожил людей.
  rating: orange
  verdict: Что людей могло быть меньше, чем животных, разумно. Но в слоях с динозаврами нет не только людей, но и коров, лошадей, слонов; малым населением этого не объяснить.
  arguments:
  - no-antediluvian-humans

- id: lecture-7-2305
  start: 2305.2
  end: 2334.0
  text: В Библии написано, что в то время были на Земле исполины. Давайте предположим, что до потопа люди были трёхметрового роста. Просто предположим, хорошо? Современный человек придумал, что древний человек был маленьким, как шимпанзе. И когда он ищет ископаемые, он ищет маленькие кости. А если он найдёт громадную кость? Он никогда не подумает, что это человеческая кость из-за эволюционного предубеждения.
  rating: red
  verdict: 'Бытие 6:4 действительно упоминает исполинов, хотя это слово толкуют по-разному. Но учёные не ищут «маленькие кости»: скелет человека узнают по форме, а не по размеру, и великанов среди найденных скелетов нет.'
  arguments:
  - giants
  rhetoric:
  - straw-man

- id: lecture-7-2337
  start: 2337.1
  end: 2358.4
  text: Но большие человеческие кости найдены. Мы говорим об этом на кассете второй. Кости огромных размеров. И я думаю, что происходит недоразумение насчёт этих костей. Если вы найдёте громадный фрагмент кости Его могут принять за что-то другое, а не человеческую кость, хотя на самом деле это человеческая кость.
  rating: red
  verdict: Гигантских человеческих костей не найдено. Снимки «скелетов великанов» — монтаж, а крупные кости обычно оказываются костями мамонтов и других животных.
  arguments:
  - giants

- id: lecture-7-2358
  start: 2358.8
  end: 2408.2
  text: Первая причина, почему мы находим мало человеческих скелетов, потому что у людей погибло меньше, чем животных. Второе. Люди умнее животных. Некоторые. И они оказались на поверхности. И сгнивали. Скажите, сколько было убито буйволов за последние 100 лет? Миллионы. Найдите мне хоть одного ископаемого буйвола. А вы не найдёте, потому что они не были захоронены. На поверхности всё сгнило. И люди были умнее. И пытались не утонуть до последней минуты. Третья. Если люди были большие, их кости не считаются человеческими. Это ответ на ваш вопрос.
  rating: red
  verdict: 'Ископаемые бизоны известны, их много. А «причины» не объясняют главного: слои идут в строгом порядке, и человек встречается только в самых верхних.'
  arguments:
  - no-antediluvian-humans
  rhetoric:
  - appeal-to-doubt

- id: lecture-7-2409
  start: 2409.6
  end: 2438.3
  text: 'Где Ной достал смолу? Не произошла ли она от допотопной нефти? Если вы посмотрите мой дебат номер семь, моим оппонентом был проповедник, который потом стал атеистом. Его аргументом было то, что Бог сказал Ною покрыть ковчег смолой. И что смола сделана из нефти. Бытие, шесть, Бог сказал: «Осмоли его смолой внутри и снаружи». Он сказал: «Вы, креационисты, говорите, что нефть сформировалась из-за потопа? Но как у Ноя была смола?»'
  rating: neutral
  verdict: 'Вопрос из зала: откуда у Ноя смола, если нефть образовалась в потоп. Ответ ниже.'
  rhetoric:
  - personal-story

- id: lecture-7-2439
  start: 2439.0
  end: 2507.0
  text: У него было простое недоразумение о происхождении смолы. В Библии говорится о смоле в книге Исход. Корзинка Моисея была покрыта смолой. В Исаии говорится о горящей смоле и о дыме от неё. Если вы посмотрите в словарь 1828 года, найдите слово «смола». Густое вязкое вещество. Сок вида сосны или ели с таким латинским названием. Латинский язык — это мёртвый язык. Он убил римлян и теперь убивает нас. Её добывают с помощью надреза коры дерева. Много лет люди добывали смолу. Были целые индустрии по производству смолы для покрытия кораблей. Ещё до добывания нефти. В Америке уже были предприятия по производству смолы для кораблей. Словарь 1828 года. Смола сосны или скипидара используется для замазки корабля и смоления дна и сторон. Ной знал о смоле. И не говорите мне, что это нефть. Тот человек не знал, о чём он говорил.
  rating: green
  verdict: 'Верно: смолу веками получали из сосны и других деревьев, так что для ковчега нефть не была нужна.'

- id: lecture-7-2507
  start: 2507.7
  end: 2519.2
  text: Следующий вопрос. Был ли древний человек примитивным? Не пытаются ли они учить в школах, что современный человек умён и древний человек тупой? Давайте посмотрим на факты.
  rating: orange
  verdict: 'Школа не учит, что древние люди были «тупыми»: историки восхищаются пирамидами и римскими дорогами. Эволюция говорит о далёких предках, живших сотни тысяч лет назад, а не о египтянах или греках.'
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - straw-man

- id: lecture-7-2520
  start: 2520.2
  end: 2550.1
  text: Есть очень хорошая книга, которая называется «Загадка древнего человека». Этот маленький самолёт был найден в могиле в Колумбии, в Южной Америке. Сейчас он находится у Смитсанитов. Самолёту около 1 000 лет. Однако они говорят, что это стилизованное насекомое. Вы с этим согласны? И я не согласен.
  rating: red
  verdict: Это золотая фигурка культуры кимбайя из Колумбии; таких фигурок много, и они изображают птиц, рыб и насекомых. Сходство с самолётом есть, но ни двигателя, ни следов авиации у этой культуры нет.
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - appeal-to-doubt

- id: lecture-7-2551
  start: 2551.5
  end: 2565.6
  text: Удивительные предметы иногда находят в могилах. В захоронениях. Этот железный котелок был найден в куске угля, когда он раскололся. Сейчас он находится в музее Карла Баха в Техасе.
  rating: red
  verdict: Котелок «из угля» известен только по рассказу шахтёра; в каком пласте и как он лежал, никто не проверил. Такая находка не доказывает допотопной цивилизации.
  arguments:
  - human-fossils

- id: lecture-7-2566
  start: 2566.0
  end: 2586.3
  text: В Перу есть камни весом в 20 000 тонн. Тесаные камни. И они сложены вместе. Самый большой кран на Земле может поднять 3 000 тонн. Как они поднимали и передвигали двадцатитысячнотонные камни? Я не думаю, что древний человек был примитивным.
  rating: red
  verdict: Древние строители Перу действительно двигали огромные камни. Но самые большие блоки весят сотни тонн, а не 20 000, и их перемещали рычагами, катками и силами тысяч людей.
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - argument-by-incredulity

- id: lecture-7-2587
  start: 2587.2
  end: 2618.0
  text: Если вы подумаете, сегодня для энергии мы или сжигаем ископаемое топливо, как бензин или нефть, или используем движение электрона как электричество. Может, раньше знали о других источниках энергии, о которых мы даже и не думаем. Мы не используем магнитное поле Земли как источник энергии, правда? Может, они знали, как использовать магнитное поле. Может, они знали, как использовать гравитационное поле? Может, они знали о совершенно других источниках энергии.
  rating: orange
  verdict: 'Это откровенная догадка: «может быть, знали гравитационную энергию». Никаких следов таких технологий не найдено, а догадка без следов ничего не доказывает.'
  arguments:
  - ancient-advanced-civilization

- id: lecture-7-2618
  start: 2618.8
  end: 2648.3
  text: Вы должны понять, что когда Бог сотворил Адама… Адам был предопределён Богом. И Адам использовал 100% своего мозга. Эйнштейн предположил, что люди сегодня используют меньше 10%. У меня были студенты, которые использовали даже намного меньше этого. И не только это, Адам жил 900 лет. Сколько можно выучить за 900 лет?
  rating: red
  verdict: 'Что человек использует 10% мозга, — известный миф: работают все отделы мозга, это видно на томографии, а Эйнштейн этого не говорил. Сколько мозга использовал Адам, Писание не сообщает.'
  arguments:
  - ancient-advanced-civilization
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-2650
  start: 2650.0
  end: 2670.3
  text: Я не думаю, что древний человек был примитивным. Этот колокол тоже был найден в куске угля. Его нашёл Ньютон Андерсон. Позвоните ему, если хотите. Вот номер его телефона. Эта вещь найдена в камне, которому должно быть 600 млн лет. Сосуд с мозаикой. Они знали, как это делать.
  rating: red
  verdict: 'Колокол и сосуд «из камня» известны по рассказам и газетным заметкам: учёные их не изучали, и в каком слое они лежали, не установлено. Сосуд из Дорчестера похож на изделие XIX века.'
  arguments:
  - human-fossils

- id: lecture-7-2670
  start: 2670.9
  end: 2689.4
  text: На корабле, утонувшем 100 лет до нашей эры, нашли калькулятор. Аналоговый калькулятор двухтысячнолетней давности. Объясните мне это. Сейчас он находится в Национальном фонде науки. Мы запутались.
  rating: orange
  verdict: 'Антикитерский механизм реален: это шедевр греческой механики II–I века до н. э. Но эволюции он не противоречит, ведь она говорит о далёких предках, а не о греках. Хранится он в Афинах.'
  arguments:
  - ancient-advanced-civilization

- id: lecture-7-2689
  start: 2689.8
  end: 2727.7
  text: Сегодня у нас много технологий, но технология не сравнивается с разумом. И у нас есть часы-калькулятор с памятью на 300 телефонных номеров. Потому что кто-то давно придумал, как сделать диод. Ещё кто-то придумал, как сделать транзистор. Кто-то придумал резистор. Кто-то открыл электрическое движение, очень много открытий используется в этих часах. И тот, кто сделал эти часы, только использовал все знания. Он ничего не придумал. Это не значит, что он умнее всех, он просто использовал чьё-то знание. И всё. Человек сейчас не умнее.
  rating: neutral
  verdict: Мысль, что технологии — накопленное знание, а не признак большего ума, верна; к доводам об эволюции она не относится.

- id: lecture-7-2728
  start: 2728.1
  end: 2764.1
  text: Этот молоток находится в музее Карла Баха в Техасе. Состоит из 96% железа, 2,6% хлора. Это нержавеющая сталь без углерода. Они были очень развиты в металлургии до потопа. Выглядит, что батарея была найдена в камне двухтысячного возраста. На одном из египетских захоронений иероглифами были показаны мумии, подключённые к электрическому источнику питания. У них было электричество 3 000 лет назад. Нет. Древний человек не был примитивным.
  rating: red
  verdict: «Лондонский молоток» из Техаса — обычный молоток XIX века, обросший известковой коркой, а не вросший в древнюю породу. «Багдадская батарея», скорее всего, сосуд для свитков, а рисунки в египетском храме в Дендере изображают цветок лотоса и змею из египетских мифов, а не электричество.
  arguments:
  - human-fossils

- id: lecture-7-2764
  start: 2764.6
  end: 2784.3
  text: Следующий вопрос. Великая пирамида Хеопса. Кто построил Великую пирамиду и для чего? В Египте есть 67 пирамид, как я понимаю. И только одна называется Великая пирамида Хеопса. Другие пирамиды, очевидно, являются копиями пирамиды Хеопса.
  rating: orange
  verdict: Что пирамида Хеопса самая большая в Египте, верно. Но пирамид там больше сотни, и часть построена раньше неё, например ступенчатая пирамида Джосера; копиями Великой пирамиды они быть не могут.
  arguments:
  - pyramid-prophecy

- id: lecture-7-2785
  start: 2785.5
  end: 2815.7
  text: Эта пирамида очень интересная. В Библии в Исаии написано, что Бог сделает жертвенник и памятник. Жертвенник посреди земли Египетской и памятник у пределов её. История говорит, что Египет был двумя царствами. И на границе Северного и Южного царства и находится пирамида Хеопса. И когда Египет стал одним царством, пирамида стала центром царства. Пирамида посреди земли и у пределов её. Интересно.
  rating: purple
  verdict: Мы тоже верим пророчествам Исаии. Но «жертвенник посреди земли Египетской» (Ис 19:19) обычно понимают как поклонение Господу в Египте; связь стиха с пирамидой — догадка пирамидологов XIX века.
  arguments:
  - pyramid-prophecy

- id: lecture-7-2816
  start: 2816.8
  end: 2843.3
  text: Пирамида Хеопса — очень удивительное строение. Самое большое на Земле. Она в 90 раз больше башни Сирс по объёму. В девяносто раз больше. Наполеон сказал, что в ней достаточно камня, чтобы построить трёхметровую стену вокруг Франции. Территория размером примерно как Техас. Это большая пирамида.
  rating: orange
  verdict: 'Пирамида действительно огромна: около 2,5 млн м³ камня. Но «самое большое строение на Земле» — преувеличение: многие плотины больше по объёму. Размер ничего не говорит о её «пророческом» смысле.'
  arguments:
  - pyramid-prophecy
  rhetoric:
  - scale-trick

- id: lecture-7-2844
  start: 2844.3
  end: 2882.6
  text: Внутри пирамиды есть поразительные проходы. Может быть, я не утверждаю, но может быть, что Бог дал Адаму и Еве Евангелие в звёздах. Ну и… Или кто-нибудь другой в это время. Может быть, до потопа или после потопа. Пирамида была построена в это время. Некоторые думают, что Адам построил пирамиду. Некоторые думают, что Енох её построил, некоторые думают, что её построил Ной после потопа. Может, она была построена до потопа и является единственным уцелевшим строением? Но пирамида, несомненно, очень похожа на Евангелие в камне.
  rating: red
  verdict: 'Строителя и время пирамиды знают: фараон Хуфу, около 2600 года до н. э.; сохранился даже папирус-дневник чиновника, возившего камень. Версии про Адама, Еноха или допотопную постройку ничем не подтверждены.'
  arguments:
  - pyramid-prophecy

- id: lecture-7-2883
  start: 2883.7
  end: 2918.6
  text: Например, с главного входа вы можете пойти по широкому пути и прийти в яму. Или же вы можете выбрать узкий путь, который ведёт к царской комнате. Я где-то уже читал это в Библии. Если вы выберете узкий путь, вы пройдёте 153 ступени. 153 упоминается в Библии. Они закинули сеть и вытащили 153 большие рыбы. Может, это представляет сбор всех наций в Царствии Бога? Сто пятьдесят три. Интересная мысль.
  rating: red
  verdict: 'Совпадения с «узким путём» и «153 рыбами» подобраны задним числом: в любом большом здании найдутся числа, похожие на библейские. Египтяне строили гробницу фараона и евангельского смысла в неё не вкладывали.'
  arguments:
  - pyramid-prophecy

- id: lecture-7-2919
  start: 2919.2
  end: 2954.0
  text: Попав в царскую комнату, вы оказываетесь в пустой могиле. Могиле из красного гранита. По объёму как ковчег Завета. Стороны пирамиды были покрыты 144 000 облицовочного камня. 144 000. Я тоже встречал это в Библии. Кстати, это не свидетели Иеговы. Внутренность могилы имеет такие же размеры, как и ковчег Завета. Такой же объём.
  rating: red
  verdict: Саркофаг пуст, потому что гробницу разграбили ещё в древности, а его объём совпадает с ковчегом Завета лишь приблизительно. Облицовку растащили в Средние века, и «144 000 камней» никто не пересчитывал.
  arguments:
  - pyramid-prophecy

- id: lecture-7-2955
  start: 2955.8
  end: 3005.2
  text: 'Вершина пирамиды не была достроена, угловой камень не был поставлен. Самое большое здание в мире, и не хватает одного камня. Интересен сам угловой камень пирамиды, у него пять сторон. Пять — это число благодати. Незаконченное строение. Библия говорит об Иисусе как о главе угла. В Марка 12 написано: «Камень, который отвергли строители, тот самый сделался главою угла». Глава угла. Это упоминается в Библии несколько раз. В книге Даниила говорится, как камень оторвался от горы без содействия рук и ударил в истукан. Может быть, что пирамида Хеопса символизирует Царство Бога. А угловой камень — это Иисус Христос. И Он не закончил Свою работу.'
  rating: purple
  verdict: Мы тоже верим, что Христос — камень, «сделавшийся главою угла» (Мк 12:10). Но этот образ взят из обычного строительства, а не из пирамиды; символика вершины — догадка пирамидологов.
  arguments:
  - pyramid-prophecy

- id: lecture-7-3005
  start: 3005.6
  end: 3052.1
  text: Последователи Люцифера поставили на однодолларовую купюру пирамиду со Всевидящим глазом. Они думают, что Люцифер закончит работу. Всевидящий глаз представляет Люцифера. Посмотрите кассету пятую на эту тему. Кстати, он не представляет Бога. Они хотят закончить работу. В новый 2000 год Буш, Маргарет Тэтчер и другие планировали церемонию посещения пирамиды Хеопса и установки углового камня. Вовлекает много символизма. Кто помнит это? Новый год, они называют его Миллениум, но это ещё не Миллениум. Они хотели установить угловой камень. Это символ нового века для целей одного мирового государства. С Люцифером во главе.
  rating: red
  verdict: Пирамида с глазом на печати США появилась в 1782 году и означает Провидение и незаконченное строительство страны. Позолоченную вершину на пирамиду в 2000 году собиралось поставить правительство Египта для праздника, но церемонию отменили.
  arguments:
  - pyramid-prophecy
  rhetoric:
  - conspiracy

- id: lecture-7-3054
  start: 3054.1
  end: 3096.3
  text: Христиане много лет учили, что Новый Иерусалим будет 2 500 км ширины, длины и высоты. Говорят, что это большой куб. Минуточку. Но не говорится, что это куб. Там говорится 2 500 на 2 500 на 2 500. Это может быть большая пирамида. И только в одном строении есть угловой камень. Один угловой камень. У пирамиды. У квадратных строений четыре угловых камня. У пирамиды один. И если она из чистого золота, а оно сверхпрозрачное, И он есть свет, то она будет блистать. Пища для размышления. И пирамида на долларе представляет царство Люцифера, а не Бога.
  rating: purple
  verdict: Мы тоже ждём Нового Иерусалима. В Откр 21:16 длина, ширина и высота города равны, поэтому его обычно представляют кубом, как Святое Святых; пирамида — тоже возможное прочтение, но догадка, а не учение Писания.
  arguments:
  - pyramid-prophecy

- id: lecture-7-3097
  start: 3097.9
  end: 3135.5
  text: 'Была ли Земля горячей, расплавленной массой? Вас учили в школе, что Земля остыла миллиарды лет назад? Вы знаете, что наука показывает, что это неправда? В этом учебнике написано: при формировании поверхность Земли была как на Луне. Она была горячей с кипящей лавой. Извините, но это просто неправда. В Бытии написано, что Земля была сотворена под водой. Что значит, что она не была горячей расплавленной массой? Кто-то неправ, или Библия не права, или учебник неправ. Я думаю, я знаю, кто не прав.'
  rating: red
  verdict: 'Быт 1:2 описывает землю, уже покрытую водой, но не говорит, какой она была до того. Противоречия нет: сначала молодая Земля была раскалённой, потом остыла, а древнейшие крошечные кристаллы (цирконы) показывают, что вода появилась рано.'
  arguments:
  - polonium-halos
  rhetoric:
  - lozhnaya-dilemma
  - textbook-authority

- id: lecture-7-3137
  start: 3137.1
  end: 3207.5
  text: У Роберта Джентри есть хорошая веб-страница halos.com. Роберт Джентри изучал гранитный камень. И он обнаружил, что гранит всего мира содержит маленькие гало полония. Но происходит интересная вещь. При распаде у полония очень короткая полужизнь. Иногда три минуты. Иногда 164 тысячных секунды. Гало полония похоже на взрыв гранаты под водой. И после взрыва всё растворяется. Это ещё похоже на, например, на фейерверк. В небе происходит взрыв. В воздухе. И через некоторое время исчезает. Предположим, что после образования взрыва вы заморозили атмосферу для сохранения шара на месте. А заморозить нужно очень быстро. И, конечно, это невозможно. Гало существуют в камне, потому что камни никогда не были горячей расплавленной массой. Потому что если бы камни были жидкими, гало бы исчезли.
  rating: red
  verdict: Что в граните есть крошечные гало от распада полония, верно. Но полоний — звено в цепочке распада урана, и его могли принести растворы или газ радон уже в застывший камень; поэтому гало не доказывают мгновенного сотворения.
  arguments:
  - polonium-halos

- id: lecture-7-3208
  start: 3208.4
  end: 3247.8
  text: 'Работа Роберта Джентри была опубликована во всех крупных научных журналах, пока кто-то не догадался: это же доказывает неверность теории Большого взрыва. И они быстро забыли про него. Его работы больше не публикуются. Не потому, что они научно неверны, но потому, что они противоречат эволюции. Эволюция — это строго защищённая государственная религия. Очень строго защищённая. Роберт Джентри живёт в Ноксвилле в штате Теннесси. Его сын также продолжает работу отца. Они вместе путешествуют и говорят об исследовании гало, доказывая, что Библия абсолютно верна.'
  rating: red
  verdict: Что статьи Джентри печатали ведущие журналы, верно, и это показывает, что креационисту не закрывали дорогу. Но позже геологи показали, что часть его образцов — не первозданный гранит, а камень, заливший трещину в более древней породе, как замазка в стене. Поэтому вывод не подтвердился.
  arguments:
  - science-conspiracy
  rhetoric:
  - loaded-language

- id: lecture-7-3248
  start: 3248.3
  end: 3285.3
  text: Ещё несколько вопросов. Глобальное потепление. Кто слышал о глобальном потеплении? Есть ли озонная проблема? Большая озонная дыра находится над Вашингтоном из-за поднимающегося оттуда воздуха. Я бы порекомендовал вам книгу под названием «Факты, а не страх». Её можно приобрести у Дерри Браунфилда. У него есть шоу здесь, в Миссури, в городе Центрфильде. Это очень маленький городок. Ну, это прекрасная книга. Озонной проблемы не существует.
  rating: red
  verdict: Что страхи вокруг природы бывают преувеличены, верно. Но озоновая дыра над Антарктидой измерена приборами, её причина — фреоны, и после Монреальского протокола 1987 года, по которому от фреонов постепенно отказались, озоновый слой медленно восстанавливается.
  arguments:
  - environmentalism-control
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-3286
  start: 3286.9
  end: 3334.4
  text: 'Целью защиты окружающей среды является первый пункт Маркса: «Отмена личного имущества». Целью не является сохранение среды. Целью является отмена личного имущества. Они хотят, чтобы вы получили разрешение, чтобы срезать дерево на вашем участке. Они меня злят. Они говорят, что у дерева есть право. Тогда я говорю: «У молекул кислорода тоже есть право, и вам нужно перестать дышать». И у воды тоже есть право. Перестаньте пить воду. Нет, нет. Бог дал нам власть над землёй. Мы не должны портить её, но контролировать и вполне нормально срезать дерево.'
  rating: orange
  verdict: 'Мы тоже верим, что Бог дал человеку власть над землёй и срубить своё дерево не грех. Но заботу о природе нельзя свести к марксизму: Быт 2:15 велит человеку «возделывать и хранить» сад, и многие христиане видят в этом служение Творцу.'
  arguments:
  - environmentalism-control
  rhetoric:
  - conspiracy
  - straw-man

- id: lecture-7-3336
  start: 3336.2
  end: 3365.6
  text: 'Не доказывает ли формация зелёной речки, что Земле миллионы лет? Атеисты почти всегда задают этот вопрос. В Вайоминге есть формация камня с тысячами и тысячами тоненьких слоёв, которая называется формация зелёной речки. И они говорят, что эти слои представляют сезонные изменения, как весна и осень. Или что-то в этом роде. И они говорят: «Видите, это заняло миллионы лет, представляя разные сезоны».'
  rating: neutral
  verdict: 'Постановка вопроса о тонких слоях формации Грин-Ривер. Задают его не только атеисты: о возрасте этих слоёв пишут и христиане-геологи.'

- id: lecture-7-3366
  start: 3366.2
  end: 3396.9
  text: Но есть несколько проблем. Они взяли камень формации и стёрли его в порошок. Высыпали порошок в движущуюся воду, и он снова осел тысячами слоями. Вы когда-нибудь видели такие песочные картины? Вы переворачиваете картинку. И песок автоматически сортируется в слои. Вы можете взять соль и перец. Перемешать их вместе. И высыпать смесь на стол. Просто высыпать. Потом разрежьте кучку, и вы увидите слои.
  rating: red
  verdict: 'Что слои могут быстро осаждаться из потока, верно: это показали опыты. Но в Грин-Ривер год — это пара полосок, как кольцо у дерева: светлая известковая летом и тёмная из отмерших водорослей. Насыпанный песок даёт полоски, но не такие пары.'
  arguments:
  - green-river-varves
  rhetoric:
  - false-analogy

- id: lecture-7-3399
  start: 3399.8
  end: 3424.9
  text: Потоп сформировал формацию зелёной речки. При раскопках формации были найдены слои пепла от вулканов, которые называются горизонт событий. Но между двумя слоями пепла количество слоёв отличается на 35%. Они не представляют возраст. Извините, им нет миллионов лет.
  rating: red
  verdict: 'Что у берегов древнего озера число слоёв между прослоями пепла разное, верно: у берегов полоски добавляли паводки. Но в тихой середине большого озера возраст пеплов измерен, и пар полосок между ними примерно столько, сколько прошло лет. Потоп за год таких пар не оставил бы.'
  arguments:
  - green-river-varves
  rhetoric:
  - cherry-picking

- id: lecture-7-3426
  start: 3426.4
  end: 3470.3
  text: Последний вопрос перед перерывом. Что насчёт камня с Марса? Кто слышал о жизни на Марсе? Я вам расскажу, что произошло на самом деле. Вот фотография камня Марса. Этот камень был найден в Антарктиде. Он не был привезён с Марса. Почти со всем, что мы посылаем на Марс, мы теряем контроль. Эй, ты ещё там? На камне они нашли маленькую линию. Вот линия. Это и есть доказательство жизни на Марсе. И это всё.
  rating: orange
  verdict: Верно, метеорит ALH84001 нашли в Антарктиде. Но что он с Марса, установили по составу, совпавшему с другими марсианскими метеоритами и атмосферой Марса по данным «Викингов». А доводов о жизни в нём было несколько, а не «одна линия».
  rhetoric:
  - straw-man

- id: lecture-7-3471
  start: 3471.3
  end: 3515.6
  text: 'Интересным было и время находки. Камень был найден давно и много лет лежал в лаборатории. У нас были проблемы финансирования через Конгресс. Деньги для НАСА застряли в Конгрессе. И им нужно было найти что-то важное, чтобы все поняли, что на НАСА нужно тратить миллиарды долларов, чтобы они дальше посылали ракеты и устанавливали спутники, чтобы следить за нами во время нового мирового порядка. Что является настоящей целью? Чтобы получить деньги, им нужно было найти что-то важное. И они вспомнили о камне и сказали: «Эта линия доказывает жизнь на Марсе». Где наши деньги? И это сработало.'
  rating: red
  verdict: Объявление 1996 года действительно совпало с обсуждением бюджета NASA. Но статью напечатал рецензируемый журнал Science, её открыто оспаривали другие учёные, а слова о спутниках для слежки «нового мирового порядка» ничем не подтверждены.
  arguments:
  - science-conspiracy
  rhetoric:
  - conspiracy

- id: lecture-7-3516
  start: 3516.4
  end: 3569.3
  text: Я хочу заметить, что между Марсом и Землёй огромное расстояние. Расстояние, например, как? Если вы уменьшите Марс и Землю до размера помидора, то Земля будет 8 см, и Марс будет 4 см. Самым близким расстоянием между ними будет 530 м. Теперь я хочу, чтобы вы стрельнули в помидор четыре сантиметра, и чтобы от него отлетел кусок и упал на второй помидор. Но вы не можете оставить вмятину на первом помидоре. Не думаете ли вы, что это уловка? Вы нашли камень? Как вы знаете, что он с Марса? Вещи для рассмотрения.
  rating: red
  verdict: 'Модель с помидорами передаёт расстояние, но не скорость: при сильном ударе осколок летит так быстро, что Марс не может притянуть его обратно, и он улетает в космос. Следы таких ударов — кратеры — там повсюду, а марсианских метеоритов найдено несколько сотен.'
  rhetoric:
  - argument-by-incredulity
  - scale-trick

- id: lecture-7-3569
  start: 3569.6
  end: 3582.8
  text: В 1997 году обнаружили, что это не ископаемые Марса. А часть нормальной химической реакции. Это обнаружили, когда деньги уже были выплачены. И, наверное, потрачены, я уверен.
  rating: orange
  verdict: Что «окаменелости» в метеорите большинство учёных в итоге не признало, верно. Но спор шёл открыто в научных журналах с первых месяцев, а не «когда деньги потратили»; так и выглядит обычная проверка в науке.
  rhetoric:
  - conspiracy

- id: lecture-7-3584
  start: 3584.2
  end: 3605.9
  text: Они говорят, что Марс, камень с Марса, оторвался 16 млн лет назад и приземлился 13 000 лет назад. Как они это знают? Они говорят, что бактерия ела 16 млн лет. Как она выжила? Удар. Вакуум космоса. Вход в атмосферу. И мороз 13 000 лет.
  rating: red
  verdict: 'Время полёта и падения камня узнают по особым атомам (изотопам): в космосе лучи понемногу создают их в камне, как загар на коже, а на Земле они постепенно распадаются. А о живой бактерии речи не было: обсуждали окаменевшие следы древних микробов.'
  arguments:
  - radiometric-dating
  rhetoric:
  - straw-man

- id: lecture-7-3607
  start: 3607.1
  end: 3615.3
  text: Исследовательская кампания финансировалась NASA. Деньги для НАСА находились в Конгрессе. После заявления деньги были выданы.
  rating: orange
  verdict: 'Что исследование финансировало NASA, а бюджет тогда обсуждал Конгресс, верно. Но что деньги дали «за заявление», Ховинд только подразумевает, не доказывая: статью проверяли и открыто оспаривали другие учёные.'
  rhetoric:
  - conspiracy

- id: lecture-7-3616
  start: 3616.2
  end: 3622.3
  text: В моей Библии написано, что Ева была матерью всех живущих. Я не думаю, что на других планетах есть жизнь.
  rating: neutral
  verdict: Личное мнение Ховинда. Заметим лишь, что Быт 3:20 говорит о Еве как матери всех людей; есть ли жизнь на других планетах, Писание не сообщает.

- id: lecture-7-3624
  start: 3624.7
  end: 3639.7
  text: 'Что насчёт теологической эволюции? Меня спрашивают: «Не мог ли Бог использовать эволюцию для создания мира?» Да, он мог. Но он так не сделал. Библия ясно говорит, что Бог сотворил всё за шесть дней.'
  rating: purple
  verdict: 'Хорошо, что Ховинд признаёт: Бог мог творить и через эволюцию. Мы тоже верим, что мир сотворил Бог; но многие христиане понимают шесть дней не как хронику, и это законный богословский спор.'
  arguments:
  - genesis-literal

- id: lecture-7-3641
  start: 3641.3
  end: 3675.2
  text: 'Что миры были устроены словом Божьим. Бог сказал в Бытии. Нет причины для теологической эволюции. Это даже не разумная теория. В Библии говорится, что за 6 дней Бог сотворил всё, а в день 7 почил. Это ясное учение Библии. Дела были совершены ещё в начале мира. Евреям. Глава четвёртая. И почил Бог в день седьмой. Очевидно, это было шестидневное творение с одним днём отдыха. Бытие 2: И совершил Бог к седьмому дню дела Свои, которые Он делал.'
  rating: purple
  verdict: 'Да, «веки устроены словом Божиим» (Евр 11:3), но стих говорит, Кто сотворил мир, а не за какой срок. А заповедь о субботе (Исх 20:11) верна при любом понимании дней: наша неделя повторяет образец Божьего дела, а не его длительность.'
  arguments:
  - genesis-literal

- id: lecture-7-3676
  start: 3676.3
  end: 3695.4
  text: 'В Римлянам 5 говорится, что смерть вошла через грех. И в Коринфянам тоже написано: Смерть через человека. Если верить теории теологической эволюции, то смерть была до появления человека. Позиция этой эволюции противоречит Писанию.'
  rating: purple
  verdict: Мы тоже верим, что смерть вошла в мир через грех (Рим 5:12). Но Павел говорит о смерти людей, пришедшей «через одного человека»; о смерти животных до грехопадения христиане спорят со времён отцов Церкви.
  arguments:
  - death-before-fall

- id: lecture-7-3697
  start: 3697.2
  end: 3709.5
  text: Вы можете верить, что Бог использовал эволюцию, но тогда не говорите, что вы верите в Библию, потому что вы не верите. Для этого нужно сильно изменить Библию, чтобы поверить в это.
  rating: purple
  verdict: 'Мы верим Библии и потому не согласны: многие христиане, принимающие эволюцию, исповедуют Писание Словом Божьим. Спор идёт о толковании Бытия, а не о том, верить ли Библии.'
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-7-3710
  start: 3710.8
  end: 3718.9
  text: Бог сказал Ною наполнять землю. И некоторые говорят, что это доказывает разрыв. Но это неправда. Мы говорим об этом на кассете второй.
  rating: neutral
  verdict: Ховинд отвергает теорию разрыва (будто между первыми стихами Бытия прошли века), ссылаясь на вторую лекцию. Это спор внутри креационизма; к научным доводам он не относится.

- id: lecture-7-3719
  start: 3719.5
  end: 3729.6
  text: В Бытии написано, что Бог сотворил человека по образу Своему. Выглядит Бог как амёба? Или обезьяна? Какой образ Бога?
  rating: purple
  verdict: Мы тоже верим, что человек создан по образу Божьему. Но этот образ богословы, начиная с отцов Церкви, видят в разуме, свободе и призвании, а не во внешности; поэтому вопрос «Бог похож на обезьяну?» бьёт мимо цели.
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-3730
  start: 3730.0
  end: 3750.5
  text: 'Проблемы теологической эволюции. Первая — не соответствует учению Библии. Если бы вы дали Библию пяти тысячам человек, ничего не знающим о споре, и спросите, что там написано, никто не упомянет о теологической эволюции. Они все скажут: «Тут написано, что Бог всё сотворил за шесть дней».'
  rating: purple
  verdict: 'Что современный читатель увидит в Быт 1 шесть обычных дней, верно. Но и в тексте есть подсказки: Солнце, по которому считают сутки, появляется лишь в четвёртый день. Иначе, чем буквально, дни творения читал и Августин.'
  arguments:
  - genesis-literal

- id: lecture-7-3751
  start: 3751.4
  end: 3769.3
  text: Бог, которому я поклоняюсь, способен написать книгу, которую может читать и понимать средний человек. Мне не нравится, что эти теологические эволюционисты хотят, чтобы вы поверили, что они должны объяснять вам Библию. Они строят своё царство.
  rating: purple
  verdict: 'Мы тоже верим, что главное в Писании понятно простому читателю. Но приписывать толкователям желание «строить своё царство» — не довод: объяснять Писание другим — обычное служение учителя в церкви, им занят и сам Ховинд.'
  rhetoric:
  - ad-hominem-pivot

- id: lecture-7-3770
  start: 3770.7
  end: 3788.9
  text: Мой Бог написал книгу, которую я могу понимать без чужой помощи. В Библии есть некоторые вещи, которые я не понимаю. И это беспокоит меня. Но больше меня беспокоят вещи, которые я понимаю. Ха.
  rating: neutral
  verdict: Удачный афоризм о понятных местах Библии (его приписывают Марку Твену); с ним можно согласиться.

- id: lecture-7-3789
  start: 3789.3
  end: 3813.5
  text: Второе. Я хочу заметить, что только отсталому Богу нужна эволюция для сотворения мира. Ваш Бог не может сделать это с первого раза? С ним что-то не то. Мой Бог сделал это с первого раза. Человек всё испортил, но Богу не нужна была эволюция. У теологических эволюционистов очень ограниченный бог.
  rating: purple
  verdict: 'Мы тоже верим во всемогущего Бога. Но постепенное творение — не «неудачная попытка»: и дерево Бог растит из семени годами. Августин писал, что Бог вложил в мир «семена», раскрывающиеся со временем.'
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-3814
  start: 3814.9
  end: 3839.6
  text: 'Это не бог Библии, и он не достоин поклонения. Конечно, этого бога можно поставить на полку и проживать жизнь по-своему. Поэтому-то люди и верят в теологическую эволюцию. И мне нравится Бог, который говорит: «Это мои заповеди». Им нравится Бог, который говорит: «Это мои советы». Нет, они называются заповедями. Не делай.'
  rating: purple
  verdict: Мы тоже чтим заповеди Божьи как заповеди. Но христиане, принимающие эволюцию, не считают их «советами»; приписывать им желание жить по-своему — суждение о мотивах, а не довод.
  rhetoric:
  - ad-hominem-pivot
  - loaded-language

- id: lecture-7-3841
  start: 3841.7
  end: 3847.8
  text: Также не в характере Бога использование страданий и смерти для достижения цели. Мой бог так не делает.
  rating: purple
  verdict: Вопрос о страдании в творении серьёзен. Но в Пс 103:21 Бог Сам кормит львов, и псалом хвалит это как Его мудрость, а не терпит как порчу; другая сторона опирается на Рим 8:20–22. Это законный богословский спор.
  arguments:
  - death-before-fall

- id: lecture-7-3851
  start: 3851.0
  end: 3860.8
  text: Также аннулирует нужду в смерти Христа. Человек принёс смерть в мир. Адам — это первый человек, и Христос — это второй Адам. Его смерть платит за наши грехи.
  rating: purple
  verdict: 'Согласны: Христос — второй Адам, и Его смерть платит за наши грехи. Но Он спасает от смерти, которую принёс грех человека, а не от смерти животных; поэтому и христиане, принимающие эволюцию, исповедуют искупление так же.'
  arguments:
  - death-before-fall

- id: lecture-7-3862
  start: 3862.4
  end: 3882.0
  text: Нет, теологическая эволюция — это нелепая теория. Доказательств эволюции нет, так зачем компрометировать совершенную Библию с тупой теорией, как эта? Это не имеет смысла. Они просто волки в овечьей шкуре. Это моё понимание.
  rating: red
  verdict: 'Доказательства эволюции есть: ископаемые, сравнение ДНК, наблюдаемое образование новых видов. А называть братьев во Христе «волками в овечьей шкуре» за взгляд на науку — не довод, а осуждение.'
  rhetoric:
  - loaded-language
  - ad-hominem-pivot

- id: lecture-7-3885
  start: 3885.3
  end: 3896.2
  text: Меня часто спрашивают, почему я использую Библию в версии Короля Джеймса. Мы можем говорить об этом очень долго. Ну, я хочу быстро представить историю Библии. Как она к нам дошла?
  rating: neutral
  verdict: Переход к вопросу о переводе короля Якова.

- id: lecture-7-3897
  start: 3897.3
  end: 3933.2
  text: Когда Новый Завет был написан на греческом, у них не было печатной машины. Или ксерокса. И чтобы сделать копию, вы должны были переписывать. Это был длинный процесс. И если находили ошибку, то Библию сжигали. И, конечно, вы не хотели работать три месяца, чтобы потом Библию сожгли и вам не заплатили. Поэтому у них была система проверки ошибок. Они считали буквы, считали слова и так далее. Проверенные копии были в точности похожими на оригинал.
  rating: orange
  verdict: Что переписчики старались работать точно, верно. Но подсчёт букв — обычай иудейских писцов Ветхого Завета; греческие рукописи Нового Завета содержат много мелких разночтений, и учёные их сравнивают.
  arguments:
  - kjv-only

- id: lecture-7-3936
  start: 3936.7
  end: 3962.8
  text: Но при частом разворачивании и сворачивании свиток начинал изнашиваться. После нескольких сот лет переписывания с оригинала оригинал выкидывался. И оригинал вам больше не нужен, потому что у вас есть 50 копий оригинала. Теперь вы используете эти копии несколько сот лет. Они изнашиваются, и вы их выкидываете, потому что у вас теперь есть 500 копий оригинала.
  rating: neutral
  verdict: 'Упрощённо, но в целом верно: подлинники книг Нового Завета износились и не сохранились, текст дошёл до нас в копиях.'

- id: lecture-7-3964
  start: 3964.5
  end: 4002.5
  text: Несколько сот лет после Иисуса Христа появился культ наподобие свидетелей Иеговы. Они хотели быть христианами. Но хотели иметь свою Библию. И они сделали свой манускрипт Библии. Также известный под именем Александрийский манускрипт. Потому что он был написан в Александрии, в Египте, в то время большой центр обучения мира. В этом манускрипте было изменено много вещей. Это была фальшивая Библия. Но похоже на настоящую. Если вы делаете фальшивые доллары, то вы не ставите на них картинку Микки Мауса. Вы стараетесь, чтобы они выглядели как доллары.
  rating: red
  verdict: 'Александрийский тип текста — не подделка сектантов: к нему относятся древнейшие рукописные книги (кодексы) IV века, которыми пользовалась церковь. Один из них зовут Ватиканским лишь по месту хранения. Сравнение со свидетелями Иеговы ничем не обосновано.'
  arguments:
  - kjv-only
  rhetoric:
  - loaded-language

- id: lecture-7-4003
  start: 4003.2
  end: 4025.6
  text: И они всё-таки изменили много вещей. Им не нравилась идея Божества Христа, и они изменили фразу «Господь наш Иисус Христос» на просто слово «Иисус». Но Александрийский манускрипт не использовался. Ранняя церковь признала манускрипт подделкой, и он не использовался.
  rating: red
  verdict: 'В александрийских рукописях Божество Христа сказано ясно: например, Ин 1:18 там читается «единородный Бог». Ранняя церковь эти рукописи не осуждала: их веками переписывали и читали в Египте.'
  arguments:
  - kjv-only

- id: lecture-7-4026
  start: 4026.3
  end: 4063.3
  text: В это же время копии переписываются с копий и выкидываются. В начале XV столетия появилась Библия Уиклифа, Библия Тиндейла, Библия Ковердейла. Много переводов Библии на английский. И Библия Короля Джеймса. И все рады. У них есть 5 000 копий так называемого Textus Receptus — «полученного текста». Они сравнивали все Библии и нашли незначительные изменения, обычно орфографические изменения, как имена или названия городов. Это были незначительные ошибки, и доктрины не были изменены между этими пятью тысячами копиями или переводами.
  rating: orange
  verdict: Что английские переводы опирались друг на друга, верно. Но Библия Уиклифа — XIV век, Textus Receptus Эразм составил по немногим поздним рукописям, а «5000 копий» — это все греческие рукописи, и в них есть разночтения.
  arguments:
  - kjv-only

- id: lecture-7-4064
  start: 4064.7
  end: 4092.2
  text: 'Но самому старому манускрипту в то время было 800 лет. Некоторое время спустя кто-то нашёл Александрийский манускрипт. Говоря: «О, он намного старше. Значит, он лучше». Это и есть ошибка. Да, он старше, потому что он хуже. Потому что он не использовался. И за последние несколько сот лет было много переводов с Александрийского манускрипта.'
  rating: red
  verdict: 'Довод «старше, потому что хуже» ничем не подтверждён: древнейшие папирусы сохранились прежде всего благодаря сухому климату Египта. А учёные оценивают каждое разночтение по многим рукописям, а не просто выбирают самую старую.'
  arguments:
  - kjv-only

- id: lecture-7-4095
  start: 4095.4
  end: 4122.6
  text: Это были хорошие переводы. Их переводили умные люди с искренним убеждением. Я надеюсь. Но они переводят плохой манускрипт. Это точно как хороший перевод Playboy. Да, хороший перевод, но плохой журнал. И большинство новых переводов, новых версий Библии, по крайней мере, основанные или включают в себя Александрийский манускрипт.
  rating: orange
  verdict: 'Что переводчики новых версий — умные и искренние люди, верно. Но сравнение Библии с журналом Playboy — насмешка, а не довод: разночтения между рукописями не меняют учения веры.'
  arguments:
  - kjv-only
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-4125
  start: 4125.4
  end: 4170.7
  text: И я предпочитаю версию Короля Джеймса, потому что я не знаю лучшей версии, не потому, что Бог не может повторить. Во-первых, у Короля Джеймса было много денег. Человек, ответственный за перевод Библии, говорил на сорока пяти языках. Кто-то сказал, что в среднем люди, работавшие над переводом В среднем говорили на одиннадцати языках. Это были умные люди. Это было время до телевизора. Я не думаю, что у кого-то сегодня есть деньги или наклонность для проведения такого перевода. Даже если там и есть несколько сложных слов, я понимаю. Вообще-то, я скорее попытаюсь поднять уровень моего интеллекта до уровня Библии, чем опустить Библию до моего интеллекта.
  rating: orange
  verdict: Переводчики короля Якова действительно были выдающимися знатоками языков. Но цифры о «45 языках» ничем не подтверждены, а у современных переводчиков больше древних рукописей и знаний о языке, чем было в 1611 году.
  arguments:
  - kjv-only
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-4178
  start: 4178.2
  end: 4216.4
  text: Есть много христиан, использующих другие версии Библии. Я покаялся, читая исправленную стандартную версию Библии методистской церкви. Вы даже можете привести к Богу свидетеля Иеговы по его же Библии. Так что есть много евангельского материала. Конечно, я предпочитаю видеть кого-то читающим новую версию Библии, чем Playboy, если так сравнивать. И я не думаю, что мы должны спорить с молодыми христианами или малознающими христианами. Это будет для них шоком. «Что ж с моей Библией?» Дайте им время.
  rating: green
  verdict: 'Верно и по-доброму: к вере приходят через разные переводы, и смущать новообращённых спорами о переводах не нужно.'

- id: lecture-7-4217
  start: 4217.7
  end: 4230.9
  text: И некоторые из сторонников версии Короля Джеймса должны иметь милосердие. Но если вы серьёзно изучаете этот вопрос, вы увидите, что все другие версии нужно поставить на полку со знаком «череп и кости».
  rating: purple
  verdict: Мы благодарны Богу за Библию короля Якова. Но называть «ядом» все другие переводы значит осуждать и Синодальный перевод, и тот, по которому Ховинд сам пришёл к вере; спор о рукописях не спор о верности Богу.
  arguments:
  - kjv-only
  rhetoric:
  - loaded-language

- id: lecture-7-4233
  start: 4233.6
  end: 4259.7
  text: Также меня тревожит, когда я вижу сатанинскую эмблему на Библии. Как на новой версии Короля Джеймса. Сатанинский символ на новой Библии. И меня тревожит, что Мёрдок владеет авторским правом на новые Библии. Во-первых, меня тревожит, что на Библию вообще ставится авторское право. Что происходит?
  rating: red
  verdict: Знак на обложке NKJV — трикветр, древний христианский символ Троицы, а не сатанинская эмблема. Авторским правом защищён текст конкретного перевода, а не Слово Божье; права на саму Библию короля Якова в Англии принадлежат короне.
  arguments:
  - kjv-only
  rhetoric:
  - conspiracy

- id: lecture-7-4260
  start: 4260.8
  end: 4500.5
  text: 'Посетите веб-страницу avpublications.com. И вы сможете сравнить разные версии Библии. Я не хочу тратить много времени, но я об этом упоминаю при возможности. Вопрос. Есть ли противоречия в Библии? Я вырос в лютеранской меннонитской методистской церкви. Потом я покаялся и начал ходить в радикальную, фундаментальную независимую баптистскую церковь в Иллинойсе. Мои родители начали беспокоиться, потому что я стал ходить в церковь. по три-четыре раза. Начал читать Библию по часу в день. В то время появился новый Кент Ховинд в возрасте 16 лет. И мои родители захотели меня немного успокоить и предложили мне поехать в методистский лагерь. Они надеялись меня успокоить. Моя церковь была очень либеральной. И когда я покаялся, я спросил пастора Вы пойдёте на небо? Он сказал: «А я не верю, что есть небо». Это был мой пастор. Так вот. Я покаялся несколько месяцев назад. Мне было 16 лет. Я поехал в этот лагерь. Как-то вечером нас усадили, и ведущий сказал: «Я студент университета Иллинойса. Я гуманист». В то время я не знал, что такое гуманист. И я спросил: «Значит ли это, что вы верите в людей?» Он сказал: «Да, я верю в людей, но это неправильно». Я спросил:«Вы верите в Библию?» Он сказал: «Нет, это хорошая книга. Но в Библии есть противоречие». Меня учили, что если кто-то скажет, что в Библии есть противоречия, Дайте ему Библию и скажите:«Покажите мне». И я дал ему свою Библию и сказал: «Покажите, где». Он сказал: «Пожалуйста». Вот что он мне показал. В Бытии 1:12 написано, что Бог сотворил зелень, траву и деревья на третий день. Он спросил меня: «Кент, когда Бог сделал деревья и траву?» Я сказал: «На день третий». Он сказал: Стих двадцатый. День пятый. И сказал Бог:«Да произведёт вода пресмыкающихся и птиц душу живую». Он сказал: «Кент, когда Бог сотворил птиц?» Я сказал: «На пятый день». Он сказал: «Из чего?» Я сказал: «Из воды». Он сказал: «Молодец». Продолжаем. Стих двадцать четвёртый. На день шестой сказал Бог: «Да произведёт земля душу живую». Потом в стихе 26 написано: «Сотворим человека». Он сказал: «Давай посмотрим. Растения сотворены на день третий. Птицы сотворены из воды на пятый день. Животные сотворены из земли. Потом создан человек. Ты согласен?» Я сказал: «Да, я согласен». Он сказал: «Хорошо, теперь посмотрим на главу вторую». Стих седьмой. Там написано: «И создал Господь Бог человека из праха земного, и насадил Господь Бог рай в Эдеме на востоке и поместил там человека, которого создал. И произрастил Господь Бог из земли всякое дерево». Он сказал:«Подожди, Кент». Я думаю, что в главе первой деревья были сотворены до человека, а в главе второй деревья сотворены после человека. Видишь? Противоречие в Библии. В главе второй в стихе девятнадцатом написано, что Бог сделал птиц из земли после сотворения человека в шестом дне. В главе первой птицы сотворены из воды на пятый день. В главе второй, в стихе восемнадцатом животные сотворены после человека. В главе первой животные сотворены до человека. Он сказал: «Кент, Библия — это хорошая книга, но в ней много противоречий». Обычно в начале семинара я говорю, что Библия — это верное вдохновенное слово Бога Живого.'
  rating: neutral
  verdict: 'Ссылка на сайт сторонников Библии короля Якова и рассказ о юности: вожатый-гуманист указал на «противоречие» в порядке творения в Быт 1 и Быт 2. Стихи пересказаны точно; ответ Ховинда ниже.'

- id: lecture-7-4502
  start: 4502.0
  end: 4553.7
  text: 'И если это правда Как насчёт противоречий в Библии? Мне часто задают этот вопрос на дебатах: «В какую историю сотворения вы верите? В первую или во вторую?» Я говорю: я верю двум. Они скажут: «Ну, они же противоречат». Это не так. Вот что произошло. В Бытии 2:18 написано: «И сказал Господь Бог: нехорошо быть человеку одному; сотворим ему помощника, соответствующего ему». Заметьте, что здесь написано «помощника», который бы соответствовал ему. Он сотворил соответствующего помощника. И сказал Господь Бог. Сотворим ему помощника. Господь Бог образовал из земли всех животных полевых и всех птиц небесных, чтобы видеть, как он назовёт их.'
  rating: purple
  verdict: Согласны, что Писание не противоречит себе. Вопрос о двух рассказах творения законный, и христиане отвечают на него по-разному; это богословский спор, а не научный.
  arguments:
  - genesis-literal

- id: lecture-7-4554
  start: 4554.2
  end: 4610.1
  text: 'Вот порядок событий. В день третий Бог создал растения, в день пятый создал птиц из воды, в день шестой Бог создал животных и потом человека. Потом он создал сад. Потом он создал деревья только для Адама. И для сада. И Адам это видел. Деревья сада не относятся к деревьям, которые уже росли по всему миру. Только для сада. Тогда он создал по одному животному, чтобы Адам смог дать им имя. И выбрать жену. Адам увидел гиппопотама. И он сказал: «Гиппопотам». Нет, спасибо. Аминь. Потом появился жираф. Адам сказал: «Жираф». Нет, спасибо. И по одному Бог создал всех животных, но мир уже полон животных.'
  rating: purple
  verdict: Оба рассказа о творении — Слово Божье, тут мы с Ховиндом едины. Но мысль, что в саду Бог заново создал деревья и животных по одному для Адама, — догадка Ховинда; многие толкователи видят в Быт 2 не хронику, а другой взгляд на то же творение.
  arguments:
  - genesis-literal

- id: lecture-7-4612
  start: 4612.1
  end: 4638.2
  text: 'Причина, я думаю, что если бы Бог сделал Адама последним… Сатана смог бы подойти к нему и сказать: «Это я всё сделал». И как знать Адаму? Только один человек не видел, кто это сделал. Ева. Кого обманул Сатана? Еву. Адам знал, кто это сделал. Он всё видел?'
  rating: neutral
  verdict: 'Догадка Ховинда, почему сатана обратился к Еве: она не видела творения. Писание этого не говорит, а на доводы о науке это не влияет.'

- id: lecture-7-4640
  start: 4640.8
  end: 4650.1
  text: Глава вторая — это более подробное изложение произошедшего в «дне шестом». Это не противоречие. Противоречий в Библии нет.
  rating: purple
  verdict: Что Быт 2 подробнее рассказывает о сотворении человека, — давнее толкование, его держат многие христиане. Другие видят в двух главах два рассказа с разным взглядом на творение; это законный спор толкователей.
  arguments:
  - genesis-literal

- id: lecture-7-4651
  start: 4651.3
  end: 4745.8
  text: 'Я помню, я изучал математику и науку, которые я преподавал 15 лет, когда мне попалась Вторая Паралипоменон, четвёртая глава. Соломон сделал громадную медную чашу, 10 локтей от края до края. И шнурок в 30 локтей обнимал его кругом. Я поставил Библию на кровать, и я сказал: «Бог, это ошибка». В это время в школе меня преследовали как христианина. Вы знаете, дети не любят вас, потому что вы христианин и делают плохие вещи в вашей машине. Я сказал: Господи, я не против переносить гонения и жить для тебя. Если твоя книга верна. Ну, если в ней есть ошибки, Тогда нет. Тогда я не хочу этого. Это беспокоило меня. Если подсчитать длину окружности, это диаметр умножить на пи. Греческий номер 3,1415 и так далее. Японцы посчитали 700 десятичных значений после трёх. Я подумал: зачем? Однако длина окружности Медного моря должна быть 3,14 или 31 локоть. Не тридцать локтей. Я думал, это была математическая ошибка в Библии. Я читал это снова и снова, и я сказал: «Боже, здесь ошибка». Он сделал громадную медную чашу: 10 локтей в диаметре, 30 локтей вокруг и толщиною в ладонь. Кстати, это очень много меди.'
  rating: neutral
  verdict: 'Личная история о Медном море (2 Пар 4:2): диаметр 10 локтей и окружность 30 будто бы не дают числа «пи». Вопрос поставлен честно, ответ ниже.'
  rhetoric:
  - personal-story

- id: lecture-7-4748
  start: 4748.1
  end: 4806.3
  text: Локоть — это от локтя до пальцев. Я читал и читал, пока до меня не дошло. Подождите. Это же толщиной в ладонь. Я думаю, что они измерили наружную сторону чаши, 10 локтей, если придётся проносить чашу через дверь. И они измерили середину чаши для измерения объёма. Мне было интересно узнать пропорцию между локтями и ладонью. И некоторое время я беспокоил людей. «Извините, можно я измерю ваш локоть?» Они вдруг смотрят на вас так странно. И я измерял их локоть. Я нашёл среднюю пропорцию между локтем и ладонью. Я нашёл, что если вы отнимете две ладони от десяти локтей и посчитаете обратно, то получится пи. 3,14159265. Всё-таки Библия верна. В ней нет конфликтов. Нет противоречий.
  rating: green
  verdict: 'Объяснение толщиной стенок давно известно и разумно. Только «ровно 3,14159265» из него не выходит: ладонь и локоть — меры приблизительные, и текст просто округляет.'

- id: lecture-7-4806
  start: 4806.6
  end: 4936.7
  text: 'Беспокоило меня и это: Третья Царств, четвёртая глава. У Соломона было 40 000 стойл. Для коней колесничных. Запомните это число. Сорок тысяч стойл. Для коней колесничных. Читаем то же самое во Второй Паралипоменон. Глава десятая. Девять. Было у Соломона 4 000 стойл для коней и колесниц. Подождите. Было у него 40 000 стойл для коней колесничных или 4 000 стойл? Противоречие в Библии. Много справочных Библий, включая Библию Генри Морриса. Моррис является моим другом, он верующий человек, но в его примечаниях есть несколько ошибок. Мы продаём его Библию. Это одна из лучших Библий с примечаниями. Однако он попал в ловушку. Говорят, что возможны ошибки переписывания. Нет, это не ошибка. Нужно прочитать это очень внимательно. Было у Соломона 40 000 стойл для коней колесничных. Здесь говорится, что у него было 40 000 колесниц. Нет. У него было 40 000 стойл для коней колесничных. В другом стихе написано: Было 4 000 стойл для коней и колесниц. Видите разницу? У него было 4 000 колесниц и 10 коней на колесницу. Невозможно поставить трёхмерный объект в двухмерный мир. Однако я, как трёхмерное существо, могу быть прямо над ними. И они не будут знать о моём присутствии. Я ближе к ним, чем брат. Я могу быть над ними, под ними, вокруг них, в них, и они не будут знать. Потому что я живу в трёхмерном мире. Длина, ширина и высота. Я сказал: это интересно. Я всё понимаю.'
  rating: neutral
  verdict: Расхождение чисел в 3 Цар 4:26 и 2 Пар 9:25 объясняют и ошибкой переписчика, и согласованием, как у Ховинда; это вопрос толкования текста, к науке он не относится. Затем — образ двухмерного мира для объяснения вездесущия Бога.

- id: lecture-7-4937
  start: 4937.4
  end: 4975.0
  text: 'Он сказал: «Посмотри на Ефесянам, главу третью». «Могли постигнуть со всеми святыми, что широта, и долгота, и глубина, и высота». Четыре измерения. Вы знали, что Бог ближе к нам, чем брат? Он в нас, вокруг нас, над нами, и иногда мы не знаем о его присутствии. Но он здесь. Бог сказал Ною: «Войди в ковчег». Он не сказал: «Пойди в ковчег». Он сказал: «Войди в ковчег». Он был там?'
  rating: purple
  verdict: Мы тоже верим, что Бог вездесущ и близок к нам. Но «широта, долгота, глубина и высота» в Еф 3:18 — образ безмерной любви Христа, а не сведения о четвёртом измерении.
  arguments:
  - bible-science-foreknowledge

- id: lecture-7-4979
  start: 4979.8
  end: 5006.3
  text: Ещё вопрос. Меня часто спрашивают, откуда появились расы? Я дам на него другой ответ, чем 10 лет назад. Рас нет. Есть только одна раса. Человеческая раса. Есть разный цвет кожи. Но только одна раса. Есть много цветов коров. Но это всё равно один вид. Да. Это только цвет кожи.
  rating: green
  verdict: 'Верно: все люди — один вид, а различия во внешности поверхностны, это подтверждает генетика. Мы тоже верим, что Бог «от одной крови произвёл весь род человеческий» (Деян 17:26).'

- id: lecture-7-5007
  start: 5007.5
  end: 5100.3
  text: 'В одной чёрной семье было трое детей-альбиносов. Есть расовые характеристики: норвежцы со светлыми волосами и голубыми глазами, аборигены с тонкими мышцами икр. Индейцы с высокой костью щеки, китайцы со светлой кожей и узкими глазами. Эти характеристики, я думаю, легко объясняются. Есть книга, которая объясняет, что произошло с детьми Ноя после потопа. Как они разошлись после потопа? Есть четыре теории о появлении разных цветов кожи. Я верю только одной теории. Ну, я представлю все четыре, так как они циркулируют среди христиан. В теории первой говорится, что Адам и Ева были смуглыми и от их семьи произошли все цвета. Может, так и было, я не знаю. Очевидно, Богу нравится разнообразие. Посмотрите вокруг. Во второй теории говорится, что Бог, Господь сделал Каину знамение, и некоторые говорят, что Каин был первым человеком другого цвета. Если вы чёрный и вы думаете, что Адам был чёрный, если вы белый и вы думаете, что Адам был белый. Каждый думает по-разному. Я просто знаю, что Адам был норвежец. Хорошо. Я не думаю, что это разумная теория, потому что после потопа опять одна семья. Разве что кто-то из семьи Ноя женился на ком-то из другой расы или цвета. Что совершенно нормально, Писанием это не запрещается.'
  rating: neutral
  verdict: Перечень внешних признаков и обзор христианских версий о цвете кожи. Ховинд верно отвергает «печать Каина» как объяснение; шутка про Адама-норвежца на довод не влияет.

- id: lecture-7-5101
  start: 5101.6
  end: 5141.6
  text: 'Как-то я слушал радио, и там говорили о межрасовом браке. Какой-то глупец позвонил и сказал: «Чёрные не должны вступать в брак с белыми, потому что во Втором Коринфянам написано: „Не преклоняйтесь под чужое ярмо с неверными, ибо какое общение праведности с беззаконием?“» Я подумал: «Ничего себе». И я не мог позвонить, но я сказал бы ему: «Приятель, ты не прав, тебе нужен стих, где написано: „Что общего у света с тьмою?“» Нет, в этом нет ничего плохого. Я, например, норвежец, а моя жена ирландка. Это межрасовый брак.'
  rating: green
  verdict: 'Верно: 2 Кор 6:14 говорит о союзе верующего с неверующим, а не о цвете кожи; межрасовый брак Писание не запрещает.'
  rhetoric:
  - personal-story

- id: lecture-7-5146
  start: 5146.2
  end: 5167.9
  text: В третьей теории говорится, что Ной проклял Ханаана. Это интересная история, когда Хам увидел наготу Ноя и, наверное, Ной напился случайно. Я не думаю, что брожение было возможно до потопа. Я думаю, что это была случайность. По крайней мере, я сомневаюсь в его намерении. И когда я попаду на небо, я не хочу, чтобы Ной говорил мне, что я несправедливо его обвинял.
  rating: orange
  verdict: Желание не обвинять Ноя понятно. Но мысль, что до потопа не могло быть брожения, Ховинд выводит из своей идеи о водяной оболочке и повышенном давлении. Но дрожжи бродят при любом обычном давлении, и Писание о таком отличии мира не говорит.
  arguments:
  - vapor-canopy

- id: lecture-7-5169
  start: 5169.3
  end: 5191.0
  text: 'В Библии написано: «Проклят Ханаан, раб рабов». Виноват был Хам, а проклят Ханаан. Многие учат, что Ханаан был первым чёрным человеком, и чёрная раса должна быть рабами из-за проклятия «раб рабов». Я этому не верю ни на секунду. Ну, вы удивитесь, сколько христиан верят этому. Я не думаю, что это разумная теория.'
  rating: green
  verdict: 'Верно, и это важно: проклятие Ханаана не связано с цветом кожи, а толкование, которым оправдывали рабство, церкви давно отвергли.'
  arguments:
  - ham-curse

- id: lecture-7-5191
  start: 5191.6
  end: 5263.1
  text: 'Четвёртая теория самая рациональная. Причиной этого была Вавилонская башня. Они строили башню, пытаясь игнорировать Божье повеление идти и размножаться по миру. Они решили остаться вместе и построить Вавилонскую башню. Бытие 10: Бог разделил языки. Но написано, что они разделились по языку своему, по племенам своим, в народах своих. Разделились не только языки, но и народы. И при близком межродственном скрещивании. Поколение после поколения. Резко выражаются необычные качества. И после потопа появились маленькие группы людей, говорившие на французском, группы, говорившие на немецком, И они вступали в брак друг с другом. Вы должны были говорить на одном языке, чтобы хоть сделать предложение. Ну, хотя бы несколько слов. Когда они вступали в близкий семейный брак, проявлялись характерные качества. В Европе был закон жениться на членах королевской семьи. И часто этим членом была ваша сестра. И после нескольких поколений таких близких браков Проявлялись необычные черты.'
  rating: purple
  verdict: Что внешние признаки закрепляются в небольших замкнутых группах, верно. Но у людей такие различия складывались десятки тысяч лет, а не века после Вавилонской башни; читать Быт 11 как научное объяснение — одно из толкований.
  arguments:
  - genesis-literal

- id: lecture-7-5264
  start: 5264.4
  end: 5277.8
  text: Это происходит и в животном мире. Например, для получения карманной собаки. Подумайте. Сколько труда было затрачено, чтобы произвести совершенно бесполезную собаку?
  rating: neutral
  verdict: Пример с породами собак и шутка о «бесполезной» собачке; на довод не влияет.

- id: lecture-7-5282
  start: 5282.8
  end: 5364.9
  text: В Бытии 10 написано, что они были разделены после потопа. Я постарался посчитать, сколько было языков. Это нелегко. Ну, выглядит, что у Иафета было 14 потомков. У Хама был 31 потомок. Из которых только один Ханаан. И если Ханаан был проклят и он стал чёрным, появляется проблема, потому что они все поселились в Африке. Большинство. И родословные согласятся, что африканская раса— это потомки Хама. И только один был проклят. Поэтому здесь нет ничего общего. У Сима было около 29 потомков, всего 75. Я полагаю, что было около 75 начальных языков. Если посмотреть на языковые группы, у английского, немецкого и датского есть много одинаковых корней, и, наверно, у них был общий язык предков. Они похожи. У испанского, итальянского, французского и латинского есть много общего. Они тоже могли произойти от одного языка. Я гарантирую, что если бы не телефоны и коммуникации, Английский язык тоже бы разделился на 10 разных языков прямо сейчас. Если бы люди с юга не могли говорить с людьми из Бруклина Через несколько поколений. Они бы не поняли друг друга.
  rating: orange
  verdict: 'Что языки ветвятся от общих предков, верно: английский и немецкий — родня. Но так языки расходятся за века и тысячелетия, а не за несколько поколений, и их многообразие не сводится к 75 начальным языкам.'
  arguments:
  - genesis-literal

- id: lecture-7-5368
  start: 5368.1
  end: 5422.6
  text: 'Кто-то что-то вам скажет, и вы что? Ха Я часто путешествую, и я слышу разные диалекты. Это смешно. Иногда я прошу резиновую ленту. Мне говорят: «Что?» Я им показываю, и они говорят: «О, вы имеете в виду Диснолента». В Англии это называется эластик. Как-то в Австралии к моей жене подошла женщина с ребёнком и попросила:«Вы можете вынянчить моего ребёнка?» В Австралии это значит присмотреть за ребёнком. В Австралии и в ресторане я попросил у официантки салфетку. Посмотрела на меня. Миссионер, с которым я был, сказал: «В Австралии это значит детская пелёнка».'
  rating: neutral
  verdict: Шутки о различиях английского в разных странах.

- id: lecture-7-5427
  start: 5427.3
  end: 5462.3
  text: Я думаю, что языки появились во время Вавилонской башни. В Библии ясно сказано, что все люди от одной крови. И нет причины быть расистом. И если вы посылаете деньги, чтобы миссионер смог поехать за океан и привести к Богу чёрного человека, но вы не делаете этого на вашей улице, вы лицемер. В Библии сказано, что у всех нас один Отец. Почему же мы вероломно поступаем друг против друга?
  rating: green
  verdict: 'Мы полностью согласны: все люди от одной крови, и расизм для христианина недопустим. О происхождении языков сказано выше.'

- id: lecture-7-5462
  start: 5462.6
  end: 5517.2
  text: Вопрос. Что насчёт клонирования? Интересно. Клонированная овца, согласно детскому журналу «Открытие», стоила $50 000 после 277 провалов. Нуклеас был пересажен в оплодотворённое яйцо и помещён в заменную овцу. Я хочу заметить, что цена в $50 000 для одной овцы — это дорого. Овцы могут сделать это намного быстрее и дешевле. Они это делали уже долгое время. Вот что было сделано. Это интересная генетическая штука. Но они не создали ничего нового. Они взяли имеющийся материал ДНК и трансплантировали его.
  rating: orange
  verdict: 'Овца Долли действительно получилась после 277 неудачных попыток. Но цель была не в «дешёвых овцах»: опыт показал, что взрослую клетку можно перепрограммировать. Ядро пересадили в яйцеклетку без ядра, а не в оплодотворённую.'
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-5518
  start: 5518.6
  end: 5547.1
  text: 'Я подозреваю, что они уже клонировали людей некоторое время. Я не знаю этого. Ну, я так думаю. Позвоните по телефону 1-800- Кей-Хаус-1. Это организация Чака Мислера. У него есть интересные вещи о клонировании и о НЛО. У него также есть книга, которая называется«Вторжение инопланетян». Тот же самый телефон: 1-800-Кей-Хаус-1.'
  rating: red
  verdict: 'Тайного клонирования людей никто не показал; Ховинд сам говорит: «я не знаю этого». Подозрение без фактов — не довод.'
  rhetoric:
  - conspiracy

- id: lecture-7-5548
  start: 5548.9
  end: 5618.6
  text: 'Вопрос. Что насчёт пересечения Красного моря? Не думаете ли вы, что если армия утонет в море, то останутся доказательства? В Исходе, главе четырнадцатой, Бог сказал Моисею поставить стан у моря. Главе четырнадцатой. Написано, что воды были им стеною по правую и по левую сторону. Если воды стоят стеною… то это уже не просто переход вброд. Некоторые толкователи и учителя Библии учат, что они перешли море в неглубоком мелком месте. Но подумайте. Как вся армия фараона утонула в мелкой воде? Фараон им что, сказал: «Все ложитесь под воду и не поднимайтесь, пока я вам не скажу»? Нет, воды были им стеною. И написано, что Бог отнял колёса у колесниц. Это интересно. Вода покрыла колесницы. Библия ясна по этому счёту.'
  rating: purple
  verdict: 'Мы тоже верим, что переход через море был чудом Божьим. Но и толкование про мелководье чуда не отрицает: в Исх 14:21 Бог гонит воду «сильным восточным ветром». Это законный спор толкователей.'
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-7-5619
  start: 5619.2
  end: 5678.1
  text: 'Если вы посмотрите сюда, когда они вышли из Египта, они должны были пройти Синайский полуостров. Хотя он так называться не должен. По двум сторонам полуострова находится вода Красного моря. Слева находится Суэцкий залив. Справа находится залив Акаба. Очевидно, выйдя из Египта, они пересекли этот полуостров. И пересекли залив Акаба. Почти в каждой Библии на карте вы увидите внизу гору с названием «гора Синай». И вопросительный знак. Кто-то около 1000 лет назад сказал: «Я думаю, что это гора Синай». Я думаю даже, что это была женщина. Я не помню всю историю. Но это не гора Синай, друзья. Гора Синай даже не на Синайском полуострове. Фактом является то, что они пересекли весь полуостров и перешли залив Акаба. Вот здесь.'
  rating: orange
  verdict: 'Где гора Синай, учёные действительно спорят, и Аравию предлагают всерьёз. Но традиции Синая на полуострове около 1700 лет: монахи жили там с IV века, тогда же её описала паломница Эгерия.'
  arguments:
  - wyatt-finds

- id: lecture-7-5680
  start: 5680.4
  end: 5722.1
  text: Если посмотреть на эту территорию со спутника Залив Акаба находится в нижней части. Суэцкий залив находится сверху. Эта фотография сделана с северной стороны. Вот здесь вы увидите белую точку. Очевидно, там они перешли залив. Потому что это гигантский пляж. К пляжу ведёт проход между гор. И сегодня, если вы пойдёте этим путём между гор Этот путь выведет вас на пляж. Большие камни отодвинуты с пути, и посредине проходит большая тропа. Это нужно для повозок, правда? Сам пляж очень большой. Может вместить 2—3 млн человек.
  rating: orange
  verdict: Пляж Нувейба действительно большой. Но снимок со спутника не показывает, где шёл народ, а «тропа для повозок» — обычное ущелье пересохшего потока.
  arguments:
  - wyatt-finds

- id: lecture-7-5723
  start: 5723.0
  end: 5750.8
  text: С южной стороны пляжа мой друг Рон Вайетт, которого теперь нет, он нашёл этот столб. Они вытащили его, и на нём всё ещё была видна гравировка. Там было написано, что он был сооружён царём Соломоном в память перехода Красного моря. Тогда они обошли залив Акаба и нашли такой же столб на противоположной стороне. Они не переходили Суэцкий залив, они перешли залив Акаба.
  rating: red
  verdict: 'Надпись о переходе Красного моря известна только со слов Уайетта: её никто не прочитал и не опубликовал. Даже креационистские организации находки Уайетта не признают.'
  arguments:
  - wyatt-finds
  rhetoric:
  - personal-story

- id: lecture-7-5751
  start: 5751.6
  end: 5789.8
  text: Вот карта, показывающая глубину воды. Глубина очень большая, полторы тысячи метров. Кроме места возле этого пляжа. Это натуральный подводный мост. Только 30 м глубины. Однако достаточно, чтобы утонуть. Вода разделилась, и они прошли по натуральному мосту под водой. В Библии написано, что огустели пучины в сердце моря. Они даже… Люди даже не запачкались грязью. Это был натуральный подводный мост. По которому они прошли.
  rating: red
  verdict: Подводный порог у Нувейбы есть, но глубина над ним — сотни метров, а не 30, и склоны крутые. Мы верим, что Бог мог провести народ где угодно; но доводом в пользу этого места порог не служит.
  arguments:
  - wyatt-finds

- id: lecture-7-5791
  start: 5791.1
  end: 5820.2
  text: Люди Вайетта осматривали дно недалеко от берега. И нашли колёса колесниц. Позолоченные колёса без колесниц. Их невозможно поднять, потому что дерево сгнило, а золото распадается. Также найдены скелеты людей и лошадей. Были найдены колёса колесниц с четырьмя и восьмью спицами, точно такие, как восемнадцатая династия Египта.
  rating: red
  verdict: «Колёса» на дне известны по нечётким снимкам обросших кораллами предметов; ни одно не поднято и не изучено учёными, поэтому говорить о колесницах XVIII династии нельзя.
  arguments:
  - wyatt-finds

- id: lecture-7-5822
  start: 5822.4
  end: 5844.8
  text: Что значит, что гора Синай находится здесь, в Аравии? Если вы посмотрите на любую карту, вы увидите название Джабаль-аль-Лоз, что значит «гора законов». В Библии говорится, что Синай находится в Аравии. Нужно читать Библию немного повнимательней. В ней находится много интересных вещей.
  rating: orange
  verdict: Павел действительно пишет о «горе Синай в Аравии» (Гал 4:25), но Аравией тогда называли и Синайский полуостров. А Джабаль-аль-Лоз значит «гора миндаля», а не «гора законов».
  arguments:
  - wyatt-finds

- id: lecture-7-5847
  start: 5847.5
  end: 5876.5
  text: На этой горе в Саудовской Аравии вершина чёрная, как от огня. Подножие горы ограждено забором. Теперь это археологический участок. Находится посреди пустыни. Там есть жертвенник с рисунком телят. Разные рисунки. С вершины горы Синай вы можете посмотреть на долину и увидеть не только этот жертвенник. Ну и место, где стоял лагерь.
  rating: red
  verdict: Тёмная вершина Джабаль-аль-Лоз — тёмная горная порода, а не след огня. Рисунки быков встречаются по всей Аравии, и археологи не связывают это место с лагерем израильтян.
  arguments:
  - wyatt-finds

- id: lecture-7-5879
  start: 5879.8
  end: 5923.7
  text: 'Исход 17, написано: «Вот, Я стану пред тобою там на скале в Хориве, и ты ударишь скалу, и пойдёт из неё вода, и будет пить народ». Вы видели рисунки в Библии, где все стоят с чашами? Вы знаете, сколько времени это займёт, чтобы напилось 2 млн человек? На самом деле вода била ключом. Эта скала 18 м высоты. Выше пятиэтажного дома. Приблизившись, вы увидите, что она разделена пополам. Отсюда била вода. По краям сильная эрозия. По-видимому, это скала, в которую ударил Моисей, и из неё пошла вода.'
  rating: red
  verdict: Расколотых скал в этих горах много, и связь именно этой скалы с Исх 17 ничем не подтверждена, кроме догадки Уайетта.
  arguments:
  - wyatt-finds

- id: lecture-7-5925
  start: 5925.0
  end: 5944.5
  text: Я рекомендую видео Рона Вайетта. Видео можно заказать по интернету. wyattmuseum.com Я не согласен с ним во всём, но он сейчас на небе и теперь он знает правду. Но всё же он был моим другом И я верю, что он нашёл место пересечения Красного моря.
  rating: orange
  verdict: 'Хорошо, что Ховинд оговаривается: «я не во всём с ним согласен». Но дружба — не доказательство: находки Уайетта не подтверждены, и креационистская организация «Ответы в Бытии» их тоже не признаёт.'
  arguments:
  - wyatt-finds
  rhetoric:
  - personal-story

- id: lecture-7-5945
  start: 5945.6
  end: 5989.8
  text: В Библии написано, что сера и огонь упали на Содом и Гоморру. Также я верю, что Рон нашёл местонахождение Содома и Гоморры. Города не похожи на города, пока вы не отойдёте на 10 км. Вблизи они выглядят как твёрдый пепел. Но отойдя, вы поймёте, что это ведь город. Полностью сгоревший и ставший пеплом. Там повсюду лежат миллионы кусков серы. Чистая сера. Небольшие куски с оболочками вокруг них. Эти города были засыпаны горящей серой, как и написано в Библии. И это, наверное, один из храмов в центре города. Содома и Гоморры.
  rating: red
  verdict: «Пепельные города» у Мёртвого моря — природные отложения мергеля, размытые в причудливые формы, а серные шарики встречаются в этих породах и без огненного дождя. Ни стен, ни утвари там не найдено.
  arguments:
  - wyatt-finds

- id: lecture-7-5991
  start: 5991.4
  end: 6063.8
  text: 'Что насчёт единорога? В Библии несколько раз упоминается единорог. В Числах, 23, написано: «быстрота единорога у него». И в главе двадцать четвёртой. Иов, 39: «Захочет ли единорог служить тебе и переночует ли у яслей твоих? Можешь ли верёвкою привязать единорога к борозде?» Описание единорога в Библии указывает, что он был сильным. И неукротимым. Его невозможно было приручить. Я думаю, нам внушили идею лошади с рогом, что, наверное, нам невозможно уже забыть эту идею. Но я с этим не согласен. Я предполагаю, что это была разновидность динозавра. Моноклониус или стиракозавр, потому что обычно люди не приучают рептилий ни к чему. Вы не приучаете крокодилов прыгать через кольца. Это не будет очень умно. Но они сильные. Я думаю, это относится к динозавру. Ну, я не знаю. Единорог может относиться к быстрым динозаврам. Я не знаю. Ну, это стихи Библии, в которых упоминается единорог.'
  rating: purple
  verdict: Писание действительно говорит о настоящих животных. Но «единорог» — старый перевод еврейского «реэм», дикого быка-тура; в современных переводах так и пишут.
  arguments:
  - bible-dinosaurs

- id: lecture-7-6064
  start: 6064.5
  end: 6112.6
  text: Следующий вопрос. Как Ной заботился о всех животных в ковчеге? Во-первых, есть только 8 000 видов животных. Ной взял детёнышей, я думаю, по два от вида. Библия ясна. Он не взял все разновидности. Только два от основных видов, и он взял детёнышей. И он взял только животных с дыханием духа жизни в ноздрях. Он не взял насекомых. Они дышат через кожу. Он взял по два каждого вида детёнышей, дышащих воздухом, и многие животные спят или очень вялые в бурную погоду. Во время дождя моя собака валяется на полу. Вообще-то, она всегда валяется. Но особенно при дожде. И Бог был с ними в ковчеге. Так что всё было нормально.
  rating: red
  verdict: Что Ной мог взять молодых животных, предлагают многие сторонники буквального потопа. Но насекомые дышат не кожей, а трубочками-трахеями; а чтобы из «родов» за 4000 лет вышли десятки тысяч нынешних видов зверей и птиц, каждая пара должна была дать десятки новых видов. Такого быстрого появления видов никто не наблюдал.
  arguments:
  - ark-kinds

- id: lecture-7-6113
  start: 6113.6
  end: 6134.9
  text: Ещё вопросы? Почему Бог сотворил ядовитых змей в совершенном мире? Это хороший вопрос. Карл Бах изучал это. И он обнаружил, что если вы поместите ядовитых змей в гипербарическую среду с повышенным давлением воздуха и электромагнитного поля, то они не будут ядовитыми.
  rating: red
  verdict: 'Опытов, где змеи в барокамере теряют яд, не опубликовано: известны только рассказы Карла Бо (в озвучке — «Бах»). Яд — набор сложных белков, и давление воздуха его не меняет.'
  arguments:
  - vapor-canopy

- id: lecture-7-6136
  start: 6136.4
  end: 6199.0
  text: Кстати, сейчас миссионеров учат, что можно избежать смертельного исхода от укуса ядовитой змеи. После укуса, если вы возьмёте источник высокого напряжения, как свечу из газонокосилки или машины. Если вас укусит ядовитая змея… Возьмите из мотора свечу вместе с проводом. Приставьте к руке и попросите кого-то включить зажигание на несколько секунд. Вас стукнет. Ну, это обезвредит яд змеи. Доктор Роджер с Эквадора. Вылечил 300 змеиных укусов. Боль проходит через 15 минут, если нанесён шок в течение 30 минут. Высоковольтный высоковольтный шок обезвредит яд. То же самое и со многими ядовитыми пауками. Нужно нанести шок. Если прошло больше тридцати минут, необходимо нанести шок в укушенное место, в противоположную сторону конечности и на полпути к сердцу. Это нейтрализует яд.
  rating: red
  verdict: Совет опасен. Лечение током от свечи зажигания проверяли, и оно не помогает, а может навредить; при укусе змеи нужно скорее ехать за противоядием.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-6199
  start: 6199.4
  end: 6205.4
  text: Может быть, змеиный яд служил для другого намерения до потопа. Я не знаю, но узнаю, когда попаду на небо.
  rating: purple
  verdict: Честное «я не знаю». Согласны, что зло и смерть не были Божьим замыслом для человека; был ли яд у змей до грехопадения, христиане понимают по-разному.
  arguments:
  - death-before-fall

- id: lecture-7-6206
  start: 6206.7
  end: 6300.2
  text: 'Что насчёт ковчега Завета? В Иеремии написано, что были украдены и блюда, и щипцы, и чаши, и кружки украли для того, чтобы унести в Вавилон. Но не упоминается о ковчеге. Почему не упоминается о ковчеге Завета? И в книге Ездры, когда они принесли эти вещи, описаны все маленькие детали: ложки, вилки, которые взял Навуходоносор. И когда они всё принесли, там были ножи, чаши золотые, чаши серебряные. Все детали. Но почему здесь не упоминается ковчег? Наверное, потому что они его не взяли. В Библии говорится, что Озия сделал машины для метания камней. Аппараты для метания больших камней. Он, наверное, придумал или усовершенствовал катапульты. Навуходоносор должен был атаковать Израиль. И Навуходоносор построил стену вокруг стены города. Было две стены: стена города и другая стена — дальше предела метания камней. И теперь войска осадили город для голода. Очевидно, Иеремия вынес ковчег Завета за городскую стену. И запрятал его между стенами. Бог сказал Иеремии сказать, чтобы царь сдался: он проиграет. Царь не послушался, они всё равно проиграли и были убиты. Но Иеремия вынес ковчег Завета.'
  rating: orange
  verdict: Что ковчег Завета не назван в списках вавилонской добычи, верно, и куда он делся, Писание не говорит. Но «Иеремия спрятал его между стенами» — догадка; древнее предание (2 Мак 2:4–5) называет другое место — гору Нево.
  arguments:
  - wyatt-finds

- id: lecture-7-6301
  start: 6301.7
  end: 6314.0
  text: 'В Первой Паралипоменон написано, что Оза простёр руку, чтобы придержать ковчег. Бог поразил его, и он умер. Израильтяне узнали: «Нельзя трогать ковчег без на то разрешения».'
  rating: neutral
  verdict: Библейский рассказ об Озе (1 Пар 13:9–10) — вступление к истории о ковчеге.

- id: lecture-7-6316
  start: 6316.6
  end: 6330.2
  text: Рон Уайетт — мой бывший друг. Многие креационисты осуждают меня за упоминание Уайетта. Но те, кто осуждает, не говорили с ним, как я с ним говорил лично. Я говорил с ним лично.
  rating: orange
  verdict: Знать человека лично — не то же, что проверить его находки. Креационистские организации отвергают находки Уайетта не из неприязни, а потому что он не представил доказательств.
  arguments:
  - wyatt-finds
  rhetoric:
  - self-authority

- id: lecture-7-6332
  start: 6332.0
  end: 6390.4
  text: 'Рон рассказал, что он шёл по северной части Иерусалима возле мусорной свалки. Вдруг его рука поднялась, и он сказал: «Это пещера Иеремии, там ковчег Завета». Его друг сказал: «Что?» Я сказал, что там ковчег Завета. Не может быть. Нужно исследовать. Он исследовал Писание и обнаружил, что ковчег, очевидно, не покинул Иерусалим. Об этом в Библии не упоминается. 8 лет Рон проводил раскопки мусорной свалки, и он нашёл место распятия Христа. Это три вырезанных места в стене для надписей на трёх языках, кого будут распинать. Продолжая раскопки, Рон нашёл пещеры и также нашёл ковчег Завета. Он рассказал еврейским властям, они посмотрели и отказались его трогать. И он находится там до сих пор.'
  rating: red
  verdict: 'Рассказ о том, как у Уайетта «поднялась рука», проверить нельзя. Ни ковчега Завета, ни «места распятия» он никому не показал: нет ни снимков, ни образцов, и археологи его слов не подтверждают.'
  arguments:
  - wyatt-finds
  rhetoric:
  - personal-story

- id: lecture-7-6391
  start: 6391.1
  end: 6420.6
  text: 'Человек, который делал арфы для храма, кстати, они уже готовы, он приехал ко мне, потому что он видел мои кассеты. Он дал маленький концерт на арфе. Это очень хороший музыкант. Я спросил его. Я понимаю, что всё готовится для Храма. Он сказал: «Да». Уже есть одеяние первосвященника, компьютер показал им, как сделать одежду без швов. Они не могли узнать без компьютера. У них уже есть арфы, уже есть всё.'
  rating: neutral
  verdict: Рассказ о мастере арф для будущего Храма; на доводы не влияет.
  rhetoric:
  - personal-story

- id: lecture-7-6420
  start: 6420.8
  end: 6454.1
  text: 'Я спросил: «Как насчёт ковчега Завета?» Он сказал: «Я спрашивал еврейских властей о ковчеге». Они мне сказали: «Не беспокойся, всё усмотрено». Они не хотят заявить миру, что у них есть ковчег Завета, потому что средние евреи уже готовы разрушить мечеть Омара. Что очень разозлит арабов. И вообще-то, это политическое дело. О нём много не говорят. Но у них есть ковчег Завета. Для информации пойдите на интернет в музей Уайетта. Или позвоните Ричарду Рису. Он работает после Рона.'
  rating: red
  verdict: 'Это слух из третьих рук: мастер слышал от «властей», что «всё усмотрено». Ни одного подтверждения, что у Израиля есть ковчег Завета, нет.'
  arguments:
  - wyatt-finds
  rhetoric:
  - conspiracy

- id: lecture-7-6456
  start: 6456.3
  end: 6556.0
  text: Что насчёт снежного человека или большой ступни? Это вопрос задают мне часто. У моего брата есть аж две. Я встретил восемь человек, которые видели снежного человека. Я говорил с ними. Они все рассказывают похожую историю. Он большой, волосатый. И с плохим запахом. Я видел несколько на Харли-Дэвидсонах. Мне нравятся мотоциклы, хорошо. У меня было где-то 70 или 80, наверное. Я также видел видеозапись Паттерсона, я говорил с людьми, которые видели снежного человека. Я должен сказать, я не знаю. Я слышал разные теории. Некоторые думают, что это неизвестный вид североамериканской обезьяны. Я не знаю. Некоторые думают, что это хиппи шестидесятых годов, которые ещё не вышли из леса. Я не знаю. Я должен сказать, что я не знаю, кто-то другой, пусть ответит за меня. Что насчёт НЛО? Опять же, у меня нет ответа. Я прочитал хорошие книги, я могу порекомендовать книги, вы решаете сами. Если вы хотите изучать НЛО, достаньте книгу Дэвида Льюиса. Телефон 1-800-999-3777. Хорошая книга о НЛО. Сокращённая версия, тот же телефон, книга под названием «НЛО 666». Если вы сильно интересуетесь, позвоните 1-800-Кей-Хаус и купите книгу под названием «Встречи с инопланетянами». Потрясающая книга о НЛО. Как и эта, под названием «Космическая конспирация». Восхитительная книга Стэна Дейо. Про НЛО.
  rating: neutral
  verdict: 'Ответы о снежном человеке и НЛО: Ховинд честно говорит «я не знаю» и советует книги. На доводы о науке это не влияет.'

- id: lecture-7-6558
  start: 6558.7
  end: 6589.5
  text: Я был на Art Bell Show. На это шоу приходят разные люди. И там были эксперты по НЛО. Я прочитал, сколько мне надо. Я не утверждаю, что у меня есть ответ. Но несомненно, выглядит, что происходит демоническая деятельность по психологической подготовке людей к пришествию. Не значит, что НЛО прилетели с других планет. Это может быть засекреченные государственные аппараты, может быть демонические действия, я не знаю, я оставлю этот вопрос для кого-то другого.
  rating: purple
  verdict: Духовная брань реальна, это правда. Но связать НЛО с демонами или секретными аппаратами можно лишь как догадку; Ховинд сам говорит, что ответа у него нет.
  rhetoric:
  - conspiracy

- id: lecture-7-6590
  start: 6590.0
  end: 6615.1
  text: Что насчёт начертания зверя? Мы говорим об этом на кассете пятой. В Библии написано, что всем положено будет начертание. И вы не сможете ни покупать, ни продавать без начертания. Выглядит, что штрихкод является предшественником этого. Потому что два символа в начале, середине и конце штрих-кода — две тоненькие линии номера шесть. Интересно.
  rating: red
  verdict: 'Толкование начертания зверя (Откр 13) — законный богословский спор. Но в штрихкоде нет «трёх шестёрок»: крайние и средние линии лишь похожи на код цифры 6, а сканер читает их как метки начала, середины и конца, не как цифры.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-7-6616
  start: 6616.1
  end: 6646.5
  text: Я прочитал много информации, и я могу дать вам номера телефонов, если вы хотите больше узнать об этом. На некоторых старых штрих-кодах внизу также были буквы F и H. F и H, очевидно, для лба и руки. Можно вводить микросхемы или чипы в животных. Вы знаете? Их можно ввести в руку или в лоб, точно, как написано в Библии. Это, вероятно, технология начертания зверя.
  rating: red
  verdict: Смысл «лоб и рука» буквам на штрихкодах приписан задним числом. Вживляемый чип для животных — бирка с номером без спутникового слежения, и связь его с Откр 13 — догадка.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-7-6648
  start: 6648.1
  end: 6670.9
  text: Позвоните или поговорите с Андерсоном из Арканзаса, или с Мартином из Пенсаколы, или с Куком из Калифорнии. Они все изучали начертания зверя. Вот у этого человека чип на руке. Когда он заходит в дом, включается свет, его весь дом компьютеризирован. И когда он заходит, чип включает разные вещи в доме. В зависимости того, как он запрограммирован.
  rating: neutral
  verdict: Отсылки к «исследователям» начертания и пример человека с чипом-ключом от дома; довода здесь нет.

- id: lecture-7-6672
  start: 6672.7
  end: 6699.4
  text: Карл Сандерс — мой друг. У него есть потрясающий материал и видео о начертании зверя. От латинского слова stigma, to prick. Как его вводят под кожу, не на кожу? Карл Сандерс — один из людей, кто помог изобрести микрочип. Было бы хорошо помечать известных сексуальных преступников такими чипами. Вы согласны?
  rating: orange
  verdict: Что Карл Сандерс помогал изобрести микрочип, известно только с его слов. «Стигма» — слово греческое, а не латинское, а метки для преступников — вопрос права, а не исполнение пророчества.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-7-6707
  start: 6707.4
  end: 6729.6
  text: Сегодня есть много новой технологии. Как технология HAARP, исследовательская программа высотного сияния, где они могут изменять погоду. Книга «Ангелы не играют на этой арфе». Автор этой книги верит в новый век. Он верит, что эта технология прекрасна. Но он всего не понимает.
  rating: red
  verdict: HAARP — станция на Аляске, изучающая ионосферу, слой воздуха выше 60 км, где облаков не бывает. Её радиоволны почти не задевают нижний слой с тучами и дождём, поэтому менять погоду она не может.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-7-6730
  start: 6730.1
  end: 6755.2
  text: Современные спутники могут следить за людьми, чтобы у кого-то не было больше коров, чем положено, например. Или чтобы кто-то не садил там, где нельзя. Это неимоверно. Это технология девяносто второго года. Сегодня она ещё лучше. Маленькие микрочипы выпускаются миллионами. Я подозреваю, что это, наверное, будет начертание зверя. Или что-то очень близкое к этому.
  rating: orange
  verdict: 'Что поля фермеров проверяют по спутниковым снимкам, верно: в Евросоюзе так с 1992 года сверяют субсидии. Но это снимки полей, а не слежка за людьми, и связь их и микрочипов с начертанием зверя — лишь догадка.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-7-6758
  start: 6758.0
  end: 6802.2
  text: Ещё вопрос? Как мы можем говорить, что в допотопном мире животные были травоядными? Но на некоторых животных остались следы хищничества. Я думаю, что, задавая этот вопрос, имеется в виду, что следы зубов были найдены на костях утонувших зверей. Конечно, это не значит, что они ели друг друга, это может значит, что они бились за высокое место во время потопа. Таких мест было мало при высоком уровне воды. Плюс причиной потопа было непослушание Бога. И не значит, что они делали то, что Бог им сказал. И я не знаю, или всё было послушным Богу, как должно быть до потопа. Вопрос.
  rating: red
  verdict: 'Следы зубов на ископаемых костях объяснить дракой во время потопа нельзя: есть кости с зажившими укусами (животное выжило и жило дальше) и окаменевшее содержимое желудков хищников. Значит, хищники охотились и ели добычу, а не только дрались в водах потопа.'
  arguments:
  - death-before-fall

- id: lecture-7-6803
  start: 6803.7
  end: 6857.1
  text: Если климат до потопа был весенним, почему мамонты покрыты шерстью? Хм, это хороший вопрос. В книге Уолта Брауна под названием «В начале». Он детально всё объясняет. Мамонты не были предназначены для холодного климата. У многих животных джунглей длинная шерсть. Давайте предположим, что первоначальный мир был тропическим. Пятнадцать, двадцать, двадцать пять градусов по Цельсию. Длинная шерсть невыгодна и не вредна. Это просто украшение. У длинношёрстных мамонтов нет сальных желез у корней шерсти. И они не выжили бы в холодном климате, потому что у них нет жировырабатывающих желез. Что значит, что шерсть замёрзнет. Поэтому длинношёрстные мамонты не были предназначены для холодного климата.
  rating: red
  verdict: Шерсть мамонта густая, с подшёрстком; у него маленькие уши, короткий хвост и слой жира, а в его ДНК найдены гены приспособления к холоду. Сальные железы в коже мамонта нашли в 2004 году.
  arguments:
  - mammoths-frozen

- id: lecture-7-6858
  start: 6858.9
  end: 6913.1
  text: Как долго Адам и Ева жили в Эдемском саду до грехопадения? Хороший вопрос. В Библии ответа нет, но есть догадка. Подсказка. В Библии сказано, что Адаму и Еве было 130 лет, когда родился Сиф. До этого Не дано никаких дат. Мы также знаем из Бытия 1:31, что всё было совершенно в конце семи дней. Поэтому они не согрешили на первой неделе. Они были выгнаны из сада до рождения Каина и Авеля. Но нет дат, и они могли быть в Эдемском саду около ста лет. Мы не знаем, и Библия не говорит. Но я не думаю, что они согрешили на первой же неделе. Я думаю, что они прекрасно проводили время, служа и прославляя Бога, живя в прекрасном творении, и сатана позавидовал, что они прославляли Бога, и решил, что они должны прославлять его. Это могло взять 100 лет. Библия не говорит.
  rating: neutral
  verdict: 'Честная догадка о том, сколько Адам и Ева прожили в Эдеме: Ховинд сам говорит, что Библия этого не сообщает. На доводы о науке не влияет.'

- id: lecture-7-6913
  start: 6913.4
  end: 6934.8
  text: Вопрос. Есть ли лицо на Марсе? Там есть куча металлолома, которую мы отправили. Нет, я думаю, это ерунда. Это просто тень на горе. Я видел фотографии так называемого лица. Просто необыкновенная структура гор.
  rating: green
  verdict: 'Верно: «лицо на Марсе» — игра теней; на снимках с высоким разрешением видна обычная гора.'

- id: lecture-7-6935
  start: 6935.5
  end: 6958.5
  text: Как вы договариваетесь о дебатах? Если вы найдёте оппонента для дебата, благослови вас Бог. Я буду рад, очень трудно найти оппонента, они не хотят дискутировать с креационистом. Посмотрите мои видеодебаты и узнаете, почему. Подумайте, если бы вам пришлось отстаивать идею того, что мы произошли от камня. Хотели бы вы делать это публично?
  rating: orange
  verdict: 'Что учёные редко соглашаются на публичные дебаты с креационистами, верно. Но причина не в страхе: научный спор решают статьи и проверки, а не красноречие, и никто не утверждает, что люди «произошли от камня».'
  rhetoric:
  - straw-man

- id: lecture-7-6961
  start: 6961.1
  end: 6983.7
  text: Очень трудно найти оппонента. Я говорю, что я согласен дискутировать против пяти сразу. Пожалуйста. Если я приду только с половиной мозгов… я всё равно выиграю спор. Не потому, что я умнее их, это потому, что я прав, они не правы. Очень легко выиграть спор в такой ситуации.
  rating: orange
  verdict: Победа в споре зависит прежде всего от умения говорить. В научном вопросе решает проверка данных, а не то, кто кого переговорил.
  rhetoric:
  - self-authority

- id: lecture-7-6984
  start: 6984.6
  end: 7010.0
  text: Вопрос. Уменьшается ли Солнце? На протяжении лет я использовал это как доказательство молодой Вселенной, факт того, что Солнце уменьшается. Что доказывает границу меньше, чем миллионы лет, как они нам говорят. Я это больше не использую, но это веский факт. Солнце горит. Выйдите на улицу и посмотрите. При горении оно теряет 5 млн т за секунду.
  rating: orange
  verdict: 'Хорошо, что Ховинд больше не пользуется этим доводом. Солнце действительно теряет 4–5 млн тонн в секунду, но это ничтожная доля его массы: за 4,5 млрд лет оно потеряло меньше 0,1%.'
  arguments:
  - sun-shrinking

- id: lecture-7-7011
  start: 7011.7
  end: 7048.3
  text: Наблюдения показывают, за последние несколько сотен лет, после того, как они измерили Солнце. Основываясь на многих факторах, как время между затмениями Луны. Потом это можно использовать для вычисления диаметра Солнца. Есть несколько методов вычисления диаметра. Но главное, что выглядит, что Солнце постоянно уменьшается уже 300 лет, около трёх метров за час. Но мы не знаем, что скорость была всегда одинаковой. Если Солнце было больше, то пропорция поверхности к объёму изменится, изменяя скорость уменьшения.
  rating: red
  verdict: Сжатие Солнца вывели в 1979 году из старых неточных наблюдений; более точные измерения, в том числе по затмениям, его не подтвердили. Диаметр Солнца лишь слегка колеблется.
  arguments:
  - sun-shrinking
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-7-7048
  start: 7048.8
  end: 7093.6
  text: Я думаю, что вместо спора об уменьшении Солнца, хотя оно уменьшается, также важно то, что Солнце теряет массу. Теряет пять миллионов тонн в секунду. Что подействует на силу тяготения. Если вы хотите верить, что Солнце и Земля постоянно были на одном расстоянии, в то время как Солнце теряет материал и притяжение Земли. И вы думаете, что так было миллиарды лет? Благослови вас Бог, у вас больше веры, чем у меня. Я думаю, намного умнее будет сказать, что, потому что Солнце теряет массу и диаметр, поэтому ему не может быть миллиардов лет. Я думаю, что Солнце несомненно уменьшается. Но я не использую это как доказательство, что Земле 6 000 лет.
  rating: red
  verdict: 'Потерю массы учёные посчитали: за всю историю Солнце потеряло меньше 0,1% массы, и орбита Земли от этого почти не изменилась. Слова «у вас больше веры» расчёта не заменяют.'
  arguments:
  - sun-shrinking
  rhetoric:
  - argument-by-incredulity

- id: lecture-7-7094
  start: 7094.3
  end: 7145.7
  text: Две теории сгорания Солнца. Оно сгорает при гравитационном разрушении и при ядерном синтезе. При ядерном синтезе оно может гореть миллиарды лет. При гравитационном разрушении оно не сможет гореть миллиарды лет. Срок будет намного короче. Изучение показало, что при ядерном синтезе оно должно производить нейтрино. Нейтрино, проходя через жидкость сухой чистки, производит аргоновый газ. И они закопали большой бак жидкости сухой чистки у подножия горы, и через много-много лет наблюдений там почти не было аргонового газа. Нашли очень мало нейтрино. Этим они и подорвали теорию ядерного синтеза, но они продолжают верить в неё. Но пока нет достаточно данных, и я не думаю, что это законченное дело.
  rating: red
  verdict: 'Нехватку солнечных нейтрино действительно нашли, но в 2001 году её объяснили: нейтрино в пути меняют тип, а опыт Дэвиса ловил только один. С учётом всех типов их столько, сколько требует термоядерная модель.'
  arguments:
  - sun-shrinking
  rhetoric:
  - cherry-picking

- id: lecture-7-7146
  start: 7146.2
  end: 7162.2
  text: Но Солнце горит и теряет топливо. Эволюционист, который говорит, что ему миллионы лет, не говорит, откуда оно произошло. Откуда появилась энергия? Кто зажёг Солнце? Они не отвечают на все эти важные вопросы.
  rating: orange
  verdict: 'Откуда мир, — законный вопрос, и мы, христиане, отвечаем: от Творца. Но биологическая эволюция о Солнце не говорит, а откуда его энергия, физика знает: от термоядерных реакций.'
  arguments:
  - cosmos-origin-energy
  rhetoric:
  - podmena-ponyatij

- id: lecture-7-7163
  start: 7163.4
  end: 7204.9
  text: Хорошо, что вы думаете о донорстве крови и органов по отношению к Библии? В Библии написано, что евреям было запрещено есть кровь. Я не понимаю, как свидетели Иеговы объясняют, что мы не должны давать кровь. Нет вопроса, что много болезней передаются через кровь. И, конечно, если вы не хотите делать переливание крови, вы не получите чьё-то заболевание. Но если вы умираете от потери крови и не хотите делать переливания, вы умрёте намного быстрее от потери крови. Я не против донорства крови или органов, и когда я умру, у меня для них нет планов. Так что вы можете взять, что хотите. Только подождите, пока я умру.
  rating: green
  verdict: 'Верно: Писание не запрещает переливание крови и донорство; запрет есть у свидетелей Иеговы, а большинство христиан его не разделяет.'

- id: lecture-7-7205
  start: 7205.7
  end: 7234.1
  text: Следующий вопрос. Мой сын пришёл со школы и сказал, что его учитель сделал, сказал, что кровь обезьяны на 99,9% похожа на человеческую. Так ли это? И что ещё нам нужно знать? Наверное, учитель ссылался на то, что ДНК обезьян на 99% похожа на человеческую. Это не доказывает общего предка. Это доказывает общего создателя. Одна личность создала всех животных.
  rating: orange
  verdict: 'Что ДНК человека и шимпанзе сходна на 98–99%, верно. Но выбор «общий Творец или общий предок» ложен: мы верим в Творца, Который мог творить через общее происхождение, а одинаковые поломки в ДНК лучше объясняет общий предок. Так одна и та же редкая опечатка в двух контрольных говорит учителю, что у них один источник.'
  arguments:
  - common-designer
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-7-7235
  start: 7235.1
  end: 7273.2
  text: Если вы возьмёте две энциклопедии и только один процент слов будет разным, в них может быть полностью разная информация. Один процент человеческого ДНК — это гигантское количество информации. Около 150 книг информации. Это только 1%. Отойдите на метр от человека и обезьяны. И вы заметите разницу. В зависимости от выбранного человека. Сходство доказывает общего создателя, не общего предка. Мы говорим об этом, о порядке ДНК, на кассете четвёртой.
  rating: orange
  verdict: 'Что 1% различий — это много: около 35 млн «букв» ДНК, верно. Но генетики и не говорят, что человек и шимпанзе одинаковы; сравнение с энциклопедиями ничего не говорит о происхождении.'
  arguments:
  - common-designer
  rhetoric:
  - false-analogy

- id: lecture-7-7275
  start: 7275.2
  end: 7294.9
  text: Если витамин Б17, как доказано, влияет на клетки рака, почему его нет на рынке для продажи и какая пища содержит много витамина Б17? Мы говорим об этом на кассете второй, витамин Б17. Он в семенах почти всех фруктов. Самое большое, я думаю, в семени абрикоса.
  rating: red
  verdict: 'Амигдалин не витамин и рак не лечит: клинические испытания 1982 года пользы не нашли. А абрикосовые косточки в больших количествах опасны: в организме из них образуется синильная кислота.'
  arguments:
  - vitamin-b17-cancer

- id: lecture-7-7295
  start: 7295.7
  end: 7335.4
  text: 'Если вы хотите узнать, почему он не на рынке, прочитайте книгу «Мир без рака». Первая часть книги показывает биологию и работу рака. Вторая половина имеет дело с политикой, почему лекарства прикрываются. Больше денег получено от рака, чем потрачено. Больше людей делают деньги на болезни, чем умирают от рака. Если сегодня появится витамин, то сколько завтра появится ненужного медицинского оборудования и места? И сколько потеряется денег? Помните, в Библии сказано: «Корень всех зол есть сребролюбие».'
  rating: red
  verdict: 'Сребролюбие — действительно корень многих зол. Но лекарство никто не скрывает: амигдалин проверяли в открытых исследованиях, и он не помог, а продавать его как лекарство запрещено, потому что он может отравить.'
  arguments:
  - vitamin-b17-cancer
  rhetoric:
  - conspiracy

- id: lecture-7-7338
  start: 7338.4
  end: 7371.6
  text: 'Вопрос: если динозавры были травоядными, почему у тираннозавра Рекса были большие зубы? У многих травоядных животных большие зубы. Мы говорим об этом на кассете второй. У крылана ужасные зубы, но он ест фрукты. На зубах тираннозавра Рекса под микроскопом нашли следы хлорофилла, которые находятся в растениях. Каким бы он страшным ни казался, он травоядный. Голливуду нужен свирепый динозавр. Он так выглядит, и он получил роль в кино. Но он был травоядным, а не плотоядным животным.'
  rating: red
  verdict: Зубы тираннозавра толстые и зазубренные, ими дробили кости; в его окаменевшем помёте нашли раздробленные кости других динозавров. Сообщений о «хлорофилле на зубах» в научной литературе нет.
  arguments:
  - death-before-fall

- id: lecture-7-7373
  start: 7373.0
  end: 7863.3
  text: 'Мне задают много вопросов. На моей веб-странице drdino.com есть большой раздел часто задаваемых вопросов, куда постоянно прибавляются новые вопросы. Если у вас есть ещё вопросы, я, конечно, не знаю всего, но я буду рад постараться ответить на ваши вопросы. Также есть другие веб-страницы. Посетите creationism.org, и оттуда вы сможете попасть на около 150 других страниц о сотворении. Некоторые из них не очень хорошие, некоторые получше, но это будет хорошим местом для изучения. Там много интересной информации. Слово Бога верно. Бог сотворил мир. Он хозяин. Он уничтожил его потопом. Это его мир. Он пришёл спасти нас от греха 2 000 лет назад. И Иисус возвращается очень скоро. И если вы не спасены, вы идёте в ад. Вы должны спастись. Если же вы спасены, нужно работать. Потому что когда мы попадём на небо, не будет иметь значения, сколько вы заработали или на какой машине катались. Важно будет, что вы сделали для Христа. Давайте забудем о всём и будем служить Богу. Большое спасибо. Спасибо за просмотр кассеты. Для тех, кто присоединился к нам по кассете, вы можете позвонить, и мы постараемся ответить на ваши вопросы. Мы хотим укрепить вашу веру. На этой кассете мы говорили о возрасте Земли и Эдемском саду. Интересно знать вещи о динозаврах и эволюции. Но намного важнее знать, что вы попадёте на небо. Если вы не спасены или не уверены, что вы спасены, идёте на небо, я хочу показать, что Библия говорит, как попасть на небо. Вы не должны делать, что говорит Бог, но хотя бы должны знать, что нужно делать. Когда я учился в 10 классе в Иллинойсе, я ходил в разные церкви. Но я не знал, что я иду на небо. Я не знал Христа. Я не был спасён. Как-то мой друг спросил меня: «Кент, ты знаешь, что ты идёшь на небо?» Я сказал: «Нет». Он сказал: «Если я возьму Библию и покажу… ты хочешь знать?» Я сказал: «Да». Он взял Библию и показал мне три стиха. И первый раз в жизни я понял, чего хочет Бог. В Библии, в Римлянам 3:23 написано: «Потому что все согрешили и лишены славы Божией». Мы все грешники. Мой друг сказал: «Кент, ты грешник. Ты делал неприятное Богу?» И это правда. Библия говорит, что все грешники. Одни хуже других в человеческих глазах, но в глазах Бога один грех делает вас грешником. Если вы нарушили один закон Бога, то вы являетесь грешником. В Римлянам 6:23 написано: «Ибо возмездие за грех — смерть». Возмездие. Возмездие — это то, что вы заслуживаете, и за грех вы заслуживаете смертное наказание. Вы заслуживаете умереть и пойти в ад. Но Бог не хочет, чтобы вы попали в ад. Каждый должен попасть в ад из-за одного греха. Но он придумал выход. Иисус Христос пришёл и заплатил за ваши грехи. И вы можете принять это. Его смерть заплатила за ваши грехи. Мой друг сказал: «Кент, ты заслуживаешь смерть и ад». Он сказал: «Ну, стих продолжается: „А дар Божий — жизнь вечная в Иисусе Христе, Господе нашем“». Вечную жизнь нельзя получить через церковь, крещение, хорошие дела. Только через Иисуса Христа. Мы получили от наших родителей бесплатный подарок. Физическую жизнь. Кто-то другой прошёл через боль. Заплатил счета, и мы получили в подарок физическую жизнь. Рождение занимает несколько минут. Возрастание занимает долгое время. Рождение свыше занимает тоже несколько минут. Возрастание занимает много времени и усилий. Как чтение Библии, посещение церкви Молитва. Они помогают стать хорошим христианином, но они не делают христианином. Стать христианином можно только, когда Иисус Христос войдёт в ваше сердце и сделает вас новым человеком. 9 февраля шестьдесят девятого года мой друг сказал: «Кент, ты грешник. Согласно Библии, ты должен пойти в ад». Он сказал: «Но Бог хочет дать тебе подарок. Вечную жизнь». Вы заслуживаете вечную смерть, но Бог хочет дать вечную жизнь. Но как её получить? Он сказал: «В Римлянам 10:13 написано: „Ибо всякий…“ Всякий — это значит любой. „Ибо всякий, кто призовёт имя Господне, спасётся“». Написано не «может спастись», а «спасётся». Любой, кто принимает Иисуса Христа, просит прощения. В Иоанна написано, что если вы примете его, вы станете чадом Бога. Написано, что вы должны родиться свыше. Всё взаимосвязано. Если вы принимаете Христа как Спасителя, принимаете в своё сердце, то принимаете его смерть, Вы рождаетесь свыше. Это занимает несколько минут. Нужно сказать: «Иисус, я грешник, прости меня и спаси». 9 февраля я склонил голову и сказал: «Господи, я грешник. Ты умер за меня на кресте. Прости меня. Войди в моё сердце и спаси меня. Сделай из меня нового человека». Я принял Христа как моего Спасителя. Это был день моего духовного рождения. И теперь я дитя Бога. И если я поступаю неправильно, я не могу пойти в ад, потому что я получил вечную жизнь. Но как дитя Бога я могу быть наказан. Теперь я в семье Бога, и ко мне другое отношение. До этого Бог был моим судьёй. Но теперь за мои грехи заплачено. И когда я говорю, что я иду на небо, это не потому, что я такой хороший, а потому, что за мои грехи заплачено. Если вы примете Иисуса Христа как своего Спасителя, он простит ваши грехи и возьмёт вас на небо. В этой секции мы говорили о творении, эволюции, динозаврах, датировании и многих интересных вещах. Но это не будет иметь значения, если вы пойдёте в ад. Проверьте своё сердце. Если вы не приняли Христа, сделайте это сейчас. Склоните голову и помолитесь простой молитвой. В ней нет магических слов. Бог видит ваше сердце. Если вы хотите принять Христа, помолитесь со мной. Дорогой Господь, Я грешник. Я верю, ты умер за меня на кресте. Прости мои грехи. Я принимаю Тебя как Спасителя. Во имя Иисуса Христа. Аминь. В Римлянам 10:13 написано: «Всякий, кто призовёт имя Господне, спасётся». Если вы только что покаялись, Бог обещал, что вы спасётесь. И Божьи обещания вечны. Если вы покаялись, позвоните или напишите мне. Моё имя и адрес появятся на экране. Дайте мне знать, что вы покаялись, и мы возрадуемся вместе. Покаяние — это рождение свыше. Это начало. Возрастание занимает много труда. Читать Библию, посещать церковь. Свидетельствовать другим о Христе. Я буду рад помочь вам. Большое спасибо.'
