  end: 7863.3
  text: 'Мне задают много вопросов. На моей веб-странице drdino.com есть большой раздел часто задаваемых вопросов… Слово Бога верно. Бог сотворил мир… Иисус возвращается очень скоро… В Римлянам 3:23 написано: «Потому что все согрешили и лишены славы Божьей»… «Ибо возмездие за грех — смерть»… «А дар Божий — жизнь вечная во Христе Иисусе, Господе нашем»… И теперь я дитя Бога. И если я поступаю неправильно, я не могу пойти в ад, потому что я получил вечную жизнь… «Всякий, кто призовёт имя Господне, спасётся».'
  rating: neutral
  verdict: 'Заключение семинара и евангельский призыв: свидетельство об обращении и молитва покаяния. Мы разделяем призыв довериться Христу; о том, можно ли утратить спасение, христиане думают по-разному, к научным доводам это не относится.'
