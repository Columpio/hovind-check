- id: lecture-3-48
  start: 48.8
  end: 77.7
  text: В первой кассете мы говорили, что Библия учит, что Земле только 6 000 лет. Не миллиарды лет. И что динозавры жили с Адамом и Евой в Эдемском саду. Они не жили миллионы лет назад, они только… Они были частью творения. Бог сотворил мир 6 000 лет назад. 4 400 лет назад был потоп. До потопа мир был другим. Люди жили дольше, и мир сильно отличался. И динозавры жили с Адамом и Евой в Эдемском саду. Они не жили миллионы лет назад. Это допотопные ящерицы.
  rating: purple
  verdict: Мы тоже верим, что мир сотворил Бог, а Писание рассказывает о потопе. Но «6000 лет» и «4400 лет» — расчёт по родословиям, а не слова Библии; о динозаврах в Эдеме Библия молчит.
  arguments:
  - genesis-literal

- id: lecture-3-78
  start: 78.4
  end: 120.7
  text: 'И возникает простой вопрос. Взяли на ковчег динозавров? Люди скажут: «Динозавров на ковчег? Они ведь громадные». Видите? Большие были большими. А маленькие были маленькими. Ною было 600 лет. Он был достаточно умным, чтобы не брать самых больших животных. Он знал, что можно было взять детёнышей. Разного пола, конечно. Для этого есть много причин. Детёныши маленькие, употребляют меньше пищи, дольше спят. Если они падают, они поднимаются и бегут опять. Когда же взрослые падают, они поднимаются не сразу. К тому же, после потопа они будут жить дольше, и у них будет больше детей. Поэтому их и взяли в ковчег.'
  rating: red
  verdict: 'Мысль взять на ковчег детёнышей остроумна, но Библия о ней молчит. Главное другое: окаменелости показывают, что крупные динозавры вымерли около 66 млн лет назад, задолго до людей, и с Ноем встретиться не могли.'
  arguments:
  - dinosaurs-humans

- id: lecture-3-121
  start: 121.7
  end: 171.0
  text: И он должен был взять только по паре каждого рода. Бог сказал взять по паре каждого рода, не каждого вида или разновидностей. По паре каждого рода рода животного. В Библии говорится, что животные вошли в ковчег по их роду. По роду их. Фраза повторяется много раз в Библии. Только основные роды животных попали на ковчег. Например, сегодня в мире есть 250 разновидностей собак. Ну и не надо было брать 250 пар собак. Он взял только две из рода собак. И с того времени появилось в мире много разновидностей собак. И, наверное, что у собаки, волка и койота был общий предок. Этим предком была собака. Это не эволюция, это только разновидность.
  rating: orange
  verdict: Что собака, волк и койот произошли от общего предка, верно. Но превращение одного предка в несколько разных видов биологи и называют эволюцией; назвать её «разновидностью» — значит сменить слово, а не опровергнуть явление.
  arguments:
  - microevolution-macro
  rhetoric:
  - podmena-ponyatij

- id: lecture-3-172
  start: 172.0
  end: 211.1
  text: 'В одном колледже в Бостоне. Один человек звонил в колледж, чтобы узнать, или они хотят провести со мной дискуссии. И профессора отказывались, но один колледж сказал: «Мы позволим Кенту Ховинду приехать на дискуссию, если мы сможем задавать ему любые вопросы, чтобы студенты увидели, какие глупые верующие в сотворение мира». Пастор позвонил мне и сказал: «Хотели бы вы поехать в Бостон? Они хотят посмеяться над вами несколько часов». Я ответил: «Конечно». Я приехал. Там были шесть профессоров и все студенты. Я участвовал, я чувствовал себя как Даниил во рве львином. Я сказал, что я верю в Библию. Было много аплодисментов.'
  rating: neutral
  verdict: Начало рассказа о дебатах в бостонском колледже; то, что Ховинд говорил там, разбираем ниже.
  rhetoric:
  - personal-story

- id: lecture-3-211
  start: 211.4
  end: 231.8
  text: Библия учит, что Бог сотворил мир 6 000 лет назад. 4 400 лет назад произошёл потоп и разрушил мир. Ной построил ковчег и спас, и спас животных. После потопа появилось много разновидностей животных, основанных на воздействии окружающей среды, производя длинную, короткую шерсть и так далее. Ну, это не эволюция, это разновидность.
  rating: purple
  verdict: Мы тоже верим, что Бог сотворил мир, а Ной спас животных. Но цифры 6000 и 4400 лет — толкование, а не текст Библии. И быстрое появление новых пород и видов после потопа — это и есть эволюция, только очень ускоренная.
  arguments:
  - genesis-literal

- id: lecture-3-232
  start: 232.5
  end: 245.2
  text: 'Тогда я рассказал, чему верят они. Я обнаружил, что большинство эволюционистов не знают, во что они верят. Я сказал: вы верите, что 20 млрд лет назад произошёл Большой взрыв. Ну, вы не знаете, что взорвалось и откуда оно появилось?'
  rating: orange
  verdict: Что наука не знает, что было «до» начала Вселенной, верно. Но Большой взрыв — не взрыв какого-то предмета, а расширение пространства; и возраст Вселенной сегодня оценивают в 13,8 млрд лет, а не в 20.
  arguments:
  - big-bang
  rhetoric:
  - straw-man

- id: lecture-3-245
  start: 245.7
  end: 301.1
  text: Четыре с половиной миллиарда лет назад Земля остыла и образовала каменную кору. Миллионы лет на камне шёл дождь. И образовал смесь. Это то, чему учат учебники, я этого не придумал. При формировании Земли поверхность была горячая и наполнена кипящей лавой. Миллионы лет на камне шёл дождь и сформировались океаны. Это написано в учебнике. Миллионы лет проливного дождя создали великие океаны. Но кипящая вода растворила камни. Что известно под именем «суп». Да, ребята. Кипящая вода в океанах содержит сложные химикаты. Однако процесс химической смеси к живущему организму очень медленный. Да, такой медленный, что он ещё не начался. И тогда эта ранняя жизнь образовалась из камня. Как-то разделилась, нашла чем питаться. И превратилось во всё, что мы видим сегодня. Это во что верят эволюционисты?
  rating: orange
  verdict: 'Что учебники описывают остывание Земли и первые океаны, Ховинд пересказывает близко. Но «жизнь из камня» — его карикатура: как возникла первая клетка, наука честно говорит, что пока не знает, а теория эволюции описывает, как менялась уже существующая жизнь.'
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-3-301
  start: 301.9
  end: 330.8
  text: 'Один профессор встал и сказал: «Доктор Ховинд, извините. Сегодня в мире существует 250 разных видов собак. Вы хотите, чтобы я поверил, что все эти собаки произошли только от двух собак с Ноева ковчега? Вы хотите, чтобы я этому поверил?» Я ответил: «Сэр, посмотрите, чему вы учите ваших учеников. Вы учите их, что все виды собак появились из камня». И после этого у него не было никаких других вопросов.'
  rating: orange
  verdict: 'Профессор задал законный вопрос, а ответа не получил: Ховинд перевёл разговор на «собак из камня». Ни один учебник так не пишет: породы собак вывели люди от волка за последние тысячи лет.'
  rhetoric:
  - personal-story
  - straw-man

- id: lecture-3-333
  start: 333.0
  end: 347.6
  text: Это то, чему учат эволюционисты. Я этого не придумал. Это из учебника. Вы не думаете, что собаки произошли от двух собак с Ноева ковчега? Ну, вы думаете, что все эти собаки произошли из камня? Подумайте ещё разок.
  rating: red
  verdict: 'Выбор «от двух собак с ковчега или из камня» ложен. Наука говорит третье: собаки произошли от волков, а волки — от более древних хищников; «из камня» не учит никто.'
  rhetoric:
  - straw-man
  - lozhnaya-dilemma

- id: lecture-3-348
  start: 348.4
  end: 372.6
  text: Интересно, и думаете ли вы, что если бы был всемирный потоп, то спасшиеся рассказали бы о нём своему потомству? Нелогично ли, что сегодня должны быть легенды о потопе? Вы знаете, что было найдено 270? Сейчас уже 290 легенд о потопе. Почему в них рассказывается о семье, спасшейся в лодке?
  rating: orange
  verdict: 'Что преданий о потопе у разных народов много, верно. Но они сильно различаются: где-то спасаются на горе, где-то на дереве, и многие говорят о местных разливах рек. Сходство не доказывает одного всемирного потопа.'
  arguments:
  - flood-legends

- id: lecture-3-374
  start: 374.4
  end: 409.0
  text: В Китае есть такая легенда. История Китая. В ней говорится, как семья спаслась от потопа. Вся земля была затоплена, все горы. И в ней говорится, что одна семья спаслась в лодке. Китайский классик Хайкинг. Рассказывает о семье Фугай, которого китайцы считают отцом своей цивилизации. В истории говорится, что Фугай и его жена, и три сына и дочери спаслись от великого потопа. Они были единственными оставшимися людьми на Земле. После потопа они заселили землю опять. Хм, похоже на библейский потоп.
  rating: orange
  verdict: Фу Си в китайских мифах действительно связан с потопом, но в классических текстах это культурный герой, а главный китайский рассказ о потопе — о том, как Юй усмирял разливы рек. Подробности о «трёх сыновьях» в древних источниках не найдены.
  arguments:
  - flood-legends
  rhetoric:
  - cherry-picking

- id: lecture-3-410
  start: 410.7
  end: 439.7
  text: 'В Мексике у индейцев-тольтеков есть легенда, что первый мир продолжался 1716 лет и был уничтожен потопом. Спаслась только одна семья. 1 700 лет. Близко к Библии. 1656. Почему так много легенд о потопе? Если бы не было легенд, атеисты бы сказали: «А почему нет легенд?» Есть 300 легенд, хмм, сколько вам нужно? Я думаю, что был всемирный потоп.'
  rating: orange
  verdict: Число 1716 лет взято из хроники, которую индейский историк Иштлильшочитль записал уже после испанского завоевания и крещения Мексики. Поэтому сходство с Библией может быть заимствованием, а «близко» к 1656 годам — натяжка.
  arguments:
  - flood-legends
  rhetoric:
  - cherry-picking

- id: lecture-3-441
  start: 441.0
  end: 454.6
  text: Интересно, а если вы посмотрите на карту Турции, с правой стороны вы увидите гору Арарат. На турецкой карте это нюхум Гемши. Это название — «Большая лодка Ноя». Это турецкое название.
  rating: orange
  verdict: Гору Арарат турки называют Агры-Даг. «Ноев ковчег» — название места примерно в 30 км от неё, где Уайетт искал ковчег; название говорит о том, во что верят люди, а не о том, что ковчег там.
  arguments:
  - wyatt-finds

- id: lecture-3-455
  start: 455.6
  end: 488.6
  text: В Библии не говорится, что ковчег остановился на горе Арарат. В Библии говорится, что ковчег остановился в седьмом месяце. Это интересно, так как Ной не выходил до тринадцатого месяца. Почему он не выходил из ковчега 6 месяцев? Ещё не сошла вода, и нечего было есть. Если вы просмотрите мою кассету номер шесть, мы говорим, почему они находились шесть месяцев в ковчеге. Потому что тогда на Земле ещё ничего не росло. Если вы посадите сад, он вырастет через три-четыре месяца. И через шесть месяцев можно было выпускать животных.
  rating: neutral
  verdict: Пересказ хронологии Быт 8 с догадкой, почему Ной ждал месяцы после остановки ковчега. Это рассуждение о тексте, на научные доводы оно не влияет.

- id: lecture-3-489
  start: 489.3
  end: 529.2
  text: И остановился ковчег на горах Араратских, множественное число. Некоторые люди думают, что ковчег на горе Арарат. Я знаю Кена Хэма. Он мой друг, я недавно его видел. Он говорит, что Ноев ковчег находится на горе Арарат. Я также знаю Джона и Генри Морриса. Они думают, что ковчег тоже находится на горе Арарат. Я благодарен и высоко ценю их служение. Я знаю Карла Баха из Техаса, он тоже думает, что ковчег находится на горе Арарат. Может быть, я не знаю. Я просто хочу, чтобы вы знали, что есть ещё один взгляд. Есть люди, которые думают, что ковчег вообще не на горе, что он в стороне от горы.
  rating: green
  verdict: 'Верно: в Быт 8:4 сказано «на горах Араратских», во множественном числе. И честно, что Ховинд признаёт: известные креационисты сами расходятся в том, где искать ковчег.'

- id: lecture-3-529
  start: 529.8
  end: 552.2
  text: Я также знаю Рона Уайатта, моего друга. Вот его электронный адрес. Рон думает, что ковчег не на горе Арарат. И много людей соглашаются с ним. Он думает, что этот объект может быть ковчегом. В 27 км в стороне от горы Арарат. Но на горах Араратских, не на самой горе Арарат.
  rating: red
  verdict: 'Многие действительно верят Рону Уайетту. Но «ковчег» у Дурупынара — природная складка горных пород: так заключили геологи, обследовавшие место, а креационистские организации тоже не признают его ковчегом.'
  arguments:
  - wyatt-finds

- id: lecture-3-553
  start: 553.5
  end: 582.5
  text: Говорят, что ковчег разрушился. Осел на стороны, стал намного шире. В том месте найдены также железные заклёпки. Я держал их в своих руках в доме у Рона в Нашвилле. Я часто бывал у него дома. Эти железные заклёпки найдены по всему месту. Очевидно, ковчег был соединён заклёпками. Турецкое правительство изучало местность, они думают, что это ковчег Ноя, и они построили центр для посетителей. Они начали строить дорогу, но началась война, и теперь там опасно находиться.
  rating: red
  verdict: Железо в горных породах встречается часто, и «заклёпки» из обычного грунта ничего не доказывают; анализов, подтверждающих рукотворный металл, нет. Центр для посетителей говорит об интересе туристов, а не о научном выводе.
  arguments:
  - wyatt-finds
  rhetoric:
  - personal-story

- id: lecture-3-583
  start: 583.1
  end: 609.5
  text: Также найдены 12 громадных камней-якорей. Большие девятитонные камни с отверстиями на верхушках. Интересно, что отверстия овальные. Я построил девять домов и просверлил множество отверстий. Но я не знаю, как можно просверлить овальные отверстия в камне. Интересно, чем больше камень, тем больше отверстия. Очевидно, они были предназначены для каната, чтобы удерживать камни за бортом. Как плавучие якоря.
  rating: red
  verdict: 'Эти камни сделаны из местной породы, а на некоторых из них выбиты кресты: это древние местные стелы, а не якоря, приплывшие с ковчегом. Овальное отверстие в камне можно выдолбить и без сверла.'
  arguments:
  - wyatt-finds
  rhetoric:
  - argument-by-incredulity

- id: lecture-3-610
  start: 610.6
  end: 643.2
  text: 'Плавучие якоря обеспечивают устойчивость корабля в бурную погоду. И такие камни стабилизируют корабль. И если верёвки достаточно длинные, пусть они даже достают до дна, И при большом ветре камни тянутся за кораблём. И поворачивают его в правильном направлении к волнам. И вы не перевернётесь. Вы скажете: «Подождите. Эти камни замедляли бы движение ковчега». А-а, но я никуда не спешил. Он вообще никуда не плыл.'
  rating: neutral
  verdict: Как плавучие якоря держат судно против волны, описано верно; шутка «никуда не спешил». На довод не влияет.

- id: lecture-3-645
  start: 645.2
  end: 663.1
  text: 'Один человек на моей дискуссии, бывший проповедник, сейчас он стал атеистом. Он сказал: «Вы не можете построить такой большой ковчег. На волнах он прогнётся и потом разломится». Это было проверено на паруснике. Но на ковчеге не было мачт, он никуда не плыл, и этой проблемы не было.'
  rating: red
  verdict: 'Возражение собеседника серьёзное: длинный деревянный корпус изгибается на волнах и течёт, даже без мачт и парусов. Самые длинные деревянные суда, около 100 м, приходилось постоянно откачивать; ковчег длиной около 135 м испытал бы то же.'
  arguments:
  - ark-kinds
  rhetoric:
  - personal-story

- id: lecture-3-663
  start: 663.8
  end: 706.4
  text: Также некоторые люди думают, что в ковчеге на дне было отверстие. И когда вы попадаете на гребень волны, вода поднимается в отверстие, вокруг которого стены. И это облегчает напряжение на ковчег. Это отверстие облегчает нагрузку. И поднимающаяся и опускающаяся вода создаёт циркуляцию воздуха в ковчеге или в корабле. Это может быть необходимо со всеми животными на борту. Я думаю, иногда приходилось молиться о большой волне. «Боже, срочно пошли волну». Я не знаю, было ли такое отверстие на ковчеге или нет. Не так уж и много осталось от деревянного ковчега за 4 000… 4 400 лет.
  rating: neutral
  verdict: Догадка об отверстии в днище ковчега; Ховинд честно говорит, что не знает. Проверить её нечем, на довод она не влияет.

- id: lecture-3-707
  start: 707.6
  end: 731.5
  text: 'Но что же случилось с динозаврами после потопа? В учебниках детей спрашивают: «Что случилось с динозаврами? Послужил ли метеор вымиранию динозавров 65 млн лет назад?» Я скажу, что они задают неправильный вопрос. Надо спрашивать не «Почему вымерли динозавры?». Надо спрашивать: «Вымерли ли динозавры?»'
  rating: orange
  verdict: 'Вопрос «вымерли ли динозавры?» законный, и наука отвечает на него интересно: птицы — потомки динозавров. Но костей нептичьих динозавров моложе 66 млн лет не найдено, и Ховинд подводит к выводу, которого данные не дают.'
  arguments:
  - living-dinosaurs

- id: lecture-3-733
  start: 733.1
  end: 890.1
  text: 'Либералам удаётся заставить нас спорить на неверную тему. Они часто спрашивают:«Надо ли молиться в государственных школах или надо учить сотворению в государственных школах?» Я отвечаю: это хороший вопрос. Я буду рад ответить на него, но нам необходимо поговорить на другую тему. Нужны ли нам государственные школы? Давайте поговорим об этом вначале. Если нам нужны эти школы, то кто должен быть во главе? Это будет вторым вопросом. Прочитайте Конституцию, десятая поправка. Всё, что не упоминается в этом документе, остаётся на решение штатам. Это значит, что мы должны закрыть Министерство образования на национальном уровне. Закрыть. Когда Джо Скарборо, представитель округа Флориды, хотел, чтобы я проголосовал за него, я спросил Джо: «Какой у вас взгляд на государственные школы?» Он сказал: «Десятая поправка». Я сказал: «Что вы имеете в виду?» Он сказал: «У них нет права на существование». Не должно быть никакого федерального вмешательства в государственных школах. Ни в социальном обеспечении. Я проголосую за него. Если мы вернёмся к Конституции, исчезнет 80% проблем. Федеральное государство вовлечено во многие дела, на которые оно не имеет права. Я читаю лекции в государственных школах, мой брат скоро выйдет на пенсию со школы. Он меня привёл к Господу. На следующей неделе мы поедем в Гавайи на двадцатипятилетнюю годовщину свадьбы. Я возьму и жену. Но семья моего брата и моя семья поедем в Гавайи. Семья моего брата и моя семья поедем в Гавайи. Это трудно, но кому-то нужно рассказать, и гавайцам тоже. Мой брат преподаёт в государственной школе 28 лет. Моя мать преподавала в государственной школе. Я не против государственных школ, но я думаю, что они должны управляться местными городами или округами. Но не федеральным государством в Вашингтоне. Это нужно прекратить. Ну, что же случилось с динозаврами? Они задают неправильный вопрос. Если вы хотите знать, что происходит в государственных школах, прочитайте статью на Интернете, которая называется «Исход 2000». Если вы хотите знать ежедневные новости, свяжитесь с Фредом. Фред Б. Ноль-ноль-один. на spectra.net. И вы будете получать около 100 писем в день о том, что происходит в государственной школьной системе.'
  rating: neutral
  verdict: Отступление о государственных школах, Конституции и выборах. Это политическое мнение, а не проверяемое утверждение о науке; мы его не оцениваем.

- id: lecture-3-894
  start: 894.0
  end: 936.4
  text: Ну а после потопа с динозаврами произошли две вещи. Первое. Покидая ковчег, они встретили враждебный мир. Мир отличался, потому что больше не было оболочки воды. До потопа люди жили 900 лет. Сразу после потопа жизнь сократилась до четырёхсот лет. Потом до 200. И потом до 100 лет. Не было оболочки воды. Появилась радиация, уменьшилось давление воздуха, стало меньше кислорода. Губительные эффекты потери оболочки воды. Это произошло и с динозаврами, они вымирали из-за изменения климата. Они больше не жили долго.
  rating: red
  verdict: Что после потопа, по Библии, жизнь людей сократилась, пересказано верно. Но водяной оболочки над Землёй не было, а вымирание динозавров учёные датируют 66 млн лет назад, задолго до людей; смена климата после потопа тут ни при чём.
  arguments:
  - vapor-canopy

- id: lecture-3-936
  start: 936.9
  end: 962.3
  text: Во-вторых, человек охотился за ними. И в то время их называли драконами. Люди убивали драконов из-за мяса. Было бы много бифштексов с одного динозавра. Можно было прокормить целую деревню. Также они были опасны. И их убивали, чтобы быть героем. С увеличением населения людей и население больших и свирепых животных начало уменьшаться.
  rating: red
  verdict: Люди действительно истребили многих крупных зверей, например мамонтов и моа. Но ни одной кости динозавра со следами охоты нет, а в слоях моложе 66 млн лет их костей нет совсем, кроме птиц.
  arguments:
  - recent-dinosaur-extinction

- id: lecture-3-963
  start: 963.9
  end: 986.1
  text: То же произошло и в Западной Флориде. А сколько медведей гризли во Флориде? Наверное, ни одного. Сколько было 500 лет назад? Хм, много? Когда заселяются люди, большие животные изгоняются или уничтожаются. И при увеличении мирового населения динозавров начали уничтожать. Тех, которые не погибли от изменения климата.
  rating: orange
  verdict: 'Что люди вытесняют крупных зверей, верно. Но гризли во Флориде не водились и 500 лет назад (там живёт чёрный медведь), а с динозаврами люди не встречались: их разделяют десятки миллионов лет.'
  arguments:
  - recent-dinosaur-extinction
  rhetoric:
  - false-analogy

- id: lecture-3-986
  start: 986.7
  end: 1013.8
  text: Есть тысячи рассказов о людях, убивающих драконов. Их называли драконами, потому что слово «динозавр» было придумано в 1841 году. И до этого не было такого слова. В истории говорится о Гильгамеше, пронзающем дракона. Беовульф убил дракона, Святой Георгий убил дракона. Есть тысячи таких рассказов. Всё ли это только мифология? Почему рассказов так много? И почему они так похожи?
  rating: red
  verdict: Слово «динозавр» действительно придумали в 1841–1842 годах. Но драконы легенд с крыльями и огнём не похожи на динозавров по костям, а Гильгамеш сражался с Хумбабой, стражем леса, а не с ящером.
  arguments:
  - dragon-legends
  rhetoric:
  - appeal-to-doubt

- id: lecture-3-1014
  start: 1014.6
  end: 1037.3
  text: Вот реклама ресторана с кораблём с головой дракона. Тайская легенда рассказывает о драконе. Русский медальон с драконом. На болгарской марке рисунок дракона. Многие древние герои этих стран убивали драконов. Я думаю, что динозавры жили на протяжении всей истории.
  rating: red
  verdict: Драконы действительно есть в искусстве многих народов. Но рисунок на марке или медальоне показывает, во что верили и что придумывали; так же широко рисовали грифонов и русалок, которых никто не видел.
  arguments:
  - dragon-legends

- id: lecture-3-1038
  start: 1038.3
  end: 1056.0
  text: 'У Навуходоносора, вавилонского царя, на кольце был символ бога Мардука, стоявшего на огнедышащем драконе. Вы скажете: «Брат Ховинд, вы же не верите в огнедышащих драконов?» А? Да, я верю. Действительно были такие огнедышащие драконы.'
  rating: red
  verdict: Существо рядом с Мардуком — мушхуш, сборный священный зверь со змеиной головой, львиными передними и птичьими задними лапами. Огнедышащих животных не знает ни зоология, ни палеонтология.
  arguments:
  - dragon-legends

- id: lecture-3-1057
  start: 1057.3
  end: 1076.8
  text: В Католической Библии и в книге Даниила есть две дополнительные главы. Тринадцатое и четырнадцатое. В четырнадцатой главе рассказывается, что Даниил убил дракона, которому поклонялись вавилонцы. Был ли дракон в Вавилоне 600 лет до нашей эры? Я думаю, что был.
  rating: orange
  verdict: Рассказ о Виле и драконе действительно есть в греческом тексте Даниила (у протестантов — апокриф). Но греческое «дракон» значит большой змей, а рассказ — назидание против идолопоклонства, а не свидетельство о динозавре.
  arguments:
  - dragon-legends

- id: lecture-3-1077
  start: 1077.8
  end: 1124.3
  text: 'Саддам Хусейн думает, что он перевоплощённый Навуходоносор. Его фотографии находятся по всему Ираку. Прекрасные мишени для самолётов. На их золотых монетах. находятся рисунки Хусейна и Навуходоносора. Также Саддам потратил много денег на отстройку древнего города Вавилона. Вавилон был разрушен около 600 лет до нашей эры. И Библия говорит, что Вавилон будет разрушен в последние дни. Много людей смеялись в Библии и говорили: «А Вавилон уже давно разрушен». Знаете что? Саддам за последние 20 лет уже отстроил Вавилон. Вавилон уже отстроен.'
  rating: neutral
  verdict: 'Отступление о Саддаме Хусейне и толкование пророчеств о Вавилоне. Саддам действительно восстанавливал Вавилон, но город не был разрушен около 600 года до н. э.: в 539 году его взял Кир, и он угасал постепенно.'

- id: lecture-3-1125
  start: 1125.5
  end: 1147.9
  text: Когда были найдены руины древнего города Вавилона? В песке были найдены сохранившиеся стены города. На стенах города были найдены сотни и сотни рисунков драконов. Тогда возникает вопрос. Как они знали о драконах 600 лет до нашей эры? Потому что они жили в то время.
  rating: red
  verdict: На воротах Иштар действительно много изображений мушхуша. Но рядом с ними быки, а на стенах Дороги процессий львы, которых вавилоняне видели; мушхуш — сборный зверь Мардука с орлиными лапами и рогами, ни на одного динозавра он не похож.
  arguments:
  - dragon-legends
  rhetoric:
  - appeal-to-doubt

- id: lecture-3-1148
  start: 1148.9
  end: 1156.3
  text: Александр Великий триста лет до нашей эры докладывал, что его солдаты были напуганы драконами при завоевании части Индии.
  rating: orange
  verdict: 'Античные авторы действительно писали о «драконах» Индии, но описывали огромных змей: так греки называли больших змей вроде питонов.'
  arguments:
  - dragon-legends

- id: lecture-3-1158
  start: 1158.2
  end: 1187.4
  text: На этой римской мозаике показаны два дракона, которые бьются или целуются. Непонятно. Что они там делают? Всё же как римляне знали о драконах 200 лет после Христа? Я думаю, потому что они жили в то время. Наверное, меньше размером, редко и обычно в воде, которых труднее истребить. Сухопутных было легче убить. В основном жили драконы в воде.
  rating: red
  verdict: Римляне изображали морских чудищ, кетосов, рядом с тритонами и нереидами. Мозаика показывает мифологию, а не зоологию; Ховинд и сам не знает, что на ней изображено.
  arguments:
  - dragon-legends
  rhetoric:
  - appeal-to-doubt

- id: lecture-3-1188
  start: 1188.6
  end: 1201.7
  text: Викинги тоже знали о драконах. Они их называли Кракен — великий дракон моря. Они строили корабли с резными головами драконов. Вся древняя северная скандинавская литература говорит о драконах морях.
  rating: orange
  verdict: Кракен норвежских преданий — не дракон, а огромное чудище, похожее на спрута; его образ, скорее всего, родился из встреч с гигантскими кальмарами. Резные головы на кораблях — украшение, как львы на гербах.
  arguments:
  - dragon-legends

- id: lecture-3-1203
  start: 1203.2
  end: 1224.5
  text: 'В 1700, в 1572 году итальянский пастух убил дракона, который беспокоил его коров. Его поместили в музей. Учёный даже сделал запись: Юлусус Альдровандус. В 1572 году в Италии вы могли увидеть динозавра в музее. Не кости динозавра, а всего динозавра.'
  rating: red
  verdict: Улиссе Альдрованди действительно описал «дракона», убитого у Болоньи в 1572 году. Но по его описанию и рисунку это небольшое змееподобное существо, ничем не похожее на динозавра.
  arguments:
  - dragon-legends

- id: lecture-3-1228
  start: 1228.1
  end: 1258.7
  text: 'Если вы достанете словарь или энциклопедию четырёхсот-пятисотлетней давности, под словом «дракон» будет написано: крайне редкое, но ещё живущее животное. Кто-то позвонил мне и сказал: «Доктор Ховинд, я хочу выслать вам словарь 1928 года». В этом словаре под словом «дракон» написано: очень редкое живое существо. В словаре двадцать восьмого года. Интересно.'
  rating: orange
  verdict: 'В словарях «драконом» называли и настоящих животных: летучих ящериц рода Draco, а с 1912 года и комодского варана. «Редкое живое животное» в словаре 1928 года — скорее о них, а не о динозавре.'
  arguments:
  - dragon-legends
  rhetoric:
  - personal-story

- id: lecture-3-1260
  start: 1260.3
  end: 1265.9
  text: Город во Франции был переименован в честь человека Нерлюк, который убил дракона, беспокоящего город.
  rating: orange
  verdict: 'Это, видимо, легенда о Тараске: по преданию, чудовище у города Нерлюк усмирила святая Марфа, и город стал Тарасконом. Это житийная легенда, а не запись о животном.'
  arguments:
  - dragon-legends

- id: lecture-3-1269
  start: 1269.7
  end: 1300.4
  text: Индейцы Аризоны охотились за драконами и оставили рисунки на стенах Большого каньона. Драконы на стенах Большого каньона. Хм, конечно, потому что за ними охотились индейцы. Вот четырёхлапый динозавр с длинной шеей, вырезанный на Большом каньоне. Вот рисунок из пещеры в Африке. Круглое тело, длинная шея, четыре ноги. И слева убегающий туземец. Умный туземец.
  rating: red
  verdict: «Динозавр» на скале в каньоне Хавасупай (боковом каньоне Большого) при внимательном осмотре оказался условно нарисованной птицей. Африканские «ящеры», которых приводят креационисты, — жираф (Танзания) или короткошеие ящерицы (Замбия).
  arguments:
  - dinosaur-depictions

- id: lecture-3-1301
  start: 1301.7
  end: 1360.0
  text: 'В 1962 году во время путешествия в Перу жители приносили и продавали туристам странные камни. Камни, которые были найдены в пустыне. Было найдено много таких камней. Эти камни называются Ика-камни. Мой друг из Канады поехал в Перу и изучал эти камни на протяжении восьми месяцев. Он дал мне множество фотографий этих камней. На нашем веб-сайте также есть фотографии. Наш адрес: drdino.com Рисунки динозавров на камнях. Было найдено 50 000 камней. Их размер измеряется от 2 см до 13. Найдены рисунки на этих камнях каждого известного вида динозавров. Иногда люди убивают динозавров. Иногда они ездят на динозаврах. Иногда динозавры работают на людей. Странно. Это мой друг, изучавший камни 8 месяцев.'
  rating: red
  verdict: 'Камни Ики вырезал местный крестьянин Басилио Учуйя: он показывал журналистам, как это делает, и брал динозавров из комиксов и журналов. Поэтому на камнях и есть «каждый известный вид».'
  arguments:
  - dinosaur-depictions
  rhetoric:
  - personal-story

- id: lecture-3-1362
  start: 1362.0
  end: 1398.9
  text: 'Также я прочитал книгу доктора Кабреры. У него 11 000 таких камней. Он изучал камни. И он сказал, что без сомнения человек и динозавры жили вместе. Но после этого он говорит: «Это доказывает, что человек был здесь 200 млн лет назад». Прекрасное исследование, но плохой вывод. Нет, это доказывает, что всё датирование истории неверно. Человек и динозавр жили вместе. Вот вождь, отрезающий голову динозавра. На этом человек едет на динозавре. Камни Ика из Перу.'
  rating: red
  verdict: Кабрера покупал камни у того же Учуйи. Ховинд берёт его «данные» и отбрасывает вывод, который ему не нравится; но если камни поддельные, а это так, не держится ни вывод Кабреры, ни вывод Ховинда.
  arguments:
  - dinosaur-depictions
  rhetoric:
  - cherry-picking

- id: lecture-3-1399
  start: 1399.7
  end: 1433.2
  text: Во время парусников, со времени Колумба. Да, около 100 лет назад, когда начали использовать двигатели Эти 400 лет истории называются великим временем парусников. В это время существовала тысяча легенд о людях, видевших морских чудовищ. Парусники плавают очень тихо. Сегодня с громкими двигателями звук под водой можно услышать на 150 км в округе. И динозавры выучили избегать морские пути. Но во время парусников есть тысячи рассказов о людях, видевших морских чудовищ.
  rating: red
  verdict: Рассказов моряков о морских змеях действительно много. Но большинство объясняют кальмары, ремнетелы, киты и плавучие водоросли. А плезиозавр дышал воздухом, как кит, и даже при шуме двигателей его видели бы так же постоянно, как китов.
  arguments:
  - sea-serpents

- id: lecture-3-1434
  start: 1434.3
  end: 1457.7
  text: 'Вот, например, история Норвегии. Автор епископ Эрик Понтоппидан. Рассказывает о многих историях. Миссионер Ханс Эгеде рассказывал о увиденном морском чудовище возле Гренландии. После собрания в Делавэре ко мне подошёл человек и сказал: «Брат Ховинд, Ханс Эгеде — это мой прапрадедушка. И в своём дневнике он записал, что он видел морское чудовище».'
  rating: orange
  verdict: 'Морское чудище у Гренландии в 1734 году действительно описано: его видел сын миссионера Ханса Эгеде, Поуль. По последнему разбору это, скорее всего, был кит, раньше предполагали гигантского кальмара; до плезиозавра это описание довести нельзя.'
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-1459
  start: 1459.5
  end: 1481.0
  text: Капитан Маккей британского корабля сообщил, что они видели, как двадцатиметровое морское чудовище проплыла под их кораблём. Они следили за этим чудовищем 20 минут. После этого матросы просили, чтобы капитан не записывал происшедшее в бортовой журнал, чтобы с них не смеялись. Но капитан записал. И с них смеялись.
  rating: orange
  verdict: Случай с фрегатом «Дедал» (1848) известен, капитан Мак-Куэ описал его в рапорте. Но уже тогда предлагали обычные объяснения — крупный тюлень, кальмар, кит, — а рисунки офицеров на плезиозавра не похожи.
  arguments:
  - sea-serpents

- id: lecture-3-1482
  start: 1482.0
  end: 1554.0
  text: 'Хотите прочитать удивительный рассказ? Пойдите в библиотеку, найдите и прочитайте книгу автора Томаса Хелма, которая называется «Чудовища глубины». Автор из штата Флорида. Книгу, в которой он рассказывает историю «Мононгахелы», корабля, который убил, разрезал и ел мясо части тридцатипятиметрового морского чудовища. Когда это происходило, матросы с другого корабля остановились и видели это чудовище. «Мононгахела» продала жир, полученный из этого чудовища, другому кораблю. Матросы сказали: «Мы плывём на охоту на 6 месяцев. У нас есть кости чудовища. Вы возьмите этот жир. Поплывите в порт. Через шесть месяцев мы вернёмся и покажем доказательства». Через шесть месяцев «Мононгахела» не приплыла. Корабля не было и через год. Некоторое время после на берег Японии выкинула доску с названием «Мононгахела». Корабль затонул в буре. Но матросы, которые видели чудовище, они говорили, что это жир чудовища. Они говорили: «Мы видели это чудовище». Ну, люди смеялись с них. Им нужны доказательства. Интересный рассказ.'
  rating: orange
  verdict: 'История «Мононгахелы» известна только по пересказам: ни костей, ни судовых документов о бое с чудищем нет. Рассказ, в котором все доказательства «утонули» вместе с кораблём, проверить нельзя.'
  arguments:
  - sea-serpents

- id: lecture-3-1555
  start: 1555.0
  end: 1574.2
  text: Во время Первой мировой войны капитан немецкой подводной лодки сказал, что он потопил британский корабль. Когда произошёл взрыв, то из-под воды вылетело двадцатиметровое морское чудовище. У него были большие, у него были большие плавники, как у плезиозавра. И голова как у аллигатора. Может, кронозавр?
  rating: orange
  verdict: Рассказ о случае с U-28 (1915) опубликовал сам капитан фон Форстнер через 18 лет, в 1933 году; показаний других членов экипажа и снимков нет. Кронозавр известен только по окаменелостям мелового периода, около 110 млн лет назад.
  arguments:
  - sea-serpents

- id: lecture-3-1575
  start: 1575.8
  end: 1611.1
  text: 'Есть рассказы о гигантских осьминогах, затягивающих корабли в воду. Вы скажете: «Ну нет, таких больших осьминогов не существует». Вы знали, что выкинутый на берег Святом Августине осьминог был 65 м ширины? И весил пять тонн. Вот статья в газете. Газета города Орландо. У меня есть вырезка. 65 м. Хм, большой осьминог. Но не самый большой. Возле Сиэтла в Вашингтоне был убит кит, в животе которого был пятидесятиметровый щуп осьминога.'
  rating: red
  verdict: '«Чудище Сент-Огастина» 1896 года проверили: анализ тканей показал, что это огромный ком китового жира, а не осьминог. «Щупальце 50 м» в ките — тоже байка: таких осьминогов не бывает.'
  arguments:
  - monster-carcasses

- id: lecture-3-1612
  start: 1612.7
  end: 1650.5
  text: 'Китам нравится есть осьминогов и кальмаров. Но если кит съедает слишком много, он вырывает всё назад. Если вы найдёте в океане кусок вырванного осьминога, словите его. Он стоит больше, чем золото. Грамм за грамм. Вы знаете, где используется вырванный осьминог? Используется в духах. Правильно. Это объясняет некоторые вещи, правда? Можете сказать: «Дорогая, ты пахнешь как вырванный осьминог». Конечно, после этого вам придётся спать на диване.'
  rating: neutral
  verdict: Шутка об амбре. Амбра действительно дорога и идёт в духи, но образуется она в кишечнике кашалота, а не из «вырванного осьминога». На довод не влияет.

- id: lecture-3-1652
  start: 1652.3
  end: 1668.3
  text: В океанах находятся очень большие существа. Гигантские. В музее Йельского университета находится модель гигантского кальмара. В Новой Зеландии на берег вынесла детёныша гигантского кальмара. Взрослый он был бы 50 м длины.
  rating: orange
  verdict: Гигантские кальмары есть, и модель в Йеле настоящая. Но измеренные особи вместе со щупальцами достигают 13–17 м, а самая смелая научная оценка — около 20 м, не 50.
  arguments:
  - sea-serpents

- id: lecture-3-1670
  start: 1670.1
  end: 1687.8
  text: 'И океаны тоже очень большие. Я летел из Австралии над Тихим океаном. Я сказал Брайану, который работает у меня в офисе. Я сказал: «Брайан, Тихий океан огромный?» Он сказал: «Это только поверхность». Вот это мысль. Это и есть только поверхность.'
  rating: neutral
  verdict: 'Байка о размерах океана: «это только поверхность». Что океан мало изучен, верно; что в нём живут ящеры, отсюда не следует.'
  rhetoric:
  - personal-story

- id: lecture-3-1690
  start: 1690.3
  end: 1705.9
  text: 'Люди говорят: «Подождите, если динозавры жили с человеком…» Ной взял их на ковчег, и они упоминаются в истории. Упоминаются ли динозавры в Библии? Конечно. Вы скажете: «Я прочитал мою Библию, я не заметил». Ну, они там упоминаются.'
  rating: purple
  verdict: 'Мы тоже верим, что Бог сотворил всех животных. Но слова «динозавр» в Библии нет: что Бегемот и Левиафан — динозавры, это толкование Ховинда, его разбираем ниже.'
  arguments:
  - bible-dinosaurs

- id: lecture-3-1707
  start: 1707.4
  end: 2055.0
  text: 'Если вы читаете книгу Иова, в ней 42 главы. В первых двух главах Иов всё потерял. Верблюдов, овец, умерли его десять детей, жена отвернулась от него, потерял своё здоровье. И Иов был покрыт проказою от подошвы до макушки. И его четыре друга пришли мучить. То есть утешать его. Я думаю, что они были баптистами. Они сказали Иову: «Иов, мы знаем, почему это случилось. Ты согрешил?» Послушайте, если что-то плохое случилось с кем-то… Вы не знаете причины? Вы должны любить их, молиться, поддерживать и замолчать. Не идите в госпиталь, когда у кого-то вырезают жёлчные камни, и не говорите: «Брат, это не камни. Это пожертвование. Бог с тебя возьмёт так или иначе». Не делайте этого. Пусть сам Бог разберётся. И вот Иов сидит в пепле, все дети мертвы, его жена обратилась против него. И ещё он весь покрыт проказою лютою. Его друзья говорят с ним тридцать пять глав. Большая часть книги Иова — это спор четырёх друзей с Иовом. Почему это произошло? Один из этих людей был самым низким человеком, упомянутым в Библии. Елифаз, Вилдад, Софар и Елиуй. Говорили с Иовом 35 глав. И они говорили Иову: «Иов, ты согрешил». Иов ведь не знал ещё тогда о Римлянах 8:28. Но он говорит: «Почему это происходит? Я хотел бы, чтобы Господь ответил мне». Он отвечал: «Римлянам 8:28: притом знаем, что любящим Бога, призванным по Его изволению, всё содействует ко благу». Кстати, здесь не говорится, что всё, что происходит, хорошо. Но всё содействует ко благу. Вы когда-нибудь были голодными? Предположим, вы придёте ко мне и скажете: «Брат Ховинд, я голодный». Я скажу: «Хорошо, я помогу». Вот стакан муки. Поешь. Стакан муки. Может быть, ложку масла? Или нет? Или нет? Ложку соли. Открой рот. Или ложку жира. Но если мы возьмём всё это и перемешаем вместе и сделаем блины, тогда другое дело. Я не знаю, как их делать, но вы понимаете, что я имею в виду. В отдельности это невкусно, но вместе всё вкусно. И Бог не сказал, что всё происходящее хорошо. Но что всё содействует ко благу. Но не для всех и не для всех христиан. Вы можете быть христианином, и с вами случаются плохие вещи. Он сказал, что это для любящих Бога и призванным по Его изволению. В этой жизни нам необходимо заботиться о правильном отношении с Богом. И это займёт всё время. Лукаво сердце человеческое более всего и крайне испорчено; кто узнает его? Только хранить сердце чистым пред Богом — даст вам работы на всю жизнь. Иов сидит и спрашивает Бога: «Почему это произошло со мной? Почему?» И вам не придётся жить долго на этой планете, чтобы задать такой вопрос. «Боже, почему ты это делаешь со мной?» В конце, в главе тридцать восьмой, Господь отвечал Иову из бури и сказал: «Кто сей, омрачающий Провидение словами без смысла?» Другими словами, Иов, твои друзья не знали, о чём они говорили. «Препояшь ныне чресла твои, как муж: Я буду спрашивать тебя, и ты объясняй Мне. Где был ты, когда Я полагал основание земли?» Вопросительный знак. Первый раз я прочитал этот стих 29 лет назад и подумал: «Хм, что за тупой вопрос? Кто был здесь, когда Бог сотворил Землю? Почему Бог задаёт такой вопрос?» Кто-то из вас был здесь в это время? Ребята, а это будет сложно. Поэтому слушайте внимательно. Так как вас здесь не было, когда Бог сотворил мир, это значит, что Бог намного старше вас. Вы уже догадались без помощи? Вам приходило на ум, что Бог сильнее вас? Вам приходило на ум, что Бог умнее вас? Вам приходило на ум, что Бог богаче вас? Вы скажете: «Брат Ховинд, любой богаче меня». Бог богаче всех. Я говорил это много раз, но сам ещё этого не понял. Вам приходило на ум, что Богу ничего не приходило на ум? Это происходит со мной: «Вау, я раньше не думал об этом». Ну, это никогда не происходит с Богом. Он уже подумал обо всём. Вы говорите: «Боже, ты знаешь?» — «Да, Я знаю». Как вы увильнёте от такого Бога? Вы знаете, что Бог знает все ваши мысли? Но вы знаете, что он любит вас всё равно. Что за Бог? Бог сказал: «Где был ты, когда Я полагал основание земли?» Иов не отвечает на вопрос. Он молчит? Тогда Бог задал ещё один вопрос: «Кто положил меру ей, если знаешь?» Вопросительный знак. Иов не ответил. Бог задал ещё один вопрос, ещё и ещё 84 вопроса. Иов не ответил ни на один.'
  rating: neutral
  verdict: Пересказ книги Иова и проповедь о страданиях, Рим 8:28 и величии Бога, с шутками. Пастырские советы — не обвинять страдающих, доверять Богу — мы разделяем; на научные доводы эта часть не влияет.

- id: lecture-3-2055
  start: 2055.9
  end: 2072.9
  text: 'Бог сказал: «Нисходил ли ты в источники моря?» Учёные не знали об источниках моря до 1977 года. Бог задал этот вопрос около четырёх тысяч лет назад. Наука очень медленно успевает за некоторыми частями Библии.'
  rating: orange
  verdict: Гидротермальные источники на дне океана действительно открыли в 1977 году. Но вопрос к Иову говорит о том, что морская глубина недоступна человеку, а не сообщает научный факт; подводные пресные источники люди знали ещё в древности.
  arguments:
  - bible-science-foreknowledge

- id: lecture-3-2075
  start: 2075.1
  end: 2107.2
  text: 'Бог спросил: «Где путь к жилищу света?» Это замечательный стих, потому что свет не стоит на месте. Свет всегда движется. Вы не можете дать мне коробку света, правда? Удивительно. Бог сказал: «По какому пути разливается свет и разносится восточный ветер по земле?» Было установлено только 150 лет назад, что свет является причиной ветров. Солнце нагревает регион, тёплый воздух поднимается, расширяется и причиняет потоки ветра. Всё совершенно научно.'
  rating: orange
  verdict: Что ветер рождается от нагрева воздуха солнцем, верно. Но в Иове это поэтический вопрос о величии Бога, и объяснять ветры нагревом стали ещё в XVII–XVIII веках (Галлей, Гадлей), а не 150 лет назад.
  arguments:
  - bible-science-foreknowledge

- id: lecture-3-2110
  start: 2110.3
  end: 2278.9
  text: 'Бог сказал: «Иов, можешь ли посылать молнии?» Хорошо, что я не могу посылать. Вы можете вспомнить хоть одного человека, который ещё живой? Только потому, что вы не можете посылать молнии. Может быть, это ваш босс или сержант в армии? Бог спросил: «Можешь ли посылать молнии?» Бог задал Иову 84 вопроса. Я бы не ответил ни на один. Эти вопросы не нуждаются в ответах. Ответ очевиден. Цель вопросов — изменить отношение человека. Это такие вопросы родители задают детям. У меня трое детей, я знаю это. В определённом возрасте дети становятся самоуверенными и думают, что они должны создавать законы в доме. Вы поймёте это, когда ребёнок спро… говорит: «Я думаю, что я уже могу гулять до утра с моими друзьями. Как-никак, мне уже десять лет». Отец отвечает: «Подожди». Хочешь узнать, почему нельзя? Ответь мне. Кто платит за электричество в доме? Кто платит за газ? Кто платит за дом? За страховку, за твою одежду? За твою кровать? За пищу, которую ты ешь, и ешь, и ешь, и ешь. За мыло, которым ты мылся месяц назад. Давай посмотрим. Библия ясна. Платящий создаёт правила. «Второе мнение», глава четвёртая. Видишь? Я отец. Ты ребёнок. Если ты будешь спать под моей крышей, ты будешь слушаться меня. Если хочешь жить по-своему, найди себе дом, найди чем питаться и делай по-своему. Это золотое правило. У кого есть золото, тот и создаёт правила. Где ты был, когда мы приобрели имущество? Расчищали землю, разгоняли индейцев. Ходили пешком в школу? Понимаешь? Я отец. Ты ребёнок. Я думаю, это то, что Бог делает с Иовом. Иов сидит и спрашивает: «Боже, почему ты убил моих детей?» И Бог спрашивает: «Иов, где ты был, когда Я создал Землю? Иов, ты можешь посылать молнии? Ты можешь делать это, ты можешь делать это?» 84 вопроса. И Иов проходил регулировку поведения. Вам приходилось делать это с вашими детьми? Иногда в таких случаях приходится брать ремень. Но это всегда помогает. Бог давал Иову наставления. Бог задал 84 вопроса, на которые Иов не ответил.'
  rating: neutral
  verdict: 'Шутки и сценка про отца и самоуверенного ребёнка: речи Бога в Иове названы вразумлением. Это толкование мы оставляем без оценки, к науке оно не относится.'

- id: lecture-3-2279
  start: 2279.6
  end: 2315.5
  text: 'В главе сороковой Бог сказал: «Вот бегемот». Бегемот. А что такое бегемот? Некоторые сноски говорят, что это слон или гиппопотам. Ну, это невозможно. Я думаю, что бегемот — это динозавр с длинной шеей, которых есть тринадцать разновидностей: брахиозавр, апатозавр, ситозавр, маланчазавр, саямозавр и несколько других. Я думаю, что когда Бог говорил о бегемоте, он говорил о брахиозавре. Динозавры с длинной шеей.'
  rating: purple
  verdict: 'Мы тоже верим, что Бог указывает Иову на чудеса Своего творения. Кто такой Бегемот, толкователи спорят: гиппопотам, слон или образ первобытного чудища. Но брахиозавр вымер за десятки миллионов лет до людей, и Иов видеть его не мог.'
  arguments:
  - bible-dinosaurs

- id: lecture-3-2316
  start: 2316.4
  end: 2347.8
  text: 'Здесь говорится, что он ест траву, как вол. Вы скажете: «Брат Ховинд, многие животные едят траву». Я знаю. Ну, посмотрите на следующий стих. Сила в чреслах его и крепость его в мускулах чрева. Его… Самая большая сильная часть этого животного— его живот. Вы скажете: «У слона большой живот». Да, вы правы. У гиппопотама большой живот? Да, я видел. У брахиозавра большой живот. Да. У него тоже большой живот?'
  rating: orange
  verdict: 'Ховинд честно признаёт, что большой живот есть и у слона, и у гиппопотама. Добавим: «ест траву, как вол» и «сила в мышцах чрева» лучше всего подходят именно гиппопотаму с его мощным брюхом.'
  arguments:
  - bible-dinosaurs

- id: lecture-3-2349
  start: 2349.4
  end: 2367.8
  text: 'Лучше посмотрите на следующий стих. Там написано: «Поворачивает хвостом своим, как кедром». Значит, хвост как кедровое дерево. Вы видели хвост слона? Хмм, напоминает ли он вам кедровое дерево? Нет.'
  rating: purple
  verdict: Это главный довод Ховинда, и вопрос он задаёт законный. Но «как кедр» может говорить о твёрдости, а не о длине, и толкователи понимают стих по-разному. Это законный богословский спор, однако вывод «значит, Иов видел брахиозавра» из стиха не следует.
  arguments:
  - bible-dinosaurs
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-3-2368
  start: 2368.8
  end: 2381.3
  text: Следующий стих. Ноги у него как медные трубы, кости у него как железные прутья. У него большие и мощные кости. И это правда? Вот настоящая кость пальца ноги брахиозавра.
  rating: orange
  verdict: Кость брахиозавра действительно огромна. Но «кости, как медные трубы» — поэтический образ силы, он подходит любому крупному зверю и не указывает именно на динозавра.
  arguments:
  - bible-dinosaurs

- id: lecture-3-2383
  start: 2383.9
  end: 2418.0
  text: Ребята, это будет сложно, поэтому слушайте внимательно. У него были такие большие кости. Потому что у него были большие пальцы. Кто уже догадался об этом? И поэтому у него были большие ноги, в следах которых можно было даже купаться. Только передняя нога была 6 м длины. И такие длинные и большие ноги были, потому что у него было большое тело.
  rating: neutral
  verdict: Шутка-тавтология о размерах брахиозавра. На довод о Бегемоте она не влияет.

- id: lecture-3-2418
  start: 2418.5
  end: 2446.2
  text: Самый большой динозавр найден в Канаде. Новый рекорд. Пятьдесят метров от носа до хвоста. Ну, они говорят, что понадобится 60 лет, чтобы откопать скелет из земли. Я думаю, потому что это государственная программа. Они говорят, что при жизни этот динозавр весил около 100 тонн. Сто тонн. Это очень большое число.
  rating: orange
  verdict: Крупнейшие завроподы действительно достигали 30–40 м и многих десятков тонн. Но рекорд «50 м в Канаде» и «60 лет раскопок» приведены без источника; самые крупные находки сделаны в США и Аргентине.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-2447
  start: 2447.3
  end: 2502.3
  text: Большие числа не вмещаются в человеческий разум, Конгресс знает это и пользуется этим. Сто тонн равняется весу 14 автобусов. Это значит, что если он наступит на вас, вы будете глубоко поражены. Вы станете пиццей. Извини. Говоря о государственном проекте, я должен рассказать о моём новом изобретении. Моё изобретение сделает меня самым богатым человеком мира. Я сохраню деньги дорожному отделу, строительным бригадам, коммунальным предприятиям, и Вооружённым силам. Я хочу только 10% сбережений. И я стану самым богатым человеком мира. Я придумал лопату, которая будет стоять сама по себе. Больше не надо будет нанимать человека, опирающегося на неё. Это, наверное, бригада, работающая здесь на следующей улице.
  rating: neutral
  verdict: Шутки о больших числах, Конгрессе и лопате, которая стоит сама. На довод не влияют.

- id: lecture-3-2503
  start: 2503.7
  end: 2522.4
  text: 'В следующем стихе написано: «Это верх путей Божиих». Это «верх», еврейское слово «решив». Значит, начало, глава, основа. Это самое большое животное. Поэтому оно не может быть слоном или гиппопотамом. Это брахиозавр.'
  rating: purple
  verdict: Еврейское «решит» значит «начало, первое», как в Быт 1:1, и Ховинд передаёт это верно. Но «первое из дел Божиих» говорит о превосходстве, а не о размере; для древнего читателя и гиппопотам был таким чудом.
  arguments:
  - bible-dinosaurs

- id: lecture-3-2523
  start: 2523.4
  end: 2574.3
  text: 'Это подходит к стилю дьявола. Что ни делает Бог, сатана хочет разрушить. Бог создал красивые вещи. Сатана хочет их разрушить. Бог придумал музыку. Бог любит музыку? Дьявол придумал безбожную музыку, которую мы не должны слушать. Как-то меня спросили: «А знаете, что получится, если вы прослушаете музыку кантри в обратном направлении?» Я сказал: «Нет, я не знаю». Они сказали: «Вы найдёте жену, машину и собаку». О, да-да. Бог придумал брак. Семью, секс. Бог сотворил мужчину и женщину. Он всё понимает, и он придумал законы. Мальчики, не трогайте девушек до свадьбы. Если вам не хочется трогать девушек, не подходите ко мне, это не Сан-Франциско. Бог придумал правила, потому что он хотел лучшего для своих детей.'
  rating: neutral
  verdict: 'Нравоучение: Бог создаёт доброе, сатана его портит; шутки о кантри и о браке. Что Бог дал заповеди для блага людей, мы тоже верим.'

- id: lecture-3-2574
  start: 2574.7
  end: 2603.7
  text: И Бог придумал динозавров. Они представляли удивительную силу Бога. Знаете, что учёные до сих пор удивляются, как пятиметровый жираф может наклониться, попить воды и разогнуться, даже не получив головной боли? Невероятная сеть кровеносных сосудов. Их полуметровое сердце качает кровь по шее. Это удивительно. Его же голова была 15 м над землёй. Это инженерное чудо.
  rating: orange
  verdict: 'Кровообращение жирафа действительно удивительно, и мы тоже славим за него Творца. Но учёные не «удивляются» ему в недоумении: высокое давление, клапаны в шейных венах и сеть сосудов у мозга хорошо изучены.'
  arguments:
  - design-complexity
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-2604
  start: 2604.3
  end: 2621.5
  text: Но дьявол не мог обмануть Адама. Адам знал животных и назвал животных. Дьявол не мог обмануть и Ноя, потому что Ной взял животных на ковчег. Он кормил их каждое утро. Дьявол не мог обмануть людей много сот лет. Потому что они знали о динозаврах.
  rating: red
  verdict: Что Адам дал имена животным, сказано в Библии. Но что среди них были динозавры и что Ной кормил их на ковчеге, в Библии нет; окаменелости показывают, что крупные динозавры вымерли около 66 млн лет назад, задолго до людей.
  arguments:
  - dinosaurs-humans

- id: lecture-3-2622
  start: 2622.0
  end: 2644.3
  text: Но время шло, и динозавры стали редкостью. Большие вымирали или были убиты. Уже тысячу лет назад они встречались очень редко. Пятьсот лет назад они стали ещё реже. И население людей начало стремительно расти. Вы помните график? И сегодня миллиарды людей никогда не видели динозавров.
  rating: red
  verdict: Ни одной кости нептичьего динозавра моложе 66 млн лет и ни одного достоверного описания живого динозавра 500 или 1000 лет назад нет. Рассказы о драконах разобраны выше.
  arguments:
  - recent-dinosaur-extinction

- id: lecture-3-2645
  start: 2645.6
  end: 2671.7
  text: 'Двести лет назад, когда были найдены кости, дьявол сказал: «Вот это мой шанс. Я его ждал 6 000 лет. Эти существа всегда жили с человеком. Я знаю это. И Бог знает это. Но эти люди этого не знают». Дьявол сказал: «Я скажу этим людям, что динозавры жили миллионы лет назад». Если они поверят в это, они начнут сомневаться в Библии. Это-то и произошло.'
  rating: red
  verdict: 'Первые кости динозавров описывали верующие учёные, например священник Уильям Бакленд, а древность Земли признавали христиане-геологи ещё до Дарвина. Выбор «миллионы лет или доверие к Библии» ложен: многие христиане принимают и то, и другое.'
  arguments:
  - dinosaurs-humans
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-3-2672
  start: 2672.9
  end: 2693.3
  text: 'За последние 150 лет дети в садиках и школах учат и читают о доисторических животных. Вы открываете первую страницу книжки, и на ней нарисован динозавр. В первом предложении написано: «Миллионы лет назад». И дети начинают сомневаться в Библии до того, как они могут её прочитать.'
  rating: orange
  verdict: Что детские книжки начинаются с «миллионов лет», верно. Но это вывод геологии, а не нападка на Библию; сомнение рождает не книжка, а убеждение, что Библия и древность Земли несовместимы.
  arguments:
  - earth-age-billions
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-3-2695
  start: 2695.8
  end: 2737.8
  text: 'И Сатана влияет на детей. Когда им три-четыре года. А мы ждём, пока им 16 лет, чтобы говорить им о Боге. Несколько лет назад я посетил государственную школу, в которой было 300 первоклассников. Я говорил о динозаврах в этом классе, в котором было 300 первоклассников. В начале я спросил: «Ребята, когда жили динозавры?» Мгновенно все дети закричали: «Миллионы лет назад». Почему они так сказали? Где все христиане?'
  rating: neutral
  verdict: Призыв рано учить детей о Боге — с ним мы согласны. Рассказ о первоклассниках показывает, чему их учили, но не доказывает, что это неверно.
  rhetoric:
  - personal-story

- id: lecture-3-2739
  start: 2739.6
  end: 2754.4
  text: Не называет ли это, что они сказали, Иисуса обманщиком? Иисус сказал, что создание Адама было началом, смерти не было до греха Адама. Я думаю, я думаю, что настало время, чтобы христиане не должны бояться темы о динозаврах. И должны начать использовать их во славу Бога.
  rating: purple
  verdict: Мы тоже верим Иисусу во всём. Но слова «от начала создания» (Мк 10:6) сказаны о браке, а о смерти до грехопадения Иисус не говорил; что древность Земли «называет Иисуса обманщиком» — толкование Ховинда.
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-3-2754
  start: 2754.9
  end: 2807.9
  text: 'Написано: «Он ложится под тенистыми деревьями, под кровом тростника и в болотах». Это значит, что бегемот живёт в болоте. Самое большое болото мира находится в Африке. Оно называется Ликуала. 88 000 кв. км. Больше, чем штат Арканзас. Откуда родом президент и её муж Билл? Это большое болото. Для американцев трудно понять размер Африки. Вот Америка в сравнении с Африкой. Это болото Конго на 80% не исследовано. Вы знали, что было много сообщений из болота о живых динозаврах? Это болото больше любого жёлтого штата. Болото размером как Флорида. И оно на 80% не исследовано.'
  rating: orange
  verdict: Болото Ликуала действительно огромно и плохо изучено. Но с 1980-х туда ходили десятки экспедиций, и ни кости, ни ясного снимка крупного ящера они не принесли.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-2809
  start: 2809.2
  end: 2834.8
  text: 'Вы скажете: «Подождите, динозавры ещё живые?» Гигантских нет. Они не смогли выжить из-за изменения климата. Но было зарегистрировано 20 000 наблюдений за динозаврами в этом столетии. Вы слышали про Лох-Несское чудовище или чудовище озера Шамплейн? Мокеле-мбембе в болоте Конго. Рассказов много. Мы говорим об этом на второй половине кассеты. Живые динозавры.'
  rating: red
  verdict: Рассказов о Несси, Чемпе и мокеле-мбембе действительно много. Но число «20 000 наблюдений» ничем не подтверждено, и ни одно из них не дало ни тела, ни кости, ни ясного снимка.
  arguments:
  - living-dinosaurs
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-2836
  start: 2836.2
  end: 2863.8
  text: Не думайте, что их миллионы. Нет, можно спокойно идти в магазин. Но динозавры ещё живы. Самый близкий был встречен в 1962 году в порту Пенсаколы. Мы говорим об этом также во второй части. Четверо ребят были съедены этим динозавром. Один. Один выжил и всё видел. Это всё во второй половине.
  rating: red
  verdict: 'Гибель четырёх подростков у Пенсаколы в 1962 году — настоящая трагедия. Но в первых сообщениях газет чудовища нет: выживший рассказал о нём только через три года, и что ребят «съел динозавр», никто не установил.'
  arguments:
  - sea-serpents

- id: lecture-3-2865
  start: 2865.7
  end: 2881.2
  text: 'Вы скажете: «Брат Ховинд, подождите. Если динозавры жили с человеком на протяжении всей истории, как насчёт Иова 31, где говорится о Левиафане, огнедышащем драконе?» Были такие драконы? Да. Мы поговорим об этом на следующей сессии.'
  rating: purple
  verdict: Левиафан описан в конце 40-й и в 41-й главе Иова. Мы тоже читаем эти главы как прославление Творца; но «из пасти его выходят пламенники» — поэтический образ, огнедышащих животных наука не знает.
  arguments:
  - bible-dinosaurs

- id: lecture-3-2881
  start: 2881.4
  end: 2906.0
  text: 'Вы скажете: «Подождите. Если в учебниках говорится, что Земле миллиарды лет, есть ещё обман в учебниках?» О, полно. Мы говорим об этом на кассете номер четыре. Также вы скажете: «Подождите. Если был потоп, как или почему мир вдруг затопился?» На это есть несколько теорий. Но я представлю теорию Ховинда на кассете номер шесть.'
  rating: neutral
  verdict: 'Анонс следующих кассет: об учебниках и о «теории Ховинда» о потопе. Их разбираем в своих лекциях.'

- id: lecture-3-2907
  start: 2907.2
  end: 2928.4
  text: 'И тогда люди спрашивают: «Брат Ховинд, если Дарвин написал книгу о эволюции в 1859 году, почему он это сделал? И как это повлияло на наше общество? Как это связано с социализмом, коммунизмом, марксизмом, нацизмом? Новым мировым порядком?» О, я скажу, это связано прямо. Мы также говорим об этом на кассете номер пять.'
  rating: red
  verdict: 'Идеями Дарвина действительно злоупотребляли в спорах об обществе; подробно — в лекции 5. Но «прямой связи» нет: «Манифест коммунистической партии» вышел в 1848 году, раньше книги Дарвина, а «новый мировой порядок» — заговор без доказательств.'
  arguments:
  - darwin-hitler
  rhetoric:
  - conspiracy

- id: lecture-3-2929
  start: 2929.6
  end: 2939.8
  text: Друзья, эволюция — это не просто глупая теория. Это опасная религия. И Сатана использует эту религию для разрушения жизни детей и взрослых.
  rating: red
  verdict: 'Эволюция — научная теория, а не религия: её принимают и верующие, и неверующие. Слова «опасная религия сатаны» — оценка, а не довод.'
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-3-2941
  start: 2941.2
  end: 3035.3
  text: 'Пришло время, чтобы христиане сказали: «Слово Бога верно». И Библия говорит, что если вы не спасены, вы идёте в ад. Вы скажете: «Я не верю в ад». Вы можете попасть в ад, даже не веря в него. Вы знаете, что Бог не верит в атеистов? Хм, подумайте об этом. Если вы не уверены, что вы спасены, отдайте сердце Господу сегодня. Если вы спасены, найдите того, кто не спасён, и помогите им спастись. Это наша работа — проповедовать Евангелие по всему миру. Я думаю, что динозавры помогут. Вы знаете, что нужно Америке? Америке нужен костюм динозавра. Соберите четверо пятилеток и посмотрите на них, когда они смотрят на динозавра по телевизору. Не смотрите на динозавра, проследите за детьми. Вы знаете, о чём я говорю? Они буквально приклеены к экрану. Детям это нравится? И это могло бы быть потрясающим христианским влиянием. Почему бы вам, например, не купить костюм динозавра, путешествовать по стране и рассказывать детям о Боге? «Бог любит меня. Бог любит тебя. Он хочет быть твоим отцом. Если ты его попросишь, Всем в сердце он придёт и тебя спасёт». Неплохо, правда?'
  rating: neutral
  verdict: Проповедь о спасении, призыв к благовестию и шутливое предложение купить костюм динозавра для детского служения. Призыв к покаянию мы разделяем.

- id: lecture-3-3037
  start: 3037.5
  end: 3055.6
  text: Динозавры — это прекрасные инструменты евангелизации. Мы отдали его дьяволу, чтобы он учил эволюции. Узнайте, сколько детей на вашей улице думают, что динозавры жили миллионы лет назад. Я уверен, что вы будете шокированы.
  rating: orange
  verdict: 'Что динозавры восхищают детей и могут вести их к Творцу, верно. Но древний возраст динозавров — не «дьявольская идея»: его принимают многие христиане, и он не учит против Бога.'
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-3-3058
  start: 3058.1
  end: 3083.1
  text: Скажите, сколько церквей в вашем городе? Двести. Четыреста. Тогда почему в учебниках и в школах учат эволюции? Мы же платим за это. Пришло время, чтобы мы что-то сделали, не так ли? Всё разрушается. Мы должны это исправить.
  rating: orange
  verdict: Что христиане платят налоги и могут законно влиять на школы, верно. Но эволюцию в школе учат как научную теорию, а не как веру, и число церквей в городе не меняет того, что говорят данные.
  arguments:
  - evolution-religion

- id: lecture-3-3084
  start: 3084.1
  end: 3121.9
  text: 'Сейчас встанем. Склоним головы и помолимся. Мы снова вместе. Моё имя Кент Ховинд. Я преподавал науку 15 лет. Теперь я путешествую и говорю о сотворении, эволюции, динозаврах. Как я уже сказал, у меня есть три цели. Первое — укрепить вашу веру в Библию. Второе: если вы не спасены, я хочу, чтобы вы спаслись. И третья: если вы спасены и не живёте для Господа, я постараюсь, чтобы вы чувствовали себя неудобно. Идёт война. Каждый должен что-то делать для Господа. Если вы не можете стрелять, тогда подавайте пули. Каждый может делать что-то.'
  rating: neutral
  verdict: 'Молитва в конце первой части и начало второй: представление и три цели семинара. Цели — укрепить веру в Библию и привести людей ко Христу — мы разделяем; что «преподавал науку 15 лет» — не довод, разбор в лекции 1.'
  rhetoric:
  - self-authority

- id: lecture-3-3122
  start: 3122.7
  end: 3144.7
  text: На предыдущих сессиях мы говорили, что возраст Земли… и что Земле только 6 000 лет. Мы также говорили, что динозавры всегда жили с людьми. И это часть творения. В этой сессии мы поговорим о живых динозаврах. Я знаю, что это звучит неправдоподобно, но я изучал это долгое время. Я хочу рассказать, что я узнал, и вы сможете сделать свои выводы.
  rating: red
  verdict: 'Ховинд честно предлагает слушателям сделать свои выводы. Но «динозавры всегда жили с людьми» опровергают слои: кости людей и нептичьих динозавров вместе не встречаются нигде, а «живые динозавры» дальше подтверждаются только рассказами.'
  arguments:
  - living-dinosaurs

- id: lecture-3-3145
  start: 3145.3
  end: 3185.8
  text: А в Библии, в книге Иова, говорится о Бегемоте, которого Бог описывает в главе сороковой. В Библии говорится, что это животное-бегемот ложится под тенистыми деревьями, под кровом тростника и в болотах. Это значит, что бегемот живёт в болотах. И самое большое болото мира — Ликуала, находится в Африке, в Конго, в Заире. Оно занимает площадь 88 000 кв. км. Это болото больше штата Арканзас. И оно больше многих штатов Америки. Это болото почти как штат Джорджия, 93 000 кв. км.
  rating: orange
  verdict: 'Повтор довода о Бегемоте и болоте Ликуала (разбор выше, 45:54). Ликуала действительно огромна, но вовсе не самое большое болото мира: болота Западной Сибири во много раз больше.'
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3187
  start: 3187.7
  end: 3207.7
  text: 'А раньше это болото было захвачено Бельгией в 1880 году, и оно называлось Бельгийское Конго. Потом, в 1960 году, пришли коммунисты и освободили страну. Вы знаете, как коммунисты освобождают: убивают всех и потом говорят: «Теперь вы свободны». Но до этого болото называлось Бельгийским Конго.'
  rating: neutral
  verdict: Историческая справка о Бельгийском Конго и шутка о коммунистах. Самая большая часть болота Ликуала лежит в Республике Конго, бывшем Французском Конго, а не в Бельгийском; на довод это не влияет.

- id: lecture-3-3208
  start: 3208.3
  end: 3231.9
  text: 'Исследователи начали посещать болото в 1880-х годах. И они возвращались с сообщениями, что там ещё живут динозавры. Э-э, в 1910 году в нью-йоркской газете появилась статья: «Бродит ли бронтозавр по дикой Африке?» После этого было установлено, что бронтозавра нет, это был скелет и голова разных динозавров. Наверное, это был диплодок или апатозавр.'
  rating: orange
  verdict: Газетные заметки начала XX века о «бронтозавре в Африке» действительно были. Но они пересказывали слухи охотников и торговцев зверями, и ни одна экспедиция после них ящера не нашла.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3232
  start: 3232.3
  end: 3262.0
  text: 'В 1948 году появилась статья, в которой автор написал: широко известный южноафриканский охотник Гольбер возвратился из поездки в Анголу и заявил кейптаунской газете, что там было животное большого размера, по описанию похоже только на динозавра, которая жила в болоте Дилоло и известная под именем чипекве, с головой и хвостом, как у ящерицы. В разных частях района это животное называют разными именами. Из-за разных языков.'
  rating: orange
  verdict: Заметка 1948 года о «чипекве» — пересказ слов охотника в газете, без снимков и останков. Сколько бы имён ни было у зверя в разных языках, рассказ без проверки ничего не доказывает.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3262
  start: 3262.9
  end: 3299.6
  text: В 1980 году доктор Рой Макал из Чикагского университета прочитал эти сообщения о живых динозаврах в африканских болотах. Он был профессором микробиологии. И он решил поехать на болото Конго и проверить, правда это или нет. Он провёл на болоте шесть недель. Он сказал, что это самое плохое болото мира. Прямо на экваторе. Всегда 35 градусов жары и 95% влажности. Москиты кусаются тысячами в час. Очень неприятное место. И он находился в этом болоте 6 недель.
  rating: neutral
  verdict: Рой Макал, биолог Чикагского университета, действительно ездил в Конго в 1980 и 1981 годах; описание болота верное. Сам Макал живого животного не видел.

- id: lecture-3-3300
  start: 3300.5
  end: 3324.1
  text: Когда они были там, они спрашивали туземцев:«У вас в болоте есть крокодилы?» Туземцы отвечали:«Да, белый человек, у нас есть большие крокодилы». Они рисовали на земле громадного крокодила. Ну им никто не верил до 1984 года, когда одна из экспедиций увидела пятнадцатиметрового крокодила. Если вы пигмей, метр тридцать, то эти крокодилы очень большие.
  rating: orange
  verdict: 'Крупные крокодилы в Конго есть. Но «15-метровый крокодил» ничем не подтверждён: экспедиция не названа, а самые большие достоверно измеренные крокодилы — около 6–7 м.'
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-3325
  start: 3325.7
  end: 3352.4
  text: 'Они также показали туземцам детскую книжку и спросили: «Вы видели такое животное?» Туземцы сказали: «Да, это мокеле-мбембе, он живёт в болоте». Доктор Макал сказал: «Это же динозавр. Они вымерли 70 млн лет назад». Туземцы ответили: «Извините, мы не знали об этом. Мы не были в Америке, и нас не учили эволюции. Мы знаем, что мы видим их иногда в болоте».'
  rating: orange
  verdict: 'Что местные жители рассказывают о мокеле-мбембе, верно. Но картинка в руках у приезжих подсказывает ответ: человек охотно узнаёт на ней «того самого зверя». А шутка «нас не учили эволюции» не опровергает датировку.'
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-3-3353
  start: 3353.2
  end: 3378.7
  text: Конечно, я не хочу, чтобы вы подумали, что в мире живут миллионы динозавров. Нет, я этого не говорю. Всё, что я говорю, — что в нескольких местах динозавры были встречены. И болото в Африке — это одно из таких мест. И животные, которых называют мокеле-мбембе, они не очень большие, всего лишь 7 метров длины. Это с хвостом и шеей. Тело как у гиппопотама. Всего около семи метров.
  rating: red
  verdict: 'Ховинд честно оговаривается, что динозавров немного. Но и «несколько мест» не подтверждены: за сто лет поисков мокеле-мбембе нет ни тела, ни кости, ни ясного снимка.'
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3379
  start: 3379.9
  end: 3448.7
  text: 'Они утверждают, что животные живут под водой, в пещерах, в воде и питаются растениями, растущими возле воды, по берегам. И любимое растение животных — это маломбо. Вот доктор Макал держит это растение. На них растут фрукты наподобие яблока, только твёрже, и это очень нравится животным. Туземцы сказали: «Если вы хотите найти мокеле-мбембе, тогда найдите место, где растёт много маломбо и где нет гиппопотамов». Гиппопотамы тоже любят эти растения, но динозавр выгоняет их с той территории и присваивает её себе. Также были найдены следы этих животных на берегу. Очевидно, они выходят по ночам в места, где много растений маломбо. И следы, которые были найдены, это следы с когтями; у слона и гиппопотама похожие следы, но у них нет когтей. Туземцы рассказывают, что иногда, когда они плывут на каноэ по болоту, эти животные выныривают из воды или из болотных дыр, как это называют. Если вы будете слишком близко к животному и испугаете его, то хвостом оно разобьёт каноэ и утопит вас. Но животное не съест вас.'
  rating: orange
  verdict: Рассказы о пещерах, растении маломбо и перевёрнутых каноэ записаны со слов местных жителей, а «следы с когтями» никто не сумел связать с определённым животным. Это фольклор, а не данные о живом звере.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3449
  start: 3449.9
  end: 3464.1
  text: Мой друг находился там миссионером 42 года. Его имя Юджин Томас. Вот номер его телефона. Он сказал, что в его церковь ходили два пигмея, которые помогли убить такое животное. Это произошло где-то в 1959 году.
  rating: red
  verdict: 'Убийство зверя пигмеями около 1959 года известно только в пересказе: ни костей, ни шкуры не сохранилось. Телефон рассказчика проверяет рассказчика, а не само событие.'
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - personal-story

- id: lecture-3-3465
  start: 3465.3
  end: 3492.3
  text: 'Марселен Аньянья, биолог Конго. Он был на экспедиции в болото. Он сказал: «Я живу на Конго, но я не знал, что в 800 км по реке от моего дома существуют рассказы о динозаврах». И он был на болоте и утверждает, что он тоже видел такое животное. Это коммунистическая страна, поэтому он, наверное, атеист. Вот что он нарисовал, то, что он видел. Его рисунок, который находится в книге «Время жизни: Загадочные животные».'
  rating: orange
  verdict: 'Марселен Аньянья действительно сообщал, что видел животное в 1983 году, но снимка у него не получилось. Догадка «наверное, атеист» ничего не добавляет: вера свидетеля не делает рассказ ни вернее, ни ложнее.'
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3493
  start: 3493.1
  end: 3523.5
  text: Герман Регустер из Лос-Анджелеса тоже предпринял экспедицию в 1981 или 1982 году. После его возвращения в газете Лос-Анджелес появилась статья о сфотографированном динозавроподобном животном. Фотография была очень неясной. Регустер сказал, что там ужасная влажность и только выжить очень тяжело. Также сохранять оборудование сухим была проблемой. И также была проблемой предпринять что-то, если вы не заметите, если вы что-то заметите в течение 5—10 секунд.
  rating: orange
  verdict: Регастерс честно признал, что снимок неясный, и условия в болоте действительно тяжёлые. Но неясный снимок остаётся неясным и животное не подтверждает.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3524
  start: 3524.3
  end: 3561.0
  text: 'Люди спрашивают: «Почему нет чёткой фотографии?» Это хороший вопрос. Тогда скажите мне: кто видел автоаварию, сам момент столкновения? Вы знаете, я хочу увидеть фотографию самого момента столкновения. Во-первых, у кого фотоаппарат всегда под рукой? Если бы вы увидели аварию, вы бы опоздали. Вы бы не подумали об этом? И это часть проблемы с неимением фотографии динозавров. И в африканском болоте зачастую вы думаете о москитах и о другом больше, чем о динозаврах.'
  rating: orange
  verdict: Вопрос о снимках Ховинд называет хорошим, и это так. Но авария длится секунды, а крупные животные живут в болоте поколениями; десятки экспедиций с камерами за десятилетия должны были бы снять их хоть раз.
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - false-analogy

- id: lecture-3-3562
  start: 3562.0
  end: 3580.4
  text: Регустер сказал, что существо было тёмно-коричневое. Кожа казалась скользкой и гладкой с длинной шеей и маленькой головой. Герман и Кайя, его жена, видели существо и также слышали рычание. Несколько других членов экспедиции, включая государственных чиновников, тоже видели и слышали это существо.
  rating: orange
  verdict: 'Подробное описание не заменяет доказательства: ни ясного снимка, ни останков экспедиция Регастерса не привезла.'
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3581
  start: 3581.6
  end: 3618.1
  text: Туземцы говорят, что эти животные живут в пещерах, питаются растениями, и они часто переходят в другие места. И поэтому это не так просто, как поехать в Африку, сфотографировать животное и вернуться. Нет, это непросто. Во-первых, очень большая площадь. И говорят, что скорость передвижения в этом непроходимом болоте около 2 км/ч. И займёт целый день, чтобы пройти 14 или 16 км. Если я вам скажу, что в Джорджии живёт сто слонов… Вы должны двигаться только 2 км/ч. Я хочу, чтобы вы их нашли. Вы, наверное, будете там долгое время.
  rating: orange
  verdict: 'Что болото огромно и непроходимо, верно. Но сто слонов оставили бы кости, тропы и помёт: от крупных животных, живущих поколениями, остаются следы, а от мокеле-мбембе их нет.'
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - false-analogy

- id: lecture-3-3619
  start: 3619.3
  end: 3648.0
  text: О животном мокеле-мбембе сообщали члены многих экспедиций, включая моего друга из Канады Вильяма Гиббонса. Мы написали вместе книгу «Когти, челюсти и динозавры» для молодых читателей о живых динозаврах. Он был там три раза. Вот номер его телефона. Мой друг миссионер Кем Бомбей работает в Торонто в Канаде. Он и его жена являются миссионерами в Кении. Он рассказал, что они видели такое существо и наблюдали за ним 15 минут.
  rating: orange
  verdict: Уильям Гиббонс действительно несколько раз ездил в Конго, но тоже ничего не нашёл. Рассказы друзей и знакомых — свидетельства, а не проверенные данные.
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - personal-story

- id: lecture-3-3649
  start: 3649.1
  end: 3659.7
  text: В конце кассеты вы можете просмотреть интервью с людьми, которые видели похожих животных. Я взял интервью около 50 человек. В конце кассеты есть несколько таких записанных интервью.
  rating: neutral
  verdict: Ссылка на собственные интервью с очевидцами; сами интервью из конца кассеты разбираем ниже.
  rhetoric:
  - personal-story

- id: lecture-3-3662
  start: 3662.1
  end: 3708.3
  text: В Южной Америке находится болотистая местность или джунгли Амазонки. Вы слышали о джунглях Амазонки? Река Амазонка — очень большая река. В 1977 году лейтенант-полковник Британской армии Фосетт был послан для обозначения границы между Бразилией и Перу. Он был офицером королевских инженеров и известным по аккуратной записи фактов. Когда он возвратился в 1907 году, он сказал, что он видел животное, похожее на диплодока. Диплодок. Это вот такое животное. Туземцы этой части Амазонки и многие другие племена, живущие в том регионе, подтверждают, что такие животные живут в болоте в Южной Америке.
  rating: orange
  verdict: Перси Фосетт действительно размечал границы в Южной Америке, но в 1906–1907 годах, а не в 1977-м. О звере, похожем на диплодока, он, насколько известно по его запискам, писал со слов местных жителей, а не как очевидец.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-3709
  start: 3709.3
  end: 3743.7
  text: 'Полковник Фосетт убил и измерил двадцатиметровую анаконду. Туземцы, которые были с ним, сказали: «Полковник, вам необходимо увидеть больших змей». Он сказал: «Разве это не большая змея?» Несколько лет назад был сообщён встреченный сорокапятиметровый удав в Перу, который напугал футбольную команду до полусмерти. Змея уползла, оставив широкий след. И как говорят, что длина этой змеи была около 50 м.'
  rating: red
  verdict: Фосетт действительно писал об анаконде длиной около 19 м, но измерить её точно не смог, и таких змей больше никто не находил. Самые большие достоверно измеренные змеи — около 7–8 м; «змея 50 м» — слух без источника.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-3747
  start: 3747.0
  end: 3810.7
  text: 'Один из моих бывших студентов из Калифорнии был миссионером в Манаусе в Бразилии. И он жил в центре страны. Он сказал: «Мы живём в Бразилии возле речки Амазонки. Возле нас она только 14 км ширины». Хм, представляете, реку 14 км ширины. Большая речушка. В Северной Шотландии находится озеро Лох-Несс. Вы слышали об озере Лох-Несс? Это большое озеро. Длина озера 38 км, ширина — около 2 км. Глубина озера около 300 м. Было подсчитано, что в этом озере могут поместиться все люди мира. Все 6 млрд людей. Могут утонуть в озере в одно и то же время. Это большое озеро. И это озеро находится в горах. И для того чтобы увидеть озеро, вам пришлось бы подняться 10 км в городок Инвернесс. Или же вы должны были бы перейти через горы.'
  rating: neutral
  verdict: 'Отступления об Амазонке и Лох-Нессе. Цифры близки к правде: длина озера около 36 км, глубина до 230 м. «Всё человечество поместится в озере» — эффектный образ, а не довод.'
  rhetoric:
  - scale-trick

- id: lecture-3-3812
  start: 3812.0
  end: 3863.7
  text: Но в 1933 году было решено проложить дорогу вдоль края озера. Потому что для дороги не было места, и дорога была вырезана на скале горы. На этой фотографии вы можете увидеть, как выглядит дорога, вырезанная в горе. Автор статьи говорит, что в 1933 году было 52 сообщения об увиденном существе в первый год постройки дороги. К 1960-му, э-э, году, когда была написана эта книга, было 9 000 сообщений о лох-несском чудовище. Сегодня 11 000. 11 000 человек говорят, что они видели что-то в озере. Конечно, есть неправда и мошенничество. Я не говорю, что все 11 000 — это верные рассказы. Но только потому, что некоторые из них — это обман, не значит, что все обман.
  rating: orange
  verdict: 'Ховинд честно признаёт, что среди рассказов есть обман. Но рост сообщений с 1933 года совпал с новой дорогой и наплывом туристов: число рассказов растёт вместе с числом смотрящих и не доказывает животного.'
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-3864
  start: 3864.3
  end: 3876.9
  text: 11 000 человек говорят, что они видели животное. И некоторые очень почётные люди, как Питер Скотт, член парламента, равноценной сенату США. Что всё равно не придаёт доверия членам Сената.
  rating: orange
  verdict: 'Питер Скотт — известный натуралист, но членом парламента он не был: в 1945 году баллотировался и проиграл. Авторитет свидетеля не заменяет доказательства.'
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-3878
  start: 3878.5
  end: 3889.3
  text: 'Как-то раз кто-то сказал, что если Клинтон построит мост в будущее и Кеннеди повезёт нас через этот мост, я вам могу дать совет: покупайте акваланги.'
  rating: neutral
  verdict: Политическая шутка; на довод не влияет.

- id: lecture-3-3890
  start: 3890.6
  end: 3918.8
  text: Сэр Питер Скотт сказал, что он видел лох-несское чудовище, и он думает, что это плезиозавр. Что? Плезиозавр. Есть несколько видов плавающих динозавров. У плезиозавра длинная тонкая шея и четыре плавника. Большинство людей, видевших это чудовище, говорят, что оно похоже на плезиозавра. Ну вот что говорят эксперты. Некоторые люди настаивают, что это плезиозавр. Но существует маленькая ошибка. Плезиозавры вымерли 70 млн лет назад.
  rating: orange
  verdict: Питер Скотт действительно считал, что в озере может жить плезиозавр, и дал ему научное название по снимкам Роберта Райнса. Но снимки потом оказались сильно обработанными, а плезиозавры — не динозавры, а морские ящеры.
  arguments:
  - lake-monsters

- id: lecture-3-3921
  start: 3921.8
  end: 3934.7
  text: Вы знаете, я пришёл к выводу, что эволюция — это одно из самых больших препятствий развитию науки. Эволюция не только бесполезна. Она действует в обратном направлении. Она мешает людям видеть очевидное.
  rating: red
  verdict: 'Эволюция — основа современной биологии и медицины: по ней прослеживают родство вирусов и ищут окаменелости там, где их предсказали. Несси не признают плезиозавром не из-за эволюции, а потому что нет ни тела, ни кости.'
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-3-3935
  start: 3935.3
  end: 3968.3
  text: Артур Грант, студент-ветеринар. Ночью он чуть не врезался в чудовище на мотоцикле. Он студент-ветеринар, он должен знать хоть что-то о животных. И вот что он зарисовал. Он сказал, что чудовище выглядит вот так. Интересно. Александр Кэмпбелл был инспектором рыбнадзора озера 47 лет. И он говорит, что он видел Несси 19 раз. Вот его рисунок. Он говорит, что оно выглядит вот так. Кажется ли мне или у всех у них одна идея.
  rating: orange
  verdict: 'Похожие рисунки не доказывают одного животного: очевидцы видели те же газетные рисунки и знали, как «должна» выглядеть Несси. Учёба на ветеринара не помогает разглядеть зверя ночью с мотоцикла.'
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-3970
  start: 3970.4
  end: 3981.9
  text: Были построены клетки, было предложено $50 000 за чудовище, чтобы оно находилось в цирке. Многие люди пытались поймать его. Ну, это большое озеро, и никому ещё не повезло.
  rating: neutral
  verdict: Награды за поимку Несси действительно назначали, и их никто не получил.

- id: lecture-3-3982
  start: 3982.3
  end: 4009.9
  text: Многие люди рисовали, что они видели, есть некоторые фотографии, но большинство просто рассказывали. Семья Спайсер сообщила об увиденном Несси с овцой в зубах, которая направлялась к речке перед их машиной. Один человек сфотографировал спину и голову чудовища. Вы можете видеть длинную шею. Но когда фотография была опубликована в читательском справочнике, то голова была отрезана. Хм, я не знаю почему. Ну вот фотография.
  rating: orange
  verdict: Обрезать снимок при публикации — обычная работа редактора. Намёк, что голову «отрезали» нарочно, ничем не подкреплён, а сам снимок животного не доказывает.
  arguments:
  - lake-monsters
  rhetoric:
  - conspiracy

- id: lecture-3-4012
  start: 4012.1
  end: 4045.7
  text: 'Человек по имени Торквил Маклауд следил за чудовищем в бинокль девять минут. Он рассказал, что оно было наполовину в воде, с противоположной стороны озера. Его шея двигалась взад-вперёд, как у змеи перед атакой. И вот что он зарисовал. В конце он сказал: «Оно оттолкнулось плавником от берега и исчезла под водой». И он сказал, что это чудовище выглядит вот так. Все рисунки похожи. Грета Финлей сказала, что у существа были рога или вытягивающиеся дыхательные трубки.'
  rating: orange
  verdict: Рассказ Маклауда и рисунок Греты Финлей интересны, но это снова описания без тела и снимка. Сходство рисунков легко объяснить тем, что все знали, как изображают Несси.
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-4046
  start: 4046.8
  end: 4080.8
  text: Мировая энциклопедия потратила много денег. Привезла подводную лодку из Джорджии в Шотландию, на Лох-Несское озеро. И Дэн Тейлор, который теперь живёт в Южной Каролине, он опустился в этой лодке под воду. И когда он опустился, он сказал, что чудовище неуловимое. «Что-то лежало на дне. Я приблизился, но оно начало уплывать, и волнение откинуло мою лодку далеко назад». Кстати, он строит ещё одну лодку, чтобы возвратиться. Он хочет словить чудовище маленькой лодкой.
  rating: orange
  verdict: Экспедиция с подводной лодкой Дэна Тейлора в 1969 году действительно была, но ничего не нашла. «Что-то на дне уплыло» в тёмной воде — впечатление, а не наблюдение животного.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-4082
  start: 4082.1
  end: 4127.0
  text: Но они почти отказались от этой идеи, потому что вода очень чёрная. Как большая чашка кофе. Почти нет видимости. И луч света вообще не помогает. И вместо этого использовали простые лодки на поверхности, которая называлась «Операция „Поиск“». И внимательно сканировали дно озера. Это было первое сканирование дна озера. И было установлено, что дно озера всё в складках. Много места для укрытия. У меня есть карта Шотландии. И карта Лох-Несского озера. Также там на дне есть пещеры, уходящие в стороны. Тоже значит, что есть много места для укрытия. Я уверен, что животное слышало шум двадцати приближающихся лодок и спряталась.
  rating: orange
  verdict: Операция «Глубокий поиск» 1987 года, когда два десятка лодок прочесали озеро сонаром, дала лишь три неясные отметки, а не животное, как и все поиски после неё. Объяснение «оно спряталось» подходит к любой неудаче и поэтому ничего не доказывает.
  arguments:
  - lake-monsters

- id: lecture-3-4128
  start: 4128.7
  end: 4153.8
  text: Один человек сфотографировал гигантский плавник. Вот фотография Академии прикладной науки. Фотография не очень чёткая из-за тёмной воды. Фотоаппарат сработал от движения. Также один человек сфотографировал Несси с открытым ртом. Эта фотография находится в читательском справочнике «Удивительные факты».
  rating: orange
  verdict: Снимки «плавника» экспедиции Роберта Райнса 1972 года публиковались после сильной компьютерной обработки, исходные кадры гораздо менее ясны. Снимок «с открытым ртом» Ховинд не уточняет, проверить его нельзя.
  arguments:
  - lake-monsters

- id: lecture-3-4155
  start: 4155.2
  end: 4175.6
  text: Многие люди говорят, что они видели какие-то выпуклости на поверхности, которые двигались с большой скоростью. У Тима Динсдейла есть минута видеозаписи плывущего существа. Это был не корабль, и это была не подводная лодка. Королевская академия воздушных сил Англии исследовала плёнку и сказала, что это живой объект.
  rating: orange
  verdict: Плёнка Тима Динсдейла 1960 года действительно существует, и военные аналитики в 1966 году сочли объект, вероятно, живым. Но позднейшая компьютерная обработка показала, что это, скорее всего, лодка.
  arguments:
  - lake-monsters

- id: lecture-3-4176
  start: 4176.6
  end: 4204.3
  text: Утверждают, что это поддельная фотография. Может быть, я не знаю. Ну, я думаю, что это очень интересно. Потому что они подождали, пока последний человек, связанный с фотографией, умер, чтобы заявить, что это подделка. Они утверждают, что перед смертью он признался, что это подделка. Может быть, я не знаю. Но мне интересно, что уже нет свидетелей, чтобы установить правду. Даже если это и подделка, всё равно 11 000 свидетелей утверждают, они видели это существо.
  rating: orange
  verdict: 'Что признание Кристиана Сперлинга опубликовали в 1994 году, после его смерти, верно. Но ещё в 1975 году о подделке «фото хирурга» газете рассказал сын организатора, при жизни участников, а лучший снимок оказался игрушкой на подводной лодке.'
  arguments:
  - lake-monsters
  rhetoric:
  - conspiracy
  - many-witnesses

- id: lecture-3-4205
  start: 4205.0
  end: 4219.2
  text: Есть и другие озёра, только в Шотландии и в семи других озёрах рассказывают о похожем существе. Вы можете найти эту информацию в библиотеке. И независимо от системы работы библиотеки вы можете найти книги и информацию о лох-несском чудовище.
  rating: neutral
  verdict: Рассказы о похожих существах в других озёрах Шотландии; нового к доводу они не добавляют.

- id: lecture-3-4221
  start: 4221.2
  end: 4268.8
  text: 'Также есть рассказы о морской змее моря Кониш. В Южной Англии. В Английском канале много раз сообщали о похожем существе. В словаре 1766 года. Мы предполагаем, что это 1766 года, так как в нём были вырваны две первые страницы. Но в этом словаре мы отыскали слово «морской дракон». И там было написано: «Морское чудовище, выловленное в Англии в 1749 году. В некоторой степени напоминающие аллигатора с двумя большими плавниками, служившими для плавания или летания. У чудовища было две ноги с копытами как у осла. Тело было покрыто непробиваемой чешуёй. Также было пять рядов зубов». Хмм, странное существо.'
  rating: orange
  verdict: Описание из словаря 1766 года — с ослиными копытами и пятью рядами зубов — не подходит ни к одному известному животному, в том числе и к плезиозавру. Оно показывает, как старые рассказы обрастают фантазией.
  arguments:
  - sea-serpents

- id: lecture-3-4269
  start: 4269.2
  end: 4289.6
  text: В 1934 году в журнале «Время» появилась эта фотография. Вот человек для сравнения. Что-то громадное было выкинуто на берег в Нормандии. Они сказали, что это не был кит и не тюлень. Хм, возможно, это неизвестный вид. Это было в 1934 году.
  rating: orange
  verdict: 'Выброшенные морем туши часто выглядят загадочно. Но когда их удавалось исследовать, они оказывались разложившимися акулами или китами: у гигантской акулы отпадают челюсти и жабры, и остаётся «маленькая голова на длинной шее».'
  arguments:
  - monster-carcasses

- id: lecture-3-4291
  start: 4291.0
  end: 4313.7
  text: Что-то проплыло перед учёными в Бразилии в 1905 году. Они были на яхте, и они сказали, что у существа был двухметровый спинной плавник и маленькая голова на трёхметровой шее перед плавником. И это наблюдали два опытных натуралиста. Они сказали, что под водой было также большое тело.
  rating: orange
  verdict: Наблюдение натуралистов Мид-Уолдо и Николла с яхты «Валгалла» в 1905 году описано честно. Но они видели лишь плавник и шею несколько минут; что это было, неизвестно, и до плезиозавра отсюда далеко.
  arguments:
  - sea-serpents

- id: lecture-3-4315
  start: 4315.0
  end: 4341.8
  text: 'Возле Новой Зеландии есть место, где японцы ловят рыбу. И там глубина составляет только 250 м. Хм, только 250 м. Просто океан намного глубже в других местах. Прилетев с Австралии, я сказал одному человеку: «Тихий океан громадный». Он ответил: «Это только поверхность». Поразительная мысль.'
  rating: neutral
  verdict: Подводка к истории японского судна и повтор шутки «это только поверхность».

- id: lecture-3-4343
  start: 4343.0
  end: 4378.8
  text: В 1977 году громадное рыболовное судно вытягивало сети и вытащила мёртвую, прогнившую, противную одиннадцатиметровую двухтонную тушу. Очевидно, плезиозавра. Эта туша так воняла, что они сфотографировали её несколько раз и некоторое время спустя выкинули назад в море. Морской биолог, который находился в это время на борту, сделал несколько зарисовок. Он сказал, что у существа было четыре плавника и тонкая шея.
  rating: red
  verdict: Туша, поднятая японским судном «Дзуйё-мару» в 1977 году, на снимке действительно похожа на плезиозавра. Но анализ её волокон показал акулий белок, и креационисты из Answers in Genesis тоже советуют не ссылаться на эту находку.
  arguments:
  - monster-carcasses

- id: lecture-3-4384
  start: 4384.8
  end: 4406.7
  text: 'Конечно, типический ответ гуманистов или эволюционистов, что это была гигантская акула. И говорят, они говорят о разрушении жабр и плавников. Но люди, которые видели это, говорят: «Мы знаем гигантских акул». И это не была гигантская акула. Также японское правительство выпустило особую марку в 1977 году. Памятную марку в честь находки.'
  rating: red
  verdict: Вывод «гигантская акула» сделали не «гуманисты», а исследователи, изучившие образцы тканей, в том числе японские учёные. А марку 1977 года выпустили к 100-летию Национального музея природы и науки, и на ней ископаемый японский плезиозавр, а не эта туша.
  arguments:
  - monster-carcasses
  rhetoric:
  - ad-hominem-pivot

- id: lecture-3-4408
  start: 4408.3
  end: 4440.7
  text: Было также несколько сообщений из нескольких озёр из России. В одном из озёр учёными было встречено существо с большим спинным плавником и длинной шеи. В другом месте, на севере России, на Северном Ледовитом океане, существо, похожее на динозавра, было выкинуто на северное побережье России после бури в октябре 1994 года. Служба новостей объявила, что туша была 13 метров длины. Хм, что это такое?
  rating: orange
  verdict: Ни озеро, ни учёные, ни «служба новостей» не названы, поэтому эти сообщения нельзя проверить.
  arguments:
  - lake-monsters
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-4441
  start: 4441.5
  end: 4473.9
  text: В Японии с нескольких озёр сообщают о похожих существах. Говорят, что у одного длинная шея. Угреподобное чудовище. В другом озере чудовище назвали Исси. И возле озера даже стоит статуя, которая называется Исси. В Китае, в одном из озёр тоже было замечено что-то подобное. Они называют это НПО. Она жёлтого цвета, а с длинной шеей, рогами, бородкой и большой головой. Бородкой и большой головой.
  rating: orange
  verdict: 'Статуя Исси у озера Икэда — туристическая достопримечательность, а не доказательство. Рассказы из Японии и Китая повторяют ту же картину: наблюдения без останков.'
  arguments:
  - lake-monsters

- id: lecture-3-4475
  start: 4475.8
  end: 4485.7
  text: Несколько лет назад была экспедиция на Большое озеро в Швеции. 450 человек сообщили, что они видели что-то громадное в озере в Швеции.
  rating: orange
  verdict: О чудовище шведского озера Стуршён рассказывают с XVII века, наблюдений сотни. Но и там поиски и съёмка не дали ни тела, ни ясного снимка.
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-4487
  start: 4487.0
  end: 4509.3
  text: В Канаде есть 20 озёр, с которых регулярно поступают сообщения об увиденных живых динозавроподобных существах. У меня есть статья о чудовищах канадских озёр. Также имена и адреса многих людей, которые утверждают, что они видели это существо. Очень интересная информация о канадских чудовищах.
  rating: orange
  verdict: Список имён и адресов очевидцев говорит о том, что люди что-то видели, но не о том, что именно. В больших озёрах Канады живут крупные осетры, выдры и бобры, которых легко принять за чудовище.
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-4510
  start: 4510.5
  end: 4552.7
  text: 'В газетах появляются статьи о канадском родственнике лох-несского чудовища. В Южной Британской Колумбии есть большое озеро Оканаган. 130 км длины. И многие люди сообщали о существе Огопого. О нём даже пишутся песни об этом существе. И предлагается миллион долларов тому, кто сможет словить Огопого. В конце кассеты вы сможете увидеть людей, которые видели его. И в этой статье написано: они были самыми последними из тысяч свидетелей, видевших что-то странное в этом узком на 130-километровом озере в Южной Британской Колумбии.'
  rating: orange
  verdict: Награда за поимку и песни об Огопого — реклама озера, а не доказательство. За десятилетия награду так никто и не получил.
  arguments:
  - lake-monsters

- id: lecture-3-4554
  start: 4554.0
  end: 4642.5
  text: 'Я разговаривал с этим человеком, первым сверхом, Кейт Расс. Я записал наш разговор на аудио. Не, на видео. Эти люди рыбачили возле острова Кейп-Сейбл. В Канаде. В 10 километрах от берега. Я встретился с Кейтом в 1992 году. Вот номер его телефона. Он сказал, что ему 67 лет. И что он ловил рыбу с пяти лет. Он сказал, что существо было десяти-пятнадцати метров длины. У существа было четыре клыка и острые зубы размером с кулак. Оно было за… Оно плыло за его судном около 2–3 км. Голова существа возвышалась над водой около пяти метров. Это была не рыба, так как они дышат водой. Я показал плезиозавра. Он сказал, что это существо похоже, но не точно. У существа была трёхметровая шея. Двадцатисантиметровые глаза. С красновато-жёлтыми кругами. Глаза были спереди, а не по бокам, как у рыбы. И он не заметил никаких движений при приближении существа. Оно было серо-коричневого цвета с шершавой кожей и без чешуи. Она находилась в четырёх километрах на юг от острова Кейп-Сейбл. Глубина не превышала 60 м. Он сказал: «Я не хочу увидеть его ещё раз».'
  rating: orange
  verdict: Рыбак, видимо, честно рассказывает, что видел, и стаж у него большой. Но снимка нет, а сам он сказал, что существо на плезиозавра похоже «не точно»; опознание по картинке, которую показывает собеседник, мало что доказывает.
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-4643
  start: 4643.6
  end: 4698.4
  text: У меня есть книга о Кадборозавре. Много людей говорят, что они видели Кадборозавра в бухте Кадборо и в Британской Колумбии. Его также видели в штате Орегон. Трёхметровый детёныш. Его также видели в штате Орегон. Трёхметровый детёныш был найден в желудке кашалота. Говорят, что у существа длинная шея. Короткие передние плавники. И лошадиная голова. Два пилота недавно встретили такое существо в Британской Колумбии. Один человек словил такое существо и зарисовал, как оно выглядит. Оно было всего лишь 40 см длины. Он сказал, что оно царапалось, и он подумал, что оно умрёт. И он выкинул его назад в воду.
  rating: orange
  verdict: Кэдборозавра действительно описывали много раз. Но «детёныша из желудка кашалота» 1937 года музей тогда определил как зародыш усатого кита, позже предлагали гигантскую акулу или осетра; тела для проверки нет.
  arguments:
  - monster-carcasses

- id: lecture-3-4700
  start: 4700.0
  end: 4740.0
  text: 'В книге, которая называется «Чудовище и чудовище», рассказывается про сообщение о чудовищах, похожих на лох-несское, которые живут в Северной Америке. Я разговаривал с этим человеком на фотографии, его имя Жак Буавер. Из Канады. Я разговаривал с ним три часа. Он сказал: «Мистер Ховинд, я собираю сообщения о чудовище озера Мемфремейгог». Это большое озеро между Вермонтом и Квебеком. Жак берёт интервью у людей, но он не разрешает им подготавливаться. И он берёт интервью у докторов, у вице-президентов, у тех многих, которые видели чудовище озера Мемфремейгог.'
  rating: orange
  verdict: Буавер собирает рассказы о чудовище озера Мемфремейгог. Должность очевидцев — врач, вице-президент — говорит об их честности, но не о том, что они верно опознали увиденное.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-4741
  start: 4741.0
  end: 4760.5
  text: Было сообщено о существе также и в реке Потомак, поразительно похожем на лох-несское чудовище. Вот это существо было прибито на побережье Род-Айленда несколько лет назад. На остров Блок. И его назвали «Блок-несское чудовище». Пять метров длины. Ну, кто-то украл кости и теперь их нет.
  rating: orange
  verdict: Если кости нельзя изучить, они ничего не доказывают. А выброшенные туши такого вида при проверке чаще всего оказываются разложившимися акулами.
  arguments:
  - monster-carcasses

- id: lecture-3-4761
  start: 4761.9
  end: 4806.0
  text: 'В большом озере Эри в Америке много людей говорят, что они видели чудовище Эри. И они говорят, что чудовище Эри похоже на Несси. Они говорят, что оно 11 м длины. Со змееподобной головой. Многие люди говорят, что они видели чудовище озера Эри. Об этом даже пишется в газетах. Лодочники столкнулись с чудовищем в Огайо. Они говорят, что оно движется вверх и вниз, не из стороны в сторону, как змея. Я взял интервью у Джона Крафта в конце кассеты. Он сказал: Когда я увидел это существо, то голова была над водой. Пока я достал фотоаппарат, голова уже была под водой, и я сфотографировал только спину. Вот моя фотография.'
  rating: orange
  verdict: Снимок «только спины» в озере Эри опознать невозможно. В Эри живут крупные осетры длиной до 2 м и больше, их чаще всего и принимают за чудовище.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-4807
  start: 4807.8
  end: 4859.3
  text: В 1998 году я поговорил с Питом Питерсом из штата Огайо. Он сказал, что 6 лет назад он гулял по пляжу и нашёл мёртвое существо-детёныш в 1 метр длиной. Он взял его и набил, так как он таксидермист. Вот фотография. Он сказал, что это животное лежало на берегу озера Эри. Хм, странное существо, четыре маленьких плавника. Хвост как у рыбы. И с большими щеками. Карл Бах купил это существо, и теперь оно находится в музее штата Техас. Были проведены анализы ДНК, сканирование мозга, рентгеновский анализ. В голове был застрявший рыболовный крючок. Очевидно, кто-то поймал его в прошлом. Не, оно порвало леску. Хм, странное существо.
  rating: orange
  verdict: Анализы ДНК, сканирование и рентген ответили бы на вопрос, но их результатов Ховинд не называет. По описанию — плавники, рыбий хвост, крючок во рту — это скорее рыба.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-4859
  start: 4859.9
  end: 4922.0
  text: 'Массачусетс, в Скитуэйте, на юге от Бостона. На берег выкинуло это существо в 1970 году. Я разговаривал с женщиной, которая была первой на месте происшествия в 2 часа ночи. Она и шериф первыми видели существо перед тем, как его начали резать. На фотографии вы видите уже порезанное животное. Потому что каждый хотел отрезать кусок морского чудовища. Оно было 15 м длины. Лежа на пляже, оно было 2,5 м толщины. Говорят, что можно было услышать запах на 5 км. Все спорили, что это могло быть, и в конце отдел здравоохранения взорвал тушу. И выкинул остатки в океан. Они сказали: «Нам не нужно 15 метров гниющего мяса возле большого города». Люди с местного океанографического центра сказали, что это гигантская акула. Типическая реакция. Но другие люди, видевшие существо, сказали, что это не акула, а морской змей. Но я не знаю, и я не спорю об этом.'
  rating: orange
  verdict: Ховинд честно говорит, что не спорит. Но вывод специалистов «гигантская акула» назван «типичной реакцией» без разбора, хотя такие туши почти всегда оказываются разложившимися акулами.
  arguments:
  - monster-carcasses
  rhetoric:
  - personal-story

- id: lecture-3-4922
  start: 4922.7
  end: 4972.1
  text: На побережье Калифорнии — я там был несколько недель назад — в заливе Монтерей что-то было выкинуто на берег в 1925 году, известная под именем «калифорнийская Несси». Вы можете прочитать статью в журнале «Водолаз». Мы продаём книгу «Кораблекрушение и морские чудовища центрального побережья Калифорнии». И вы можете увидеть головы существа. А сзади у человека ружьё. Хм, в случае, если оно двинется. Шея была 6 м длины. Некоторые люди говорят, что это редкая форма кита. Извините. Ну покажите мне шею на ките. Здесь шестиметровая шея. Хм, наверное, редкая форма.
  rating: red
  verdict: 'Монтерейскую тушу 1925 года изучили учёные Калифорнийской академии наук по черепу: это был редкий клюворыл Бэрда. У разложившегося кита «шеей» кажутся обмякшие тело и хвост, и насмешка «покажите шею у кита» разбора не заменяет.'
  arguments:
  - monster-carcasses
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-3-4972
  start: 4972.4
  end: 4997.1
  text: 'Президент общества естествознания Британской Колумбии сказал: Моё исследование чудовища было очень тщательным. У чудовища не было зубов, голова была большой, с шеей 6 м. Я бы назвал его плезиозавром. Люди видели, как оно погибло несколько дней раньше. Рыболовы видели, как оно сражалось с множеством тюленей. И, очевидно, оно погибло и попало на берег.'
  rating: orange
  verdict: 'Первое мнение натуралиста «я бы назвал его плезиозавром» понятно: туша выглядела странно. Но на вопрос ответил осмотр черепа, и он показал кита.'
  arguments:
  - monster-carcasses

- id: lecture-3-4997
  start: 4997.9
  end: 5038.8
  text: 'О похожих животных сообщалось и в тридцатых, и сороковых годах. В заливе, в заливе Монтерей недалеко от берега. Глубина около трёх километров. Это очень глубокий залив. В тридцатых-сороковых годах сардиновый флот, в то время это была сардиновая столица. Сообщали о чём-то: один раз весь экипаж — 12 человек — видели это существо. В одном из сообщений говорилось, что чудовище всплыло возле судна и смотрело на экипаж большими зловещими глазами на округлённой голове с длинной тонкой шеей. Заметьте, что голова округлённая на длинной шее. Они сказали, что голова была около трёх метров над водой.'
  rating: orange
  verdict: Рыбаки Монтерея, вероятно, видели что-то необычное. Но в заливе много морских львов, дельфинов и крупных кальмаров, и рассказ без снимка не позволяет выбрать из них плезиозавра.
  arguments:
  - sea-serpents

- id: lecture-3-5040
  start: 5040.4
  end: 5063.3
  text: И также вам понравится книга под названием «Таинственные морские чудовища центрального побережья Калифорнии». В 1969 году рыболовы были сильно напуганы чем-то громадным, проплывающим под мостом в городе Нью-Йорке. Нью-Йоркский патруль порта старался догнать существо, которое было больше акулы. Но никто не знает, что это было.
  rating: orange
  verdict: Неопознанное крупное животное в нью-йоркской гавани — просто неопознанное животное. Записывать его в «живые динозавры» без данных — подгонка.
  arguments:
  - sea-serpents

- id: lecture-3-5065
  start: 5065.3
  end: 5129.1
  text: 'Могут ещё жить и такие существа: это зевглодон и базилозавр. Может, они и встречаются в Арканзасе, в Белой речке. Белая река огромная. И я был там сотни раз. Там живёт, там живут мои родители моей жены. Эта фотография была сделана в 1972 году так называемого «чудовища Белой реки». Но это не чудовище белой воды из Вашингтона. Это чудовище Белой речки. Много людей говорят, что они видели это существо. Его не видели после семьдесят второго года. Очевидно, оно умерло или ушло с тех краёв. В семьдесят втором году было наводнение. Раньше глубина речки была 30 м. Теперь глубина только 15 м. Ну, а на фотографии вы можете увидеть тело справа. И можете увидеть хребет. Идущий влево. В 1973 году сенатор Канзаса постановил, что запрещается беспокоить, убивать или вредить чудовищу Белой реки.'
  rating: orange
  verdict: Зейглодон и базилозавр — древние киты, а не динозавры, и вымерли они около 34 млн лет назад. «Чудовище Белой реки» чаще всего объясняют заплывшим крупным тюленем; закон 1973 года — забота о местной достопримечательности, а не признание зверя.
  arguments:
  - lake-monsters

- id: lecture-3-5131
  start: 5131.3
  end: 5181.5
  text: 'В городе Юпитер, на севере от Майами. Мой друг написал: «Мистер Ховинд, в начале пятидесятых я вылетел — у него тогда был самолёт — из города Юпитера. Я был в 12 км от берега. Вода была зеркально спокойной. Вдруг я увидел животное. Его голова возвышалась над водой, и глаза следили за моим самолётом. Казалось, оно было больше 10 м. Увидев фотографию существа с японского рыболовного судна и также зарисовки в журналах, я бы сказал, что это одно и то же существо. Я никому не рассказывал о случившемся из-за боязни быть осмеянным. Я работал в «Пратт-Уитни», авиакомпании с сильной охраной. Позже я с братом словил маленького кашалота для морского аквариума Майами. Я надеюсь, это поддержит вашу веру».'
  rating: orange
  verdict: 'Пилот честно описал, что видел с высоты. Но сравнивать это с «японским плезиозавром» нельзя: та туша сама оказалась акулой.'
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-5182
  start: 5182.1
  end: 5229.2
  text: 'Почти каждую неделю кто-то подходит ко мне и говорит: «Мистер Ховинд, я видел что-то такое. Но я никому не сказал, потому что я думал, мне не поверят». Один человек сказал: Я был во Вьетнаме. Я слышал, что местные жители боялись какого-то большого существа возле Сайгона, в речке, которая была похожа на динозавра. Я не верил этому. Но когда я был в Сайгоне, я катался на колесе обзора. И когда я был на самом верху… Я посмотрел на речку. И увидел это существо с поднятой головой из воды. Она была как змея, но голова была около 2 м над водой. И она плыла по воде. И он сказал: Вы правы, такие животные существуют.'
  rating: orange
  verdict: Что люди часто видят в воде что-то непонятное, верно. Но «голова, как у змеи» с колеса обозрения — описание без снимка, по которому зверя не опознать.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-5230
  start: 5230.3
  end: 5258.4
  text: Между Нью-Йорком и Вермонтом есть озеро Шамплейн. Это большое озеро, и много людей сообщали о чудовище озера Шамплейн. Сообщения появляются в газетах того региона всё время. Эту книгу больше не печатают. В январе этого года сделали последнюю копию. У нас осталось только 30 экземпляров. Эта книга называется «Шамплейн по ту сторону легенды». И в этой книге пишется о чудовище озера Шамплейн.
  rating: orange
  verdict: Заметки о Чемпе в местных газетах действительно появляются постоянно. Но заметка говорит о том, что люди что-то видели, а не о том, что именно.
  arguments:
  - lake-monsters

- id: lecture-3-5259
  start: 5259.8
  end: 5287.5
  text: 'Я позвонил женщине, которая сфотографировала… Её имя Сэнди Мэнси. Она согласилась встретиться, и мы встретились и записали наш разговор, которые находятся в конце кассеты, в котором она описала то, что она видела. Она с мужем и двумя детьми следили за ним 10 минут. Я сказал: «Сэнди, вы думаете, вы видели динозавра?» Она сказала: «О нет. Я знаю, что я видела динозавра». Это произошло в 1977 году.'
  rating: orange
  verdict: Снимок Сэнди Мэнси 1977 года — самый известный снимок Чемпа. Но место, размер и расстояние по нему установить не удалось, и исследователи допускают, что на нём плавучее бревно.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-5289
  start: 5289.0
  end: 5325.9
  text: 'В 1998 году журнал «Открытие» сообщил: на озере Шамплейн пятьдесят девять пассажиров «Этана Аллена» сообщили о существе 10 или 12 метров длины, с тремя или пятью горбами. Плыла за судном на расстоянии 65 м в течение 5 минут. «Не говорите мне, что это был карп или осётр», — настаивает шкипер. Если это и была рыба, то она весила 1 500 или 2 000 кг. Кто-то пытался сказать Сэнди, что это была утка. Она сказала: «Если это была утка, то она весила 900 кг. Это не была утка».'
  rating: orange
  verdict: Наблюдение с парома интересно, и шкипер честно допускает крупную рыбу. Но возражения скептиков сведены к шутке «это была утка», а серьёзные версии — рыба, бревно, волны от судов — не разобраны.
  arguments:
  - lake-monsters
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-3-5326
  start: 5326.8
  end: 5338.8
  text: Библия говорит о змеях в воде. О чудовище морском. Очевидно, что если динозавры ещё живые, то те, что живут в воде, будут убиты последними. Их труднее убить, чем земноводных.
  rating: purple
  verdict: Мы тоже читаем в Библии о морских чудовищах, которых сотворил Бог (Быт 1:21, Пс 103:26). Но это не названия видов, а плезиозавры не динозавры и вымерли вместе с ними, 66 млн лет назад.
  arguments:
  - bible-dinosaurs

- id: lecture-3-5340
  start: 5340.6
  end: 5381.7
  text: В Пенсаколе, там, где я живу. В 1962 году пять подростков решили пойти нырять. В трёх километрах от берега находится старый затопленный корабль. Возле военно-морской базы. Вот рассказ, который написал Эдуард Макклер. Это единственный спасшийся. Он сказал, что пять ребят пошли нырять возле затопленного корабля. В 1962 году. Эдуард живёт сейчас в Джексонвилле и отказывается говорить об этом. После происшедшего он стал алкоголиком и наркоманом. Сейчас он лечится. Хмм, 30 лет спустя.
  rating: orange
  verdict: Трагедия 1962 года и тяжёлая судьба выжившего вызывают сочувствие. Но страдания свидетеля не подтверждают того, что именно он видел в тумане после шторма.
  arguments:
  - sea-serpents

- id: lecture-3-5383
  start: 5383.4
  end: 5481.4
  text: 'Он сказал: Мы плыли на плоту к старому затопленному кораблю в нескольких километрах от берега. На полпути начался шторм и отвёз нас в море. По окончании шторма мы находились в густом тумане. Мы слышали странный шум, скорее похожий на плесканье дельфинов. С отвратительным запахом, похожим на запах мёртвой рыбы. Шум приближался к плоту, и вскоре мы услышали громкий шипящий звук. Через туман мы заметили что-то похожее на торчащий из воды длинный столб высотой в 3 м. На конце виднелось что-то округлённое. Через некоторое время оно согнулось и исчезло в воде. Оно появилось ещё несколько раз, приближаясь ближе к плоту. Молчание было прервано ещё раз чем-то похожим на скуление. Мы были в панике. Мы все одели ласты и прыгнули в воду. «Плывём к кораблю!» — я закричал. В воде мы потеряли друг друга из-за тумана. Я слышал крики моих товарищей. Один за другим. Я успел взглянуть на существо перед тем, как оно схватило моего друга. Шея была около четырёх метров длины. Коричневато-зелёная с гладкой поверхностью. Голова была похожа на голову морской черепахи. Только продолговатая и с зубами. Я успел заметить что-то похожее на спинной плавник. Также, если мне не изменяет память, глаза были зелёными с овальными зрачками. Оно съело четырёх его друзей. Он слышал их крики. Он сказал: «В конце я доплыл до корабля, вершина которого торчала из воды, и просидел на ней целую ночь». Ранним утром я поплыл к берегу, где и был найден спасателями. Единственный. Спасшийся.'
  rating: orange
  verdict: Рассказ Макклири записан с его слов, других свидетелей нет. Ночь в штормовом море могла оставить страшные воспоминания, но что ребят съело животное, ничем не подтверждено.
  arguments:
  - sea-serpents

- id: lecture-3-5482
  start: 5482.8
  end: 5516.6
  text: 'В конце девяносто восьмого года я проповедовал в Форт-Уолтон-Бич во Флориде. После лекции ко мне подошла женщина и сказала: Моё имя Вал Бил. Мой сын Ларри Бил был одним из съеденных. Она сказала: «Его отец был вовлечён в поисках президента». И у него был высокий ранг в поисково-спасательной службе. Он был ответственным за поиски своего сына. И они искали пропавших несколько дней. Было найдено только одно тело. Очевидно, один подросток в панике утонул, и, очевидно, остальные были съедены.'
  rating: red
  verdict: 'Горе матери настоящее, и мы ему сочувствуем. Но найдено одно тело утонувшего, а вывод, что остальных съели, Ховинд делает сам: пропавших в море чаще всего уносит течением.'
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-5518
  start: 5518.7
  end: 5551.6
  text: 'Также несколько раз что-то было встречено в Панама-Сити. Я разговаривал с руководителем молодёжи Реем Агменом. Он сказал: Мы с молодёжью ехали по мосту и видели существо, как это на рисунке. Мы никому об этом не сказали, боясь, что нам не поверят. В библиотеке есть книга Томаса Хелма «Чудовище глубины». Он был преподавателем биологии во Флориде. Он уже умер, но он написал эту книгу после того, как он с женой увидели похожее существо. Панама-Сити.'
  rating: orange
  verdict: Рассказы молодёжного руководителя и книга Томаса Хелма — снова описания без снимков и останков. Что люди боятся насмешек, понятно, но это не делает их рассказ точным.
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-5552
  start: 5552.5
  end: 5562.6
  text: Возможно, что ещё есть живые птеродактили. Обычно их называют динозаврами. Но технически это не динозавры. В Африке их называют конгамато.
  rating: red
  verdict: Ховинд верно оговаривается, что птерозавры — не динозавры. Но живых птерозавров никто не поймал и не сфотографировал, а их костей моложе 66 млн лет не найдено.
  arguments:
  - living-pterosaurs

- id: lecture-3-5563
  start: 5563.7
  end: 5602.7
  text: 'Как-то раз ко мне в офис позвонил человек по имени Романди. Я уже забыл его фамилию, но его называют Стивом. Он сказал, что он студент в университете штата Луизиана. Вот его номер телефона. Он сказал: «Я живу в Кении». Я здесь только учусь в Америке. Вы сказали, что есть живые птеродактили. Они живут в моей деревне. Он сказал: «У них двухметровый размах крыльев». Они летают ночью, никто их не любит. И их любимая пища — это гниющее человеческое тело. Если вы кого-то похоронили, конгамато может откопать тело и съесть. Двухметровый размах крыльев.'
  rating: red
  verdict: Рассказ студента о «конгамато» — пересказ деревенских поверий. Ночное летающее существо с размахом крыльев около 2 м скорее похоже на крупную летучую мышь или птицу, чем на ящера, вымершего 66 млн лет назад.
  arguments:
  - living-pterosaurs
  rhetoric:
  - personal-story

- id: lecture-3-5604
  start: 5604.5
  end: 5633.2
  text: 'Африканский исследователь Мелланд слышал много рассказов о существе конгамато, которая живёт возле болот в Родезии, в Бельгийском Конго. Туземцы сказали, что это птица. Больше похожая на ящера с крыльями, как у летающей мыши. Когда он показал им рисунки птеродактиля и также других животных, все мгновенно указали на птеродактиля, взволнованно повторяя: «Конгамато!» Обманули ли нас насчёт динозавров?'
  rating: red
  verdict: Фрэнк Мелланд в 1923 году действительно записал рассказы о конгамато. Но сам он существа не видел, а картинка в руках спрашивающего подсказывает ответ; вопрос «обманули ли нас?» доказательства не заменяет.
  arguments:
  - living-pterosaurs
  rhetoric:
  - appeal-to-doubt

- id: lecture-3-5636
  start: 5636.1
  end: 5655.0
  text: 'Несколько ковбоев, видимо, убили птеродактиля в Аризоне. Эта статья появилась в газете около 100 лет назад. Никто не поверит, они сказали: «Но мы убили громадную птицу без перьев». Они отрезали часть крыла и отнесли в салон и показали своим друзьям: «Видите, мы убили птицу без перьев». Это находится в газете?'
  rating: red
  verdict: Заметку о «птице грома» в аризонской газете 1890 года действительно печатали, но обещанный снимок так и не нашли. Газетные выдумки XIX века — известный жанр, а не научное наблюдение.
  arguments:
  - living-pterosaurs

- id: lecture-3-5656
  start: 5656.5
  end: 5720.4
  text: 'В ноябре 98-го года миссионер из Венесуэлы Его имя Адам Хатчетсон. Он сказал: «Мистер Ховинд, я миссионер в Венесуэле». Он сказал, что местные жители говорят о летающем животном, которого они боятся. Они убили одно около 30 лет назад. Вот его рассказ. Это большая летучая мышь. Она иногда опрокидывает каноэ и даже уносит людей. Он сказал, что напуганные индейцы направили храбрейших людей к устью речки, где они убили это существо около 30 лет назад и захоронили возле реки Мувада. Когда Клинт, другой миссионер, показал индейцам рисунок птеродактиля, их глаза расширились, и они сказали: «Вот это оно». Они положительно опознали этого вымершего динозавра как летучую мышь, жившую возле их деревни. Даже сегодня индейцы не ловят рыбу и не пьют воду из речки из-за страха перед этим существом. Вот его телефон.'
  rating: red
  verdict: Рассказ миссионера записан со слов местных жителей, а сам Ховинд называет зверя «большой летучей мышью». Крупные летучие мыши в тропиках действительно есть, а опознание по картинке ничего не доказывает.
  arguments:
  - living-pterosaurs
  rhetoric:
  - personal-story

- id: lecture-3-5722
  start: 5722.3
  end: 5796.8
  text: Возле побережья Новой Гвинеи есть остров Серам. Миссионер Тайсон Хьюс рассказал Уильяму Гиббонсу, моему другу из Канады, что там жило полутораметровое существо с кожаными крыльями. И туземцы его называют Оранг Батай. Как орангутанг, только Оранг Батай, человек с крыльями. Они рассказали, что существо ловит, любит воровать рыбу. Но это не чайка. Карл Бах несколько раз ездил в Папуа — Новую Гвинею, где есть много сообщений о существе, как Тирдак. Они говорят, что оно любит гниющее человеческое мясо. И что оно светится в темноте. Один миссионер сказал мне после проповеди в Иллинойсе, что когда он ловил рыбу гарпуном, его жена светила фонариком из каноэ, так как это было ночью. Вдруг появилось полутораметровое существо и летало вокруг. Оно светилось, и то, что светилось, обсыпалось. Они предположили, что когда существо находится в пещере, маленькие светящиеся существа садятся на кожу, и когда она летает, они падают. Но никто не уверен, что это такое. Ну, а по рассказам, они говорят, что оно светится в темноте.
  rating: red
  verdict: Оранг-бати и ропен — существа из местных поверий островов Серам и Новой Гвинеи. Креационистские экспедиции, в том числе Карла Бо, искали их и не привезли ни снимка, ни кости; ночные огни могут иметь много объяснений.
  arguments:
  - living-pterosaurs
  rhetoric:
  - personal-story

- id: lecture-3-5797
  start: 5797.4
  end: 5827.6
  text: Индейцы видели, как молния убила такое существо, ставшее известным как птица грома. Когда они нашли кости, они сказали, что размах крыльев был 6 м. И также была шишка сзади головы. И также были зубы в клюве. Легенда о птице грома существовала на Западном побережье Америки. Даже Генри Форд назвал машину в честь этой птицы. Вот индейская молитвенная палка находится в музеях Колорадо. В виде головы птеродактиля.
  rating: red
  verdict: Птица грома — образ индейских мифов о грозе; машину Ford назвали в честь мифа, а не животного. Резная голова показывает искусство резчика, а кости с размахом крыльев 6 м никто не предъявил.
  arguments:
  - living-pterosaurs

- id: lecture-3-5829
  start: 5829.8
  end: 5893.0
  text: 'Когда Маркетт и Жолье плыли по Миссисипи в XVII столетии, они увидели большую птицу, нарисованную на столе. На скале. Они спросили индейцев: «Что это за птица?» Индейцы сказали: «О, эта птица Пиаса». Она иногда уносила людей. Но великий вождь молился, и великий дух дал ему план, и он убил эту птицу. Индейцы переехали с того места недобровольно, конечно. И там поселился белый человек. И этот рисунок выцвёл. Несколько сотен лет назад кто-то решил снова нарисовать рисунок. Сейчас он возле города Олтон в Иллинойсе. На скале. Они рисовали его по рассказам. Но было трудно поддерживать его каждый год, поэтому они поставили большую металлическую плиту на скалу. Вот я нахожусь возле плиты для сравнения. Плита находилась там до девяносто шестого года. Я поехал в Иллинойс, взял телефонный справочник и решил найти слово «Пиаса». Я нашёл 25 наименований.'
  rating: red
  verdict: 'Рисунок Пиасы действительно был на скале у Олтона, и Маркетт описал его в 1673 году: рогатое существо с бородой, чешуёй и длинным хвостом. Это скорее водяной дух индейских легенд, чем птерозавр, а нынешний рисунок — современная реконструкция.'
  arguments:
  - living-pterosaurs

- id: lecture-3-5895
  start: 5895.7
  end: 5907.7
  text: 'Люди спрашивают: «Доктор Ховинд, почему вы путешествуете и говорите про динозавров?» У меня есть повод. Если вы думаете, что мне приятно оставлять мою прекрасную жену и детей, вы не правы.'
  rating: neutral
  verdict: 'Переход: зачем Ховинд ездит с лекциями о динозаврах.'

- id: lecture-3-5909
  start: 5909.5
  end: 5937.4
  text: 'Друзья, Сатана использует динозавров, чтобы учить детей обману. Ребятам в этом городе завтра утром скажут: «Ребята, это динозавр». Каким будет следующее предложение? Они жили миллионы лет назад. И Сатана использует их, чтобы отвернуть детей от Бога. Во-вторых, христиане не знают, куда вписываются динозавры. И они компрометируют Библию.'
  rating: red
  verdict: Что детям рассказывают о динозаврах с «миллионами лет», верно. Но это вывод геологии, а не обман сатаны, и многие христиане принимают его, не «компрометируя Библию».
  arguments:
  - earth-age-billions
  rhetoric:
  - loaded-language

- id: lecture-3-5939
  start: 5939.7
  end: 5961.6
  text: И в-третьих, динозавры — это прекрасный инструмент евангелизации. Детям нравятся динозавры. Проследите за ними. Богу должна быть слава за его творение. Потому что Бог сотворил их. Это верх путей Божьих, написано в книге Иова. Тогда их нужно использовать для славы Божьей.
  rating: neutral
  verdict: Динозавры как повод славить Творца — с этим мы согласны. Ссылка на «верх путей Божиих» разобрана выше.

- id: lecture-3-5962
  start: 5962.1
  end: 5996.9
  text: 'Слово Бога верно. Иов в главе сорок второй наконец ответил Господу. Иов уже в это время был другим человеком, он раскаялся. Иов изменился. Бог показал ему два динозавра. Бегемота и Левиафана. И задал ему 84 вопроса. Иов сказал: «Я раскаиваюсь». Я думаю, что у Иова была проблема, как и у нас. Он не понимал, кто такой Бог. Проблема, как и у нас.'
  rating: purple
  verdict: Мы тоже верим, что встреча с Богом изменила Иова и что ему, как и нам, нужно было понять, кто такой Бог. Что Бог показал ему «двух динозавров», — толкование Ховинда, разобранное выше.
  arguments:
  - bible-dinosaurs

- id: lecture-3-5998
  start: 5998.4
  end: 6054.8
  text: 'Разрешите спросить. Как велик ваш Бог? Достаточно велик, чтобы сказать вам, что делать, и вы будете его слушаться. Ваш Бог говорит, что смотреть по телевизору? Псалом 101: «Не положу пред очами моими вещи непотребные». Говорит вам Бог, что делать? Библия говорит: «Никакое гнилое слово да не исходит из уст ваших». Говорит вам Бог, о чём говорить? Или вы принимаете участие в грязных историях на работе или с друзьями? Как велик ваш Бог? Библия говорит: «Жёны в приличном одеянии». Достаточно велик ваш Бог, чтобы говорить, как одеваться? Мой отец говорил: «Если вы не работаете, не рекламируйте». Как велик ваш Бог? Иов не понимал, кто такой Бог. И когда Бог показал ему два динозавра и задал 84 вопроса, Иов изменился.'
  rating: neutral
  verdict: Проповедь «Как велик ваш Бог?» о послушании в повседневной жизни. К научным доводам она не относится.

- id: lecture-3-6056
  start: 6056.1
  end: 6078.9
  text: 'Дьявол использует существа, за которые нужно славить Бога. Сатана использует их для обмана детей здесь. В церкви. В воскресенье дети ходят в церковь. В понедельник они идут в школу, и им говорят: «Ребята, это динозавры. Они жили миллионы лет назад». Но кто-то должен учить правде.'
  rating: red
  verdict: 'Повтор довода, разобранного выше (1:38:29): школьное «миллионы лет назад» — вывод науки, а не сатанинский обман детей.'
  arguments:
  - earth-age-billions
  rhetoric:
  - loaded-language

- id: lecture-3-6082
  start: 6082.6
  end: 6165.4
  text: 'Меня часто спрашивают: «Брат Ховинд, призвал ли Бог учить этому?» Я сказал: «Я не знаю». Я не получил ни письма, ни звонка. Я знаю, что это нужно делать и всё. Я скажу, что нам надо. Нам нужно, чтобы кто-то из вас начал служение о сотворении в этом городе. В каждом городе. Вы можете раздавать кассеты в вашей школе. Или в детском лагере. Оставьте кассету в офисе вашего доктора. Вы можете что-то делать. Видео — это прекрасная возможность евангелизации, потому что кассету просмотрят люди, которые никогда не придут в церковь. Вы можете провести вечер изучения про динозавров в вашей церкви. Много разных возможностей. Вы можете позвонить Тому Де Россе из Форт-Лодердейла во Флориде. И спросите его, как он проводит такие вечера? Он вам даст необходимую информацию. Вы также можете купить грузовик. Начните служение. Подумайте, что можно сделать? Некоторые из нас могут написать книги. Хорошие авторы — книги о сотворении или динозаврах. Детям это нравится. Напишите драму. Тракты. Или же пожертвуйте кассетой в вашу школьную или общественную библиотеку.'
  rating: neutral
  verdict: 'Призыв начинать креационистское служение: раздавать кассеты, писать книги, проводить вечера о динозаврах. Желание говорить людям о Боге мы разделяем.'

- id: lecture-3-6166
  start: 6166.9
  end: 6216.5
  text: 'Как-то я был в библиотеке университета. Я запросил список книг об эволюции и нашёл 1 400 книг об эволюции. Потом я запросил книги о создании. Я не нашёл ни одной. Я не мог найти ни одной книги о сотворении. Я спросил у библиотекаря. «Почему у вас так много книг об эволюции и ни одной о сотворении? Я думал, это университет, где студентов обучают всесторонне». Библиотекарь сказал: Ну, у нас есть одна книга. Я сам её сюда поставил. Это «Сторожевая башня». Я подумал: «Ничего себе книга о сотворении» — это книга Свидетелей Иеговы. Все остальные эволюции. Друзья, есть ли книги о сотворении в вашей библиотеке? Пожертвуйте.'
  rating: orange
  verdict: 'Что в университетской библиотеке книг об эволюции много, неудивительно: это основа биологии. Но один неудачный поиск в одной библиотеке не говорит о «запрете» креационизма, и креационистские книги в библиотеках есть.'
  rhetoric:
  - personal-story

- id: lecture-3-6217
  start: 6217.1
  end: 6348.9
  text: 'Человек по имени Чарльз Холкэм после моего семинара сделал себе гигантскую надувную палатку. И учит в палатке детей про динозавров. Нам нужна такая палатка в каждом городе. Расскажите про меня радиоведущим. Я участвую в четырёх-пяти радиопрограммах каждую неделю. Одна женщина послала мою кассету на радиопрограмму Арта Белла. И ведущий позвонил мне в январе девяносто седьмого года и предложил быть на программе. Я никогда не слышал об этой программе, но я согласился. И тогда он сказал: «Идите отдохните, потому что я в эфире с часу до пяти утра». Я подумал: кто слушает радио ночью? Но всё же я встал и принял участие в этой программе. После трёх часов мы объявили мой номер телефона. Четыре часа ночи. Через 10 секунд у меня в офисе зазвонили все телефоны. Мне пришлось разбудить жену и детей. Телефон продолжал звонить, не переставая. Три недели. К нам поступило Свыше 100 000 контактов от только одной радиопрограммы. У Арта Белла 11 млн слушателей от Гавайи до Англии. Позвоните местному ведущему и предложите пригласить гостя-креациониста для дискуссий. Это заинтересует их? Вы знаете? Нам нужен христианский динозавр. Соберите детей и покажите представление с динозавром. Тогда пронаблюдайте за детьми. Не за динозавром, но за детьми. Они будут все во внимании. Вы знаете, о чём я говорю. Купите костюм динозавра. Здравствуйте, дети. Давайте споём: «Бог любит меня, Бог любит тебя, Он хочет быть твоим отцом. Если ты его попросишь, в сердце он придёт и тебя спасёт».'
  rating: neutral
  verdict: Примеры служения последователей, история об эфире на радио и совет купить костюм динозавра для детей. На научные доводы это не влияет.

- id: lecture-3-6351
  start: 6351.1
  end: 6369.8
  text: 'Не лучше ли учить детей этому? Это евангелизация. Вы скажете: «Я не смогу говорить о сотворении». Если кто-то спросит о датировании по углероду, дети не спрашивают об этом. Идите, говорите детям. Потому что это их обманывают.'
  rating: orange
  verdict: 'Учить детей о Боге — доброе дело, и мы этому рады. Но школьное естествознание детей не «обманывает»: о его выводах можно спорить доводами, а не ярлыками.'
  rhetoric:
  - loaded-language

- id: lecture-3-6371
  start: 6371.4
  end: 6543.1
  text: 'Идёт война, и каждый должен что-то делать для Господа. Как-то я позвонил в воздушные силы и спросил: «Вы знаете, сколько нужно людей на земле, чтобы F-15 находился в воздухе?» Они сказали мне, ответили по телефону: «Необходимо 454 человека наземного персонала, чтобы самолёт находился в воздухе один час». Если вы не можете быть пилотом, вы можете поддерживать пилота. Если вы не хотите быть проповедником или пресвитером церкви, вы можете поддерживать такого человека. Если вы не можете… хотите быть миссионером, поддержите миссионера. Если вы не хотите стрелять, подавайте пули. Каждый должен делать что-то для Господа. Господь уже сказал, что делать: идите и проповедуйте Евангелие по всему миру. Спасайте, крестите и учите. И это великое поручение упомянуто пять раз. Что вы делаете? Вы повинуетесь. Повинуетесь Господу. Если вы не стараетесь привести людей ко Господу, тогда вы не повинуетесь Господу. У каждого из нас есть задание. Вы можете молиться, поддерживать людей, делать или раздавать кассеты. Это тоже большая работа. Одна церковь сделала 3 000 копий моих кассет и разослала по всей Канаде. Идёт война, делайте хоть что-то. Давайте сейчас встанем, склоним головы и помолимся. Здравствуйте, это Кент Ховинд. Сегодня 31 августа 1993 г. Я нахожусь в Винчестере, штат Нью-Гэмпшир, Сэнди Мэнси. Рад видеть вас, Сэнди. Сэнди видела Чемпа? Её фотография появилась на обложке книги Иосифа Зарзинского. Расскажите нам, когда, и где, и как? Как это произошло? Это было на стороне Вермонта. Я с моим будущим мужем… Э-э, мы гуляли возле озера. И так как я выросла в этой местности, мы просто сидели возле озера и наслаждались тишиной. Потом мой муж пошёл в машину за фотоаппаратом. В это время на озере появилось волнение. Я подумала, что это был просто косяк рыбы, или или что-то в этом роде. Но потом из воды показалась голова, шея и спина. И я поняла, что это не была рыба.'
  rating: neutral
  verdict: Призыв к служению, Великое поручение и заключительная молитва; затем начало интервью с Сэнди Мэнси, автором снимка Чемпа (сам снимок разобран выше, 1:27:39). Призыв проповедовать Евангелие мы разделяем.
  rhetoric:
  - personal-story

- id: lecture-3-6545
  start: 6545.8
  end: 6555.5
  text: И я слышал, что некоторые люди говорили, что это была утка. Это… Правда ли это? Хм, это была шестисоткилограммовая утка?
  rating: orange
  verdict: Версию «утка» Ховинд выбирает потому, что над ней легко посмеяться. Серьёзные объяснения снимка — плавучее бревно, коряга, волна — он не разбирает.
  arguments:
  - lake-monsters
  rhetoric:
  - vysmeivanie-vmesto-dovoda
  - straw-man

- id: lecture-3-6556
  start: 6556.6
  end: 6579.5
  text: Когда я встретил вас в Дублине, в Нью-Гэмпшире, вы сказали, что этот динозавр похож на Чемпа. Но вы сказали, что он немного отличался от того, что вы видели. Да, у того, что я видела, шея была э… немного короче. Голова похожа на лошадиную. Но… Но опять же, шея была короче.
  rating: neutral
  verdict: Сравнение увиденного с рисунком на плакате Ховинда.

- id: lecture-3-6581
  start: 6581.0
  end: 6610.1
  text: Вот три или четыре вида плавающих динозавров, кости которых были найдены. Кронозавр с огромной шеей, плезиозавр, как у вас. И эласмозавр с короткой шеей под прямым углом к телу. Э-э… Конечно, могут быть ещё и неизвестные виды. Я думаю, это он. Может быть, что не вся шея была над поверхностью воды.
  rating: red
  verdict: Плезиозавр, кронозавр и эласмозавр — не динозавры, а морские рептилии, последние из которых вымерли 66 млн лет назад. К тому же у эласмозавра шея как раз самая длинная, а у кронозавра короткая; подогнать увиденное под «неизвестный вид» можно всегда.
  arguments:
  - lake-monsters

- id: lecture-3-6613
  start: 6613.0
  end: 6650.8
  text: 'И это произошло в… Это произошло в 1977 году. Да. Сколько людей вы знаете, которые говорят, что они видели это существо? Я разговаривала с шестью людьми, которые видели это существо. Хмм, наши рассказы очень и очень похожи. И я думаю, что все мы не можем быть сумасшедшими. Мы не говорим то, что мы не видели. Описания очень похожие: форма головы, шеи. Вообще массивный размер.'
  rating: orange
  verdict: Очевидица честно рассказывает, что видела, и сумасшедшей её никто не считает. Но рассказы могут быть похожи и потому, что люди знают, как «должен» выглядеть Чемп.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-6652
  start: 6652.0
  end: 6711.9
  text: Как долго вы наблюдали за этим животным? До того, пока оно не нырнуло. Я думаю, около восьми– десяти минут. Первый раз. Почти год назад. Вы сказали, что оно всплыла и смотрела в разных направлениях. Да, когда оно появилось из воды, оно смотрело прямо. Когда оно появилось из воды. Потом оно посмотрела по сторонам. Когда я сфотографировала фотографию, оно начало двигаться и посмотрело назад. Как… как вы можете видеть на фотографии. Потом… Это когда я сфотографировала, потом оно посмотрело вперёд. Начала погружаться и опустила голову в воду. Когда оно было под водой, я услышала шум лодки. Я ещё не видела лодки, я только слышала. И оно знало, что лодка приближалась.
  rating: neutral
  verdict: 'Подробности наблюдения: сколько оно длилось и как вело себя существо.'

- id: lecture-3-6714
  start: 6714.5
  end: 6726.7
  text: Многие люди, с которыми я разговаривал, говорили мне, что у динозавров, например, как живущих в Африке, очень чувствительный слух. При шуме они прячутся в воду. Миссионеры говорят, что там живут динозавры.
  rating: red
  verdict: Что пугливые животные чутко слышат, верно. Но «миссионеры говорят, что там живут динозавры» — пересказ без имён и данных; мокеле-мбембе разобран выше.
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-3-6727
  start: 6727.5
  end: 6746.6
  text: Конечно. Я уверена. Бог сотворил динозавров. Он сотворил динозавров, и они должны быть творением. Я не думаю, что они произошли просто так. Как нас учат всей этой чепухе.
  rating: purple
  verdict: 'Мы тоже верим, что динозавров сотворил Бог. Но выбор «сотворены Богом или произошли просто так» ложен: многие христиане верят, что Бог творил и через долгое развитие жизни.'
  rhetoric:
  - lozhnaya-dilemma
  - loaded-language

- id: lecture-3-6749
  start: 6749.2
  end: 6780.9
  text: Ваша фотография появилась на книге Иосифа. И в других местах, в журнале «Время» в 1981 году. На прошлой неделе вы были гостем на программе «Неразрешённые тайны». Я участвовал на этой программе три раза уже. Первый раз был в сентябре 1992 года. И совсем недавно я там была ещё раз. Теперь вы кинозвезда? Нет.
  rating: neutral
  verdict: Где публиковался снимок Мэнси; на довод не влияет.

- id: lecture-3-6782
  start: 6782.6
  end: 6798.0
  text: Есть люди, которые учат, что эволюция — это доказанный факт, и что динозавры жили миллионы лет назад. Вы знаете, что у меня другое мнение. Я преподавал науку и я глубоко убеждён, что динозавры ещё живут сегодня. И вообще, что миру нет миллионов лет.
  rating: red
  verdict: 'Что Ховинд преподавал в школе, верно. Но опыт учителя — не довод: живых динозавров никто не поймал и не нашёл их костей, а древность Земли измерена многими независимыми способами.'
  arguments:
  - living-dinosaurs
  rhetoric:
  - self-authority

- id: lecture-3-6798
  start: 6798.7
  end: 6812.5
  text: Можете вы сказать, что то, что вы видели, можно назвать динозавром, живущим в воде? Я видела динозавра. — Вы думаете, что вы видели динозавра? — Я знаю, я не думаю, я знаю, что я видела динозавра.
  rating: orange
  verdict: 'Уверенность очевидицы искренняя, но «я знаю, что видела динозавра» — её вывод, а не наблюдение: видела она голову, шею и спину в воде.'
  arguments:
  - lake-monsters

- id: lecture-3-6813
  start: 6813.7
  end: 6940.4
  text: 'У людей появляется вопрос: Почему вы сделали только одну фотографию? Я не хотела ничего пропустить. Вы наблюдали? Я была занята наблюдением. Я взяла фотоаппарат. Сделала одну фотографию, и и всё. Я не хотела ничего пропустить. Я трепетала от всего происходящего. Я даже не знаю, почему я сфотографировала тот один раз. Это была интуиция. Ваш муж принёс вам фотоаппарат? Да, до появления животного. Он ничего не знал, пока он не вернулся, он дал мне фотоаппарат, у меня дрожали колени. Я встала на колени и сфотографировала одну, один раз. И потом я опустила фотоаппарат. Вы могли сделать 20 снимков? Конечно, но я хотела наблюдать. Я хотела найти объяснение, что это такое. Я-я не понимала, что происходит. Вообще, большинство людей, с которыми вы разговариваете, они, они верят в эволюцию. Как вы смотрите на это? Вам это не нравится? Я с вами согласен. Я благодарен вам за фотографию, она на моём плакате. Моя цель — это укрепить веру людей в Библию, так как Библия — это слово Божье. И вот здесь ваша фотография. Вы участвовали на многих шоу и журналах. Сколько лет вы уже здесь живёте? Около двадцати лет. Вы не намереваетесь стать знаменитой, фотографируя Чемпа? Нет, я даже не хотела, чтобы об этом знали. Я держал это в секрете два года, потом узнал научный мир. И в конце меня заставила пресса. Они говорили: «Если это существо существует, почему его никто никогда не видел?» И у меня есть издательское право, чтобы я могла контролировать или предохранять, кто может использовать мою фотографию.'
  rating: neutral
  verdict: Почему снимок только один; плакат Ховинда; очевидица не искала славы. На довод не влияет.

- id: lecture-3-6945
  start: 6945.7
  end: 6969.4
  text: 'Да, люди спрашивают меня. Есть такие животные, если они существуют, почему нет больше фотографий? Тогда я задаю им вопрос: вы видели аварию? Они говорят: «Да». Я скажу: «Дайте мне фотографию аварии во время столкновения». Таких фотографий нет. Но происходят тысячи аварий. Вы не думаете об этом? Э-э, но потом уже поздно, когда это происходит.'
  rating: orange
  verdict: Аварии длятся секунды и случаются внезапно, а крупное животное в озере, за которым десятилетиями следят с камерами, попадало бы в кадр много раз. Сравнение не работает.
  arguments:
  - lake-monsters
  rhetoric:
  - false-analogy

- id: lecture-3-6970
  start: 6970.9
  end: 6978.4
  text: Если возможно, держите меня в известности о людях, которые видели это существо. Они, наверное, приходят к вам. Пришлите мне список.
  rating: neutral
  verdict: Ховинд просит присылать ему новые свидетельства.

- id: lecture-3-6986
  start: 6986.8
  end: 7063.2
  text: 'Расскажите мне о случае со старым мужчиной. Я стояла здесь у прилавка. Зашёл пожилой мужчина и начал пристально смотреть на фотографию. Он спросил меня о фотографии. Я сказала, что это Чемп из озера Шамплейн. Он сказал, что он этого ещё никому не говорил. Ему было около 87 или 89 лет. Он сказал, что когда он был молодым, Он ловил рыбу со своим дедушкой на озере Шамплейн. Он вырос на озере? Да, он вырос на озере. Он рассказал мне, что когда он и его дедушка ловили рыбу, Из воды вдруг появилось что-то громадное. Громадное существо. Его дедушка сказал ему, что это был Чемп. Но о нём нельзя никому говорить, так как люди будут думать, что они сумасшедшие. И за всю свою жизнь он никому не рассказал об этом событии. Я была первым человеком, кому он рассказал. Он сказал, что ни он, ни его дедушка не были сумасшедшими, и что они видели живого и дышащего динозавра. Внутри себя закричала: «Аллилуйя!»'
  rating: orange
  verdict: Это детское воспоминание пожилого человека в чужом пересказе, спустя около 70 лет. Рассказчик может быть искренним, но проверить такой рассказ нельзя.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-7066
  start: 7066.4
  end: 7092.2
  text: Были ли другие люди, которые рассказывали вам об этом? Да, я ценю это. Это указывает, что я не сумасшедшая. что я видела это, и они видели это, и и мы все что-то видели. И они рассказали мне этот секрет. Большое спасибо, ваши покупатели уже ждут.
  rating: neutral
  verdict: Конец интервью.

- id: lecture-3-7129
  start: 7129.0
  end: 7205.6
  text: Это акула? Она там. Она ныряет. Дай мне бинокль. Это акула? Нет, это не акула. Что-то появилось вот там. Я видел это, папа. Его уже нет. Она нырнула? Я думаю, что мы видели Чемпа. А что это такое? Чудовище озера Шамплейн. М-м, его больше нет. Лучше бы я не смотрел бинокль, а снял бы на камеру. Оно показалось вот там возле буйка. Когда я смотрел в бинокль, вот оно здесь показалось, и потом оно проплыло всё это расстояние. И прямо здесь оно нырнуло вот здесь.
  rating: orange
  verdict: На любительской записи неопознанный объект в воде, и снимавшие сами не уверены, что видели. Что это живой динозавр, видео не показывает.
  arguments:
  - lake-monsters

- id: lecture-3-7228
  start: 7228.5
  end: 7260.8
  text: Это гигантский кальмар. Вида Architeuthis dux. Оно было выкинуто на берег 22 ноября 1979 года в Ньюфаундленде. Это молодое и маленькое животное женского пола. Но это гигантский кальмар. Я верю, что гигантские кальмары достигают размера 45 м длины. Если этот кальмар только 6 м, то оно в 8 раз больше. Это громадный кальмар.
  rating: red
  verdict: 'Architeuthis dux, выброшенный на берег Ньюфаундленда, — настоящий гигантский кальмар. Но «45 м» — вера Ховинда, а не данные: измеренные особи вместе со щупальцами достигают 13–17 м, а смелая научная оценка — около 20 м, но не 45.'
  arguments:
  - sea-serpents

- id: lecture-3-7264
  start: 7264.4
  end: 7339.1
  text: 'В 1976 году в 48 км от Корнуолла два рыболова, Джордж Винникомб и Джон Кок, видели чудовище. Мы плыли в 48–54 км от берега. С правой стороны мы увидели перевёрнутую лодку. Мы решили разведать. Когда мы приблизились, мы увидели, что это была не лодка. Мы не видели ничего подобного. Оно было тёмное с горбами на спине. Оно было пяти-шести. метров длины. И возвышалась над водой где-то на 1 м. Был тихий день, никакого волнения в воде. Мы подплыли ещё ближе. Оно повернулось. И нырнуло в воду всего лишь около метра от нашей лодки. Я не видел ничего подобного за 40 лет в море. Оно медленно погрузилось в воду. Исчезла. Я говорил об этом, я вижу одно объяснение: доисторическое животное.'
  rating: orange
  verdict: Рыбаки, вероятно, честно описали увиденное. Но тёмный горбатый предмет длиной 5–6 м может быть китом, акулой или группой дельфинов; «доисторическое животное» — их догадка.
  arguments:
  - sea-serpents
  rhetoric:
  - personal-story

- id: lecture-3-7341
  start: 7341.0
  end: 7363.5
  text: Добро пожаловать на нашу программу. — Терри, как дела? — Хорошо, спасибо. Сегодня мы будем говорить об Огопого. Много людей видели его. Существуют старые легенды об Огопого. Мы поговорим с экспертами. У нас в гостях будет Арлин Гаал, она написала книгу. Сейчас телефонные линии. Линия вторая. Доброе утро.
  rating: neutral
  verdict: Начало канадской телепередачи об Огопого.

- id: lecture-3-7365
  start: 7365.5
  end: 7450.1
  text: 'Вы хотите знать? Конечно. Я был водителем такси. Я отвёз пассажира в госпиталь и возвращался по Аббат-стрит. Потом я остановился вот здесь. Я посмотрел на озеро. Я удивился. Я увидел голову, как у лошади, э-э, с с какими-то рогами. Она была громадная. Похожее на… вы знаете, морского змея. Кто-то подъехал сзади и спросил: «Что ты делаешь?» Я сказал: «Я вижу Огопого». Он сказал: «Где?» Дверь была открыта, я вышел из машины. И животное ускользнуло в воду. И-и-и он сказал: «Посмотри, какие большие волны». Мы видели, как большие волны расходились с этого места в сторону проката лодок. И тогда, после этого я сел в машину. Я заехал в гостиницу, я рассказал моим друзьям, что я только что видела Огопого. Они спросили: «Что ты пил?»'
  rating: orange
  verdict: Рассказ таксиста об Огопого искренний, но это снова описание без снимка. Голову «как у лошади» люди нередко видят в плывущих животных и волнах.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-7451
  start: 7451.5
  end: 7545.9
  text: 'Линия четвёртая. Привет, Джон. Как дела? — Неплохо. Скажите ваше имя. — Я не могу. — Хорошо. Я видела Огопого четыре года назад. Вы не хотите говорить ваше имя? Нет. Вы уже рассказывали об этом? Да. Вы думаете, что они подумают, что вы чуть-чуть… Я получала странные звонки. Мне за такие звонки платят. Но мне не платят. Я была на берегу. Дочка каталась на качелях, когда я увидела это существо. Я развернулась и посмотрела, и я поняла, что это был легендарный Огопого. Я напугалась. Схватила ребёнка, и я начала бежать. И всё это время я кричала: «Это он! Это он!» Она кричала, а её лицо было красным. Оно, наверное, ловило рыбу. Оно находилось там некоторое время. Потом оно поплыло вдоль вот тех столбов. И всё, что было видно,— это только три горба. Они были большими и высокими. Как столбы. Оно уплыло вдоль берега до конца. Потом… потом развернулась и поплыла вот в ту сторону.'
  rating: orange
  verdict: Испуг матери понятен. Но «три больших горба» — частое описание волн от прошедшего судна или зверей, плывущих цепочкой, например выдр.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-7547
  start: 7547.2
  end: 7588.3
  text: Сейчас мы сделаем перерыв от звонков и представим вам известного человека в долине Оканаган, Арлин Гаал. Она написала книгу «Огопого». Доброе утро. Сколько таких рассказов вы записали? Сотни. Когда произошло самое первое столкновение? Первый раз это произошло в 1852 году. Первое записанное явление. В 1852 году. Сегодня 1980 год. Значит ли это, что там больше, чем один Огопого? Точно больше, чем один. В 1968 году была сделана видеозапись. Очень трудно не верить, если вы видите это прямо перед своими глазами. Расскажите немного об этом.
  rating: orange
  verdict: Сотни записанных рассказов говорят о том, как живуча легенда об Огопого, известная ещё местным индейцам. Но число рассказов не заменяет ни одного тела или кости.
  arguments:
  - lake-monsters
  rhetoric:
  - many-witnesses

- id: lecture-3-7589
  start: 7589.7
  end: 7634.4
  text: 'Запись сделана в 1968 году человеком по имени Арт Фолден. Он возвращался из путешествия в Чейс. Когда он проезжал по району Пичленд, он заметил что-то в озере. Он сказал жене: «Смотри, это Огопого». Она засмеялась. Он вышел и начал снимать это на камеру. На видео мы видим существо большого размера, плывущее по воде с разной скоростью, показываясь на поверхности. Мы видим, как существо набирает скорость. И производит массу волн. В замедленном движении вы можете видеть, как оно разрезает воду с большой силой, производя сильные волны.'
  rating: orange
  verdict: 'Плёнка Арта Фолдена 1968 года действительно существует, но объект снят издалека, и опознать по ней животное нельзя: его считают и бобром, и выдрой, и волной.'
  arguments:
  - lake-monsters

- id: lecture-3-7640
  start: 7640.7
  end: 7748.0
  text: '— Вы знаете, кто-то видел его недавно? — В этом году его видели семь или восемь раз. Один из этих случаев считается лучшим. Почему? Был прекрасный день. Вода спокойная, как стекло. Я развернулся и увидел большую волну. Я не обратил на неё внимания сначала. Волна приближалась, и я подумал: «Откуда такая волна? Ведь нет ветра?» Я позвал сына. И сказал: «Посмотри, откуда может быть такая волна?» Э-э, он посмотрел и потом сказал, что он ничего не понимает. Также с нами был мой внук. И мой внук сказал: «Дедушка, это Огопого». Оно бы врезалось в лодку, но мы повернули и плыли за ним сбоку около, я бы сказал, двадцати минут. Я бы сказал, что чудовище было около 5 метров длины. Это над водой и около метра высоты. На спине были горбы. Я… я также бы сказал, что хвост был около десяти, пятнадцать, может быть, и длиннее, так как мы не видели его конца. У существа был длинный хвост и четыре ноги, и я бы сказал, что оно весило около тридцати тонн. Его голова двигалась из из стороны в сторону. Я думаю… Оказалось, что она искала рыбу или ещё что-то. И также это существо взволновало огромную массу воды. Если бы я не видел, я бы не поверил. Вообще-то, мне всё равно, верят мне или нет, но я знаю, что я видел это существо. Оно здесь, и оно огромное.'
  rating: orange
  verdict: Очевидец уверен в том, что видел, и говорит честно. Но «длинный хвост, четыре ноги и 30 тонн» нельзя разглядеть с лодки у животного в воде; это скорее догадка, чем наблюдение.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-7750
  start: 7750.9
  end: 7795.7
  text: Это было какое-то чудовище, так как я не могу подыскать другого слова. Оно было около 10–12 м длины. Его голова была над водой. Было видно движение хвоста. И от него исходили волны. И я сделал два снимка. — Вы сказали, что оно похоже на это, какая разница? — Похоже, но я не видел плавников. Это было под водой. Она была похожа, но я видел только голову, шею, вообще верхнюю часть тела.
  rating: orange
  verdict: Ещё одно описание, с двумя снимками, которых передача не разбирает. Сам очевидец говорит, что плавников не видел, то есть сходство с плезиозавром додумано.
  arguments:
  - lake-monsters
  rhetoric:
  - personal-story

- id: lecture-3-7801
  start: 7801.2
  end: 7832.2
  text: Это Кент Ховинд из Пенсаколы. Я в Канаде на программе «100 Huntley Street». Несколько лет назад, в 1994 году, когда я был на программе, я принёс книгу Роя Макала «Живой динозавр». И Кал Бомбей сказал, что, когда он был в Африке, он видел что-то наподобие динозавра. Когда я показал вам рисунок, вы сказали, что вы видели такое существо. Расскажите нам о себе и о том, что вы видели. Просто опишите, что вы видели.
  rating: neutral
  verdict: Ховинд представляет очевидца «живого динозавра» в Кении.

- id: lecture-3-7833
  start: 7833.8
  end: 7921.2
  text: 'Это был потрясающий момент в моей жизни. В 1963 году я ехал по старым дорогам Кении. Я ехал назад в Найроби. Я ехал на большой машине, продвигаясь очень медленно. И это была холмистая местность. Вернее, я бы сказал, это была холмистая часть долины. Когда мы поднялись на очередной холм. Я был с моей женой, и прямо перед нами лежал, как я подумал, трёхметровый крокодил. Но потом я подумал: «Это не крокодилы, это сухая часть страны». Мы остановились и смотрели на животное около десяти минут. Когда я смотрел на него, я сразу вспомнил слово «доисторический». Я подумал, это невозможно. Я видел рисунки, но не точно такие. От головы до хвоста. на теле находились… я не знаю, как они называются, хребетные пластинки. Находились, э-э-э… треугольники такие от головы до хвоста. Оно лежало, и казалось, что оно грелось на солнце. Я посмотрел, я смотрел на него 10 минут. Я был готов застрелиться, что что я не взял с собой фотоаппарат. Я не видел ничего подобного до или после этого.'
  rating: orange
  verdict: Очевидец честно рассказывает о встрече в Кении в 1963 году. Но трёхметровый серый зверь, похожий на крокодила, с гребнем на спине, подходит крупному крокодилу или варану; на динозавра указывает только картинка.
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - personal-story

- id: lecture-3-7922
  start: 7922.2
  end: 7949.6
  text: И я спрашивал людей, я даже пошёл в музей и спросил человека, водится ли что-то в подобное в Кении. Ну, мне ответили, что такого нет ничего. Но я сказал, что я видел такое, и тогда я спорил с ними, и они сказали, что всё это моё изображение… воображение. Ну, я и моя жена видели такое существо. Мы спрашивали, видел ли ещё кто-то такое существо, но никто его не видел, и я больше его не видел тоже.
  rating: orange
  verdict: В музее ответили, что таких животных в Кении нет, а других свидетелей не нашлось. Единичный рассказ без снимка опознать нельзя.
  arguments:
  - jungle-dinosaurs
  rhetoric:
  - personal-story

- id: lecture-3-7950
  start: 7950.8
  end: 8039.5
  text: После 10 минут оно поднялось. Оно не было таким высоким, как на этом рисунке. И оно ушло в очень сухую, густолиственную местность. Тогда было сухое время года, оно просто ушло. Мы посмотрели друг на друга и подумали:«Что это могло быть?» — Какого цвета оно было? — Грязно-серого. — Вы видели его глаза? — Да, оно посмотрело на нас, но оно не испугалось. — А какими были зрачки? Круглыми или овальными? — Я-я не мог, было слишком далеко. Она была похожа на крокодила. Больше на крокодила, чем на гиппопотама. Некоторые туземцы потом говорили мне, что это был варан. Это невозможно, так как я видел много варанов, но я никогда не видел трёхметрового варана. Также я убил несколько варанов. У них гладкая кожа, нет пластин на спине. Я знаю варана, это не был варан. У него были треугольники на спине. — Кожа была гладкая или чешуя? — Э… казалось, как у крокодила, аллигатора. Я не думаю, что я видел чешую. Но я не могу быть уверенным. Так и это было несколько лет назад.
  rating: orange
  verdict: Очевидец сам говорит, что зверь больше походил на крокодила, и не уверен в деталях. Даже если это был не варан, динозавром он от этого не становится.
  arguments:
  - jungle-dinosaurs

- id: lecture-3-8041
  start: 8041.4
  end: 8065.3
  text: Много лет назад Я всегда говорю, что динозавры ещё живут. — Ну вы подумали «доисторический»? — Я был подготовлен образованием, что такие существа не существуют. То, что это было, это не был динозавр, да? И я полагал, что это какой-то вид ящерицы. Потому что есть маленькие ящерицы и есть громадные ящерицы.
  rating: red
  verdict: Сам очевидец считает, что видел крупную ящерицу, а не динозавра. Ховинд всё равно делает вывод «динозавры ещё живут», который из рассказа не следует.
  arguments:
  - living-dinosaurs

- id: lecture-3-8067
  start: 8067.1
  end: 8110.5
  text: '— Вы работаете здесь? Какой у вас номер телефона, если кто-то хочет позвонить и поговорить с вами? — Мой номер телефона: код 905. 33571003206 Позвоните, если вы не верите. Когда я увидел этот рисунок, я сразу подумал, что я уже это где-то видел. Давайте покажем этот рисунок зрителям ещё раз. Если у вас есть вопросы о динозаврах, мы будем рады помочь или выслать некоторую информацию или видеокассету о сотворении, эволюции, динозаврах. Значит, вы видели это существо? Большое спасибо за ваше время. Да благословит вас Бог.'
  rating: neutral
  verdict: Очевидец оставляет телефон; конец передачи. Номер в разметку не переносим.

- id: lecture-3-8115
  start: 8115.7
  end: 8147.9
  text: Спасибо за просмотр ваших кассет. Вы можете позвонить с вопросами, и мы вам постараемся помочь. Мы хотим укрепить вашу веру в Библию. На этой видеокассете мы говорили о том, что динозавры ещё живые. Интересно изучать о динозаврах, сотворении, эволюции. Но намного важнее знать, что вы попадёте на небо. Если вы не уверены, что вы попадёте на небо, я хочу рассказать, что учит Библия, как попасть на небо. По крайней мере, вы должны знать, что говорит Библия.
  rating: red
  verdict: 'Что знать путь спасения важнее любых споров о динозаврах, мы согласны. Но итог «динозавры ещё живые» не подтверждён: за все рассказы нет ни тела, ни кости, ни ясного снимка.'
  arguments:
  - living-dinosaurs

- id: lecture-3-8150
  start: 8150.8
  end: 8522.6
  text: 'Когда я учился в школе, э-э, в штате Иллинойс, я посещал разные церкви. Но я не знал, что я попаду на небо. Я-я не знал, был ли я спасён. Когда друг спросил меня: «Кент, ты попадёшь на небо?» Я сказал: «Я не знаю». Он сказал: «Ты хочешь, чтобы я тебя показал по Библии, как можно узнать?» Я сказал: «Конечно, я хочу знать». Он показал мне три стиха. И впервые в жизни я понял, чего хочет Бог. Римлянам 3:23 написано: «Потому что все согрешили и лишены славы Божьей». Мы все грешники. Мой друг сказал: «Кент, ты грешник? Ты делал плохое?» И Библия говорит, что все грешники. Одни хуже других в человеческих глазах, но перед Богом один грех делает вас грешником. Если вы нарушили хоть один из Божьих законов, вы являетесь грешником. В Римлянам, в шестой главе, двадцать третьем стихе, написано: «Ибо возмездие за грех — смерть». Возмездие — это то, что вы заслуживаете. И за грех вы заслуживаете — это то, что вы заслуживаете, — смертельное наказание. Вы заслуживаете умереть и пойти в ад. Но Бог не хочет, чтобы вы пошли в ад. Чтобы быть справедливым, Бог хочет всех… должен всех, кто согрешил, послать в ад. Но Бог придумал выход. Иисус Христос умер на кресте, чтобы заплатить за ваши грехи. И теперь вы можете принять то, что он уже сделал для вас. Поэтому его смерть платит за ваш грех. Мой друг сказал, что я заслуживаю умереть и пойти в ад. Но он сказал продолжение стиха: «А дар Божий — жизнь вечная во Христе Иисусе, Господе нашем». Вечную жизнь нельзя получить через церковь, через крещение, через хорошую жизнь. Её можно получить только через Иисуса Христа. Мы получили от наших родителей бесплатный дар физической жизни. Кто-то другой прошёл через боль, заплатил деньги, чтобы мы могли получить подарок. Получить жизнь. Рождение занимает несколько минут. Но возрастание берёт долгое время. И рождение в семью Бога занимает несколько минут. Но возрастание в семью Бога занимает много времени и усилий. Как чтение Библии, посещение церкви, молитва. Они помогают стать хорошим христианином. Но они не делают христианином. Стать христианином можно, только если кто-то сделает за вас работу. Если Христос войдёт в ваше сердце и сделает из вас нового человека. 9 февраля шестьдесят девятого года мой друг сказал: «Кент, ты грешник. И, соответственно Библии, ты заслужишь умереть и пойти в ад». Он сказал: «Но Бог хочет дать тебе подарок — вечную жизнь. Ты заслуживаешь вечную погибель. Бог хочет дать тебе вечную жизнь». Я сказал: «Как можно получить этот подарок?» Он сказал: «Римлянам 10:13 написано: „Ибо всякий…“ Это значит, что любой человек „Ибо всякий, кто призовёт имя Господне, спасётся“». А здесь не говорится «может спастись», здесь говорится «спасётся». Каждый, кто принимает Иисуса Христа, призывает имя Его. В первой главе Иоанна говорится, что если вы принимаете Его, то вы становитесь его дитём, сыном Бога. В третьей главе Иоанна говорится, что вы должны родиться свыше. Всё взаимосвязано. Когда вы принимаете Иисуса как вашего Спасителя, принимаете его в своё сердце. Когда вы принимаете то, что он сделал для вас, вы становитесь дитём Бога. Вы получаете новое рождение. И это занимает всего лишь несколько минут, чтобы сказать: «Иисус, я грешник, прости». 9 февраля шестьдесят девятого года я сказал: «Иисус, я грешник. Я знаю, что ты умер за меня на кресте. Прости меня. Я хочу, чтобы ты жил в моём сердце. Спаси меня и сделай из меня нового человека». Тогда я принял Христа как Спасителя. И этот день был моим духовным днём рождения. Я стал дитём Бога. Если я делаю что-то неправильно, я не могу пойти в ад, потому что я получил дар вечной жизни, И эта жизнь длится вечно. Но как ребёнок Бога я могу быть наказан. Теперь я в семье Бога, и отношение ко мне изменяется. Теперь я не погибаю. Но получаю наказание за грехи. Теперь за мои грехи заплачено. И когда я говорю, что я иду на небо, это не значит, что я хороший. Это значит, что я прощён. Если вы примете Иисуса Христа как своего Спасителя прямо сейчас, он простит вас, спасёт вас и возьмёт вас на небо. В этой сессии мы говорили о сотворении, эволюции, о динозаврах и других интересных вещах. Но это не будет иметь никакого значения, если вы попадёте в ад. Проверьте своё сердце. Если вы не приняли Христа как Спасителя, склонитесь и пригласите его в сердце прямо сейчас. Помолитесь простой молитвой. Бог знает ваше сердце. Если вы хотите принять Христа, помолитесь вместе со мной. Дорогой Господь Иисус. Я знаю, что я грешник. Я верю, что ты умер за меня на кресте. Прости меня. Я принимаю тебя как моего Спасителя. Во имя Иисуса Христа. Аминь. В Римлянам 10:13 говорится: «Ибо всякий, кто призовёт имя Господне, спасётся». Если вы только что приняли Христа, Бог обещал, что вы пойдёте на небо. А обещания Бога вечны. Если вы сегодня приняли Христа, напишите нам, позвоните, моё имя и адрес появятся на экране. Дайте нам знать, что вы покаялись, и мы возрадуемся вместе. Принятие Христа и духовное рождение — это только начало. Возрастание требует усилий. Читать Библию, ходить в церковь, говорить другим о Христе. Я буду рад вам помочь.'
  rating: neutral
  verdict: Евангельский призыв, свидетельство об обращении и молитва. Мы разделяем призыв довериться Христу; к научным доводам эта часть не относится, а различия деноминаций в учении о спасении здесь не разбираем.
