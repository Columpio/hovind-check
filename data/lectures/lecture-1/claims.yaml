- id: lecture-1-50
  start: 50.4
  end: 167.0
  text: 'Очень приятно, что вы пришли. Моё имя Кент Ховинд, я из Пенсаколы, Флорида. Я преподавал науку в старших классах 15 лет, а теперь в последние 10 лет я путешествую и говорю о сотворении, эволюции, динозаврах. Я сразу говорю, что я верю в то, что Библия является безошибочным и вдохновённым словом живого Бога. Я верю Библии от обложки до обложки. Я даже верю обложке. На ней написано: «Кент Ховинд». Я верю в это. У меня есть три цели, которые я хочу достичь во время моих семинаров. Первое, я хочу укрепить вашу веру в слово Божье. Второе, если вы ещё не спасены, я хочу, чтобы вы были спасены и смогли быть со мною на небесах. И третье, если вы спасены, но не трудитесь для Бога, я постараюсь, чтобы вы чувствовали себя неловко. Идёт война. Каждый должен найти себе работу для Господа. Если вы не можете стрелять, подавайте пули. Каждый может делать что-то. За 30 лет моего христианства я заметил, что каждый может делать что-то. Даже худшие из нас могут служить плохим примером, поэтому каждый может делать что-то для Господа. Давайте начнём. Это — не моя жена. Это только её фотография. Мы переехали в Пенсаколу, штат Флорида, в 1989 году, чтобы моя жена смогла закончить музыкальную программу в христианском колледже. У нас трое детей. Им 20, 21, 22 года. Разница в один год и две недели. Все они студенты университета штата Теннесси. Они хотят служить Господу. Есть четыре важных вопроса, на которые человек старается найти ответ. Это четыре философских вопроса мировоззрения. Каждая религия мира, даже атеизм — это тоже религия. Все религии стараются ответить на эти вопросы. Ответы на эти четыре важных вопроса о жизни зависят от вашего взгляда на мир.'
  rating: neutral
  verdict: 'Представление, исповедание веры и цели семинара. Мы тоже верим, что Писание — Слово Божье, и разделяем цели: укрепить веру и привести ко Христу. Что у каждого, даже у неверующего, есть свои ответы на главные вопросы жизни, тоже верно. Спор у нас не о вере и не о биографии лектора, а о том, что говорит наука и как читать первые главы Бытия.'
  rhetoric:
  - self-authority

- id: lecture-1-167
  start: 167.4
  end: 197.8
  text: 'Существует два взгляда на мир. Некоторые смотрят на мир и говорят: «Удивительно, этот мир произошёл из ничего при Большом взрыве». Это гуманистическое мировоззрение, в котором человек — это бог. Другие люди говорят: «Удивительная конструкция». Значит, существует умный Создатель. В этом мировоззрении говорится, что Бог — это Бог. И все мы отвечаем перед ним. Одно из этих мировоззрений неверно. И они находятся в войне между собой. Кто-то не прав. И мне приятно показать, кто не прав.'
  rating: red
  verdict: Ложный выбор. Теорию Большого взрыва предложил католический священник Жорж Леметр, и миллионы христиан принимают её, веря в Творца. «Большой взрыв» — это не мировоззрение, а научная модель, а гуманизм не учит, что «человек — бог».
  arguments:
  - big-bang
  rhetoric:
  - lozhnaya-dilemma
  - podmena-ponyatij
  - straw-man

- id: lecture-1-199
  start: 199.4
  end: 241.0
  text: Если теория эволюции всё-таки верна, как учат в школьных учебниках, то как вы ответите на эти четыре фундаментальных вопроса? Кто я? А что я значу? Если верна эволюция, то вы являетесь протоплазмой, которую выкинуло на берег. И таким образом, вы представляете проблему. Потому что вы являетесь одним из загрязнителей окружающей среды. Кстати, если эволюция верна, то это мышление является нормальным. Необходимо уничтожить человечество, так как мы являемся проблемой. Но если верно сотворение и мы являемся причиной этого творения, то Бог сделал это для нас. Большая разница между взглядами.
  rating: red
  verdict: Из теории эволюции не следует ни что человек ничего не стоит, ни что человечество надо уничтожить. Биология отвечает на вопрос «как возникли живые существа», а не «сколько стоит человек» и «что нам делать».
  arguments:
  - evolution-morality
  rhetoric:
  - straw-man
  - loaded-language

- id: lecture-1-241
  start: 241.6
  end: 269.6
  text: 'Во-вторых, как вы ответите на вопрос: Откуда я появился? Если верна эволюция, то тогда вы появились из космического взрыва около 20 млрд лет назад. Почему я здесь? Какой смысл жизни? Если верна эволюция, то в жизни нет смысла. Делайте всё, что вам нравится. Куда я попаду после смерти? Если верна эволюция, то вас закопают в могилу, и ваше тело превратится в растение или ещё что-то.'
  rating: red
  verdict: 'Здесь смешаны три разные вещи: биология (эволюция), физика (Большой взрыв) и вопрос о смысле жизни. Эволюция не учит, что «смысла нет», а в землю после смерти ложится и тело верующего.'
  arguments:
  - evolution-morality
  rhetoric:
  - podmena-ponyatij
  - straw-man

- id: lecture-1-270
  start: 270.5
  end: 283.2
  text: Но Библия говорит, что в начале сотворил Бог небо и землю. Если это верно, то теперь на эти вопросы появляются совершенно другие ответы. Теперь нам необходимо узнать, кто Бог. Что он хочет и делает? Что он говорит?
  rating: green
  verdict: Верно. Вера в Бога-Творца действительно меняет ответы на вопросы о смысле и ценности жизни. С этим согласны и христиане, принимающие эволюцию.

- id: lecture-1-283
  start: 283.7
  end: 316.4
  text: 'Ну, вы знаете, Сатана не хочет этого. Дьявол подошёл к Еве в третьей главе Бытия и сказал: «Подлинно ли сказал Бог: не ешьте ни от какого дерева в раю?» Вопросительный знак. Первым предложением Сатаны был вопрос. Заставить Еву сомневаться. Сатана всегда так делает, он хочет, чтобы мы сомневались в словах Бога. Второе, он сказал: «Нет, не умрёте». Теперь он называет Бога обманщиком. Третье, что он сказал: «Ева, если ты вкусишь плод с этого дерева, вы будете как боги».'
  rating: neutral
  verdict: Пересказ третьей главы Бытия. Что искуситель сеет сомнение в слове Божьем, признают все христиане.

- id: lecture-1-318
  start: 318.2
  end: 330.0
  text: И прямо там, в Эдемском саду, и зародилась вся идея эволюции. Эволюцию не придумал Дарвин. Её придумал Сатана в Эдемском саду. Сатана хочет, чтобы мы поверили, что мы можем быть как боги.
  rating: red
  verdict: 'Обман змея был в том, что человек станет «как Бог» без Бога, через непослушание. Теория эволюции говорит о другом: как из поколения в поколение меняются живые существа. Общего у них только слово «выше», а не смысл.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-330
  start: 330.2
  end: 338.5
  text: Да, ребята, мы развиваемся, мы становимся больше, лучше, сильнее, умнее. И в один день мы будем путешествовать по Вселенной и открывать новые жизненные формы.
  rating: red
  verdict: 'Эволюция не учит, что всё становится «больше, лучше, умнее»: это не лестница вверх, а ветвящееся дерево. Виды приспосабливаются к своей среде, и пещерные рыбы, например, в темноте теряют глаза.'
  arguments:
  - evolution-religion
  rhetoric:
  - straw-man

- id: lecture-1-340
  start: 340.2
  end: 352.2
  text: 'Мне часто задают вопрос: «Брат Ховинд, думаете ли вы, что существует интеллигентная жизнь на других планетах?» Я говорю: «Нет». Я был учителем 15 лет и не видел много интеллигентной жизни на этой планете.'
  rating: neutral
  verdict: Шутка вместо ответа на вопрос. На доводы не влияет.

- id: lecture-1-355
  start: 355.0
  end: 377.7
  text: 'Сатана— это обманщик. Он сказал, что вы можете быть как боги. Но он сам хочет быть Богом. Однако многие религии мира поверили в его обман. В официальной доктрине мормонов говорится: «Мы можем стать богами». Если вы хорошая жена-мормонка, то вы будете вечно беременны в раю. Моей жене не нравится такой рай.'
  rating: orange
  verdict: 'О мормонах сказано в целом верно: их учение говорит, что верные «станут богами». Но «вечно беременны» — карикатура для смеха. Мормоны не принимают Никейский символ веры, и к спору о науке это не относится.'
  arguments:
  - deification-lie
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-380
  start: 380.2
  end: 395.1
  text: В официальной доктрине Католической церкви — 99% католиков об этом не знают — но в доктрине говорится, что они могут стать богами. Это обман дьявола, что человек может стать богом. Но Сатана сам хочет стать богом.
  rating: purple
  verdict: Ховинд путает две разные вещи. Древнее учение Церкви об обожении говорит, что человек призван стать «богом по благодати» в единении со Христом, но никогда — Богом по природе. Это учение отцов Церкви, общее для православных и католиков.
  arguments:
  - deification-lie
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-396
  start: 396.0
  end: 436.7
  text: 'В четырнадцатой главе Исаии Люцифер сказал: «Взойду на небо, выше звёзд Божиих вознесу престол мой и сяду на горе в сонме богов, на краю севера; взойду на высоты облачные, буду подобен Всевышнему». Видите, Сатана хочет быть Богом. Но ему нет места. И он злой. И он не может стать богом. Он злой на Бога, но ничего не может сделать Богу. Поэтому он злой на нас. Потому что мы сотворены по подобию Божьему. Вы задумывались, почему дьявол ненавидит вас? Только потому, что вы напоминаете ему о Боге. Он хотел быть Богом, но это невозможно, поэтому он обманул Еву, говоря, что она может стать богом. Он обманщик.'
  rating: purple
  verdict: Мысль о том, что дьявол ненавидит людей как образ Божий, разделяют многие христиане. Толкование Ис 14 о падении сатаны — древняя традиция, хотя в самом тексте пророк обличает царя Вавилонского.
  arguments:
  - deification-lie

- id: lecture-1-436
  start: 436.9
  end: 453.4
  text: 'Гитлер сказал: «Если говорить ложь во всеуслышание достаточно долго и часто, народ поверит лжи». Люди больше расположены верить в большой лжи, чем маленькой. Если вы хотите, чтобы кто-то поверил обману, есть выход. Вы должны перемешать обман и правду вместе.'
  rating: orange
  verdict: 'Мысль верная: обман, смешанный с правдой, убедительнее. Но цитата приписана Гитлеру неточно: о «большой лжи» он писал, обвиняя в ней своих врагов, а фразы «повторяй ложь часто, и в неё поверят» у него не найдено.'
  rhetoric:
  - unverified-quote

- id: lecture-1-454
  start: 454.2
  end: 504.2
  text: 'Так произошло со мной. У меня есть два старших брата: Рас и Марк. Они всегда были старше меня. Э-э, кстати, они и сегодня старше меня. Когда мне было шесть лет, мы жили в штате Иллинойс. Одним утром я прибежал самым первым на завтрак. И я взял последний банан из тарелки. Через несколько минут пришли два моих старших брата. Они спросили: «Эй, Кент, это последний банан?» Я сказал: «Да». У вас есть старший брат или сестра? Вы, наверное, знаете это приятное чувство, когда они всегда подшучивают над вами, и иногда вам удаётся подшутить над ними. И в то утро я знал, что они хотели мой банан. Но старшие братья никогда ничего не просят у младших братьев. Они добиваются своего либо силой, либо обманом.'
  rating: neutral
  verdict: Начало истории из детства. На доводы не влияет.

- id: lecture-1-505
  start: 505.4
  end: 521.5
  text: 'Так вот, мои братья спросили меня: «Кент, ты знаешь, из чего состоят бананы?» Я сказал: «Нет». Мне было только шесть лет. Было доказано, что мозг не начинает развиваться, пока ребёнку нет 18 или 20. А вы согласитесь со мной, родители?'
  rating: orange
  verdict: Это шутка, но подана как научный факт («было доказано»). На деле мозг активно развивается с первых недель после зачатия, а к 18–25 годам заканчивает созревать.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-523
  start: 523.0
  end: 559.8
  text: 'Я сказал: «Нет. А из чего состоят бананы?» Они сказали:«В Южной Америке живут пауки с длинными ногами». Когда они умирают, они свешиваются с деревьев и их ноги покрываются плесенью. Поэтому банан— это ноги паука. Я сказал: «Нет. Вы меня обманываете, потому что вы хотите мой банан». Они сказали: «Нет, брат. Разрежь этот банан посередине, и ты увидишь чёрные ножки пауков». А вы знаете, после этого я не ел бананы около трёх лет. Меня обманули.'
  rating: neutral
  verdict: Продолжение истории про банан. На доводы не влияет.

- id: lecture-1-560
  start: 560.5
  end: 571.3
  text: Были ли вы обмануты? Я бы никогда не поверил обману, если бы в банане не было чёрных точек. Если вы хотите обмануть кого-то, перемешайте обман вместе с правдой.
  rating: green
  verdict: 'Верно и хорошо сказано: самый убедительный обман опирается на кусочек правды. Это правило стоит помнить, слушая любую лекцию.'

- id: lecture-1-572
  start: 572.4
  end: 589.0
  text: Таким образом уничтожают крыс. Вы не даёте крысе яд. Вы даёте крысе тарелку хорошей пищи. Яд крысы состоит из 99% хорошей пищи. Очень мало яда. И крыса думает, что она ест хорошую еду, но она ест перемешанный яд.
  rating: neutral
  verdict: 'Образ подготовлен для будущего вывода: «учебники — как крысиный яд». Сам по себе пример про отраву верен.'

- id: lecture-1-589
  start: 589.6
  end: 623.6
  text: Это хороший метод. Его используют для продажи, эм… для продажи сигарет «Мальборо». Их перемешивают с ковбоями. Вы когда-нибудь думали над этим? Что общего между «Мальборо» и ковбоями? Все ли ковбои курят «Мальборо»? Нет. Нужно курить «Мальборо», чтобы быть ковбоем? Нет. Если вы начнёте курить «Мальборо», вы станете ковбоем автоматически? Нет. От вас может пахнуть как от лошади, но вы не будете ковбоем. Но они хотят, чтобы люди поверили, что между ними есть что-то общее.
  rating: green
  verdict: 'Верное наблюдение о рекламе: она связывает товар с тем, что нам нравится, хотя связи на деле нет.'

- id: lecture-1-627
  start: 627.0
  end: 688.4
  text: 'Поэтому, как Гитлер сказал, если говорить ложь достаточно долго и достаточно часто, народ поверит лжи. То же самое происходит и с пивом. Никто, имея даже половину мозгов, не купил бы пива. Поэтому пиво перемешивается со спортом. Пиво часто рекламирует какой-то известный футболист. Они хотят, чтобы дети поверили, что алкоголь и спорт связаны между собой. Один подросток спросил меня: «В чём дело, мистер Ховинд? Вам не нравится пиво?» Я сказал:«Я не знаю, я никогда не пробовал». Мне 46 лет, и я никогда не попробовал ни капли за всю мою жизнь. Тогда меня спрашивают: «А откуда вы знаете, что вам это не понравится, если вы не попробуете?» Очень умно. Позвольте мне задать вам вопрос. Вы когда-нибудь подставляли голову под грузовик? А как вы знаете, что вам не понравится, если вы не попробуете? Поэтому не нужно всё пробовать, чтобы узнать, хорошо это или плохо. А-а, есть другие пути. Не нужно всё пробовать.'
  rating: neutral
  verdict: Ещё один пример про рекламу, личная история и шутка; на доводы о науке не влияют. Цитата снова приписана Гитлеру неточно — см. разбор на 7:16.
  rhetoric:
  - unverified-quote

- id: lecture-1-689
  start: 689.5
  end: 723.4
  text: В учебниках государственных школ находится много хорошей науки. Но вместе с хорошей наукой замешан обман. Яд, который уничтожает детей. Я не против науки, я не против школ. Мой брат преподаёт в государственной школе уже 28 лет. Моя мать вышла на пенсию, она была учительницей. В системе много хороших учителей. Это не проблема. В учебниках много хороших фактов. Это тоже не проблема. Проблема — это замешанный обман. В учебниках замешан яд, и нам необходимо предупредить учеников.
  rating: orange
  verdict: Что в учебниках много хорошей науки, верно. Но слово «яд» звучит раньше, чем показано, в чём именно обман. Слушателя сначала настраивают бояться, а доводы обещают потом.
  arguments:
  - textbooks-poison
  rhetoric:
  - loaded-language
  - false-analogy

- id: lecture-1-724
  start: 724.4
  end: 751.5
  text: Например, вот учебник первого класса. Первый класс. Посмотрите, что здесь написано. Земля очень изменилась после формирования 4,5 млрд лет назад. Подождите секунду. Разве Земле 4,5 млрд лет? Нет. Но если вы скажете это первокласснику, он вам поверит. Первоклассники верят всему, что им говорят. Они верят, что бананы состоят из ножек паука. Я поверил.
  rating: red
  verdict: 'Что первоклассники доверчивы, верно. Но возраст Земли около 4,5 млрд лет измеряют по камням: в них одно вещество с постоянной скоростью превращается в другое, как пересыпается песок в часах. Ховинд же отвергает это без довода, поставив рядом с шуткой про банан.'
  arguments:
  - earth-age-billions
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-752
  start: 752.6
  end: 768.5
  text: Во втором классе говорят то же самое. Вот учебник второго класса. После формирования четырёх с половиной миллиардов лет назад Земля изменилась. Жизнь начала развиваться на Земле. Слово «развиваться» — очень интересное слово. У него два значения. Этим они и путают детей.
  rating: orange
  verdict: Слово «развиваться» действительно многозначно. Но учебник употребляет его в одном ясном смысле — «изменяться со временем», и обвинение в намеренной путанице ничем не подкреплено.
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-770
  start: 770.0
  end: 786.4
  text: Детям предоставляется множество доказательств микроэволюции, что является наукой и фактом. И стараются, чтобы они поверили в макроэволюцию. Глупую религию. Мы поговорим об этом на лекции четвёртой. О громадной разнице между макро- и микроэволюцией.
  rating: red
  verdict: Что микроэволюция — наблюдаемый факт, Ховинд признаёт верно. Но макроэволюция — те же процессы на больших сроках, а не «глупая религия»; подробно он обещает разобрать это в лекции 4.
  arguments:
  - microevolution-macro
  rhetoric:
  - loaded-language

- id: lecture-1-787
  start: 787.8
  end: 814.1
  text: 'Но детей учат, что жизнь появилась на Земле, что Земле миллиарды лет. В учительском руководстве говорится: «Подчеркните, что Земле миллиарды лет». Чтобы дети поверили в это. На Земле нет миллиардов лет, в чём мы скоро убедимся. Но если ученикам говорить это в первом, втором, третьем, пятом классе на протяжении 15—20 лет, они поверят в это.'
  rating: red
  verdict: 'Учебники повторяют возраст Земли не ради внушения: его много раз измерили разными способами (см. «песочные часы» на 12:04). «Мы скоро убедимся» — обещание, а не довод; сами доводы Ховинда (Луна, лунная пыль, магнитное поле) разобраны дальше в этой лекции, с 1:02:14.'
  arguments:
  - earth-age-billions
  rhetoric:
  - textbook-authority

- id: lecture-1-814
  start: 814.7
  end: 844.2
  text: Но вместо этого нам необходимо преподавать настоящую науку, как первый закон термодинамики. Материю, и-и-и, или энергию невозможно ни создать, ни уничтожить. Но всё состоит из материи. Если материю невозможно ни создать, ни уничтожить, то как появился мир? Мы здесь. Остаётся только два выбора. Кто-то сотворил мир. Или мир произошёл сам по себе. Другого выбора нет.
  rating: red
  verdict: 'Что мир не возник сам собой из ничего, мы, христиане, тоже верим. Но первый закон термодинамики описывает процессы внутри уже существующего мира, а выбор «Бог или само» ложен: Бог может творить и через естественные процессы.'
  arguments:
  - pervyj-zakon-termodinamiki
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-845
  start: 845.3
  end: 860.5
  text: Хотя есть лунатики, которые говорят, что мы вообще не здесь. Мы только думаем, что мы здесь. А-а, ну мы забудем о них. Потому что мы здесь. Поэтому кто-то создал мир. Или мир произошёл сам по себе.
  rating: neutral
  verdict: Шутка о философах-скептиках; дилемма «сотворил или само» повторена ещё раз (разбор выше).

- id: lecture-1-861
  start: 861.0
  end: 876.7
  text: Дьявол не хочет, чтобы вы поверили, что в начале сотворил Бог небо и землю. Нет, он не хочет. Поэтому дьявол придумал другую теорию появления мира. Он думал, думал, и в конце концов он придумал теорию Большого взрыва. Вы слышали об этой теории?
  rating: purple
  verdict: Мы тоже верим, что вначале Бог сотворил небо и землю. Но модель Большого взрыва предложил католический священник Жорж Леметр, и многие христиане видят в ней согласие с Бытием 1:1, а не выдумку дьявола.
  arguments:
  - big-bang
  rhetoric:
  - loaded-language

- id: lecture-1-877
  start: 877.7
  end: 972.8
  text: 'Несколько лет назад я летел на самолёте из Далласа в Сан-Франциско. Случилось так, что я сидел рядом с профессором из университета Беркли. Я не знаю, или вы слышали об этом университете, но университет Беркли — не библейский университет. Я сидел возле профессора, и через некоторое время мы начали разговаривать о сотворении и эволюции. Мне кажется, что каждый хочет говорить на эту тему, поэтому я и говорю. Профессор сказал, что он верит в эволюцию. Я сказал, что я уже догадался, так как он преподаёт в университете Беркли. Я спросил его: Если вы верите в эволюцию, расскажите мне, как появился мир? Он ответил: в результате Большого взрыва. Я сказал: «Хм, расскажите мне об этом». Он спросил: «Вы преподаёте науку и никогда не слышали о Большом взрыве?» Я сказал: «Нет, я слышал многое о Большом взрыве, и я верю в Большой взрыв». Но мой Большой взрыв отличается от вашего. Вы мне расскажите о вашем взрыве, и я вам расскажу о моём взрыве. Профессор ответил мне, дав стандартный ответ из учебника. Он сказал: «Я верю, что около 20 млрд лет назад вся материя Вселенной…» Вся материя. Кстати, я узнал, что слово «вселенная» происходит от латинских слов «uni» и «verse», что значит «одно произнесённое предложение». Интересно. Мы живём в одном произнесённом предложении. Бог сказал. И вот мы здесь.'
  rating: neutral
  verdict: 'Начало рассказа о разговоре с профессором в самолёте; что Ховинд вкладывает в уста профессора, разбираем ниже. «20 млрд лет» — устаревшая оценка: сейчас возраст Вселенной считают около 13,8 млрд лет. Латинское universum значит «всё вместе», а не «одно произнесённое предложение»; это благочестивая игра слов, на довод она не влияет.'
  rhetoric:
  - personal-story

- id: lecture-1-974
  start: 974.5
  end: 1000.9
  text: Профессор сказал, что вся материя Вселенной сконцентрировалась в очень напряжённом регионе, который мог быть намного меньше точки на этой странице. Всё вещество Вселенной вместилось в точку? Меньше точки на этой странице. Это наполненная точка. И тяжёлая тоже? Кто мог её удержать?
  rating: red
  verdict: 'Что ранняя Вселенная была невероятно плотной, верно. Но это не бомба, взорвавшаяся в пустой комнате, а скорее тесто с изюмом, которое поднимается: изюминки расходятся, потому что растёт само тесто. Комнаты снаружи нет, и держать точку негде.'
  arguments:
  - big-bang
  rhetoric:
  - argument-by-incredulity

- id: lecture-1-1001
  start: 1001.5
  end: 1027.3
  text: И это происходит не первый или последний раз. В этом учебнике говорится, что однажды всё вещество и энергия снова сконцентрируется в регион не больше, чем точка на конце этого предложения. И снова произойдёт Большой взрыв. Это происходит каждые 80–100 млрд лет. Вы знаете, теперь нам не нужно беспокоиться о глобальном потеплении. Нам нужно беспокоиться о глобальном уменьшении.
  rating: orange
  verdict: Догадка о Вселенной, которая то расширяется, то сжимается, действительно встречалась в учебниках, но как одно из непроверенных предположений, а не основа теории; сегодня наблюдения говорят скорее о вечном расширении. Шутка про «глобальное уменьшение» ничего не опровергает.
  arguments:
  - big-bang
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-1031
  start: 1031.6
  end: 1066.1
  text: 'Посмотрите, о чём пишет автор этого учебника. Он говорит: «Студенты, ничего значит ничего». Достаточно ума, чтобы писать учебники. Он говорит, что исчезнут не только материя и энергия, но пространство и время. Однако физики предполагают, что из этого положения Вселенная появилась от гигантского взрыва. Что? Ничего взорвалось, и вот мы здесь. Объясните мне это.'
  rating: red
  verdict: Учебник говорит, что у пространства и времени было начало, а не что «ничто взорвалось». Мысль о начале мира, кстати, близка христианской вере в творение.
  arguments:
  - big-bang
  rhetoric:
  - straw-man

- id: lecture-1-1067
  start: 1067.6
  end: 1103.1
  text: 'Но об этом пишут даже в научных журналах. Я этого не придумал. В журнале «Научная Америка» пишется: «Наблюдаемая Вселенная могла развиться из бесконечно малого места». На греческом, значит точка. Это соблазняет продвижению ещё одного шага вперёд и предположению, что вся Вселенная произошла из практически ничего. Да, мы произошли из точки. Точка произошла из ничего. Они называют это наукой и пишут в учебниках. Я называю это сказкой и выкидываю в мусор.'
  rating: red
  verdict: Журнал осторожно пишет о догадке, которую «соблазнительно» сделать. Ховинд превращает догадку в утверждение «точка из ничего» и отбрасывает вместе с ней всю науку о Вселенной.
  arguments:
  - big-bang
  rhetoric:
  - quote-mining

- id: lecture-1-1104
  start: 1104.4
  end: 1124.4
  text: 'Я спросил профессора. Что же случилось с этой точкой? Он сказал: «Около 20 млрд лет назад вся материя собралась вместе в маленькую точку». Точка вращалась быстрее и быстрее. И вскоре произошёл Большой взрыв. Разлетевшиеся кусочки образовали галактики, солнце, звёзды, людей. Вот мы здесь.'
  rating: red
  verdict: Так слова профессора пересказывает Ховинд, но модели «вращающейся точки, которая взорвалась и разбросала осколки», в науке о Вселенной нет. Большой взрыв — не взрыв предмета, а расширение самого пространства, как поднимается тесто с изюмом (см. 16:14). Этот пересказ нужен Ховинду для довода о вращении.
  arguments:
  - big-bang
  rhetoric:
  - straw-man

- id: lecture-1-1125
  start: 1125.7
  end: 1151.8
  text: 'Я сказал: «Сэр, можно задать несколько вопросов?» Он сказал: «Конечно». Я сказал: «Сэр, вы сказали, что 20 млрд лет назад вся материя Вселенной собралась для Большого взрыва». Скажите, пожалуйста, мне, откуда появилась материя? Кто сотворил вещество? Кто сотворил всю Вселенную? Он сказал: «Мы точно не знаем».'
  rating: orange
  verdict: 'Учёный честно ответил «не знаем»: откуда взялась материя, наука не говорит. Но врач может не знать, отчего началась болезнь, и всё же верно её описать: так и разлёт галактик видят и проверяют, не зная, что было до начала. А верующий видит здесь место для Творца.'
  arguments:
  - big-bang
  rhetoric:
  - personal-story

- id: lecture-1-1153
  start: 1153.1
  end: 1185.1
  text: 'Тогда я сказал: хорошо, подождите минутку. А если я скажу вам, что я верю, что около 6 000 лет назад Бог сотворил небо и землю, вы сразу спросите: откуда появился Бог? Я не знаю. Ну, вы говорите, что 20 млрд лет назад был Большой взрыв, но вы не знаете, откуда появилась материя? Значит, я верю, что в начале Бог… А вы верите, что в начале грязь? И не говорите мне, что моя теория религиозная, а ваша научная. Нет-нет. Это две религии.'
  rating: red
  verdict: 'Что и у верующего, и у учёного есть вопросы без ответа, верно. Но научную модель проверяют наблюдениями, поэтому она не «религия»; а выбор «Бог или грязь» ложен: многие христиане, например генетик Фрэнсис Коллинз, верят и в Творца, и в научную картину мира.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij
  - lozhnaya-dilemma

- id: lecture-1-1185
  start: 1185.6
  end: 1212.3
  text: Эти две шкалы времени представляют То, чему учит Библия? Библейское и гуманистическое мировоззрение истории. И у них разные масштабы. Библия учит, что Бог сотворил небо и землю 6 000 лет назад. Эволюция учит, что 20 млрд лет назад был Большой взрыв. Два взгляда религиозные. Единственная разница — эволюция поддерживается налогами.
  rating: red
  verdict: 'Библия не называет возраст мира: 6000 лет — вывод из сложения родословий. А эволюция — теория о живых существах, а не о Большом взрыве; смешав их, Ховинд получает «два религиозных взгляда» вместо науки и толкования.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-1215
  start: 1215.0
  end: 1252.8
  text: Кстати, Если эволюция не Эволюция не смогла бы выжить без налогов. Тысячи людей собираются в церкви. Но никогда невозможно собрать тысячу гуманистов на их собственные расходы. Поставьте в газету объявление. «Завтра вечером собрание атеистов». Увидите, что придёт только четыре человека. Им нужны наши налоги для распространения их религии. Они хотят, чтобы вы платили за свою и за их религии. И поэтому они выбрали школы для распространения эволюции, за которую мы платим налогами. Эволюция — это не больше, чем религия.
  rating: red
  verdict: Сколько людей придёт на собрание атеистов, ничего не говорит о том, верна ли биология. Эволюцию преподают потому, что её принимают учёные, в том числе верующие, а не потому, что это «религия атеистов».
  arguments:
  - evolution-religion
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-1253
  start: 1253.7
  end: 1278.9
  text: 'Если кто-то говорит, что эволюция — не религия, это часть науки, то около 10 лет я предлагаю $250 000 любому человеку с любым научным доказательством эволюции. Я не предлагаю эти деньги просто так. Чтобы поспорить. Я не хочу спорить, я как квакер, некогда сказавший: «Сэр, я не хочу повредить вам, но вы стоите, куда я буду стрелять».'
  rating: orange
  verdict: Приз действительно объявлялся. Но по его условиям доказать нужно не эволюцию живого, а что весь мир возник без Бога. Это как наградить того, кто докажет, что машину собрали на конвейере, и заодно — что завод появился сам. Победителя нет, а конвейер не исчез.
  arguments:
  - evolution-prize

- id: lecture-1-1282
  start: 1282.0
  end: 1296.8
  text: Мне надоело, что они используют мои налоги для распространения их религий. Им нужно учить эволюцию в своих платных школах. Э-э, но они всё же учат наших детей, что Земле миллиарды лет. И это всего лишь пропаганда.
  rating: red
  verdict: Назвать измеренный возраст Земли «пропагандой» — не довод. Около 4,5 млрд лет показывают разные «песочные часы» в камнях (см. 12:04), и их ответы сходятся.
  arguments:
  - earth-age-billions
  rhetoric:
  - loaded-language

- id: lecture-1-1297
  start: 1297.5
  end: 1338.0
  text: Эти две шкалы разного масштаба. На верхней шкале 1 см равняется 75 лет. 75 лет — это очень длинный промежуток времени. Только 5 см назад Колумб ещё не открыл Америку. Если бы я захотел сделать нижнюю шкалу такого же масштаба, как и верхняя, то эта шкала была бы 3 360 километров длины. А-а, я не хотел носить с собой такую длинную шкалу. Поэтому я придумал новый масштаб. Это как от Пенсаколы до Портленда. Поэтому эти две шкалы разного масштаба.
  rating: neutral
  verdict: 'Пояснение к слайду: почему две шкалы времени нарисованы в разном масштабе. На довод не влияет.'
  rhetoric:
  - scale-trick

- id: lecture-1-1339
  start: 1339.0
  end: 1366.0
  text: 'Когда профессор сказал, что он не знал, откуда появилась материя, Я сказал: Откуда появились законы? Вселенная существует по законам. Гравитация, центробежная сила, инерция. Откуда законы? Он сказал: А мы тоже не знаем. Я сказал: откуда появилась энергия? Чтобы что-то двинуть, необходима энергия, откуда появилась энергия для Большого взрыва? Он сказал: И я этого тоже не знаю.'
  rating: orange
  verdict: 'Вопрос «откуда законы природы» законный, и мы, христиане, отвечаем на него: от Творца. Но то, что физика не объясняет происхождения своих законов, не делает неверной саму модель расширения Вселенной.'
  arguments:
  - big-bang
  rhetoric:
  - personal-story

- id: lecture-1-1367
  start: 1367.0
  end: 1478.3
  text: 'Я сказал: «Сэр, можно задать ещё один вопрос?» Он ответил: «Конечно, что ещё вы хотите узнать?» Я подумал: ещё? Что вы имеете в виду? Вы мне ещё ничего не сказали? Но я спросил: «Сэр, у вас в университете есть карусель?» Вы знаете, что такое карусель? Это такая качеля. Он ответил: «Нет, в нашем университете нет карусели». Я сказал: «Это плохо. С помощью карусели можно выучить хорошую науку». Если посадить шесть четвероклассников на карусель. И здесь есть четвероклассники. Мне нравятся четвероклассники. Я провёл пять лучших лет моей жизни в четвёртом классе. Мы посадим четвероклассников на карусель и начнём крутить карусель по часовой стрелке. Как можно быстрее. Если у вас электронные часы, вы не будете знать, что такое часовая стрелка. А Подойдите ко мне позже. В этом опыте дети пройдут по четырём этапам. На первом этапе дети будут кричать: «Давайте быстрее, быстрее!» На скорости 30 км/ч. Э-э, начнётся этап второй. Дети перестают кричать и молча концентрируются на сохранении своей жизни. На скорости 60 км/ч дети переходят на этап третий. Они снова начинают кричать. Но теперь они кричат:«Остановитесь, остановитесь!» Но вы не останавливайтесь. Продолжайте крутить. Быстрее и быстрее. Где-то около 100 км/ч мы перейдём на этап четвёртый. На этом этапе дети начинают вылетать из карусели. Когда это произойдёт, вы заметите интересное явление. Если карусель крутилась по часовой стрелке, то когда ребёнок вылетает, он будет крутиться по часовой стрелке, пока он не врежется в столб или в дерево.'
  rating: neutral
  verdict: Шутки и рассказ об опыте с каруселью — подводка к следующему доводу о вращении.

- id: lecture-1-1479
  start: 1479.8
  end: 1502.0
  text: 'Это закон сохранения угловой инерции. Если крутящийся объект разлетается на части в пустой среде, как Большой взрыв, всё вещество в одном месте, то все его части будут продолжать крутиться в том же направлении, потому что внешние части двигаются быстрее внутренних. Профессор сказал: «Да, я знаю этот закон».'
  rating: red
  verdict: 'Закон сохранения вращения (момента импульса) верен. Но осколки тарелки, которая разбилась, не крутясь, всё равно кувыркаются кто куда: их вращения в сумме гасят друг друга. А Большой взрыв — не взрыв раскрученной карусели, а расширение пространства.'
  arguments:
  - big-bang
  rhetoric:
  - straw-man

- id: lecture-1-1503
  start: 1503.8
  end: 1546.8
  text: 'Я сказал ему: Хорошо, ответьте мне на вопрос. «Если Вселенная появилась в результате взрыва крутящейся точки, не должно ли всё крутиться в одном направлении?» Он сказал: «Да». Я сказал: «Но это не так». Есть две планеты, может быть, три. Но две планеты двигаются в обратном направлении. Почему? Он сказал: «Это интересно». Я ответил: «Нет». Это больше, чем интересно. Это противоречит вашей теории Большого взрыва. И не только это: шесть лун крутятся в обратном направлении в Солнечной системе. Почему? Он сказал: «Я не знаю». Как вы думаете?'
  rating: red
  verdict: Что Венера и Уран вращаются «не так», а некоторые спутники движутся обратно, верно. Но планеты сложились через миллиарды лет после начала Вселенной, и их сбивали удары и приливы, как бильярдный шар после удара; Тритона Нептун, видимо, поймал со стороны. К Большому взрыву это не относится.
  arguments:
  - big-bang
  rhetoric:
  - straw-man

- id: lecture-1-1548
  start: 1548.3
  end: 1565.7
  text: 'Я надеялся, что он задаст этот вопрос. Я ответил: Я верю, что всё очень просто. Я верю, что в начале Бог сотворил небо и землю. И он сделал это для того, чтобы теория Большого взрыва оказалась глупой. И это глупая теория. Это не наука.'
  rating: red
  verdict: Мы тоже верим, что вначале Бог сотворил небо и землю. Но вера в Творца не противоречит модели Большого взрыва, и назвать теорию «глупой» и «не наукой» — не значит опровергнуть её.
  arguments:
  - big-bang
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-1567
  start: 1567.0
  end: 1594.2
  text: 'Я верю в Большой взрыв. Библия учит о Большом взрыве во Втором Петре, 3:10. «Небеса с шумом прейдут». На греческом языке это значит большой взрыв. Но этот взрыв ещё не произошёл. Поэтому, дети, если вас в школе учитель спросит: «Верите ли вы в Большой взрыв?» — скажите: «Да, я верю, и вам нужно спастись и приготовиться к нему». Большой взрыв произойдёт очень скоро.'
  rating: purple
  verdict: Мы тоже ждём второго пришествия Христа. Но греческое слово в 2 Пет 3:10 значит «с шумом», «с треском», а не «большой взрыв»; к космологии этот стих не относится, это игра слов.
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-1595
  start: 1595.8
  end: 1633.4
  text: 'Во втором законе термодинамики говорится, что всё склоняется к беспорядку. Всё распадается. Ничего не улучшается само по себе. Без присмотра всё ржавеет, умирает, падает. Ничего не улучшается само по себе. Библия учит этому в Евреям, первой главе: «Небеса — дело рук Твоих; они погибнут… и все обветшают, как риза». Ничего не улучшается само собой. Без прибавления энергии. Посмотрите на свою причёску, когда вы проснётесь утром, вы сразу поймёте, о чём я говорю. Всё склоняется к хаосу.'
  rating: red
  verdict: Что без притока энергии всё приходит в беспорядок, верно, и Ховинд сам делает эту оговорку. Но Земля постоянно получает энергию Солнца, поэтому снежинки, кристаллы и живые существа растут и усложняются без нарушения закона.
  arguments:
  - second-law
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-1634
  start: 1634.5
  end: 1671.4
  text: Но в учебниках говорится, что мы становимся лучше. Люди, вероятно, произошли от бактерии, жившей свыше четырёх миллиардов лет назад. Тогда был ли ваш прапрапрапрадедушка бактерией? Э-э, я этого не писал, но посмотрите, что говорится под рисунком морской звезды вот в этом учебнике. «Около трёх с половиной миллиардов лет назад так выглядели остатки древних предков современных людей». Был ваш прадедушка морской звездой?
  rating: orange
  verdict: Учебник говорит об общем происхождении живых существ, а не о том, что «мы становимся лучше». На слайде видно, что фраза перечисляет окаменелости от одноклеточных возрастом 3,4 млрд лет до ранних предков человека; морская звезда «прадедушкой» там не названа.
  arguments:
  - second-law
  rhetoric:
  - straw-man

- id: lecture-1-1674
  start: 1674.2
  end: 1708.6
  text: 'Пожалуйста, не смейтесь со следующей картинки. Это будет фотография моего брата. Когда он просыпается утром. После первой чашки кофе Кстати, нужно предупредить детей: «Не пейте кофе в детстве». Было доказано, что если вы пьёте кофе, то после свадьбы ваши дети будут рождаться голыми. Кто из вас ещё не знал об этом? Видите? Эм.'
  rating: neutral
  verdict: Шутки перед следующей картинкой из учебника; на довод не влияют.

- id: lecture-1-1708
  start: 1708.8
  end: 1733.7
  text: Это будет фотография моего брата. Не смейтесь, вот здесь. Я этого не писал. Это находится в учебнике. Посмотрите, что здесь написано. 30 млн лет назад Ребята, каждый раз, когда вы видите, что в учебнике написана фраза «миллионы лет назад», это значит, что очень давно и очень далеко.
  rating: orange
  verdict: «Миллионы лет назад» в учебнике — не сказочное «давным-давно», а число, которое посчитали по камням, с указанной ошибкой «плюс-минус».
  arguments:
  - earth-age-billions
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-1734
  start: 1734.7
  end: 1745.5
  text: Это значит, э-э, жва развились. Опять это слово «развились». Детям предоставляют доказательства микроэволюции. И хотят, чтобы они поверили в макроэволюцию.
  rating: red
  verdict: 'Границы «микро — можно, макро — нельзя» биология не проводит. Так и язык: за год перемен не заметишь, а за полторы тысячи лет из латыни вышли итальянский и французский. Следы больших переходов есть в ископаемых, например рыба тиктаалик с крепкими костями в плавниках.'
  arguments:
  - microevolution-macro

- id: lecture-1-1746
  start: 1746.9
  end: 1764.4
  text: Здесь говорится, что эти существа являются предками людей и современных обезьян. Предки людей? Дедушка? У вас большие глаза, дедушка? Хм, чтобы лучше видеть тебя.
  rating: orange
  verdict: Общий предок людей и обезьян — не «дедушка-обезьяна», а вид, от которого пошли обе ветви. Сказка про Красную Шапочку смешит, но вопроса не решает.
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-1767
  start: 1767.5
  end: 1800.2
  text: 'Мы учим детей, что они животные. Поэтому многие из них сегодня и поступают как животные. И бедный социолог не может догадаться. Даже Барбара Рейнольдс, либеральная журналистка, сказала: «Дети обезьянничают в школе?» Их учат эволюции. Их учат, что они животные. Ты зверь и разделяешь общую наследственность с моллюсками. Эй, Джон. Угадай что? Ты животное? Да. Хорошо.'
  rating: red
  verdict: Что поведение детей в школах тревожит, верно. Но биология, называя человека частью живого мира, не учит «вести себя как животное»; и Писание говорит, что человек создан из праха земного, оставаясь образом Божьим.
  arguments:
  - evolution-morality
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-1805
  start: 1805.3
  end: 1821.4
  text: А чего же вы ожидали? Что мы сеем, то мы и пожнём. Раньше детей учили, что Бог был создателем. Какой Бог и какая религия не было частью вопроса, но фактом было, что Бог создал нас и мы несли перед Ним ответ.
  rating: orange
  verdict: Что раньше в американских школах говорили о Боге-Творце, верно. Но связь «учат эволюции — вот и пожинаем» Ховинд не доказывает, а только утверждает.
  arguments:
  - evolution-morality

- id: lecture-1-1822
  start: 1822.0
  end: 1849.0
  text: И 40 лет назад преступлением в школе было бросание карандашами и жвачками. Надписи на партах. Сколько из вас помнят то время? Сегодня дети приносят в школу оружие. И убивают десять других детей. Я сидел напротив двух детей, которые убили одноклассника в Арканзасе. Я посетил их в тюрьме. Почему они это сделали? В нашем обществе появилась проблема, и я думаю, я знаю почему.
  rating: orange
  verdict: 'Рост насилия в школах — настоящая беда. Но совпадение во времени не доказывает, что причина в уроках биологии: у таких явлений много причин, и Ховинд их не разбирает.'
  arguments:
  - evolution-morality
  rhetoric:
  - post-hoc

- id: lecture-1-1849
  start: 1849.7
  end: 1861.8
  text: Многие учителя не знают, что даже сегодня вы можете преподавать науку о сотворении в государственных школах. Я часто читаю лекции в школах. Около ста в год. В государственных школах можно преподавать Библию.
  rating: orange
  verdict: Что Библию можно изучать в государственных школах как литературу и историю, верно. Но закон, обязывавший преподавать «научный креационизм» наравне с эволюцией, Верховный суд США в 1987 году признал неконституционным; Ховинд смешивает эти две вещи.
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-1862
  start: 1862.8
  end: 1890.5
  text: В шестьдесят третьем году Верховный Суд сказал, что можно сказать, что Библия достойна изучения её литературных и исторических качеств. Ничего из сказанного здесь не указывает, что такое изучение Библии или религии, когда представлена объективно как часть светского образования, может противоречить первой поправке. В государственной школе можно преподавать Библию. Вы не можете заставлять детей стать баптистом, буддистом или католиком, но можно учить Библии.
  rating: green
  verdict: 'Верно: в решении 1963 года суд прямо сказал, что объективное изучение Библии как части светского образования допустимо.'

- id: lecture-1-1891
  start: 1891.0
  end: 1912.6
  text: В восьмидесятом году Верховный Суд постановил, что Библия может конституционно использоваться в соответствующем изучении истории, цивилизации, этики, для сравнения религии или подобного. Библию можно использовать. Суд сказал, что можно использовать Библию, если она содействует повышению знаний студентов и пониманию их культуры.
  rating: green
  verdict: 'Верно: и решение 1980 года допускает использование Библии при изучении истории, культуры и этики.'

- id: lecture-1-1914
  start: 1914.4
  end: 1940.2
  text: Даже существует группа людей, которые помогают образованию библейских классов в государственных школах. Позвоните в Национальный совет по телефону. 336 272 3799 И попросите их выслать информацию, как начать урок Библии в государственной школе. Пресвитер, вы можете быть учителем. Хоть раз в неделю. Это возможно?
  rating: neutral
  verdict: Объявление о группе, которая помогает открывать библейские курсы в школах; на доводы не влияет.

- id: lecture-1-1940
  start: 1940.9
  end: 1950.6
  text: ACLU хочет, чтобы учителя поверили, что они не могут учить о сотворении в государственных школах. Но это ложь. ACLU — это Американский союз гражданских свобод.
  rating: orange
  verdict: Что о Библии и вере в Творца можно рассказывать на уроках истории и литературы, верно. Но преподавать «научный креационизм» наравне с эволюцией на биологии Верховный суд США в 1987 году запретил, так что учителя опасаются не зря.
  arguments:
  - public-schools-indoctrination

- id: lecture-1-1952
  start: 1952.0
  end: 1966.9
  text: Намерением основателя было продвижение коммунизма. Это является целью ACLU, целью этой организации. Целью является продвижение коммунизма по всему миру.
  rating: orange
  verdict: Основатель ACLU Роджер Болдуин в молодости действительно симпатизировал коммунизму, но позже от этого отказался. Кто основал организацию, не решает, что разрешает закон; спорить нужно о сути правового вопроса.
  rhetoric:
  - ad-hominem-pivot
  - conspiracy

- id: lecture-1-1967
  start: 1967.6
  end: 1981.2
  text: Ну, вы можете учить Библии. Но если учитель учит эволюции, если завтра учитель скажет детям, что мы начали с бактерии и медленно превратились в человека, не нужно быть учёным, чтобы догадаться, что это разрушит чью-то веру в Библию.
  rating: purple
  verdict: Что для многих детей урок об эволюции становится испытанием веры, верно. Но разрушает её не биология, а убеждение, что Библия и наука несовместимы; многие христиане принимают эволюцию и верят во Христа, как генетик Фрэнсис Коллинз, руководивший проектом «Геном человека».
  arguments:
  - evolution-destroys-faith
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-1982
  start: 1982.7
  end: 2019.0
  text: 'И каждый учитель, разрушающий веру детей в Библию, должен знать, что Иисус сказал об этом. В Иакова 3:1 написано: «Братья мои! Не многие делайтесь учителями, зная, что мы подвергнемся большему осуждению». Если учителя учат неправде, Им придётся плохо на суде Божьем. Иисус сказал: «А кто соблазнит одного из малых сих, верующих в Меня, тому лучше было бы, если бы повесили ему мельничный жернов на шею и потопили его в глубине морской». Любому, кто учит эволюции, будет очень плохо пред лицем Бога. Они будут строго осуждены.'
  rating: purple
  verdict: Предостережение учителям из Иак 3:1 серьёзно, и мы его разделяем. Но это слова апостола Иакова, а не Иисуса (слова о жёрнове — действительно Иисуса, Мф 18:6), и грозить судом всем, кто преподаёт биологию, значит заранее считать эволюцию ложным учением.
  arguments:
  - evolution-destroys-faith
  rhetoric:
  - loaded-language

- id: lecture-1-2019
  start: 2019.6
  end: 2049.1
  text: Но так было не всегда. В пятидесятых годах в среднем учебнике в Америке было только две или три тысячи слов о эволюции. Я коллекционирую учебники. У меня есть несколько сотен, самый старый, кажется, 1900 пятого года. У меня есть учебники разных лет и даже разных стран. До 63-го года в учебниках писалось очень мало о эволюции. В шестьдесят третьем году количество слов повысилось до 33 000.
  rating: green
  verdict: 'Верно: в начале 1960-х, после запуска советского спутника, в США выпустили новые учебники биологии, и об эволюции в них стали писать гораздо больше.'

- id: lecture-1-2050
  start: 2050.2
  end: 2067.1
  text: Есть несколько причин или предположений, почему это произошло в то время. В шестьдесят третьем году в американской школьной системе перестали молиться и преподавать Библию. Кто-то помнит это время? Мадлин О’Хэр. А кстати, её сын сейчас стал проповедником.
  rating: orange
  verdict: В 1962–1963 годах Верховный суд запретил школе проводить молитву и чтение Библии как обряд, даже добровольный. Но молиться самим ученикам и изучать Библию как литературу, как Ховинд сам только что цитировал, можно.
  rhetoric:
  - post-hoc

- id: lecture-1-2068
  start: 2068.8
  end: 2093.8
  text: Но в 1963 году начали возрастать сексуально полученные заболевания. Это для подростков десяти-четырнадцати лет. В шестьдесят третьем году начало увеличиваться число разводов. Кстати, добрачный секс и разводы идут вместе. Если вы не доверяете до свадьбы, вы не будете доверять и после свадьбы. В шестьдесят третьем году повысился насильственный криминал. На 1 000%.
  rating: orange
  verdict: 'Насилие в США действительно выросло: по данным ФБР, к 1991 году примерно в 4,5 раза на душу населения, а не «на 1000%». Но то, что одно случилось после другого, не доказывает причины: в 1960-е в США изменилось очень многое сразу.'
  arguments:
  - evolution-morality
  rhetoric:
  - post-hoc

- id: lecture-1-2096
  start: 2096.1
  end: 2115.9
  text: Я уже не такой старый, но я помню время, когда дома не закрывали на ключ. Вы помните это время? Что случилось? И никто не забирал ключи из машины? Вы могли их потерять. Ключи всегда оставляли в машине. Говорю я правду? Так раньше было?
  rating: neutral
  verdict: Воспоминание о временах, когда дома не запирали; на довод не влияет.
  rhetoric:
  - personal-story

- id: lecture-1-2116
  start: 2116.6
  end: 2137.1
  text: В шестьдесят третьем году повысилось количество рождений детей вне брака. Стопроцентное увеличение у подростков десяти-четырнадцати лет. Беременность увеличилась на 553%. Остальным делают аборты. Убивают. Аборт — это убийство. Мы говорим об этом на кассете номер четыре, о научных причинах.
  rating: orange
  verdict: Рост подростковых беременностей — беда, а аборт — серьёзный нравственный вопрос. Но связь этих бед именно с уроками об эволюции снова только подразумевается, а не доказывается.
  arguments:
  - evolution-morality
  rhetoric:
  - post-hoc

- id: lecture-1-2137
  start: 2137.7
  end: 2152.2
  text: После шестьдесят третьего года сильно упали результаты выпускных экзаменов. Несколько лет назад пришлось упростить этот экзамен. Оценки были такими плохими. И-и-и потом, после упрощения экзаменов дети выглядели умными, как и раньше.
  rating: orange
  verdict: Результаты выпускного теста в США действительно снижались с середины 1960-х, а в 1995 году баллы перевели на новую шкалу. Но одной из причин считают то, что тест стали сдавать не только лучшие ученики, а гораздо больше школьников; связь с отменой школьной молитвы не показана.
  rhetoric:
  - post-hoc

- id: lecture-1-2160
  start: 2160.3
  end: 2177.5
  text: После шестьдесят третьего года был замечен невероятный рост количества незамужних пар, живущих вместе в любодеянии. Но слово Бога совершенно не изменилось. «Блудников же и прелюбодеев судит Бог». Евреям тридцатая глава. Увеличилось количество самоубийств среди подростков.
  rating: orange
  verdict: Мы тоже верим, что Бог судит блуд. Но и здесь рост сожительства и подростковых самоубийств лишь поставлен рядом с 1963 годом; совпадение во времени — не доказательство причины.
  arguments:
  - evolution-morality
  rhetoric:
  - post-hoc

- id: lecture-1-2178
  start: 2178.0
  end: 2212.7
  text: 'Если я скажу вам: если вы поцелуете лягушку, она превратится в принца, вы скажете: «Нет, лягушки не превращаются в принцев». Сколько из вас здесь женщин нашли себе мужа, целуя лягушку? Хмм, только две. Видите? Очень редко. Но это происходит в учебниках. Да, мы произошли из бактерии, потом медленно превратились в лягушку. Вот здесь. Дедушка. Потом медленно превратились в принца. Они до сих пор учат сказки, что лягушка превращается в принца.'
  rating: red
  verdict: 'Учебник не говорит, что лягушка превратилась в человека: лягушки и люди — разные ветви с общим далёким предком. Сказка про принца смешна, но к биологии отношения не имеет.'
  rhetoric:
  - straw-man
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-2213
  start: 2213.8
  end: 2238.2
  text: И вместо поцелуя сегодня у них есть новое супермагическое вещество, которая называется миллионы и миллиарды лет. Видите? Если лягушка превращается в принца быстро, то это сказка. Но если лягушка превращается медленно, то это наука. Это чему учат студентов, не так ли?
  rating: red
  verdict: Миллионы лет — не «волшебное вещество», а срок, измеренный по камням. Сказку от науки отличает не скорость превращения, а то, что научные выводы проверяются ископаемыми, генетикой и наблюдениями.
  arguments:
  - earth-age-billions
  rhetoric:
  - straw-man

- id: lecture-1-2239
  start: 2239.2
  end: 2251.5
  text: Земле нет миллиардов лет. В чём мы убедимся позже. Но они говорят детям с садика, что Земле миллиарды лет. Вот учебник четвёртого класса. «Много миллионов лет назад…»
  rating: red
  verdict: «В чём мы убедимся позже» — обещание. Сами доводы Ховинда о молодой Земле (Луна, лунная пыль, магнитное поле) разобраны дальше в этой лекции, с 1:02:14, и на каждый есть ответ с источниками.
  arguments:
  - earth-age-billions

- id: lecture-1-2252
  start: 2252.5
  end: 2288.2
  text: 'Если вы ходите в школу и учитель говорит: «Много миллионов лет назад…», поднимите руку и спросите: «Учитель, а вы были там?» Они скажут: «Нет, конечно, я там не был миллионы лет назад». Тогда скажите: «Учитель, вы знаете, что Земле миллионы лет, или вы верите, что Земле миллионы лет?» Это не то, о чём вы можете знать научно. В это можно только верить. Вы не можете это наблюдать, демонстрировать, проверять — в это можно только верить.'
  rating: red
  verdict: Что прошлое нельзя увидеть своими глазами, верно. Но его изучают по следам, как следователь раскрывает дело без свидетелей; возраст Земли проверяют разными способами, например «песочными часами» в камнях (см. 12:04).
  arguments:
  - past-not-observable
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-2288
  start: 2288.7
  end: 2303.4
  text: 'Тогда скажут: «А все верят, что Земле миллиарды лет». Но это неправда. Опрос показал, что 61% американцев верят, что Земле меньше 10 000 лет и она сотворена Богом. Только 4%. Атеисты.'
  rating: orange
  verdict: 'Что многие американцы — креационисты, верно, хотя по опросам тех лет таких было меньше половины. Но число сторонников не решает научный вопрос, а принимающие эволюцию — не «4% атеистов»: среди них миллионы верующих.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-2304
  start: 2304.5
  end: 2316.2
  text: Я думаю, что эти 4% должны открыть частные школы. И учить эволюции тем, кто хочет за неё платить. И они не должны ставить свою религию в наши государственные школы.
  rating: red
  verdict: Эволюция — не религия, а научная теория о том, как развивалась жизнь; о Боге она ничего не утверждает. Поэтому её и принимают многие верующие, а в школе её учат как биологию, а не как веру.
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-2317
  start: 2317.5
  end: 2332.5
  text: Также опрос показал, что 55% природных учёных верят в эволюцию. 55%. Большинство учёных верят в эволюцию. Потому что они не были на моих лекциях. Ну, это можно исправить.
  rating: orange
  verdict: 'Цифра, видимо, из опроса 1990-х: 55% учёных принимали эволюцию без участия Бога, а ещё около 40% — эволюцию, которой руководит Бог. Вместе это подавляющее большинство; Ховинд показывает только часть.'
  rhetoric:
  - cherry-picking

- id: lecture-1-2334
  start: 2334.1
  end: 2359.0
  text: Часто говорят, что все учёные верят в эволюцию, но это просто неправда. Много-много учёных верят в сотворение, тысячи учёных. Но проблема в том, что эволюционисты сказали, что если вы не верите в эволюцию, то вы не учёный. Поэтому они говорят, что все учёные верят в эволюцию. Но они сами придумали значение слова «учёный». Вот где лежит вся проблема.
  rating: orange
  verdict: Учёные-креационисты действительно есть. Но научное согласие складывается не из того, кого «назвали учёным», а из исследований и проверок; работ, опровергающих эволюцию, в научных журналах почти нет.
  rhetoric:
  - straw-man

- id: lecture-1-2359
  start: 2359.9
  end: 2383.0
  text: Но только потому, что большинство верит во что-то, это ничего не значит. Было время, когда большинство учёных верили, что Земля была центром Вселенной. И все планеты крутились вокруг Земли. Это неправда. Было время, когда большинство учёных верили, что большие камни падают быстрее маленьких. Этому учили 2 000 лет. И это тоже неправда.
  rating: green
  verdict: 'Верно: мнение большинства — не доказательство. Правило работает в обе стороны: оно касается и опроса, на который Ховинд сослался минутой раньше.'

- id: lecture-1-2384
  start: 2384.3
  end: 2414.4
  text: Было время, когда учили, что если человек больной, у него плохая кровь. Выпусти свою кровь, и тебе будет лучше. Так умер Джордж Вашингтон. Доктора, убившие Вашингтона, не были глупыми. Они были неправы. И если ваш учитель может верить, что Земле миллионы лет, не значит, что он глупый. Он просто неправ. Незнание может быть исправлено. Но тупость навсегда. Но не незнание. Может быть, они просто не знают.
  rating: neutral
  verdict: Пример с кровопусканием и мысль, что заблуждающийся — не глупец; сказано по-доброму, к доводу не относится.

- id: lecture-1-2415
  start: 2415.2
  end: 2454.5
  text: 'Легко показать, что Земле нет миллионов лет. Например, если вы на дне найдёте сундук с золотыми монетами, я спрошу: «Когда затонул корабль?» Вы скажете: «Я не знаю». Если там есть монета 1750 года, вы должны узнать, что корабль затонул только после 1750 года. Он не мог затонуть до этого года. Кто уже догадался без посторонней помощи? Поэтому, чтобы узнать, когда затонул корабль, нужно найти не самую старую монету, а самую новую. Это и будет границей.'
  rating: green
  verdict: 'Логика с монетами верна: самая новая монета показывает, раньше какого времени корабль затонуть не мог. Ниже посмотрим, как Ховинд применяет её к возрасту Земли.'

- id: lecture-1-2457
  start: 2457.0
  end: 2486.2
  text: Тогда давайте применим эту логику к ископаемым остаткам. Если вы найдёте ископаемое… Вот это настоящая кость динозавра. Вы сразу же заметите две вещи. Во-первых, кость не разговаривает. Тогда как можно определить возраст ископаемого? Или возраст Земли? Копните землю и скажите мне, сколько ей лет?
  rating: orange
  verdict: 'Кость действительно «не говорит». Но на монете выбит год, а в камне есть свои «песочные часы»: одно вещество с известной скоростью превращается в другое. Кость датируют по слоям камня, в которых она лежит; Ховинд умалчивает, что такие способы есть.'
  arguments:
  - past-not-observable
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-2487
  start: 2487.8
  end: 2512.1
  text: Для того чтобы точно узнать возраст предмета, нужно спросить того, кто сделал предмет. В Библии говорится, что в начале Бог сотворил небо и землю, и я думаю, что Бог знает, сколько лет Земле. Он её сотворил. В Колоссянах говорится, что Иисус создал всё. Потому что Иисус — это Бог Всемогущий в теле. Иисус должен знать возраст Земли. Потому что Он её создал.
  rating: purple
  verdict: Мы тоже верим, что Бог — Творец и знает возраст мира. Вопрос в том, ставит ли Писание цель сообщить этот возраст; некоторые отцы Церкви, например Августин, читали дни творения не как хронологию.
  arguments:
  - genesis-literal

- id: lecture-1-2512
  start: 2512.5
  end: 2526.8
  text: 'Иисус сказал, Матфея 19:4: «Не читали ли вы, что Сотворивший в начале мужчину и женщину сотворил их?» Между прочим, это были Адам и Ева. Не Адам и Стёпа. В наши дни об этом нужно напоминать.'
  rating: purple
  verdict: Слова Иисуса о сотворении мужчины и женщины — о браке, и мы их принимаем. Но вывод, что человек появился в первые дни мира, из этого стиха прямо не следует.
  arguments:
  - genesis-literal

- id: lecture-1-2527
  start: 2527.6
  end: 2549.7
  text: 'Иисус сказал, что сотворение Адама и Евы было в начале. Поэтому, если это было началом, то мы сможем узнать возраст Земли, потому что Библия говорит, что смерть пришла через грех человека. Римлянам пять. Первое Коринфянам 15: «В Адаме все умирают». Поэтому ничего не умирало, пока не согрешил человек.'
  rating: purple
  verdict: Что смерть вошла в мир через грех, учит апостол Павел (Рим 5:12). Но о какой смерти он говорит — смерти человека или всякой смерти животных, — христиане понимают по-разному; это законный богословский спор.
  arguments:
  - death-before-fall

- id: lecture-1-2550
  start: 2550.3
  end: 2586.2
  text: В Библии ясно говорится, что первым человеком был Адам. И в Библии говорится, что Адам жил 130 лет и родил сына Сифа. Сиф жил 105 лет и родил Еноса. Енос жил девяносто лет и родил Каинана. В Библии указаны все даты. Если вы прибавите все даты и попытаетесь составить график, вот как этот, то, прибавив все даты, у нас получится только 6 000 лет от сотворения. Даты Писания указывают только на 6 000 лет от создания.
  rating: purple
  verdict: 'Сложение родословий Бытия действительно даёт около 6000 лет; так считал архиепископ Ашшер в XVII веке. Но родословия бывают сокращёнными: у Матфея в родословии Христа пропущены три царя, названные в 1 Пар 3:11–12 (Мф 1:8). Поэтому многие христиане не считают их полной хронологией.'
  arguments:
  - genesis-literal

- id: lecture-1-2587
  start: 2587.8
  end: 2625.4
  text: Конечно, я не отношусь к людям, которые стараются определить точное время сотворения. Я не говорю, что это произошло 6 004 года назад, 23 октября, в 2 часа дня. К такому заключению прийти невозможно. Вообще-то, я думаю, что я догадался, почему Бог сотворил Адама первым. У меня нет доказательства, но я думаю, что я догадался, почему. Я думаю, Бог сотворил Адама первым, потому что Он не хотел, чтобы Ему советовали, как это делать. Сколько со мной согласятся? Почему вы не подняли руку? Вы умный человек.
  rating: neutral
  verdict: Оговорка, что точную дату сотворения вычислить нельзя, и шутка про Адама; на доводы не влияет.

- id: lecture-1-2631
  start: 2631.6
  end: 2637.7
  text: Даты Писания прибавляются к 6 000 лет, не к миллионам или миллиардам. Кто-то неправ.
  rating: purple
  verdict: Здесь выбор «либо Библия, либо миллиарды лет». Но спорят не Библия и наука, а одно толкование и наука. Ещё блаженный Августин писал, что эти дни «трудно или даже невозможно представить», а Православная энциклопедия называет дни-эпохи самым распространённым толкованием у тех, кто сверяет Бытие с наукой.
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-2639
  start: 2639.6
  end: 2757.6
  text: 'В следующей части мы покажем, что Земле не может быть миллиардов лет. Если это так Тогда возникает вопрос о динозаврах. Мы говорим об этом на кассете номер три. Тогда возникает вопрос: как насчёт ледникового периода, геологической колонны? Поэтому мой семинар 14 часов длины. Теперь уже пятнадцать часов. Но мы говорим очень быстро, и мы попробуем ответить на многие вопросы в следующей части. Поэтому в следующей части мы поговорим о возрасте Земли. Большое спасибо. Мне очень приятно находиться в вашей церкви. Я слышал много хорошего о ней, и это очень приятно. Кто из вас был на моих семинарах или видел мои видеокассеты? Кто не был? И кто ещё не понимает вопроса? Я был преподавателем науки в школе 15 лет, и теперь в последние 10 лет я путешествую и говорю о сотворении, эволюции, динозаврах. Я сразу говорю, что я верю в Библию как в безошибочное и вдохновенное слово живого Бога. Я верю Библии от обложки до обложки. Я даже верю обложке. На ней написано «Кен Ховинд». Я верю в это. Я хочу поддержать вашу веру в Бога. На последней сессии мы говорили о Большом взрыве, или о большой сказке. Его не было. Теперь мы поговорим о возрасте Земли. Как я уже сказал, это не моя жена. Это только фотография. Мы живём в Пенсаколе уже 11 лет. И у нас трое детей. 20, 21 и 22 года. Планирование семьи. Мой сын Эрик уже женился. Теперь у нас четверо детей. В эту среду они едут на Украину, и они будут представлять мои лекции в государственных школах и в университетах. Там, в России, на Украине. Молитесь за это.'
  rating: neutral
  verdict: 'Конец первой части и начало второй: анонс, приветствие, представление, исповедание веры и рассказ о семье. Мы тоже верим, что Писание — Слово Божье; «большой сказкой» Ховинд мимоходом называет Большой взрыв, разобранный выше.'
  rhetoric:
  - self-authority

- id: lecture-1-2759
  start: 2759.6
  end: 2797.6
  text: 'В Библии говорится: «В начале». Когда было начало? Сколько лет Земле? Это очень важный вопрос. Когда было начало? Иисус сказал, что Им создано всё. В Колоссянах написано, что Иисус сотворил всё. Значит, он должен знать, когда было начало. Иисус сказал в Матфея 19:4: «Не читали ли вы, что Сотворивший в начале мужчину и женщину сотворил их?» И поэтому началом было сотворение человека. То же самое в Марка 10:6: «В начале же создания…»'
  rating: purple
  verdict: В Мф 19:4 и Мк 10:6 Иисус говорит, что Бог «от начала» сотворил мужчину и женщину, и речь там о браке. Значит ли «от начала» первую неделю мира или начало человечества, из самих слов не видно.
  arguments:
  - genesis-literal

- id: lecture-1-2798
  start: 2798.4
  end: 2836.0
  text: 'Мы можем узнать возраст Земли, потому что в Библии написано, что смерть вошла грехом. Ничего не умирало до греха Адама. Библия ясна: не было смерти до греха. Если ничего не умирало до греха Адама и Адам — первый человек, значит, можно прибавить даты. В Библии говорится, что Адам жил 130 лет и родил сына Сифа. Сиф жил 105 лет и родил Еноса. Енос жил 90 лет и родил Каинана, и он родил Малелеила в 70 лет. Даны все даты. Если вы прибавите даты, получится около 6 000 лет. Не миллионы или миллиарды лет.'
  rating: purple
  verdict: 'Повтор доводов из первой части: смерть через грех и сложение родословий (разборы на 42:07 и 42:30).'
  arguments:
  - death-before-fall

- id: lecture-1-2837
  start: 2837.8
  end: 2863.1
  text: Эта таблица вот здесь. Эта таблица представляет то, чему учит Библия. Около 6 000 лет назад Бог сотворил всё. Он сделал всё за 6 дней, как он и сказал. 4 400 лет назад был потоп, который уничтожил весь мир. Две тысячи лет назад пришёл Иисус. Вот мы здесь сегодня ждём прихода Господа через 5 минут. Это библейское мировоззрение.
  rating: purple
  verdict: Хронологии «творение 6000 лет назад, потоп 4400 лет назад» держатся многие христиане, но Ховинд объявляет её единственным библейским взглядом. А Библия сама дат не складывает, и другие верные христиане понимают первые главы Бытия иначе.
  arguments:
  - genesis-literal

- id: lecture-1-2863
  start: 2863.6
  end: 2869.9
  text: Эволюционный взгляд говорит, что 20 млрд лет назад был Большой взрыв. Но неизвестно, что взорвалось.
  rating: orange
  verdict: '«20 млрд лет» были в учебниках до 1990-х, сейчас возраст Вселенной оценивают в 13,8 млрд. А «что взорвалось» — неверный вопрос: Большой взрыв — не взрыв чего-то в пространстве, а расширение самого пространства, как поднимающееся тесто.'
  arguments:
  - big-bang

- id: lecture-1-2870
  start: 2870.9
  end: 2889.8
  text: Четыре с половиной миллиарда лет назад Земля охладилась и образовала твёрдую кору. На камне шёл дождь и превратил их в смесь, которая ожила около 3 млрд лет назад. Эта форма жизни как-то питалась. И потом медленно превратилась во всё, что мы видим сегодня.
  rating: red
  verdict: Наука не говорит, что «камень ожил под дождём». Как появилась жизнь, учёные честно говорят, что пока не знают, и изучают, как из простых веществ шаг за шагом собирались сложные. Мы верим, что жизнь от Бога при любом ответе.
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-1-2891
  start: 2891.8
  end: 2917.8
  text: Это два взгляда на историю. Только два известных взгляда. Но кто-то не прав. И мне приятно показать, кто. Но даты в Библии прибавляются к около 6 000 лет. Эту таблицу продолжительности жизни родоначальников, э-э, которая находится снизу, можно найти в семинарном блокноте на последней странице. Но даты в Библии прибавляются к около 6 000 лет. Не миллионам. Кто-то неправ.
  rating: orange
  verdict: «Только два взгляда» — неверно. Одни христиане верят, что мир сотворил Бог, но понимают дни творения как долгие эпохи, другие — что Бог творил через постепенное развитие жизни. Выбор «6000 лет или безбожная эволюция» придуман.
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-2918
  start: 2918.8
  end: 2974.1
  text: 'Я не говорю, что Земля была сотворена 6 004 года назад, 23 октября, в 2 часа дня. Я не думаю, что это возможно узнать из Библии. И также я не могу этого доказать, но я думаю, что я знаю, почему Бог сотворил Адама первым. Я думаю, Бог сотворил Адама первым, потому что он не хотел, чтобы ему советовали, как это делать. Вы согласны со мной, да? Нет, Бог, это не так. Атеисты всегда спрашивают… Я провожу много дискуссий в университетах и в школах. И кто-то обязательно меня спросит: «Мистер Ховинд, если у Адама и Евы были Каин и Авель, Каин убил Авеля. Потом родился Сиф. На ком женились их сыновья?» Они думают, что я не смогу ответить.'
  rating: neutral
  verdict: Повторная оговорка о дате сотворения и шутка про Адама; затем вопрос «на ком женился Каин», к которому Ховинд вернётся.

- id: lecture-1-2974
  start: 2974.6
  end: 3003.2
  text: 'Я говорю: если вы верите в эволюцию, у вас проблема намного хуже. Вы верите, что 4,5 млрд лет назад Земля охладилась? Четыре миллиона лет назад сформировались океаны. Миллионы лет на камни шёл дождь. Кипящая вода в океанах содержит сложные химикаты. Прогресс химической смеси к живущему организму очень медленный. Такой медленный, что он ещё не начался.'
  rating: red
  verdict: Вместо ответа на вопрос — встречный выпад. Происхождение жизни действительно не объяснено полностью, но насмешка «процесс такой медленный, что ещё не начался» — не довод против исследований.
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-1-3005
  start: 3005.5
  end: 3026.9
  text: 'В этом учебнике говорится: «Первые самопроизводящие системы должны были произойти в этом органическом супе». Вам нужно, чтобы две клетки развились из этой смеси. Две клетки разного пола. В одном месте, в одно и то же время. Это большой мир, а клетки маленькие. Им нужно найти друг друга. У вас много проблем.'
  rating: red
  verdict: 'Никакой теории не нужны «две разнополые клетки в одном месте»: первые организмы размножались делением, а половое размножение появилось гораздо позже.'
  arguments:
  - origin-of-life
  rhetoric:
  - straw-man

- id: lecture-1-3027
  start: 3027.4
  end: 3052.9
  text: 'У меня нет проблем, потому что Библия говорит, что Адам жил 800 лет после рождения Сифа и родил сыновей и дочерей. Сколько детей можно иметь в течение восьмисот лет? Немало. Правда? Поэтому во время первого поколения они женились на сёстрах. Вы скажете: «Женились на сёстрах?» Во-первых, у них не было выбора. Во-вторых, кому бы вы пожаловались?'
  rating: purple
  verdict: Что дети Адама вступали в браки между собой, — традиционный и простой ответ, его разделяют многие христиане. Это вопрос толкования, а не науки.
  arguments:
  - cains-wife

- id: lecture-1-3058
  start: 3058.4
  end: 3086.0
  text: В-третьих, запрещающий этот закон появился только 2 500 лет спустя, когда Бог запретил жениться на сёстрах. До этого не было деформированных хромосом. И не было деформированных детей. Потому что всё передаётся по наследству. Даже дети наследственные. Если у ваших родителей нет детей, у вас тоже не будет. Хм, не думали об этом? Подумайте.
  rating: red
  verdict: Утверждение, что до Моисея у людей не было вредных мутаций, ничем не подтверждено; генетика показывает, что такие изменения возникают в каждом поколении. Это догадка, поданная как факт.
  arguments:
  - cains-wife

- id: lecture-1-3087
  start: 3087.7
  end: 3098.4
  text: 'Люди говорят: «Жениться на сёстрах нельзя из-за генетического сходства». Адам женился на своём ребре. А вы говорите о сходстве ген? Это не было проблемой в первом поколении.'
  rating: orange
  verdict: Возражение о генетическом риске браков между родственниками серьёзное, а шутка про ребро на него не отвечает.
  arguments:
  - cains-wife
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-3098
  start: 3098.7
  end: 3134.6
  text: Между прочим, когда вы построите график, вы заметите интересные вещи. Вы знаете, что Адам жил достаточно долго, чтобы знать своего пра-пра-пра-правнука? Отец Ноя знал Адама. Пятьдесят шесть лет. Вы можете представить себе, как родственники собирались вместе в те времена? Все садитесь на верблюда, а мы поедем к нашему прапрапрадедушке Адаму. Он нам расскажет, как было в Эдемском саду. Пока первая женщина не съела первого мужчину из рая. Или что там произошло?
  rating: neutral
  verdict: Подсчёты по родословиям для тех, кто читает их как полную хронологию, и шутка о семейных встречах; на доводы не влияет.

- id: lecture-1-3136
  start: 3136.0
  end: 3167.4
  text: Также вы знаете, что Ной жил после потопа долгое время. Он жил долго после потопа. Сын Ноя Сим жил достаточно долго, что он мог знать Авраама, Исаака и Иакова. Вы этого не заметите, пока вы не построите такой график. Я думаю, что они могли знать допотопную историю. И рассказывали о том, как было до потопа. Может быть, поэтому сегодня много легенд, как о Зевсе или Торе. Но об этом мы поговорим в другое время.
  rating: purple
  verdict: Что Сим, по буквальному сложению лет, мог застать Авраама, верно. Но мысль, что мифы о Зевсе и Торе — память о допотопной истории, — догадка самого Ховинда без доказательств.
  arguments:
  - genesis-literal

- id: lecture-1-3168
  start: 3168.9
  end: 3193.8
  text: 'В учебниках говорится, что Земле миллиарды лет. Иисус говорит, что творение Адама было началом. Обманывал ли Иисус? Сколько лет Земле? В учебниках говорится: «Три с половиной миллиона лет назад что-то произошло». Миллионы лет назад. Четыре с половиной миллиарда лет назад. Учебники наполнены этим. В этом городе? Кто же прав?'
  rating: purple
  verdict: Выбор «либо учебник, либо Иисус обманывал» ложен. Иисус говорил о браке, а не о возрасте Земли; принимая древний возраст, никто не обвиняет Христа во лжи.
  arguments:
  - earth-age-billions
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-3195
  start: 3195.3
  end: 3230.7
  text: 'Даже некоторые христиане говорят, что Земле миллиарды лет и что Бог использовал эволюцию. Как-то раз ко мне подошёл человек и сказал: «Вы не согласны с христианами, которые верят, что Земле миллионы лет и что Бог использовал эволюцию? Вы не согласны с нами?» Я сказал: «Да, я не согласен». Он спросил: «Почему?» Я сказал: если ваш бог использовал эволюцию для создания, тогда у вас тупой бог. Мой бог сделал это с первого раза. Он не практиковался, не использовал эволюцию и смерть. Он сделал всё за 6 дней и сказал, как он это сделал. Он не обманул. Поэтому у вас другой бог.'
  rating: purple
  verdict: Ещё Августин, учитель Церкви V века, задолго до всякой эволюции не считал дни творения обычными сутками, и многие христиане так думают и сегодня. Это законный богословский спор, а назвать их Бога «тупым» — насмешка над братьями по вере, а не довод.
  arguments:
  - genesis-literal
  rhetoric:
  - vysmeivanie-vmesto-dovoda

- id: lecture-1-3232
  start: 3232.1
  end: 3258.7
  text: 'Но почему нас интересует возраст Земли? Правдоподобность Иисуса под вопросом. Он цитировал из Бытия 25 раз. Он верил в Бытие? Правдоподобность всей книги Бытия под вопросом. Вообще-то вся Библия под вопросом. Почти каждая книга Библии ссылается на книгу Бытия. Тема возраста Земли — очень важная тема. Иисус сказал: «Если бы вы поверили Моисею, вы бы поверили мне. Он писал про меня».'
  rating: purple
  verdict: Иисус действительно ссылался на Бытие, и мы Ему верим. Но доверие к Христу не зависит от одного толкования дней творения; вывод «древняя Земля — значит Иисус неправ» и есть ложная дилемма.
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-3259
  start: 3259.7
  end: 3299.6
  text: Есть много научных путей определения возраста Земли. Например, на прошлой неделе газеты объявили, что население уже составляет 6 млрд человек. В 1985 году в мире было 5 млрд человек. Если вы не знаете, что такое миллиард, не волнуйтесь. Конгресс тоже не знает. Но миллиард — это много. В XVIII столетии на планете проживал только один миллиард людей. Миллиарды — это много? Все соглашаются, что в XVIII столетии был миллиард людей. Учебники учат этому. И никто не спорит, что население растёт очень быстро.
  rating: green
  verdict: 'Верно: население Земли около 1800 года впервые достигло миллиарда, в 1987 году — 5 миллиардов, в 1999 году — 6 миллиардов.'

- id: lecture-1-3300
  start: 3300.7
  end: 3332.6
  text: Но Земля не переполнена. Всё население мира — 6 млрд человек — может уместиться в городе Джексонвилл, штат Флорида. Дважды. В городе свыше 8,5 млрд кв. м. Мир не переполнен. Вы проезжали по Канзасу, Техасу или Аляске? Мир не переполнен. Много места. Много неисследованной и незаселённой территории. Если возле вас мир перенаселён, переедьте.
  rating: orange
  verdict: Что всё человечество поместилось бы стоя на площади большого города, верно. Но о перенаселённости судят не по месту для стояния, а по воде, пище и пашне, так что пример ничего не решает.
  rhetoric:
  - scale-trick

- id: lecture-1-3336
  start: 3336.6
  end: 3367.7
  text: Когда здесь был Иисус, на Земле проживало четверть миллиарда людей. 250 млн. Интересно. Согласно кривой населения, выглядит, что всё началось около 4 400 лет назад. В Библии говорится, что 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп, от которого спаслись только восемь человек на Ковчеге Ноя. Начиная с 8 человек, население мира может составить 6 млрд человек за несколько тысяч лет.
  rating: red
  verdict: 'Что во времена Христа на Земле жило около четверти миллиарда людей, верно. Но рост был очень неравномерным: голод, войны и эпидемии веками удерживали население почти на месте, поэтому нынешний темп нельзя переносить в прошлое.'
  arguments:
  - population-growth
  rhetoric:
  - cherry-picking

- id: lecture-1-3369
  start: 3369.3
  end: 3390.8
  text: Но если вы верите в эволюцию и вы думаете, что человек живёт 3 млн лет, тогда появляется проблема. То за 3 млн лет население должно составлять 75 000 человек. на 1 квадратный см. Тогда Земля была бы переполнена. Поэтому население ясно показывает, что Земле нет миллионов лет.
  rating: red
  verdict: «75 000 человек на квадратный сантиметр» получается, только если считать, что люди всегда размножались так же быстро, как в XX веке. А древние охотники жили впроголодь и теряли много детей, поэтому до земледелия и медицины людей прибавлялось очень медленно.
  arguments:
  - population-growth
  rhetoric:
  - scale-trick

- id: lecture-1-3392
  start: 3392.1
  end: 3408.1
  text: Кстати, кто слышал о новом мировом порядке? Буш, Клинтон — эти люди хотят одно государство. Новый мировой порядок. Цель нового мирового порядка — снижение уровня населения до половины миллиарда. К двухтысячному году.
  rating: red
  verdict: Документа, где президенты США ставят цель сократить население до полумиллиарда к 2000 году, нет, а к 2000 году на Земле жило больше 6 миллиардов человек.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3410
  start: 3410.7
  end: 3447.3
  text: 'И сказал Господь Бог змею в Эдемском саду: «Ты будешь ползать и есть прах всю жизнь». И сказал: «Вражду положу между тобою и между женою, и между семенем твоим и между семенем её; оно будет поражать тебя в голову». Дьявол знает, что когда-то семя женщины поразит его в голову. Но он не знает, кто это будет, поэтому он старается уничтожить каждого живого человека. Помните, когда они хотели убить Иисуса в Вифлееме? Что они сделали? Убили всех детей. Сатана не знает, кто поразит его в голову, поэтому он старается убить каждого живого человека.'
  rating: neutral
  verdict: Толкование Быт 3:15 как первого обещания Спасителя — давнее христианское прочтение; мысль, что сатана ненавидит людей, разделяют многие христиане.

- id: lecture-1-3448
  start: 3448.5
  end: 3487.2
  text: 'Помните, когда он предложил Иисусу царство? «Поклонись мне, и я дам тебе царство». Сатана предложил царство многим людям, и некоторые согласились. Некоторые супербогачи подумали, что было бы неплохо уменьшить население. Жак Кусто сказал: «Мы должны ликвидировать 350 000 человек ежедневно». Чтобы спасти планету, конечно. Люди — это причина всех проблем. Людей слишком много, нам нужно избавиться от некоторых. В мире существует рак, и рак — это человек. С этим нам приходится сталкиваться. Бог сказал: «Плодитесь и размножайтесь». Сатана говорит: «Убейте всех».'
  rating: orange
  verdict: Кусто в интервью 1991 года действительно сказал резкую фразу о 350 000 человек в день. Но он говорил о прогнозах роста населения, а не о плане убийств; превращать слова о демографии в «сатанинский заговор» — подмена.
  arguments:
  - depopulation-plot
  rhetoric:
  - quote-mining

- id: lecture-1-3487
  start: 3487.9
  end: 3519.1
  text: 'Тёрнер сказал: «Общее мировое население в 250 или 300 млн человек, на 95% меньше нынешнего уровня, было бы идеальным». Хорошо, Тед. Ты первый? И захвати с собой свою жену тоже. И, кстати, Тед является президентом новостей CNN.'
  rating: orange
  verdict: Тёрнер действительно говорил, что хотел бы мира с меньшим населением. Но речь шла о снижении рождаемости, а не об уничтожении людей; мнение одного богача — не доказательство заговора.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3521
  start: 3521.1
  end: 3530.3
  text: 'Принц Филипп сказал: «Если бы я смог перевоплотиться, я бы вернулся на Землю как вирус-убийца, чтобы снизить уровень населения». Ого.'
  rating: orange
  verdict: Принц Филипп действительно произнёс эту мрачную фразу. Но это резкая шутка о перенаселении, а не план, и доказательством заговора она не служит.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3531
  start: 3531.5
  end: 3561.0
  text: 'Если вы посетите Элбертон в Джорджии… Там, в 10 км, находятся камни-путеводители Джорджии. На камнях-путеводителях на восьми языках написаны Десять Заповедей Новой Эры. Вот фотография этих камней. На восьми языках в первой заповеди говорится: «Сохраняйте человечество на уровне половины миллиарда». Извините, полмиллиарда. Сегодня уже 6 млрд.'
  rating: orange
  verdict: Камни в Джорджии с призывом держать население «до 500 миллионов» действительно стояли с 1980 по 2022 год. Но их поставил анонимный заказчик, и связи этой надписи с действиями правительств никто не показал.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3562
  start: 3562.1
  end: 3589.3
  text: Да, они хотят уменьшить население. До 5 мая 2000 года. Духи-путеводители сказали этим людям, этим людям-богачам. Это люди, которые ничего не делают, только сидят. Демоны, которые называют себя духами-путеводителями, сказали, что им нужно уменьшить человеческое население до 5 мая, потому что это день рождения Маркса, и в этот день мы войдём в век Водолея.
  rating: red
  verdict: 'Предсказание, что «богачи» сократят население к 5 мая 2000 года, не сбылось: население мира продолжило расти. Слова о «духах-путеводителях» ничем не подтверждены.'
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3591
  start: 3591.0
  end: 3619.9
  text: Вы слышали о Водолее? Эти люди изучают звёзды, гороскопы и другие глупые вещи, и они говорят, что 5 мая мы войдём в век Водолея, и человек начнёт развиваться духовно. И мы станем богами. Они верят в это? И цель — уменьшить население до 5 мая 2000 года. И, может быть, компьютерная проблема и будет шагом к этому. Нам остаётся подождать и посмотреть. Но они хотят уменьшить население до половины миллиарда.
  rating: red
  verdict: «Проблема 2000 года» в компьютерах прошла почти незаметно, и население не уменьшилось. Это ещё одно непроверяемое предсказание, которое не сбылось.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-3620
  start: 3620.0
  end: 3643.2
  text: Но факты говорят, что Земле нет миллиардов лет. Давайте посмотрим на другие научные факты. Галактики — это звёзды, которые крутятся большими группами. Внутренние звёзды крутятся быстрее внешних. Если бы галактикам были миллиарды лет, то на них не было бы спиральных концов. И существование спиральных галактик доказывает, что им нет миллиардов лет. Никак.
  rating: red
  verdict: 'Задачу «закручивания» рукавов астрономы знают. Рукав — не одни и те же звёзды, а место, где звёзды на время скапливаются и проходят дальше, как пробка на дороге: она стоит часами, а машины в ней всё время новые.'
  arguments:
  - spiral-galaxies

- id: lecture-1-3644
  start: 3644.3
  end: 3679.4
  text: В учебниках говорится, что красные звёзды медленно превращаются в белых карликов. Для этого нужны сотни тысяч, если не миллиарды лет. Они говорят, что красные звёзды медленно превращаются в карликов. Я этому не верю. Все древние астрономы говорят, что Сириус была красной звездой. Сириус — это яркая звезда. Не считая планет. Сириус была красной. Сегодня Сириус — это белый карлик. Прошло 2 000 лет. Но в учебниках говорится, что для этого нужно 100 000 лет. Мы уже знаем, что это неправда.
  rating: red
  verdict: 'Сириус — пара звёзд: яркая, видная глазом, — обычная белая звезда, а «белый карлик» — её тусклый маленький спутник, которого древние видеть не могли. «Красным» Сириус в старых текстах, вероятно, звали по традиции (его связывали с зноем) или потому, что у горизонта звёзды краснеют.'
  arguments:
  - sirius-red
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-3679
  start: 3679.9
  end: 3706.5
  text: 'Некоторые планеты очень быстро охлаждаются, теряют своё тепло. Но всегда терять тепло невозможно. Если вы увидите на столе чашку кофе, и я вам скажу: «Не трогайте, он горячий». Вы спросите: «Чей это кофе?» Я скажу: «Ой, я не знаю, это уже здесь стоит 400 лет». Трудно поверить. И они хотят, чтобы я поверил, что планетам миллионы лет, но они до сих пор охлаждаются.'
  rating: red
  verdict: 'Аналогия с чашкой кофе не работает: планеты огромны и остывают очень медленно, а их недра подогревают распад радиоактивных веществ и сжатие; Юпитер сам излучает тепло.'
  arguments:
  - planets-cooling
  rhetoric:
  - argument-by-incredulity

- id: lecture-1-3707
  start: 3707.1
  end: 3723.0
  text: Вокруг Сатурна есть кольца, но они нестабильные и удаляются от планеты. Сатурн теряет кольца. Им всего несколько тысяч лет. Не миллионы лет. И если Вселенной миллиарды лет, почему вокруг Сатурна до сих пор находятся кольца?
  rating: red
  verdict: Что кольца Сатурна могут быть моложе планеты, обсуждают и астрономы. Но их оценки — десятки или сотни миллионов лет, а не несколько тысяч, и возраст колец ничего не говорит о возрасте Вселенной.
  arguments:
  - saturn-rings

- id: lecture-1-3723
  start: 3723.4
  end: 3732.6
  text: Почему луна Юпитера Ганимед горячая, доказывая, что ей нет миллиардов лет? Факты из космоса опровергают, что Вселенной миллиарды лет.
  rating: red
  verdict: Ганимед снаружи не горячий, это ледяной спутник; тёплым остаётся только его ядро. Почему оно до сих пор жидкое, учёные ещё выясняют, но «не знаем подробностей» не значит «спутнику несколько тысяч лет».
  arguments:
  - planets-cooling

- id: lecture-1-3734
  start: 3734.8
  end: 3778.8
  text: Луна крутится вокруг Земли. Кто уже знал об этом? Но вы знали, что Луна медленно удаляется от Земли? Мы медленно теряем Луну. Всего лишь несколько сантиметров в год, не о чем беспокоиться, всё равно вы ничего не измените. Но Луна удаляется от Земли. Каждый год. Дети. Это будет очень сложно. Поэтому слушайте внимательно. Луна медленно удаляется от Земли. Это значит, что раньше она была ближе. Кто уже разобрался без посторонней помощи? Пять, шесть, семь. Восемь.
  rating: green
  verdict: 'Верно: Луна удаляется от Земли примерно на 3,8 см в год; это измеряют лазером по отражателям, оставленным экспедициями «Аполлон».'
  arguments:
  - moon-recession

- id: lecture-1-3779
  start: 3779.6
  end: 3804.1
  text: Но если Луну приблизить к Земле, получится беда. Так как Луна является причиной отливов и приливов. Если Луна была бы ближе, то приливы и отливы были бы намного сильнее из-за закона обратной пропорциональности. И несколько миллиардов лет назад Луна была бы так близко к Земле, что приливы покрывали бы всю Землю два раза в день. Но вы можете утонуть только один раз в день.
  rating: red
  verdict: 'Если перенести нынешнюю скорость в прошлое, Луна окажется опасно близко. Но скорость зависит от приливов и раньше была меньше: древние слои, оставленные приливами, как календарь, сохранили тогдашние месяцы и показывают, что расстояние менялось медленно.'
  arguments:
  - moon-recession
  rhetoric:
  - cherry-picking

- id: lecture-1-3806
  start: 3806.9
  end: 3821.3
  text: У меня в офисе есть иллюминатор космического корабля. Прямо у меня в офисе. Но он сильно поцарапан. Потому что космос полон пыли. И на большой скорости иллюминатор царапается.
  rating: neutral
  verdict: Рассказ об иллюминаторе — подводка к доводу о лунной пыли.
  rhetoric:
  - personal-story

- id: lecture-1-3822
  start: 3822.4
  end: 3872.1
  text: 'Учёные беспокоились о пыли в космосе. В 1950-х годах они пытались подсчитать, сколько пыли на Луне. Пыль оседает на вещах, образуя слой пыли. И Луна движется в космосе, который полный пыли. Они думали, что каждые 10 000 лет оседает 2 см пыли. И они думали, что на Луну невозможно будет приземлиться. В 1955 году Литтлтон сказал, что на Луне может быть несколько километров пыли. Исаак Азимов в пятьдесят девятом году до полёта на Луну сказал: «Я представляю себе, как первый космический корабль выберет подходящее место для посадки, медленно опустится хвостом вниз и, величественно утопая, исчезнет». Он думал, что корабль утонет в пыли.'
  rating: orange
  verdict: Что в 1950-е некоторые учёные опасались толстого слоя пыли, верно. Но к полётам «Аполлонов» автоматические станции уже показали, что пыли немного, и этого никто не скрывал.
  arguments:
  - moon-dust
  rhetoric:
  - cherry-picking

- id: lecture-1-3873
  start: 3873.2
  end: 3907.8
  text: 'В детской книжке написано: На Луне нет ничего, кроме пыли. Пыль, пыль, пыль. Слой пыли. Поэтому были построены громадные посадочные подушки с широкими подножиями для равномерного распределения веса. Людям, работающим над производством рюкзаков, было сказано, чтобы они сделали пылеустойчивые рюкзаки в случае погружения в пыль. Даже спускная лестница была укорочена на 30 см. Все они ожидали, что на Луне будет много пыли и астронавты утонут в пыли.'
  rating: orange
  verdict: Широкие опоры посадочного модуля нужны для мягкой посадки на неизвестный грунт; до «Аполлонов» на Луну уже сели аппараты «Сервейер». Страха «утонуть в пыли» к тому времени у инженеров не было.
  arguments:
  - moon-dust
  rhetoric:
  - cherry-picking

- id: lecture-1-3909
  start: 3909.5
  end: 3932.6
  text: 'Но когда они приземлились на Луну, они, конечно, увидели, что там было около одного сантиметра пыли. И христиане спросили эволюционистов: «Где вся пыль?» Атеисты этого не сказали, но я думаю, что они подумали: «Баптисты всё почистили, чтобы мы остались в дурачках». Но им не нужно помогать, они и так уже глупые.'
  rating: red
  verdict: Сантиметр — это верхний рыхлый слой; под ним лежит лунный грунт (реголит) толщиной в несколько метров. Назвать оппонентов «глупыми» — не довод.
  arguments:
  - moon-dust
  rhetoric:
  - loaded-language

- id: lecture-1-3933
  start: 3933.9
  end: 3969.6
  text: На Луне меньше сантиметра пыли. И если Земле много миллионов лет, где вся пыль? Поэтому на Луне оставили пластины собирания пыли. По появлению пыли было определено, что за 1 млн лет собирается только около 6 см пыли. Но это всё же составляет 345 м за 4,5 млрд лет. И поэтому пыль на Луне — это очень важный факт. На Луне нет достаточно пыли, чтобы Луне были миллиарды лет. И я думаю, что это очень важный аргумент.
  rating: red
  verdict: Измерения показали, что космической пыли на Луну падает очень мало, и она перемешивается с грунтом толщиной в метры; «сантиметр пыли» на поверхности не говорит о молодости Луны.
  arguments:
  - moon-dust

- id: lecture-1-3970
  start: 3970.3
  end: 4006.1
  text: 'В космосе летают кометы. Кометы постоянно теряют материал. Солнечный ветер и солнце постоянно обжигают комету, и она оставляет сзади себя хвост. Но всегда терять невозможно. Скоро она исчезнет. Если вы только тратите деньги, скоро у вас не будет денег вообще. И кометы постоянно теряют материал. Поэтому продолжительность жизни комет меньше 10 000 лет. Но тогда возникает вопрос: если Вселенной миллиарды лет, почему в космосе до сих пор летают кометы?'
  rating: red
  verdict: Что кометы быстро теряют вещество, верно. Но новые кометы постоянно прилетают с дальних окраин Солнечной системы, где их огромный запас, поэтому кометы есть и сегодня.
  arguments:
  - comets-lose-material

- id: lecture-1-4007
  start: 4007.8
  end: 4058.6
  text: 'На Интернете появились уже четыре антиховиндовских веб-сайта. Один человек посвятил целый веб-сайт против меня. Он говорит: «Вы не можете использовать аргумент комет». Э-э, в 1950 году голландский астроном Ян Оорт предположил, что крупная сферическая оболочка из комет существовала на дальних границах нашей нашей Солнечной системы. Он сказал, что это облако Оорта находится на расстоянии 50 астрономических единиц. Но есть проблема. Никто не видел облачность Оорта. Оорт не видел облачность Оорта. Это воображение. Вообще-то, было доказано, что облачность не существует. По этому поводу была опубликована целая статья. Облачности Оорта не существует.'
  rating: red
  verdict: 'Что облако Оорта, дальний запас комет, никто не видел, верно: оно слишком далеко. Но о нём говорят пути комет, прилетающих оттуда, а статьи, «доказавшей», что облака нет, Ховинд не называет.'
  arguments:
  - comets-lose-material
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-4059
  start: 4059.2
  end: 4086.7
  text: 'Но Матсон на интернете сказал: Извините. Но если вы хотите использовать этот аргумент, то вам придётся доказать, что облачность Оорта не существует. Извините, но как доказать несуществование чего-то? С чего начинать? Но я скажу, что если он хочет за мои налоги учить детей, что Земле миллиарды лет, то он должен доказать, что облачность существует. Доказать должен он, а не я.'
  rating: orange
  verdict: Ховинд только что сказал, что «доказано» несуществование облака, а теперь говорит, что доказывать не обязан. Бремя доказательства лежит на том, кто делает утверждение, в том числе и на нём.
  arguments:
  - comets-lose-material
  rhetoric:
  - burden-shift

- id: lecture-1-4087
  start: 4087.7
  end: 4098.2
  text: У нас есть кометы, это факт, они долго не живут — это факт. Библия говорит, что Земле 6 000 лет, — это тоже факт. И всё соответствует друг другу, это тоже факт. Всё остальное — это воображение.
  rating: purple
  verdict: 'Что кометы есть и живут недолго, — факты. Но «Библия говорит, что Земле 6000 лет» — не факт, а толкование: таких слов в Библии нет.'
  arguments:
  - genesis-literal
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-4098
  start: 4098.8
  end: 4223.0
  text: 'В Библии написано: «Слава Твоя простирается превыше небес». В псалмах написано. «Когда взираю я на небеса Твои…» Заметьте, что здесь написано «когда», не «если». Когда-нибудь выключите телевизор, видеомагнитофон, плеер и выйдите и посмотрите на небеса. Посмотрите на то, что сделал Бог вместо того, что сделал человек. Псалмопевец сказал: «В мыслях моих возгорелся огонь». Это значит, что он размышлял. Мы проводим всё наше время, развлекаясь. Но нам необходимо остановиться и поразмышлять. Нам нужно развлекаться, не развлекаться, а потратить время и поразмышлять. «В мыслях моих возгорелся огонь. Вспоминаю дни древние, размышляю о всех делах Твоих, рассуждаю о делах рук Твоих». Псалмопевец размышлял. А что делаем мы? Развлекаемся. Есть целые парки, где можно развлекаться, но в Библии написано другое. Э-э, в псалмах говорится: «Когда взираю я на небеса Твои — дело Твоих перстов, на луну и звёзды, которые Ты поставил, то что есть человек, что Ты помнишь его?» Можно узнать человека, взирающего на небеса. Ему всё равно, что сделал человек. Это его не впечатляет. Родители, вам это может не понравиться, но некоторые из вас должны посмотреть в комнату своих детей. Если их стены увешаны плакатами атлетов, вещей, которые сделал человек, их не учат взирать на небеса. Их учат взирать на человеческое. У них неправильная перспектива жизни. Не имеет значения, кто попал в кольцо или забил гол. Это не имеет значения. Но важно то, что сделал и делает Бог. «Что есть человек, что Ты помнишь его?»'
  rating: neutral
  verdict: 'Назидание по псалмам: смотреть на небо и размышлять о делах Божьих. Мы с этим согласны; на доводы о науке не влияет.'

- id: lecture-1-4223
  start: 4223.6
  end: 4245.2
  text: 'Библия говорит: «Побеседуй с землёй, и наставит тебя». Всё же сколько лет Земле? Вокруг Земли находится магнитное поле. Но магнитное поле слабеет. Земля теряет магнитную силу. Это, конечно, значит, что Земле нет миллиардов лет. Земле не больше 25 000 лет. По магнитным законам.'
  rating: red
  verdict: Что магнитное поле Земли сейчас слабеет, верно. Но оно и раньше то слабело, то усиливалось и много раз меняло направление; это записано в древней керамике и горных породах. Поэтому нынешний спад нельзя переносить в прошлое.
  arguments:
  - magnetic-field

- id: lecture-1-4246
  start: 4246.6
  end: 4252.9
  text: И что датирование углеродом не работает больше, чем на несколько тысяч лет. Мы говорим об этом на кассете номер семь.
  rating: red
  verdict: 'Радиоуглеродный метод работает примерно до 50 000 лет и проверен по годичным кольцам деревьев, а не до «нескольких тысяч». Возраст Земли им вообще не измеряют: для этого есть методы по урану, калию и другим элементам.'
  arguments:
  - radiometric-dating

- id: lecture-1-4253
  start: 4253.6
  end: 4297.0
  text: Некоторые люди говорят, что существуют магнитные противоположности. Извините, магнитных противоположностей на земной коре нет. Что случилось, так это 20 лет назад определили, что на океанском дне есть места слабого и сильного магнетизма. На графе это выглядит как синусоидальная волна. Кто-то прямо на середине провёл линию и сказал, что всё под линией противоположно. Большая ошибка. Вот где проходит настоящая линия. Магнитных противоположностей не существует. На Земле нет места, где бы компас вместо севера показал на юг. Это места сильного и слабого магнетизма, но не противоположностей. Мы говорим об этом на кассете номер шесть. Теория Ховинда.
  rating: red
  verdict: 'Обратная намагниченность пород — не «линия, проведённая на графике», а прямое измерение: в образцах застывшей лавы намагниченность указывает на юг. Смены полюсов подтверждены и на суше, и на дне океана.'
  arguments:
  - magnetic-field
  rhetoric:
  - straw-man

- id: lecture-1-4297
  start: 4297.7
  end: 4332.9
  text: Ещё несколько фактов. Земля вращается. Мы вращаемся вокруг оси. Кто уже знал об этом? Мы крутимся. Земля вращается со скоростью около 625 км/ч на экваторе. Но скорость замедляется на 1/1000 секунды каждый день. В этой статье говорится, что вы должны прибавить секунду к часам. День обычно используют как измерительную единицу. Но день удлиняется на тысячную долю секунды, так как вращение Земли замедляется.
  rating: orange
  verdict: 'Сутки и правда чуть длиннее точных 24 часов, примерно на тысячную долю секунды. Но удлиняются они на 2 тысячные секунды за сто лет, а не каждый день. «625 км/ч» — ошибка озвучки: у Ховинда верно, «около 1000 миль в час», то есть около 1670 км/ч.'
  arguments:
  - earth-rotation-slowing

- id: lecture-1-4333
  start: 4333.8
  end: 4358.9
  text: В 1992 году астрономический журнал объявил, что вращение Земли замедляется. Июнь будет на одну секунду длиннее нормального. У нас будет високосная секунда. Многие слышали про високосный год? Но немногие — о високосной секунде. Вы знали, что теперь у нас каждые полтора года есть високосная секунда? Так как Земля замедляется.
  rating: orange
  verdict: Земля — как часы, которые каждый день отстают от точных на тысячную долю секунды. За год-два набегает секунда, и её добавляют, как подводят часы. Это не значит, что за полтора года вращение замедлилось на целую секунду.
  arguments:
  - earth-rotation-slowing
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-4359
  start: 4359.7
  end: 4383.6
  text: Ребята, это будет сложно, поэтому слушайте внимательно. Земля крутится. Но она замедляется. Это значит, что раньше Земля крутилась быстрее. Если Земле только 6 000 лет, согласно Библии, тогда нет проблем. Земля крутилась быстрее во время Адама. Они бы не заметили этого, у них не было часов.
  rating: green
  verdict: 'Верно: раньше Земля вращалась быстрее, и сутки были короче.'

- id: lecture-1-4385
  start: 4385.1
  end: 4419.6
  text: Но кто-то хочет, чтобы я поверил, что Земле миллиарды лет. Тогда появляется проблема. Несколько миллионов лет назад Земля крутилась бы очень быстро. Дни были бы очень короткими. Ночь-день, ночь-день, ночь-день. Была бы ужасная центробежная сила. Ветры были бы 8 000 км/ч благодаря эффекту Кориолиса. И вы думаете, что динозавры жили 200 млн лет назад? А я знаю, что с ними случилось. Их снесло. Нет, они не жили 200 млн лет назад. Извините, но это просто неправда.
  rating: red
  verdict: 'По реальной скорости 400 миллионов лет назад сутки длились около 22 часов, а в году было около 400 дней: у кораллов, как кольца у дерева, есть суточные полоски, их можно сосчитать. При динозаврах, 200 миллионов лет назад, сутки длились около 23 часов; никакого «ночь-день, ночь-день» не было.'
  arguments:
  - earth-rotation-slowing
  rhetoric:
  - cherry-picking

- id: lecture-1-4420
  start: 4420.7
  end: 4472.4
  text: В пустыне Сахаре господствуют преобладающие ветры. Обычно они дуют в одну сторону. Но появляется проблема. Горячий ветер пустыни осушает деревья на краях пустыни, и они погибают. Это причиняет рост пустыни. Этот процесс называется опустыниванием. Пустыни растут. Сахара только 2 080 км с севера на юг. Подождите, она увеличивается на 6 км каждый год. Недавно было объявлено, что Сахаре около 4 000 лет. Основываясь на обширном изучении роста пустыни. Но если Земле миллиарды лет, почему нет большей пустыни? Почему самой большой пустыне мира меньше четырёх тысяч лет?
  rating: red
  verdict: 'Сахара то расширяется, то отступает: ещё 6–10 тысяч лет назад на её месте была саванна с озёрами. Поэтому сегодняшняя скорость её роста ничего не говорит о возрасте Земли.'
  arguments:
  - young-earth-clocks
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-4475
  start: 4475.1
  end: 4501.9
  text: Э-э, у меня есть теория по этому поводу. Я верю, что около 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп. Э-э, трудно иметь пустыню под водой, поэтому пустыня не начала расти, пока земля была покрыта водой. Поэтому я предсказываю, что самой большой пустыне должно быть меньше около четырёх тысяч лет. О, так оно и есть. Удивительно.
  rating: orange
  verdict: «Предсказание» сделано задним числом под уже известную цифру. А то, что нынешняя пустыня молода, говорит о смене климата, а не о возрасте планеты.
  arguments:
  - young-earth-clocks

- id: lecture-1-4502
  start: 4502.9
  end: 4537.0
  text: Вы знаете, что под землёй находится нефть? Эта нефть находится под огромным давлением, которое достигает 1 300 атмосфер на 1 кв. см. 1 300 атмосфер. Изучая камень над нефтью, учёные сказали, что при таком давлении камни должны расколоться в течение 10 000 лет. Тогда у меня появляется вопрос, два вопроса. Откуда появилась нефть? Почему она до сих пор под землёй? И, во-вторых, почему нефть под давлением?
  rating: red
  verdict: Нефть и газ удерживаются под давлением плотными породами-покрышками, а давление в пластах поддерживает вес вышележащих пород. Расчёт «камни расколются за 10 000 лет» приписан безымянным учёным.
  arguments:
  - young-earth-clocks
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-4538
  start: 4538.4
  end: 4556.7
  text: У меня есть теория на эту тему. Вот моя теория. Я верю, что около 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп. Во время потопа утонуло множество людей, животных. Все согласны, что нефть состоит из организмов, изменившихся под большим давлением.
  rating: purple
  verdict: Что нефть образуется из остатков живых организмов под давлением, верно. Хронология «творение 6000 лет назад, потоп 4400 лет назад» — толкование, которого держатся многие христиане и Ховинд; мы разобрали его выше.
  arguments:
  - genesis-literal

- id: lecture-1-4558
  start: 4558.1
  end: 4569.8
  text: Вы знаете, что учёные могут взять тонну мусора и превратить её в нефть за несколько минут? Компания Sinclair использует динозавров для рекламы. Они говорят, что динозавры превратились в нефть на протяжении миллионов лет.
  rating: orange
  verdict: Органику действительно можно превратить в нефтеподобное топливо в лаборатории за минуты или часы, но при очень высоких температуре и давлении. Это не опровергает природного образования нефти, а «нефть из динозавров» — образ из рекламы, а не утверждение геологов.
  rhetoric:
  - straw-man

- id: lecture-1-4571
  start: 4571.0
  end: 4591.8
  text: Нет. Я думаю, что 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп, в котором утонули все люди и животные. И под большим давлением камней, песка, гравия и грязи они превратились в нефть. И поэтому нефть состоит из утонувших людей и животных.
  rating: red
  verdict: Нефть образовалась в основном из морского планктона и водорослей, а не из «утонувших людей и животных», и её залежи лежат в слоях, возраст которых различается на сотни миллионов лет.
  arguments:
  - fossil-fuels-flood

- id: lecture-1-4593
  start: 4593.2
  end: 4640.2
  text: 'Если вы подумаете об этом, вы приехали сюда на ваших предках. И в следующий раз на заправке не забудьте сказать: «Прощай, дедушка. Надо было послушать Ноя. Он сказал, что пойдёт дождь, дедушка?» Когда я был в Денвере, ко мне подошли несколько человек и сказали: «Мистер Ховинд, мы работаем в национальной денверской лаборатории». Они предложили мне пойти на экскурсию. Они привели меня в громадный фризер. Минус 37°. У меня флоридская кровь, вам, может, ничего, а мне было холодно. Это люди, которые бурят скважины на Северном и Южном полюсах, чтобы установить возраст льда. У них в Денверской лаборатории есть образцы, да.'
  rating: neutral
  verdict: Шутка о нефти из предков и начало рассказа о лаборатории ледяных кернов в Денвере.

- id: lecture-1-4641
  start: 4641.7
  end: 4692.8
  text: В этой статье написано, что самая глубокая скважина 3 300 м. И на образце находятся годовые кольца — 135 000 таких колец. И эти люди показали мне ледяные сердцевины. Они сказали, что они просверливают скважины во льду вот такой машиной. И достают образец, как это делают в Гренландии и в Южном и на Южном полюсе. Здесь вы можете видеть кольца. Тёмный, светлый, тёмный, светлый, тёмный, светлый. Они сказали, что летом верхний слой тает, образует воду и перезамерзает в прозрачный лёд. Зимой снег не тает. И превращается в белый лёд. Поэтому эти слои — тёмный и слой белый слой, тёмный-белый — означают 135 000 раз лето, зима, лето-зима.
  rating: green
  verdict: 'Пересказ в целом верен: в ледяных кернах учёные считают годовые слои, которые различаются летом и зимой по цвету, пыли и химическому составу.'

- id: lecture-1-4696
  start: 4696.1
  end: 4748.7
  text: 'И тогда они мне сказали: «Как вы можете говорить, что Земле только 6 000 лет? Мы можем доказать, что Земле 135 000 лет». Я сказал: «Не предполагаете ли вы, что это годовые кольца?» Видите, они не знали о потерянной эскадрилье. Во время Второй мировой войны несколько самолётов приземлились в Гренландии. У них кончилось горючее. И о этих самолётах забыли. Ну, а в девяностом году один человек решил заправить самолёты, смахнуть с ихних крыльев снег и забрать их оттуда. Но всё оказалось не так просто. Эти самолёты находились подо льдом. Очень глубоко под льдом. Самолёты находились на глубине 75 м под льдом за 48 лет. Подождите, давайте посчитаем. 75 поделить на 48 равняется около полтора метра в один год.'
  rating: red
  verdict: Самолёты «потерянной эскадрильи» сели у побережья Гренландии, где снега выпадает очень много. Керны же бурят в центре ледяного щита, где за год ложится в разы меньше снега; сравнивать эти места нельзя.
  arguments:
  - ice-core-layers
  rhetoric:
  - personal-story

- id: lecture-1-4750
  start: 4750.6
  end: 4769.2
  text: И самая глубокая скважина 3 300 м, что составляет около 2 100 лет. Не 135 000 лет. И чем глубже, тем тоньше слои. Я это понимаю. Поэтому 4 400 лет — вполне разумный срок для накопления. Да.
  rating: red
  verdict: Скорость накопления в одном снежном месте у берега перенесена на весь ледник. Годовые слои в центральных кернах подтверждены сезонными химическими метками и следами известных извержений вулканов.
  arguments:
  - ice-core-layers
  rhetoric:
  - cherry-picking

- id: lecture-1-4770
  start: 4770.2
  end: 4811.1
  text: 'Ну, я решил поговорить с человеком, который достал самолёты. Они просверлили скважину и по частям вытащили самолёт. Этого человека зовут Боб Кардин. Вот номер его телефона. Я спросил его: «Боб, когда вы вытаскивали самолёт, вы заметили над самолётом тёмные и белые слои льда?» Он сказал: «Конечно, я заметил». Я сказал: «А сколько их было там?» Он сказал: «Много сотен». Я сказал: «Боб, как там может быть много сотен годовых колец за 48 лет?» Он сказал: «Это никакие не годовые кольца, это не зима-лето. Это тепло-холодно, тепло-холодно». Таких может быть десять за один день.'
  rating: red
  verdict: Слои над самолётом могли оставить отдельные оттепели и бури, и годовыми их никто не считал. В кернах годовые слои проверяют несколькими независимыми признаками и сверяют по известным датам извержений.
  arguments:
  - ice-core-layers
  rhetoric:
  - personal-story

- id: lecture-1-4813
  start: 4813.5
  end: 4824.3
  text: Но до сих пор в журнале «Научная Америка» в 1990 году их называют годовыми кольцами. Или же автор невежественный, необразованный человек, или же он обманывает.
  rating: red
  verdict: 'Выбор «автор либо невежда, либо обманщик» ложен: автор может быть прав. Слои в центральных кернах называют годовыми на основании проверок, а не ради эволюции.'
  arguments:
  - science-conspiracy
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-4826
  start: 4826.5
  end: 4834.8
  text: Я беспокоюсь, что в наших учебниках больше не учат о науке. Эти — это книги об эволюции. Они хотят, чтобы дети поверили этой теории.
  rating: orange
  verdict: Что учебники рассказывают об эволюции, верно. Но эволюция — часть биологии, а не замена науки; чтобы назвать её обманом в учебнике, нужно показать ошибки на примерах, а не на одном споре о слоях льда.
  arguments:
  - textbooks-poison

- id: lecture-1-4835
  start: 4835.5
  end: 4867.4
  text: Ещё несколько факторов. Река Миссисипи приносит много осадков. Вообще-то она приносит около 80 000 тонн грязи каждый час. Всё это впадает в Новый Орлеан. Дельта увеличивается. После изучения дельты учёные сказали, что нужно около 30 000 лет для накопления грязи. Хорошо, но у меня появился вопрос. Если Земле миллиарды лет, почему весь Мексиканский залив ещё не заполнен грязью?
  rating: red
  verdict: Нынешняя дельта Миссисипи молода, потому что русло реки много раз смещалось и дельта нарастала на новом месте; это не предел возраста Земли. К тому же дно залива медленно опускается под тяжестью осадков.
  arguments:
  - young-earth-clocks
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-4870
  start: 4870.6
  end: 4899.4
  text: 'Тогда они скажут: «Дельте 30 000 лет. Библия учит, что Земле 6 000 лет, и это опровергает Библию». Нет-нет. У меня есть теория по этому поводу. Я верю, что около 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп. Когда сходила вода, то половина дельты была заполнена в течение 20 минут. Кажется, что для этого нужно 30 000 лет, но нет. 4 400 лет. Они забыли о потопе.'
  rating: red
  verdict: 'Нет геологических следов того, что половина дельты отложилась за 20 минут: её слои показывают постепенное нарастание и смену русел.'
  arguments:
  - flood-runoff

- id: lecture-1-4901
  start: 4901.1
  end: 4929.7
  text: 'Вот фотография самого старого дерева в мире. Древнейшее дерево находится в Южной Калифорнии. Этому дереву 4 300 лет. Самый старый организм Земли. Ну, очень старое дерево. Но у меня появился вопрос: если Земле миллионы лет, почему нигде нет более старого дерева? Почему самому старому дереву только 4 300 лет?'
  rating: red
  verdict: Деревья не живут вечно, поэтому старейшее дерево говорит о сроке жизни сосны, а не о возрасте Земли. По годичным кольцам живых и погибших деревьев учёные составили непрерывные ряды длиной больше 10 000 лет.
  arguments:
  - young-earth-clocks

- id: lecture-1-4932
  start: 4932.4
  end: 4952.5
  text: У меня есть теория. Я верю, что около 6 000 лет назад Бог сотворил небо и землю. 4 400 лет назад был потоп. Я предсказываю, что самому старому дереву должно быть меньше четырёх тысяч четырёхсот лет. Вот так и есть. Может быть, Библия права?
  rating: red
  verdict: Это «предсказание» сделано задним числом. А ряды годичных колец уходят в прошлое дальше 4400 лет без перерыва на потоп.
  arguments:
  - young-earth-clocks

- id: lecture-1-4953
  start: 4953.1
  end: 4972.9
  text: Вот фотография кораллового рифа. Самый большой коралловый риф находится в Австралии. Великий риф Барьер. Мне позвонили и спросили, хочу ли я представить мой семинар в Австралии. Я согласился. Я поехал в Австралию и посетил коралловые рифы. Там было прекрасно.
  rating: neutral
  verdict: Рассказ о поездке в Австралию; на довод не влияет.

- id: lecture-1-4973
  start: 4973.8
  end: 5015.4
  text: Вы знаете, во время Второй мировой войны часть рифа была разрушена кораблями, якорями и бомбами. И экологи решили проверить, как быстро растёт этот риф. Они наблюдали за рифом 20 лет. Это была государственная работа. После наблюдения они подсчитали, что рифу меньше 4 200 лет. Это очень старый риф. Ну, у меня есть вопрос. Если Земле миллиарды лет, почему где-то нет больших рифов? Почему самому старому рифу только 4 200 лет?
  rating: red
  verdict: Скорость роста повреждённого участка за 20 лет — не возраст всего рифа. Бурение Большого Барьерного рифа показывает древние слои возрастом в сотни тысяч лет; нынешний риф растёт на них после последнего ледникового периода.
  arguments:
  - young-earth-clocks
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-1-5017
  start: 5017.7
  end: 5041.6
  text: Э-э, у меня есть теория по этому поводу. Я верю, что 6 000 лет назад Бог сотворил всё, как написано в Библии. 4 400 лет назад был потоп. После потопа вода сошла, континенты стабилизировались, и риф начал расти снова. И самому старому рифу должно быть около 4 000 лет. Так и есть. Я думаю, Библия права.
  rating: red
  verdict: '«Предсказание» снова сделано задним числом. Верхний слой рифа действительно молод: он начал расти, когда растаяли ледники и поднялось море, — но под ним лежат гораздо более древние рифы.'
  arguments:
  - young-earth-clocks

- id: lecture-1-5042
  start: 5042.7
  end: 5097.6
  text: Вот фотография Ниагарского водопада. В учебнике написано. Вот здесь. Каменный выступ над Ниагарским водопадом размывается на протяжении 9 900 лет. Как они знают об этом? Потому что камни обрушиваются с края водопада. Так происходит с любым водопадом. И поэтому водопад размывает почву. И поэтому почва иногда обваливается, и Ниагарский водопад движется назад. Он движется назад. Полтора метра в год. Соответственно музейному руководству. Но вы знаете, что под водопадом находится ущелье или большой каньон? Это ущелье 12 км длины. Если вы разделите 12 км на 1,5 м, то получится 9 900 лет. Это правильно.
  rating: green
  verdict: 'Верно: Ниагарский водопад отступает, и по длине ущелья его возраст оценивают примерно в 10–12 тысяч лет.'
  arguments:
  - niagara-erosion

- id: lecture-1-5098
  start: 5098.4
  end: 5117.2
  text: Но у меня есть вопрос. Ниагарский водопад вот здесь. Но он был севернее. Река течёт на север, водопад движется на юг. Если ему миллионы лет, то почему он ещё не у озера Эри? Почему Ниагарский водопад находится именно там?
  rating: red
  verdict: 'Геологи не говорят, что Ниагаре миллионы лет: река появилась после отступления последнего ледника, около 12 000 лет назад. Возраст водопада — не возраст Земли.'
  arguments:
  - niagara-erosion
  rhetoric:
  - straw-man

- id: lecture-1-5119
  start: 5119.1
  end: 5142.5
  text: Э-э, у меня есть теория по этому поводу. Я верю, что 6 000 лет назад Бог сотворил небо и землю, как говорит Библия. 4 400 лет назад был потоп. Когда вода стекала после потопа, в течение первых 10 минут половина залива была размыта. Выглядит, что для этого нужно 10 000 лет, но они забыли потоп. Это произошло за 4 400 лет.
  rating: red
  verdict: 'Нет следов того, что половину ущелья размыло за 10 минут: ущелье прорезал водопад, который начал отступать от Льюистона больше 12 тысяч лет назад, в конце ледникового периода.'
  arguments:
  - flood-runoff

- id: lecture-1-5143
  start: 5143.0
  end: 5170.2
  text: Когда идёт дождь, то 30% воды поступает в океаны. И эта вода приносит с собой минеральные соли. Испарение забирает пресную воду и оставляет солёную в океанах. И поэтому океаны приобретают соль. Каждый день. Но сегодня в океанах 3,6% воды. Это могло произойти за меньше чем 5 000 лет. Если Земле миллиарды лет, почему в океанах нет больше соли?
  rating: red
  verdict: Соль приносится в океан, но и уходит из него — в осадки, в породы дна, в соляные отложения, как вода в ванне с открытым сливом. Поэтому солёность океана почти не меняется и часами служить не может.
  arguments:
  - ocean-salt
  rhetoric:
  - cherry-picking

- id: lecture-1-5171
  start: 5171.8
  end: 5210.8
  text: 'Э-э, как-то раз атеист меня спросил: «Мистер Ховинд, вы говорите, что 4 400 лет назад был потоп?» Я сказал: «Да». Он сказал: «Скажите мне, как выжила пресноводная рыба?» Я сказал: «Не предполагаете ли вы, что при потопе была солёная вода?» Он сказал: «Сегодня же в океанах солёная вода». Я сказал: «Это сегодня, и вода становится более солёной каждый день. Я думаю, что при потопе вода была пресной». Тогда он сказал: «Как выжила морская рыба?» Я сказал: «Тогда, наверное, такой рыбы не было». Он сказал: «Ну, в океанах полно рыбы». Я сказал: «Да, это сегодня». Что произошло, так некоторые животные и рыбы адаптировались к солёной воде?'
  rating: red
  verdict: Вопрос о рыбах в потопе серьёзный, а ответ «морских рыб тогда не было» — догадка. Морские рыбы встречаются в ископаемых слоях, которые сам Ховинд относит к потопу.
  arguments:
  - flood-geology-general
  rhetoric:
  - personal-story

- id: lecture-1-5211
  start: 5211.2
  end: 5246.3
  text: 'У адаптации нет ничего общего с эволюцией. Абсолютно ничего. Сегодня есть пресноводные и морские аллигаторы. Я думаю, что у этих аллигаторов, наверное, был общий предок. Аллигатор. Тогда он сказал: «Это же эволюция». Я говорю: «Нет, вы запутались. Изменение от пресноводного аллигатора к морскому аллигатору очень незначительно по сравнению с тем, с тем, во что верите вы. Вы верите, что камни превратились в аллигаторов? Это будет большое изменение».'
  rating: red
  verdict: Ховинд сам признаёт, что пресноводные и морские крокодилы (в озвучке «аллигаторы») произошли от общего предка, а учёные именно это и называют эволюцией, так что «ничего общего» неверно. «Камни превратились в крокодилов» — не позиция науки, а карикатура.
  arguments:
  - microevolution-macro
  rhetoric:
  - podmena-ponyatij

- id: lecture-1-5247
  start: 5247.9
  end: 5267.0
  text: 'Вы когда-нибудь были в пещере, и где гид говорил: «Не трогайте сталактиты, они формируются миллионы лет»? Вы слышали что-то подобное? Они говорят, что пещера Нью-Мексика была сформирована на протяжении 250 млн лет. Они говорят, что нужно 500 лет для формирования одного сантиметра.'
  rating: orange
  verdict: Экскурсоводы иногда упрощают. Но возраст пещеры и скорость роста сталактитов — разные вещи, а скорость сильно зависит от количества воды и углекислого газа.
  arguments:
  - young-earth-clocks
  rhetoric:
  - appeal-to-doubt

- id: lecture-1-5268
  start: 5268.1
  end: 5302.7
  text: Нет, это неправда. Вот летучая мышь, покрытая камнем, перед тем, как она сгнила. Не думаете ли вы, что мышь сгнила бы раньше нескольких тысяч лет? Вот метровые сталактиты на памятнике Линкольну, построенном в 1922 году. Кстати, вот пятисантиметровые сталактиты на сарае в Пенсаколе, штат Флорида. Вот шахта, закрытая 55 лет назад. При открытии шахты в ней обнаружили множество сталактитов и сталагмитов, образовавшихся за 55 лет.
  rating: orange
  verdict: Натёки на бетоне и в шахтах растут быстро, потому что вода растворяет цемент или руду, — химия там другая. Пещерные сталактиты из известняка растут медленно, и их возраст проверяют по слоям и радиометрически.
  arguments:
  - young-earth-clocks
  rhetoric:
  - cherry-picking

- id: lecture-1-5303
  start: 5303.4
  end: 5339.4
  text: Вот два человека для сравнения. В штате Вайоминг у одного человека на земле был источник, бивший из земли. И он воткнул трубку, чтобы вода поступала наверх и стекала по сторонам. Это произошло в 1903 году. Когда вода стекала, часть воды испарялась и оставляла минеральный осадок. Может, вы видели ржавчину на умывальнике, откуда капает вода? Потом человек умер, и за трубку забыли. Вот как она выглядит сегодня. Около 100 лет спустя. Громадное каменное формирование.
  rating: orange
  verdict: Что у минеральных источников камень растёт быстро, верно. Но это особый случай с очень насыщенной водой, и он не опровергает медленного роста в обычных пещерах.
  arguments:
  - young-earth-clocks
  rhetoric:
  - cherry-picking

- id: lecture-1-5340
  start: 5340.6
  end: 5375.2
  text: Когда идёт дождь, почва с гор смывается в океаны. И происходят две вещи. Горы размываются, и океаны наполняются осадками. При нынешней скорости размывания континенты должны были бы размыться совершенно за 14 млн лет. Происходят оползни, обвалы, скольжения. Скользит земля наверх? Или всегда вниз? Всегда вниз, правда? Тогда почему ископаемые в 300 раз старше 14 млн до сих пор находятся над уровнем моря? Невозможно.
  rating: red
  verdict: 'Горы размываются, но и поднимаются: движение земной коры восполняет размыв. Поэтому скорость эрозии без учёта поднятия ничего не говорит о возрасте материков.'
  arguments:
  - young-earth-clocks
  rhetoric:
  - cherry-picking

- id: lecture-1-5375
  start: 5375.4
  end: 5383.4
  text: Простым фактом является то, что Земля молодая. Подавляющее доказательство подтверждает, что Бог сотворил всё 6 000 лет назад, как он и сказал.
  rating: red
  verdict: '«Подавляющих доказательств» мы не увидели: доводы выше переносят нынешнюю скорость в прошлое, как если бы по внуку, выросшему за лето на 10 см, считали его рост в 70 лет. Прошлую скорость учёные не придумывают, а читают по слоям льда, кораллов и кольцам деревьев.'
  arguments:
  - earth-age-billions

- id: lecture-1-5384
  start: 5384.1
  end: 5392.8
  text: Но я вам скажу, что меня беспокоит о вопросе возраста Земли. Если христианин начинает верить, что Земле миллиарды лет, это разрушит его веру в Библию.
  rating: purple
  verdict: 'Тревога Ховинда за веру людей понятна, и мы её разделяем. Но бывает иначе: юноше говорят «если Земле больше 6000 лет, Библия неправа», а в институте он узнаёт о древнем возрасте и решает, что неправа Библия. Мы не хотим, чтобы так случалось.'
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5393
  start: 5393.6
  end: 5438.0
  text: 'Так случилось с Кроуфордом Тоем. Вы, наверное, никогда не слышали о Кроуфорде Тое. Он был известным профессором Южной баптистской семинарии. Это был умный человек. Он любил Господа и Библию. Он жил в конце XVIII столетия. И это было проблемой, так как в конце XVIII столетия многие учили, что Земле много миллионов лет. Кроуфорд думал, что учёные уже доказали возраст Земли. И он начал сомневаться в Библии. У него было много трудностей. Он чуть не женился на известной южнобаптистской миссионерке в Китае Лотти Мун. На одном из своих уроков Кроуфорд сказал: «Библия учит о шестидневном творении. В этом месте Библия просто заблуждается».'
  rating: purple
  verdict: 'Кроуфорд Той действительно пришёл к сомнениям и ушёл из баптистской семинарии, но его путь определили многие вопросы библейской критики, а не один возраст Земли. Один пример — не правило: многие христиане принимали древнюю Землю и не теряли веры.'
  arguments:
  - evolution-destroys-faith
  rhetoric:
  - personal-story

- id: lecture-1-5440
  start: 5440.9
  end: 5451.3
  text: А Библия ошибается? Кроуфорд, может, твоя теория ошибается? Кроуфорд, может, тебе промыли мозги? Промыть мозги очень легко.
  rating: orange
  verdict: Сказать «тебе промыли мозги» проще, чем разобрать доводы человека, но это не ответ на них.
  rhetoric:
  - loaded-language

- id: lecture-1-5452
  start: 5452.8
  end: 5492.8
  text: 'Завтра в школах будут обмануты миллионы детей. Миллионы. Учитель садика или школы завтра скажет: «Сегодня, дети, мы почитаем о доисторических животных». И на первой странице книжки будут нарисованы динозавры. В первом предложении будет написано: «Миллионы лет назад». Правда? Вы думаете, есть такие книги в библиотеке в этом городе? И если они верят в это, это им промыли мозги. Хотя даже они ещё не умеют читать.'
  rating: orange
  verdict: Детские книги о динозаврах передают выводы науки, а не обман. С выводами можно спорить, но называть их «промыванием мозгов» — не довод.
  arguments:
  - earth-age-billions
  rhetoric:
  - loaded-language

- id: lecture-1-5494
  start: 5494.0
  end: 5517.7
  text: Их учат сомневаться в Библии до того, как они могут её прочитать. Это называет Иисуса обманщиком. Иисус сказал, что создание Адама было началом В этой детской книжке говорится не тысячи лет, не миллионы лет — миллиарды лет. Иисус сказал, что создание Адама было началом. Обманывал ли он? Кто-то неправ.
  rating: purple
  verdict: Слова Иисуса «от начала создания» (Мк 10:6) — о браке. Понимать их как запрет на древнюю Землю — толкование Ховинда, и выбор «Иисус или учебник» ложен.
  arguments:
  - genesis-literal
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5518
  start: 5518.3
  end: 5534.1
  text: Завтра в этом городе сотням детей учителя скажут, что мы были бактерией. Потом мы медленно превратились в амёбу. Потом медленно эта амёба стала человеком. Эволюция. И это разрушит веру детей в Библию.
  rating: red
  verdict: 'Наука не говорит, что «амёба стала человеком»: амёба — современный организм, а не наш предок. И знание эволюции веру не разрушает: верующий генетик Фрэнсис Коллинз, руководивший проектом «Геном человека», принимает её и верит во Христа.'
  arguments:
  - evolution-destroys-faith
  rhetoric:
  - straw-man

- id: lecture-1-5534
  start: 5534.8
  end: 5550.2
  text: 'Библия говорит: «Смотрите, братья, чтобы кто не увлёк вас философией и пустым обольщением, по преданию человеческому, по стихиям мира, а не по Христу». Если ваш ребёнок будет ходить в такую школу 15 или 20 лет, каким будет его взгляд на мир? Он поверит в эволюцию.'
  rating: purple
  verdict: Предостережение Павла от «пустого обольщения» (Кол 2:8) мы принимаем. Но школьная биология изучает, как устроены и как меняются живые существа, а не учит, во что верить и как жить.
  arguments:
  - evolution-destroys-faith

- id: lecture-1-5550
  start: 5550.5
  end: 5558.6
  text: Дьявол знает, что если верно творение, то существует Создатель. Если верна эволюция, то Создателя нет.
  rating: red
  verdict: Эволюция описывает, как развивалась жизнь, и ничего не говорит о том, есть ли Творец. Многие учёные-христиане принимают эволюцию и верят в Творца, например геолог и священник Глеб Каледа.
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5560
  start: 5560.6
  end: 5575.3
  text: Если верно творение, существуют правила. Плохо и хорошо. Если верна эволюция, то правил нет. Если верно творение, существует смысл жизни. Если верна эволюция, в жизни смысла нет.
  rating: red
  verdict: 'Из теории эволюции не следует, что правил и смысла нет: биология отвечает на вопрос «как», а не «зачем» и «как поступать». Мораль и смысл мы, христиане, находим в Боге при любом ответе о происхождении видов.'
  arguments:
  - evolution-morality
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5576
  start: 5576.1
  end: 5600.9
  text: Если верно творение, человек — это падшее существо, и он нуждается в Спасителе. Но если верна эволюция, мы не падшее существо, нам не нужен Спаситель. Спасать от чего? Если верна эволюция, объясните мне, что такое грех. Что правильно или что неправильно? Что неправильно? Всё правильно.
  rating: purple
  verdict: Мы тоже верим, что человек пал, грех настоящий и Спаситель нужен каждому. Христиане, принимающие эволюцию, верят в это же; спорят они о том, как именно было грехопадение, и это законный богословский спор, а не отказ от Евангелия.
  arguments:
  - evolution-morality
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5601
  start: 5601.8
  end: 5609.2
  text: 'Один профессор сказал: «Нет ничего абсолютного». Я спросил его: «А вы абсолютно уверены?»'
  rating: neutral
  verdict: Удачный ответ на лозунг «нет ничего абсолютного»; с ним можно согласиться, к вопросу об эволюции он не относится.
  rhetoric:
  - personal-story

- id: lecture-1-5612
  start: 5612.4
  end: 5640.9
  text: Если верно творение, то человек принёс смерть в мир. И смерть — это ужасная вещь. Смерть — это проклятие. Но если верна эволюция, то смерть принесла человека в мир. И смерть — это чудесная вещь. Это как мы продвигаемся вперёд. Один вид развивается, другие умирают. Низшие умирают. Лучшие преуспевают. Низшие умирают. На этом основана эволюция.
  rating: purple
  verdict: 'Что смерть — враг и проклятие, мы тоже верим. Но эволюция не называет смерть «чудесной»: это описание того, как меняются живые существа, а не оценка; а о смерти животных до грехопадения христиане спорят со времён отцов Церкви.'
  arguments:
  - death-before-fall
  rhetoric:
  - straw-man

- id: lecture-1-5641
  start: 5641.4
  end: 5649.5
  text: На этом основана гитлеровская Германия. Лучшая раса выживает. Все остальные должны быть уничтожены. Та же философия.
  rating: red
  verdict: Нацисты действительно ссылались на «борьбу за выживание». Но естественный отбор описывает, что происходит в природе, а не предписывает, как поступать людям; использование научных слов злодеями не делает науку их философией.
  arguments:
  - darwin-hitler

- id: lecture-1-5650
  start: 5650.1
  end: 5670.1
  text: Если верно творение, есть жизнь после смерти. Если верна эволюция, нет жизни после смерти. Если верно творение, вы можете знать будущее. Вы можете знать, куда вы попадёте. Но не с эволюцией. А вы знаете ваше будущее? Куда вы идёте? Вы идёте на небо?
  rating: orange
  verdict: Вопрос о жизни после смерти — главный, и мы отвечаем на него верой во Христа. Но биология о загробной жизни ничего не говорит ни «за», ни «против»; противопоставление здесь ложное.
  arguments:
  - evolution-religion
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-1-5670
  start: 5670.7
  end: 5679.7
  text: 'Вы скажете: «Брат Ховинд, если Земле только 6 000 лет, когда жили динозавры?» Мы поговорим об этом попозже. Жили они до 900 лет? Да, они жили.'
  rating: neutral
  verdict: 'Анонс следующих тем: динозавры и долголетие людей до потопа.'

- id: lecture-1-5681
  start: 5681.8
  end: 5697.9
  text: Ну, а давайте предположим, что люди нового мирового порядка достигнут своей цели. Предположим, что они сократят мировое население до полумиллиарда. Следующие шесть месяцев Предположим, что мы погибнем. Где вы будете? Вы будете мёртвыми долгое время.
  rating: orange
  verdict: Повтор непроверяемого утверждения о заговоре «нового мирового порядка». Само напоминание о смерти и суде — призыв, с которым мы согласны.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-1-5699
  start: 5699.3
  end: 6133.8
  text: 'Когда-то и я умру. Я постараюсь, чтобы это было моим последним делом, но это случится. Это случится с вами тоже. Куда вы попадёте? Если вы не уверены, что вы спасены, вам нужно отдать своё сердце Иисусу. Если вы спасены, вы должны делать что-то для Господа. Займитесь и приведите кого-то ко Христу. Спасибо за просмотр этой видеокассеты. Если у вас появились какие-то вопросы, позвоните или напишите, мы будем рады помочь. Мы хотим поддержать вашу веру в Библию. На этой кассете мы говорили о возрасте Земли. Интересно узнавать о сотворении и эволюции. Но намного важнее это знать, что вы попадёте на небо. Если вы не приняли Иисуса или не уверены, что вы попадёте на небо… Я хочу рассказать, что говорит Библия о том, как попасть на небо. Вы не обязаны делать, что говорит Бог, но вы должны знать, что нужно делать. Когда я учился в школе, я ходил во многие церкви. Но я не был уверен, что я иду на небо. Я не был спасён. И когда однажды мой друг спросил меня: «Кент, а ты попадёшь на небо?» Я сказал: «Я не знаю». Он сказал: «Хочешь, я возьму Библию и покажу, как можно узнать?» Я сказал: «Да, я хочу узнать». Он показал мне три стиха. И впервые в жизни я понял, чего хочет Бог. В Римлянам 3:23 написано: «Потому что все согрешили и лишены славы Божией». Все грешники. Мой друг сказал: «Кент, ты грешник. Ты делал плохое?» И Библия говорит, что все грешники. Одни хуже других в человеческих глазах, но перед Богом один грех делает вас грешником. Если вы нарушили хоть один из законов, то вы являетесь грешником. Римлянам 6:23 написано: «Ибо возмездие за грех — смерть». Возмездие — это то, что мы заслуживаем. И за грех вы заслуживаете смертельное наказание. Вы заслуживаете умереть и пойти в ад. Но Бог не хочет, чтобы вы пошли в ад. Чтобы быть справедливым, Бог должен всех, кто согрешил, послать в ад. Но Бог придумал выход. Иисус Христос умер на кресте, чтобы заплатить за ваши грехи. И теперь вы можете принять, что он уже сделал для вас. Поэтому его смерть платит за ваш грех. Мой друг сказал, что я заслуживаю умереть и пойти в ад. Но он сказал дальше продолжение стиха. «А дар Божий — жизнь вечная во Иисусе Христе, Господе нашем». Вечную жизнь нельзя получить через церковь, через крещение, через хорошую жизнь. Её можно получить только через Иисуса Христа. Мы получили от наших родителей бесплатный дар физической жизни. Кто-то прошёл через боль, заплатил деньги, чтобы мы могли получить жизнь. Рождение занимает несколько минут. Но возрастание берёт долгое время. И рождение в семью Бога занимает несколько минут. Но возрастание в семью Бога занимает много времени и усилий. Как чтение Библии, посещение церкви, молитва. Они помогают стать хорошим христианином, но они не делают из вас христианина. Стать христианином можно только, если кто-то сделает за вас работу, если Христос войдёт в ваше сердце и сделает из вас нового человека. В феврале шестьдесят девятого года мой друг сказал: «Кент, ты грешник. Соответственно Библии, ты заслуживаешь умереть и пойти в ад». Он сказал: «Но Бог хочет дать тебе подарок». Вечную жизнь. Ты заслуживаешь вечную погибель. Бог хочет дать тебе вечную жизнь. Я сказал: «Как можно получить этот подарок?» Он сказал: «В Римлянам 10:13 написано: „Ибо всякий — любой — кто призовёт имя Господне, спасётся“». Заметьте, здесь не говорится: «Может спастись». Здесь говорится: «Спасётся». Каждый, кто принимает Иисуса Христа, призывает имя Его. В первой главе Иоанна говорится, что если вы принимаете его, то вы становитесь его дитём. Сыном Бога. В третьей главе Иоанна говорится, что вы должны родиться свыше. Всё взаимосвязано. Когда вы принимаете Иисуса как вашего Спасителя, принимаете Его в своё сердце… Когда вы принимаете то, что он сделал для вас… Вы становитесь дитя Бога. Вы получаете новое рождение. И это занимает всего несколько минут, чтобы сказать: «Иисус, я грешник, прости меня». В феврале шестьдесят девятого года я сказал: «Иисус, я грешник. Я знаю, что ты умер за меня на кресте. Прости меня. Я хочу, чтобы ты жил в моём сердце. Спаси меня и сделай из меня нового человека». Тогда я принял Христа как Спасителя. И этот день был моим духовным днём рождения. Я стал дитём божьим. Если я делаю что-то неправильно, я не могу пойти в ад, потому что я получил дар вечной жизни. И эта жизнь длится вечно. Ну, как ребёнок Бога я могу быть наказан. Теперь я в семье Бога, и отношение ко мне изменилось. Теперь я не погибаю, но получаю наказание за грехи. И теперь за мои грехи заплачено. И когда я говорю, что я иду на небо, это не значит, что я хороший. Это значит, что я уже прощён. Если вы примете Иисуса Христа как своего Спасителя прямо сейчас, Он простит вас, спасёт вас и возьмёт вас на небо. В этой сессии мы говорили о сотворении, об эволюции, о динозаврах и других интересных вещах. Но это не будет иметь никакого значения, если вы пойдёте в ад. Проверьте своё сердце. Если вы не приняли Христа как Спасителя, склонитесь и пригласите его в сердце прямо сейчас. Помолитесь простой молитвой, Бог знает ваше сердце. Если вы хотите принять Христа, помолитесь вместе со мной. Дорогой Господь Иисус. Я знаю, что я грешник. Я верю, что ты умер за меня на кресте. Прости меня. Я принимаю тебя как моего Спасителя. Во имя Иисуса Христа. Аминь. В Римлянам 10:13 говорится: «Ибо всякий, кто призовёт имя Господне, спасётся». Если вы только что приняли Христа, Бог обещал, что вы пойдёте на небо. Обещания Бога вечны. Если вы сегодня приняли Христа, напишите мне: моё имя и адрес появятся на экране. Дайте мне знать, что вы покаялись, и мы возрадуемся вместе. Принятие Христа и духовное рождение — это только начало. Возрастание требует усилий. Читать Библию, ходить в церковь, говорить другим о Христе. Я буду рад помочь. Большое спасибо. Я надеюсь, вам понравились видеосерии.'
  rating: neutral
  verdict: Евангельский призыв, свидетельство об обращении и молитва. Мы разделяем призыв довериться Христу; к научным доводам эта часть не относится.
