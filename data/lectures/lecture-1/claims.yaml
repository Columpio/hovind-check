- id: lecture-1-355
  start: 355.0
  end: 377.7
  text: "Сатана — это обманщик… многие религии мира поверили в его обман. В официальной доктрине мормонов говорится: мы можем стать богами. Если вы хорошая жена-мормонка, то вы будете вечно беременны в раю."
  rating: orange
  verdict: "О мормонах сказано в целом верно: их учение говорит, что верные «станут богами». Но «вечно беременны» — карикатура для смеха. Мормоны не принимают Никейский символ веры, и к спору о науке это не относится."
  details: |
    В учебнике Церкви Иисуса Христа Святых последних дней действительно написано, что возвысившиеся «станут богами» и будут иметь «вечное потомство» ([«Принципы Евангелия», гл. 47](https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-47-exaltation?lang=eng)). Так что по существу Ховинд прав. Мы не защищаем это учение: оно расходится с вероучением исторических церквей.

    Но обратите внимание на приём. Вместо объяснения звучит смешная картинка («вечно беременны»), зал смеётся, и вместе со смехом слушатель «проглатывает» следующий шаг: раз мормоны — значит, и все, кто говорит «станем как боги», обмануты сатаной. В следующем утверждении этот ярлык будет переклеен на учение, общее для православных, католиков и многих протестантов.
  rhetoric: [vysmeivanie-vmesto-dovoda]

- id: lecture-1-380
  start: 380.2
  end: 395.1
  text: "В официальной доктрине Католической Церкви — 99% католиков об этом не знают — говорится, что они могут стать богами. Это обман дьявола, что человек может стать богом."
  rating: purple
  verdict: "Ховинд путает две разные вещи. Древнее учение Церкви об обожении говорит, что человек призван стать «богом по благодати» в единении со Христом, но никогда — Богом по природе. Это учение отцов Церкви, общее для православных и католиков."
  details: |
    **Что действительно написано.** Катехизис Католической Церкви (§ 460) приводит слова святителя Афанасия Великого: «Сын Божий стал человеком, чтобы мы стали богами» ([Катехизис, § 460](https://www.vatican.va/archive/ENG0015/__P1J.HTM)). То есть цитата у Ховинда не выдуманная. Но смысл её он передаёт неверно.

    **Что это значит.** Это учение называется **обожением**. Православная энциклопедия объясняет: человек по благодати Божьей постепенно уподобляется Богу, становясь «богом по благодати», но «не становится Богом по существу» ([Православная энциклопедия, «Обожение»](https://www.pravenc.ru/text/2578067.html)). Его опора в Писании — 2 Пет 1:4: мы призваны стать «причастниками Божеского естества», и слова Христа «Я сказал: вы боги» (Ин 10:34, Пс 81:6). Первым из отцов эту мысль ясно выразил священномученик Ириней Лионский во II веке: Сын Божий стал Сыном человеческим, «чтобы человек сделался сыном Божиим» (там же).

    Учение это не только католическое. Это основа и православного богословия. Даже Жан Кальвин, один из отцов Реформации, писал о 2 Пет 1:4, что цель Евангелия — сделать нас подобными Богу и, «если можно так сказать, обожить нас», и тут же уточнял: речь о качестве, а не о сущности ([Кальвин, комментарий на 2 Пет 1:4](https://biblehub.com/library/calvin/commentaries_on_the_catholic_epistles/2_peter_1_1-4.htm)).

    **Пример.** Железо в огне раскаляется и светится, как огонь, но не перестаёт быть железом. Этим образом отцы Церкви и объясняли обожение.

    **Почему это важно.** Ложь змея — стать «как Бог» *без Бога*, украсть Его место. Христианская надежда — стать *причастником* Бога по Его дару. Назвать второе «обманом дьявола» значит невольно осудить веру Иринея, Афанасия и почти всей древней Церкви. Мы понимаем, что Ховинд, скорее всего, этого не знал. Протестанты могут по-разному относиться к слову «обожение», и это законный богословский спор. Но называть его «доктриной сатаны» несправедливо.
  rhetoric: [podmena-ponyatij]

- id: lecture-1-396
  start: 396.0
  end: 436.7
  text: "В четырнадцатой главе Исайи Люцифер сказал: «Взойду на небо… буду подобен Всевышнему». Видите, Сатана хочет быть Богом… он злой на нас, потому что мы сотворены по подобию Божьему."
  rating: purple
  verdict: "Мысль о том, что дьявол ненавидит людей как образ Божий, разделяют многие христиане. Толкование Ис 14 о падении сатаны — древняя традиция, хотя в самом тексте пророк обличает царя Вавилонского."
  details: |
    В Ис 14 пророк произносит насмешливую песнь над царём Вавилонским: «Как упал ты с неба, денница, сын зари!» Многие христианские авторы, начиная с древности, видели в этих словах ещё и образ падения сатаны. Слово «Люцифер» пришло из латинского перевода слова «денница» ([Православная энциклопедия, «Люцифер»](https://www.pravenc.ru/text/2561096.html)).

    Значит, Ховинд здесь пользуется одним из традиционных прочтений. Это законная трактовка, хотя не единственная: важно помнить, что прямой смысл главы — суд над земным царём. На доводы о науке это место не влияет.

- id: lecture-1-436
  start: 436.9
  end: 453.4
  text: "Гитлер сказал: «Если говорить ложь во всеуслышание достаточно долго и часто, народ поверит лжи». Люди больше расположены верить в большую ложь, чем в маленькую… Вы должны перемешать обман и правду вместе."
  rating: orange
  verdict: "Мысль верная: обман, смешанный с правдой, убедительнее. Но цитата приписана Гитлеру неточно: о «большой лжи» он писал, обвиняя в ней своих врагов, а фразы «повторяй ложь часто, и в неё поверят» у него не найдено."
  details: |
    В книге «Майн кампф» Гитлер действительно писал, что массы легче верят «большой лжи», чем маленькой, но приписывал этот приём евреям, которых обвинял в поражении Германии. Фразу «если повторять ложь достаточно долго, в неё поверят» обычно приписывают Геббельсу, но источника у неё нет ни у того, ни у другого. Это разбирает историк пропаганды Рэндалл Битверк ([«Ложные нацистские цитаты»](https://bytwerk.com/gpa/falsenaziquotations.htm)).

    Почему это важно, если мысль верна? Имя Гитлера здесь работает как оценка: тема «обмана» с первых минут связана с самым страшным злом XX века. Позже в лекции эта связь будет перенесена на школьные учебники.

    **Совет читателю.** Правило «обман, смешанный с правдой, убедителен» — хорошее. Пользуйтесь им ко всему, что слышите: к рекламе, к учебникам, к этой лекции — и к нашему разбору тоже. Поэтому у каждого нашего утверждения есть ссылки, которые можно проверить.
  rhetoric: [unverified-quote]

- id: lecture-1-454
  start: 454.2
  end: 504.2
  text: "У меня есть два старших брата… Когда мне было шесть лет… я взял последний банан из тарелки… Они добиваются своего либо силой, либо обманом."
  rating: neutral
  verdict: "Начало истории из детства. На доводы не влияет."

- id: lecture-1-505
  start: 505.4
  end: 521.5
  text: "«Кент, ты знаешь, из чего состоят бананы?» Я сказал: нет. Мне было только шесть лет. Было доказано, что мозг не начинает развиваться, пока ребёнку нет 18 или 20. Вы согласитесь со мной, родители?"
  rating: orange
  verdict: "Это шутка, но подана как научный факт («было доказано»). На деле мозг активно развивается с первых недель после зачатия, а к 18–25 годам заканчивает созревать."
  details: |
    В зале смеются, и шутка понятна. Но обратите внимание на оборот **«было доказано»**: он звучит как ссылка на науку, хотя ни кто доказал, ни где — не сказано. Слушатель привыкает принимать такие слова на веру.

    На самом деле Национальный институт психического здоровья США пишет: мозг перестаёт расти в размерах к раннему подростковому возрасту, а «заканчивает развиваться и созревать к середине или концу третьего десятка лет» ([NIMH: «Мозг подростка»](https://www.nimh.nih.gov/health/publications/the-teen-brain-7-things-to-know)). То есть в 18–20 лет мозг не *начинает*, а *завершает* развитие.

    Полезная привычка: когда слышите «учёные доказали», «всем известно», спросите себя: кто, где и как это проверить?
  rhetoric: [appeal-authority-unnamed]

- id: lecture-1-523
  start: 523.0
  end: 559.8
  text: "«В Южной Америке живут пауки с длинными ногами… Поэтому банан — это ноги паука»… «Разрежь этот банан… и ты увидишь чёрные ножки пауков». …После этого я не ел бананы около трёх лет."
  rating: neutral
  verdict: "Продолжение истории про банан. На доводы не влияет."

- id: lecture-1-560
  start: 560.5
  end: 571.3
  text: "Были ли вы обмануты? Я бы никогда не поверил обману, если бы в банане не было чёрных точек. Если вы хотите обмануть кого-то, перемешайте обман вместе с правдой."
  rating: green
  verdict: "Верно и хорошо сказано: самый убедительный обман опирается на кусочек правды. Это правило стоит помнить, слушая любую лекцию."

- id: lecture-1-572
  start: 572.4
  end: 589.0
  text: "Таким образом уничтожают крыс. Вы не даёте крысе яд. Вы даёте крысе тарелку хорошей пищи… Очень мало яда."
  rating: neutral
  verdict: "Образ подготовлен для будущего вывода: «учебники — как крысиный яд». Сам по себе пример про отраву верен."

- id: lecture-1-589
  start: 589.6
  end: 623.6
  text: "Его используют для продажи сигарет «Мальборо». Их перемешивают с ковбоями… Все ли ковбои курят «Мальборо»? Нет… Но они хотят, чтобы люди поверили, что между ними есть что-то общее."
  rating: green
  verdict: "Верное наблюдение о рекламе: она связывает товар с тем, что нам нравится, хотя связи на деле нет."

- id: lecture-1-627
  start: 627.0
  end: 688.4
  text: "Поэтому, как Гитлер сказал, если говорить ложь достаточно долго… народ поверит лжи. То же самое происходит и с пивом… «Вам не нравится пиво?» Я сказал: «Я не знаю, я никогда не пробовал»… Вы когда-нибудь подставляли голову под грузовик?… не нужно всё пробовать, чтобы узнать, хорошо это или плохо."
  rating: neutral
  verdict: "Ещё один пример про рекламу, личная история и шутка; на доводы о науке не влияют. Цитата снова приписана Гитлеру неточно — см. разбор на 7:16."
  rhetoric: [unverified-quote]

- id: lecture-1-689
  start: 689.5
  end: 723.4
  text: "В учебниках государственных школ находится много хорошей науки. Но вместе с хорошей наукой замешан обман. Яд, который уничтожает детей… Проблема — это замешанный обман."
  rating: orange
  verdict: "Что в учебниках много хорошей науки, верно. Но слово «яд» звучит раньше, чем показано, в чём именно обман. Слушателя сначала настраивают бояться, а доводы обещают потом."
  details: |
    Вся история про банан, крысу, «Мальборо» и пиво нужна для этой минуты. Ховинд построил цепочку: обман смешан с правдой → крысиный яд → реклама → **учебники**. К этому моменту слушатель уже согласен, что «обман с правдой» опасен, и готов принять, что учебники — тоже такой «яд».

    Но вспомните его же правило: обман убедительнее всего, когда в нём есть кусочек правды. Сравнение «учебник = крысиный яд» действует сильно, потому что первая часть верна: отрава и правда прячут в хорошей еде. Только из этого никак не следует, что в учебнике спрятана отрава. Это нужно *показать* на конкретных примерах и с источниками.

    **Пример.** Можно сказать: «В этом пироге есть яд, как в приманке для крыс». Прежде чем выбросить пирог, разумный человек спросит: «Какой именно яд? Кто проверял?» Пока ответа нет, это не довод, а только тревога.

    Честно скажем: в школьных учебниках бывают упрощения и устаревшие примеры, и их исправляют. Конкретные «обманы», которые Ховинд назовёт дальше, мы разберём по одному, когда он их назовёт.
  rhetoric: [loaded-language, false-analogy]
