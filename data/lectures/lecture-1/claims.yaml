# Пилот (этап 4): лекция 1, 0:50–12:03. Черновик для согласования с владельцем.
# Формат: data/README.md. Время — по локальному файлу = YouTube YXHGTPGcnzE.
# rating: green | neutral | orange | red | purple

- id: lecture-1-50
  start: 50.4
  end: 167.0
  text: "Моё имя Кент Ховинд, я из Пенсаколы, Флориды. Я преподавал науку в старших классах 15 лет… Я верю, что Библия является безошибочным и вдохновлённым словом живого Бога… У меня есть три цели… укрепить вашу веру в слово Божье… если вы ещё не спасены, я хочу, чтобы вы были спасены… Идёт война… Это не моя жена. Это только её фотография… У нас трое детей… Есть четыре важных вопроса… Каждая религия мира, даже атеизм — это тоже религия. Все религии стараются ответить на эти вопросы."
  rating: neutral
  verdict: "Представление, исповедание веры и цели семинара. Мы тоже верим, что Писание — Слово Божье, и разделяем цели: укрепить веру и привести ко Христу. Что у каждого, даже у неверующего, есть свои ответы на главные вопросы жизни, тоже верно. Спор у нас не о вере и не о биографии лектора, а о том, что говорит наука и как читать первые главы Бытия."
  rhetoric: [self-authority]

- id: lecture-1-167
  start: 167.4
  end: 197.8
  text: "Существует два взгляда на мир. Некоторые… говорят: «Удивительно, этот мир произошёл из ничего при большом взрыве». Это гуманистическое мировоззрение, в котором человек — это бог. Другие… говорят: «…значит, существует умный Создатель»… Одно из этих мировоззрений неверно, и они находятся в войне."
  rating: red
  verdict: "Ложный выбор. Теорию Большого взрыва предложил католический священник Жорж Леметр, и миллионы христиан принимают её, веря в Творца. «Большой взрыв» — это не мировоззрение, а научная модель, а гуманизм не учит, что «человек — бог»."
  arguments: [big-bang]
  rhetoric: [lozhnaya-dilemma, podmena-ponyatij, straw-man]

- id: lecture-1-199
  start: 199.4
  end: 241.0
  text: "Если верна эволюция, то вы являетесь протоплазмой, которую выкинуло на берег… вы являетесь одним из загрязнителей окружающей среды. Кстати, если эволюция верна, это мышление является нормальным. Необходимо уничтожить человечество…"
  rating: red
  verdict: "Из теории эволюции не следует ни что человек ничего не стоит, ни что человечество надо уничтожить. Биология отвечает на вопрос «как возникли живые существа», а не «сколько стоит человек» и «что нам делать»."
  arguments: [evolution-morality]
  rhetoric: [straw-man, loaded-language]

- id: lecture-1-241
  start: 241.6
  end: 269.6
  text: "Если верна эволюция, то вы появились из космического взрыва около 20 млрд лет назад… в жизни нет смысла. Делайте всё, что вам нравится… вас закопают в могилу и ваше тело превратится в растение или ещё что-то."
  rating: red
  verdict: "Здесь смешаны три разные вещи: биология (эволюция), физика (Большой взрыв) и вопрос о смысле жизни. Эволюция не учит, что «смысла нет», а в землю после смерти ложится и тело верующего."
  arguments: [evolution-morality]
  rhetoric: [podmena-ponyatij, straw-man]

- id: lecture-1-270
  start: 270.5
  end: 283.2
  text: "Но Библия говорит, что вначале сотворил Бог небо и землю. Если это верно, то… на эти вопросы появляются совершенно другие ответы. Теперь нам необходимо узнать, кто Бог."
  rating: green
  verdict: "Верно. Вера в Бога-Творца действительно меняет ответы на вопросы о смысле и ценности жизни. С этим согласны и христиане, принимающие эволюцию."

- id: lecture-1-283
  start: 283.7
  end: 316.4
  text: "Дьявол подошёл к Еве… «Подлинно ли сказал Бог…?» …Сатана всегда так делает, он хочет, чтобы мы сомневались в словах Бога… «вы будете как боги»."
  rating: neutral
  verdict: "Пересказ третьей главы Бытия. Что искуситель сеет сомнение в слове Божьем, признают все христиане."

- id: lecture-1-318
  start: 318.2
  end: 338.5
  text: "И прямо там, в Эдемском саду, и зародилась вся идея эволюции. Эволюцию не придумал Дарвин. Её придумал Сатана… «мы развиваемся, мы становимся больше, лучше, сильнее, умнее. И в один день мы будем путешествовать по Вселенной…»"
  rating: red
  verdict: "Ложь змея была в том, что человек станет «как Бог» без Бога, через непослушание. Теория эволюции говорит о другом: как меняются живые существа. И она не учит, что всё становится «лучше и сильнее»."
  arguments: [evolution-religion]
  rhetoric: [podmena-ponyatij, straw-man]

- id: lecture-1-340
  start: 340.2
  end: 352.2
  text: "«…думаете ли вы, что существует разумная жизнь на других планетах?» Я говорю: нет. Я был учителем 15 лет и не видел много разумной жизни на этой планете."
  rating: neutral
  verdict: "Шутка вместо ответа на вопрос. На доводы не влияет."

- id: lecture-1-355
  start: 355.0
  end: 377.7
  text: "Сатана — это обманщик… многие религии мира поверили в его обман. В официальной доктрине мормонов говорится: мы можем стать богами. Если вы хорошая жена-мормонка, то вы будете вечно беременны в раю."
  rating: orange
  verdict: "О мормонах сказано в целом верно: их учение говорит, что верные «станут богами». Но «вечно беременны» — карикатура для смеха. Мормоны не принимают Никейский символ веры, и к спору о науке это не относится."
  rhetoric: [vysmeivanie-vmesto-dovoda]

- id: lecture-1-380
  start: 380.2
  end: 395.1
  text: "В официальной доктрине Католической Церкви — 99% католиков об этом не знают — говорится, что они могут стать богами. Это обман дьявола, что человек может стать богом."
  rating: purple
  verdict: "Ховинд путает две разные вещи. Древнее учение Церкви об обожении говорит, что человек призван стать «богом по благодати» в единении со Христом, но никогда — Богом по природе. Это учение отцов Церкви, общее для православных и католиков."
  rhetoric: [podmena-ponyatij]

- id: lecture-1-396
  start: 396.0
  end: 436.7
  text: "В четырнадцатой главе Исайи Люцифер сказал: «Взойду на небо… буду подобен Всевышнему». Видите, Сатана хочет быть Богом… он злой на нас, потому что мы сотворены по подобию Божьему."
  rating: purple
  verdict: "Мысль о том, что дьявол ненавидит людей как образ Божий, разделяют многие христиане. Толкование Ис 14 о падении сатаны — древняя традиция, хотя в самом тексте пророк обличает царя Вавилонского."

- id: lecture-1-436
  start: 436.9
  end: 453.4
  text: "Гитлер сказал: «Если говорить ложь во всеуслышание достаточно долго и часто, народ поверит лжи». Люди больше расположены верить в большую ложь, чем в маленькую… Вы должны перемешать обман и правду вместе."
  rating: orange
  verdict: "Мысль верная: обман, смешанный с правдой, убедительнее. Но цитата приписана Гитлеру неточно: о «большой лжи» он писал, обвиняя в ней своих врагов, а фразы «повторяй ложь часто, и в неё поверят» у него не найдено."
  rhetoric: [unverified-quote]

- id: lecture-1-454
  start: 454.2
  end: 504.2
  text: "У меня есть два старших брата… Когда мне было шесть лет… я взял последний банан из тарелки… Они добиваются своего либо силой, либо обманом."
  rating: neutral
  verdict: "Начало истории из детства. На доводы не влияет."

- id: lecture-1-505
  start: 505.4
  end: 521.5
  text: "«Кент, ты знаешь, из чего состоят бананы?» Я сказал: нет. Мне было только шесть лет. Было доказано, что мозг не начинает развиваться, пока ребёнку нет 18 или 20. Вы согласитесь со мной, родители?"
  rating: orange
  verdict: "Это шутка, но подана как научный факт («было доказано»). На деле мозг активно развивается с первых недель после зачатия, а к 18–25 годам заканчивает созревать."
  rhetoric: [appeal-authority-unnamed]

- id: lecture-1-523
  start: 523.0
  end: 559.8
  text: "«В Южной Америке живут пауки с длинными ногами… Поэтому банан — это ноги паука»… «Разрежь этот банан… и ты увидишь чёрные ножки пауков». …После этого я не ел бананы около трёх лет."
  rating: neutral
  verdict: "Продолжение истории про банан. На доводы не влияет."

- id: lecture-1-560
  start: 560.5
  end: 571.3
  text: "Были ли вы обмануты? Я бы никогда не поверил обману, если бы в банане не было чёрных точек. Если вы хотите обмануть кого-то, перемешайте обман вместе с правдой."
  rating: green
  verdict: "Верно и хорошо сказано: самый убедительный обман опирается на кусочек правды. Это правило стоит помнить, слушая любую лекцию."

- id: lecture-1-572
  start: 572.4
  end: 589.0
  text: "Таким образом уничтожают крыс. Вы не даёте крысе яд. Вы даёте крысе тарелку хорошей пищи… Очень мало яда."
  rating: neutral
  verdict: "Образ подготовлен для будущего вывода: «учебники — как крысиный яд». Сам по себе пример про отраву верен."

- id: lecture-1-589
  start: 589.6
  end: 623.6
  text: "Его используют для продажи сигарет «Мальборо». Их перемешивают с ковбоями… Все ли ковбои курят «Мальборо»? Нет… Но они хотят, чтобы люди поверили, что между ними есть что-то общее."
  rating: green
  verdict: "Верное наблюдение о рекламе: она связывает товар с тем, что нам нравится, хотя связи на деле нет."

- id: lecture-1-627
  start: 627.0
  end: 688.4
  text: "Поэтому, как Гитлер сказал, если говорить ложь достаточно долго… народ поверит лжи. То же самое происходит и с пивом… «Вам не нравится пиво?» Я сказал: «Я не знаю, я никогда не пробовал»… Вы когда-нибудь подставляли голову под грузовик?… не нужно всё пробовать, чтобы узнать, хорошо это или плохо."
  rating: neutral
  verdict: "Ещё один пример про рекламу, личная история и шутка; на доводы о науке не влияют. Цитата снова приписана Гитлеру неточно — см. разбор на 7:16."
  rhetoric: [unverified-quote]

- id: lecture-1-689
  start: 689.5
  end: 723.4
  text: "В учебниках государственных школ находится много хорошей науки. Но вместе с хорошей наукой замешан обман. Яд, который уничтожает детей… Проблема — это замешанный обман."
  rating: orange
  verdict: "Что в учебниках много хорошей науки, верно. Но слово «яд» звучит раньше, чем показано, в чём именно обман. Слушателя сначала настраивают бояться, а доводы обещают потом."
  rhetoric: [loaded-language, false-analogy]
