  text: "Первый закон термодинамики: материю и энергию невозможно ни создать, ни уничтожить. Значит, либо кто-то сотворил мир, либо мир произошёл сам по себе. Другого выбора нет."
  rating: red
  verdict: "Закон говорит о замкнутых системах и не описывает начало Вселенной. «Другого выбора нет» — ложная дилемма."
  details: |
    Первый закон термодинамики — это закон о сохранении энергии **внутри** уже существующего мира: нагрели воду, и тепло никуда не делось, а перешло в пар.
    О том, как возникла сама Вселенная, этот закон ничего не говорит, как правила дорожного движения ничего не говорят о том, откуда взялась дорога.

    Фраза «других вариантов нет» тоже неверна: учёные обсуждают много моделей, и ни одна не отвергает Бога-Творца.
  arguments: [pervyj-zakon-termodinamiki]
  rhetoric: [lozhnaya-dilemma]
