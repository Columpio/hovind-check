  text: "Вы мне расскажите о вашем взрыве, а я вам расскажу о моём. Не говорите мне, что моя теория религиозная, а ваша научная: это две религии."
  rating: red
  verdict: "Подмена: наука проверяет предсказания, а вера опирается на другое. Назвать оба взгляда «религией» значит стереть эту разницу."
  details: |
    Если один и тот же глагол «верить» подходит и к «я верю в Бога», и к «я верю расписанию электричек», это ещё не значит, что это одно и то же.
    Расписание можно сверить с часами, а теорию Большого Взрыва — с наблюдениями: например, с остаточным излучением, которое предсказали заранее, а потом нашли.
