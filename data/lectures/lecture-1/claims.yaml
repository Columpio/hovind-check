  end: 167.0
  text: "Моё имя Кент Ховинд, я из Пенсаколы, Флориды. Я преподавал науку в старших классах 15 лет… Я верю, что Библия является безошибочным и вдохновлённым словом живого Бога… У меня есть три цели… укрепить вашу веру в слово Божье… если вы ещё не спасены, я хочу, чтобы вы были спасены… Идёт война… Это не моя жена. Это только её фотография… У нас трое детей… Есть четыре важных вопроса… Каждая религия мира, даже атеизм — это тоже религия. Все религии стараются ответить на эти вопросы."
  rating: neutral
  verdict: "Представление, исповедание веры и цели семинара. Мы тоже верим, что Писание — Слово Божье, и разделяем цели: укрепить веру и привести ко Христу. Что у каждого, даже у неверующего, есть свои ответы на главные вопросы жизни, тоже верно. Спор у нас не о вере и не о биографии лектора, а о том, что говорит наука и как читать первые главы Бытия."
  rhetoric: [self-authority]

- id: lecture-1-167
  start: 167.4
  end: 197.8
  text: "Существует два взгляда на мир. Некоторые… говорят: «Удивительно, этот мир произошёл из ничего при большом взрыве». Это гуманистическое мировоззрение, в котором человек — это бог. Другие… говорят: «…значит, существует умный Создатель»… Одно из этих мировоззрений неверно, и они находятся в войне."
  rating: red
  verdict: "Ложный выбор. Теорию Большого взрыва предложил католический священник Жорж Леметр, и миллионы христиан принимают её, веря в Творца. «Большой взрыв» — это не мировоззрение, а научная модель, а гуманизм не учит, что «человек — бог»."
  details: |
    Ховинд предлагает слушателю два ящика: «Большой взрыв, человек — бог» и «Создатель». Третьего будто бы нет. Но третий ящик — самый населённый.

    **Кто придумал Большой взрыв.** Модель расширяющейся Вселенной построили физик Александр Фридман (1922–1924) и бельгиец **Жорж Леметр** (1927). Леметр был католическим священником, позднее — президентом Папской академии наук в Ватикане ([«Аббат Жорж Леметр: основатель физической космологии», Элементы](https://elementy.ru/nauchno-populyarnaya_biblioteka/437552/Abbat_Zhorzh_Lemetr_osnovatel_fizicheskoy_kosmologii); [учебник МГУ «История астрономии» Еремеевой и Цицина](https://astro-cabinet.ru/library/iau/istoriya-astronomii116.htm)). Само название «Большой взрыв» в 1949 году в радиопередаче Би-би-си придумал его противник, астрофизик Фред Хойл, который считал Вселенную вечной ([NASA, Cosmic Times](https://imagine.gsfc.nasa.gov/educators/programs/cosmictimes/educators/guide/1955/hoyle.html); [«Большой взрыв сэра Фреда Хойла», Элементы](https://elementy.ru/nauchno-populyarnaya_biblioteka/433430/Bolshoy_vzryv_sera_Freda_Khoyla)). Получается, что «теорию атеистов» придумал священник, а спорили с ней как раз неверующие учёные.

    **Что думают христиане.** Папа Франциск в 2014 году сказал учёным: теория Большого взрыва «не противоречит вмешательству божественного Творца, а зависит от него» ([речь в Папской академии наук](https://www.vatican.va/content/francesco/en/speeches/2014/october/documents/papa-francesco_20141027_plenaria-accademia-scienze.html)). Православная энциклопедия приводит слова из «Основ социальной концепции РПЦ»: «в естествознании нет теорий атеистических и религиозных, но есть теории более или менее истинные» ([статья «Креационизм»](https://www.pravenc.ru/text/2458993.html)). Евангельский христианин и руководитель проекта «Геном человека» Фрэнсис Коллинз пишет: «Большой взрыв прямо-таки вопиет о сверхъестественном объяснении. Непонятно, как природа могла бы сама себя создать» (Коллинз Ф. «Доказательство Бога. Аргументы учёного». М.: Альпина нон-фикшн, 2008, гл. 3 «Возникновение Вселенной»).

    **Что такое гуманизм.** Это слово родилось в эпоху Возрождения: так называли учёных людей, которые изучали античную литературу и говорили о достоинстве человека. Большинство из них были христианами ([Новая философская энциклопедия, «Гуманизм»](https://www.iphras.ru/elib/0863.html)). Позже появился и неверующий, «светский» гуманизм. Но и он не учит, что «человек — это бог»: он говорит, что человек сам отвечает за свои поступки.

    **Пример.** Представьте спор: «Либо вы верите, что дом построил строитель, либо — что дом построили кирпич, цемент и подъёмный кран». Это нелепо: строитель строил *при помощи* кирпича и крана. Так и многие верующие видят в Большом взрыве не замену Творцу, а то, *как* Творец начал мир.

    **Честная оговорка.** Наука не говорит, *почему* Вселенная вообще есть и что было «до» начала. Это вопрос веры и философии, и здесь христианин свободно исповедует: «Вначале сотворил Бог небо и землю».
  arguments: [big-bang]
  rhetoric: [lozhnaya-dilemma, podmena-ponyatij, straw-man]

- id: lecture-1-199
  start: 199.4
  end: 241.0
  text: "Если верна эволюция, то вы являетесь протоплазмой, которую выкинуло на берег… вы являетесь одним из загрязнителей окружающей среды. Кстати, если эволюция верна, это мышление является нормальным. Необходимо уничтожить человечество…"
  rating: red
  verdict: "Из теории эволюции не следует ни что человек ничего не стоит, ни что человечество надо уничтожить. Биология отвечает на вопрос «как возникли живые существа», а не «сколько стоит человек» и «что нам делать»."
  details: |
    Ховинд берёт научную теорию и приписывает ей вывод, которого в ней нет, а потом ужасается этому выводу.

    **Что говорит наука.** Теория эволюции описывает, как живые существа менялись из поколения в поколение. Она не даёт моральных предписаний. Университет Беркли в пособии для учителей прямо разбирает это заблуждение: эволюция «не делает этических утверждений о том, что правильно и что неправильно», это решают люди, общества и, добавим, вера ([Understanding Evolution, Беркли: «Заблуждения об эволюции»](https://evolution.berkeley.edu/teach-evolution/misconceptions-about-evolution/)).

    **Пример.** Химик может посчитать, что тело человека — это в основном вода, углерод и немного кальция, а стоят эти вещества недорого. Значит ли это, что человек «стоит копейки»? Нет. Химия отвечает на вопрос «из чего», а не «чего стоит». Так и биология: «как появился» — не то же самое, что «зачем живёт».

    **Что говорит Библия.** Писание само говорит, что Бог создал человека «из праха земного» (Быт 2:7). Христианин не делает отсюда вывода, что человек — «просто пыль». Ценность человеку даёт не материал, из которого он сделан, а то, что Бог создал его по Своему образу и любит его. Христианин, принимающий эволюцию, думает так же: способ творения не отменяет образа Божия.

    **На это можно возразить так:** «Но если Бога нет и всё произошло само, то смысла и морали действительно нет». Это возражение не против эволюции, а против *атеизма*. Спор «есть ли Бог» — важный, но это спор философии и веры, а не биологии. Христиане, принимающие эволюцию, верят в Бога, а значит, и в смысл, и в мораль.
  arguments: [evolution-morality]
  rhetoric: [straw-man, loaded-language]

- id: lecture-1-241
  start: 241.6
  end: 269.6
  text: "Если верна эволюция, то вы появились из космического взрыва около 20 млрд лет назад… в жизни нет смысла. Делайте всё, что вам нравится… вас закопают в могилу и ваше тело превратится в растение или ещё что-то."
  rating: red
  verdict: "Здесь смешаны три разные вещи: биология (эволюция), физика (Большой взрыв) и вопрос о смысле жизни. Эволюция не учит, что «смысла нет», а в землю после смерти ложится и тело верующего."
  details: |
    **Эволюция — не Большой взрыв.** Теория эволюции — раздел биологии, она описывает живые существа. Большой взрыв — модель физики и астрономии о расширении Вселенной. Это разные науки, разные учёные и разные доказательства. Ховинд склеивает их в одно слово «эволюция», и слушателю кажется, что спорит он с одной теорией. Пособие Беркли отмечает и другое частое смешение: эволюция — даже не теория происхождения жизни, она в основном о том, как жизнь менялась *после* появления ([Беркли](https://evolution.berkeley.edu/teach-evolution/misconceptions-about-evolution/)).

    **«Около 20 млрд лет».** Сегодня возраст Вселенной измерен точнее: около 13,8 млрд лет ([ESA, спутник «Планк»](https://www.esa.int/Science_Exploration/Space_Science/Planck/Planck_reveals_an_almost_perfect_Universe)). Само по себе уточнение цифр — нормальная работа науки, а не её слабость.

    **«Смысла нет, делайте что хотите».** Наука не отвечает на вопрос о смысле жизни — ни «да», ни «нет». Это вопрос веры. Христианин, принимающий эволюцию, находит смысл там же, где и любой христианин: в Боге.

    **«Тело превратится в растение».** Так и есть — и это говорит не Дарвин, а Библия: «прах ты и в прах возвратишься» (Быт 3:19), «всё произошло из праха, и всё возвратится в прах» (Еккл 3:20). Апостолов тоже похоронили, но их жизнь от этого не стала бессмысленной. Надежда христианина — на воскресение, а не на то, что тело не истлеет.
  arguments: [evolution-morality]
  rhetoric: [podmena-ponyatij, straw-man]

- id: lecture-1-270
  start: 270.5
  end: 283.2
  text: "Но Библия говорит, что вначале сотворил Бог небо и землю. Если это верно, то… на эти вопросы появляются совершенно другие ответы. Теперь нам необходимо узнать, кто Бог."
  rating: green
  verdict: "Верно. Вера в Бога-Творца действительно меняет ответы на вопросы о смысле и ценности жизни. С этим согласны и христиане, принимающие эволюцию."

- id: lecture-1-283
  start: 283.7
  end: 316.4
  text: "Дьявол подошёл к Еве… «Подлинно ли сказал Бог…?» …Сатана всегда так делает, он хочет, чтобы мы сомневались в словах Бога… «вы будете как боги»."
  rating: neutral
  verdict: "Пересказ третьей главы Бытия. Что искуситель сеет сомнение в слове Божьем, признают все христиане."

- id: lecture-1-318
  start: 318.2
  end: 338.5
  text: "И прямо там, в Эдемском саду, и зародилась вся идея эволюции. Эволюцию не придумал Дарвин. Её придумал Сатана… «мы развиваемся, мы становимся больше, лучше, сильнее, умнее. И в один день мы будем путешествовать по Вселенной…»"
  rating: red
  verdict: "Ложь змея была в том, что человек станет «как Бог» без Бога, через непослушание. Теория эволюции говорит о другом: как меняются живые существа. И она не учит, что всё становится «лучше и сильнее»."
  details: |
    **Что было в Эдеме.** Змей обещал: ослушайтесь Бога — и станете «как боги, знающие добро и зло» (Быт 3:5). Грех здесь — в желании жить без Бога и вопреки Ему. О том, как меняются виды животных и растений, в этом рассказе нет ни слова.

    **Что говорит наука.** Эволюция не обещает, что живое неизбежно становится «больше, лучше, сильнее, умнее». Пособие Беркли называет это одним из самых частых заблуждений: эволюция — не лестница вверх, а ветвящееся дерево, и признак, полезный в одних условиях, в других бывает вредным ([Беркли: «Заблуждения об эволюции»](https://evolution.berkeley.edu/teach-evolution/misconceptions-about-evolution/)). Пещерные рыбы, например, теряют глаза — это тоже эволюция.

    **Пример.** Это как сказать: «Идею самолёта придумал дьявол — ведь строители Вавилонской башни тоже хотели достать до неба». Сходство слов («подняться», «стать выше») не делает два явления одним.

    **Богословская оговорка.** Отцы Церкви тоже говорили, что человек призван «стать как Бог», но совсем в другом смысле: по благодати, в единении со Христом (об этом — в разборе следующих утверждений). Обещание змея — подделка под это призвание, а не «идея эволюции».
  arguments: [evolution-religion]
  rhetoric: [podmena-ponyatij, straw-man]

