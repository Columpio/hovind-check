  text: 'Зажги любовь в пасторах, евангелистах, миссионерах. учителях, чтобы они делали, что правильно. Боже, я прошу, пошли возрождение. Пошли возрождение ещё раз. Начни с меня. Господи. Я хочу быть чистым. Я хочу спасать души. Я хочу достичь больше людей в этом году, чем когда бы то ни было. Помоги, чтобы христиане перестали думать о мече и начали думать о соседе. Помоги нам молиться. Помоги нам жить праведно. И приводить других к тебе. Благодарю тебя за пастора и за эту прекрасную церковь. Дай им мудрости и покажи, как они могут достичь больше людей. Помоги, чтобы они никогда не остались довольны своей работой. Чтобы они всегда старались делать больше. Помоги им добиться успеха. Пошли возрождение христианам, которые проживают жизнь впустую. Бесцельно. Пошли возрождение. Здесь могут быть неспасённые. Если они погибнут, они попадут в ад. Помоги им покаяться сегодня. Во имя Иисуса Христа. Аминь. Это одна из видеосерий о создании, эволюции, динозаврах. Однако намного важнее знания правды и научных фактов — это уверенность в том, что вы пойдёте в рай. Если вы никогда не доверились Христу как Спасителю, я расскажу, как можно попасть в рай. Библия говорит, что все мы грешники, все мы нарушили Божий закон, мы ослушались Создателя. Мы грешники. Одни хуже других. По крайней мере, в человеческих глазах. Но все мы нарушили Божьи законы. И Библия говорит, что мы должны покаяться. Отвернуться от греха и повернуться к Богу. Бог ищет перемены в вашем отношении. Когда вы говорите: «Боже, я больше не хочу грешить. Я хочу жить правильно». И вы отворачиваетесь от греха и поворачиваетесь к Богу. И просите прощения. В Библии, в Римлянам 3:23, говорится, что все согрешили и лишены славы Божией. Вы должны признаться, что вы грешник. Во-вторых, в Римлянам 6:26 говорится: «Ибо возмездие за грех — смерть». Мы заслуживаем пойти в ад. Но Иисус умер за вас. Он любит нас. Он хочет, чтобы мы попали в рай. И кто попросит бесплатное спасение, Бог даст вечную жизнь, как сказано в Римлянам 6:23. Это подарок. Подарок. В Римлянам 10:13 говорится: «Ибо всякий, кто призовёт имя Господне, спасётся». Попросите Его, и Он даст вам бесплатный дар вечной жизни. Помолитесь со мной сейчас, и вы сможете принять Христа как Спасителя. Здесь нет волшебных слов. Бог смотрит на ваше сердце. Дорогой Господь Иисус. Я знаю, что я грешник. Я нарушил твой закон, прости меня. Засчитай свою кровь на мой счёт. Прости мои грехи и прими меня на небо. Во имя Иисуса Христа. Аминь. Библия говорит, что если вы призовёте имя Господне, спасётесь. Если вы попросили Господа, он спасёт вас. Теперь вам надо расти, читайте Библию, молитесь, ходите в церковь. Возрастайте, чтобы быть хорошим христианином. Спасибо. Пишите, мы будем рады помочь.'
