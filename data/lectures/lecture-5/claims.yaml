- id: lecture-5-50
  start: 50.3
  end: 76.2
  text: Спасибо, что вы пришли. Мне приятно быть здесь, в Пенсильвании, и представлять мой семинар о сотворении, эволюции, динозаврах. Для кого это первый семинар? А кто уже был раньше? И кто ещё не понимает вопроса? Моё имя Кент Ховинд. Я преподавал науку 15 лет, теперь я путешествую уже 10 лет и говорю на тему о сотворении, эволюции и динозаврах.
  rating: neutral
  verdict: 'Приветствие и представление: Ховинд преподавал естествознание в школе 15 лет. Опыт учителя мы уважаем, но доводы проверяем по существу, кто бы их ни произносил.'
  rhetoric:
  - self-authority

- id: lecture-5-76
  start: 76.7
  end: 104.7
  text: На последней сессии мы говорили, как теория эволюции стала популярной в середине XVIII столетия. И о появлении геологической колонны. Нам поможет этот график. В 1830 году была придумана геологическая колонна. Кто помнит, в каком единственном месте в мире можно найти геологическую колонну? Да. В учебниках. В каком ты классе? Четвёртом. Молодец.
  rating: red
  verdict: 'Геологическую шкалу действительно составили в начале XIX века, но её не придумали: порядок слоёв виден в обрывах и скважинах по всему миру, и описали его верующие геологи ещё до Дарвина.'
  arguments:
  - fossil-layers
  rhetoric:
  - appeal-to-doubt

- id: lecture-5-105
  start: 105.9
  end: 128.3
  text: В начале XVIII столетия люди начали отвергать Библию. По нескольким причинам. Промышленная революция. В странах происходили политические революции. Век антимонархии. И это было время процветания, новых изобретений, и люди думали, что Библия мешала их стилю жизни. И была придумана геологическая колонна, что привело к Дарвину.
  rating: orange
  verdict: Что в XIX веке многие отходили от Библии, верно. Но геологическую шкалу составили по наблюдениям слоёв, нередко верующие геологи, а мотивы людей не делают их выводы ни верными, ни ложными.
  arguments:
  - fossil-layers
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-129
  start: 129.2
  end: 152.6
  text: И сегодня я хочу показать влияние теории эволюции XVIII столетия на происхождение коммунизма, социализма, марксизма, нового мирового порядка, нацизма. Всё это связано вместе. Это сущность отвержения Библии. Некоторые люди не хотят, чтобы Бог говорил им, что делать. И я вам представлю 14 основных идей, о которых мы поговорим.
  rating: red
  verdict: 'Коммунизм и нацизм — настоящее зло XX века. Но «Манифест коммунистической партии» вышел в 1848 году, раньше книги Дарвина (1859), а нацистский расизм вырос из многовекового антисемитизма. Социал-дарвинизм, то есть перенос «выживания сильнейших» на народы, биология не утверждает: нацистам он служил лишь прикрытием.'
  arguments:
  - darwin-hitler
  rhetoric:
  - conspiracy

- id: lecture-5-153
  start: 153.2
  end: 186.5
  text: 'Первое: Бог создал мир. Второе: Сатана возгордился и решил, что человек должен поклоняться ему. Третье: Сатана восстал против Бога. Но потерпел неудачу и был проклят. Он проиграл. Бог сказал, что семя женщины поразит его в голову. И Сатана пытался уничтожить всё семя женщины в то время и с того времени. И он обманул Еву. И уже 6 000 лет идёт война со времени падения в Эдемском саду, когда Сатана восстал против Бога.'
  rating: purple
  verdict: 'Мы тоже верим, что Бог сотворил мир, а Быт 3:15 обещает победу над змеем. Но «6000 лет войны» — вывод из сложения родословий, а это одно из толкований: многие христиане не считают родословия полной хронологией.'
  arguments:
  - genesis-literal

- id: lecture-5-187
  start: 187.1
  end: 204.6
  text: 'И он использует ту же технику, что и на Еве в Эдемском саду. Три вещи: первое: Он старается вызвать сомнение, тогда он опровергнул то, что сказал Бог, назвал его обманщиком. И тогда он попытался обожествить человека. «И вы будете как боги». Это теория эволюции.'
  rating: red
  verdict: 'Сомнение в слове Божьем и обещание «будете как боги» мы тоже видим в Быт 3. Но теория эволюции ничего не обещает человеку: она описывает историю живых существ, а не учит, что человек станет богом.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-205
  start: 205.7
  end: 237.8
  text: 'Тогда на протяжении многих лет он использовал разных людей для продвижения своей теории. И для выполнения своей цели уничтожения человечества. Сюда относится нацизм. Коммунизм, социализм и приближающийся новый мировой порядок. Сатана обещает дать все богатства мира, если вы поклонитесь ему. Он обманщик. И много групп работают с дьяволом. Многие не знают, что они работают с ним. Но они стараются достигнуть его цели: сначала новый мировой порядок, потом уничтожение человечества.'
  rating: red
  verdict: Что за злом в мире стоит враг рода человеческого, мы, христиане, тоже верим. Но нацизм и коммунизм — разные и враждовавшие силы, и общего плана «сначала мировой порядок, потом уничтожение людей» Ховинд не показывает.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-239
  start: 239.4
  end: 261.5
  text: Сатана заложил в сердца и умы немногих супербогатых людей, что их задача — управлять миром и сократить население. Но они не понимают, что как только они это сделают, он уничтожит и их. Так всегда делали коммунисты. Они говорят революционерам уничтожить какую-то страну. Потом они уничтожают самих революционеров. Всё-таки им нельзя доверять.
  rating: red
  verdict: Документа, где богатые люди ставят цель сократить население мира, не находят. Программа действий Каирской конференции ООН по народонаселению (1994) прямо отвергает принуждение и говорит о свободном выборе семей.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-262
  start: 262.0
  end: 309.7
  text: 'И страдания придут скоро. В мире будет страдание, какого он ещё не знал. Скоро будет очень плохо. Мы можем увидеть страдания, когда мир преследует нас. Сказано, что мы будем преследуемы. Но мы не увидим гнев Бога. Гнев — это когда Бог наказывает мир. Мир преследует нас, и всегда преследовал. Христиан преследуют и сегодня. Мы это увидим. Но мы не увидим Божий гнев. И четырнадцатое: Бог побеждает. В конце. Я прочитал последнюю главу: «Мы победим». Зная это, что мы должны делать? Мы должны понять, что у Бога всё под контролем, и слушаться Его. Это основная идея сегодня. Давайте рассмотрим другие факты.'
  rating: neutral
  verdict: 'Конец плана лекции и главная мысль: у Бога всё под контролем, в конце Он победит. С этим мы согласны; о сроках «великой скорби» христиане думают по-разному.'

- id: lecture-5-311
  start: 311.3
  end: 356.5
  text: 'Бог создал мир. Он владелец? Написано: «В начале сотворил Бог небо и землю». Но некогда, может быть, 100 лет спустя, Люцифер возгордился и подумал: «Эти люди должны поклоняться мне». Мы знаем, что Люцифер не упал с неба до завершения творения. Потому что в Бытии 1:31 увидел Бог всё, что Он создал, было хорошо весьма. Сатана ещё не упал. Также мы знаем, согласно Иезекиилю, что Люцифер был в Эдеме, доколе не нашлось в нём беззакония. Эдемского сада не было до дня шестого. До рождения Каина и Авеля около первых сто лет. Потому что Сиф был рождён, когда Адаму было 130 лет. Мы думаем, что в первые 100 лет Сатана возгордился.'
  rating: purple
  verdict: Мы тоже верим, что сатана пал и искусил человека. Но когда это случилось, Писание не говорит, поэтому «в первые 100 лет» — догадка самого Ховинда.
  arguments:
  - genesis-literal

- id: lecture-5-357
  start: 357.6
  end: 392.2
  text: 'Об этом говорится в Исаии 14. «Как упал ты с неба, денница, сын зари, разбился о землю, попиравший народы. А говорил в сердце своём: „Взойду на небо, выше звёзд Божиих вознесу престол мой и сяду на горе в сонме богов, на краю севера; взойду на высоты облачные, буду подобен Всевышнему“». Дьявол хочет быть Богом. Но он не может быть Богом. Он стара… Он злой, и он старается уничтожить всё, что сделал Бог, чтобы Бог выглядел неудачником. Он хочет уничтожить человечество.'
  rating: neutral
  verdict: Мы тоже верим, что дьявол восстал против Бога. Многие христиане со времён отцов Церкви читают Ис 14 как рассказ о падении сатаны, хотя прямо текст говорит о царе Вавилонском (Ис 14:4).

- id: lecture-5-392
  start: 392.7
  end: 399.2
  text: Я хочу показать, как теория эволюции является ключевой идеей нашего столетия, чтобы уничтожить человечество.
  rating: red
  verdict: Что у человечества есть враг, мы тоже верим. Но теория эволюции — научное объяснение разнообразия жизни, а не план уничтожения людей; её принимают и многие верующие учёные.
  arguments:
  - evolution-religion
  rhetoric:
  - loaded-language

- id: lecture-5-401
  start: 401.1
  end: 510.6
  text: 'В Исаии в четырнадцатой главе написано: «Но ты низвержен в ад, в глубины преисподней». Сатана проиграет в конце. И Бог не переживает ни за что. Мы находимся в середине войны. Но Бог знает, как она закончится. И мы тоже, если мы читаем Библию. И нам не надо беспокоиться, надо заняться делом. Однажды люди посмотрят на Сатану и скажут: «Тот ли это человек, который колебал землю, потрясал царства, вселенную сделал пустыней и разрушал города её, пленников своих не отпускал домой?» Мы удивимся ничтожеству Сатаны, когда увидим его в глубине ада. Бытие 3. «И сказал Господь Бог змею: „За то, что ты сделал это, проклят ты пред всеми скотами“». Бог проклял Сатану и сказал в стихе пятнадцатом, что семя женщины поразит тебя в голову. Ты будешь жалить его в пяту. Оно будет поражать тебя в голову. И когда Сатана распял Иисуса на кресте, он ужалил в пяту. Это было тяжело, но не смертельно. Иисус воскрес из мёртвых. И в один день Он поразит Сатану в голову. Это будет смертельно. Я не могу дождаться. Идёт длинная война. Сатана решил уничтожить каждое семя женщины. Чтобы спасти свою шкуру. И битва продолжается. «И сказал змей жене: „Подлинно ли сказал Бог?“» Сомнения? И тогда он сказал: «Нет, не умрёте». Отрицает слова Бога. И тогда он сказал: «И вы будете как боги». Обожествление человечества. Эту тактику он использует и сегодня. Сомнения? Опровержение. Обожествление человека.'
  rating: neutral
  verdict: 'Проповедь по Ис 14 и Быт 3: сатана будет повержен, крест — «ужаление в пяту», а приёмы змея — сомнение, отрицание слова Божьего и обожествление человека. С этим традиционным чтением мы согласны.'

- id: lecture-5-511
  start: 511.0
  end: 529.7
  text: 'Гитлер сказал: «Если говорить ложь во всеуслышание достаточно долго и часто, народ поверит лжи». Он сказал: «Они больше расположены верить большой лжи, чем маленькой». Если вы говорите, что всё будет хорошо... Тогда можете сказать, что вы станете богами. Это большая ложь, но в неё поверят.'
  rating: orange
  verdict: 'Мысль, что толпа легче верит большой лжи, чем маленькой, действительно есть у Гитлера в «Майн кампф». Но первой фразы, о лжи, повторённой достаточно часто, у него не находят: её без источника приписывают то ему, то Геббельсу.'
  rhetoric:
  - unverified-quote

- id: lecture-5-531
  start: 531.6
  end: 548.2
  text: Он использует эти три обмана и сегодня. Начните сомневаться. Отвергните слово Божье. Обожествите человека. Он использует этот обман, чтобы миллионы попали в ад. «И вы будете как боги». Много религий мира поверили в это. Но мы говорим об этом в других частях.
  rating: neutral
  verdict: Повтор трёх обманов змея; их разбор в других лекциях.

- id: lecture-5-549
  start: 549.2
  end: 573.3
  text: Сатана начал эту войну около 6 000 лет назад. В этой войне он сражается с Богом. Он хочет, чтобы вы поверили, что вы станете Богом. И во что вы верите, философия определяет ваше поведение. Вера определяет поведение. Если вы верите, что вы Бог, вы хотите, чтобы все служили вам. И Сатана хочет, чтобы вы думали, что вы Бог.
  rating: purple
  verdict: Что вера определяет поведение и что сатана искушает человека гордыней, мы тоже верим, здесь мы с Ховиндом согласны. О сроке «6000 лет» — в «Подробнее».
  arguments:
  - genesis-literal

- id: lecture-5-574
  start: 574.1
  end: 589.9
  text: 'Библия предупреждает, чтобы кто не увлёк вас философией и пустым обольщением, по преданию человеческому, По стихиям мира, а не по Христу. Слово «философия» происходит из двух греческих слов: «филео» — «любить» и «софия» — человеческая мудрость.'
  rating: neutral
  verdict: 'Предостережение из Кол 2:8, с которым мы согласны. Маленькая неточность: греческое «софия» значит просто «мудрость», не обязательно человеческая.'

- id: lecture-5-605
  start: 605.3
  end: 617.2
  text: Философия очень важна. Эволюция — это не наука. Это философия. Это образ мышления. Это взгляд на мир. И нет поддерживающей это науки.
  rating: red
  verdict: 'Эволюция — научная теория с множеством подтверждений: ископаемые, генетика и даже новые виды, возникшие на глазах учёных (например, два вида растений в США в XX веке). Философией её делает тот, кто добавляет к ней «Бога нет», а это уже не биология.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-618
  start: 618.1
  end: 630.1
  text: Сатана использовал разных людей для уничтожения мира. Нацизм. Коммунизм. Социализм, марксизм, расизм. Новый мировой порядок. Мы поговорим о них. Расизм.
  rating: neutral
  verdict: 'План следующей части: нацизм, коммунизм, расизм, «новый мировой порядок». Каждое утверждение разбираем ниже.'

- id: lecture-5-631
  start: 631.1
  end: 661.3
  text: 'Дарвин написал книгу в 1859 году. Дарвин находился под влиянием разных людей: Мальтуса, Лайеля и других. Дарвин написал эту книгу. Она у меня вот здесь. Но теория эволюции появилась задолго до этого времени. Дарвин присвоил много идей своего дедушки, Эразма Дарвина, который придумал большинство теорий задолго до Чарльза. Но эта книга оправдывала расизм.'
  rating: orange
  verdict: Что Дарвин опирался на Мальтуса, Лайеля и идеи деда, верно, и сам он об этом писал. Но книга о происхождении видов растений и животных не оправдывала расизм, а Дарвин был убеждённым противником рабства.
  arguments:
  - darwin-racism

- id: lecture-5-662
  start: 662.1
  end: 686.2
  text: 'Книга называется «Происхождение видов». Но это неполное название. Также что такое виды? Ещё никогда не было хорошего объяснения слова «виды». Люди смотрят на этих обезьян и говорят: «Они разных видов». Может быть. Ну, они тот же род животного. Тот же род. Библия говорит, что они произведут по роду их.'
  rating: orange
  verdict: Что границу вида провести трудно, биологи признают сами. Так и должно быть, если виды расходятся постепенно. А в Библии сказано «по роду их», но где кончается один «род», Писание не уточняет, и вывести из этого слова, какие изменения невозможны, нельзя.
  arguments:
  - microevolution-macro

- id: lecture-5-686
  start: 686.9
  end: 706.0
  text: 'И в этой книге не упоминается о происхождении видов. Хотя это и есть название книги. Автор написал: «Как происхождение жизни, так и происхождение главных групп животных, до сих пор остаётся неизвестным». Они этого не знают. В этом учебнике детям говорится больше о названии книги.'
  rating: red
  verdict: Что происхождение жизни пока не объяснено, верно. Но книга Дарвина целиком о том, как возникают виды, а цитата без автора о «главных группах животных» этого не отменяет.
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-5-707
  start: 707.6
  end: 737.2
  text: 'В нём говорится: «В 1859 году Дарвин написал книгу под названием „О происхождении видов с помощью естественного отбора“». Видите? Раньше были очень длинные названия. Вот полное название книги Дарвина. «Происхождение видов с помощью естественного отбора, или Сохранение привилегированных рас в борьбе за жизнь». Привилегированных рас? Дарвин, это не общественно приемлемо?'
  rating: orange
  verdict: Полное название книги приведено верно. Но «расы» у Дарвина — разновидности растений и животных, например голубей и капусты; о людях в этой книге почти ничего не сказано.
  arguments:
  - darwin-racism
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-738
  start: 738.5
  end: 746.3
  text: Но в 1859 году почти каждый человек был расистом. Тогда вы могли покупать и продавать рабов.
  rating: green
  verdict: 'Верно: в 1859 году расизм был нормой, а в США ещё было рабство. Поэтому расизм нельзя вывести из книги, вышедшей позже.'
  arguments:
  - darwin-racism

- id: lecture-5-748
  start: 748.2
  end: 768.1
  text: '1859 год. Дарвин сказал: «Так, от борьбы природы, от голода и смерти на более возвышенный объект, который мы можем произвести, а именно производство высших животных, непосредственно следует». Другими словами, смерть и страдания — это хорошо? Да. Это его философия.'
  rating: red
  verdict: Цитата из последнего абзаца «Происхождения видов» верна. Но Дарвин описывает, что происходит в природе, а не хвалит страдания; в том же заключении он пишет о «величии этого взгляда на жизнь» и о законах, «запечатлённых Творцом в материи».
  arguments:
  - evolution-morality
  rhetoric:
  - quote-mining

- id: lecture-5-768
  start: 768.7
  end: 786.5
  text: Дарвин был странным человеком. Он думал, что туземцы были развитыми животными. Конечно, в то время продавали рабов. В Америке было рабство. И людей продавали как коров. Вы должны понять, что книга Дарвина появилась как раз в то время, чтобы оправдать то, что уже происходило.
  rating: red
  verdict: Что Дарвин разделял предрассудки своего века о «дикарях», верно. Но рабство он называл великим злом и был его противником всю жизнь; книга вышла не для того, чтобы его оправдать.
  arguments:
  - darwin-racism
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-786
  start: 786.9
  end: 812.6
  text: 'Посмотрите на позиции этих людей. Это Генри Осборн. Великий эволюционист. Он выступал против сотворения и считался одним из ключевых свидетелей за эволюцию против сотворения. Он сказал: «Интеллектуальный стандарт негра среднего возраста подобен одиннадцатилетнему представителю вида Homo sapiens». Если учитель скажет это сегодня... Сколько он продержится на работе?'
  rating: orange
  verdict: Генри Осборн действительно писал расистские вещи, и это позорно. Но взгляды отдельного учёного не опровергают выводов биологии; сама наука потом показала, что люди — один вид без «высших» и «низших» рас.
  arguments:
  - darwin-racism
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-815
  start: 815.1
  end: 827.5
  text: 'Томас Хаксли, который продвигал Дарвина, сказал: «Ни один рациональный человек, осведомлённый о фактах, не верит, что средний негр равен, но не лучше белого человека». Видите?'
  rating: orange
  verdict: Гексли действительно писал так в 1865 году. Но в том же очерке он выступал за отмену рабства и равные права; расистские взгляды эпохи не делают теорию ложной.
  arguments:
  - darwin-racism
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-827
  start: 827.9
  end: 851.2
  text: В то время рабов перевозили на кораблях. И 10 или 20% рабов погибали в дороге. Рабство — это ужасная вещь. И рабство можно оправдать только эволюцией. Люди должны поверить, что одна раса выше другой. По-другому нельзя.
  rating: red
  verdict: Что рабство — ужасное зло, мы согласны. Но рабство существовало тысячи лет до Дарвина, и в Америке его защищали задолго до 1859 года, часто ссылаясь на «проклятие Хама», а не на эволюцию.
  arguments:
  - darwin-racism

- id: lecture-5-852
  start: 852.1
  end: 871.5
  text: У этих людей была интересная работа. Они искали потерянные звенья. Они думали, что между белым человеком и обезьяной должно быть звено. Если мы так произошли. И они начали искать потерянные звенья. Они поехали в Австралию и подумали, что аборигены были прекрасными потерянными звеньями.
  rating: orange
  verdict: 'Что в XIX веке некоторые учёные считали аборигенов «недостающим звеном», правда и позор. Но эту ошибку отвергла сама наука: все современные люди — один вид с общим недавним происхождением.'
  arguments:
  - darwin-racism

- id: lecture-5-873
  start: 873.0
  end: 913.9
  text: Потому что у них большие челюсти. Причина этого — то, что у аборигенов нет инструментов, как у нас. И они используют челюсть, например, как тиски или плоскогубцы. Если надо что-то сломать, они используют челюсти. И потому что они используют мускулы челюстей намного больше, чем мы. У них большие мускулы. И чем больше мускулы, тем больше кости. И это знает любой спортсмен-тяжеловес. Посмотрите. Это очевидно. И у аборигенов челюсть больше из-за стиля жизни. Не из-за эволюции.
  rating: orange
  verdict: Что нагрузка влияет на кости челюсти, верно. Но у аборигенов были свои орудия, а различия в строении черепа есть у всех народов и никого не делают «ближе к обезьяне»; эволюция этого и не утверждает.
  arguments:
  - darwin-racism

- id: lecture-5-915
  start: 915.0
  end: 944.3
  text: Они начали ловить аборигенов. Порабощая их. Убивая их. И посылая их в музей как образцы. Миссионер Нового Южного Уэльса оказался свидетелем ужасной резни нескольких десятков аборигенов. После резни 45 голов были сварены, и десять лучших из них были упакованы для перевозки. Вы знаете, они убивали аборигенов для того, чтобы их скальпы были в музеях.
  rating: orange
  verdict: Торговля останками аборигенов для музеев — правда и позор; сегодня музеи возвращают останки народам. Но насилие над аборигенами началось задолго до книги Дарвина и выросло из колониального расизма.
  arguments:
  - darwin-racism

- id: lecture-5-946
  start: 946.9
  end: 974.0
  text: И многие находятся здесь недалеко. В этом Смитсоновском музее в подвале находится 33 000. Прямо сейчас. Этот музей тщательно старался скрывать много важных находок. Как громадные скелеты. Скелеты от 2,5 до трёх с половиной метров длины. Он берётся изучать их. И они навсегда исчезают.
  rating: red
  verdict: 'В хранилищах Смитсоновского института действительно десятки тысяч человеческих останков. Но скелетов ростом 2,5–3,5 м среди них нет: это газетные байки XIX века и интернет-слухи, а не находки.'
  arguments:
  - giants
  rhetoric:
  - conspiracy

- id: lecture-5-976
  start: 976.2
  end: 986.5
  text: Видите, они верят в эволюцию, и они хотят, чтобы вы думали, что мы произошли от шимпанзе и становимся больше, лучше и умнее. Идея, что раньше человек был больше и умнее, не подходит, чему они учат.
  rating: red
  verdict: 'Эволюция не учит, что люди произошли от шимпанзе и что всё становится «больше, лучше, умнее»: у людей и шимпанзе общий предок, а виды приспосабливаются к своей среде, а не поднимаются по лестнице.'
  rhetoric:
  - straw-man

- id: lecture-5-988
  start: 988.6
  end: 1008.1
  text: Написана хорошая книга о далёких приключениях. О находках, которые были загадочно уничтожены и исчезли. Я уверен, что им, этому музею, есть что скрывать. Конечно, это не значит, что все люди, работающие там, плохие, есть и хорошие люди, но некоторые хотят защитить эволюцию.
  rating: red
  verdict: Ховинд честно оговаривается, что в музее работают и хорошие люди. Но ни одной пропавшей находки с документами он не называет, а скелет великана прославил бы учёного, прятать его незачем.
  arguments:
  - science-conspiracy
  rhetoric:
  - conspiracy

- id: lecture-5-1010
  start: 1010.7
  end: 1021.2
  text: Оту Бенгу забрали от жены и двух детей и поместили в клетку с обезьянами. Как часть выставки эволюции. После он сошёл с ума и убил сам себя.
  rating: orange
  verdict: 'История Оты Бенги — правда и позор: в 1906 году его показывали в Бронксском зоопарке, и в 2020 году общество зоопарка за это извинилось. Но покончил с собой он через десять лет; злоупотребление теорией не делает её ложной.'
  arguments:
  - darwin-racism

- id: lecture-5-1023
  start: 1023.1
  end: 1030.0
  text: В Сент-Луисе на ярмарке в 1904 году показывали пигмеев, чтобы показать, что они ещё не развились как белый человек.
  rating: green
  verdict: 'Верно: на всемирной выставке в Сент-Луисе в 1904 году показывали пигмеев и других «туземцев» как «ступени развития». Это позорная страница, и мы её не оправдываем.'
  arguments:
  - darwin-racism

- id: lecture-5-1030
  start: 1030.6
  end: 1048.3
  text: Дарвин считал женщин низшими. Он сказал, что женатый человек — это бедный раб. Даже хуже негра. Скажите, если учитель скажет это сегодня, как долго он будет работать? Или жить?
  rating: orange
  verdict: Слова о «бедном рабе, хуже негра» действительно есть у Дарвина, в шутливых записях 1838 года «жениться или нет». Это заметки для себя, а не взгляд на женщин; вскоре он женился и был счастлив в браке.
  arguments:
  - darwin-racism
  rhetoric:
  - quote-mining
  - ad-hominem-pivot

- id: lecture-5-1051
  start: 1051.3
  end: 1064.9
  text: Однако все школы в этом районе хвалят Дарвина как великого учёного. Однако он был расистом. И он ненавидел женщин. В конце он женился на двоюродной сестре. Кроме неё никто этого не хотел.
  rating: orange
  verdict: Что Дарвин женился на двоюродной сестре Эмме Веджвуд, верно. Но брак был счастливым, у них родилось десять детей; «ненавидел женщин» и «никто не хотел» — выпад против личности, к биологии не относится.
  arguments:
  - darwin-racism
  rhetoric:
  - ad-hominem-pivot
  - loaded-language

- id: lecture-5-1065
  start: 1065.5
  end: 1101.5
  text: 'Он сказал: «Главное различие степени интеллектуального показателя двух полов — показано мужским стремлением к возвышенности, чем бы он ни занимался, чем женским, то ли потребность глубокой мысли, разума, воображения, или просто использование чувств и рук». «Средняя умственная сила в мужчине должна превосходить женскую». Хороший парень. «Так в конечном счёте мужчина стал превосходить женщину в поэзии, силе, голосе» и так далее. У Дарвина была проблема самолюбия. Но это сказалось и на других людях.'
  rating: orange
  verdict: 'Цитата из «Происхождения человека» (1871) близка к тексту: Дарвин разделял предрассудки своего века о женщинах. Но взгляды учёного на женщин не решают, верна ли его теория.'
  arguments:
  - darwin-racism
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-1102
  start: 1102.3
  end: 1140.7
  text: 'Например, Теодор Рузвельт думал, что индейцы были низшими видами. И если вы думаете, что цвет людей что-то значит, неизвестно, куда это приведёт. Рузвельт сказал: «Я очень хочу, чтобы неподходящие люди были предотвращены от размножения». Кто эти люди? А Рузвельт думал, что эмигранты из Европы, Шотландии, Ирландии и Востока были угрозой американскому обществу. Сколько из вас произошли из этих стран? Почти каждый, правда? Согласно ему? Вы низшие?'
  rating: orange
  verdict: Теодор Рузвельт действительно поддерживал евгенику и в 1913 году писал, что «неподходящим» нужно не давать размножаться. Но евгеника — злоупотребление, а не вывод биологии, и сама наука её отвергла.
  arguments:
  - darwin-racism
  rhetoric:
  - appeal-to-doubt

- id: lecture-5-1141
  start: 1141.6
  end: 1165.6
  text: В 1871 году Конгресс США порвал все договоры с индейцами. Почему они это сделали? Потому что много членов Конгресса верили в эволюцию. Или же они были расистами и думали, что один вид хуже другого. И они думали, что индейцы были низшим видом. И будет лучше, если белый человек захватит их территории.
  rating: red
  verdict: Закон 1871 года прекратил заключать с индейскими племенами новые договоры, но не расторг прежние. Что конгрессменами двигала вера в эволюцию, источников нет; жестокость к индейцам была и задолго до Дарвина.
  arguments:
  - darwin-racism

- id: lecture-5-1167
  start: 1167.6
  end: 1188.3
  text: Тогда думали так? Вы должны прочитать о «Тропе слёз». Что сделал расизм? Это началось до Дарвина. Они преследовали индейцев. Сначала их называли дикарями и негодяями в газетах. Чтобы все думали, что они ужасные. И потом, когда вы поступаете с ними подло, это никого не беспокоит.
  rating: green
  verdict: 'Верно: «Дорога слёз» — насильственное выселение индейцев в 1830-х, за 20 лет до книги Дарвина. Ховинд сам показывает, что расизм старше эволюционной теории.'
  arguments:
  - darwin-racism

- id: lecture-5-1189
  start: 1189.4
  end: 1207.0
  text: Философия эволюции сыграла большую роль в истории. Это основа коммунизма. Нацизма, социализма. Главная идея — человек может стать Богом. Власть над людьми. Сатана в попытке установления нового мирового порядка использовал разных людей.
  rating: red
  verdict: Что коммунизм и нацизм отвергали Бога или подменяли Его, верно. Но коммунистическое учение сложилось раньше книги Дарвина, а «человек может стать Богом» — не утверждение биологии.
  arguments:
  - darwin-communism
  rhetoric:
  - conspiracy

- id: lecture-5-1209
  start: 1209.2
  end: 1246.2
  text: Он использует человеческую жажду к власти, богатству, красоте и знаниям. У Люцифера была та же проблема. В Иезекииля главе двадцать восьмой. Он возгордился богатством. И красотой. Библия говорит о похоти плоти, похоти очей, о гордости житейской. Они уничтожают человека. Написано, что корень всех зол есть сребролюбие. У людей есть жажда к деньгам. Они хотят больше денег. Ничего плохого в деньгах, но если они стают вашим хозяином… всё катится вниз. Корень всех зол есть сребролюбие.
  rating: neutral
  verdict: Проповедь о гордыне и сребролюбии (Иез 28, 1 Ин 2:16, 1 Тим 6:10); с ней мы согласны.

- id: lecture-5-1247
  start: 1247.3
  end: 1282.8
  text: 'Вы должны прочитать некоторые книги в конце семинарного блокнота в представленном списке о Рокфеллере. Когда вы поймёте, как Рокфеллер связан с фармацевтической промышленностью, лекарственной промышленностью, стоматологической промышленностью, вы только покачаете головой от удивления. Корень всех зол есть сребролюбие. У меня сейчас нет времени, позвоните, и я объясню вещи, как: почему в зубной пасте находится фторид? Он опасен? И почему для лечения мы используем таблетки вместо питания?'
  rating: red
  verdict: Что фонд Рокфеллера много вкладывал в медицину, верно. Но фторид в зубной пасте и воде в правильных дозах безопасен и защищает от кариеса, это подтверждают ВОЗ и медицинские службы. А таблетки врачи назначают не вместо питания, а вместе с ним.
  arguments:
  - globalist-elite
  rhetoric:
  - conspiracy
  - appeal-to-doubt

- id: lecture-5-1285
  start: 1285.7
  end: 1314.5
  text: 'Карнеги основал организацию с намерением предохранения школ от науки о сотворении. Юджини Скотт является президентом этого общества. Национального центра научного образования, основанного Карнеги. Они рассылают брошюры в школы учителям и директорам по всей Америке. Говоря: «Не допустите сотворения в ваших школах». Ну, о сотворении можно учить в школах.'
  rating: red
  verdict: 'Национальный центр научного образования (NCSE) основан в 1982 году, а Эндрю Карнеги умер в 1919-м. И о сотворении можно говорить в школе лишь отчасти: суд США в 1987 году отменил закон, обязывавший учить креационизму наравне с эволюцией.'
  arguments:
  - globalist-elite
  rhetoric:
  - conspiracy

- id: lecture-5-1317
  start: 1317.1
  end: 1332.5
  text: На протяжении всей истории были попытки к восстановлению нового мирового порядка. Коммунизм и гуманизм играют большую роль. Коммунизм основан на идее, что человек — это высшая власть, Бога нет. И поэтому человек встаёт Богом.
  rating: orange
  verdict: Что коммунизм отвергает Бога и ставит человека на Его место, верно; и Писание предупреждает о последнем обмане. Но «попытки нового мирового порядка на протяжении всей истории» — не факт, а общая рамка, в которую Ховинд без доказательств складывает очень разные события.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-1332
  start: 1332.8
  end: 1356.7
  text: Коммунистические правила эволюции были случайно обнаружены в 1919 году. Кажется, был убит шпион, и они были найдены в его кармане. Вот эти правила. Вот как они замысливают захватить мир. Первое. Разложить молодёжь. Увести их от религии. Второе — опровергнуть старые моральные кодексы.
  rating: red
  verdict: 'Будто бы найденные в 1919 году «Коммунистические правила революции» — давняя подделка: подлинного документа никто не видел, а первые публикации появились только после Второй мировой войны.'
  arguments:
  - communist-plan
  rhetoric:
  - unverified-quote

- id: lecture-5-1358
  start: 1358.8
  end: 1393.6
  text: Третье — поощрение гражданских беспорядков и мягкое отношение государства к преступности. Вы заметили, сколько преступников отделываются мягкими приговорами? Откуда эта идея? «Три раза — и тебя нет». Он убил только двух людей? Один раз — и тебя нет. Мы потеряли библейскую основу обращения с заключёнными. И наказание преступников. Мы далеко отошли от Библии. Они поддерживают мягкое отношение к преступности.
  rating: orange
  verdict: 'Что преступление требует справедливого наказания, мы согласны. Но пункт взят из той же подделки, а в 1990-е годы США, наоборот, ужесточали приговоры: закон «трёх ударов», который Ховинд сам упоминает, принят в 1994 году.'
  arguments:
  - communist-plan

- id: lecture-5-1394
  start: 1394.0
  end: 1445.8
  text: И тогда разделить людей на враждебные группы и направить внимание населения не на государство, а на атлетику. У кого из вас в центре внимания атлетика? Вместо государства. Сколько из вас знает больше о спорте, чем о государстве? В 1896 году было 311 атлетов на Олимпийских играх. В 1996 году. Сто лет спустя. Было 13 000 атлетов. Кто-то должен узнать, сколько денег тратится на спорт. Это включит в стоимость билетов. Стоимость перевозки команд спортсменов и зрителей. Стоимость постройки зала для игр. Влияние на окружающую среду. Это нереально, сколько идёт туда денег?
  rating: orange
  verdict: Что спорт отнимает у многих людей много времени и денег, верно. Но на Олимпиаде 1896 года было 241 спортсмен, в 1996-м — 10 318; рост спорта объясняется не тайным планом, а деньгами и телевидением.
  arguments:
  - communist-plan
  rhetoric:
  - appeal-to-doubt

- id: lecture-5-1448
  start: 1448.0
  end: 1466.6
  text: И шестое. Контролирование прессы. Как CNN. Кабельная сеть новостей. Очень важно, если вы хотите контролировать страну, вы должны контролировать прессу. Вы говорите им то, что вы хотите, чтобы они услышали. Вы их отвлекаете?
  rating: orange
  verdict: Что диктатуры подчиняют себе прессу, верно. Но этот пункт взят из той же подделки, а CNN — частная компания, которая конкурирует с другими каналами, а не государственное агентство.
  arguments:
  - media-control
  rhetoric:
  - conspiracy

- id: lecture-5-1466
  start: 1466.9
  end: 1540.7
  text: 'Дэвид Рокфеллер выступил на одной из Иллюминати встреч. И выразил похвалу контролю прессы США и хранению клятвы о неразглашении планов глобалистов. В разговоре к своим товарищам-заговорщикам в 1991 году Рокфеллер сказал: «Мы благодарны Вашингтон Пост, New York Times, Тайм-магазин и другим великим изданиям, директора которых посетили наши встречи и сдержали свои обещания рассудительности на протяжении уже сорока лет». Он продолжал объяснять: «Невозможно было бы разработать наш план, если бы мы были подвержены гласности. Но сейчас мир более обманчив и подготовлен для марша к новому мировому государству. Высшая национальная верховная власть интеллектуальной элиты. И мировых банкиров более предпочтительно. чем национальное самоопределение, практиковавшееся в прошлых столетиях». Он говорит, что миру будет лучше с богатыми банкирами у власти. Он говорит о себе. У него есть почти все деньги. Но он хочет все деньги. И секретное государство — это супербогатые люди.'
  rating: red
  verdict: 'Речь Дэвида Рокфеллера 1991 года, где он благодарит газеты за молчание, известна только из конспирологических брошюр: записи, текста или свидетеля нет, и сами названные газеты о Бильдербергских встречах писали.'
  arguments:
  - globalist-elite
  rhetoric:
  - unverified-quote
  - conspiracy

- id: lecture-5-1543
  start: 1543.0
  end: 1553.2
  text: Просмотрите кассету, называется «Четвёртый рейх богатых». Десса Гриффина. На ней много хорошей информации. Или позвоните мне в офис.
  rating: orange
  verdict: Ховинд советует фильм Деса Гриффина как «хорошую информацию». Но Гриффин — автор конспирологических книг без проверяемых источников; доверять стоит тому, что подтверждено документами.
  arguments:
  - globalist-elite
  rhetoric:
  - conspiracy

- id: lecture-5-1554
  start: 1554.3
  end: 1574.4
  text: 'Вот слова некоторых людей из отдела новостей. Ричард Конд. Он сказал: «Мы установим нашу программу охвата новостей, имея дело с вопросами и темами, которыми мы считаем нужными». Президент новостей CBS сказал: «Наша задача — дать людям не то, что они хотят, но то, что мы считаем нужным».'
  rating: orange
  verdict: 'Что редакция сама решает, о чём рассказывать, верно: так работает любая газета и канал. Но это обычный редакционный отбор, а не признание в заговоре: что важно, редакторы спорят открыто, а разные каналы выбирают по-разному.'
  arguments:
  - media-control
  rhetoric:
  - quote-mining

- id: lecture-5-1575
  start: 1575.3
  end: 1593.8
  text: Если о чём-то говорят очень долго, как, например, суд О. Джея Симпсона, они хотят отвлечь вас от чего-то более важного. Если на новостях что-то большое, это неважно. Это отвлечение внимания, это завеса. Они что-то прячут.
  rating: orange
  verdict: 'Что громкие новости порой заслоняют важные, правда. Но правило «всё громкое — завеса» не проверишь. Так ревнивцу и поздний приход жены, и ранний кажется уликой: если вину «доказывает» что угодно, то не доказывает ничто.'
  arguments:
  - media-control
  rhetoric:
  - conspiracy

- id: lecture-5-1594
  start: 1594.9
  end: 1610.3
  text: Когда они пытались обвинить Клинтона за Монику Левински, это было только прикрытие. Они должны были обвинить его за Китай. Обвинить его за предательство. А не за отношения с Моникой.
  rating: orange
  verdict: Можно считать, что Клинтона надо было судить за другое, это мнение. Но обвинения в импичменте 1998 года были в лжесвидетельстве под присягой и препятствовании правосудию, а не в отношениях с Моникой Левински.
  arguments:
  - media-control
  rhetoric:
  - conspiracy

- id: lecture-5-1613
  start: 1613.6
  end: 1640.5
  text: Я не знаю, почему сенаторы думают, что они должны решать об отстранении президента от должности. Мне кажется, что в Конституции написано, что Палата представителей решает об отстранении президента. И они вынесли такой приговор. И Сенат проводит суд над приговором. Виновен ли он? Но не об отстранении от должности. В нашей стране проблема. Мы отошли от Конституции.
  rating: red
  verdict: Ховинд путает роли палат. По Конституции США палата представителей выдвигает обвинение, а Сенат судит, и осуждение в Сенате само по себе означает отстранение президента от должности (ст. I, разд. 3; ст. II, разд. 4).
  arguments:
  - media-control

- id: lecture-5-1641
  start: 1641.5
  end: 1653.6
  text: 'Герман Динсмор сказал: «New York Times умышленно изменил точку зрения на либеральную, социалистическую». Репортёры новостей, несомненно, либералы. Пресса новостей в основном либеральна.'
  rating: orange
  verdict: Что большинство американских журналистов по опросам скорее либеральны, верно. Но мнение одного автора о газете — не доказательство того, что прессой кто-то управляет.
  arguments:
  - media-control

- id: lecture-5-1655
  start: 1655.4
  end: 1697.1
  text: 'И седьмое. Разрушение веры людей в правителей. Коммунистические правила революции. Восьмое. Регистрация всего оружия. Зачем нужна регистрация всего оружия? Каждый диктатор хочет контролировать оружие. Он сможет контролировать сопротивление. Ленин сказал: «Один человек с оружием может контролировать сто человек без оружия». И когда вооружённый человек заходит в банк, он говорит, чтобы все легли на пол. У одного человека оружие, и все его слушаются. Коммунисты знают это. Они знают, что у человека с оружием есть власть. Все его боятся.'
  rating: orange
  verdict: Что диктаторы стремятся разоружить противников, верно. Но пункт снова взят из поддельных «правил», а источника в сочинениях Ленина для слов «один человек с оружием контролирует сто безоружных» не приводят.
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote

- id: lecture-5-1700
  start: 1700.2
  end: 1709.7
  text: 'Все диктаторы: Ленин, Сталин, Гитлер — призывали к контролю оружия. Потому что они хотели власть. Всё идёт к обману Сатаны: «Вы будете, как боги».'
  rating: orange
  verdict: Диктаторы действительно отбирали оружие у тех, кого боялись. Но нацистский закон о оружии от марта 1938 года ослабил прежние правила для большинства, а евреев разоружил отдельный указ от 11 ноября 1938 года; к обещанию змея «будете как боги» это отношения не имеет.
  arguments:
  - gun-control

- id: lecture-5-1711
  start: 1711.1
  end: 1734.3
  text: 'Наши отцы оставили нам вторую поправку. Статью вторую. Они сказали: «Если государство боится людей, тогда это свобода. Если же люди боятся государства, тогда это тирания». И вторая поправка — это последняя зацепка. Последняя защита от государства. Если испортится само государство.'
  rating: orange
  verdict: 'Вторая поправка действительно гарантирует право на оружие. Но афоризм «если государство боится народа — это свобода» отцам-основателям не принадлежит: исследователи Монтичелло не нашли его у Джефферсона.'
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote

- id: lecture-5-1736
  start: 1736.2
  end: 1771.7
  text: 'И само государство разделено на три разные ответвления. Законодательная власть. Исполнительная власть И судебная власть. И каждая ветвь проверяет и контролирует другую. Наши отцы сказали: «В случае, если всё испортится, у каждого гражданина должно быть оружие». Вторая поправка — право хранить и носить оружие. И этот законопроект о отнятии автоматов. Это ужасно. Это против Конституции, его нужно отменить.'
  rating: orange
  verdict: Что в США три ветви власти и Вторая поправка, верно. Но запрет некоторых видов штурмового оружия 1994 года суды неконституционным не признали; он просто истёк в 2004 году.
  arguments:
  - gun-control

- id: lecture-5-1772
  start: 1772.6
  end: 1804.0
  text: 'Вы скажете: «Доктор Ховинд, вам не нужен автомат для охоты за утками?» А-а, вы убьёте много уток? Но поймите, цель второй поправки не для охоты. Цель второй поправки — чтобы вы могли защитить себя от своего же государства. На всякий случай. Я верю в контроль оружия. Контроль оружия — это умение держать его. И попасть в намеченную цель. Это контроль оружия.'
  rating: orange
  verdict: Что Вторая поправка писалась и с мыслью о защите от тирании, говорят многие историки. Но Верховный суд США (дело Хеллера, 2008) главным её смыслом назвал самооборону; это спорный правовой вопрос, а не бесспорная истина.
  arguments:
  - gun-control

- id: lecture-5-1804
  start: 1804.7
  end: 1823.7
  text: 'Гитлер сказал: «Этот год запомнится в истории. Впервые цивилизованная нация зарегистрирует всё оружие. Наши улицы будут безопаснее, милиция будет эффективнее». Конечно. «И мир последует за нами в будущее». Гитлер был сторонником контроля оружия.'
  rating: red
  verdict: 'Этой речи Гитлера не существует: ни дата, ни текст не подтверждаются. Регистрацию оружия в Германии ввела ещё Веймарская республика в 1928 году, а нацистский закон 1938 года для большинства немцев ослабил разрешительные требования.'
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote

- id: lecture-5-1825
  start: 1825.3
  end: 1842.4
  text: Они регистрировали оружие, чтобы знать, у кого оно есть. И потом всё происходило очень просто. Они знали, у кого есть оружие. Место окружается, и оружие просто-напросто конфисковывается. Так происходит?
  rating: orange
  verdict: Что регистрацией можно злоупотребить, возможно. Но в США федеральный закон 1986 года прямо запрещает вести общий реестр владельцев оружия, так что сценарий «знают у кого — придут и заберут» Ховинд не подтверждает.
  arguments:
  - gun-control

- id: lecture-5-1843
  start: 1843.2
  end: 1866.9
  text: 'Джанет Рено сказала: «Одной регистрации оружия недостаточно». Периоды ожидания — это только шаг. Регистрация — это тоже только шаг. Но целью является запрет частного оружия. Эта идея Карла Маркса. У неё марксистская философия. Это не библейское. Не христианская, неконституционная философия, это марксистская философия.'
  rating: red
  verdict: Слова «цель — запрет частного оружия» известны лишь по показаниям одного слушателя, данным через девять лет после речи; Джанет Рено их отрицала. Назвать оппонента «марксистом» — не довод.
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote
  - loaded-language

- id: lecture-5-1868
  start: 1868.9
  end: 1895.2
  text: 'Сенатор Огайо сказал: «Что хорошего принесёт запрет некоторого оружия? Всё оружие должно быть запретным». Откуда у него эта идея? От коммунизма? Сара Брэди сказала: «Наша задача — создание полностью социалистической Америки — осуществится только тогда, когда те, кто хотят противостоять, будут полностью обезоружены». Интересно.'
  rating: red
  verdict: Цитату Сары Брэди о «социалистической Америке» распространяли оружейные рассылки, но ни даты, ни первоисточника у неё нет. Слова сенатора о запрете всего оружия тоже ходят без даты и источника.
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote

- id: lecture-5-1896
  start: 1896.7
  end: 1914.6
  text: 'Билл Клинтон сказал: «Всё общество страны должно начать крупные облавы, уничтожая, а не продавая найденное оружие». У Клинтона марксистская философия. Он и многие люди находятся под влиянием Карла Маркса.'
  rating: orange
  verdict: Клинтон в 1994 году действительно поддерживал обыски в муниципальных домах Чикаго после перестрелок. Но точных слов в такой форме не находят, а ярлык «марксистская философия» — выпад вместо довода.
  arguments:
  - gun-control
  rhetoric:
  - unverified-quote
  - ad-hominem-pivot

- id: lecture-5-1915
  start: 1915.9
  end: 1935.5
  text: Коммунисты говорят, что они хотят мир. Но у них значение слова «мир» отличается от нашего. Оно значит отсутствие сопротивления. Когда все перестанут сопротивляться коммунизму, тогда будет мир. Им нужен Вьетнам, Корея, Китай, Афганистан. Все страны, вот что им нужно.
  rating: orange
  verdict: Что советский «мир» часто означал покорность, а СССР вторгся в Афганистан, верно. Но Корея, Китай и Вьетнам — разные истории со своими причинами, а не единый план.
  arguments:
  - communist-plan

- id: lecture-5-1937
  start: 1937.4
  end: 1949.1
  text: 'Карл Маркс, отец коммунизма, хотел посвятить свою книгу Дарвину. На первой странице он написал: «Посвящается Дарвину от искреннего поклонника Карла Маркса».'
  rating: red
  verdict: Что Маркс послал Дарвину «Капитал» с надписью «от искреннего почитателя», верно. Но слов «посвящается Дарвину» там нет, а письмо с отказом от посвящения Дарвин написал не Марксу, а Эдварду Эвелингу.
  arguments:
  - darwin-communism

- id: lecture-5-1950
  start: 1950.4
  end: 1966.5
  text: Маркс знал, что его идее коммунизма не будет успеха, без эволюции. Две теории идут вместе. Маркс упоминает о эволюции снова и снова. Прочитайте хоть одну из его работ. И вы увидите эволюцию.
  rating: orange
  verdict: Что Маркс ценил книгу Дарвина и писал о ней, верно. Но коммунизм он изложил в 1848 году, за 11 лет до «Происхождения видов», и обошёлся без него; Дарвина он лишь привлёк в подкрепление уже готовых взглядов.
  arguments:
  - darwin-communism

- id: lecture-5-1968
  start: 1968.0
  end: 1975.2
  text: Иосиф Сталин, советский диктатор, был сторонником эволюции. Он убил около 60 или 100 млн своих людей.
  rating: red
  verdict: 'Что Сталин — один из самых жестоких диктаторов, правда. Но убивал он не во имя биологии: его власть сажала и губила генетиков. А число его жертв историки оценивают от нескольких миллионов до примерно 20 миллионов, а не 60–100.'
  arguments:
  - darwin-communism

- id: lecture-5-1976
  start: 1976.6
  end: 2003.2
  text: Я посетил Украину. В прошлый раз здесь была семья из Украины. Вот сзади. Вы знаете, что Сталин убил 10 млн людей на Украине? Они погибли от голода. И Украина — это хлебная корзина России. Они засеяли поля. За несколько дней до жатвы советские войска собрали весь урожай. И увезли его. Оставили людей умирать. Интересно.
  rating: orange
  verdict: 'Голодомор — правда и страшное преступление: урожай забирали, а людей оставляли умирать. Но историки оценивают число погибших на Украине в 3,5–5 миллионов, а не 10.'
  arguments:
  - darwin-communism

- id: lecture-5-2003
  start: 2003.7
  end: 2024.0
  text: 'Ребёнком Сталин учился в христианской школе. В христианской школе Сталин прочитал вот эту книгу. Когда он прочитал эту книгу, он стал атеистом. Книга изменила его жизнь. Сталин сказал: «Если выживают сильнейшие, тогда я буду сильнейшим».'
  rating: orange
  verdict: Что юный Сталин в духовном училище прочёл Дарвина и стал атеистом, рассказывает советская биография 1940 года. Слов «я буду сильнейшим» в источниках нет. А сталинская власть потом громила генетику, основу теории эволюции.
  arguments:
  - darwin-communism
  rhetoric:
  - unverified-quote

- id: lecture-5-2025
  start: 2025.3
  end: 2076.4
  text: 'Во Второй мировой войне, когда немцы напали на Польшу с одной стороны, и русские с другой, Польская армия была уничтожена через пять дней жестокого сопротивления. Но сопротивляться было почти невозможно. И в конце они сдались. И когда они сдались, солдаты спросили Сталина: «Что нам делать с захваченными польскими офицерами?» Сталин ответил: «Расстреляйте их». Россия отрицала это долгое время. Но они признались в 1992 году. Они признались в расстреле. Они взяли 14 700 офицеров. Завязали им глаза. И расстреляли их. В затылок. Массовые убийства в лесу. Хотина'
  rating: green
  verdict: 'В целом верно: весной 1940 года по решению Сталина расстреляли около 22 000 польских пленных, из них около 14 700 из трёх лагерей. СССР признал это в 1990 году, документы открыл в 1992-м.'
  arguments:
  - darwin-communism

- id: lecture-5-2078
  start: 2078.3
  end: 2099.6
  text: 'Вы скажете, они убили 15 000 офицеров. Да. Вы скажете: «Это же нехорошо». Да. Понимаете, если человек верит в эволюцию, тогда нет Бога, Которому придётся давать ответ. Поэтому не имеет значения, что хорошо. Важно, что выгодно. Цель оправдывает средства.'
  rating: red
  verdict: 'Что Катынь — злодеяние, мы согласны. Но теория эволюции не говорит, что Бога нет: многие христиане её принимают и знают, что дадут ответ Богу. Мораль у них не от биологии, а от Бога.'
  arguments:
  - evolution-morality
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-2100
  start: 2100.6
  end: 2107.4
  text: И соглашение — это средство передвижения. Глупейшие ошибки наших сенаторов — это соглашения с советскими людьми.
  rating: orange
  verdict: Что СССР нарушал некоторые договоры, верно. Но договор 1987 года о ракетах средней и меньшей дальности привёл к уничтожению почти 2700 ракет под взаимной проверкой; назвать договоры «глупейшей ошибкой» — мнение, а не факт.
  arguments:
  - communist-plan

- id: lecture-5-2110
  start: 2110.3
  end: 2143.7
  text: 'Вы скажете: «Брат Ховинд, да они голодают, не должны ли мы дать им хлеба?» Если они голодают… Скажите мне, почему они увеличили производство оружия в шесть раз за последние 10 лет? Наш руководитель как-то спросил их руководителя: «Почему вы производите столько танков, оружия, бомб, подводных лодок? Зачем столько военной техники?» Ему ответили: «Мы не хотим безработицы». О, хороший ответ.'
  rating: orange
  verdict: Что СССР тратил на оружие огромные деньги, верно. Но цифра «в шесть раз за 10 лет» дана без источника, а разговор руководителей с ответом «не хотим безработицы» пересказан без имён и даты.
  arguments:
  - communist-plan
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-5-2145
  start: 2145.8
  end: 2167.7
  text: Если вы думаете, что Советский Союз изменился, вы ошибаетесь. Коммунизм возвратится с большей силой. Запомните мои слова. Советский Союз не разрушился. Они не развалили Берлинскую стену, чтобы мы смогли зайти. Она им уже не нужна. Коммунизм уже везде. Стена больше не нужна.
  rating: red
  verdict: 'Распад СССР в 1991 году — документированный факт: 15 республик стали отдельными государствами, Варшавский договор распустили. Предсказание, что «коммунизм вернётся с большей силой», не сбылось.'
  arguments:
  - communist-plan
  rhetoric:
  - conspiracy

- id: lecture-5-2170
  start: 2170.8
  end: 2204.3
  text: Пол Пот — диктатор коммунистической Камбоджи. Он убил одну треть всего населения. Казнил? Как-то я встретил в Пенсаколе людей, все родственники которых были убиты. Я встретил в магазине человека, вся его семья — отец, мать, братья, сёстры, тёти, дяди. Все были убиты Пол Потом. Он остался. Один. Вы можете себе представить убийство одной трети или половины всего населения?
  rating: green
  verdict: 'Верно: при Пол Поте в 1975–1979 годах в Камбодже погибло около 1,7–2 миллионов человек, примерно четверть населения. Боль таких семей мы разделяем.'
  arguments:
  - darwin-communism

- id: lecture-5-2206
  start: 2206.8
  end: 2215.2
  text: 'Питер Сингер сказал: «Христианство — это наш враг. Следуя животному правилу успеха, мы должны уничтожить иудеохристианскую традицию».'
  rating: orange
  verdict: Философ Питер Сингер действительно спорит с христианским учением об особой ценности человеческой жизни. Но таких слов, «христианство — наш враг» и «надо уничтожить», в его текстах не находят.
  arguments:
  - environmentalism-control
  rhetoric:
  - unverified-quote

- id: lecture-5-2217
  start: 2217.4
  end: 2232.4
  text: Мао Цзэдун, диктатор коммунистического Китая. Кстати, с американской помощью. Американские капиталисты финансировали захват Китая. Чтобы именно коммунисты захватили его. Печальная история. Кто-то ответит за это перед Богом.
  rating: red
  verdict: США в гражданской войне в Китае поддерживали противников Мао — правительство Чан Кайши, и деньгами, и оружием. Американского финансирования прихода коммунистов к власти историки не находят.
  arguments:
  - globalist-elite
  rhetoric:
  - conspiracy

- id: lecture-5-2233
  start: 2233.8
  end: 2254.0
  text: Но после захвата Китая Мао назвал Дарвина и Гексли его любимыми авторами. Когда Мао Цзэдун захватил Китай, он начал убивать христиан. Потому что христиане не уживаются в коммунистических странах. Он убивал 15 000 человек в месяц.
  rating: orange
  verdict: Мао действительно читал Дарвина и Гексли в китайском переводе, а христиан при нём преследовали. Но цифра «15 000 убитых в месяц» дана без источника, а чтение книги не делает биологию виновной в его злодеяниях.
  arguments:
  - darwin-communism

- id: lecture-5-2256
  start: 2256.9
  end: 2266.5
  text: И в школах учат этому в нашей стране. И вы платите за это, чтобы вырастить поколение гуманистов, социалистов или, может быть, коммунистов.
  rating: red
  verdict: Эволюцию преподают и в христианских школах, и в странах, где нет ни социализма, ни коммунизма. Знание биологии не делает ребёнка коммунистом, а многие верующие учителя преподают её с чистой совестью.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - loaded-language

- id: lecture-5-2268
  start: 2268.1
  end: 2277.2
  text: 'Детей учат этому: «Жизнь произошла из неживого вещества, существующего раньше на Земле». Это не факт, это сказка. Но детей проверяют.'
  rating: orange
  verdict: Что возникновение жизни пока не объяснено, верно, и учебнику стоит это говорить. Но это не сказка, а научный вопрос. Мы тоже верим, что жизнь дал Бог; наука спрашивает, как это произошло, и честно говорит, что пока не знает.
  arguments:
  - origin-of-life
  rhetoric:
  - loaded-language

- id: lecture-5-2278
  start: 2278.8
  end: 2286.0
  text: 'Этот автор сказал: «Нужно выступить против креационизма. Ни одному стороннику этой пропаганды нельзя обучать классам науки».'
  rating: orange
  verdict: Автор цитаты не назван, проверить её нельзя. А то, что в государственных школах США креационизм не преподают как естественную науку, следует из решения суда 1987 года, отменившего закон, обязывавший ему учить; это не тайный сговор.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-5-2287
  start: 2287.4
  end: 2311.7
  text: Если учитель начинает учить о сотворении По закону это можно? Они рискуют потерять свою работу. Спросите любого учителя. Они боятся говорить о Библии или о сотворении. Потому что всегда существует напряжённость боязни потерять свою работу. Но закон этого не запрещает. Но они знают, что будет преследование.
  rating: orange
  verdict: 'Что закон прямо не запрещает учителю говорить о сотворении, отчасти верно: суд в 1987 году лишь отменил закон, обязывавший ему учить. Но преподавать креационизм как естественную науку суды считали нарушением Первой поправки (статьи Конституции США, по которой государство не насаждает религию, в том числе в школах). Осторожность учителей связана с законом, а не с «преследованием».'
  arguments:
  - public-schools-indoctrination

- id: lecture-5-2312
  start: 2312.8
  end: 2329.8
  text: Профессор Айовы сказал, что вы должны провалить любого студента, независимо от его оценки, если вы узнаете, что он верит в сотворение. К тому же кафедра должна иметь право на опровержение оценок и возможность степеней, если он поверит в сотворение позднее. Интересно.
  rating: orange
  verdict: 'Профессор не назван, источник не указан. Даже если кто-то такое сказал, это мнение одного человека, а не правило университетов: оценку ставят за знание предмета, а не за веру.'
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - appeal-authority-unnamed

- id: lecture-5-2332
  start: 2332.8
  end: 2365.3
  text: 'Наши отцы сказали: «Мы придерживаемся очевидной истины, что человек обеспечен своим Творцом». Вот почему эволюция связана с новым мировым порядком. Если есть Творец, то наши права произошли от Творца. И основатели этой страны верили, что права происходят от Бога. Права не от государства, а от Бога. Но есть люди, которые хотят, чтобы вы жили по их правилам. Это социализм. Это не христианство.'
  rating: orange
  verdict: 'Мы тоже верим, что права человека даны Творцом, и Декларация независимости это говорит. Но из этого не следует связь эволюции с «новым мировым порядком»: христиане, принимающие эволюцию, тоже верят в Творца.'
  arguments:
  - rights-from-creator
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-5-2366
  start: 2366.5
  end: 2396.7
  text: Есть две философии государства. По философии эволюции права исходят от государства. Это называется демократия. Демократия — это опасная форма государства. Она всегда превращается в диктатуру. Демократия опасна и смертельна. Потому что они решают, что правильно и неправильно, основываясь на мнении большинства. Меня беспокоят все эти опросы, решая, что правильно и неправильно, по опросам.
  rating: red
  verdict: 'Что большинство может ошибаться, верно. Но теория эволюции ничего не говорит о государстве, а демократия не «всегда превращается в диктатуру»: многие демократии живут веками, и сами США — демократическая республика.'
  arguments:
  - rights-from-creator
  rhetoric:
  - lozhnaya-dilemma
  - podmena-ponyatij

- id: lecture-5-2398
  start: 2398.3
  end: 2427.3
  text: 'Нет. Лучше решать, что правильно и неправильно, основываясь на законе. Сегодня наши лидеры только и смотрят, куда дует ветер. Нам нужны люди, которые встанут и скажут: «Я буду делать, что правильно». Потому что так говорит закон. Есть другая философия государства, основанная на креационизме, которая говорит, что Творец создал законы. И права неоспоримы. Это называется республикой. Где высший закон?'
  rating: orange
  verdict: 'Что законы должны стоять выше сиюминутного мнения, разумно. Но республика — устройство, а не учение о творении: были и безбожные республики, и христианские монархии.'
  arguments:
  - rights-from-creator
  rhetoric:
  - lozhnaya-dilemma

- id: lecture-5-2429
  start: 2429.5
  end: 2500.8
  text: 'Мистер Ефремов, его дочь вышла замуж за моего работника. Его сын Давид тоже работает на меня. Они из Украины. Он пришёл ко мне и поставил свой аттестат среднего образования на мой стол. Он сказал: «Мистер Ховинд, это мой аттестат». Я подумал: «У вас уже пять детей, зачем вы мне показываете свой аттестат?» Он сказал: «Брат Ховинд, вы не понимаете? Я его только что получил по почте». Он сказал: «Вы не понимаете, я вырос на Украине, в Советском Союзе». Он учился в школе очень хорошо. Он показал мне свои оценки. Он сказал: «Мы должны были сдать экзамен, чтобы закончить школу». И на одном из вопросов на экзамене спрашивалось: «Вы верите в эволюцию?» Я ответил: «Нет». И я не смог закончить школу. Мне прислали мой аттестат 35 лет спустя. Также интересная история, почему ему выслали аттестат. Вы мне можете позвонить, я вам расскажу.'
  rating: orange
  verdict: Что в СССР верующих школьников притесняли, правда. Но там эволюцию преподавали вместе с обязательным атеизмом; беда была в атеистическом государстве, а не в биологии. Рассказ из вторых рук проверить нельзя.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - personal-story

- id: lecture-5-2501
  start: 2501.7
  end: 2536.1
  text: Гуманисты решили использовать школьную систему, чтобы распространять гуманизм и коммунизм. Каждая государственная школа — это школа гуманизма. Они знают, что воскресная школа ничего не изменит, только часом недели. У них дети находятся 6 часов в день, 5 дней в неделю. Верят ли гуманисты в высшее существо? О да, это высшее существо, человек. Они говорят, что борьба за человеческое будущее должна победить в классах школы учителями, которые правильно понимают свою роль как сеятели новой веры, которая заменит разлагающееся тело христианства.
  rating: orange
  verdict: 'Цитата реальна: её автор Джон Данфи написал это в журнале гуманистов в 1983 году. Но это мнение одного автора, а не программа всех школ; среди учителей государственных школ много верующих.'
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - cherry-picking

- id: lecture-5-2537
  start: 2537.7
  end: 2546.7
  text: Друзья, мы враги гуманистов. Цель — это коммунизм. Так сказал основатель Американского Союза Гражданской свободы.
  rating: orange
  verdict: Основатель ACLU Роджер Болдуин в 1935 году действительно назвал коммунизм своей целью. Но позже он порвал с коммунистами, и в 1940 году их исключили из руководства ACLU; взгляды основателя не решают правовых вопросов.
  arguments:
  - communist-plan
  rhetoric:
  - ad-hominem-pivot

- id: lecture-5-2549
  start: 2549.2
  end: 2582.3
  text: Карл Маркс, отец коммунизма, в 17 лет написал прекрасное сочинение о его любви к Господу. Потом он поступил в колледж. Сколько детей из христианских семей поступили в светские школы, и их вера была разрушена? Вы знаете кого-то? Джеймс Добсон сказал, что 70% верующих детей, поступивших в светские школы, теряют веру в Библию. Это трагедия.
  rating: orange
  verdict: Школьное сочинение Маркса 1835 года о единении с Христом действительно существует, а уход молодёжи из церквей — настоящая беда. Но цифра 70% без источника, а причины ухода исследования видят не только в школе.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - post-hoc

- id: lecture-5-2583
  start: 2583.1
  end: 2612.7
  text: 'Впоследствии Карл Маркс сказал: «Моя цель — опровержение Бога и разрушение капитализма». Карл Маркс основал идею коммунизма на эволюции. Он был неудачником. У него было шесть детей. Трое умерли от голода младенцами. Двое покончили с самоубийством. После смерти на похороны Маркса пришло только шесть человек. Он был неудачником. Но сегодня одна треть всего мира находится под его влиянием.'
  rating: red
  verdict: Что дети Маркса умирали в нужде, верно. Но коммунизм Маркс изложил в 1848 году, до книги Дарвина; слова «моя цель — опровержение Бога» в его трудах не находят, а «неудачник» — выпад, а не довод.
  arguments:
  - darwin-communism
  rhetoric:
  - ad-hominem-pivot
  - unverified-quote

- id: lecture-5-2616
  start: 2616.1
  end: 2636.7
  text: Коммунистический манифест. Я уже сказал, что эта сессия будет политической, поэтому некоторые уже выходят. Карл Маркс разработал коммунистический манифест. Если вы хотите контролировать страну, создать коммунизм, вы должны предпринять 10 шагов. Первое — отмена частной собственности. Это придумал Маркс.
  rating: green
  verdict: 'Верно: в «Манифесте коммунистической партии» перечислены десять мер, и первая — отмена частной собственности на землю.'
  arguments:
  - communist-plan

- id: lecture-5-2637
  start: 2637.3
  end: 2651.4
  text: Это настоящая цель защиты окружающей среды. Они не пытаются сохранить окружающую среду, они хотят отменить частную собственность. Они хотят, чтобы вы получили их разрешение, чтобы срезать ваше дерево на вашей земле.
  rating: red
  verdict: Законы об охране природы действительно ограничивают, что можно делать на своей земле. Но они не отменяют собственность, а если государство забирает землю, Конституция США требует заплатить за неё.
  arguments:
  - environmentalism-control
  rhetoric:
  - conspiracy

- id: lecture-5-2652
  start: 2652.7
  end: 2684.1
  text: Наши отцы знали о частной собственности. Потому что они были под влиянием Библии. Библия говорит о собственности. Даже в книге Левит была система, где каждый пятидесятый год вы получали назад вашу собственность. Вы не могли потерять собственность навсегда. Если вы были ленивыми или плохим бизнесменом, вы потеряете собственность. Но ваша семья получит её назад. Библия говорит:«Каждый под виноградником своим и под смоковницею своею». Владение собственностью необходимо для свободы.
  rating: purple
  verdict: Мы тоже видим в Библии уважение к собственности (Мих 4:4), и Ховинд верно называет юбилейный, пятидесятый год, когда землю возвращали роду (Лев 25:10). Но сколько из закона Израиля следует для нынешнего государства, христиане спорят.
  arguments:
  - rights-from-creator

- id: lecture-5-2684
  start: 2684.6
  end: 2708.4
  text: 'Но наши отцы сделали несколько ошибок. Их девизом было: «Жизнь, свобода, И стремление к счастью». Объясните, что это такое? Настоящим девизом было жизнь. Свобода и собственность. Право на владение собственностью. Очень важно для свободы.'
  rating: orange
  verdict: Формула «жизнь, свобода и собственность» действительно восходит к философу Джону Локку. Но Джефферсон сознательно написал «стремление к счастью»; это выбор автора Декларации, а не ошибка.
  arguments:
  - rights-from-creator

- id: lecture-5-2709
  start: 2709.5
  end: 2720.9
  text: 'Президент Национального общества Одюбона Питер Берл сказал: «Мы отвергаем идею частной собственности». Откуда у него эта идея? Он читал Маркса.'
  rating: orange
  verdict: Питер Берл действительно возглавлял Национальное общество Одюбона. Но слов «мы отвергаем частную собственность» в проверяемом источнике нет, а «он читал Маркса» — догадка вместо довода.
  arguments:
  - environmentalism-control
  rhetoric:
  - unverified-quote
  - ad-hominem-pivot

- id: lecture-5-2722
  start: 2722.4
  end: 2740.4
  text: Второй пункт Маркса. Высокие увеличивающиеся подоходные налоги. Как-то Рейган сказал, что налоговая система в Америке основана на идее Карла Маркса. Интересно. Вы можете прочитать это на моём веб-сайте.
  rating: orange
  verdict: 'Верно: «высокий прогрессивный налог» есть в «Манифесте», и Рейган в 1960-е годы говорил, что этот налог «прямо от Маркса». Но это оценка политика: став президентом, Рейган ступенчатый налог сохранил, и он есть в странах, далёких от коммунизма.'
  arguments:
  - communist-plan

- id: lecture-5-2741
  start: 2741.1
  end: 2749.8
  text: Многие люди не знают, что они не должны платить налоги. Это добровольно для многих людей. Адрес. goodbiz.com
  rating: red
  verdict: 'Совет «налоги платить необязательно» ошибочен и опасен: суды США много раз отвергали этот довод, и поверившие ему платят штрафы, а иногда садятся в тюрьму.'
  arguments:
  - federal-reserve

- id: lecture-5-2751
  start: 2751.1
  end: 2784.3
  text: Третье. Отмена права наследства. Четвёртое. Конфискация прав собственности. Пятое. Центральный банк. Для коммунизма нужен Центральный банк. В Америке у нас есть так называемые федеральные резервные банкноты. Это не доллар. Это федеральная резервная банкнота. Ну, они не федеральные. Или государственные. Государство арендует их за доллар с процентами. У федерального резерва.
  rating: red
  verdict: Центральный банк есть почти во всех странах, не только коммунистических. Банкноты ФРС — законные доллары; государство их не «арендует», а прибыль ФРС перечисляет в Казначейство США.
  arguments:
  - federal-reserve
  rhetoric:
  - conspiracy

- id: lecture-5-2785
  start: 2785.6
  end: 2812.7
  text: 'Люди говорят: «У нас национальный долг в $10–15 трлн». Кому мы должны эти деньги? Мы должны их богатым банкирам. Они занимают нам наши деньги. Наше государство платит за отпечатку 3 цента. Потом даёт их федеральному резерву. И резерв арендует государству за доллар. С процентами. Постарайтесь понять эту сделку.'
  rating: red
  verdict: Что госдолг США огромен, верно. Но он состоит из облигаций, которыми владеют пенсионные фонды, обычные граждане, банки, иностранные государства и сама ФРС, а не горстка банкиров.
  arguments:
  - federal-reserve
  rhetoric:
  - conspiracy

- id: lecture-5-2813
  start: 2813.8
  end: 2830.8
  text: Вы должны прочитать про Федеральный резерв и связь с Рокфеллерами. Есть хорошая серия книг о связи Рокфеллеров с Федеральным резервом. Хрущёв хвастался, что он получал секреты от основанной Рокфеллером организации ЦРУ.
  rating: red
  verdict: ФРС создана законом Конгресса в 1913 году, ЦРУ — законом 1947 года о национальной безопасности; ни то ни другое не «основал Рокфеллер». Похвальба Хрущёва приведена без источника.
  arguments:
  - federal-reserve
  rhetoric:
  - conspiracy

- id: lecture-5-2833
  start: 2833.2
  end: 2852.6
  text: Вы слышали про организацию ЦРУ? Вы знаете, что ЦРУ ответственно за ввоз наркотиков в Америку? Чтобы создать проблему и получить повод для увеличения силы полиции. Им нужна мощная полиция для восстановления нового мирового порядка. Всё идёт шаг за шагом.
  rating: orange
  verdict: Что некоторые союзники ЦРУ в Центральной Америке торговали наркотиками, признал в 1998 году генеральный инспектор самого ЦРУ. Но плана ввозить наркотики, чтобы усилить полицию, расследования не нашли.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy
  - appeal-to-doubt

- id: lecture-5-2853
  start: 2853.7
  end: 2866.2
  text: Библия говорит, что люди занимают деньги на подать царю и отдают детей своих в рабы. Это что произошло с нами? Мы оставили нашим детям и внукам долг, который они никогда не выплатят. Они будут рабами навсегда.
  rating: orange
  verdict: 'Огромный госдолг — серьёзная забота, и в Неем 5:4–5 долги правда приводили к рабству. Но госдолг — не долг семьи ростовщику: государство должно его в основном своим же гражданам, пенсионным фондам и банкам, и детей за него в рабство никто не отдаёт.'
  arguments:
  - federal-reserve
  rhetoric:
  - loaded-language

- id: lecture-5-2866
  start: 2866.6
  end: 2879.5
  text: Шестое. Государственный контроль коммуникации и передвижения. Контроль производства и земледелия. Контроль рабочей силы. Общие колхозы — региональное планирование. Бесплатное образование для всех.
  rating: green
  verdict: 'Верно: остальные пункты «Манифеста» переданы близко к тексту, включая централизацию транспорта и связи и бесплатное общественное воспитание детей.'
  arguments:
  - communist-plan

- id: lecture-5-2880
  start: 2880.6
  end: 2894.1
  text: Вы знали, что школы — это идея Маркса, государственные школы? В середине XVIII столетия почти все ходили в частные школы. И в Америке было хорошо. Почти каждый мог читать.
  rating: red
  verdict: 'Общественные школы появились за сотни лет до Маркса, и придумали их христиане, чтобы каждый мог читать Библию: Лютер в 1524 году, пуритане Массачусетса в 1647-м. Маркс лишь повторил эту идею в 1848 году.'
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - guilt-by-association

- id: lecture-5-2896
  start: 2896.1
  end: 2928.7
  text: Я хочу, чтобы любой человек из этого зала взял учебник, к примеру, восьмого класса частной школы 1830 года. Нам будет трудно понять, о чём там написано. Эти дети в восьмом классе читали на уровне университета. И кто преподавал в университете, скажет вам, что сегодня студенты читают, пишут и думают на уровне шестого класса. А вы знаете, о чём я говорю?
  rating: orange
  verdict: 'Старые учебники действительно бывают трудными. Но грамотность в США за XIX–XX века выросла, а не упала: в 1870 году неграмотным был каждый пятый взрослый, к концу XX века — меньше одного процента.'
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - cherry-picking

- id: lecture-5-2931
  start: 2931.0
  end: 2970.7
  text: Как насчёт этого? «Каждый ребёнок, посещающий школу с пяти лет, является умственно больным, потому что он приходит в школу с верностью к выбранным руководителям, основателям учреждения, государству, патриотизму, независимости. Всё это доказывает, что он болен, потому что он нормальный индивидуум, отвергает всё это. И которого я называю дитём будущего». Это сказал учитель Гарвардского университета. Любой ребёнок, верующий в Бога, умственно больной. Это из учебника государственной школы? Вы платите, чтобы этому учили детей?
  rating: orange
  verdict: Похожие слова приписывают гарвардскому психиатру Честеру Пирсу (1972), но известны они лишь в пересказах. Даже если он так сказал, это фраза одного человека на семинаре, а не школьный учебник.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - unverified-quote
  - loaded-language

- id: lecture-5-2972
  start: 2972.5
  end: 2988.6
  text: Прочитайте книгу, называется «Четвёртый рейх богачей». Дес Гриффин. Вы узнаете, как Рокфеллер использовал миллионы для продвижения гуманизма в системе образования. Если у вас есть знакомые учителя государственных школ, помогите им выйти из NEA.
  rating: red
  verdict: 'Фонд Рокфеллера действительно вкладывал деньги в образование, медицину и даже миссионерские школы. Но тайного «насаждения гуманизма» Ховинд не показывает: он ссылается на конспирологическую книгу без документов.'
  arguments:
  - globalist-elite
  rhetoric:
  - conspiracy

- id: lecture-5-2989
  start: 2989.1
  end: 2997.6
  text: 'Сатана сказал этим людям: У вас есть деньги? У вас есть власть? Ещё немного, и вы сможете быть как боги. Он обманул их?'
  rating: orange
  verdict: Мы тоже верим, что сатана искушает властью и богатством (Мф 4:8–9). Но что конкретные богачи состоят в его заговоре, Ховинд не доказывает, а только утверждает.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-2998
  start: 2998.9
  end: 3012.2
  text: Эволюция — основа нацизма. Муссолини, Гитлер, Сталин — все эти диктаторы, хоть они и воевали на разных сторонах, у них была одинаковая философия. Что люди не важны.
  rating: red
  verdict: Что Муссолини, Гитлер и Сталин презирали человеческую жизнь, правда. Но презрение к людям старше Дарвина, а нацисты злоупотребили теорией, как рабовладельцы злоупотребляли Библией. От злоупотребления теория не становится ложной.
  arguments:
  - darwin-hitler

- id: lecture-5-3014
  start: 3014.8
  end: 3030.6
  text: Муссолини — итальянский диктатор. Не коммунист, а фашист. Думал, что итальянцы высшие и эфиопы — низшие. Потому что они чёрные. И итальянцы убивали эфиопов только потому, что они были чёрными.
  rating: orange
  verdict: Италия Муссолини действительно жестоко воевала в Эфиопии в 1935–1936 годах, с газовыми атаками. Но это была война за колонию, какие европейские державы вели веками, а не вывод из теории эволюции.
  arguments:
  - darwin-hitler

- id: lecture-5-3031
  start: 3031.7
  end: 3052.9
  text: Гитлер верил в теорию эволюции. Гитлер верил, что немцы были высшей расой и заслуживали править миром. Гитлер написал книгу «Майн кампф». В этой книге он написал о высших расах. И о низших людях. «Природа не желает объединения слабых и сильных людей. Менее этого она желает объединения высшей и низшей расы».
  rating: orange
  verdict: Цитата из «Майн кампф» близка к тексту, и Гитлер действительно говорил о «борьбе» рас. Но нацисты даже изымали из библиотек популярные книги об эволюции (например, немецкого биолога Геккеля), так что опорой своего учения дарвинизм не считали.
  arguments:
  - darwin-hitler

- id: lecture-5-3054
  start: 3054.5
  end: 3075.8
  text: 'Кто низшая раса? Гитлер? Гитлер хотел отослать евреев. Он думал, что они низшая раса. Он сказал: «Мы отдадим их, отправим их на роскошных кораблях». Кому они нужны? Вы знаете, что Америка закрыла двери для евреев в 1938 году? И запретила их въезд. Потому что наши лидеры думали, что они были низшими видами.'
  rating: orange
  verdict: 'Верно, что на конференции в Эвиане в 1938 году США не расширили квоты для еврейских беженцев. Но въезд не запретили: в 1939 году уроженцам Германии выдали столько виз, сколько разрешал закон, — около 27 тысяч. Мешали строгие лимиты и неприязнь к евреям, а не вера в эволюцию.'
  arguments:
  - darwin-hitler

- id: lecture-5-3078
  start: 3078.7
  end: 3113.3
  text: 'Я был в Нью-Гэмпшире, я там проповедовал, и я посетил библиотеку университета. Там было много книг про Гитлера и геноцид. Большая часть библиотеки только про Гитлера. Я читал много про Гитлера. Я подошёл к библиотекарю и спросил: «Сэр, а почему Гитлер убивал евреев, а не кого-то другого? Он убивал много людей, но он ненавидел именно евреев». Он сказал, что у Гитлера был список. Я попросил посмотреть на этот список. Вот список Гитлера.'
  rating: neutral
  verdict: Рассказ о разговоре с библиотекарем — вступление к «списку Гитлера», который разбираем ниже.
  rhetoric:
  - personal-story

- id: lecture-5-3114
  start: 3114.5
  end: 3163.8
  text: Гитлер думал, что скандинавцы, белокурые, голубоглазые, были близки к чистым арийцам. Он думал, это была высшая раса. Вы поняли? Светлые волосы. Голубые глаза. Норвежец. Гитлер думал, что норвежцы, скандинавцы были высшей расой. Под ними были немцы, каштановые волосы и голубые глаза. Думал, они были в основном арийцами. Он сказал, что средиземноморцы были слегка арийцы. Славяне были полуарийцами. Полуобезьянами. Азиаты? Китайцы, японцы, филиппинцы — они были слегка обезьяны. Чёрные африканцы в основном обезьяны. Евреи близки к чистой обезьяне.
  rating: orange
  verdict: Что нацисты делили народы на «высшие» и «низшие», считая славян и евреев недочеловеками, правда. Но «списка Гитлера» со шкалой от арийца к обезьяне как документа Ховинд не называет, и его источник неизвестен.
  arguments:
  - darwin-hitler
  rhetoric:
  - unverified-quote

- id: lecture-5-3171
  start: 3171.4
  end: 3190.3
  text: Они учили этому? Люди Гитлера убивали евреев и думали, что они служат человечеству. Уничтожая низших. Если бы они убили всех евреев, угадайте, кто бы был следующим? Чёрные люди. Гитлер ненавидел африканцев.
  rating: green
  verdict: 'В целом верно: нацисты считали чернокожих «низшими» и в 1937 году тайно стерилизовали сотни чернокожих подростков в Германии. Что они были бы «следующими», — догадка, но правдоподобная.'
  arguments:
  - darwin-hitler

- id: lecture-5-3191
  start: 3191.1
  end: 3221.3
  text: 'Кто-то знает, где происходили Олимпийские игры в тридцать шестом году? В Берлине. Кто-то знает, кто выиграл большинство золотых медалей? Джесси Оуэнс, чёрный американский атлет. Гитлер разозлился и выбежал со стадиона. Он сказал: «Это несправедливо, чтобы мои люди соревновались с этим». Животным. Это исходит от его философии. Испорченного мышления. Веры в теорию эволюции.'
  rating: orange
  verdict: Верно, что Оуэнс взял четыре золота, больше всех на Играх, а Шпеер вспоминал, как Гитлер раздражённо говорил, что таких атлетов надо отстранить. Но что он выбежал со стадиона, не подтверждается.
  arguments:
  - darwin-hitler
  rhetoric:
  - appeal-to-doubt

- id: lecture-5-3223
  start: 3223.0
  end: 3235.7
  text: Если бы он читал Библию, Деяния, 17-ю главу, он бы узнал, что все нации одной крови. Мы все произошли от Ноя. До этого от Адама. И нет причин быть расистом.
  rating: green
  verdict: 'Верно: апостол Павел говорит, что Бог «от одной крови произвёл весь род человеческий» (Деян 17:26), и генетика тоже показывает единство человечества. Расизму нет оправдания.'

- id: lecture-5-3236
  start: 3236.7
  end: 3248.5
  text: Если вы пошлёте миссионера через море, чтобы привести чёрного человека к Богу, но не перейдёте улицу, вы лицемер. И не говорите мне, что вы любите Бога. Вы даже не знаете, что это такое.
  rating: neutral
  verdict: Проповедь против расизма среди христиан; с ней мы полностью согласны.

- id: lecture-5-3250
  start: 3250.6
  end: 3273.3
  text: 'Еврейский пленник, выживший массовое уничтожение, сказал: «Существует разница между теми, кто смотрит на своих товарищей как на создание одного Творца, и теми, кто смотрит на них как на скопление биологических и химических элементов». Является ли человек скоплением элементов? Так учит эволюция.'
  rating: orange
  verdict: 'Что человек больше, чем набор химических элементов, мы, христиане, верим: Бог вдунул в него дыхание жизни (Быт 2:7). Биология изучает, из чего состоит тело, но не решает, есть ли у человека душа: слова «человек — только химия» — мнение атеиста, а не вывод науки.'
  arguments:
  - evolution-morality
  rhetoric:
  - straw-man

- id: lecture-5-3275
  start: 3275.1
  end: 3311.8
  text: 'Гитлер строил лагеря. Я был в Ласбурге. Ваш муж уже приехал из Германии? Он жил во время Гитлера до десяти лет. Ко мне подошёл проповедник из Висконсина и сказал: «Доктор Ховинд, вы правы. Гитлер обучал молодёжь. Я был гитлеровской молодёжью. Самое первое, о чём нас учили в школе, это… Это эволюция. Чтобы показать, что мы — это высшая раса». И люди начали убивать низшие расы. Сажать в тюрьмы, расстреливать. Вообще просто убивать.'
  rating: orange
  verdict: Что нацистская школа внушала детям расовое превосходство, прикрывая его словами о «борьбе за существование», правда. Но сама биология потом показала, что «высших» рас нет.
  arguments:
  - darwin-hitler
  rhetoric:
  - personal-story

- id: lecture-5-3314
  start: 3314.1
  end: 3333.7
  text: Вы не поймёте, что происходило с евреями, пока вы не поймёте, как это связано с философией эволюции. Почему они так поступали? Потому что они думали, что евреи низшие. Ничем не отличается от выдёргивания бурьянов. Если вы думаете, что это человеческий сорняк, вы уничтожаете его.
  rating: red
  verdict: 'Нацисты действительно называли евреев «сорняком» и уничтожали их. Но это слово из их идеологии, а не из биологии: в науке нет «людей-сорняков», все люди — один вид.'
  arguments:
  - darwin-hitler

- id: lecture-5-3334
  start: 3334.4
  end: 3371.4
  text: Я стоял на платформе, где стоял Гитлер на этой фотографии. Гитлер собирал громадные митинги. Он собирал множество людей. Для того чтобы человек чувствовал себя маленьким перед общим делом. Чтобы человек был готов погибнуть за это дело. То же самое происходит и с движением по защите природы. В школах детей учат, что они должны спасти планету. Спасите Землю. Великое дело, вы не важны. Важно общее дело. Одинаковое рассуждение.
  rating: orange
  verdict: 'Что Гитлер учил людей растворяться в «общем деле», правда. Но призыв беречь природу — не нацистский митинг: забота о творении есть и в Библии (Быт 2:15), и сходство одного приёма не делает дела одинаковыми.'
  arguments:
  - environmentalism-control
  rhetoric:
  - false-analogy
  - guilt-by-association

- id: lecture-5-3372
  start: 3372.2
  end: 3392.4
  text: 'Гитлер начал работать на молодых людях. Он всегда учил молодёжь. Однажды он сказал: «Позвольте мне контролировать учебники, и я смогу контролировать страну». Ему было всё равно, что думали старшие люди. Один человек сказал: «Я никогда не соглашусь с тобой». Гитлер сказал: «Ты мне не нужен. У меня есть твои дети».'
  rating: orange
  verdict: Слова «у меня уже есть ваши дети» Гитлер действительно сказал в 1933 году, и молодёжь нацисты обрабатывали упорно. А фразы «дайте мне учебники, и я буду управлять страной» в его речах не находят.
  arguments:
  - darwin-hitler
  rhetoric:
  - unverified-quote

- id: lecture-5-3393
  start: 3393.0
  end: 3418.9
  text: 'Гитлер хотел, чтобы думали, что он христианин. Но он не был. Он только прятался за крестом. Вот хорошая книга о кресте Гитлера. Также вот фотография-пропаганда, разосланная по всей Германии. Гитлер выходит из церкви. Многие думали: «Наш фюрер — христианин». Но их крестили в нацистов. У них были нацистские жертвенники. Многие не знают об этом.'
  rating: green
  verdict: 'В целом верно: на людях Гитлер говорил о «положительном христианстве», а в узком кругу враждебно отзывался о Церкви. Горько, что многие немецкие христиане тогда ему поверили.'

- id: lecture-5-3420
  start: 3420.8
  end: 3443.5
  text: Человек из Иллинойса несколько лет назад рассказал полиции, что он выбрал человека по телефонной книге и убил его. Он сказал, что этот человек был пластическим хирургом. Он сказал, что они делают голубые контактные линзы. И разбавляют арийскую красоту. Если вы думаете, что нацизм мёртв, повнимательнее читайте газеты.
  rating: neutral
  verdict: 'Газетный случай: убийство на почве неонацистских взглядов. Что нацизм не умер, к сожалению, верно.'

- id: lecture-5-3445
  start: 3445.4
  end: 3451.5
  text: Идея того, что одна раса выше другой, происходит от идеи эволюции. Она не происходит от Бога.
  rating: red
  verdict: 'Мы тоже верим, что расизм не от Бога. Но и не от теории эволюции: людей делили на «высших» и «низших» даже с помощью искажённого «проклятия Хама», а современная биология показывает, что люди — один вид без «высших» рас.'
  arguments:
  - darwin-racism

- id: lecture-5-3453
  start: 3453.4
  end: 3574.8
  text: 'Все мы сотворены из земли. Открывается гнев с неба очень скоро. Бог объявил им, что он создатель мира. Это видно, ясно? Так что они безответные. Нет причины для непринятия Христа как Спасителя. Я хочу показать ещё несколько вещей, как эта философия повлияла на мир. На следующей сессии. И расскажу о практических шагах, которые мы должны предпринять. Мы поговорим о новом мировом порядке. О принятых исполнительных приказах и о людях, которые хотят уничтожить эту страну. Это будет немного политическая часть. Так что вы можете её пропустить. Мы поговорим о вещах, которые могут напугать вас. И потом расскажем, что мы можем делать. Сейчас. Что нам нужно делать? Давайте продолжим о сатанинском плане правления миром. И потом расскажем, что мы должны делать. Находясь в разгаре этой войны Сатаны с Богом что должны мы делать? Практические шаги. Что делать? Люцифер попирает народы. Он упал с неба, и он хотел быть Богом. Библия говорит, что он принимает вид ангела света. Он хочет, чтобы вы думали, что он хочет помочь вам. Что он хороший ангел. Он взял Иисуса на высокую гору. Помните, в четвёртой главе Матфея? Показал ему все царства мира и сказал: «Всё это дам тебе, если поклонишься мне». Он всегда обещает то, чего не может дать. А Иисус уже владеет миром. Но Сатана говорит: «Если пойдёшь за мной, я дам тебе что-то». Он сказал Еве: «Ты получишь знания, мудрость, будешь как Бог». Он всегда обещает. Но Иисус ответил: «Ибо написано…» Это был его ответ сатане. «Ибо написано…» Я думаю, было бы мудро заучивать слово Божье. И когда дьявол придёт искушать нас, мы можем сказать: «Ибо написано».'
  rating: neutral
  verdict: Проповедь по Рим 1:18–20 и об искушении Христа с призывом учить Писание; с ней мы согласны. Дальше Ховинд связывает эволюцию с «планом сатаны» и «новым мировым порядком», и ниже мы проверяем, есть ли сам такой заговор.

- id: lecture-5-3576
  start: 3576.8
  end: 3604.9
  text: 'Как насчёт этого нового мирового порядка? Как дети смотрят на мир? Кто владеет этим миром? Если ребёнок учится 11 лет в вашей школьной системе, Как он будет смотреть на мир? Будет он считать себя помехой для мира? Будет ли он думать: «Я загрязняю атмосферу, я загрязняю мир. Когда я покупаю пластик, я разрушаю мир». Чувствует он себя помехой мира.'
  rating: orange
  verdict: Мы тоже верим, что человек — не «помеха» для мира. Но школьные уроки экологии учат не тому, что ребёнок лишний, а тому, как не загрязнять воду и воздух; забота о земле есть и в Библии (Быт 2:15).
  arguments:
  - environmentalism-control
  rhetoric:
  - straw-man

- id: lecture-5-3607
  start: 3607.0
  end: 3621.3
  text: '6 000 лет Сатана пытался уничтожить человечество. Жак Кусто сказал: «Мы должны ликвидировать 350 000 человек ежедневно». Тед Тёрнер сказал: «Нам нужно избавиться от 95% населения».'
  rating: orange
  verdict: Кусто в 1991 году действительно сказал о «350 000 в день», но тут же назвал эту мысль столь ужасной, что её нельзя произносить. Тёрнер говорил о снижении рождаемости, а не об убийствах. Резкие слова о демографии — не план истребления.
  arguments:
  - depopulation-plot
  rhetoric:
  - quote-mining

- id: lecture-5-3622
  start: 3622.0
  end: 3663.1
  text: 'В восьмидесятом году были воздвигнуты камни Джорджии с десятью заповедями Новой Эры. Их воздвигла масонская ложа в Джорджии. Заповедь первая. Вы можете увидеть эту заповедь на камнях. Заповедь первая: сохраняйте человечество на уровне 500 млн. Это полмиллиарда. Пять процентов населения. Этого хотят Тед Тёрнер и Жак Кусто. У нас нет времени на все заповеди. Ну вот последняя заповедь: не будьте раком земли. Оставьте место природе. Оставьте место природе.'
  rating: orange
  verdict: Скрижали Джорджии с призывом держать население «до 500 миллионов» действительно стояли с 1980 по 2022 год. Но их заказал аноним под псевдонимом, масонское авторство не доказано, и связи надписи с действиями властей никто не показал.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-3664
  start: 3664.9
  end: 3688.5
  text: 'Дэйв Форман сказал: «Мы должны сделать это место небезопасным и суровым местом для капиталистов с их проектами. Мы должны вернуть дороги и пахотную землю. Разрушить плотины, освободить реки и возвратить в дикое состояние миллионы и десятки миллионов акров в настоящее время заселённые земли». Хм, хорошо, Дэйв. Давай начнём с твоего дома. Давай снесём сначала твой дом. Начнём с тебя.'
  rating: orange
  verdict: Цитата Дэйва Формана реальна, но он возглавлял радикальную группу Earth First!, а не всё движение за охрану природы. Самый резкий голос не говорит за миллионы людей, которые просто хотят чистых рек.
  arguments:
  - environmentalism-control
  rhetoric:
  - cherry-picking

- id: lecture-5-3690
  start: 3690.7
  end: 3699.2
  text: 'Принц Филипп сказал: «Если бы я смог перевоплотиться, я хотел бы вернуться на Землю как вирус-убийца для понижения уровня человеческого населения».'
  rating: orange
  verdict: 'Принц Филипп действительно написал такое в 1986 году, но в предисловии к шуточному сборнику и сам оговорился: «это, пожалуй, слишком». Мрачная шутка — не план истребления людей.'
  arguments:
  - depopulation-plot
  rhetoric:
  - quote-mining

- id: lecture-5-3700
  start: 3700.5
  end: 3715.7
  text: Вы можете достать книгу или кассету «Новые вирусы», автор Лев Горовиц. Посмотрите мою кассету «Библия и здоровье». Перед любыми прививками узнайте о другом мнении. О другом взгляде. А также о вирусах.
  rating: red
  verdict: 'Совет сомневаться в прививках опасен: по оценке ВОЗ, за 50 лет прививки спасли не меньше 154 миллионов жизней, в основном детских, а оспа побеждена полностью.'
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-3716
  start: 3716.8
  end: 3744.8
  text: Вы знали, что во время войны в Персидском заливе погибло около 300 американцев в битве и 30 000 погибло после войны, от связанной с войной болезнью? 30 000 Эти люди хотят уменьшить мировое население до мая двухтысячного года. Я надеюсь, они не достигнут цели, но цель эта — уничтожить большую часть населения. Они хотят уменьшить население от 6 млрд до полумиллиарда.
  rating: red
  verdict: В войне в Заливе погибли 383 американца, из них в бою 148; многие ветераны потом тяжело болели. Но «30 000 умерших от болезни» данные не подтверждают, а население Земли к 2000 году не уменьшилось, а выросло.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-3748
  start: 3748.0
  end: 3757.2
  text: Множество интересных вещей происходит в Америке. Я постараюсь объяснить это. Иностранная военная техника завозится в Америку и красится в белый цвет ООН.
  rating: red
  verdict: Технику в белый цвет ООН красят для миротворческих миссий за рубежом, и США давно поставляют таким миссиям машины. С 1990-х годов никакого захвата Америки войсками ООН так и не случилось.
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-3758
  start: 3758.9
  end: 3776.1
  text: 'Бывший сенатор Тимоти Уирт сказал: «Нам нужно говорить о глобальном потеплении. Даже если эта теория неверна, мы всё равно поступим правильно в смысле экономической и экологической политики». Цель движения по защите природы — установить контроль над людьми.'
  rating: orange
  verdict: Слова сенатора Тимоти Уирта приведены близко к сказанному. Но из фразы одного политика не следует, что цель всего движения — власть над людьми, а вопрос о климате решают измерения, а не чьи-то мотивы.
  arguments:
  - environmentalism-control
  rhetoric:
  - conspiracy

- id: lecture-5-3777
  start: 3777.0
  end: 3783.2
  text: Происходят странные вещи. Запрет ядохимиката ДДТ произошёл только по причине контроля населения.
  rating: red
  verdict: ДДТ в США запретили в 1972 году для сельского хозяйства из-за вреда птицам и природе. Против малярии ВОЗ до сих пор допускает его применение в домах, так что намерения «сократить население» здесь нет.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-3785
  start: 3785.7
  end: 3808.9
  text: 'Питер Сингер сказал: «Христианство — это наш враг. Мы должны уничтожить христианскую традицию». «Не единственная ли надежда для планеты — это разрушение промышленных цивилизаций? Не наша ли это ответственность за осуществление этого?» Подождите, не участвовали ли наши лидеры на встрече в Рио-де-Жанейро и не проголосовали ли в поддержку в девяносто втором году?'
  rating: red
  verdict: 'Слова о «крахе промышленных цивилизаций» принадлежат не Сингеру, а Морису Стронгу: он пересказывал сюжет романа, который хотел бы написать. В Рио в 1992 году страны голосовали за программу устойчивого развития, а не за разрушение цивилизации.'
  arguments:
  - environmentalism-control
  rhetoric:
  - quote-mining
  - unverified-quote

- id: lecture-5-3811
  start: 3811.6
  end: 3832.9
  text: Если эволюция верна. Это философия. Мышление. Если эта теория верна. Низшие должны быть уничтожены на благо вида. Если эта теория верна. Одна человеческая раса должна быть выше других. Если эта теория верна. Нет ничего абсолютного.
  rating: red
  verdict: 'Теория эволюции описывает, как меняются живые существа, а не предписывает, как поступать людям. Из неё не следует ни «уничтожай слабых», ни «одна раса выше»: генетика как раз показала, что человечество едино.'
  arguments:
  - evolution-morality
  rhetoric:
  - straw-man

- id: lecture-5-3834
  start: 3834.6
  end: 3944.6
  text: 'Как-то раз профессор на дискуссии сказал мне: «Нет ничего абсолютного». Я спросил его: «Вы абсолютно уверены?» Если нет ничего абсолютного, как вы решаете, что правильно и неправильно? Я говорил в государственной школе несколько лет назад в Пенсильвании. Один ученик встал и сказал: «Мистер Ховинд, я атеист». Я сказал: «Действительно?» Это было в Винчестере. Это около часа езды отсюда. Он сказал: «Мистер Ховинд, я атеист». Я сказал: «Действительно?» Он сказал: «Да, Бога нет». Я спросил: «Ты уверен?» Он сказал: «Да». Я сказал: «Скажи мне, сынок, ты знаешь всё?» Он сказал: «Нет». Я спросил: «Ты знаешь половину всего?» Он сказал: «Нет». Я сказал: «Хорошо, давай предположим, что ты знаешь половину всего. Возможно, что Бог существует в другой половине, которую ты не знаешь». Я сказал: «Если ты атеист, как ты различаешь, что правильно и неправильно?» Он сказал: «О, это легко. Я решаю, что правильно и неправильно. Я бог моей Вселенной». Я сказал: «О, я рад был это услышать, потому что я убью тебя через 5 минут». Он сказал: «Вы не имеете права». Я сказал: «Нет, я могу, потому что я бог моей Вселенной. И я решил, что мне можно убить тебя». Вы видите, куда это приведёт?'
  rating: neutral
  verdict: Рассказы о спорах с профессором и школьником-атеистом. Замечание, что нравственный релятивизм опровергает сам себя, уместно; к биологии эти разговоры отношения не имеют.
  rhetoric:
  - personal-story

- id: lecture-5-3947
  start: 3947.5
  end: 3993.1
  text: 'Есть ли где-то стандарт? Как вы узнаёте, что правильно и неправильно? Друзья, если эволюция верна, такой возможности нет. Каждый человек будет делать, что правильно в его глазах, как произошло в книге Судей. Это проблема? Вы говорите маленьким детям: «Не делай этого, потому что это неправильно». И тогда он сразу скажет: «Да? А кто сказал?» Основатели нашей страны Они верят, что так говорит Господь. Вот кто. Но если нет Господа, если Библия не права, если нет Создателя… Как вы узнаёте, что правильно и неправильно?'
  rating: red
  verdict: 'Мы тоже верим, что мерило добра и зла — в Боге. Но «эволюция верна» не значит «Бога нет и Библия не права»: христиане, принимающие эволюцию, берут нравственный закон из того же источника.'
  arguments:
  - evolution-morality
  rhetoric:
  - lozhnaya-dilemma
  - podmena-ponyatij

- id: lecture-5-3995
  start: 3995.6
  end: 4018.4
  text: Перед дискуссией о моральных вопросах спросите, на чём они основывают свои решения. Если кто-то говорит, что он верит в эволюцию, тогда какой у них повод не обманывать, не воровать или не убивать? Не то чтобы все эволюционисты так поступают, но почему бы и нет? Что предотвратит их от этого?
  rating: red
  verdict: 'Что стоит спрашивать, на чём человек основывает мораль, верно, и Ховинд честно оговаривается, что не все так поступают. Но вера в эволюцию не равна атеизму: у верующего биолога те же причины не лгать и не убивать, что и у нас.'
  arguments:
  - evolution-morality
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-4021
  start: 4021.3
  end: 4116.9
  text: 'Джон Буньян верил, что его правила… что его права происходят от Бога. Джон Буньян был пресвитером маленькой церкви в Англии. Государство приняло закон для управления церковью: нужно разрешение. Джон Буньян сказал: «Я не могу получить это разрешение. Бог поручил мне церковь, не государство. Если я получу ваше разрешение на то, что Бог уже поручил мне, я ставлю Бога под государство, это невозможно». Они сказали: «Ну, ты попадёшь в тюрьму, если не получишь разрешение». Он сказал: «Ну, я не получу разрешения». Его посадили в тюрьму. Поставили разрешение и сказали. Они сказали: «Джон, подпиши разрешение, и ты свободен». Он находился в тюрьме тринадцать лет. Он отказался подписать разрешение. Когда он находился в тюрьме, он брал кусочки бумаги, которой закрывали сметану, которую давали заключённым, очищал бумагу, Брал нанос со стен и соломку с кровати, счищал нанос со стен и начал писать. Тринадцать лет он писал на клочьях бумаги. Он написал книгу «Путешествие пилигрима». Она написана в тюрьме. Когда его выпустили, в конце концов, он не мог ходить. Он потерял здоровье, церковь. Но когда его выносили, он сказал: «Видите? Я сказал, что я не подпишу это разрешение».'
  rating: neutral
  verdict: 'Рассказ о Джоне Буньяне в целом верен: он провёл в тюрьме около 12 лет за то, что не соглашался перестать проповедовать без разрешения. Детали о крышках от сметаны — предание; к доводам о науке он отношения не имеет.'

- id: lecture-5-4119
  start: 4119.6
  end: 4140.6
  text: Вы должны решить сами себе, что Бог велик и некоторые вещи нельзя делать. А если придёт время, когда они скажут, что вы должны принять чип на руку или лоб, или вы не получите пищу? Ну только представьте. Как велик ваш Бог?
  rating: purple
  verdict: 'Мы тоже верим, что христианин должен быть верен Богу даже ценой лишений. Но что «начертание» из Откр 13 — это чип, одно из толкований: многие христиане с древности понимают его как знак сознательного отречения от Христа, а не как прибор.'
  arguments:
  - mark-of-beast-tech

- id: lecture-5-4143
  start: 4143.2
  end: 4172.6
  text: 'Эверетт Силевен был пастором в Небраске. И Небраска приняла закон, что нельзя быть пастором церкви без разрешения штата. А Силевен сказал: «У нас была церковь, и будет церковь, и нам не нужно никакое разрешение». Он отказался. Они арестовали его прямо на кафедре во время проповеди. Выгнали всех людей на улицу и закрыли здание.'
  rating: orange
  verdict: Пастора Эверетта Силевена в Небраске действительно арестовали, а церковное здание в 1982 году заперли. Но спор шёл о церковной школе без государственной лицензии, а не о праве быть пастором.
  arguments:
  - public-schools-indoctrination

- id: lecture-5-4174
  start: 4174.5
  end: 4214.2
  text: 'Сенатор Небраски, который ненавидел Силевена, пошёл на радиопрограмму с адвокатом Силевена. И сенатор Небраски сказал на радиопрограмме: «Фундаменталисты не имеют права учить своих детей своим убеждениям. Мы готовим их детей для 2000 года и для жизни в глобальном всемирном обществе. И их дети нам не подойдут». Сенатор, вы готовите моих детей для чего-то? Вы не понимаете, сэр? Эти дети принадлежат Богу. И они вверены мне. Не вам.'
  rating: orange
  verdict: Слова о «детях фундаменталистов» приписывают одному сенатору Небраски, но записи передачи нет. Даже если он так сказал, это мнение одного человека; право родителей воспитывать детей в своей вере суды США признают.
  arguments:
  - public-schools-indoctrination
  rhetoric:
  - unverified-quote

- id: lecture-5-4217
  start: 4217.7
  end: 4232.7
  text: 'В штате Массачусетс этот плакат висит в классах детей до пятого класса: «Я клянусь верностью Земле, которую я люблю и от которой завишу, и всему живущему на Земле, в воздухе и море, что является такой же частью Земли, как и я».'
  rating: orange
  verdict: Такая «клятва Земле» действительно ходила среди экологических активистов. Но что она висит в классах штата как общее правило, Ховинд не показывает; один плакат — не программа школ.
  arguments:
  - environmentalism-control

- id: lecture-5-4235
  start: 4235.8
  end: 4263.9
  text: Просто возьмите и пройдитесь по вашей государственной школе как-то и посмотрите, что вы увидите. Почитайте книги. Посмотрите, есть ли у них книга «У Хизер две мамы», о двух лесбиянках с детьми. Просто посмотрите. Я думаю, пришло время забирать детей. Христианские школы не идеальные, как вы знаете. Но уже пришло время забирать детей.
  rating: neutral
  verdict: Совет родителям самим смотреть, что читают дети, и подумать о христианской школе. Книга настоящая (1989); выбор школы — дело семьи, научного утверждения здесь нет.

- id: lecture-5-4265
  start: 4265.7
  end: 4291.4
  text: Было много попыток восстановления нового мирового порядка. Сейчас по всей Америке возится военная техника Объединённых Наций. Почему в Нью-Джерси находятся перевозные концлагеря? Войдите в www.sightings.com или в tackamarks.freeservers.com, И вы удивитесь, что было встречено в этой стране.
  rating: red
  verdict: 'Слухи 1990-х о «технике ООН» и «концлагерях» не подтвердились: с тех пор ни один такой лагерь не открылся и никого туда не отправили. Сайты со слухами — не доказательство.'
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-4293
  start: 4293.5
  end: 4321.6
  text: Я думаю, они готовятся к тому, что сделал Ленин. Один человек с оружием будет контролировать сто человек без оружия. В 100 километрах от меня находятся советские грузовики по чистке биологической войны на 45-й магистрали в Миссисипи. Зачем нам нужны советские грузовики по чистке биологической войны? Зачем вообще нужна такая техника? Чтобы чистить после биологической войны.
  rating: red
  verdict: 'Советские грузовики под Галфпортом были частной партией: предприниматель купил их после объединения Германии, чтобы переделать и продать ООН для гуманитарных миссий. Ни армия, ни подготовка к войне против своих граждан здесь ни при чём.'
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-4323
  start: 4323.8
  end: 4354.0
  text: 'Один человек как-то спросил. Зачем вам нужна вся эта советская техника? Ему ответили: «Мы привозим их сюда на покраску и потом отправляем назад». Если вы такие тупые, что верите этому, я хочу вам продать остров в океане. Почему мы не пошлём им краску? Будет намного дешевле. Я не думаю, что они тратят $10 000, чтобы привезти, покрасить и отвезти один грузовик.'
  rating: red
  verdict: 'Ховинд смеётся над простым объяснением «их красят и увозят», а оно почти подтвердилось: владелец частной стоянки перекрасил часть машин в белый для ООН, а потом грузовики сдали в металлолом. Заговора за этим не нашли.'
  arguments:
  - un-takeover
  rhetoric:
  - argument-by-incredulity
  - vysmeivanie-vmesto-dovoda

- id: lecture-5-4355
  start: 4355.6
  end: 4373.4
  text: Вы знаете, что некоторые люди беспокоятся, что люди нового мирового порядка с помощью биологической войны уменьшат население до полумиллиарда? Биологическая война убивает людей и сохраняет строения. Атомные бомбы убивают людей и разрушают всю недвижимость.
  rating: red
  verdict: Что биологическое оружие страшно, верно. Но плана сократить им человечество до полумиллиарда никто не показал, а население Земли с тех пор выросло с 6 до более чем 8 миллиардов.
  arguments:
  - depopulation-plot
  rhetoric:
  - conspiracy

- id: lecture-5-4375
  start: 4375.3
  end: 4383.5
  text: Сейчас есть вирус, который убивает всех людей и через 5—6 дней вымирает. Вы собираете тела. И мир ваш.
  rating: red
  verdict: Вируса, который убивает всех заражённых и сам исчезает через несколько дней, не существует. Даже от Эболы, одной из самых смертоносных болезней, умирает в среднем около половины заболевших, и её вспышки удаётся остановить.
  arguments:
  - depopulation-plot

- id: lecture-5-4385
  start: 4385.6
  end: 4393.7
  text: Вы можете позвонить Гарри Фрайду, моему другу. Он говорит о новом мировом порядке, как я говорю о сотворении, о динозаврах.
  rating: neutral
  verdict: Рекомендация позвонить знакомому лектору о «новом мировом порядке»; сами его утверждения разбираем выше и ниже.

- id: lecture-5-4395
  start: 4395.1
  end: 4433.4
  text: Военные штабы ООН возятся в Америку. Иностранные войска тренируются в Америке для захвата от дома к дому. Я не знаю, вы слышали, что посреди ночи они ворвались в деревню? Взломали все двери и тренировались арестовывать жителей. Интересно. Почему у нас советские ракеты? Если вы попадёте в Пенсаколу, то иногда вы сможете увидеть на десятой магистрали советские танки. На грузовиках. Что происходит? Идёт подготовка к новому мировому порядку.
  rating: red
  verdict: Совместные учения с союзниками и трофейная советская техника для тренировок в США действительно были, об этом писали открыто. Но «захвата от дома к дому» с 1990-х годов так и не случилось, а рассказ о взломанной деревне передан со слов.
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-4434
  start: 4434.7
  end: 4496.7
  text: 'Вы видели такие линии на дорогах? Не только возле светофоров, но и посреди дороги. Как-то я позвонил человеку, который устанавливает их во Флориде. Он сказал: «О, да, у нас контракт на 1 000 дорог». Я сказал ему: «Вы можете объяснить?» Он сказал: «Мы делаем вырезы в дороге и ставим в них три провода номер четырнадцать и присоединяем их к ящику в стороне от дороги. В этот ящик мы можем поставить компьютеры и знать скорость машин. Сколько машин проезжает за неделю? За день, за час? Мы можем контролировать движение». Я сказал: «Сэр, вы знали, что с тремя такими проводами вы можете произвести импульс энергии и уничтожить электронное зажигание в любой проезжающей машине?» Он сказал: «Я не знал этого». Ну, это возможно? Почему кто-то захочет остановить машины с электронным зажиганием? Хм, заставляет задуматься.'
  rating: red
  verdict: 'Провода в асфальте — индукционные датчики: они чувствуют металл машины слабым полем и переключают светофор, как и сказал монтажник. Прожечь ими электронику проезжающих машин нельзя: для этого нужна совсем другая мощность.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - personal-story
  - appeal-to-doubt

- id: lecture-5-4497
  start: 4497.9
  end: 4514.4
  text: Вы видели такие камеры на столбах освещения? Кто наблюдает и почему? Зачем? Мировые события устрашают и озадачивают. Я думаю, мы направляемся к новому мировому порядку. С Сатаной во главе.
  rating: orange
  verdict: Камеры на столбах действительно есть, и вопрос о частной жизни законный. Но ставят их города и дорожные службы для слежения за движением, и вывод «мировой порядок с сатаной во главе» из них не следует.
  arguments:
  - new-world-order
  rhetoric:
  - appeal-to-doubt
  - conspiracy

- id: lecture-5-4515
  start: 4515.3
  end: 4537.5
  text: Если вы не верите, что существует заговор, прочитайте книгу «Конспирология». Я прошу, чтобы вы прочитали её. Эту книгу продаёт Общество Джона Бёрча. Вокруг символа на долларовой купюре находятся интересные слова. Терри Кук говорит, что на латинском это значит Объявление рождения нового мирового порядка. Без Бога.
  rating: red
  verdict: Надпись Novus ordo seclorum значит «новый порядок веков», то есть новая эпоха с 1776 года; так объяснил её автор в 1782 году. Слов «без Бога» там нет, а надпись над пирамидой говорит, что Бог благословил начинание.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-4538
  start: 4538.8
  end: 4576.9
  text: 'Хм. Также очень интересная пирамида. Мне нравится изучать пирамиды. В Исайи 19 написано, что там будет жертвенник Господу посреди земли Египетской. И памятник Господу у пределов её. Многие думали: Как что-то может быть посреди его пределов? В Египте было два царства. И пирамида Хеопса находится на границе царств. Когда царства объединились, пирамида оказалась в центре. Поэтому пирамида находится посреди его пределов. Некоторые люди думают, что пирамида Хеопса — это структура, предназначенная для обучения о Господе.'
  rating: purple
  verdict: Мы тоже читаем в Ис 19:19 обетование о жертвеннике Господу в Египте. Но толкователи обычно видят в нём обращение Египта к Богу; чтение, где стих описывает пирамиду Хеопса, построенную за тысячелетия до Исаии, — догадка пирамидологов XIX века.
  arguments:
  - pyramid-prophecy

- id: lecture-5-4578
  start: 4578.8
  end: 4616.9
  text: Я слышал много споров, но написана хорошая книга Хатчингса. Великая пирамида Хеопса. На пирамиде Хеопса было 144 000 облицовочных камней, соответствующих друг другу. Одно тело. 144 000 — книга Откровения. Если вы войдёте в пирамиду и выберете широкий путь, он приведёт к яме. Узкий же путь приведёт к королевской камере. Если вы попадёте в королевскую камеру, вы будете на пятидесятом уровне камней. Пятьдесят. Юбилейный год. И там пустая могила.
  rating: orange
  verdict: 'Что царская камера лежит на уровне примерно 50-го ряда камней, а саркофаг пуст, верно. Но символику в этих числах видят пирамидологи, а не строители: в любом большом здании можно найти «нужные» числа, если искать их заранее.'
  arguments:
  - pyramid-prophecy

- id: lecture-5-4618
  start: 4618.3
  end: 4647.4
  text: Верхушка пирамиды не установлена. Верхний камень отвергнут строителями. В Матфея 21 говорится о камне, который отвергли строители. Тот самый сделался главою угла. Марка 12 — камень, который отвергли строители. Луки 20 — камень, который отвергли строители. Глава угла. Также Даниил говорит о камне, ударившем истуканом. Я думаю, что Иисус Христос — это угловой камень.
  rating: purple
  verdict: Мы тоже верим, что Иисус Христос — камень, который отвергли строители (Пс 117:22; Мф 21:42). Но связь этого образа с отсутствующей вершиной пирамиды — догадка; само Писание её не делает.
  arguments:
  - pyramid-prophecy

- id: lecture-5-4648
  start: 4648.0
  end: 4663.6
  text: Но Сатана использует символ этой пирамиды на долларовой купюре. Со всевидящим глазом. Люцифером. Он думает, что он установит новый мировой порядок. Нет. Иисус Христос придёт и установит свой новый мировой порядок.
  rating: red
  verdict: 'Мы тоже ждём, что Христос придёт и воцарится. Но глаз над пирамидой на печати США — христианский символ «око Провидения»: авторы печати в 1782 году писали, что он означает заботу Божью, а не Люцифера.'
  arguments:
  - masonic-symbols
  rhetoric:
  - conspiracy

- id: lecture-5-4664
  start: 4664.0
  end: 4696.0
  text: Многие супербогатые люди разработали кризисы, чтобы достичь своих целей. Вы создаёте проблемы, чтобы вы смогли достигнуть то, что вы хотите достигнуть. На прошлой неделе у меня были миссионеры из Филиппин. Они там были 25 лет. Они рассказали, что Маркос сам взрывал дома, чтобы сохранять военное положение в стране. Его люди взрывали свои дома. И потом они обвиняли коммунистов. Говорят, что им нужно военное положение.
  rating: orange
  verdict: 'Про Маркоса это частично верно: по признанию министра обороны Энриле в 1986 году, покушение 1972 года, которым оправдывали военное положение, было инсценировано. Но из одного диктатора не следует, что все кризисы устраивают «супербогатые».'
  arguments:
  - staged-crises
  rhetoric:
  - personal-story

- id: lecture-5-4698
  start: 4698.2
  end: 4716.7
  text: Я думаю, это происходит и в Америке. Люди отказываются от своих прав при проблемах. Кризис двадцать девятого года был умышленно разработан, чтобы люди голодали, И чтобы они приняли номер социального социального обеспечения. У меня нет этого номера. И вам необязательно его иметь.
  rating: red
  verdict: 'Что Великую депрессию устроили нарочно, историки не находят: её причины — биржевой крах, банкротства банков и ошибки политики. Номера социального страхования появились по закону 1935 года, чтобы платить пенсии.'
  arguments:
  - staged-crises
  rhetoric:
  - conspiracy

- id: lecture-5-4719
  start: 4719.0
  end: 4744.6
  text: Кубинский ракетный кризис также был разработан для достижения цели. СССР нужна была военная база в Кубе, чтобы следить за Америкой. Они сделали два шага. Установили базу и привезли ракеты. Потом они забрали ракеты. Наверное. Но оставили базу. Два шага вперёд, один назад. И люди думают, что они отступили. Нет, они ближе к цели.
  rating: red
  verdict: 'Что советские военные остались на Кубе, верно: центр радиоперехвата в Лурдесе закрыли лишь в 2001 году. Но кризис 1962 года едва не привёл к ядерной войне, а ракеты вывезли в обмен на американские ракеты в Турции.'
  arguments:
  - staged-crises
  rhetoric:
  - conspiracy

- id: lecture-5-4744
  start: 4744.9
  end: 4803.0
  text: 'Взрыв в Оклахома-Сити. Умышленный взрыв. У меня есть двухчасовая видеокассета. Подстроено, чтобы плохо выглядело народное ополчение. Я не в ополчении, я просто говорю, что этот дом не был взорван грузовиком с улицы. У меня есть запись новостей. Вы можете увидеть, как люди выбегали из здания и кричали: «Мы нашли вторую бомбу». «Вот третья бомба. Вот четвёртая». Я думаю, что было найдено шесть бомб, которые не взорвались. Конечно, немало взорвалось, и они снесли стойки. Бомба с улицы взорвёт стены, но не разорвёт стойки. Вы заметили, как быстро они снесли здание, отвезли остатки на свалку и поставили вооружённую охрану на свалке? Зачем охранять свалку? Я думаю, они боятся, что кто-то узнает, что стойки были снесены пластиковой бомбой. C-4. Это здание взорвали умышленно.'
  rating: red
  verdict: 'Взрыв в Оклахома-Сити в 1995 году устроил Тимоти Маквей с сообщником: их вина доказана в суде, а инженеры объяснили обрушение здания взрывом грузовика. «Невзорвавшиеся бомбы» следствие не подтвердило.'
  arguments:
  - staged-crises
  rhetoric:
  - conspiracy
  - appeal-to-doubt

- id: lecture-5-4804
  start: 4804.2
  end: 4824.1
  text: Самолёт TWA тоже был умышленно сбит. Французский спутник запечатлел летящую к самолёту ракету. Это не представляли по новостям, правда? Может быть, из-за того, что на самолёте летели три человека в Англию давать показания против Клинтона. Я не знаю, но это возможно.
  rating: red
  verdict: Ракета рейс TWA 800 не сбивала. Самолёт погиб в 1996 году из-за взрыва паров топлива в баке, к этому пришло расследование, собравшее его из обломков. Снимок ракеты со спутника и «свидетели против Клинтона» ничем не подтверждены.
  arguments:
  - staged-crises
  rhetoric:
  - conspiracy

- id: lecture-5-4826
  start: 4826.0
  end: 4842.4
  text: Президент может использовать акт терроризма. Например, взорвался самолёт. Надо увеличить охрану аэропортов. Подождите. Они используют акт терроризма как предлог для увеличения государственного контроля. Очень возможно.
  rating: orange
  verdict: Что после терактов государство усиливает контроль, верно, и спорить о мере такого контроля законно. Но что теракт — лишь «предлог», Ховинд не показывает. Охрану аэропортов усиливают, потому что самолёты действительно взрывают.
  arguments:
  - emergency-powers
  rhetoric:
  - conspiracy

- id: lecture-5-4843
  start: 4843.0
  end: 4853.4
  text: Если вы установите военное положение, вы отменяете Конституцию. И президент сможет править исполнительными приказами. Таких приказов уже 13 000 после Рузвельта.
  rating: red
  verdict: Военное положение не отменяет Конституцию США, она действует «и в войну, и в мир». А номера указов идут подряд от Линкольна; после Рузвельта до лекции их вышло около 3600, и в основном это обычные распоряжения.
  arguments:
  - emergency-powers

- id: lecture-5-4855
  start: 4855.1
  end: 4871.8
  text: У этих супербогатых людей есть планы нового мирового порядка. Они хотят одно мировое государство с Люцифером во главе. Они долго ждали этого времени. В Библии говорится, что злые же люди и обманщики будут преуспевать во зле, вводя в заблуждение и заблуждаясь.
  rating: red
  verdict: Мы тоже верим словам апостола, что злые люди будут преуспевать во зле (2 Тим 3:13). Но что конкретные богачи готовят мировое государство с Люцифером во главе, Ховинд не показывает ни одним документом.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-4872
  start: 4872.4
  end: 4913.8
  text: В тридцать третьем году Рузвельт объявил Конгрессу губернаторов о национальном чрезвычайном положении из-за кризиса. Губернаторы согласились наделить президента дополнительной властью для победы над экономическим врагом. Губернаторы единодушно проголосовали, чтобы Конгресс США предоставил президенту широкую исполнительную власть для войны против экономического врага. Эта власть была бы невозможна и при нормальной Конституции. В тридцать третьем году Конгресс проголосовал за наделение президента Соединённых Штатов и секретаря финансов чрезвычайной властью для войны посредством исполнительных приказов.
  rating: orange
  verdict: Верно, что в марте 1933 года Рузвельт попросил чрезвычайных полномочий, и Конгресс принял чрезвычайный закон о банках. Но это был закон, принятый по Конституции, а не выход за её пределы.
  arguments:
  - emergency-powers

- id: lecture-5-4915
  start: 4915.6
  end: 4942.2
  text: 'И во время войны президент может править исполнительными приказами. Вот почему президент так часто говорит: «Я объявляю войну против нищеты». «Войну против наркотиков». Многие не понимают, что он говорит. Он объявляет войну. Неважно какую. Но если он объявляет войну, мы находимся под исполнительными приказами. Конституция недействительна. Всё это записано в Конституции.'
  rating: red
  verdict: «Война с бедностью» и «война с наркотиками» — политические метафоры, а не объявление войны. Войну по Конституции объявляет Конгресс, и ни одна такая «война» не отменяла Конституцию.
  arguments:
  - emergency-powers
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-4944
  start: 4944.1
  end: 4966.4
  text: Секция 5Б. Акт о торговле с врагом. 1917. Была изменена с включением граждан Соединённых Штатов Америки, владеющих собственным золотом и серебром, как врагов Соединённых Штатов. В тридцать третьем году граждане стали врагами Соединённых Штатов. Поэтому Рузвельт потребовал золота.
  rating: red
  verdict: Поправка 1933 года к закону о торговле с врагом действительно дала президенту особые полномочия и над сделками внутри страны. Но граждан «врагами государства» она не объявляла — так её неверно читают противники налогов.
  arguments:
  - emergency-powers
  rhetoric:
  - conspiracy

- id: lecture-5-4967
  start: 4967.4
  end: 4997.0
  text: Вот некоторые исполнительные приказы, которые принимаются сейчас. В случае кризиса, может быть, как двухтысячный год. При кризисе. Если даже не будет кризиса, у государства есть возможность создать кризис, чтобы были в силе эти приказы. Многие люди сохраняют пищу, воду, деньги. Посмотрите, что произойдёт.
  rating: orange
  verdict: Что у правительства есть планы на случай чрезвычайных ситуаций, верно, так делает любое государство. Но переход в 2000 год прошёл спокойно, и никто не создал кризис, чтобы ввести эти указы в действие.
  arguments:
  - emergency-powers
  rhetoric:
  - conspiracy

- id: lecture-5-4998
  start: 4998.0
  end: 5035.1
  text: В случае кризиса федеральное государство может конфисковать все средства сообщения. Они могут конфисковать всё электричество, топливо, минералы, общественные и частные. Заберут ваш бензин. Конфискация всего продовольствия. Вы запасаетесь на двухтысячный год? Пожалуйста, запасайтесь. Конфискация всех ферм и оборудования. Всех средств передвижения. В случае кризиса у государства есть власть и право забрать вашу машину и забрать ваш велосипед.
  rating: orange
  verdict: 'Такие указы действительно были: в 1962 году на случай ядерной войны перечислили, что государство может взять под контроль. Но это не подготовка к 2000 году: их давно заменили другими и ни разу не применяли, чтобы что-то отнять.'
  arguments:
  - emergency-powers
  rhetoric:
  - conspiracy

- id: lecture-5-5037
  start: 5037.6
  end: 5082.8
  text: Конфискация американского набора для народа для рабочей силы Конфискация оздоровительных, учебных и социально-обеспечительных учреждений. Они заберут школы. Уполномочивает министра почты зарегистрировать всех мужчин, женщин и детей. Конфискация всех аэропортов. Общественных и частных. Принудительное переселение, как у Гитлера. Переселите их куда вам хочется. Конфискация всех железных дорог. Внутренних водных путей. И складов. Общественных и частных. Исполнительный приказ 11051 наделяет ФЕМА, Федеральное агентство чрезвычайного управления, правом осуществления этих законов.
  rating: orange
  verdict: Указ 11051 действительно приняли в 1962 году, а в 1979-м отменили при создании ФЕМА. Ни одного случая такого «переселения» не было, так что сравнивать его с депортациями Гитлера не с чем.
  arguments:
  - emergency-powers
  rhetoric:
  - guilt-by-association

- id: lecture-5-5086
  start: 5086.3
  end: 5147.4
  text: 'Несколько недель назад ко мне подошёл человек и сказал: «Доктор Ховинд, я расчищаю повреждения от ураганов на бульдозере. Недавно я работал в Южной Флориде, где ответственным за расчистку была организация ФЕМА, так как после урагана была чрезвычайная ситуация. Когда я расчищал дорогу от поваленных деревьев, несколько деревьев случайно упали в чей-то бассейн. Я не видел бассейна, и я не заметил, как это произошло. Из дома, ругаясь, выбежал человек и начал кричать на меня за его бассейн. Тогда подошёл офицер из ФЕМА. И сказал ему: „Сэр, я из ФЕМА. Зайдите в свой дом, потому что если я скажу этому человеку на бульдозере поехать на ваш дом, он поедет“». Вот что он мне рассказал.'
  rating: orange
  verdict: 'Такие споры со спасателями после урагана возможны. Но пересказ со слов незнакомого человека нельзя проверить, и он не показывает плана захвата: полномочия ФЕМА ограничены законом.'
  arguments:
  - emergency-powers
  rhetoric:
  - personal-story

- id: lecture-5-5149
  start: 5149.5
  end: 5179.2
  text: Кто это делает и почему они хотят контролировать мир? Сатана заманил людей и сказал, что должен быть новый мировой порядок. И ООН является частью этого порядка. Всемирный совет церквей. Если вы ходите в церковь, которая состоит во Всемирном или Американском совете церквей, уйдите и найдите себе настоящую церковь, которая верит в Библию. Совет иностранных отношений. Трёхсторонняя комиссия, бильдербергеры. Мы можем говорить об этом целый месяц.
  rating: red
  verdict: Спорить со Всемирным советом церквей или ООН можно. Но это открытые организации, их уставы и решения опубликованы, и никакого плана сатаны в них нет. Что всё это звенья одного заговора, Ховинд не доказывает.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-5179
  start: 5179.6
  end: 5207.1
  text: 'Но я хочу, чтобы вы увидели настоящую борьбу. Неважно, что делает дьявол. Я хочу, чтобы вы увидели, что делает Бог. Ученики не сидели и не думали, что делает Римская империя. Им было всё равно. Они не собирались вместе и не говорили: «Вы знаете, что послали в Вифлеем 10 000 солдат?» Ну и что? Идём спасём их. Многие христиане беспокоятся о неважном.'
  rating: neutral
  verdict: 'Хорошая мысль: христианам важнее дело Божье, чем козни врага, и апостолы не занимались политикой Рима. С этим мы согласны.'

- id: lecture-5-5207
  start: 5207.7
  end: 5222.8
  text: 'Коммунисты, социалисты, Национальная ассоциация образования. Национальная женская организация. Американский союз гражданских свобод. Масонская ложа. Вы спросите: «При чём тут масоны?» А вы прочитайте про них.'
  rating: orange
  verdict: С этими организациями можно спорить по существу. Но профсоюз учителей, женская организация, правозащитники и масоны — совсем разные люди, и список из имён не доказывает, что они действуют сообща.
  arguments:
  - masonic-symbols
  rhetoric:
  - guilt-by-association

- id: lecture-5-5223
  start: 5223.7
  end: 5246.1
  text: 'Вы знали, что лидер масонской ложи сказал: «Масонская религия должна всеми нами на высоких ступенях поддерживаться в чистоте доктрины Люцифера». Вы не будете знать, пока не доберётесь до верха, что вы поклоняетесь Люциферу. Прочитайте книгу «Скарлетт и зверь», если вы искренне хотите узнать о масонской ложе.'
  rating: red
  verdict: Эти слова о «доктрине Люцифера», приписанные масонскому лидеру Альберту Пайку, сочинил французский мистификатор Лео Таксиль, и в 1897 году он сам публично признался в обмане. Разногласия с масонством нужно строить не на фальшивке.
  arguments:
  - masonic-symbols
  rhetoric:
  - unverified-quote

- id: lecture-5-5247
  start: 5247.9
  end: 5282.1
  text: 'Человек с моей церкви подошёл ко мне на прошлой неделе и сказал: «Мистер Ховинд, я был масоном много лет. Можно с вами поговорить?» Мы говорили около часа. Он сказал: «Я ухожу из организации». Я дал ему эту книгу. Когда он прочитал книгу, он вернулся и сказал: «Я давно бы ушёл, если бы я знал это». Простой масон не знает, в чём он замешан. Он думает, что он в хорошем клубе. И когда кто-то говорит, что это сатанинская организация, он рассердится. Он ничего не знает, потому что он ещё не обнаружил правду.'
  rating: orange
  verdict: Что рядовые масоны мало знают о высших степенях, возможно, а многие церкви предостерегают христиан от масонства. Но книга, которую Ховинд дал человеку, конспирологическая, и рассказ об её успехе не доказывает, что в ней правда.
  arguments:
  - masonic-symbols
  rhetoric:
  - personal-story

- id: lecture-5-5284
  start: 5284.4
  end: 5305.1
  text: 'Они не откроют правду, пока вы не доберётесь до верхушки. Но подумайте: когда вы вступили в члены, вы дали клятву. Вы выучили клятву? Подумайте над этим. Я хочу, чтобы они захоронили меня в морском песке. Разрезать моё горло от уха до уха. Подумайте о клятвах.'
  rating: orange
  verdict: Верно, что в традиционных масонских клятвах были символические «кары» вроде перерезанного горла; английские масоны убрали их в 1986 году. Но что на вершине скрывают поклонение сатане, Ховинд доказывает лишь фальшивой цитатой.
  arguments:
  - masonic-symbols
  rhetoric:
  - conspiracy

- id: lecture-5-5306
  start: 5306.7
  end: 5331.0
  text: 'В моей Библии говорится: «Не клянись вовсе». «Прежде же всего, братия мои, не клянитесь». Иисус сказал: «Я тайно не говорил ничего». Почему у них секретные клубы? Секретные рукопожатия, секретная поза. Секретный знак трудности. Мы не должны делать ничего тайного. Если вы хотите служить Богу, служите Богу.'
  rating: purple
  verdict: 'Мы тоже считаем, что христианину не нужны тайные общества, и многие церкви предостерегают от масонства. А слова «не клянись вовсе» (Мф 5:34) христиане понимают по-разному: одни отказываются от любых клятв, другие допускают присягу в суде; это законный богословский спор.'
  arguments:
  - masonic-symbols

- id: lecture-5-5331
  start: 5331.8
  end: 5350.4
  text: Эти сатанинские группы относятся к датам очень серьёзно. Они очень суеверны. Второго февраля, 33-й день года. И 33 делимок 66. Части 666. И на 33-й день года, 2 февраля, приходится первый сатанинский праздник.
  rating: red
  verdict: 2 февраля — Сретение Господне, древний христианский праздник в память о том, как младенца Иисуса принесли в храм (Лк 2:22–38), а не «первый сатанинский». То, что это 33-й день года, — просто календарь, ничего тайного в нём нет.
  arguments:
  - masonic-symbols
  rhetoric:
  - conspiracy

- id: lecture-5-5353
  start: 5353.1
  end: 5389.6
  text: Интересно, в этот день Рузвельт принял акт военных сил. В тридцать третьем году Рузвельт приказал сдать золото. Тридцать три. Интересно. Рокфеллер послал деньги для помощи Гитлеру в Германии в тридцать третьем году. В тридцать третьем году появился приказ о печати на долларе. Два масона тридцать третьей степени, Лорел и Харди, создали фильм «Сыны пустыни». Изучите масонские символы и просмотрите этот фильм. Оккультист, вице-президент в тридцать третьем году приказал поставить великую печать на долларовую купюру.
  rating: red
  verdict: 'Часть фактов верна: в 1933 году Рузвельт потребовал сдать золото, а Оливер Харди был масоном (о 33-й степени данных нет). Но печать появилась на долларе в 1935 году, а в любом году случаются сотни событий: выбрав нужные, можно «доказать» силу любого числа.'
  arguments:
  - masonic-symbols
  rhetoric:
  - cherry-picking

- id: lecture-5-5390
  start: 5390.3
  end: 5413.9
  text: В тридцать третьем году подписана Универсальная декларация прав человека. В тридцать третьем году подписан первый гуманистический манифест. Много вещей произошло в тридцать третьем году. И в шестьдесят шестом году. Много крупных государственных организаций появилось в шестьдесят шестом году. Следующий девяносто девятый год. Делимый на три. Что произойдёт в этом году?
  rating: red
  verdict: Всеобщую декларацию прав человека ООН приняла в 1948 году, а не в 1933-м; верно лишь, что первый «Гуманистический манифест» вышел в 1933 году. А 1999 год прошёл без обещанных событий, хотя и делится на три.
  arguments:
  - masonic-symbols
  rhetoric:
  - cherry-picking

- id: lecture-5-5414
  start: 5414.9
  end: 5424.6
  text: Есть много хороших книг о новом мировом порядке. Я советую, чтобы вы их прочитали. Но я не хочу, чтобы вы беспокоились. Я хочу, чтобы вы посмотрели на это с другой точки зрения.
  rating: orange
  verdict: Хорошо, что Ховинд призывает не тревожиться. Но книги о «новом мировом порядке», которые он советует, строятся на непроверяемых слухах и цитатах; надёжную книгу отличают ссылки на документы, которые можно проверить.
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-5425
  start: 5425.3
  end: 5459.9
  text: Есть крупная компания Mondex. Эта компания будет принад принуждать покупать и продавать со знаком. Mondex происходит от слов «монетный» и «декстер». «Монетный» значит принадлежащий к деньгам. «Декстер», декстер значит принадлежащий или расположенный на правой руке. Почему они назвали компанию Mondex? Деньги расположены на правой руке. О чём они говорят? Интересно, Mastercard владеет 51% Mondex.
  rating: red
  verdict: Mondex — электронный кошелёк британского банка, и MasterCard в 1996 году действительно купила 51%. Но это была обычная пластиковая карта, а не метка на руке. Покупатели её не приняли, проект провалился, а игра со словом dexter ничего не доказывает.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5461
  start: 5461.1
  end: 5474.3
  text: Хм. Это заключительная стадия начала глобальной реальности. Говорит Робин Келли из Mondex. С поддержкой Mastercard ничего не сможет остановить Mondex от установления глобального стандарта.
  rating: orange
  verdict: 'Рекламные обещания стать «мировым стандартом» даёт любая компания. Из них не следует заговор, а обещание не сбылось: мировым стандартом Mondex так и не стал.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5474
  start: 5474.6
  end: 5500.6
  text: 'Следите за смарт-картами. Они используют протоколы SET. Это название выбрано специально. Они скажут: «Это значит безопасная электронная транзакция». Безопасные транзакции. Но они не говорят, что Сет — это египетский бог зла. Сатана. Компания ITMT купила лицензию MonDex USA.'
  rating: red
  verdict: SET — сокращение английского Secure Electronic Transaction, «безопасная электронная сделка», стандарт Visa и MasterCard 1996 года. Совпадение с именем египетского бога ничего не доказывает, как и английское слово set «набор».
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5503
  start: 5503.7
  end: 5527.6
  text: Компания Lucent Technologies раньше называлась Люцифер Траст. Они поменяли название на Lucent, потому что люди знали, кто Люцифер. Ну теперь они не знают, что такое Lucent. Их символ — солнечный змей. Красный круг, как бы покрашенный кисточкой. Lucent Technologies. Посмотрите на ваш IT телефон, и вы увидите.
  rating: red
  verdict: С Люцифером название Lucent не связано. Компания выделилась из AT&T в 1996 году и никогда не называлась «Люцифер Траст». Ховинд путает её с издательством Lucis Trust оккультистки Алисы Бейли, которое в 1920-х недолго носило имя Lucifer Publishing.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5531
  start: 5531.1
  end: 5553.8
  text: Lucent состоит из слов Люцифер Enterprises. У них очень кричащие наименования продукции. Продукция Lucent Technologies носит название как Styx. Река в Аиде, Янус, двухлицый бог. Инферно. Ад. Компания умышленно переехала на 666 Пятую авеню в Манхэттене. Интересно.
  rating: red
  verdict: 'Программы Inferno и Styx у Lucent действительно были: инженеры взяли названия у Данте и из мифов. Но lucent значит «светящийся», а не «Люцифер», штаб-квартира была в Мюррей-Хилле (Нью-Джерси), и номер дома с офисом ничего не говорит о вере компании.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy
  - cherry-picking

- id: lecture-5-5554
  start: 5554.8
  end: 5575.8
  text: Свяжитесь с Терри Куком или Карлом Сандерсом. Карл Сандерс живёт в Пенсаколе. Он помог разработать микрочип. Он путешествует и говорит о микрочипах. Он помог изготовить микрочип. У меня есть два таких чипа в офисе. В такие микрочипы можно поставить собаку или кошку.
  rating: orange
  verdict: Микрочипы для собак и кошек действительно существуют. Но слова лектора, что он «разработал микрочип» для слежки за людьми, никто независимо не подтвердил; такой источник стоит проверять, а не советовать.
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5577
  start: 5577.4
  end: 5595.9
  text: Но вы знаете, что такой чип можно поставить в вашу руку, и за вами можно будет проследить с помощью спутника. Например, если вы пилот и потерялись, чтобы вас можно было найти. Их можно ставить в машины, и если машину украдут, спутник её найдёт в радиусе до полуметра. Правда?
  rating: red
  verdict: 'Вживляемый чип — пассивная метка без батарейки: его читают сканером с нескольких сантиметров, со спутника его увидеть нельзя. Машины ищут по спутнику с помощью GPS-приёмника с питанием и передатчика — это совсем другое устройство.'
  arguments:
  - mark-of-beast-tech
  rhetoric:
  - conspiracy

- id: lecture-5-5597
  start: 5597.5
  end: 5620.0
  text: 10 лет назад было невозможно осуществление пророчества начертания зверя. Сегодня это возможно. Кто бы подумал, что нужно начертание на руке или лбу, чтобы покупать или продавать? Как может один человек контролировать финансы всего мира через компьютер? Интересно.
  rating: purple
  verdict: Мы тоже верим, что пророчества Откровения исполнятся. Но что их исполнение зависит от компьютеров, — толкование одной школы; и каждое поколение с уверенностью находило «начертание» в своей технике, от штрихкода до пластиковой карты.
  arguments:
  - mark-of-beast-tech

- id: lecture-5-5620
  start: 5620.9
  end: 5627.6
  text: Но эти люди составляют планы нового мирового порядка. И они не шутят. Ну, Бог смеётся с этого.
  rating: orange
  verdict: 'С тем, что Бог посмеётся над замыслами нечестивых (Пс 2:4), мы согласны. Но сами «планы нового мирового порядка» Ховинд так и не показал: вместо документов — слухи и фальшивые цитаты.'
  arguments:
  - new-world-order
  rhetoric:
  - conspiracy

- id: lecture-5-5629
  start: 5629.9
  end: 5653.7
  text: И когда вы начинаете беспокоиться… Что случится? Будет ли двухтысячный год концом цивилизации? Я не знаю. Я думаю, это будет конец нашей роскошной жизни на некоторое время. Возвратит нас к реальности, как остальной мир. Вы можете лишиться телефона и электричества. Как, не будет горячей воды? Нет, если вы нагреете спичкой, будет.
  rating: neutral
  verdict: Размышление о том, что принесёт 2000 год, с оговоркой «я не знаю». Такие опасения тогда были частыми; они не сбылись, а к науке об эволюции отношения не имеют.

- id: lecture-5-5655
  start: 5655.9
  end: 5673.7
  text: Мне нравится читать Псалом главу вторую, это утешает. Когда я читаю книги и получаю письма со всей страны о том, что происходит. Вокруг Атланты построены 30 концлагерей. Полностью пустые. Пустые концлагеря. Они ждут чего-то?
  rating: red
  verdict: 'Пустых концлагерей вокруг Атланты никто не нашёл, хотя слух ходит с 1990-х. Письма со всей страны — не доказательство: 30 лагерей спрятать невозможно, их бы давно сняли на видео.'
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-5675
  start: 5675.0
  end: 5695.4
  text: 'Индианаполис, где они должны обивать вагоны поездов Как бы не так. Раньше там были знаки: красная зона, синяя зона, жёлтая зона для мужчин, женщин и детей. Привезти поезд, разгрузить отдельно — точно, как делал Гитлер. Я много видел и читал. Но мы не должны волноваться. Я скажу, что мы должны делать.'
  rating: red
  verdict: Ремонтный завод вагонов под Индианаполисом действительно есть и до сих пор чинит пассажирские вагоны. Слух о подготовке депортаций «как при Гитлере» ходит с 1990-х и так ничем и не подтвердился.
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-5695
  start: 5695.7
  end: 5988.6
  text: 'Псалом два. «Зачем мятутся народы, и племена замышляют тщетное? Восстают цари земли, и князья совещаются вместе против Господа и против Помазанника Его. „Расторгнем узы их, и свергнем с себя оковы их“. Живущий на небесах посмеётся, Господь поругается им». Бог на небе смеётся с людей, замышляющих новый мировой порядок. Бог говорит: «Вы думаете, вы будете править миром? Ха-ха. У меня к вам есть сюрприз». Но в это время они настроены серьёзно, и мы увидим ужасные времена. Библия говорит: «Ибо тогда будет великая скорбь, которой не было от начала мира». Будет скорбь. Иисус сказал: «Сие сказал Я вам, чтобы вы имели во Мне мир. В мире будете иметь скорбь; но мужайтесь: Я победил мир». Скажите мне, христиане, ваш мир на земле или ваш мир во Христе? Большинство американцев имели мир на земле долгое время. Я думаю, мы расстроимся, когда мы потеряем мир на земле. Наш мир должен быть во Христе. «Ибо мы, когда были у вас, предсказывали вам, что будем страдать». «Знай же, что в последние дни наступят времена тяжкие». «Злые же люди и обманщики будут преуспевать во зле». Но потом дьявол будет низвержен. В конце он проигрывает. Он обольстил всю Вселенную, но в настоящее время он сильный враг. Кто может сразиться с ним? Осия сказал: «Истреблён будет народ Мой за недостаток ведения». В Римлянам говорится: «Ибо открывается гнев Божий». Страдание — это что мир делает с нами? Раньше было приспособление. Если я это правильно понимаю, брали большую палку и били ей по пшенице. Люди собирали урожай пшеницы, собирали в кучу и били по ней. Это делали для того, чтобы отделить пшеницу от стеблей. После того, как они побили пшеницу палками, они брали пшеницу, бросали в воздух, и ветер уносил шелуху, и пшеница падала назад. Необходимо отделить пшеницу от шелухи. Но для этого сначала надо побить пшеницу. Нужно пройти страдания, чтобы отделить пшеницу от шелухи. Мы не предназначены для страданий, для гнева, но я думаю, мы увидим тяжёлые времена. Некоторые думают, что мы вознесёмся до страданий, но скажите это китайским и русским христианам, которых убивают сегодня. У меня тоже философия вознесения до страдания. Но я думаю, что наше понятие страдания отличается от Божьего. Наша идея страдания: он стукнул дверью. Библия говорит, что гнев Божий на сынов противления. «Мы спасёмся Им от гнева». Это время для деятельности. Нужно заняться и что-то делать. Что делать? Что происходит и что мы должны делать? Во Второзаконии говорится: «Изберите мужей мудрых, разумных, которые понимают». «Даруй же рабу Твоему сердце разумное, чтобы судить народ Твой и различать, что добро и что зло». «Имя жены его Авигея. Эта женщина была весьма умная и красивое лицо». Ездра сказал: «Приведите людей умных». Пять раз в книге Ездры мы слышим о людях умных. Нам нужны люди, которые знают, что делать. Первая Паралипоменон. «Из сынов Иссахаровых пришли люди разумные, которые знали, что когда надлежало делать Израилю». Америке нужны проповедники, которые понимают, что происходит. И говорят своим людям, что делать. Нам нужны пасторы, которые проповедуют. И говорят: «Я понимаю, что происходит. Вот что вы должны делать». Нам нужны лидеры. Люди разумные. Что делать? Первое. Мы должны понять, что у Бога всё под контролем. Он не волнуется о новом мировом порядке. И он будет спать спокойно. Хотя он не спит. Мы можем спать спокойно. Нам не надо волноваться о новом мировом порядке. Мы должны быть мудрыми, как змеи, и безобидными, как голуби. Мы должны быть осторожными. Не беспокоиться. Не переживать ни о чём.'
  rating: neutral
  verdict: 'Проповедь по Пс 2, Мф 24 и Ин 16:33: Бог царствует, христиане могут пройти через скорби, их мир — во Христе, а не в земном благополучии. С этим мы согласны; о сроках скорби и восхищения Церкви христиане думают по-разному.'

- id: lecture-5-5989
  start: 5989.9
  end: 6010.0
  text: 'Вы скажете: «Они же заводят русские войска». А ну и что? Учите русский. Говорите им о Господе. Молитесь за имеющих власть. Мы дети Бога, повинуйтесь ему. Проповедуйте Евангелие. Это повеление христианам.'
  rating: orange
  verdict: Совет молиться за власти и проповедовать Евангелие хорош, и мы его разделяем. Российские военные бывали в США, например на учениях миротворцев в Канзасе в 1995 году. Но это были совместные учения, а не подготовка захвата.
  arguments:
  - un-takeover
  rhetoric:
  - conspiracy

- id: lecture-5-6011
  start: 6011.2
  end: 6273.1
  text: 'Будьте солью земли. Вы должны сохранять Делайте вашу работу, используйте ваше влияние. Нам нужны праведные государственные чиновники. Многие христиане не хотят выставлять свои кандидатуры. Ободряйте их. Учите правду о сотворении. Есть много работы. Не отвлекайтесь. Мы отвлекаемся домами, машинами, заботами века сего. Вы знаете, какая цель этой игрушки? Вы заводите эту игрушку и ставите её над ребёнком. Чтобы он смотрел на неё. Понимаете? Цель игрушки — отвлечь ребёнка. И Сатана — мастер по отвлечению, по отвлеканию. Средний американец смотрит телевизор 1 539 часов в год. Достаточно, чтобы прочитать Библию 22 раза. Я не говорю, чтобы вы читали Библию целый день. Но вы должны читать. Давид сказал: «Не положу пред очами моими вещи непотребные». Вы смотрите на ненужные вещи? Притчи 28. «Когда страна отступит от закона, тогда много в ней начальников». Вы знаете, почему у нас так много бюрократов? Мы нечестивы. Я думаю, мы заслужили такое руководство в этой стране. И выход не в голосовании. Выход для христиан — преклониться перед алтарём. «Праведность возвышает народ, а беззаконие — бесчестие народов». Во Втором Паралипоменон, 7:14, Господь сказал Соломону: «И смирится народ Мой». Господь не беспокоится, что делают язычники, они язычники. Он беспокоится, что делает его народ. Мы странники в этом мире. Этот мир — не мой дом. У меня есть привычка: каждый раз, когда я принимаю душ, я смотрю на душ и начинаю петь: «Этот мир — не мой дом. Это мимолётная остановка». Я думаю о Гитлере и о евреях, идущих в душевые и вдруг осознающих, что вместо воды выйдет газ и убьёт их. Это моё время для вспоминания. Вам нужно тоже вспоминать и молиться. Он сказал: «И смирится народ Мой». Это мы. «Который именуется именем Моим». Христиане. Это мы. Если вы хотите спасти Америку, вот как. «И смирится народ Мой, который именуется именем Моим, проголосуют за республиканцев, сохранят еду и купят автоматы». Что? Там так не написано. «И смирится народ Мой, который именуется именем Моим, и будут молиться, и взыщут лица Моего, и обратятся от худых путей своих». Бог сказал: «То Я услышу с неба, и прощу грехи их, и исцелю землю их». Единственный выход. Вот здесь. Америка может быть прощена. Если это произойдёт Я не знаю, как здесь, в Пенсильвании, но я бываю везде. И я не вижу этого. Бог спасёт нашу землю, если мы делаем нашу работу. Но мы не делаем нашу работу, и я не думаю, что он спасёт нашу землю. Я думаю, мы получим его наказание. Маленький Давид принёс еду братьям. Старший брат сказал: «Что ты здесь делаешь? И иди назад к овцам». Давид хотел сражаться с Голиафом. Его брат сказал: «Ну да, ты ребёнок. Уходи, иди к овцам». Маленький Давид сказал старшему брату: «Нет ли причины?» Мне нравится это отношение. «Нет ли причины?» Мы должны делать, что правильно, независимо, как велик наш враг.'
  rating: neutral
  verdict: Призыв быть солью земли, не отвлекаться на телевизор и заботы, читать Библию и каяться (2 Пар 7:14), с примером Давида. С призывом мы согласны; цифра о телевизоре близка к опросам тех лет, а прогноз Божьего наказания Америке — личное мнение проповедника.

- id: lecture-5-6274
  start: 6274.0
  end: 6289.1
  text: Какая ваша причина? Я хочу взять сотворение и разрушить дерево эволюции. Вместо веток и листьев аборты, порнография. Срежьте всё дерево с корнями. Это моя причина. Это ваша причина?
  rating: red
  verdict: 'Аборты и порнография — настоящее зло, и мы тоже хотим с ним бороться. Но их корень — грех человеческий, который старше любой научной теории, а не биология: срубив «дерево эволюции», греха не убавишь.'
  arguments:
  - evolution-morality
  rhetoric:
  - loaded-language

- id: lecture-5-6290
  start: 6290.0
  end: 6868.3
  text: 'Вы знаете? Много христиан отвлечены мячом. Вы знаете, что если вы готовы потратить $500, Вы можете купить хорошие клюшки для гольфа. И тогда, если вы готовы тренироваться тысячи и тысячи часов, Ваши руки должны находиться в специальном положении. Этот палец должен показывать на это плечо. Переплетите пальцы. Особенная хватка. Колени полусогнуты, плечи округлены. Клюшка перпендикулярна к мячу. Сначала согните правый локоть, при этом поворачивайте бедро. Если вы тренируетесь тысячи часов, то когда-то вы сможете попасть мячом в ямку в земле. Вы думали об этом? Друзья, мы помешались на спорте. Я не против спорта. Но я говорю вам, что мы отвлечены. И некоторые из вас знают больше о какой-то команде, чем о двенадцати учениках. И некоторые из вас могут найти страницу спорта быстрее, чем книгу «Языки». Правда? Кто любит серебро, тот не насытится серебром. Соломон должен был знать, у него было много серебра. Люди, у которых много денег, вы знаете, чего они хотят? Больше денег. Если у людей много обуви, вы знаете, что они хотят? Больше обуви. Если у людей быстрые машины, вы знаете, что они хотят? Машины ещё быстрее. У моего сына есть мотоцикл «Сузуки Катана» на 600. От нуля до госпиталя. Две секунды. Угадайте, что он хочет? Катану 750. А потом что он захочет? Катану тысячу. И, может быть, потом Катану 1 500. Ну, уже нет таких больших бинтов. Вы не насытитесь. Вещи этого мира не удовлетворят. Вы знаете, что хотят люди с большим домом? Большего дома. Если у людей есть много одежды, что они хотят? Больше одежды. Ничего из мира сего не насытит. Мы должны знать это. Мы должны искать горнего. «О горнем помышляйте, а не о земном». Нужно, чтобы христиане были привязаны к горнему, не к земному. «Не любите мира, ни того, что в мире: кто любит мир, в том нет любви Отчей. Ибо всё, что в мире: похоть плоти, похоть очей и гордость житейская, не есть от Отца, но от мира сего. И мир проходит». И всё, для чего мы работали: это хорошая машина, счёт в банке, земля. Если бы вы знали, что вы потеряете всё это в этом году. Просто представьте, что двухтысячный год будет концом, и вы окажетесь в концлагере через пару месяцев. Что бы вы изменили в своей жизни? Если бы вы были учеником, ходили и стучались в двери, что бы вы говорили людям? «Извините, хотите быть христианином? Вас могут кинуть ко львам, распять вверх ногами. Или вы даже можете быть факелом в саду Нерона». Что бы вы им сказали? Как бы вы говорили с ними? Друзья, христианство ничтожно в этой стране. И китайцы молятся за преследование в Америке. Китайские христиане Потому что они укрепят церковь. Я думаю, нам нужно ждать звука трубы. Библия говорит: «Потому что Сам Господь при возвещении, при гласе Архангела и трубе Божией, сойдёт с неба, и мёртвые во Христе восстанут прежде». Южные баптисты будут первыми, мы следующие. «Потом мы, оставшиеся в живых, вместе с ними восхищены будем на облака в сретение Господу на воздухе, и так всегда с Господом будем». Ждите звука трубы. И спасайте души. Я не вижу ничего более важного. «И мудрый привлекает души». Может, вы слышали о сельском парне, который записался на войну против янков? Он приехал на поле сражения. Достал сумку, ружьё. Пришёл на фронт и сказал: «Докладываю о прибытии, сэр». Сержант сказал: «Мы рады, что ты здесь. Охраняй эту траншею». Он сказал: «Я не приехал охранять. Я приехал сражаться». Но он охранял траншею, и он сильно злился. В конце он не выдержал. Выпрыгнул из траншеи. С криком пробежал нейтральную территорию и прыгнул в окоп янков. Атака одного человека. Янки изумились. Этот деревенский парень схватил янка и сбил его с ног одним ударом. Он был сильным деревенским парнем. Он схватил пленника, выбрался и побежал назад. К своему повстанческому окопу. Он прыгнул в окоп, его окружили и спросили: «Что это такое?» Он сказал: «Это янки». Они сказали: «Где ты его достал?» Он сказал: «Вот там недалеко. Там их ещё целая куча». Он сказал: «Если бы вы хотели, вы достали бы тоже». Иисус придёт и установит свой новый мировой порядок. Мы будем царствовать со Христом тысячу лет. Если вы попадёте на небо сейчас, кто будет с вами? Что вы сделали для Господа? Некоторые из вас — учителя воскресных школ. Некоторые из вас должны прекратить учить. Признайтесь, что вы не готовитесь к уроку. Вы неинтересны, вы скучны. Было время, когда вы любили детей, любили класс, готовились к урокам И вы думали, что дети не могут дождаться следующего раза? Ну, вы потеряли это. Помните, как было, когда вы любили Господа? Когда вы покаялись, не могли остановиться от чтения Библии Вы потеряли это, правда? Многие проповедники должны прекратить проповедовать. Однако многие не знают, как найти настоящую работу. Поэтому президент не уходит из Белого дома: где бы он жил? Хиллари бросит его, это точно. Она может работать с коровами. Друзья, есть много христиан, которые любили Бога. Но они потеряли это. Теперь они любят больше машину, дом, яхту. Компьютер. Неважно. Что-то заменило Иисуса. Правда? Будьте честными. Нам нужно возрождение. Господь установит своё царство. Мы победим. В конце. Он сокрушит сатану под вашими ногами. И он бросит его в бездну. Я плюну в него. И дракона, дьявола, сатану скуёт на тысячу лет. И он не прельщал уже народы. Но дожить до того времени будет не так уж легко. И увидел я души обезглавленных за свидетельство Иисуса. Может произойти здесь. Я надеюсь, что нет, но всё возможно. Приготовьтесь. Жить для Господа. Наступают тяжёлые времена. Я надеюсь, мы вознесёмся до этого. Ну, может, и нет. Служите Господу. Скажите: «Боже, я хочу спасать души». Если вы учитель воскресной школы, водитель автобуса, пастырь, Проверьте ваше сердце. Если у вас горячая любовь, любовь к Иисусу… Если её нет, выйдите. Скажите Богу, что вы её потеряли. И попросите его зажечь в вас огонь. Давайте встанем, помолимся. Небесный отец, мы не знаем, что принесёт будущее. Но мы знаем, что ты знаешь будущее. Мы не знаем, что грядёт. И нам не надо знать. Нам нужно делать, что ты говоришь, Господи. Ты видишь прошлое, настоящее и будущее, и Ты не боишься.'
  rating: neutral
  verdict: 'Проповедь с шутками: христиане отвлечены спортом и вещами, мир не насыщает, нужно ждать гласа трубы, спасать души и просить о возрождении. С призывом мы согласны; о восхищении Церкви до скорби христиане думают по-разному.'

- id: lecture-5-6869
  start: 6869.8
  end: 6880.7
  text: Из-за теории эволюции люди заблуждались уже 6 000 лет. Он говорит им, что они будут как боги. Боже, помоги христианам учить правде.
  rating: orange
  verdict: 'Мы тоже верим, что обман змея «будете как боги» стар как мир. Но теории эволюции немногим больше 150 лет, и она не обещает человеку божества: это научное объяснение, а не слова искусителя в саду.'
  arguments:
  - evolution-religion
  rhetoric:
  - podmena-ponyatij

- id: lecture-5-6882
