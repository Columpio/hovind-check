# Словарь меток: все повторяющиеся доводы и риторические приёмы.
# Метка в claims.yaml должна быть здесь (иначе сборка падает). Статья data/<kind>/<slug>.md необязательна:
# если её нет, на сайте показываются title и summary отсюда и пометка «разбор готовится».
# Источник: resources/markup/taxonomy.md (сгенерировано .tasks/tags/gen.py, дальше правим вручную).
arguments:
- slug: earth-age-billions
  title: Миллиарды лет — выдумка учебников
  summary: Общий тезис, что «миллионы/миллиарды лет» придуманы эволюционистами и навязаны детям, без конкретного научного довода.
- slug: radiometric-dating
  title: Радиоизотопные датировки не работают
  summary: Радиоуглерод и другие методы будто бы дают произвольные или подогнанные результаты, «живого моллюска датировали тысячами лет».
- slug: moon-dust
  title: Мало пыли на Луне
  summary: За миллиарды лет на Луне скопился бы толстый слой пыли, а его нет, значит Луна молода.
- slug: moon-recession
  title: Луна удаляется, значит раньше была слишком близко
  summary: Луна отходит от Земли на сантиметры в год, и при экстраполяции назад она касалась бы Земли, значит миллиардов лет не было.
- slug: earth-rotation-slowing
  title: Вращение Земли замедляется
  summary: Сутки удлиняются (добавляют секунду), и миллиарды лет назад Земля вращалась бы невозможно быстро.
- slug: magnetic-field
  title: Магнитное поле слабеет, инверсий не было
  summary: Магнитное поле Земли быстро убывает, значит Земля молода; «полос перемены полюсов на дне океана нет».
- slug: comets-lose-material
  title: Кометы распадаются, значит Солнечная система молода
  summary: Кометы теряют вещество при каждом обороте и за миллиарды лет исчезли бы.
- slug: sun-shrinking
  title: Солнце сжимается
  summary: Солнце уменьшается (на метры в час), и в прошлом оно касалось бы Земли.
- slug: saturn-rings
  title: Кольца Сатурна молоды
  summary: Кольца Сатурна неустойчивы и не могли сохраниться миллиарды лет.
- slug: speed-of-light-decay
  title: Скорость света уменьшалась
  summary: Скорость света раньше была больше, поэтому свет далёких звёзд мог дойти за тысячи лет.
- slug: ocean-salt
  title: Солёность океана как часы
  summary: Реки приносят в океан соль быстрее, чем она уходит, и при старом океане он был бы солонее.
- slug: young-earth-clocks
  title: «Природные часы» показывают тысячи лет, а не миллиарды
  summary: 'Однотипные доводы «если Земле миллиарды лет, почему X ещё не…?»: давление в нефтяных пластах, дельта Миссисипи, старейшее дерево, Большой Барьерный риф, сталактиты и травертин, эрозия континентов, рост Сахары, мало осадков на дне океана. Вывод всегда «6000 лет и потоп».'
- slug: population-growth
  title: Рост населения доказывает молодость человечества
  summary: При нынешнем темпе роста от 8 человек после потопа получается ~6 млрд за ~4400 лет, а за миллионы лет людей было бы невообразимо много.
- slug: spiral-galaxies
  title: Спиральные галактики «закрутились» бы
  summary: За миллиарды лет спиральные рукава исчезли бы, значит галактики молоды (проблема закручивания).
- slug: sirius-red
  title: Сириус за 2000 лет стал белым карликом
  summary: Древние видели Сириус красным, значит звёздная эволюция идёт за века, а не миллионы лет.
- slug: planets-cooling
  title: Планеты и спутники ещё горячие, значит молоды
  summary: Тепло уходит (чашка кофе остывает), а планеты и спутники Юпитера ещё горячие, значит им не миллиарды лет.
- slug: distant-starlight
  title: Свет далёких звёзд не проблема для 6000 лет
  summary: Расстояния до звёзд «неизвестны» (параллакс не работает, красное смещение не говорит о расстоянии, постоянная Хаббла «не известна»), а свет создан сразу в пути («зрелое творение»).
- slug: polonium-halos
  title: 'Полониевые гало: граниты созданы мгновенно'
  summary: По Р. Джентри, ореолы короткоживущего полония в граните доказывают, что породы созданы мгновенно и «холодными», а Джентри замалчивают.
- slug: big-bang
  title: Большой взрыв — «всё из ничего»
  summary: Карикатурный пересказ Большого взрыва («точка меньше точки», «ничто взорвалось») как самоочевидно абсурдного.
- slug: pervyj-zakon-termodinamiki
  title: 'Первый закон термодинамики: «материю нельзя создать»'
  summary: Раз энергия не возникает из ничего, Вселенная не могла появиться естественным путём.
- slug: second-law
  title: Второй закон термодинамики запрещает эволюцию
  summary: Всё идёт к беспорядку, значит усложнение (жизнь, эволюция, звёзды) самопроизвольно невозможно.
- slug: cosmos-origin-energy
  title: «Откуда взялись материя, энергия, законы?»
  summary: Цепочка вопросов «откуда», на которые наука будто бы не отвечает, и вывод, что эволюция ложна.
- slug: design-complexity
  title: Сложность требует Создателя
  summary: Мир/клетка/глаз слишком сложны, чтобы возникнуть сами, «у картины есть художник», и отсюда делается вывод против эволюции и старой Земли.
- slug: flood-geology-general
  title: Вся геология — следствие потопа (общий тезис)
  summary: Рельеф и слои Земли — видимый след всемирного потопа 4400 лет назад; «без потопа геологию не понять».
- slug: flood-sediments
  title: Все осадочные слои отложились за год потопа
  summary: Вода быстро раскладывает осадок слоями (банка/бочка с грязью, песочная картинка, Сент-Хеленс, приливы по 80 м), значит вся осадочная летопись — один потоп; между слоями «нет эрозии», мел Дувра и диатомит накопились быстро, угловые несогласия — тоже потоп.
- slug: fossil-fuels-flood
  title: Уголь и нефть образовались в потоп
  summary: Весь уголь — допотопные леса, снесённые в плавучие «острова брёвен» (озеро Спирит, уголь в лаборатории за час), вся нефть — погибшие в потоп люди и животные; расщепление пластов «доказывает» их одновременность.
- slug: fossil-graveyards
  title: Кладбища ископаемых — след потопа
  summary: Массовые захоронения (кости динозавров вперемешку, Берниссар, Кару), рыба, глотающая рыбу, свежие листья Кларкии, лес метасеквой в Арктике, расколотые стволы — значит, всех сразу похоронил один потоп.
- slug: hydroplates
  title: Вода потопа была под земной корой («источники бездны»)
  summary: Под 20–30-километровой корой был слой воды (модель гидроплит Уолта Брауна); кора треснула, вода вырвалась через разломы (Сан-Андреас, Нью-Мадрид) и затопила Землю; опора на Пс 23(24):2, 135(136):6.
- slug: ice-meteor-flood
  title: Потоп вызвал ледяной метеор («теория Ховинда»)
  summary: 'Около 4350 лет назад через Солнечную систему прошёл ледяной метеор: оставил кратеры, спутники и кольца планет, каньоны на Марсе; его лёд «притянуло магнитным полем» к полюсам, он расколол кору, разрушил водяную оболочку и мгновенно заморозил мамонтов.'
- slug: mountain-uplift
  title: Горы и океаны образовались в конце потопа
  summary: Эверест и другие горы быстро поднялись, а океанское дно опустилось в конце потопа (Пс 103(104):8, «водяной матрас»); морские раковины на вершинах, складки пород «только в мягком осадке», метаморфизм и тектоника — всё за год потопа.
- slug: flood-runoff
  title: Рельеф вырезана сходящими водами потопа
  summary: Половина Ниагарского ущелья и дельты Миссисипи сделана за минуты спада вод, эрозия в пустынях запада США — от стока потопа; моря заполнились после потопа, шельф — береговая линия времён Ноя, животные дошли до Австралии по суше.
- slug: green-river-varves
  title: Слои Грин-Ривер не годичные
  summary: Тонкие слои формации Грин-Ривер легли быстро (опыты Берто, «соль с перцем»), а разное число слоёв между пепловыми прослойками показывает, что они не годичные.
- slug: no-antediluvian-humans
  title: Почему нет окаменелостей допотопных людей
  summary: 'Ответ на вопрос «где кости и жилища допотопных людей?»: их было мало, они не строили домов, тела съели или унесло водой (пример с бизонами).'
- slug: grand-canyon-flood
  title: Большой каньон прорыт потопом
  summary: Большой каньон образован быстро, при спаде вод потопа, а не рекой Колорадо за миллионы лет.
- slug: niagara-erosion
  title: Ниагарский водопад показывает молодость Земли
  summary: Водопад отступает на ~1,5 м в год, каньон длиной ~12 км, значит ему около 9900 лет.
- slug: fossil-layers
  title: Геологическая колонна — круговое рассуждение
  summary: Слои датируют по окаменелостям, а окаменелости по слоям; колонну «придумал Лайель» и «нигде в мире её нет целиком».
- slug: polystrate-fossils
  title: Деревья сквозь слои
  summary: Окаменевшие стволы проходят через много слоёв, значит слои легли быстро.
- slug: ice-age
  title: Ледниковый период после потопа
  summary: Был один ледниковый период, вызванный потопом, а не многие за сотни тысяч лет.
- slug: mammoths-frozen
  title: Мамонты замёрзли мгновенно
  summary: Мамонтов находят «замороженными стоя, с едой во рту», значит их погубила внезапная катастрофа.
- slug: continental-drift
  title: Дрейф континентов — подгонка, континенты разошлись при потопе
  summary: Реконструкции Пангеи «подогнаны» (Африка уменьшена, нет Центральной Америки), движения плит «не доказано», тектонику придумали ради миллиардов лет; на деле континенты разошлись за месяцы потопа.
- slug: rapid-fossilization
  title: Окаменение быстрое, миллионы лет не нужны
  summary: «окаменевшие» сапог с ногой, шляпа, мелок, водяное колесо, «окаменевший человек» якобы показывают, что учёные неправы о сроках окаменения.
- slug: ice-core-layers
  title: Слои льда не годовые
  summary: 'Годовые слои в ледниковом керне на деле образуются за часы или дни, пример: самолёты, засыпанные льдом в Гренландии.'
- slug: dinosaurs-humans
  title: Динозавры жили вместе с людьми (общий тезис)
  summary: Динозавры сотворены в шестой день, жили с Адамом и были на ковчеге; «миллионы лет» для динозавров — замысел сатаны против Библии.
- slug: dragon-legends
  title: Легенды о драконах — память о динозаврах
  summary: Драконы во всех культурах (мушхуш на воротах Иштар, Вил и дракон, Тараска, дракон Альдрованди, римская мозаика, кракен, «старые словари») — рассказы очевидцев о живых динозаврах; огнедышащие драконы существовали; слово «динозавр» появилось лишь в 1841 году.
- slug: dinosaur-depictions
  title: Древние изображения динозавров (камни Ики, Акамбаро, петроглифы)
  summary: Камни Ики с людьми и динозаврами, фигурки Акамбаро, петроглиф в каньоне Хавасупай, «тысячи изображений» — люди рисовали динозавров с натуры, значит датировки неверны.
- slug: bible-dinosaurs
  title: Бегемот и левиафан — динозавры
  summary: Бегемот из Иов 40 — завропод («хвост как кедр», «верх путей Божиих»), Левиафан из Иов 41 — огнедышащий морской дракон, библейский «единорог» — рогатый динозавр; значит Иов видел динозавров.
  theology: true
- slug: living-dinosaurs
  title: Динозавры живы до сих пор (общий тезис)
  summary: Динозавры не вымерли, «20 000 наблюдений за столетие», «существа в 200 местах»; отсутствие совместных находок ничего не значит.
- slug: lake-monsters
  title: Озёрные чудовища — живые плезиозавры (Несси, Чемп, Огопого)
  summary: 'Лох-Несс, озеро Шамплейн, Оканаган, Стуршён, Эри, Белая река и др.: сотни очевидцев, фото и плёнки («фото хирурга», Динсдейл, Мэнси, Фолден), «все рисунки похожи» — значит в озёрах живут плезиозавры.'
- slug: sea-serpents
  title: Морские змеи — живые морские ящеры
  summary: Морские чудовища моряков (Понтоппидан, «Дедал», U-28, «Валгалла», Кэдборозавр, рыбаки Монтерея и Корнуолла) и история Пенсаколы 1962 года («морской динозавр съел четырёх») — живые плезиозавры; сообщений стало меньше из-за шума двигателей.
- slug: monster-carcasses
  title: Туши «плезиозавров» («Дзуйо-мару» и др.)
  summary: Туша в сетях японского судна «Дзуйо-мару» (1977), туши в Нормандии, Монтерее, Ситуэйте, на острове Блок, «детёныш в желудке кашалота» — тела плезиозавров; вывод учёных «разложившаяся акула» отбрасывается как мнение «гуманистов».
- slug: jungle-dinosaurs
  title: Живые динозавры в джунглях (мокеле-мбембе и др.)
  summary: 'В болоте Ликуала (Конго) живёт завропод мокеле-мбембе, в Анголе — «чипекве», в Кении — «стегозавр» на дороге, Фосетт видел диплодока: туземцы узнают динозавра на картинке, миссионеры и экспедиции подтверждают.'
- slug: living-pterosaurs
  title: Птерозавры живы (конгамато, ропен, «птица грома»)
  summary: Конгамато в Африке, оранг-бати на Сераме, ропен в Папуа — Новой Гвинее, «птица грома» из газеты 1890 года и рисунок Пиаса — живые птерозавры, их опознают по рисунку; линии Наска рассчитаны на людей, летавших на птеродактилях.
- slug: recent-dinosaur-extinction
  title: Динозавры вымерли недавно — после потопа
  summary: Динозавры вымирали уже после потопа, от смены климата (исчез водяной покров) и от охоты людей («рыцари убивали драконов»), ещё 1000 и 500 лет назад; метеорит 65 млн лет назад — «неправильный вопрос».
- slug: dinosaurs-are-lizards
  title: Динозавры — это ящерицы, долго росшие до потопа
  summary: Динозавры — обычные ящерицы, которые росли всю жизнь и в допотопных условиях (водяной покров, долгая жизнь) дорастали до гигантских размеров.
- slug: human-fossils
  title: Человеческие следы и кости в древних слоях
  summary: Следы людей рядом со следами динозавров и человеческие артефакты в «древних» слоях опровергают геологическую шкалу.
- slug: ancient-advanced-civilization
  title: Древние (допотопные) люди были высокоразвиты
  summary: 'Древний человек не был примитивным: пирамиды, Баальбек, Наска, «колумбийский самолёт», Антикитерский механизм, «багдадская батарея», «Адам использовал 100 % мозга» — следы допотопной цивилизации, значит эволюционная картина ложна.'
- slug: ape-men-frauds
  title: Обезьянолюди — подделки и ошибки
  summary: Все ископаемые предки человека — подделки, ошибки или просто обезьяны/люди (Небраска, Пилтдаун, Люси, неандерталец).
- slug: giants
  title: Великаны жили до потопа
  summary: Раньше люди и животные были гигантскими, есть находки гигантских костей.
- slug: soft-tissue
  title: Мягкие ткани в костях динозавров
  summary: В костях динозавров нашли мягкие ткани, клетки, белки, значит кости не могут быть древними.
- slug: transitional-forms
  title: Переходных форм нет
  summary: В палеонтологической летописи нет переходных форм между крупными группами.
- slug: horse-evolution
  title: Эволюция лошади — выдумка
  summary: Ряд предков лошади в учебниках составлен произвольно из разных животных.
- slug: gill-slits
  title: Жаберные щели у эмбриона и рисунки Геккеля
  summary: «жабры» и «хвост» у зародыша человека — ложь учебников, рисунки Геккеля подделаны, значит эмбриология не свидетельствует об эволюции.
- slug: vestigial-organs
  title: Рудиментарных органов нет
  summary: Аппендикс, копчик и др. не бесполезны, значит довод эволюции об остаточных органах ложен.
- slug: peppered-moths
  title: Берёзовая пяденица ничего не доказывает
  summary: Смена окраски бабочек — не эволюция, а фото бабочек на стволах постановочные.
- slug: microevolution-macro
  title: Микроэволюция есть, макроэволюции нет
  summary: Изменения возможны только «внутри рода» (собаки остаются собаками), а превращения одного вида в другой никто не видел.
- slug: mutations-harmful
  title: Мутации только разрушают
  summary: Мутации всегда вредны или теряют информацию и не могут создать новое.
- slug: natural-selection-only-removes
  title: Естественный отбор только отсеивает
  summary: Отбор реален, но лишь убирает брак и ничего не создаёт; «выживание сильнейшего — тавтология».
- slug: common-designer
  title: Сходство говорит об общем Конструкторе, а не об общем предке
  summary: 'Сходство ДНК, белков и строения (кости конечностей человека и кита, кератин) не доказывает родства: это почерк одного Конструктора.'
- slug: origin-of-life
  title: Жизнь не могла возникнуть сама (опыт Миллера)
  summary: Опыт Миллера–Юри ничего не доказал, первичного бульона не было, клетка не могла собраться случайно.
- slug: evolution-religion
  title: Эволюция — это религия
  summary: Эволюция — вера (атеистов, гуманистов, «от сатаны»), которую навязывают за счёт налогов, а не наука.
- slug: scientists-disagree
  title: Учёные сами спорят, значит, эволюции нет
  summary: Эволюционисты сами не могут договориться и придумывают новые теории (вроде «прерывистого равновесия»), значит, твёрдого знания нет — только мнения.
- slug: past-not-observable
  title: Прошлое нельзя наблюдать, значит это не наука
  summary: Происхождение видов и Вселенной никто не видел и не может повторить в опыте, значит это догадки, а не наука.
- slug: evolution-prize
  title: Приз 250 000 долларов за доказательство эволюции
  summary: Никто не смог получить приз Ховинда, значит доказательств эволюции нет.
- slug: science-conspiracy
  title: Учёные скрывают правду
  summary: Учёные и авторы учебников знают, что эволюция ложна, но скрывают находки, увольняют креационистов и сознательно печатают ложь.
- slug: darwin-hitler
  title: Дарвинизм привёл к расизму и нацизму
  summary: Эволюция — основа расизма, Гитлера, Сталина, коммунизма и геноцида (включая «благоприятствуемые расы» Дарвина, Оту Бенгу).
- slug: evolution-morality
  title: Эволюция разрушает мораль
  summary: Если человек — животное, то нет основы для морали; отсюда аборты, школьные расстрелы, преступность.
- slug: evolution-destroys-faith
  title: Эволюция и древняя Земля разрушают веру
  summary: Если христианин или ребёнок примет миллионы лет или эволюцию, он потеряет веру в Библию (история Крофорда Тоя, Кол 2:8).
- slug: vitamin-b17-cancer
  title: Рак — нехватка «витамина B17» (летрил, абрикосовые косточки)
  summary: Амигдалин назван витамином, рак — авитаминозом; «у хунза и диких животных нет рака», лекарство якобы скрывают ради денег.
- slug: darwin-racism
  title: Дарвин и его книга оправдывали расизм и рабство
  summary: «благоприятствуемые расы» в заглавии — расы людей; книга появилась, чтобы оправдать рабство; Дарвин, Гексли, Осборн — расисты и женоненавистники; аборигены как «недостающие звенья», Ота Бенга; расизм происходит от эволюции.
- slug: darwin-communism
  title: Коммунизм построен на эволюции (Маркс, Сталин, Мао)
  summary: Маркс хотел посвятить «Капитал» Дарвину, коммунизм невозможен без эволюции; Сталин стал атеистом от книги Дарвина; Мао любил Дарвина и Гексли; жертвы коммунизма — следствие эволюции.
- slug: new-world-order
  group: politics
  title: «Новый мировой порядок» Сатаны (хаб)
  summary: Нацизм, коммунизм, социализм, ООН, экологи и банкиры — звенья одного сатанинского плана мирового правительства; оно уже близко.
- slug: globalist-elite
  group: politics
  title: Рокфеллеры и «супербогатые» тайно правят миром
  summary: Рокфеллеры управляют медициной, ФРС, ЦРУ, школами; на Бильдерберге благодарят прессу за молчание; финансировали коммунистов в Китае; кризисы создают богачи.
- slug: communist-plan
  group: politics
  title: Коммунисты по плану захватывают Америку
  summary: '«Коммунистические правила революции» (1919) — подлинный план: разложить молодёжь, мягкость к преступникам, спорт, контроль прессы, регистрация оружия; СССР не распался, договоры с ним — ошибка.'
- slug: gun-control
  group: politics
  title: Контроль оружия — путь к тирании
  summary: Все диктаторы разоружали народ; Гитлер «первым зарегистрировал всё оружие»; Рено, Брэди, Клинтон хотят разоружить Америку по Марксу; регистрация ведёт к конфискации.
- slug: media-control
  group: politics
  title: СМИ управляются и прячут правду
  summary: Пресса подчинена заговорщикам; громкие новости — «завеса»; импичмент Клинтона — прикрытие; журналисты признают, что дают «то, что считают нужным».
- slug: federal-reserve
  group: politics
  title: ФРС, долг и налоги — порабощение народа
  summary: ФРС — частный коммунистический банк, который «сдаёт доллары в аренду под проценты»; долг принадлежит банкирам; налоги платить не обязательно; ЦРУ ввозит наркотики.
- slug: public-schools-indoctrination
  group: politics
  title: Госшколы — инструмент гуманистов и коммунистов
  summary: Госшколы — идея Маркса; гуманисты захватили школы; креационистов увольняют и проваливают; грамотность упала; детей учат, что вера в Бога — болезнь; нужно забирать детей.
- slug: rights-from-creator
  group: politics
  title: Права от Творца, а эволюция ведёт к диктатуре
  summary: По эволюции права даёт государство — это демократия, которая всегда становится диктатурой; креационизм даёт неотчуждаемые права и республику; отцы-основатели «ошиблись» со «стремлением к счастью».
- slug: environmentalism-control
  group: politics
  title: Охрана природы — прикрытие для контроля и отмены собственности
  summary: Экологи хотят отменить частную собственность, уничтожить цивилизацию и людей; экопросвещение учит детей, что они помеха; движение похоже на нацистские митинги.
- slug: depopulation-plot
  group: politics
  title: Элиты хотят сократить население до полумиллиарда
  summary: Кусто, Тёрнер, принц Филипп, Скрижали Джорджии — доказательства плана; для этого вирусы, синдром войны в Заливе, запрет ДДТ, биологическая война.
- slug: un-takeover
  group: politics
  title: Войска ООН и концлагеря готовятся к захвату США
  summary: Техника перекрашивается в цвета ООН, иностранные войска учатся арестовывать жителей, советские грузовики и танки на дорогах, пустые концлагеря (Атланта, Нью-Джерси, Индианаполис).
- slug: staged-crises
  group: politics
  title: Кризисы и теракты устраивают нарочно
  summary: Депрессию 1929 г., Карибский кризис, взрыв в Оклахома-Сити, катастрофу TWA 800 устроили власти и элиты, чтобы расширить контроль.
- slug: emergency-powers
  group: politics
  title: Указы о чрезвычайном положении отменят Конституцию
  summary: «война с бедностью» вводит правление указами; граждане с 1933 г. — «враги государства»; ФЕМА по указам конфискует всё; кризис 2000 года — повод.
- slug: masonic-symbols
  group: politics
  title: Масоны — сатанинская религия, их символы и числа повсюду
  summary: Масоны на высших ступенях поклоняются Люциферу; пирамида с глазом и надписи на долларе — их знак; числа 33, 66, 2 февраля — «сатанинские даты».
- slug: mark-of-beast-tech
  group: politics
  title: Микрочипы и электронные деньги — начертание зверя
  summary: Mondex («деньги на правой руке»), протокол SET (бог Сет), Lucent («Lucifer Trust»), вживляемые чипы со спутниковым слежением, датчики на дорогах и камеры — подготовка к начертанию (Откр 13).
- slug: genesis-literal
  title: Шесть буквальных дней, 6000 лет
  summary: Быт 1 — шесть 24-часовых дней, Земле около 6000 лет по родословиям; иное толкование — компромисс с эволюцией.
  theology: true
- slug: death-before-fall
  title: Смерти до грехопадения не было
  summary: Смерть и хищничество вошли в мир только через грех Адама, поэтому миллионы лет смертей до человека противоречат Библии.
  theology: true
- slug: vapor-canopy
  title: 'Допотопный мир: водяной покров, давление, долголетие'
  summary: 'До потопа над Землёй был водяной/ледяной слой: ровный тёплый климат, больше кислорода и давления, поэтому люди жили сотни лет, а животные были крупнее.'
- slug: ark-kinds
  title: В ковчеге поместились все «роды»
  summary: Ной взял не виды, а «роды» (молодых особей, даже динозавров), и из них после потопа быстро произошло всё нынешнее разнообразие.
  theology: true
- slug: ham-curse
  title: Проклятие Хама и расы (чувствительно)
  summary: Рассуждения о потомках Хама/Ханаана и происхождении рас из сыновей Ноя.
  theology: true
- slug: kjv-only
  title: Только Библия короля Якова точна
  summary: Современные переводы искажены, верен только King James (и его аналоги).
  theology: true
- slug: cains-wife
  title: На ком женился Каин
  summary: Дети Адама женились на сёстрах; это было безвредно, пока не накопились «генетические повреждения», а запрет появился позже.
  theology: true
- slug: local-flood
  title: Местный потоп противоречит Библии
  summary: Быт 7:19 якобы исключает местный потоп («зачем тогда ковчег?»), а сторонники этого толкования (Хью Росс) объявлены еретиками.
  theology: true
- slug: flood-legends
  title: Легенды о потопе у многих народов
  summary: Сотни преданий о потопе (китайские, тольтекские и др.) подаются как подтверждение всемирного потопа.
- slug: wyatt-finds
  title: Находки Рона Уайетта подтверждают Библию
  summary: '«археология» Рона Уайетта (Вайетта): объект «ковчег» у Арарата с «заклёпками» и «якорями», колонны Соломона и колёса колесниц в заливе Акаба, Синай = Джабаль-аль-Лоз, скала Хорива, «пепельные» Содом и Гоморра, ковчег Завета под Голгофой.'
- slug: bible-science-foreknowledge
  title: Библия опередила науку
  summary: В Библии будто бы заранее записаны научные открытия (Иов 38:16 — гидротермальные источники, «пути морские», «повесил землю ни на чём»), «наука медленно догоняет Библию».
- slug: deification-lie
  title: Учение Церкви об обожении — обман сатаны
  summary: Учение Католической Церкви о том, что люди становятся «богами», объявлено «обманом дьявола» — тем же, что обещание змея «будете как боги» (Быт 3:5).
  theology: true
- slug: textbooks-poison
  title: 'В учебниках яд: обман, подмешанный к хорошей науке'
  summary: 'Учебники — как крысиная отрава: много хорошей науки и немного «яда», который уничтожает детей; общий тезис без конкретного примера.'
- slug: pyramid-prophecy
  title: Великая пирамида — памятник Господу из Ис 19:19 (пирамидология)
  summary: Пирамида Хеопса — «жертвенник Господу посреди земли Египетской» (Ис 19:19), её могли построить Адам, Енох или Ной; в её размерах зашифровано Евангелие (широкий и узкий путь, 144 000 камней, 153 ступени, 50-й ряд, пустой саркофаг), отсутствующая вершина — Христос, «камень, отвергнутый строителями»; пирамида с глазом на долларе — символ Люцифера и «нового мирового порядка».
  theology: true
rhetoric:
- slug: lozhnaya-dilemma
  title: Ложная дилемма
  summary: Слушателю предлагают два варианта и говорят, что третьего нет, хотя он есть.
- slug: podmena-ponyatij
  title: Подмена понятий
  summary: Слово берут в одном смысле, а выводы делают так, будто оно значит другое (эволюция = Большой взрыв + происхождение жизни; вера = доверие к наблюдению).
- slug: straw-man
  title: Соломенное чучело
  summary: Позицию оппонента пересказывают в карикатурном виде и опровергают карикатуру.
- slug: vysmeivanie-vmesto-dovoda
  title: Высмеивание вместо довода
  summary: Идею выставляют смешной вместо того, чтобы показать, что она неверна.
- slug: appeal-authority-unnamed
  title: Ссылка на неназванных учёных
  summary: «учёные говорят», «в журнале пишут» без имени, года и статьи, так что проверить нельзя.
- slug: quote-mining
  title: Вырванная цитата
  summary: Фразу учёного (часто Дарвина) приводят без контекста так, будто он сам признаёт слабость своей теории.
- slug: textbook-authority
  title: Двойной стандарт к учебникам
  summary: Учебники объявлены ложью, но на них же опираются, когда цифра удобна.
- slug: personal-story
  title: Личная история вместо доказательства
  summary: Рассказ о встрече или случае («профессор в самолёте», «атеист меня спросил») подменяет проверяемые данные.
- slug: self-authority
  title: Собственный авторитет как довод
  summary: «я учёный/преподавал науку 15 лет», «я доктор», «я никогда не проигрывал дебаты» — опыт или статус рассказчика выдаётся за доказательство.
- slug: appeal-to-doubt
  title: Вопросы к залу вместо довода
  summary: Вопросы вроде «кто уже догадался?» создают чувство «мы-то понимаем» и согласие до того, как прозвучал довод.
- slug: argument-by-incredulity
  title: «Не могу представить, значит неверно»
  summary: Удивление или непонимание выдаётся за опровержение.
- slug: cherry-picking
  title: Выборочные данные
  summary: Берут удобную цифру или пример и молчат о данных, которые меняют картину (устаревшие оценки, верхние границы, изменение скорости процесса).
- slug: scale-trick
  title: Манипуляция масштабом и шкалами
  summary: Наглядный образ (шкала длиной в тысячи км, «секунда в год») давит на впечатление и подменяет корректное сравнение.
- slug: loaded-language
  title: Оценочные слова вместо доказательства
  summary: «ложь», «обман», «яд», «пропаганда», «промывание мозгов» задают оценку раньше, чем приведён довод.
- slug: conspiracy
  title: Конспирология
  summary: Связи между событиями объявляются чьим-то тайным замыслом без доказательств (Рокфеллеры, ФРС, масоны, ООН, «новый мировой порядок»).
- slug: ad-hominem-pivot
  title: Переход на личности
  summary: 'Ховинд опровергает тезис через личность оппонента: «он атеист/гуманист/из Беркли/коммунист, значит неправ».'
- slug: false-analogy
  title: Ложная аналогия
  summary: 'Вывод переносят с бытового случая на научный вопрос, хотя случаи по сути не похожи: учебник = «крысиный яд», мутация = перестановка букв, отбор = ОТК на автозаводе, родство = «эволюция» вилок, слои = песочная картинка, поднятие гор = водяной матрас.'
- slug: post-hoc
  title: «После этого — значит вследствие этого»
  summary: 'Совпадение по времени выдаётся за причину: «после 1963 года» (отмена школьной молитвы, эволюция в учебниках) выросли преступность, разводы, аборты, самоубийства, упали оценки.'
- slug: guilt-by-association
  title: Вина по ассоциации
  summary: Идею или оппонентов дискредитируют, ставя в один ряд с Гитлером, Марксом, нацистами (экология ≈ нацистские митинги, школы и налоги ≈ «Манифест», врачи и суд ≈ Гитлер).
- slug: unverified-quote
  title: Непроверяемая цитата
  summary: Известному человеку (Гитлеру, Сталину, Марксу, Клинтон) приписана фраза без источника; по проверке её нет или она апокрифична.
- slug: many-witnesses
  title: Число свидетелей вместо доказательства
  summary: «11 000 человек видели Несси», «тысячи очевидцев» — число рассказов подаётся как доказательство вместо останков или проверяемых данных.
- slug: burden-shift
  title: Перекладывание бремени доказательства
  summary: Ховинд выдвигает утверждение («облака Оорта не существует») и требует, чтобы его опровергал оппонент.
